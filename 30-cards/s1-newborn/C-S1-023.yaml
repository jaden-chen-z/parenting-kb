front:
  title: 拥抱疗法 = 5S 同时上
  hook: 不是单点,是组合拳

back:
  why_matters: |
    拥抱疗法(Cuddle Cure)= Karp 把 5S 五招同时实施的"全功率版本"。
    对崩溃哭闹宝宝(尖叫不止 / 5S 单招试过没用)几分钟内见效。
    做法:先包裹好 → 抱到肩侧位 → 同时嘘声 + 摇晃 + 给吸吮。
    关键是 5 招同步、力度足够、姿势正确。
    Karp 临床观察:这是 5S 的"高阶组合",对最难安抚的宝宝有效。
  what_to_do:
    - 步骤:先包裹好 → 抱到肩侧位 → 同时嘘+摇+给吸
    - 一手撑头颈,身体接近水平贴妈妈胸口
    - 嘘声紧贴耳朵 5-10cm
    - 见效后慢慢减弱所有动作,但别立刻撤
  failure_mode: |
    一招一招试 → 每招都不到位,以为"5S 没用"。
    见效就立刻撤所有动作 → 立即反弹。
  evidence_level: B


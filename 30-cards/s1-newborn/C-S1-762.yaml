card_id: C-S1-762
stages: [S1]
tags: [breastfeeding, attachment, matsuda]

front:
  title: "母乳不只填肚子"
  hook: "脸贴脸的纽带"

back:
  why_matters: |
    松田 第二节明确反对"营养主义"喂奶：
    母乳是连接母婴的纽带 — 在最近距离看孩子的脸、
    抚摸肌肤、读他高兴 / 不高兴 / 身体状况。
    "用枕头支着奶瓶让孩子吃" = 非人类喂奶方法。
    跟 Brazelton "burst-pause 喂奶不只填肚子"一致 +
    跟 RIE "授乳是母婴互动时刻"一致。
    哪怕奶不够要补奶粉，姿势也要抱着喂。

  what_to_do:
    - 不论母乳奶粉，都抱着面对面喂
    - 不用枕头支奶瓶 / 不躺着喂奶粉
    - 喂奶时关电视手机，专心看孩子
    - 注意宝宝吃饱信号(burst-pause)
    - 奶不够时混合喂也要保持姿势

  failure_mode: |
    产院定时喂奶 + 枕头支奶瓶让妈妈以为这就是常规 — 回家继续用就毁了。
    "营养够就行" → 母婴互动减少 → 宝宝学吃饭不学读人脸。
    现代版本 = 一边刷手机一边喂奶 / 让保姆喂全程 / 用电动摇椅代抱 —
    都是"非人类喂奶"的现代变种。

  evidence_level: B


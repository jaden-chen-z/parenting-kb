card_id: C-S1-024
stages: [S1]
tags: []

front:
  title: 5S 力度要匹配哭闹烈度
  hook: 越凶越用力,不是越温柔

back:
  why_matters: |
    Karp 反复强调:宝宝哭得越凶,5S 五招力度都要越大——
    包得越紧、嘘声越大、摇得越快。
    "温柔哄"是父母最常见的误区,达不到激活镇静反射的强度。
  what_to_do:
    - 哭得"撕心裂肺"时,不降低力度,反而加大
    - 嘘声 ≥ 哭声音量
    - 摇晃保持 30-60cm 振幅 + 每秒 2-3 次
    - 见效后再"换慢舞节奏",慢慢降下来
  failure_mode: |
    把"温柔=好"投射到新生儿 → 力度不够,父母自责"5S 没用"。
    哭得猛吓得不敢用力 → 错过激活反射的窗口。
  evidence_level: B


card_id: C-S1-038
stages: [S1]
tags: [safety]

front:
  title: 包裹只是安抚,不防 SIDS
  hook: AAP 直说:包了也不降 SIDS 风险

back:
  why_matters: |
    包裹(swaddle)= 用薄布把宝宝紧裹成蚕蛹状,模拟子宫感,帮助安抚 + 延长睡眠。
    SIDS = 1 岁内婴儿无明显原因猝死,美国每年约 3500 例,是新生儿主要死因之一。
    很多人以为"包紧能防 SIDS"。AAP 直接说:不能。
    真正风险在 3-4 月会翻身后还包 → 翻成趴卧 → 窒息致死。
    髋部还得松松的(蛙腿位),包太紧会得 DDH。
  what_to_do:
    - 包了仰睡(包 + 趴更危险,会窒息)
    - 髋部松,腿能像青蛙那样自然张开
    - 胸口能塞 2-3 根手指 = 松紧合格
    - 试图翻身立刻停包(常 3-4 月,可能更早)
    - 不用加重的包裹 / 米袋 / 沙袋
  failure_mode: |
    髋裹太紧 → 得 DDH(髋关节终身问题)。
    会翻身了还包 → 翻成趴卧 → 窒息致死。
  evidence_level: A


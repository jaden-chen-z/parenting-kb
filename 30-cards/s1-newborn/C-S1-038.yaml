card_id: C-S1-038
stages: [S1]
tags: [safety]

front:
  title: 包裹只是安抚,不防 SIDS
  hook: AAP 直说:包了也不降 SIDS 风险

back:
  why_matters: |
    包裹(swaddle)= 用薄布把宝宝紧裹成蚕蛹状,模拟子宫感,帮助安抚 + 延长睡眠。
    SIDS = 1 岁内婴儿无明显原因猝死,美国每年约 3500 例,是新生儿主要死因之一。
    很多人以为"包紧能防 SIDS"。AAP 直接说:不能。
    真正风险在 3-4 月会翻身后还包 → 翻成趴卧 → 窒息致死。
    髋部还得松松的(蛙腿位),包太紧会得 DDH。
  what_to_do:
    - 包了仰睡(包 + 趴更危险,会窒息)
    - 髋部松,腿能像青蛙那样自然张开
    - 胸口能塞 2-3 根手指 = 松紧合格
    - 试图翻身立刻停包(常 3-4 月,可能更早)
    - 不用加重的包裹 / 米袋 / 沙袋
  failure_mode: |
    髋裹太紧 → 得 DDH(髋关节终身问题)。
    会翻身了还包 → 翻成趴卧 → 窒息致死。
  evidence_level: A

  positions:
    issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
    views:
      - school: Karp
        source: SRC-003
        stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
      - school: AAP
        source: SRC-004
        stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
      - school: 鲍秀兰
        source: SRC-009
        stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
      - school: 海蒂
        source: SRC-040
        stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

card_id: C-S1-353
stages: [S1]
tags: [communication, daily-care, RIE, lansbury]

front:
  title: "尿布换 = 连接仪式不是脏活"
  hook: "慢下来,是亲密时刻"

back:
  why_matters: |
    Lansbury Ch4 的核心命题:
    每天 6-10 次尿布换,不是要"赶紧搞定"的脏活,
    而是 0-2 岁里最频繁的一对一专注互动机会。
    Pikler 研究所观察:慢、解说、邀请参与的换尿布,
    宝宝不抗拒还期待。Lansbury 引用 Pikler 视频:
    "现在我抬起你的腿。我把尿布塞到你下面。"
    宝宝听完每句有 1-2 秒消化时间。

  what_to_do:
    - 换前先打招呼:"该看看尿布了"
    - 大动作前预告:"我要抬腿了"
    - 等 1-2 秒让宝宝预期 + 配合
    - 邀请参与:"伸手穿袖子" / "扶尿布"
    - 不分散注意力(不挂铃铛 / 给手机看)

  failure_mode: |
    "趁宝宝看天花板赶紧换好" → 宝宝学到"我无关紧要"。
    或边换边吐槽"哎呀好臭" → 宝宝学到自己是麻烦。
    Pikler 说:换尿布是"亲密的双向对话"。

  evidence_level: B


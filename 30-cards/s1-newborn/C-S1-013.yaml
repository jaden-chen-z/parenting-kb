card_id: C-S1-013
stages: [S1]
tags: []

front:
  title: 包裹必须紧 + 双臂在内
  hook: 松散 = 没包

back:
  why_matters: |
    包裹本身止不了哭,但是 5S 的基石——它锁住手臂,
    让宝宝不会被自己的莫罗反射(惊跳)干扰其他 4 招。
    松散等于没包,他一挣就破功。
  what_to_do:
    - 双臂垂直贴身侧,不弯肘
    - 用大方巾,每一步都拉紧再压下一步
    - 髋部和膝盖留弯曲空间(防髋发育不良)
    - 用到 4 个月或宝宝开始翻身就停
  failure_mode: |
    上松下紧或包成"卷饼" → 一挣就开。
    髋部包太直 → 增加髋发育不良风险(Karp 没充分提)。
  evidence_level: B


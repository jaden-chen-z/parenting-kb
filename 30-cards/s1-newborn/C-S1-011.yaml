card_id: C-S1-011
stages: [S1]
tags: []

front:
  title: 胀气不是哭闹元凶,别狂拍嗝
  hook: 拍嗝救不了哭

back:
  why_matters: |
    1954 年 Illingworth 用 X 光对比腹绞痛宝宝和平和宝宝的肠部——
    气体含量没差异。多项研究也证明打嗝药水(二甲基硅油)效果
    和白水一样。哭闹的原因不是肚子胀气。
  what_to_do:
    - 喂奶时让宝宝半坐位,不平躺(少吞气)
    - 中途停一次,打 1-2 次嗝就够,不必拍 30 分钟
    - 母乳建立期不要急着换"防胀气奶粉"
    - 哭起来先排查别的(困/过度刺激/温度),再上 5S
  failure_mode: |
    一哭就归因"肯定胀气" → 拍 30 分钟,错过 5S 窗口。
    频繁换奶粉 / 喂打嗝药水 → 浪费钱,影响母乳建立。
  evidence_level: B


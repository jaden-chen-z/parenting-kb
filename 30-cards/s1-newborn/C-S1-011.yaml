card_id: C-S1-011
stages: [S1]
tags: [controversy]

front:
  title: 胀气不是哭闹元凶,别狂拍嗝
  hook: 拍嗝救不了哭

back:
  why_matters: |
    "胀气导致哭闹"是几千年来父母 + 老一辈最坚信的解释。
    但 1954 年 Illingworth 发表的 X 光研究证伪:
    腹绞痛宝宝和平和宝宝的肠部气体含量**没差异**。
    后续多项 RCT 也证明二甲基硅油打嗝药水效果**等同安慰剂**。
    哭闹的真正原因不是胀气
    (可能是第四产程缺失 / 肠绞痛 / 食物过敏 / 神经发育)。
  what_to_do:
    - 喂奶时让宝宝半坐位,不平躺(少吞气)
    - 中途停一次,打 1-2 次嗝就够,不必拍 30 分钟
    - 母乳建立期不要急着换"防胀气奶粉"
    - 哭起来先排查别的(困/过度刺激/温度),再上 5S
  failure_mode: |
    一哭就归因"肯定胀气" → 拍 30 分钟,错过 5S 窗口。
    频繁换奶粉 / 喂打嗝药水 → 浪费钱,影响母乳建立。
  evidence_level: B


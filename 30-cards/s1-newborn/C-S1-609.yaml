card_id: C-S1-609
stages: [S1]
tags: [weight, anti-standard, individual-difference]

front:
  title: 反"标准体重"焦虑
  hook: 出生体重幅度本来就大

back:
  why_matters: |
    松田直击:"出生 2 周该多重?"问题本身就错。
    出生体重幅度大 — 4 kg 不一定结实,3 kg 不一定弱。
    每日喝奶量,健康娃也各不同。
    把娃按"标准曲线"分等级,是战前征兵把人分甲乙丙丁的思想 — 已过时。
  what_to_do:
    - 别跟同月龄/同小区娃比体重
    - 看自家娃体重曲线走势,不是绝对值
    - 半月时与出院比 + 夜哭多 → 才考虑加奶
    - 食量小娃不强行加奶
    - 一侧乳房吃完就睡也正常
  failure_mode: |
    妈被儿保医生"曲线偏低"一句话压垮 → 焦虑加奶,娃反而厌奶,陷恶性循环。
  evidence_level: B


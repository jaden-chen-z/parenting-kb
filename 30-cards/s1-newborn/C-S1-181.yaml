card_id: C-S1-181
stages: [S1]
tags: [development_burst, controversy]

front:
  title: 5 周第一跃迁:感觉世界
  hook: 5 周突然狂黏不是奶不够

back:
  why_matters: |
    新生儿前 4 周像还在子宫的延续 — 感官信号模糊、混在一起。
    第 5 周(有时早到第 4 周)出现第一个大脑跃迁:**感觉世界**(World of Changing Sensations)。
    怎么回事:宝宝大脑突然能更精细地处理感官信号 — 视觉清晰度提升、听觉对方向更敏感、触觉/温觉/嗅觉同时升级。
    新生儿被这"突然变高清"的世界吓到,行为表现:
    - 突然狂哭(哭量比前几周多很多)
    - 突然只要妈妈,放下就哭
    - 拒绝睡婴儿床,要妈妈抱着或贴胸睡
    - 频繁要奶(不是奶不够,是要安全感)
    家长意义:**5 周突然狂黏狂哭 = 第一跃迁,不是奶不够**。中国新妈妈最常因此误判去换奶粉/加奶粉。
  what_to_do:
    - 第 4-5 周出现 3 C 信号 → 第一跃迁来了
    - 烦躁 阶段 短(几天到 1 周),撑过去就好
    - 多抱 + 按需哺乳,不要按表硬喂
    - 用襁褓 / 背带 / 5S 法(C-S1-001..005)安抚
    - 不必加奶粉(看尿量 / 体重正常即可)
  failure_mode: |
    "频繁要奶 = 奶不够" → 加奶粉 → 母乳供应反受影响。
    "睡眠突然变差" → 找睡眠咨询 → 跃迁完成自然恢复。
    "宝宝是不是病了" → 反复就医 → 焦虑加剧。
  evidence_level: B


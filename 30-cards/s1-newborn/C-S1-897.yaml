card_id: C-S1-897
stages: [S1]
tags: [pikler, mother-child-bond, source-de]

front:
  title: "母婴关系是动作基础"
  hook: "没安全感动作发不出来"

back:
  why_matters: |
    皮克勒 1969 第 4 章反驳一个误读 — 有人以为皮克勒
    "不教不抱不干预" = 妈妈应该完全**冷淡**。

    皮克勒立场用一个比喻表达:爱 + 关心要像**"恒温的温水浴"** — 持续包围孩子,
    但不是过度刺激。

    没爱没安全感的婴儿 → **对自己动作和世界都没兴趣** → 大动作发展也会出问题。

    这个立场跟鲍尔比依恋(SRC-011)+ 安斯沃斯敏感回应(SRC-023)同代欧洲共识。
    皮克勒是大动作 + 依恋双线推动者。

  what_to_do:
    - '"恒温温水浴"中道:不冷淡 + 不过度逗'
    - 护理时全注意(换尿布 / 喂 / 洗 = 连接时刻)
    - 玩时观察,不替做(给空间)
    - 看着他眼睛说话(简单 + 温柔)
    - 让他知道你在 — 不一定抱着,声音 / 在场就够

  failure_mode: |
    "皮克勒就是不抱不哄?" → 误读。皮克勒不"逗刺激",但要"持续在场 + 温暖关怀"。
    罗齐研究所采用一对一护理制,每个婴儿都有专属护理 + 全注意 — 不是冷漠机构。

  evidence_level: B


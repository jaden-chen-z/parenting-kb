card_id: C-S1-407
stages: [S1]
tags: [communication, language]

front:
  title: "用真声音说话"
  hook: "嘎嘎嘎是大人编的"

back:
  why_matters: |
    Magda 在 Ch3 直接拒"baby talk":
    嘎嘎嘎不是宝宝的语言,是大人编出来的。
    宝宝大脑 0-12 月在搭建语言神经回路 —
    真声音的真句子 = 高质量营养;
    嘎嘎嘎的虚假音调 = 营养稀薄 + 不真实。
    Hutten­locher(芝大)研究:听到的真词数量 = 后期语言发展指标。
    Davies C-S2-127 "真词不嘎嘎"同源,Magda 1998 早讲。

  what_to_do:
    - 跟宝宝说话用平时跟朋友的语气和句子
    - 不学动画片"小宝宝乖乖"嗲音
    - 用完整句子:"妈妈现在去厨房了"
    - 解释你在做什么:"我在切菜,等会喂你"
    - 听到他咕咕也回应:"嗯?是吗?"

  failure_mode: |
    "宝宝那么小,普通话他听不懂要嗲嗲说" → 实际反着 — 嗲音拖慢语言学习。
    Magda 原话:"为什么对自己孩子要伪装?"

  evidence_level: B


card_id: C-S1-012
stages: [S1]
tags: [philosophy]

front:
  title: 妈妈焦虑不会让宝宝更哭闹
  hook: 他读不懂你的心思

back:
  why_matters: |
    很多妈妈自责"我焦虑害得宝宝哭得更凶"——
    这是母婴店、长辈、传统文化最爱说的话。
    Karp 在第 4 章明确反驳:出生头几个月,宝宝根本感受不到妈妈的焦虑。
    "婴儿只是婴儿,可不是生下来就会读心术的。"
    宝宝手颤、下颌抖动是神经发育不完全的正常现象,
    3 月后自动消失,与妈妈情绪无关。
  what_to_do:
    - 别因为情绪低落就觉得"我让宝宝哭得更凶"
    - 焦虑会间接影响下奶/耐心 → 找原因(吃饱/休息/求助)
    - 家人说"你太紧张影响宝宝" — 可以反驳:婴儿读不懂
    - 累到极限就求助,不要硬撑
  failure_mode: |
    把宝宝哭归因"我太焦虑" → 自责加重,陷恶性循环。
    强迫"假装平静" → 错过休息和求助的机会。
  evidence_level: C


card_id: C-S1-025
stages: [S1]
tags: []

front:
  title: 5S 头几次可能更哭,别放弃
  hook: 给他几秒适应时间

back:
  why_matters: |
    Karp 说:首次用 5S,宝宝可能没立刻平静,甚至哭得更凶。
    三个原因:大脑切注意力慢 / 反射延迟 / 神经系统"余震"。
    重复 5-10 次"哭→平静"循环才会彻底稳定。
  what_to_do:
    - 试 5S 后没立刻好转,别立刻判定"没用"
    - 持续 5-10 个"哭闹→平静"循环,他会逐渐稳定
    - 像钓鱼:鱼挣扎是正常的,继续耐心
    - 见效后维持 1-2 分钟,别立刻放手
  failure_mode: |
    试一两次没用就放弃 → 错过反射的入口期。
    "余震"阶段以为"没救了" → 错过几分钟后的平静。
  evidence_level: B


card_id: C-S1-086
stages: [S1]
tags: [philosophy]

front:
  title: 退步是前进的预告
  hook: 崩溃前总有规律

back:
  why_matters: |
    触摸点 流派的核心总论。Brazelton 在 Children's Hospital 几十年观察发现:每次孩子在某个发展线(运动/认知/情绪/语言)出现重大跃进之前,会先有一段可预测的"行为崩盘期"——退步、易怒、夜醒频繁。
    父母此时最易焦虑,把退步当问题。但研究证实,这是大脑在重组(如学步前轻睡眠期增加,是大脑在记录步态序列)。
    把退步看作触点而非麻烦,能让父母停止控制斗争,转而做发展的盟友。
  what_to_do:
    - 列出每条发展线的可预测退步窗口
    - 退步出现时先排除疾病再观察 1-2 周
    - 用"重组前的解构"语言向自己解释
    - 不在退步窗口启动新规矩或断奶
    - 提前告诉照护者退步会来
  failure_mode: |
    把退步当成倒退或问题行为去纠正,强行管教加剧退步并把它"锁定"成习惯。
    父母失去信心,孩子失去探索新台阶的能量,触点变成创伤而非窗口。
  evidence_level: A


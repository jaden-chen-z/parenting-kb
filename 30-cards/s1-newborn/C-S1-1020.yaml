front:
  title: "BFHI 第 5 步衔乳支持"
  hook: "衔乳难是技术不是天赋"

back:
  why_matters: |
    BFHI 第 5 步 原文:'Support mothers to initiate and maintain breastfeeding and manage common difficulties.'
    母乳建立期(0-4 周)常见困难 + WHO 立场:
    ① 衔乳浅(shallow latch)→ 调整体位(交叉摇篮 / 橄榄球)
    ② 乳头疼/破→ 衔乳深 + 涂母乳风干
    ③ 涨奶(engorgement)→ 频繁吸 + 反向按压
    ④ 乳腺管堵塞/乳腺炎→ 频繁吸 + 热敷 + 找医生
    ⑤ 奶量焦虑→ 看 4 客观指标(C-S2-1045)
    解决路径:护士 / 哺乳顾问 / IBCLC / 母乳支持小组。
    中国通病:出现困难 → '没奶就加配方' → 母乳量真降。
  what_to_do:
    - "出现困难第一时间找哺乳顾问(IBCLC)"
    - "衔乳痛 → 调整体位,不是停喂"
    - "涨奶 → 频繁吸 + 反向按压(不挤一干二净)"
    - "乳腺炎 → 继续吸 + 热敷 + 找医生(可继续喂)"
    - "妇幼保健所有母乳门诊 — 出院 1 周复诊"
  failure_mode: |
    出现困难就停母乳加配方 → 跟 BFHI 第 5 步立场冲突 → 母乳建立失败。
    衔乳难不是天赋,是技术,可学可改。
  evidence_level: A


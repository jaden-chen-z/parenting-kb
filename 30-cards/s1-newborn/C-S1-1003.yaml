card_id: C-S1-1003
stages: [S1]
tags: []

front:
  title: "只医学指征用配方"
  hook: "默认不给,这是底线"

back:
  why_matters: |
    BFHI(爱婴医院)第 6 步白话翻译:
    > 除非有医学指征,**不给纯母乳新生儿任何母乳之外的食物或液体**。

    默认配置:0-4 周纯母乳,不给配方 / 葡萄糖水 / 茶水 / 中药水 / 米汤。

    可接受医学例外(WHO/UNICEF 2009《可接受医学原因》):
    - **婴儿端**:半乳糖血症 / 苯丙酮尿症(PKU) / 极低出生体重 / 严重早产 / 严重高胆红素血症
    - **母亲端**:HIV+(高资源国家 + AFASS 成立) / 严重疾病 / 化疗 / 放射性药物 / 1 型疱疹乳房病灶

    中国产院常规给葡萄糖水 / 米粉糊 → 跟 BFHI 第 6 步对立。
  what_to_do:
    - "0-4 周原则:只母乳,不给任何其他液体/固体"
    - "葡萄糖水 / 中药水 / 米汤 → BFHI 不允许"
    - "看到产院给非医学指征配方 → 拒绝"
    - "真有医学指征(早产 / 严重黄疸)→ 听医生"
    - "可接受医学例外清单见 WHO/UNICEF 2009 文件"
  failure_mode: |
    默认接受产院 '助消化葡萄糖水' / '没奶先用配方过渡' → 干扰母乳建立 + 乳头混淆。
    默认是不给,医学指征才例外。
  evidence_level: A


card_id: C-S1-031
stages: [S1]
tags: [safety, red_flag]

front:
  title: 哭闹的 10 个红旗信号(送医)
  hook: 这些不是肠绞痛,是病

back:
  why_matters: |
    绝大多数哭闹都是正常,但 Karp 列了 10 种红旗必须立即就医:
    发烧 / 无精打采 / 喷射呕吐 / 血便 / 呼吸困难 / 前囟鼓起。
    建议父母手机收藏一张表。
  what_to_do:
    - 直肠温度 > 39°C 或 < 36.5°C → 急诊
    - 呕吐物绿色/黄色 + 持续不停 → 急诊
    - 前囟鼓起 + 嗜睡 → 急诊(脑膜炎警报)
    - 2-3 天没排便 → 联系医生(便秘 vs 巨结肠)
    - 体重每天增长 < 14 克 → 哺乳问题就医
  failure_mode: |
    把红旗当"普通哭闹用 5S 就好" → 延误重病诊断。
    退烧后觉得没事 → 漏掉脑膜炎/败血症初期。
  evidence_level: A


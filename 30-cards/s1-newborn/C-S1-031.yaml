card_id: C-S1-031
stages: [S1]
tags: [safety, red_flag]

front:
  title: 哭闹的 10 个红旗信号(送医)
  hook: 这些不是肠绞痛,是病

back:
  why_matters: |
    红旗信号 = 婴儿哭闹背后可能藏重病的特定症状清单。
    约 99% 的哭闹是正常发育(肠绞痛 / 第四产程缺失 / 普通需求),
    只有约 1% 背后是疾病——但漏诊代价大(脑膜炎 / 败血症 /
    先天巨结肠 / 肠梗阻 / 严重感染等)。
    Karp 在附录 A 列了 10 种红旗,符合任意一项**立即就医**。
    这是 Karp 33 张卡里最不能掉以轻心的一张,建议父母手机收藏。
  what_to_do:
    - 直肠温度 > 39°C 或 < 36.5°C → 急诊
    - 呕吐物绿色/黄色 + 持续不停 → 急诊
    - 前囟鼓起 + 嗜睡 → 急诊(脑膜炎警报)
    - 2-3 天没排便 → 联系医生(便秘 vs 巨结肠)
    - 体重每天增长 < 14 克 → 哺乳问题就医
  failure_mode: |
    把红旗当"普通哭闹用 5S 就好" → 延误重病诊断。
    退烧后觉得没事 → 漏掉脑膜炎/败血症初期。
  evidence_level: A


card_id: C-S1-1006
stages: [S1]
tags: []

front:
  title: "早期奶瓶慎用"
  hook: "母乳建立期是 0-4 周"

back:
  why_matters: |
    BFHI 第 9 步白话翻译:
    > 跟妈妈讲清楚奶瓶、奶嘴头、安抚奶嘴的用法和风险。

    母乳建立期(0-4 周):奶嘴 / 奶瓶 → **乳头混淆** + 干扰乳头吸吮模式。

    AAP / 卡普(SRC-005)立场:母乳建立后 3-4 周再用 — 比 BFHI 略松。
    WHO BFHI 立场更严:能避就避 + 一定要用就告知风险。

    松田 SRC-024 C-S1-761 跟 BFHI 一致:反产院"用枕头支奶瓶"。
  what_to_do:
    - "母乳建立 0-4 周尽量不用奶嘴 / 奶瓶"
    - "妈妈不在 → 用杯子 / 勺(勺喂)"
    - "4 周后母乳稳定再考虑奶嘴"
    - "卡普推 3-4 周用奶嘴 — 立场略松"
    - "用奶瓶 → 选'节奏性瓶喂'(paced bottle feeding,模仿母乳吸吮节奏)"
  failure_mode: |
    0-4 周用奶嘴 / 奶瓶 → 乳头混淆 → 母乳吸吮模式损坏 + 妈妈奶量减少。
    0-4 周是母乳建立关键期,慎之又慎。
  evidence_level: A

  positions:
    issue: 0-4 周新生儿能否用奶嘴 — BFHI 严 vs Karp/AAP 宽
    views:
      - school: BFHI / WHO
        source: SRC-031
        stance: 0-4 周尽量避免奶嘴 — 防 nipple confusion;若需安抚用杯 / 勺 / 注射器替代。
      - school: Karp
        source: SRC-005
        stance: 母乳建立后 3-4 周可用奶嘴 — 防 SIDS 视角占优,母乳建立期过后即可。
      - school: AAP
        source: SRC-006
        stance: 3-4 周后可用 — 跟 Karp 立场一致,以 SIDS 防护因子为主要考量。
      - school: 折中
        stance: 0-4 周尽量避免(WHO);需要安抚优先用杯 / 勺;4 周母乳稳定后可考虑奶嘴(Karp/AAP)。

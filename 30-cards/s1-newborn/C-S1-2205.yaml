card_id: C-S1-2205
stages: [S1]
tags: [care, controversy, sleep]
front:
  title: 包裹要不要做
  hook: 看孩子定喜欢就包
back:
  why_matters: |
    育儿圈两派 — 包裹党(像子宫一样安心)vs 解放派(束缚不舒服)。
    海蒂避开教条,给出个体化原则:舒适就包,不舒服就不包,看宝宝反应。
    包裹的好处:体温调节(出生头几天体温调节系统不完善)、避免自己惊跳吵醒自己、对哭闹宝宝有效。
    研究显示:仰睡时包裹可减少 SIDS,但只要不过热、不让翻身的宝宝包裹睡。
    宝宝会翻身后(约 4 个月),包裹反而危险 — 踢开毯子可能窒息,这时必须停止。
  what_to_do:
    - 第一周可试喜欢就包不喜欢就停
    - 一定仰睡 + 房间不过热(避免捂)
    - 手可以在外面不一定要全裹住
    - 宝宝开始会翻身就立刻停止
    - 包后看宝宝表情烦躁/挣扎=不喜欢
  failure_mode: |
    会翻身的宝宝还包裹睡 → 踢开毯子盖脸窒息 / 翻身被裹住无法回正。
    包得过紧 + 过热房间 → 体温调节出问题。
  evidence_level: B
  positions:
    issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
    views:
      - school: Karp
        source: SRC-003
        stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
      - school: AAP
        source: SRC-004
        stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
      - school: 鲍秀兰
        source: SRC-009
        stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
      - school: 海蒂
        source: SRC-040
        stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

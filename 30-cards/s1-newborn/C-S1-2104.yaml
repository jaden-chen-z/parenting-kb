card_id: C-S1-2104
stages: [S1]
tags: [philosophy]

front:
  title: 决定不喂母乳:别内疚
  hook: 配方奶宝宝也健康

back:
  why_matters: |
    母乳/配方决策的最大隐藏代价:做配方妈妈的"罪疚感"。
    海蒂明确说:如果母乳让你不快乐,深情递上的奶瓶比勉强递上的乳房好 — 宝宝能感觉到妈妈的不安。
    无数健康宝宝是配方喂养长大的;现代配方奶营养足够支撑 0-12 月。
    配方妈妈不必每次喂奶都说"对不起"或刻意低调。决定后就坚持,别在两种间反复纠结。
    这是"心理负担成本" 议题,不是"营养"议题 — 别让"不母乳就失败"的话术绑架。
  what_to_do:
    - 决定后坚定:不再纠结"是不是该再试母乳"
    - 用奶瓶喂时 = 创造同样亲密机会(肌肤接触 / 目光 / 抱姿)
    - 让爸爸 / 祖辈分担喂养,你休息
    - 拒绝"母乳道德绑架":你的决定不需别人同意
    - 关注宝宝增重和发展,不关注"该不该母乳"
  failure_mode: |
    长期内疚 → 影响产后心理,反而损害母婴关系。
    在母乳/配方间反复 → 两种都做不好,妈妈崩溃。
    用配方时刻意"补偿"(例如冷漠喂奶) → 失去亲喂亲密的机会。
  evidence_level: C

  positions:
    issue: 母乳还是配方奶 — 道德题还是权衡题
    views:
      - school: 海蒂
        source: SRC-040
        stance: 权衡而非道德题;真正不能母乳的 7 种情境;"决定不喂别内疚"。挑战道德绑架,授权职场妈不内疚。
      - school: WHO / BFHI
        source: SRC-031
        stance: 母乳唯一 + 只医学指征用配方;技术层面承认母乳更优,情感框架上母乳是道德选择。
      - school: AAP
        source: SRC-006
        stance: 推母乳但承认家庭情况差异;不强加道德标签,以家庭决定为本位。
      - school: 中国家长压力
        stance: 亲戚 / 月嫂 / 育儿群常用 "不母乳的妈不爱孩子" 道德绑架,缺"不内疚"授权来源。

card_id: C-S1-059
stages: [S1]
tags: [safety, red_flag]

front:
  title: 中毒急救:专线 + 不催吐
  hook: 中国 12320,催吐反加重

back:
  why_matters: |
    婴幼儿中毒(poisoning)是 ER 急诊高发(6-24 月探索期 + 什么都塞嘴)。
    家庭常见毒源:清洁剂 / 化妆品 / 药品 / 维生素颗粒 / 香水 / 电池(纽扣电池尤其致命)。
    AAP 救命建议:**美国 Poison Help: 1-800-222-1222**(全国免费 24/7)。
    **绝不自行催吐** — 强酸 / 强碱 / 石油类反流会腐蚀食道二次伤害。
    "把东西放高点"对宝宝无效 — 一搬椅子就够到。
  what_to_do:
    - 美国:Poison Help 1-800-222-1222(24/7 免费)
    - 中国:**12320 卫生热线** / 当地中毒控制中心
    - 怀疑中毒立刻打,不自行处理
    - "**绝不催吐**(可能腐蚀食道二次伤害)"
    - 化学品 / 药品 / 化妆品全部上锁 + 看不见
    - 橱柜 / 抽屉装 safety latches(童锁)
  failure_mode: |
    自行催吐 → 强酸/碱反流腐蚀食道(永久损伤)。
    觉得"放高点就行" → 宝宝搬椅子就够到。
    纽扣电池吞下 → 2 小时内食道穿孔致命,必须立刻急诊。
  evidence_level: A


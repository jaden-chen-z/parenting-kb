card_id: C-S1-613
stages: [S1]
tags: [jaundice, warning-signs]

front:
  title: 黄疸不消退要警戒
  hook: 大便白色立即就医

back:
  why_matters: |
    松田说:生理性黄疸 7-10 天消,母乳性黄疸可持续 1-2 月,病理性需查肝胆。
    最危险信号 — 大便白色或灰色 → 胆道闭锁可能,1 月内手术效果好。
    妈不能凭"反正会消"等,要会鉴别 3 类。
    现代医学新增蓝光治疗,胆红素超阈值不能拖。
  what_to_do:
    - 7 天后还黄,找儿科测胆红素
    - 每次换尿布看大便颜色
    - 白/灰色立刻去医院(不等明天)
    - 母乳性黄疸不停母乳,除非医嘱
    - 严重要蓝光,别拒绝
  failure_mode: |
    "黄一点没事过几天就好" → 错过胆道闭锁 1 月手术窗 → 后续要换肝。
  evidence_level: B


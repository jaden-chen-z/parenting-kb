card_id: C-S1-015
stages: [S1]
tags: [safety]

front:
  title: 包裹 5 个最常见错误
  hook: 哭越凶包越紧

back:
  why_matters: |
    Karp 列了 5 个高频错误。包错不仅无效,还有窒息风险——
    值得每次包前花 30 秒自检。
  what_to_do:
    - 太松 → 每步都收紧,从距肩 90-120cm 起包
    - 手臂未垂直 → 双臂伸直贴身,不弯肘
    - 毯子碰脸 → 误启动根寻反射,远离面颊
    - 留松散布料 → 可能盖脸窒息,完全收尾
    - 力度不够 → 哭越凶包越紧,不要犹豫
  failure_mode: |
    "怕勒疼"包太松 → 一挣就开 + 毯子盖脸窒息风险。
    毯子边缘碰脸颊 → 误启动根寻反射,反而更哭。
  evidence_level: B


card_id: C-S1-1312
stages: [S1]
tags: [cicchetti, early_risk, newborn, lerner_v4]

front:
  title: 新生儿 PPD 风险传
  hook: 产后抑郁也会伤娃

back:
  why_matters: |
    Cicchetti V4 Ch 13(产后抑郁影响新生儿)。
    **产后抑郁(PPD)对新生儿冲击**:
    - 妈 PPD → 响应迟缓 / 情感缺失
    - 0-3 月响应缺 → 12 月不安全依恋
    - 不安全依恋 → 后期心理 + 学业 + 关系问题
    - **PPD 是早期风险因子,不是个人问题**
    **PPD 流行率**:
    - 美国 10-15%
    - 中国可能更高(数据有限,文化羞耻 underreport)
    - 不是"想多了" 是真病
    **Cicchetti 干预原则**:
    - **早期识别**:产后 2-6 周筛查(EPDS)
    - **早期治疗**:CBT / 药物 / 支持组
    - **保护娃**:其他主要照护人补响应
    - **不羞耻**:像感冒一样治
    **反 4 误区**:
    - ❌ "坐月子哭一阵正常"(超 2 周可能 PPD)
    - ❌ "强忍就好"(神经层影响娃)
    - ❌ "找咨询羞耻"(早治疗保护娃)
    - ❌ "药对娃不好"(部分药哺乳期可用)
    **给爸 + 家人**:
    - 看妈睡眠 + 食欲 + 情绪
    - 主动减负 + 找资源
    - 别说"为娃硬撑"
    跟现库:跟 V3 Cicchetti maltreatment(C-S0-1232)+ AAP 母婴(SRC-002)+ Brazelton(SRC-010)对接。
    对中国家长意义:
    - 产后 2 周以上抑郁信号别忍
    - 找心理咨询不羞耻
    - 爸 + 家人主动减负
    - 主要照护人若 PPD 其他人补
  what_to_do:
    - 产后 2 周以上抑郁信号别忍
    - 找心理咨询不羞耻
    - 爸+家人主动减负
    - 主要照护人 PPD 其他人补
  failure_mode: |
    "月子哭一阵正常"— 错。超 2 周可能 PPD。
    "强忍就好"— 错。神经层影响娃。
    "找咨询羞耻"— 错。早治疗保护娃。
  evidence_level: B


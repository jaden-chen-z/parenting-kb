card_id: C-S1-063
stages: [S1]
tags: [safety]

front:
  title: RSV 保护 2 选 1:孕妇或婴儿打
  hook: 婴儿住院主因,防住院 90%

back:
  why_matters: |
    RSV(呼吸道合胞病毒)= 1 岁内婴儿**住院主因**(AAP 原话),几乎所有 2 岁内婴儿都会感染过。
    重症可致呼吸衰竭 / 长期肺损伤,新生儿 + 早产儿尤其危险。
    2023-2024 起 AAP 新方案:**孕妇 Abrysvo OR 婴儿 nirsevimab,2 选 1**(不必都打)。
    nirsevimab 防住院效力 90%(单克隆抗体,持续 ≥ 5 月)。
    RSV 季节:10 月-3 月。
  what_to_do:
    - "**方案 1 - 孕妇**:32-36 周打 Abrysvo(限 9 月-1 月怀孕末期)"
    - "**方案 2 - 婴儿**:< 8 月在 RSV 季节打 nirsevimab"
    - 不需 2 个都打,2 选 1(方案 2 = 备选)
    - 高危(早产 / 心肺病)8-19 月再打 1 剂(进入第 2 RSV 季)
    - 中国市场:nirsevimab 2024 起部分城市可获取,问儿科医生
  failure_mode: |
    孕妇没打 + 婴儿也没打 → RSV 季节住院风险高(年均数千例婴儿住院)。
    觉得"我家不外出不会得" → 家人 / 兄姐传染最常见。
  evidence_level: A


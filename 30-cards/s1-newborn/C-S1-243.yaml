card_id: C-S1-243
stages: [S1]
tags: [cognitive_science, evolution, philosophy]

front:
  title: 长童年期是人类最大优势
  hook: 没断奶才有时间研究

back:
  why_matters: |
    Bruner 假说(Gopnik 三人在 Chapter 1 引用 + 扩展):
    人类是动物界童年期最长的物种 — 0-18 岁完全依赖父母。
    其他动物为什么不这么长?因为长童年期 = 高代价:成人要养护多年。
    人类为什么进化成这样?因为长童年期 = **学习窗口**。
    其他动物靠本能在固定生态位生存,人类靠学习适应任何环境(包括太空)。
    这就是"高皮层 / 行为灵活 / 长童年"动物的进化打包(包括人类 / 大象 / 黑猩猩 / 海豚)。
    Gopnik 推论:**婴儿的"无能"恰是为了腾出"学习"空间**。
    幼小时学到什么 → 决定一辈子能在哪种环境生存。
    对中国家长意义:
    - 不要焦虑"宝宝怎么这么久才独立"— 这是优势
    - 不要逼宝宝早熟 / 早学独立 — 反生物学
    - 长童年期是设计,不是 bug
    一句话:婴儿"没用"是为了变得"有用"— 大脑要时间研究。
  what_to_do:
    - 接受长依赖期不是缺陷
    - 不逼"独立睡 / 自己吃 / 不哭"
    - 0-3 岁陪伴 = 给大脑研究世界的时间
    - 不焦虑"别家孩子比他早走 / 早说"
  failure_mode: |
    "我家宝怎么这么久才会 X" — 错。每个孩子学习节奏不同。
    逼宝宝早熟 / 早自立 — 违反进化设计。
    把"依赖"当软弱 — 这是人类核心优势。
  evidence_level: B

  positions:
    issue: 第四产程命名群 — 同一概念多种叫法
    views:
      - school: Karp
        source: SRC-003
        stance: 第四产程(fourth trimester)— 出生后头 4 月,继续模拟子宫感是核心。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: exterogestation 外孕期 — 强调婴儿"在外"继续发育的生物学连续性。
      - school: Brazelton
        source: SRC-010
        stance: 不用"第四产程"标签,讲"独立的人 + 触点(touchpoints)",视婴儿为完整个体。
      - school: Gopnik
        source: SRC-015
        stance: 长童年期(extended childhood)是进化优势,人类大脑发育期长于其他灵长类。

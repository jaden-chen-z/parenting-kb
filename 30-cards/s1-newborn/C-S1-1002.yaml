front:
  title: "BFHI 10 步骤"
  hook: "10 步看完心里有底"

back:
  why_matters: |
    BFHI(Baby-Friendly Hospital Initiative,母婴友好医院倡议)1991 WHO+UNICEF 启动,2018 修订。
    10 步分两组:关键管理(1a/1b/1c/2)+ 关键临床(3-10)。
    关键管理:遵 Code / 书面政策 / 监测系统 / 员工训练。
    关键临床:产前讨论 / 立即肌肤接触 / 持续支持 / 仅医学指征补充 / 24h 同室 / 反馈信号 / 警告奶瓶 / 出院衔接。
    全球 152+ 国 15,000+ 家医院 BFHI 认证。中国 6,000+ 爱婴医院。
    2016 系统综述(58 项研究)证实:遵守 10 步 → EBF 启动率/纯母乳率/总时长全提高。
  what_to_do:
    - "选产院前看 BFHI 10 步原文"
    - "认证医院 ≠ 一定守 — 实操参差"
    - "看到偏离 10 步的实操 → 自己坚持"
    - "母乳建立期(0-4 周)是 10 步关键期"
    - "出院衔接(第 10 步)— 找社区/居家母乳支持"
  failure_mode: |
    把 BFHI 当 '认证名号' → 不知道实操标准,被产院流程裹挟。
    10 步具体化,值得记。
  evidence_level: A


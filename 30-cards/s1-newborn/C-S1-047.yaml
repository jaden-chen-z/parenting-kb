card_id: C-S1-047
stages: [S1]
tags: []

front:
  title: 消胀气滴 / 安神水都没用
  hook: AAP 直说研究证明无效

back:
  why_matters: |
    西甲硅油(消胀气滴剂)= 消化道泡沫消除剂;
    "安神水"(英文 gripe water,含茴香 / 姜 / 香料的草药水)。

    中文家长爱给的"消胀气滴剂""惊风散""安神水"都属此类,国内市场每年数十亿。

    AAP 明确白话翻译:
    > 研究**从未**证明这些产品有效。

    省钱买不到效果,反而可能掩盖真原因(牛奶蛋白过敏 / 胃食管反流)。
  what_to_do:
    - 别买西甲硅油(消胀气滴剂)
    - 别买安神水 / 任何"消胀气""安神"草药水
    - 改试:慢流速奶嘴 / 倾斜奶瓶 / 少食多餐
    - 母乳妈妈试"排查饮食法"(C-S1-048)
    - 配方奶可问医生换深度水解蛋白配方
  failure_mode: |
    给西甲硅油以为有效 → 浪费钱 + 安慰剂效应误判其他原因。
    给中药水(惊风散类) → 含未知成分,可能含未标注西药。
  evidence_level: A


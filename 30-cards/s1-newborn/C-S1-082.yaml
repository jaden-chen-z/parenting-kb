card_id: C-S1-082
stages: [S1]
tags: [red_flag]

front:
  title: 哭闹 6 类哭声地图
  hook: 哭声含 6 种语义

back:
  why_matters: |
    新生儿哭声是他唯一能"说话"的方式,头 3 月每天哭 1-3 小时是正常,但内容意思各不同。
    新生儿至少有 6 种功能不同的哭声:疼痛、饥饿、疲劳、无聊、不适、放电(end-of-day fussy)。
    母亲在 3 周内可分辨自家宝宝与他人宝宝(生后 3 天即可)。
    区分类型而非"一律安抚"是减少过度反应的核心。
    每种哭声有不同的声学特征:疼痛哭声以尖叫开始 + 短暂呼吸停止 + 反复哀号,抱起后仍持续;其他类型哭声抱起后就停。
  what_to_do:
    - 3 周时建立哭声分类档案
    - 疼痛哭声(抱起仍哭)立即就医排查
    - end-of-day 哭闹优先放下而非加抱
    - 不要每次哭都视为"问题"
    - 错误尝试比成功更教会父母观察
  failure_mode: |
    父母把所有哭声当饥饿一律喂奶,或把放电哭闹当不舒服反复抱、摇晃、刺激;过度干预反破坏宝宝自我安抚模式,"互动失败"种子被埋下。
  evidence_level: A


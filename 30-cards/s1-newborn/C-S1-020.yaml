card_id: C-S1-020
stages: [S1]
tags: [safety, red_flag]

front:
  title: 安全摇晃 vs 摇晃综合征 SBS
  hook: 区别在加速度,不在频率

back:
  why_matters: |
    摇晃综合征(SBS)是儿童虐待级别的剧烈摇晃,
    会撕裂颅内血管致命。安全摇晃和 SBS 的关键区别:
    头与身体保持直线 = 安全;头猛甩、扭向反方向 = SBS。
  what_to_do:
    - 一手撑头颈,头与身体保持一条直线
    - 振幅严格 30-60cm,不超
    - 自己累/愤怒时立刻把宝宝放回安全床
    - 出门 5 分钟,情绪稳了再回来
  failure_mode: |
    因为崩溃乱摇 → 颅内出血,可能致命。
    没撑头颈,头甩动 → 已经接近 SBS 边缘。
  evidence_level: A


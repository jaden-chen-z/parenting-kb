card_id: C-S1-020
stages: [S1]
tags: [safety, red_flag]

front:
  title: 安全摇晃 vs 摇晃综合征 SBS(摇婴综合征)
  hook: 区别在加速度,不在频率

back:
  why_matters: |
    SBS(摇婴综合征)(摇晃婴儿综合征)= 用力摇晃造成的脑出血 / 视网膜出血,
    可能终身脑损伤或死亡。美国年数百例,致死率 ~25%,
    幸存者 80% 终身神经损伤。2-4 月高发(同哭闹峰一致)。
    加害者 70% 是男性看护人(尤其崩溃面对持续哭闹时)。
    Karp 的"安全摇晃"是 5S 之一,与 SBS(摇婴综合征) 关键区别:
    头与身体保持直线 = 安全;头猛甩、扭向反方向 = SBS(摇婴综合征)。
    振幅严格 30-60cm,频率每秒 2-3 次。
  what_to_do:
    - 一手撑头颈,头与身体保持一条直线
    - 振幅严格 30-60cm,不超
    - 自己累/愤怒时立刻把宝宝放回安全床
    - 出门 5-10 分钟,情绪稳了再回来
  failure_mode: |
    因为崩溃乱摇 → 颅内出血,可能致命。
    没撑头颈,头甩动 → 已经接近 SBS(摇婴综合征) 边缘。
  evidence_level: A


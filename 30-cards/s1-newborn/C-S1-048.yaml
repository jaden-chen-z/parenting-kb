front:
  title: 哭闹试 2 周排除母乳饮食
  hook: 一次只去一类,看 2 周

back:
  why_matters: |
    elimination diet(排除饮食)= 妈妈一次只去一类食物,观察宝宝反应。
    CMPI / CMPA(牛奶蛋白不耐受 / 过敏)约 5% 婴儿,是母乳哭闹常见隐藏原因。
    AAP:母乳宝宝持续哭闹可能与妈妈饮食敏感有关。
    流程:乳制品 → 咖啡因 → onion / cabbage,一次只一类,看 2 周无效就恢复。
    onion / cabbage 是经验做法,科学证据不强。
  what_to_do:
    - 先去乳制品 2 周看效果(最常见原因)
    - 无效再去咖啡因 2 周
    - 再去 spicy / gassy 食物(onion / cabbage)2 周
    - 一次只一类,别同时多类(否则不知谁有效)
    - 有效就长期避;无效全部恢复正常饮食
  failure_mode: |
    同时去 5 种食物 → 不知哪个有效,自己饿。
    一去就一辈子不吃 → 自己营养失衡,母乳质量反受影响。
  evidence_level: A


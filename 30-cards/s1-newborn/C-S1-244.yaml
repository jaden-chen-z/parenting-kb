card_id: C-S1-244
stages: [S1]
tags: [cognitive_science, vision, myth_busting]

front:
  title: 新生儿能"看人"不能"看物"
  hook: 新生儿对人脸特化

back:
  why_matters: |
    传统观点:"新生儿看不见 / 视觉模糊"。
    Gopnik 修正:新生儿视觉**对人脸特化**,不是普遍模糊。
    研究证据:
    - Fantz 1960 经典:新生儿盯人脸图比盯几何图久
    - 30cm 焦距正好是哺乳时妈妈脸的距离(生物设计)
    - 新生儿对"亮 + 高对比 + 圆形 + 移动"特别敏感(都是脸的特征)
    - 出生几天就能识母脸 / 母音 / 母气味
    Gopnik 比喻:新生儿世界像 Rembrandt 画 — 人脸光亮鲜活,
    背景幽暗模糊。**人脸主动跳出**,物体退后。
    含义:
    - 新生儿不是"啥都看不见"
    - 是**对人脸优化**,对物体次要
    - 这是 Other Minds 问题的天生入口对中国家长意义:不必买昂贵 mobile 玩具 — 你的脸最有效。
  what_to_do:
    - 抱起时保持 30cm 内眼神接触
    - 喂奶时面向宝宝,不刷手机
    - 不必买彩色复杂玩具 — 黑白对比 + 你的脸够
    - 1 月内多让他看不同人脸(家人轮流抱)
  failure_mode: |
    "他看不见,我刷会儿手机" — 错。30cm 内他在读你脸。
    买昂贵彩色玩具刺激视觉 — 错。新生儿对人脸特化,不需要。
    把宝宝放婴儿车面对前方推 — 错过对脸的输入(应面对推车人)。
  evidence_level: A


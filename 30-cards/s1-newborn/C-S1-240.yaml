card_id: C-S1-240
stages: [S1]
tags: [cognitive_science, myth_busting, philosophy]

front:
  title: 婴儿不是白板,是天生科学家
  hook: 他出生就在做研究

back:
  why_matters: |
    "白板论"(tabula rasa)= 17 世纪 Locke 假设:婴儿是空容器,等大人灌输。
    Gopnik / Meltzoff / Kuhl 1999《摇篮里的科学家》推翻这假设:
    婴儿出生就有学习引擎,在用统计学习 / 假设检验 / 因果推理学世界。
    核心命题:**孩子不是小科学家,科学家是大孩子**(scientists are big children)。
    实证支持:
    - Meltzoff 1977:新生儿 42 分钟就能模仿伸舌头(出生即识"对方像我")
    - Saffran 1996:8 月宝宝听 2 分钟无意义音节流就抓到统计模式
    - Spelke 1985:4 月就有物体永久性(早于 Piaget 8 月说)
    - Gopnik blicket detector:18 月就能从观察推因果对中国家长意义:不需要"教"宝宝什么,提供安全 + 互动,他自己研究世界。
    早教焦虑("3 岁前没学 X 就输了")是反科学的。
  what_to_do:
    - 跟着兴趣走,他盯什么你陪什么
    - 不打断专注,他正在做实验
    - 不抢答,让他自己摆弄玩具
    - 真人对话 > 录像 / CD / 早教 App
  failure_mode: |
    把宝宝当空容器灌知识 — 早教班 KPI 式。
    抢着教他 — 他失去自己推理的机会。
    "宝宝啥都不懂,跟他说话没用" — 错。他在收集数据。
  evidence_level: A


card_id: C-S1-124
stages: [S1]
tags: []

front:
  title: 5 种粘妈本能行为
  hook: 哭笑吸抓跟,都是依恋

back:
  why_matters: |
    Bowlby 指出:婴儿"找妈妈"不是一种行为,是 5 种本能反应的组合,
    都是 30 万年进化保留下的:**吸吮 / 抓握 / 跟随 / 哭泣 / 微笑**。
    每一种都有同样的目的:让妈靠近。
    9-18 月时这 5 种会被整合成"自动定位妈妈"的能力(像 GPS 一样)。
    家长记住:哭和笑都是召唤你 — 同一目的,两副面孔。
  what_to_do:
    - 把哭看作"召唤系统",不是"操控你"
    - 微笑也是召唤(求互动),不只是开心
    - 抓握反射(攥手指)是进化遗留 — 让宝宝抓你手
    - 跟随是后期加入的(9 月后会爬之后)
    - 5 种合起来 = 健康依恋形成的物质基础
  failure_mode: |
    把哭闹当"学坏"压制,会破坏整套召唤系统。
    把微笑当"被宠"也错(笑也是工具)。
  evidence_level: B


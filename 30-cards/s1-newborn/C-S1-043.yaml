card_id: C-S1-043
stages: [S1]
tags: [philosophy]

front:
  title: 头 6 月不会宠坏 — 答应反而少哭
  hook: AAP 反驳"惯坏"焦虑

back:
  why_matters: |
    依恋理论 + 应答式互动("发球-回球"serve and return)证明:头几月及时回应是建立安全感的基础。
    中文文化"怕惯坏"焦虑普遍 — 但 AAP 直接陈述(白话翻译):
    > 你不会因为关注小宝宝就把他惯坏。
    > 你回应他的呼救,他整体反而哭得更少。

    头几月及时回应 = 总哭闹更少(不是更多)。
    "怕惯坏故意延迟回应"是误解,不是科学。
  what_to_do:
    - 0-6 月哭就回应,不怕"惯坏"
    - 回应顺序:最迫切的先(冷暖 → 尿布 → 异物 → 喂)
    - 不必每次都抱起来:语音 / 抚摸 / 在场也算回应
    - 6 月后再加"自我安抚"练习(C-S1-046)
    - 这跟"哭到睡着"睡眠训练(cry-it-out)是两回事
  failure_mode: |
    怕"惯坏"故意延迟回应 → 总哭闹反而更多 + 安全感受损。
    把"自我安抚"等同于"哭到不哭" → 错,是技能不是放任。
  evidence_level: A


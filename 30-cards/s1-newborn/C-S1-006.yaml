front:
  title: 听不懂哭声不代表你不细心
  hook: 听声辨意 ≈ 抛硬币

back:
  why_matters: |
    1990 康涅狄格大学研究:母亲分辨"宝宝是不是饿"准确率仅 25%。
    芬兰研究 80 名儿科护士:50% 准确率(几乎和抛硬币一样)。
    所以听不懂不是你不细心——这事人类本来就分不清。
  what_to_do:
    - 别试图听声辨意,直接按清单逐项排查
    - 顺序:尿布 → 饿(看上次喂奶)→ 困 → 刺激过度 → 不舒服
    - 都不是 → 启动 5S 安抚
    - 还无效 → 换人接手,可能就是过峰值
  failure_mode: |
    死盯哭声辨意半小时不动手 → 宝宝越哭越焦虑。
    觉得"妈妈应该听得懂"自我加压 → 听不懂时极度自责。
  evidence_level: B


front:
  title: 听不懂哭声不代表你不细心
  hook: 听声辨意 ≈ 抛硬币

back:
  why_matters: |
    听不懂哭声不是你不细心,Karp 引研究证明:
    1990 年康涅狄格大学:母亲辨识"宝宝是否饿"准确率仅 25%。
    芬兰 80 名儿科护士辨识哭声原因:50% 准确率(和抛硬币一样)。
    新生儿大脑发育不全,只能发 3 种声音(呜咽 / 哭泣 / 尖叫),
    不像 3 月+ 的宝宝能精细分类需求。
    所以这事人类本来就分不清,别自我加压。
  what_to_do:
    - 别试图听声辨意,直接按清单逐项排查
    - 顺序:尿布 → 饿(看上次喂奶)→ 困 → 刺激过度 → 不舒服
    - 都不是 → 启动 5S 安抚
    - 还无效 → 换人接手,可能就是过峰值
  failure_mode: |
    死盯哭声辨意半小时不动手 → 宝宝越哭越焦虑。
    觉得"妈妈应该听得懂"自我加压 → 听不懂时极度自责。
  evidence_level: B


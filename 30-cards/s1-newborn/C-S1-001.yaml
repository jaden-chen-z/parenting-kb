card_id: C-S1-001
stages: [S1]
tags: [philosophy]

front:
  title: 头 3 个月是"第四产程"
  hook: 他其实早产了 3 个月

back:
  why_matters: |
    第四产程 = Karp 提出的概念:出生后头 3 月仍是孕期延续,
    属于"子宫外适应期"。这是 Karp 流派的哲学基础,
    解释了为什么新生儿需要类子宫刺激(温暖紧裹响动摇)。
    论据:人脑超大(头围约 11.5cm)逼近产道极限(10cm),
    自然选择让婴儿"提前 3 月被驱逐"出生。
    所以新生儿"难带"是正常的——他还在补完该在子宫里过的那段。
  what_to_do:
    - 把"新生儿"看成"还没出生足月的人"
    - 主动给他造一个像子宫的环境:暖+紧+响+晃
    - 3 月内的手抖、惊跳都正常,会自动消失
    - 他"难带"是因为还没满月,3 月后再评估
  failure_mode: |
    用 6 月大宝宝的标准看新生儿 → 觉得他"难带""有问题"。
    不模拟子宫环境,只靠抱抱哄哄 → 安抚效率很低。
  evidence_level: C

  positions:
    issue: 第四产程命名群 — 同一概念多种叫法
    views:
      - school: Karp
        source: SRC-003
        stance: 第四产程(fourth trimester)— 出生后头 4 月,继续模拟子宫感是核心。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: exterogestation 外孕期 — 强调婴儿"在外"继续发育的生物学连续性。
      - school: Brazelton
        source: SRC-010
        stance: 不用"第四产程"标签,讲"独立的人 + 触点(touchpoints)",视婴儿为完整个体。
      - school: Gopnik
        source: SRC-015
        stance: 长童年期(extended childhood)是进化优势,人类大脑发育期长于其他灵长类。

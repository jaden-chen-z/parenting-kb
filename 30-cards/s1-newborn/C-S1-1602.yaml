card_id: C-S1-1602
stages: ['S1']
tags: ['relationships', 'lerner_v1', 'thelen', 'self_organization', 'newborn']

front:
  title: "新生儿能力是涌现"
  hook: "不是基因预设全部"

back:
  why_matters: |
    新生儿看似 "本能" 的能力(吸吮 / 抓握 / 视觉追踪)— Thelen-Smith 视角:
    不是 "先天预设" 直接出来,是基因 + 子宫环境 + 出生过程共同 self-organize 涌现。
    意义 — 看似 "天生本能" 的吸吮 / 抓握也是动态系统涌现 — 早产儿这些能力可能延后 2-3 周,因为系统组装条件晚到位。
    中国家长意义 — 不要拿 "新生儿应该会 X" 月龄表焦虑早产 / 弱小宝宝。
    每个新生儿的能力 emergence 时间不同,跟基因 + 子宫 + 出生 + 出生后头几天经验一起塑造。
    父母工作 — 提供身体接触 + 喂养 + 安静 → 让 self-organize 顺畅完成。
  what_to_do:
    - "不焦虑'新生儿应该会 X'"
    - "早产儿能力 emergence 延后属正常"
    - "提供身体接触 + 喂养 + 安静"
    - "self-organization 需要时间"
    - "能力涌现是组装出来的"
  failure_mode: |
    "新生儿就该会 X" 月龄表焦虑 — 错。能力是涌现不是预设。
  evidence_level: B


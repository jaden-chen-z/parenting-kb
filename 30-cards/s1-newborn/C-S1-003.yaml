card_id: C-S1-003
stages: [S1]
tags: [philosophy]

front:
  title: 哭闹是求生工具不是失败
  hook: 他在召唤你,不是抗议你

back:
  why_matters: |
    哭泣反射 = 婴儿无法说话之前的唯一沟通方式,百万年进化来的"求救信号"。
    人类婴儿出生即会哭(多数哺乳动物幼崽悄无声息以避天敌),
    因为人类祖先有"洞穴妈妈"保护——大声哭反而是安全的证明。
    所以宝宝敢这么大声哭,是因为他知道身边有大人——
    这是安全感的证明,不是你做错了什么。
  what_to_do:
    - 听见哭别先想"我是不是没做好"
    - 把哭当成宝宝目前唯一的"说话方式"
    - 优先排查需求(饿/困/不舒服),再用 5S
    - 自己快崩溃时把宝宝放回安全床,出去 5 分钟
  failure_mode: |
    把哭解读成"他有问题/我没做好" → 你越焦虑,他哭越凶。
    一个人硬撑几小时不喘气 → 容易做出剧烈摇晃等危险动作。
  evidence_level: B


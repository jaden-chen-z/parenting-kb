front:
  title: 微笑发展 4 阶段
  hook: 5 周才是真"看见你"

back:
  why_matters: |
    新手家长以为"宝宝对我笑就是认我"。错。
    Bowlby 引 Wolff (1963)、Ambrose (1961) 把婴儿微笑分**4 阶段**:
    1. **0-3 周**:反射性微笑(短暂,经常在睡梦中出现)— 不是真社交
    2. **3-5 周**:非选择性社交微笑(听到嗓音也笑)— 开始功能化
    3. **5-14 周**:选择性社交微笑(对熟悉的人笑得多)— 区分能力出现
    4. **14 周+**:差异性反应(对妈灿烂笑,对陌生人迟疑)— 真依恋出现
    重要:新生儿"睡着的笑"是反射,不要解读为"做好梦"。
  what_to_do:
    - 0-3 周:享受反射笑,但别赋予太多意义
    - 5 周起:积极回应(微笑 + 抱 + 说话)— 强化形成
    - 嗓音 5 周前比脸更有效,5 周后脸超过嗓音
    - 14 周后看母亲会"绽放笑容",看陌生人会迟疑
  failure_mode: |
    误解新生儿反射笑为"早熟" → 期望过高失望。
    5 周关键期不积极回应 → 宝宝渐渐不爱笑了(因为没人捧场,笑就消退)。
  evidence_level: B


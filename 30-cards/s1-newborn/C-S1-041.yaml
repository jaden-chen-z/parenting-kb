card_id: C-S1-041
stages: [S1]
tags: [safety]

front:
  title: 过热也增 SIDS,比大人多 1 层
  hook: 室内不戴帽子,出汗就是过热

back:
  why_matters: |
    过热(overheating)= 婴儿体温调节失衡,可能因为穿太多 / 盖太厚 / 房间过暖。
    中国传统"老人多穿"普遍,但实际增 SIDS 风险(婴儿调温能力比成人差)。
    AAP 穿衣极简规则:同环境下,比大人多 1 层就够。
    室内不戴帽子(医院刚回家头几小时除外)。
    出汗 / 胸口烫 / 皮肤潮红 = 过热信号,要减衣。
  what_to_do:
    - 同环境下比大人多 1 层(不是多 2-3 层)
    - 室内不戴帽子
    - 分层穿衣 > 盖被子(被子还会闷面)
    - Wearable blanket 要合身、不能盖到头
    - 摸宝宝胸口 / 后颈判断冷热(不看手脚 — 手脚凉是正常)
  failure_mode: |
    怕冷裹厚被子 + 戴帽子 → 过热 → SIDS 风险升 + 闷面风险。
    摸手脚凉就以为冷 → 加衣过度。
  evidence_level: A


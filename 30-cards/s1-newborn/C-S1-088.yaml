card_id: C-S1-088
stages: [S1]
tags: [philosophy]

front:
  title: 父母两套模型反而更好
  hook: 不必同步,互补即可

back:
  why_matters: |
    Brazelton 反对"父亲只是母亲的备胎"这种旧观念,也反对女性运动后某些家庭追求"父母完全一致"的新理想。
    研究显示:婴儿 4 周大就能区分父母行为模式(看到爸爸进门,肩膀耸起、眉毛跳动,"来玩吧"的预备姿势)。父亲对女儿更柔、对儿子更推动;母亲倾向保护、慢节奏。
    差异不是问题,是两套独立的关系模型,让孩子认识到自己是个体而非"家庭一致输出"的产物。父亲在场还能帮母亲在分离任务(断奶、独睡、自主进食)上松手。
  what_to_do:
    - 不要求伴侣按你的方式带娃
    - 同一件事允许两套规则,只在原则上对齐
    - 母亲不在场时父亲是主决策,反之亦然
    - 当一方"过度卷入"时另一方提议放手
    - 把"差异"当资源而非威胁讲给孩子听
  failure_mode: |
    母亲做"门卫"——纠正父亲尿布手法、抢回喂奶位、暗示"你不行"。
    父亲被推开后退回打工人角色;孩子失去第二套关系模型;母亲过劳后又抱怨"他不帮忙",形成自证陷阱。
  evidence_level: B


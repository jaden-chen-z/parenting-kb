card_id: C-S1-128
stages: [S1]
tags: [philosophy, controversy]

front:
  title: 妈来了哭就停 = 选 1 名优待
  hook: 9 周开始有差别对待

back:
  why_matters: |
    Ainsworth 干达婴儿研究 + 鲍尔比综合发现:
    **9 周时**婴儿首次对"被拥抱"产生差别反应:别人抱着继续哭,妈妈抱着立刻停 — 这是早期"区分依恋"信号。
    这比"陌生人焦虑"早很多(陌生人焦虑 8 月才出现)。
    家长理解这个时间表很重要:9 周开始你就**不是普通照顾者**了,你是宝宝唯一能止哭的人。
  what_to_do:
    - 9 周后注意宝宝是否对妈停哭、对其他人继续哭
    - 不必焦虑爸爸 / 奶奶抱不止哭 — 这是依恋形成在工作
    - 别人抱时让妈妈在视线内
    - 不"狠心"训练宝宝接受任何人抱(违反依恋发育节律)
  failure_mode: |
    "宝宝得习惯不同人抱,不能太挑" — 在 9 周-6 月强行训练会引发焦虑。
    "妈妈不在你也得乖" → 母亲长期不在场,9 周区分能力延迟,反而长期黏人。
  evidence_level: B


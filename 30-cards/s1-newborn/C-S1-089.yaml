card_id: C-S1-089
stages: [S1]
tags: [philosophy]

front:
  title: 祖父母先闭嘴再帮忙
  hook: 资源还是干扰看一条线

back:
  why_matters: |
    中国家庭普遍 3 代同堂,但很少人把祖父母的角色边界说清楚。Brazelton 在美国本来就少 3 代同堂的语境下指出一条普世规则:祖父母最有用的时候是"被请教时温和说,没被请教时闭嘴"。
    他们的力量来自连续性——文化传承、家族故事、过去的"我们这样做有效"——但这力量也是双刃剑:批评年轻父母时,正好打中"我不要变成我父母"的脆弱处。
    规则反过来:祖父母 vs 父母在孩子面前的优先级,永远是父母。
  what_to_do:
    - 祖父母只在被询问时给意见
    - 不在孙辈面前批评孙辈父母
    - 把礼物/规矩跟父母事先对齐
    - 遇到夫妻冲突两边听不站队
    - 短住(≤3 天)+ 必要时住外面
  failure_mode: |
    祖父母把"我有经验"当通行证,每天指点母乳量、抱姿、辅食时机。
    父母防御启动后切断联系或在孩子面前公开顶撞祖父母——孩子学到"权威是可以互相否定的",原本能给的连续性资源全部清零。
  evidence_level: B


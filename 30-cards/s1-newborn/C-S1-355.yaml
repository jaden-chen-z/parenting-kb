card_id: C-S1-355
stages: [S1]
tags: [sleep, RIE, lansbury, controversy]

front:
  title: "睡眠不是训练是反训练"
  hook: "取消我们建的依赖"

back:
  why_matters: |
    Lansbury Ch6 反对"睡眠训练" 这个词。
    她说:孩子天生会睡 — 是大人通过摇 / 抱 / 喂奶睡 / 推车睡建立了"必须如此才能睡"的依赖。
    所谓"睡眠训练" = un-training(取消大人造的依赖)。
    Magda Gerber:不要把"sleep"叫做 "go to sleep"(像放逐)
    或"fall asleep"(像坠落),叫"rest"(休息)更柔。

  what_to_do:
    - 头月起,清醒(略困)放床,不全睡再放
    - 不建立"必须摇 / 必须奶睡"的单一通道
    - 哄睡前清楚告知:"今晚抱抱后睡床"
    - 哭时承认:"这次不一样,你不习惯"
    - 把"睡眠"叫"休息" / "rest" 让宝宝放松

  failure_mode: |
    "睡眠训练就是哭声免疫法" → 错解。
    Lansbury 反"放任哭",支持"在场陪伴 + 清楚沟通"的渐进 un-training。
    或反向:大人怕哭啥都妥协 → 多月后大人崩溃。

  evidence_level: B


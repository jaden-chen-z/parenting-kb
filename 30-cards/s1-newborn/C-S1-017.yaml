card_id: C-S1-017
stages: [S1]
tags: []

front:
  title: 嘘声 = 子宫白噪音 80-90 分贝
  hook: 比吸尘器还响才有效

back:
  why_matters: |
    嘘声(shush)是 5S 第三招,模仿子宫白噪音激活镇静反射。
    子宫里血流声大约 80-90 分贝(实测,比真空吸尘器还响)。
    宝宝在子宫里 9 个月已经习惯这种声音环境。
    所以哭闹时,嘘声必须够大才能模仿子宫,激活镇静反射——
    安静的"嘘嘘"没用,他听不到,也激活不了反射。
  what_to_do:
    - 嘴贴宝宝耳边 5-10 厘米,大声"嘘——"
    - 音量要等于或大于他的哭声(70-80 分贝)
    - 也可以用白噪音 app / 吹风机 / 真吸尘器代替
    - 见效后慢慢降音量,但别完全关
  failure_mode: |
    怕吵着宝宝小声"嘘嘘" → 强度不够,无效。
    把"安静=好"投射到新生儿 → 反而焦虑。
  evidence_level: B


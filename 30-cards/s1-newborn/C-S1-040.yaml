card_id: C-S1-040
stages: [S1]
tags: [safety, red_flag]

front:
  title: 孕期产后都禁烟,vaping 也算
  hook: smoker bed share 风险尤其高

back:
  why_matters: |
    smoking 风险包括:直接抽烟 + 二手烟(secondhand)+ 三手烟(thirdhand,衣物 / 家具残留)+ vaping。
    smoking 是 SIDS 第二大可控风险因子(仅次于趴睡)。
    AAP:孕期 + 产后 + 二手烟 + vaping(含尼古丁)全算。
    抽烟者绝不能 bed share — 即使没在床上抽,SIDS 风险也尤其高。
  what_to_do:
    - 孕期戒烟(含 vaping / 电子烟)
    - 产后家、车、宝宝身边全部禁烟
    - 二手烟也算 — 户外抽完进门也带烟味风险
    - 抽烟者绝不与宝宝同床(即便室内不抽)
    - 孕期 / 产后避酒精、大麻、阿片、违禁药物
  failure_mode: |
    觉得"我只在阳台抽,不在宝宝身边" → 烟雾依然进入呼吸环境(三手烟)。
    抽烟者偶尔同床 → 风险叠乘极高,致死案例不少。
  evidence_level: A

  positions:
    issue: 同床 vs 同房不同床 · 何时安全 · SIDS 风险 · 分龄差异
    views:
      - school: Karp
        source: SRC-003
        stance: 在 10 步安全协议下可同床(无烟酒、硬床垫、无松软被等);否则不建议。
      - school: AAP
        source: SRC-004
        stance: 严禁 bed-sharing。推荐同房不同床(共室不共床)到 6 月,可降 SIDS 50%。
      - school: Brazelton
        source: SRC-010
        stance: 不给统一指南,视家庭文化决定;睡眠安排是亲子关系的反映,无单一正确答案。
      - school: 松田道雄
        source: SRC-024
        stance: 分龄立场 — 3 月内禁同床(母乳房压窒息风险);8 月后可同床(寒冷季节实用,母乳更增多)。
      - school: 中国传统
        stance: 普遍同床(便于喂奶 / 保暖 / 安抚),无明确安全协议;部分家庭长期同床至学龄。

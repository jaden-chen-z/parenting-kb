card_id: C-S1-008
stages: [S1]
tags: [philosophy]

front:
  title: 宝宝哭你心跳加速是天然反射
  hook: 这是生理反射,不是软弱

back:
  why_matters: |
    婴儿尖叫对成人焦虑系统的刺激,Karp 引研究测得**强度等同电休克**——
    心跳加快、血压上升、掌心出汗、胃部痉挛紧缩。
    这是百万年进化设计:让父母无法忽视婴儿求救信号。
    叠加压力源(疲劳 / 经济 / 婚姻 / 抑郁)时反应更剧烈,
    甚至可能让父母失控触发 SBS(摇婴综合征)(摇晃婴儿综合征)。
    所以崩溃不是你软弱,是大脑被设计成这样。
  what_to_do:
    - 知道这是生理反射,不是性格问题
    - 出汗、心跳加速时,先深呼吸 3 次再行动
    - 失眠/焦虑/经济压力会放大反应,提前求支援
    - 累到极限把宝宝放回安全床,出去 5-10 分钟稳定情绪
  failure_mode: |
    把生理反应当成"我不是好父母"的证据 → 自责加重压力。
    在崩溃边缘硬撑不停手 → 容易做出剧烈摇晃等危险动作。
  evidence_level: B


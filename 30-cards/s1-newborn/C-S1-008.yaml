front:
  title: 宝宝哭你心跳加速是天然反射
  hook: 这是生理反射,不是软弱

back:
  why_matters: |
    Karp 引研究:宝宝尖叫时,你的焦虑系统反应强度等同"电休克"——
    心跳加快、出冷汗、胃部紧缩。
    这是大脑被进化设计成这样的,不是你软弱或没爱心。
  what_to_do:
    - 知道这是生理反射,不是性格问题
    - 出汗、心跳加速时,先深呼吸 3 次再行动
    - 失眠/焦虑/经济压力会放大反应,提前求支援
    - 累到极限把宝宝放回安全床,出去 5 分钟稳定情绪
  failure_mode: |
    把生理反应当成"我不是好父母"的证据 → 自责加重压力。
    在崩溃边缘硬撑不停手 → 容易做出剧烈摇晃等危险动作。
  evidence_level: B


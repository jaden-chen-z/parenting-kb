card_id: C-S1-009
stages: [S1]
tags: [philosophy]

front:
  title: 5S 必须组合用,单招效果差
  hook: 单招就像半吊子蛋糕

back:
  why_matters: |
    5S = Karp 的新生儿安抚 5 招组合:
    包裹 / 侧抱 / 嘘声 / 摇晃 / 吸吮(swaddle/Side/Shush/Swing/Suck)。
    对中重度哭闹有部分 RCT 支持(B 级),AAP 整体认可作为安抚技巧。
    关键是"必须组合":前两招(包裹+侧抱)让宝宝先停下乱动,
    后三招(嘘声+摇晃+吸吮)激活"镇静反射"(Karp 假设的胎儿期遗存反射)。
    少做一组,另一组也起不到效果。
  what_to_do:
    - 五招同时上,不要"先试试某一招"
    - 顺序:包裹 → 侧抱 → 嘘声 → 摇晃 → 吸吮
    - 哭得越凶,每一招的强度都要相应加大
    - 见效后 1-2 分钟内别撤,免得反弹
  failure_mode: |
    只包裹或只放白噪音 → 单招激活不了反射,以为"5S 没用"。
    动作太轻、嘘声太小 → 强度不够,匹配不上哭闹烈度。
  evidence_level: B


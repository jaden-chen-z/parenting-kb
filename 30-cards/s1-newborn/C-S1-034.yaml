card_id: C-S1-034
stages: [S1]
tags: [safety, red_flag]

front:
  title: 仰睡每次都要 — 包括 GERD
  hook: 侧睡更危险,容易翻趴

back:
  why_matters: |
    仰睡 = 背朝下脸朝上(对应趴 / 侧睡)。
    SIDS 美国每年约 3500 例;1992 AAP "仰睡" 推广后死亡数降 ~40%。
    AAP 立场最硬:每次入睡(白天 nap + 夜里)都必须仰躺,1 岁内强制。
    侧睡危险因为容易翻成趴卧。
    GERD 宝宝也要仰睡 — airway 解剖 + 呕吐反射会防呛奶。
  what_to_do:
    - 每一次睡都仰躺(白天 + 夜里都算)
    - 反流宝宝也照样仰,不要垫高、不要侧睡
    - 主动放仰位,不要主动放侧位(容易翻趴)
    - 例外:已能自主双向翻身(背→趴、趴→背),可让保持自然睡姿
    - 包裹了也必须仰睡
  failure_mode: |
    觉得宝宝喜欢趴睡就让他趴 → SIDS 风险翻倍。
    怕反流让他侧睡或垫高 → 错,反而增风险。
  evidence_level: A


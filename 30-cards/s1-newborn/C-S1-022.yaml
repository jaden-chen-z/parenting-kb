card_id: C-S1-022
stages: [S1]
tags: [philosophy, controversy]

front:
  title: 奶嘴别太早,3-4 周再用
  hook: 母乳建立期先避开

back:
  why_matters: |
    混淆乳头(nipple confusion)= 母乳建立前过早用奶嘴 / 奶瓶,
    宝宝学会"省力吸"(橡皮乳头流速快、含起来不费劲),
    回头吸妈妈奶就用力不够 → 妈妈奶变少。
    Karp:母乳建立前 2-3 周用奶嘴会触发这个,
    建议母乳建立后 3-4 周再引入(太晚 6-8 周后宝宝可能拒绝)。
    AAP 立场略不同:奶嘴可降 SIDS 风险,1 月后可在 nap/bedtime 用。
  what_to_do:
    - 0-2 周:不用奶嘴,只让宝宝吸妈妈乳头
    - 母乳稳了后(约 3 周):可以引入奶嘴
    - 选正畸奶嘴(鸭嘴形,模仿乳头)
    - 配方奶喂养无此顾虑,可早用
  failure_mode: |
    出生第一周就给奶嘴 → 混淆乳头,母乳难建立。
    6 周后才引入 → 宝宝可能拒绝任何奶嘴。
  evidence_level: C


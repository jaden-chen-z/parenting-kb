card_id: C-S1-090
stages: [S1]
tags: [philosophy]

front:
  title: 门卫现象是爱的副作用
  hook: 越在乎越想独占

back:
  why_matters: |
    Brazelton 反复在多章贯穿一个跨章主张——gatekeeping(门卫现象)是普遍的、不可避免的、源于深爱的副产品。
    所有真正在乎一个孩子的成人——父亲、母亲、祖父母、保姆、医生、老师——都会本能地想"独占"或"做得比别人好"。门卫不是病,是关心的另一面。
    Brazelton 的处方不是消灭它,而是命名它:把"我感觉到我们在竞争"明确说出来,它就失去了暗中破坏关系的力量。
    这是 触摸点 体系把临床一手观察上升为家庭系统理论的一个标志性洞察。
  what_to_do:
    - 把"门卫"作为家庭白话术语公开使用
    - 每月一次伴侣对话:"这周谁觉得被排挤"
    - 表扬伴侣做得比你好的具体一件事
    - 不在第三人面前纠正伴侣的带娃动作
    - 把竞争重新定向为分工:你管哪块我管哪块
  failure_mode: |
    否认门卫存在,假装夫妻 / 婆媳 / 父母-保姆之间没有竞争。
    结果竞争走暗线——挑刺、抢功、阴阳怪气——孩子学到"爱我的人都在争我",长大后人际关系里复制这套三角化模式。
  evidence_level: B


card_id: C-S1-078
stages: [S1]
tags: [philosophy]

front:
  title: 调和"梦中宝宝"和"真宝宝"
  hook: 你期待的宝宝可能不是这个

back:
  why_matters: |
    Brazelton 与精神病学家 Bertrand Cramer 合著的研究指出:每个父母怀孕时都会"想象"出一个宝宝,这个想象宝宝带着父母自己的童年记忆和家族角色("像我爸爸的眼睛""像 Hattie 阿姨的脾气")。
    真实宝宝出生后,父母在前几周一直在做的隐藏工作就是把"想象宝宝"和"真实宝宝"对接。
    如果想象的是安静温和宝宝、来的却是猛烈难安抚的,父母会经历真实的失望和挫败。
    Brazelton 强调:把这层心理工作摊开来谈,父母从"miscast 宝宝"中走出来就更快,养育也会顺很多。
  what_to_do:
    - 承认"我心里有个想象的宝宝"
    - 写下你怀孕时期待的样子
    - 跟伴侣说出"真宝宝跟我想的不一样"
    - 别给真宝宝套你家族的角色
    - 把失望当正常情绪而非愧疚
  failure_mode: |
    父母把对"想象宝宝"的期待硬套在真实宝宝身上,比如非要让"性子急的宝宝"安静睡整觉,或者觉得"温和宝宝怎么我家是个炸药桶——肯定是我没养好"。
    结果两边都消耗,真宝宝得不到适合他风格的回应。
  evidence_level: C


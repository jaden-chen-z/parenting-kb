card_id: C-S1-1005
stages: [S1]
tags: []

front:
  title: "反对定时喂奶"
  hook: "3 小时定时是过时的"

back:
  why_matters: |
    BFHI 第 8 步:'Support mothers to recognize and respond to infant 喂养信号.'(反对定时喂养,倡导反馈喂养)
    反馈喂养(responsive feeding)= 看娃信号决定喂,不按时间表。
    早期信号:唇啜 / 吸吮动作 / 寻乳 / 踢腿 / 警觉。
    晚期信号:哭(已经过头,饿+情绪 → 难有效吸)。
    新生儿胃容量小,需 8-12 次/24 小时,不可能 3 小时一次。
    松田 SRC-024 C-S1-761 也反对中国产院'3 小时定时 + 用枕头支奶瓶'。
  what_to_do:
    - "看信号喂,不看时间表"
    - "8-12 次/天(白天 2-3 小时上限)"
    - "夜间最多 4 小时不喂一次"
    - "哭已晚 — 早期信号(唇啜)就喂"
    - "产院说'3 小时一次' → 违反 BFHI 第 8 步"
  failure_mode: |
    按 3 小时定时喂 → 错过早期信号 + 没奶涨给奶瓶补 + 母乳建立慢。
    Responsive 是 BFHI / AAP / 松田三方共识。
  evidence_level: A

  positions:
    issue: 喂养节律 — 反馈喂养(信号驱动)vs 3 小时定时
    views:
      - school: BFHI / WHO
        source: SRC-031
        stance: 看信号反馈喂(responsive feeding)— 婴儿饿了就喂,不计时间表。
      - school: AAP
        source: SRC-006
        stance: on demand 立场一致 — 新生儿不应严格定时,看信号优先。
      - school: 松田道雄
        source: SRC-024
        stance: 反产院'3 小时定时 + 用枕头支奶瓶'(C-S1-761),跟 BFHI 完全一致。
      - school: 中国传统产院
        stance: 3 小时定时喂奶仍普遍,部分爱婴医院实操参差;BFHI 中国 6,000+ 医院落地不一致。

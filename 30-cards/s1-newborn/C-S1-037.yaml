card_id: C-S1-037
stages: [S1]
tags: [safety, red_flag, controversy]

front:
  title: 同房不同床到 6 月,降 SIDS 50%
  hook: AAP 任何情况下都不同床睡

back:
  why_matters: |
    room-sharing(同房不同床)= crib 放卧室伸手可及,不进父母床。
    bed-sharing(同床睡)= 父母与婴儿同一张床。
    中文文化"母婴同床"传统极普遍,但 AAP 任何情况下都不推荐 bed-sharing(双胞胎也一样;立场对立 Karp 028)。
    AAP:房间共睡可降 SIDS 50%。
    具体死亡风险倍数:沙发 / 扶手椅 67×、impaired 大人 10×、4 月内宝宝 5-10×、早产 / 低体重 2-5×。
  what_to_do:
    - crib / bassinet 放卧室,伸手可及
    - 至少持续到 6 月,最好 1 年
    - 喂奶 / 安抚完移回 crib,绝不一起睡过去
    - 沙发 / 扶手椅 100% 不一起睡(67 倍死亡风险)
    - 早产 / 低体重宝宝 4 月内额外小心(2-5×)
  failure_mode: |
    哺乳完累了一起睡着 → 67 倍风险(尤其在沙发上)。
    喝酒 / 吃药 / 吸大麻后 bed share → 10+ 倍。
  evidence_level: A

  positions:
    issue: 同床 vs 同房不同床 · 何时安全 · SIDS 风险 · 分龄差异
    views:
      - school: Karp
        source: SRC-003
        stance: 在 10 步安全协议下可同床(无烟酒、硬床垫、无松软被等);否则不建议。
      - school: AAP
        source: SRC-004
        stance: 严禁 bed-sharing。推荐同房不同床(共室不共床)到 6 月,可降 SIDS 50%。
      - school: Brazelton
        source: SRC-010
        stance: 不给统一指南,视家庭文化决定;睡眠安排是亲子关系的反映,无单一正确答案。
      - school: 松田道雄
        source: SRC-024
        stance: 分龄立场 — 3 月内禁同床(母乳房压窒息风险);8 月后可同床(寒冷季节实用,母乳更增多)。
      - school: 中国传统
        stance: 普遍同床(便于喂奶 / 保暖 / 安抚),无明确安全协议;部分家庭长期同床至学龄。

card_id: C-S1-072
stages: [S1]
tags: [philosophy]

front:
  title: 1 月龄脑发育 7 大刺激柱
  hook: 不是越刺激越好,要系统

back:
  why_matters: |
    早教 ≠ 越多刺激越好。鲍秀兰列 1 月龄脑部发育的 7 大刺激柱:营养 / 关爱 / 语言 / 触觉 / 视觉 / 外语 / 家庭共识。
    每柱独立操作但缺一不可,核心理念:**温和系统的家庭氛围 > 单一密集刺激**。
    错过任一柱:营养差影响神经髓鞘化;缺爱致焦虑型依恋;语言贫乏延迟说话 — 整体打折扣。
  what_to_do:
    - ① 营养充足(母乳 / 配方 / 维 D 400 IU)
    - ② 持续关爱 + 皮肤接触(建安全感)
    - ③ 日常说话唱歌喊名字(语言环境)
    - ④ 解读情绪,作出反应(社会反馈)
    - ⑤ 视觉刺激(你的脸 + 彩色物品)
    - ⑥ 双语家庭可外语刺激(可选)
    - ⑦ 全家照顾人共识早教重要性
  failure_mode: |
    只重视单一(如只买玩具不抱)→ 系统失衡。
    家中一人重视早教,其他人无所谓 → 共识缺失,效果打折。
  evidence_level: B


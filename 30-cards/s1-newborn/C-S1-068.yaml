card_id: C-S1-068
stages: [S1]
tags: [safety]

front:
  title: 照料新生儿 4 大禁忌
  hook: 禁烟 / 微波奶 / 肘试温 / 玩具固定

back:
  why_matters: |
    1 月龄新生儿生理脆弱,常见照料疏忽可能致命。
    鲍秀兰列 4 件最容易出问题的事:二手烟提高 SIDS 风险 2-3 倍 / 微波加热配方奶受热不均易烫口腔 / 用手测水温感觉不准易烫伤皮肤 / 床头玩具松脱可能砸伤或缠脖窒息。
    每件都常见,每件都能避免。
  what_to_do:
    - 宝宝周围 100% 禁烟(家人外回三手烟也算)
    - 不用微波炉加热配方奶 — 隔水温热
    - 用肘内侧测水温,不用手指(感觉精度不同)
    - 床头玩具挂牢挂高,定期检查松动
    - 配方奶冲好滴几滴在手腕内侧再喂
  failure_mode: |
    觉得"开窗就行"还在屋抽烟 → SIDS 风险升 2-3 倍。
    微波奶不摇匀直接喂 → 口腔黏膜烫伤。

  evidence_level: B

  positions:
    issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
    views:
      - school: Karp
        source: SRC-003
        stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
      - school: AAP
        source: SRC-004
        stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
      - school: 鲍秀兰
        source: SRC-009
        stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
      - school: 海蒂
        source: SRC-040
        stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

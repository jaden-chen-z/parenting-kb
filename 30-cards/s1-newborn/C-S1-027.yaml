card_id: C-S1-027
stages: [S1]
tags: [safety, philosophy]

front:
  title: 包裹 + 白噪音 = 延长睡眠 1-2 小时
  hook: 5S 法过夜不放手

back:
  why_matters: |
    Karp 实战经验:整晚保持包裹 + 白噪音的婴儿,
    睡眠时段从 3 小时延长到 4 小时,夜醒减少 1-2 次。
    关键是"整晚",不是只入睡时——
    入睡后撤掉刺激,宝宝在浅睡阶段会因环境变化惊醒。
    必须配仰睡 + 婴儿床无松散物(SIDS 预防底线,详见 016/038)。
    4 月翻身后必须停包(否则窒息风险骤增)。
  what_to_do:
    - 整晚保持包裹紧度,不要入睡后松开
    - 白噪音整晚开着,别只在入睡时放
    - 仰睡 + 婴儿床无松散物(SIDS 预防)
    - 黎明早醒加遮光窗帘 + 白噪音遮鸟叫狗叫
  failure_mode: |
    入睡后撤掉包裹/关白噪音 → 转换刺激,惊醒。
    以为"夜里太吵会吵醒他" → 错过白噪音的过夜效果。
  evidence_level: C

  positions:
    issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
    views:
      - school: Karp
        source: SRC-003
        stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
      - school: AAP
        source: SRC-004
        stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
      - school: 鲍秀兰
        source: SRC-009
        stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
      - school: 海蒂
        source: SRC-040
        stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

card_id: C-S1-027
stages: [S1]
tags: [safety]

front:
  title: 包裹 + 白噪音 = 延长睡眠 1-2 小时
  hook: 5S 法过夜不放手

back:
  why_matters: |
    Karp 实战经验:整晚保持包裹 + 白噪音的婴儿,
    睡眠时段从 3 小时延长到 4 小时,夜醒减少 1-2 次。
    关键是"整晚",不是只入睡时——
    入睡后撤掉刺激,宝宝在浅睡阶段会因环境变化惊醒。
    必须配仰睡 + 婴儿床无松散物(SIDS 预防底线,详见 016/038)。
    4 月翻身后必须停包(否则窒息风险骤增)。
  what_to_do:
    - 整晚保持包裹紧度,不要入睡后松开
    - 白噪音整晚开着,别只在入睡时放
    - 仰睡 + 婴儿床无松散物(SIDS 预防)
    - 黎明早醒加遮光窗帘 + 白噪音遮鸟叫狗叫
  failure_mode: |
    入睡后撤掉包裹/关白噪音 → 转换刺激,惊醒。
    以为"夜里太吵会吵醒他" → 错过白噪音的过夜效果。
  evidence_level: B


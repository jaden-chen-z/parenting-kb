card_id: C-S1-125
stages: [S1]
tags: []

front:
  title: 摇晃止哭,60次/分起步
  hook: 跟人类走路速度相同

back:
  why_matters: |
    Ambrose (1969) 实验测过:50 转/分以下摇晃**几乎无效**。
    一过 60 转/分,几乎所有婴儿都停哭,心跳从 200/分降到休息水平,呼吸变规律。
    Bowlby 解释这跟**人类走路速度对应**:母亲背着 / 抱着婴儿走路时的频率正好 ≥60 转/分。
    几十万年进化下来,婴儿在这频率下"知道妈妈在动",自动停哭。
    所以摇晃止哭不是"被惯坏",是**进化设计的安抚机制**。
  what_to_do:
    - 摇晃频率 ≥60 次/分(秒针节奏)
    - 上下幅度配合左右晃动(模拟走路)
    - 小于 50 次/分 = 太慢无效
    - 不疲劳化 — 持续有效不需要"加大力度"
    - 摇晃不止哭,可叠加吸吮(奶嘴)
  failure_mode: |
    用力摇晃可致摇晃婴儿综合征(SBS),60 次/分是节奏不是力度,温柔但有节奏。
    "怕宠坏不抱不摇"违背进化设计,反而拖长哭闹。
  evidence_level: B


card_id: C-S1-123
stages: [S1]
tags: [philosophy, controversy]

front:
  title: 出生几天就能认妈妈
  hook: 不靠脸,靠声音和气味

back:
  why_matters: |
    家长以为"小婴儿啥也不懂"。错。
    Bowlby 引 DeCasper & Fifer (1980)、Macfarlane (1975) 等实验:**新生儿出生后几天就能区分母亲气味和声音**。
    判断方法:把母亲跟陌生人的乳垫 / 录音同时呈现,新生儿转头 + 加速吸吮,选择母亲。
    "认脸"要到 14 周(3.5 月),但**听声 + 闻味早 14 周就有差别对待**。
    这是依恋形成的起点。
  what_to_do:
    - 多跟新生儿说话,声音熟悉度比内容重要
    - 喂奶时让宝宝闻你皮肤气味(不香水)
    - 第三周起女性嗓音特别有效(止哭 + 引微笑)
    - 即使新生儿"看起来无表情",你的声音和气味都在被记忆
  failure_mode: |
    "宝宝太小什么都不知道,等他大点再亲" → 错失关键学习窗口。
    陌生气味(浓香水 / 烟味)可能让新生儿反而退缩。
  evidence_level: A


card_id: C-S1-033
stages: [S1]
tags: [red_flag]

front:
  title: 产后抑郁的 3 阶段识别
  hook: 不是软弱,是医学疾病

back:
  why_matters: |
    产后抑郁(PPD)是产后女性的抑郁症状谱,不是软弱是医学疾病。
    Karp 在附录 B 给的 3 阶段:
    **Baby Blues(40%)**:轻度哭泣 / 焦虑 / 失眠,几周自然过。
    **真正 PPD(5%)**:深度悲伤 + 伤害自己/宝宝幻想 → 必须就医。
    **产后精神病(0.1%)**:幻听幻视语无伦次,2 周内多见 → 立即就医。
    Karp 强调"和过敏症一样,是病不是失败",鼓励主动求医。
  what_to_do:
    - Baby Blues:几周内自然过去,有家人支持就够
    - 真正 PPD:出现"伤害自己/宝宝幻想"立即就医
    - 治疗有效:药物 / 心理治疗 / 光疗
    - 排查甲状腺(产后甲减也能造成类似抑郁)
  failure_mode: |
    自责"我不是好妈妈"沉默不求助 → 拖延加重。
    产后精神病拖到出现幻觉才就医 → 危险窗口已过。
  evidence_level: A


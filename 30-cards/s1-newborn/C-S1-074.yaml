front:
  title: 新生儿的六种状态
  hook: 别只看"睡了"或"醒了",中间还有四种

back:
  why_matters: |
    Brazelton 把新生儿的意识状态分成六种:深睡、浅睡、瞌睡、安静警觉、烦躁、哭闹。
    不同状态决定宝宝能不能被互动、能不能吃奶、能不能被安抚。比如"安静警觉"状态下宝宝才能看你的脸、听你的声音,整个人会"亮起来",这是和宝宝交流的黄金窗口,通常一天只有几次,每次几分钟。
    父母如果学会识别这六种状态以及宝宝在它们之间切换的方式,就拿到了理解宝宝的"操作手册"。
  what_to_do:
    - 学会区分深睡/浅睡(浅睡眼皮会动)
    - 抓住"安静警觉"窗口跟宝宝互动
    - 烦躁前期就介入,别等大哭
    - 观察宝宝是慢切换还是快切换
    - 别在哭闹状态硬塞奶
  failure_mode: |
    把宝宝简化成"睡-吃-哭"三档,看到宝宝睁着眼就要互动,看到一闹腾就喂奶。
    结果该睡不睡、该玩不玩,宝宝越来越混乱,父母越来越疲惫,误把状态切换的正常波动当成"宝宝有毛病"。
  evidence_level: B


card_id: C-S1-763
stages: [S1]
tags: [cleft-lip, cleft-palate, surgery-timing]

front:
  title: 唇腭裂手术时机
  hook: 3 月 5kg 后做唇裂

back:
  why_matters: |
    松田给硬时机表 — 中国家长易听偏方/急于早做。
    唇裂:3 月左右 + 体重 > 5 kg 做(术后可几乎不留瘢痕)。
    唇裂痕红 1 年自然消;4-5 岁可修补;鼻整形 10 岁后(鼻部还在长)。
    腭裂:1.5-3 岁有争议(早做利吃奶/防发音异常,但伤牙胚)。
  what_to_do:
    - 唇裂等 3 月 + 5 kg 才手术
    - 唇裂痕术后红 1 年别二次手术
    - 找专门做这种手术的医院
    - 腭裂宝宝防慢性中耳炎
    - 1 次手术解决不了,需多次
  failure_mode: |
    妈急于"出生立刻手术" → 体重低 + 瘢痕大 + 后续要二次修补。
  evidence_level: B


card_id: C-S1-014
stages: [S1]
tags: [philosophy, controversy]

front:
  title: 关于包裹的 6 种常见误解
  hook: 别让误解挡住最有效的招

back:
  why_matters: |
    包裹(swaddle)是 5S 第一招,模拟子宫感安抚新生儿。
    但中国家长常受老一辈影响,对包裹有 6 个常见误解,
    导致犹豫不敢用。
    Karp 在《卡普新生儿安抚法》第 8 章逐条反驳,
    这些误解会让你在最有效的工具面前犹豫,错过安抚窗口。
  what_to_do:
    - '"原始?" → 进食和睡眠也原始,有效就用'
    - '"他不舒服?" → 他挣扎是因为含不到手指'
    - '"禁闭感?" → 新生儿主动渴望被裹住'
    - '"惯坏?" → 4 个月后自然不需要,临时工具'
    - '"妨碍吮指/认识世界?" → 减手干扰反而专注'
  failure_mode: |
    把成年人的"自由偏好"投射到新生儿 → 不敢包。
    用"大宝/朋友家不爱包"否定 → 没试就放弃。
  evidence_level: C

  positions:
    issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
    views:
      - school: Karp
        source: SRC-003
        stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
      - school: AAP
        source: SRC-004
        stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
      - school: 鲍秀兰
        source: SRC-009
        stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
      - school: 海蒂
        source: SRC-040
        stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

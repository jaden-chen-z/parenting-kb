card_id: C-S1-014
stages: [S1]
tags: [philosophy]

front:
  title: 关于包裹的 6 种常见误解
  hook: 别让误解挡住最有效的招

back:
  why_matters: |
    Karp 列了父母不敢包的 6 个理由,逐条反驳。
    这些误解会让你在最有效的工具面前犹豫,错过安抚窗口。
  what_to_do:
    - "原始?" → 进食和睡眠也原始,有效就用
    - "他不舒服?" → 他挣扎是因为含不到手指
    - "禁闭感?" → 新生儿主动渴望被裹住
    - "惯坏?" → 4 个月后自然不需要,临时工具
    - "妨碍吮指/认识世界?" → 减手干扰反而专注
  failure_mode: |
    把成年人的"自由偏好"投射到新生儿 → 不敢包。
    用"大宝/朋友家不爱包"否定 → 没试就放弃。
  evidence_level: C


card_id: C-S1-019
stages: [S1]
tags: []

front:
  title: 摇晃要小幅快速,不大幅缓慢
  hook: 抖一抖,像晃奶瓶

back:
  why_matters: |
    摇晃(swing)是 5S 第四招。
    Karp 说最常见误区是"大幅缓慢"——
    父母直觉"温柔慢摇"对宝宝好,实际激活不了镇静反射。
    子宫里宝宝一直被妈妈走路颠簸,他需要小幅快速节奏:
    振幅 30-60cm,频率每秒 2-3 次。
    与 SBS(摇婴综合征)(摇晃婴儿综合征)关键区别在加速度,不在频率(详见 020)。
  what_to_do:
    - 振幅 30-60 厘米(像晃奶瓶)
    - 频率每秒 2-3 次
    - 撑住头部和脖子,头与身体保持直线
    - 见效后慢慢降低速度,转为催眠式轻摆
  failure_mode: |
    大幅缓慢摇 → 没节奏,激活不了反射。
    摇时头乱晃 → 危险,可能伤颈椎(见 020 SBS(摇婴综合征))。
  evidence_level: B


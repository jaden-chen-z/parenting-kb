card_id: C-S1-073
stages: [S1]
tags: [philosophy]

front:
  title: 新生儿就是一个独立的人
  hook: 同一天出生,性格已经天差地别

back:
  why_matters: |
    NBAS(新生儿行为评估量表)是 Brazelton 团队花 30 多年开发的工具,在全世界医院通用,核心理念是把宝宝当成"主动参与者"来评估。它要测的不是平均表现,而是宝宝的最佳表现。
    Brazelton 的核心主张是:刚出生几天的宝宝,睡眠/吃奶/被安慰/对刺激反应的方式,已经在告诉你他是"什么样的人"。
    父母不要拿宝宝跟别人家比,要观察自己宝宝独特的风格,这是后续养育的全部起点。
  what_to_do:
    - 出生头几天就观察宝宝独特反应
    - 别拿别人家宝宝当标准
    - 记下宝宝怎么从哭到睡的过渡
    - 主动问医生"我宝宝是什么风格"
    - 把"差异"当个性而非问题
  failure_mode: |
    用网上"标准新生儿"模板套自己宝宝,看他不一样就焦虑或当成毛病。
    其实从出生第一天起,每个宝宝在感官敏感度、安抚方式、状态切换速度上就有差异,这些就是个性,不是缺陷。
  evidence_level: B


card_id: C-S1-051
stages: [S1]
tags: [safety]

front:
  title: 奶嘴:3-4 周后用,4 岁前戒
  hook: 选购 + 戒断都有讲究

back:
  why_matters: |
    奶嘴(pacifier)+ 拇指吸吮 = 满足婴儿"非营养性吸吮"先天需求(不出奶但能吸,有安抚效应)。
    AAP:奶嘴助安抚 + 降 SIDS,但**母乳建立后 3-4 周**再用(避免混淆乳头)— 与 Karp 022 一致。
    选购硬指标:整体一体 + 盾片 ≥ 1.5 英寸 + 6 月前每日消毒。
    持续吸 2-4 岁后影响嘴型和牙齿对齐;永久牙长出前停 → 牙齿能自然矫正。
  what_to_do:
    - 母乳:稳了再用(约 3-4 周);配方奶宝宝随时
    - 选购:整体一体 + 盾片 ≥ 1.5 寸 + 有气孔
    - 6 月前每日消毒(开水煮 / 洗碗机)
    - 不挂脖子 / 不系衣服 / 不替代正餐(窒息 + 干扰喂养)
    - 永久牙长前(2-4 岁)戒断 — 鼓励为主,别惩罚
  failure_mode: |
    出生第一周给奶嘴 → 母乳混淆乳头,母乳难建立。
    4 岁后还吸 → 牙齿前突错位,可能要正畸。
  evidence_level: A

  positions:
    issue: 安抚奶嘴何时用 · 是否影响发育 · 何时戒
    views:
      - school: Karp
        source: SRC-003
        stance: 鼓励使用,但母乳建立后 3-4 周再用,防乳头混淆。配方奶宝宝可即用。
      - school: AAP
        source: SRC-004/006
        stance: 鼓励 — 是 SIDS 保护因子;睡眠时给;4 岁前戒以防牙列影响。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对 — 妨碍婴儿嘴部发声练习与口腔早期探索;主张让孩子用嘴部自我安抚替代。
      - school: Davies
        source: SRC-014
        stance: 接受 0-1 岁安抚作用,但 1 岁前戒,防影响牙列发育和语言起步。

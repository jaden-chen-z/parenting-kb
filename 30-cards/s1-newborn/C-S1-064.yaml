card_id: C-S1-064
stages: [S1]
tags: [safety, controversy]

front:
  title: 0-12 月疫苗时间表速查
  hook: 出生 / 2 月 / 6 月 / 12 月 4 节点

back:
  why_matters: |
    疫苗(immunizations)= 20 世纪降低 1 岁内婴儿死亡率最大贡献因素之一(超过抗生素 + 净水)。
    AAP 时间表是基于群体免疫 + 各疾病高危月龄精心设计的 — 跳过任何一剂都会增风险。
    0-12 月 **4 个集中节点**:出生 / 2 月 / 6 月 / 12-18 月。
    国内疫苗时间表与 AAP 略有差异(中国增 BCG 卡介苗 / 部分疫苗时机不同),但核心相通。
  what_to_do:
    - "**出生**:Hep B 1(24h 内)+ RSV 可选(C-S1-063)"
    - "**1-2 月**:Hep B 2"
    - "**2 月集中 5 个**:DTaP / Hib / IPV / PCV / Rotavirus 第 1 剂"
    - "**6 月**:Hep B 3 + COVID(6-23 月)+ Influenza"
    - "**12-18 月**:MMR / Varicella / HepA 第 1 剂(C-S5-007)"
  failure_mode: |
    拖延 / 推迟"等大点再打" → 错过保护期感染(百日咳 / 麻疹 / 流感重症)。
    信"疫苗致自闭症"网传 → 已被 1.5+ 亿样本独立研究反复否定(LEAP 之前最大育儿误区)。
  evidence_level: A


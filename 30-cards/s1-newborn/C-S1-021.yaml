card_id: C-S1-021
stages: [S1]
tags: []

front:
  title: 非营养性吸吮是先天需求
  hook: 他吸吮是为了安抚

back:
  why_matters: |
    宝宝天生需要频繁吸吮,远超喂养所需的次数。
    这种吸吮不是为了奶,是为了激活镇静反射 + 释放安抚激素。
    一天可能上百次,母乳建立期妈妈乳头就是最好的"奶嘴"。
  what_to_do:
    - 把"宝宝吸吮 ≠ 饿了"区分清楚
    - 5S 完成后给奶嘴/手指作"糖霜"(收尾激活反射)
    - 母乳建立期就是妈妈乳头
    - 教含奶嘴用"逆反心理":轻拽他更用力含
  failure_mode: |
    觉得吸吮 = 饿 → 频繁喂奶,过度喂养 / 反流加重。
    强行夺奶嘴/手指 → 错过最好的收尾安抚。
  evidence_level: B


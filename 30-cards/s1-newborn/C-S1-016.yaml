card_id: C-S1-016
stages: [S1]
tags: [safety, red_flag]

front:
  title: 侧抱只能安抚,睡觉禁止
  hook: 入睡只能仰躺

back:
  why_matters: |
    SIDS(婴儿猝死综合征)= 1 岁内婴儿睡眠中无明显原因猝死,
    美国年约 3500 例,1 岁内主要死因之一,2-4 月最高发。
    趴睡 / 侧睡都会显著增加 SIDS 风险(约 6× 风险)。
    1992 年 AAP 推 "仰睡" 运动后,
    美国 SIDS 死亡数从每年 6000 降到 3500(降 ~40%)。
    Karp 的"侧抱"是 5S 之一,只用于清醒时安抚——
    **绝对不能让宝宝侧 / 趴入睡**。
  what_to_do:
    - 清醒时可以侧抱/趴抱(安抚效果好)
    - 入睡 100% 仰躺,无松散卧具,无枕头
    - 侧躺也别用 — 容易翻成趴卧
    - 这条是底线,别因为"他更愿意趴睡"妥协
  failure_mode: |
    侧抱有效 → 夜里也让他侧/趴睡 → SIDS 风险翻倍。
    用枕头/卷布固定姿势 → 反而增加窒息风险。
  evidence_level: A


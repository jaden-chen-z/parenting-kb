front:
  title: "初乳头 5 天黄金"
  hook: "5 天黄金的浓汤"

back:
  why_matters: |
    Colostrum(初乳)= 出生后头 2-5 天分泌的黏稠黄色乳。
    成分独特:
    - sIgA 浓度 > 成熟乳 100 倍
    - lactoferrin 高浓度
    - 生长因子(EGF / IGF-1) 帮肠道发育
    - 量极少:出生第 1 天约 5 ml/餐(婴儿胃容量恰好)
    WHO + BFHI:出生 1 小时内开奶就是为了娃尽早得到初乳。
    中国传统'初乳脏要挤掉' / '没奶用配方过渡' → 错过初乳免疫黄金窗。
  what_to_do:
    - "出生头 2-5 天的黄色黏稠乳是初乳,不是 '没奶'"
    - "初乳量小但浓度高 — 5 ml 等于配方 50 ml 营养"
    - "听到 '初乳脏要挤掉' → 别信(老传统错的)"
    - "听到 '没奶用配方过渡' → 也别信(初乳期是正常)"
    - "1 小时内开奶 + 频繁吸吮 → 助初乳到成熟乳过渡"
  failure_mode: |
    丢初乳或加配方过渡 → 错过 sIgA 100x 浓度免疫黄金窗。
    初乳是 evolutionary 设计完美的第一份食物。
  evidence_level: A


card_id: C-S1-2506
stages: [S1]
tags: []

front:
  title: 婴儿背带袋鼠护理 5 益处
  hook: 几千年人类智慧,现代证据加持

back:
  why_matters: |
    "穿宝宝出门"(背巾 / 背带)不是新潮 — 几千年来有袋动物和大多数人类文化都这么干。

    海蒂列出 5 大益处:
    1) **方便**:父母腾手做事(做饭 / 带老大)
    2) **宝宝舒适**:被抱 + 体温 + 心跳 = 宫内环境复刻
    3) **父母快乐**:亲密接触刺激催产素,降低产后焦虑
    4) **减肠绞痛**:背带里直立位 + 节奏感 = 黄金安抚(C-S1-2501 关联)
    5) **促进发育**:宝宝看世界视角丰富,语言输入更多

    海蒂提醒区分类型:新生儿用包裹式 / 环式("自然胎位"),坐稳后才能用前向背架。
  what_to_do:
    - 0-4 月:包裹式或环式背巾,宝宝面朝里贴胸
    - 4-6 月:前向背带(软结构 SSC),仍面朝里
    - 6 月后(能稳定坐):面朝外或背后
    - '安全口诀"5 紧"(英文 TICKS):**紧**(贴宝宝) / **看得见脸** / **近到能亲到** / **下巴抬起**(别贴胸) / **背部有支撑**'
    - 单次背 ≤ 2 小时,中间放下活动
    - 宝宝睡着 → 立即检查呼吸道(下巴别贴胸)
  failure_mode: |
    背带太松 + 宝宝下巴贴胸 → 气道阻塞窒息(背带类婴儿猝死实有案例)。
    新生儿用前向硬背架 → 颈部不能撑头部,易窒息。
    背着做剧烈运动 / 骑车 / 烹饪热油 → 宝宝撞伤 / 烫伤风险。
    觉得"包裹式总安全"忘"5 紧"口诀 → 仍可窒息。
  evidence_level: B


card_id: C-S1-056
stages: [S1]
tags: [safety, red_flag]

front:
  title: 汽车座 rear-facing 后排,不副驾
  hook: 副驾气囊弹出致命,首次回家就用

back:
  why_matters: |
    汽车座(car safety seat)= 婴儿 / 幼儿汽车专用座椅,法律 + 医学双重要求。
    车祸是 1 岁以上儿童意外死亡主因,美国每年数千件儿童车祸死亡,大多数可用 car seat 预防。
    AAP 立场最硬:第一次从医院回家就用,**rear-facing + 后排** 至少到 2 岁(看 manufacturer 限重)。
    **绝不副驾**(passenger air bag 弹出 = 婴儿头部撞击致死)。
    短途 / 慢速也用 — 短途车祸反而最多。
  what_to_do:
    - 第一次从医院回家就用(医院出院前装好)
    - rear-facing + 后排,至少到 2 岁(多数 convertible 座支持 2 年+)
    - "**绝不放副驾**(气囊弹出致命)"
    - 每次坐车都用,短途也用
    - 检查安装:说明书 + LATCH 系统 + 安装后晃动 < 2.5 cm
  failure_mode: |
    觉得"短途不用 / 抱着也行" → 急刹时婴儿撞玻璃。
    放副驾"方便照看" → 气囊弹出秒杀。
  evidence_level: A


card_id: C-S1-010
stages: [S1]
tags: [philosophy]

front:
  title: 镇静反射:婴儿的"关闭按钮"
  hook: 不是哄,是按开关

back:
  why_matters: |
    镇静反射 = Karp 假设的胎儿期遗存反射(C 级证据,无神经学正式定义)。
    Karp 推测:胎儿在子宫里乱踢会扯断脐带或撞伤胎盘 → 致死。
    自然选择压力 → 进化出"被子宫感官刺激就关机"的反射。
    出生后这个反射还在,但需要持续、足够强度的子宫刺激才能激活。
    5S 安抚法就是出生后激活这个"关闭按钮"的开关组合。
  what_to_do:
    - 把 5S 当成"按按钮",不是"温柔哄"
    - 强度要够,模拟子宫的紧、响、晃
    - 反射激活后,通常几秒到 2 分钟内见效
    - 没效说明强度/同步没到位,不是反射不存在
  failure_mode: |
    把 5S 做得"温柔" → 力度不够,激活不了反射。
    试一两次没用就放弃 → 错过反射的入口期。
  evidence_level: C


card_id: C-S1-868
stages: [S1]
tags: [shonkoff, nrc, premie, low_birthweight, special_needs]

front:
  title: "早产儿调节难加倍"
  hook: "早产儿要先稳节律"

back:
  why_matters: |
    NRC 综述 Ch 5 + Ch 8 给早产 / 低出生体重儿育儿建议(中国家长高频):
    **早产儿 vs 足月儿差异**(NRC 综述):
    1. **节律建立慢** — 体温 / 睡醒 / 进食节律比足月儿延迟数周
    2. **更难读懂** — 眼神接触少 / 笑少 / 发声少 / 不可预测
    3. **更难安抚** — fuss → cry 转换更快,反应更剧烈
    4. **妈妈压力大** — 容易陷入"读不懂 → 焦虑 → 反应失调 → 关系恶化"循环
    **NRC 立场**:重点不在"宝宝有什么问题",而在"找到能调节他的策略":
    - 接受早产儿 4-6 周才稳节律(比足月儿 3 月晚)
    - 重点先建睡醒节律,情感互动先放后
    - 长哺乳 / 多 skin-to-skin → 大量数据支持节律加快
    - 早期干预(home visiting)能短路恶化循环
    **跟 Brazelton NBAS 一致** — 早产儿评估同框架。
    **对中国家长**:
    - 早产儿前 6 周特别折腾不是你的错 — 神经系统延迟
    - 别拿足月儿标准比 — 看校正月龄(corrected 月龄)
    - 多 skin-to-skin / 多哺乳 / 少刺激 → 加快节律稳定
    - 早期干预服务别拒(医院随访 / 健康宝宝 follow-up)
  what_to_do:
    - 用校正月龄不实际月龄
    - 多 skin-to-skin 多哺乳
    - 减声 / 减光 / 减刺激
    - 接早期干预家访
    - 别比足月儿标准
  failure_mode: |
    "我家孩子早产但已经满月了 — 跟正常宝宝比" — 错。校正月龄(实际月龄 - 早出生周数)才准。
    "他这么难带肯定是有问题" — 大概率不是"问题"是早产神经延迟。
    "早期干预服务我们用不上" — 错,NRC 数据明确建议早产儿入早期干预。
  evidence_level: A


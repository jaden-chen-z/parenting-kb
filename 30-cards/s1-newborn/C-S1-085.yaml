card_id: C-S1-085
stages: [S1]
tags: [controversy, safety]

front:
  title: 同床 vs AAP 的立场分歧
  hook: Brazelton 与 AAP 不一致

back:
  why_matters: |
    Brazelton 流派与 AAP 立场对照点:AAP 警告同床(co-sleeping)会增加 SIDS 风险,特别是 11 周内婴儿。
    Brazelton 怀疑这些研究中其他变量(醉酒父母、不安全床品)才是元凶,但承认父母决策时应考虑 AAP 立场。
    Brazelton 自己反对硬性同床的核心担忧:婴儿期同床的孩子日后独睡会更难、3-4 岁是观察孩子准备分床信号的窗口期、拖到学龄会留分离问题。
    同床若让父母关系产生摩擦则一定毁孩子未来。
    Brazelton 的折中:"父母关系好坏比睡眠安排更影响孩子发展"。
  what_to_do:
    - 决策前夫妻必须真正一致
    - 不要在期待二胎时强行让大孩分床
    - 用过渡床(贴主床的小床)开始分床
    - 3-4 岁观察"能否独立"信号
    - 若一方明确不舒服必须停同床
  failure_mode: |
    父母一方同床一方反对,孩子接收冲突信号比独睡或同床本身更具破坏性;或文化照搬:硬学西方独睡 / 硬学亚洲同床而不评估自家情况。
  evidence_level: B

  positions:
    issue: 同床 vs 同房不同床 · 何时安全 · SIDS 风险 · 分龄差异
    views:
      - school: Karp
        source: SRC-003
        stance: 在 10 步安全协议下可同床(无烟酒、硬床垫、无松软被等);否则不建议。
      - school: AAP
        source: SRC-004
        stance: 严禁 bed-sharing。推荐同房不同床(共室不共床)到 6 月,可降 SIDS 50%。
      - school: Brazelton
        source: SRC-010
        stance: 不给统一指南,视家庭文化决定;睡眠安排是亲子关系的反映,无单一正确答案。
      - school: 松田道雄
        source: SRC-024
        stance: 分龄立场 — 3 月内禁同床(母乳房压窒息风险);8 月后可同床(寒冷季节实用,母乳更增多)。
      - school: 中国传统
        stance: 普遍同床(便于喂奶 / 保暖 / 安抚),无明确安全协议;部分家庭长期同床至学龄。

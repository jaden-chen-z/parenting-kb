card_id: C-S1-2307
stages: [S1]
tags: [safety, red_flag]

front:
  title: 家庭急救包 + 急救电话墙贴
  hook: 紧急时手抖找不到信息

back:
  why_matters: |
    海蒂数据:**急救成败差距常在前 5 分钟** — 拿绷带翻 5 分钟、找医生电话翻 3 分钟,
    都是宝贵窗口。预先做"信息工程":急救包定点 + 电话清单上墙 + 路线图熟。
    紧急时父母手抖、心慌、记忆短路 — 此时必须靠**纸质流程 + 物理位置**而非记忆。
    家长意义:不是"知道",是"能在 30 秒内做到"。
  what_to_do:
    - 急救包(便携小袋):创可贴/无菌纱布/不粘绷带/温度计/凡士林/对乙酰氨基酚/吸鼻器/小镊子
    - 墙贴电话:儿科医生 / 毒物中心 / 最近急诊 / 药店 / 邻居 / 120
    - 同款卡片放尿布包 + 司机存手机
    - 提前**实地走 1 次**到急诊室路线
    - 学**婴儿 CPR + 噎食急救课**(红十字会 / 当地医院)
  failure_mode: |
    "我手机存了号码就行" — 没电 / 找不到 / 手抖,统统失效。
    急救包散落各处 → 紧急时少一样是一样。
    课不学只看视频 → 真实姿势手感差很远,关键时打不出深度。
  evidence_level: B


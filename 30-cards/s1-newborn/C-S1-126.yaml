card_id: C-S1-126
stages: [S1]
tags: []

front:
  title: 抓握反射 = 灵长类进化遗留
  hook: 你被攥住手指有原因

back:
  why_matters: |
    Bowlby 引 Prechtl (1958)、Halverson (1937):新生儿的"莫罗反射"(Moro)+ 抓握反射,
    在传统医院测试(婴儿空手悬空)看着是怪异动作,但**放回原始情境就一目了然**:
    幼年恒河猴抓母毛、人类婴儿也是 — 防止从母亲身上掉下去。
    人类进化丢了大部分母毛,反射保留了 — 所以宝宝抓什么都行(头发 / 衣领 / 手指)。
    这不是"乱抓",是 30 万年进化遗留的依恋成分。
  what_to_do:
    - 给宝宝攥东西:你的手指 / 软玩偶 / 衣领 — 都满足这反射
    - 不强行掰开宝宝攥的手(可能引发哭闹)
    - 玩"莫罗反射"游戏 — 突然轻放(婴儿会反射性抓你)
    - 抓握反射 3-4 月会被自主抓握取代,这是正常进化
  failure_mode: |
    "宝宝乱抓不让"过度纠正,违反进化设计。
    医院做 Moro 测试时反射看着夸张,**正常发育**,不是病。
  evidence_level: B


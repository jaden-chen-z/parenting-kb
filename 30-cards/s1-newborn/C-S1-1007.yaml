stages: [S1]
tags: []

front:
  title: "出院衔接很关键"
  hook: "出院后才是真考验"

back:
  why_matters: |
    BFHI 第 10 步:'Coordinate discharge so that parents and their infants have timely access to ongoing support.'
    出院衔接:产院 → 社区 / 居家母乳支持 / 哺乳顾问 / 母乳支持小组。
    母乳建立失败的高峰常在出院后 1-2 周(困难刚来,没人接)。
    国际母乳协会(La Leche League)/ IBCLC 哺乳顾问 / 妇幼保健所 / 微信母乳群。
    中国产院出院支持薄弱 — 需要妈妈主动找。
  what_to_do:
    - "出院前问产院'有没有出院后母乳支持电话/转介'"
    - "提前找居家哺乳顾问(IBCLC 资质)"
    - "加母乳支持微信群(同月龄 / 同城)"
    - "妇幼保健所有母乳门诊 — 出院后 1 周复诊"
    - "1-2 周内有任何疑问立刻问 — 别熬"
  failure_mode: |
    出院后没人接 + 自己熬 → 喂不上 / 涨奶 / 痛 / 放弃 → 加配方奶 → 母乳率下降。
    出院前就该铺好支持网。
  evidence_level: A


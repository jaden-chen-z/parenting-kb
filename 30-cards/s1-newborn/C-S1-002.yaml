card_id: C-S1-002
stages: [S1]
tags: [philosophy]

front:
  title: 子宫四感官:温暖紧裹响动摇
  hook: 安静婴儿房 ≠ 舒服环境

back:
  why_matters: |
    宝宝在妈妈肚子里待了 9 个月——那里又暖又紧,
    声音很大(85 分贝,比吸尘器还响),还一直在晃。
    你给他准备的安静婴儿房,他反而觉得陌生。
  what_to_do:
    - 温度:保暖到位 + 戴小帽(头部失热占 25%)
    - 紧裹:模仿子宫壁紧贴感,把双臂裹进去
    - 声音:全天开白噪音,不要刻意安静
    - 摇晃:抱着多走动,别让他长时间静止
  failure_mode: |
    营造"安静、宽敞、亮堂"的环境 → 宝宝反而焦虑。
    4 项里只做 1-2 项 → 5S 没法完整起效。
  evidence_level: C


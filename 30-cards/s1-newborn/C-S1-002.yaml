card_id: C-S1-002
stages: [S1]
tags: [philosophy]

front:
  title: 子宫四感官:温暖紧裹响动摇
  hook: 安静婴儿房 ≠ 舒服环境

back:
  why_matters: |
    第四产程理论(Karp 提出)认为:出生后头 3 月仍是孕期延续,
    宝宝在妈妈肚子里 9 个月已经习惯子宫的"四感官"环境。
    那里又暖又紧,声音很大(85 分贝,比吸尘器还响),还一直在晃。
    你给他准备的"理想婴儿房"——温度适中、安静、宽敞、静止——
    对他反而是陌生环境。
    模拟这 4 项就是 5S 安抚法的理论基础。
  what_to_do:
    - 温度:保暖到位 + 戴小帽(头部失热占 25%)
    - 紧裹:模仿子宫壁紧贴感,把双臂裹进去
    - 声音:全天开白噪音,不要刻意安静
    - 摇晃:抱着多走动,别让他长时间静止
  failure_mode: |
    营造"安静、宽敞、亮堂"的环境 → 宝宝反而焦虑。
    4 项里只做 1-2 项 → 5S 没法完整起效。
  evidence_level: C


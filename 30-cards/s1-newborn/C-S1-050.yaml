front:
  title: 母乳起步:每天 8-12 次,看早期信号
  hook: 哭是晚期信号,别等到才喂

back:
  why_matters: |
    "按需喂养"(responsive feeding)= 看宝宝信号决定喂,不按时间表。
    新生儿胃容量小(出生时如樱桃大),需要频繁喂。
    AAP:每天 8-12 次(白天 2-3h 上限,夜间 4h 上限);中国传统"3-4h/次"过疏。
    早期信号(唇啜 / 吸吮 / 寻乳 / 踢腿)就喂,哭已是晚期信号。
    喂越久,乳汁脂肪含量越高(hindmilk 后奶)— 别 5 分钟切边。
  what_to_do:
    - 24 小时 8-12 次喂养(白天 2-3 小时 1 次)
    - 夜间最多 4 小时不喂一次
    - 早期信号:唇啜 / 吸吮动作 / 寻乳 / 踢腿 / 警觉
    - 让宝宝吸到主动脱离 / 自然睡过去
    - 一边喂空再换,别每边定时切
  failure_mode: |
    等到哭才喂 → 已经过头,饿 + 情绪上头难有效吸。
    每边 5 分钟切来切去 → 都吃前奶,缺脂肪,长不胖。
  evidence_level: A


card_id: C-S1-049
stages: [S1]
tags: [safety, red_flag]

front:
  title: 崩溃时放下宝宝,离开 10-15 分钟
  hook: 比硬撑安抚更安全 — 防 SBS(摇婴综合征)

back:
  why_matters: |
    SBS(摇婴综合征)(摇晃婴儿综合征)= 用力摇晃造成的脑出血 / 视网膜出血,可能终身脑损伤或死亡。
    婴儿头部占体重 1/4 + 颈肌弱,你觉得"没摇多重"也可能伤;美国每年数百例,致死率 25%。
    所以大人崩溃时怎么办?AAP 救命建议:
    先放婴儿床(只有床单,没毯子玩具)→ 离开房间 10-15 分钟 →
    自己冷静(深呼吸 / 数到 10 / 听音乐 / 打电话)→ 冷静后再回。
    AAP 强调:摇 / 扔 / 打 / 砸 / 猛拽都可能让宝宝永久脑损伤甚至死亡。
  what_to_do:
    - 自己感到崩溃就放下宝宝,不硬撑
    - 婴儿床要空(只有床单)— 让他哭 10-15 分钟
    - 自己离开房间冷静(深呼吸 / 数 10 / 做家务)
    - 没冷静就再等,别勉强抱起
    - 平时跟所有看护人(配偶 / 老人 / 保姆)同步这流程
  failure_mode: |
    硬撑安抚 → 自己崩溃 → 摇晃宝宝 → SBS(摇婴综合征)(可能终身脑损伤甚至死亡)。
    觉得让他哭是"狠心" → 数据上更危险的是硬撑导致 SBS(摇婴综合征)。
  evidence_level: A


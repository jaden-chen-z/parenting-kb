front:
  title: 未成熟儿出院别松懈
  hook: 1500g 以下特别照

back:
  why_matters: |
    松田说:未成熟儿出院后调温能力弱,室温/湿度都要管。
    胃容量小 — 每次少喂、多次喂,不能套足月儿喂养表。
    黄疸消退慢,要严密观察(早产儿黄疸延长正常,但要排核黄疸)。
    妈容易"出院就放心",其实出院后头 3 月才是真考验。
  what_to_do:
    - 室温常年 22-25℃ + 湿度 60%
    - 每天称体重,日增 < 15 g 找医生
    - 喂奶 7-8 次/日,每次少
    - 黄疸 2 周不消找儿科查胆红素
    - 别盖太多 — 婴儿被中暑也常见
  failure_mode: |
    "出院就当足月儿养" → 喂太多反吐 + 调温不足脱水 + 黄疸漏 → 反复入院。
  evidence_level: B


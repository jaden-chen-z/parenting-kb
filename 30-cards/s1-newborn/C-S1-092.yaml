card_id: C-S1-092
stages: [S1]
tags: [safety, red_flag]

front:
  title: 脐带保持干燥 — 7-14 天自然脱
  hook: 不要碘酒不要酒精擦

back:
  why_matters: |
    脐带 = 母婴循环通道,出生后会自然干瘪脱落。
    **AAP 现立场(2010s 后更新)**:**自然干燥法** — 不用酒精/碘酒/紫药水,**感染率反而低**。
    7-14 天自然脱落,有少量血是正常,**大量出血或脓样分泌物 = 感染立刻就医**。
    旧观念(中国家长 + 老人常用)用 75% 酒精每天擦,WHO/AAP 已不推荐 — 反而延迟脱落 + 增感染。
    **关键反直觉**:消毒 ≠ 更安全。脐带自然干燥 = 最佳。
  what_to_do:
    - 保持干燥:**尿布折叠到脐下,不盖住**(让空气流通)
    - 洗澡:可用毛巾擦,**不要泡水到脐**(残端脱落前)
    - 不用任何"消毒水":**反对酒精/碘酒/紫药水/红药水**
    - 脱落后 1-2 天内可正常洗澡泡水
    - "**红肿 / 流脓 / 异味 / 出血量大 / 宝宝发烧 → 立刻就医**(脐炎 omphalitis 致命)"
    - 脐肉芽肿(umbilical granuloma):脱落后小红芽 → 儿科涂硝酸银
  failure_mode: |
    用酒精擦 → 延迟脱落 + 增感染;
    盖尿布上摩擦 → 反复刺激红肿;
    "好好爱护"包紧 → 不通风,潮湿,细菌温床;
    脐带带血就慌乱包扎 → 少量血正常;大量出血 + 异味才需就医。
  evidence_level: A


front:
  title: 别强逼宝宝白天不睡
  hook: 累过头反而睡不好

back:
  why_matters: |
    Karp 反对"白天累点晚上睡得好"这种思路。
    硬是让困倦的宝宝保持清醒只会让他过度疲劳,
    晚上反而睡得更差——神经系统会紊乱。
  what_to_do:
    - 白天他困了就让他睡,别故意逗醒
    - 用秋千/弹簧椅给他持续摇摆 + 白噪音
    - 用背兜带着他走,他睡觉时也在"动"
    - 晚上调暗灯光,逐步建立日夜节律
  failure_mode: |
    白天硬撑不让他睡 → 过度疲劳,神经系统崩溃。
    晚上醒得更频繁,父母自己也累垮。
  evidence_level: B


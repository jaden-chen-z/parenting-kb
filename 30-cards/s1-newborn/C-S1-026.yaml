card_id: C-S1-026
stages: [S1]
tags: [controversy, philosophy]

front:
  title: 别强逼宝宝白天不睡
  hook: 累过头反而睡不好

back:
  why_matters: |
    "白天累点晚上睡得好"是中国家长常见思路,但 Karp 反对。
    原理:新生儿神经系统尚未发育完全,缺乏自我调节能力,
    过度疲劳会让神经系统紊乱(over-tired)→ 反而难以入睡。
    硬是让困倦的宝宝保持清醒只会让晚上睡得更差。
    6 月前应"困了就睡",通过白噪音 + 摇晃维持白天睡眠质量。
  what_to_do:
    - 白天他困了就让他睡,别故意逗醒
    - 用秋千/弹簧椅给他持续摇摆 + 白噪音
    - 用背兜带着他走,他睡觉时也在"动"
    - 晚上调暗灯光,逐步建立日夜节律
  failure_mode: |
    白天硬撑不让他睡 → 过度疲劳,神经系统崩溃。
    晚上醒得更频繁,父母自己也累垮。
  evidence_level: C


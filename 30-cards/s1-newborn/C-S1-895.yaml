card_id: C-S1-895
stages: [S1]
tags: [pikler, philosophy, source-de]

front:
  title: "婴儿不是大人的玩具"
  hook: "他不是供你逗乐的物件"

back:
  why_matters: |
    Pikler 1969 德文原版核心命题:
    "Das Kind ist kein Spielzeug"(孩子不是玩具)。

    亲戚朋友老人轮流逗 — 摇 / 痒 / 高高抛 / 拍照 / 喂吃 —
    把婴儿当家庭娱乐节目。Pikler 比喻:像马戏团里被围观的人,精神早晚会崩。

    后果:婴儿持续紧张 → 哭 / 焦躁 / "敏感"(被误诊)。
    Pikler 反例:Lóczy 婴儿日常被尊重,基本不哭。

    这是 RIE 派 "respect" 和 Magda Educaring 的源头哲学。

  what_to_do:
    - 拒绝"逗一下嘛"(亲戚要抱要痒 → 礼貌挡)
    - 不要轮流抱传(婴儿没适应权)
    - 不强迫宝宝表演(招手 / 飞吻 / 说话)
    - 不在他面前持续讨论他(他听得到感受得到)
    - 给独处 + 自由动腿的时间(每天数小时)

  failure_mode: |
    "宝宝爱笑就让大家逗呗" → Pikler 反:婴儿"配合笑"
    是适应,不是开心。持续被逗 = 持续紧张 = 哭闹/不睡。
    家人疑惑"为什么这宝宝这么爱哭?"实际是被逗出来的。

  evidence_level: B


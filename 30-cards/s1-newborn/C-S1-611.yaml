card_id: C-S1-611
stages: [S1]
tags: [siblings, second-child, trauma-prevention]

front:
  title: 老大不天然爱二宝
  hook: 2 岁能让弟妹窒息

back:
  why_matters: |
    松田直言:1 个 2 岁孩子用塑料袋使 50 天婴儿窒息的案件就是例子。
    老大被剥夺"作为家庭孩子"的既得权 — 这是精神创伤。
    父母忙生孩子+接客,以为老大也会高兴 — 大错。
    "兄弟姐妹理应亲密"只是大人想法。先慰劳老大,再喂二宝。
  what_to_do:
    - 妈从产院回家先抱老大说话
    - 给老大一个漂亮新玩具
    - 3 岁以下别当老大面喂奶
    - 老大病时不和二宝同房
    - 别强迫老大"亲亲弟弟妹妹"
  failure_mode: |
    妈一回家就抱二宝喂奶 + 客人都围着新生儿 → 老大攻击二宝(掐脸/塞东西/推倒)很难防。
  evidence_level: B


front:
  title: "身份从应对中长"
  hook: "身份不是天生标签"

back:
  why_matters: |
    Spencer PVEST 关键命题 — 认同(身份)不是天生标签,是孩子主动应对环境的产物。
    1-2 岁还没明确"身份"概念,但身份的根从这阶段开始 —
    - 通过反复经验 — 形成"我是 X 的人"叙事
    - 通过应对挑战 — 形成"我能 / 我不能"自我效能
    - 通过被对待 — 形成"我值得 / 不值得"价值感意义 — 中国家长贴标签("我家娃就是内向 / 害羞 / 慢热") → 进入娃身份建构 → 长期固化。
    反向用 PVEST — 不贴标签,描述行为("今天她在 playground 试了新滑梯")。
    让娃从应对中自然涌现认同,不是被父母标签锁定。
  what_to_do:
    - "不贴'她就是 X'标签"
    - "描述行为 — 不评价人"
    - "让娃自然涌现身份"
    - "'应对挑战' 经验积累 = 自我效能"
    - "认同是应对出来的不是天生"
  failure_mode: |
    "她就是内向"标签 — 锁定娃认同长期固化。
  evidence_level: B


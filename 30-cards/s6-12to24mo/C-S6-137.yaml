card_id: C-S6-137
stages: [S6]
tags: [montessori, family, communication, grandparent, NVC]

front:
  title: 跟老人/伴侣不同步
  hook: 蒙氏 NVC 沟通法

back:
  why_matters: |
    中国家庭最大育儿爆点 — **跟老人 / 伴侣方法不同**:
    - 老人坚持"包紧 / 喂饱 / 走得早"
    - 伴侣不接受"地板床 / 不夸奖"
    - 你想"慢育儿",家里其他人想"快效率"

    家长本能:**吵 / 训 / 妥协**。结果:**关系破损 + 育儿不一致**。

    戴维斯的方案 — 借用马歇尔·卢森堡的"非暴力沟通"(NVC):

    操作 4 步:
    1. **先观察自己的情绪 + 需求**
       - 不立即开战 — 问自己"我为什么这么生气?我的什么需求没被满足?"
       - 例:"我焦虑,因为我希望宝宝有机会自主探索"
    2. **约时间谈**(不是当场吵)
       - "我想跟你聊一件对我重要的事,什么时候方便?"
    3. **客观陈述事实(不指责)**
       - 不要说:"你又干涉了!"
       - 改说:"刚才宝宝玩球时你抱起他说'小心',我注意到这种情况。"
    4. **表达自己的感受 + 需求 + 请求(不命令)**
       - "我感到 X,因为 Y 对我重要。能不能 Z?"
       - 例:"我有点担心,因为我希望宝宝学会自己感受身体边界。
         我们能想个办法,让你不担心 + 他能探索吗?"

    戴维斯推荐 5 句中文模板:
    - **"这对我很重要……"**
    - **"当 Y 发生时,我感到 X"**
    - **"我的需求是 Z"**
    - **"我们能不能……"**
    - **"你怎么看?"**

    跟老人沟通 — **滴灌式教育**:
    - 转发文章 / 视频(他喜欢的格式)
    - 分享你试新方法的故事
    - 不当面纠正 → 关系破
    - 慢慢渗透,1 年后他可能自己改

    戴维斯关键提醒:**"选战场"**。哪 1-2 件是底线?其他妥协。
  what_to_do:
    - 不当场吵 — 约固定时间谈
    - 4 步:观察自己情绪 + 客观陈述 + 表达需求 + 请求
    - 用"对我重要"+"我感到"句式
    - 跟老人滴灌(转文章,不口头训)
    - 选 1-2 件底线,其他妥协
  failure_mode: |
    "都吵了,关系都破了 — 现在改不了了" — 非暴力沟通公式可以重启对话。
    "老人不可能改的" — 1 年滴灌可能改 30-50%,关键是不口头训。
    所有事情都要当场说赢 — 关系比"赢"重要,蒙氏也讲选战场。
  evidence_level: B


card_id: C-S6-299
stages: [S6]
tags: [self, language, china_high_freq]

front:
  title: 给情感贴标签要准
  hook: 标错 = 一辈子认错

back:
  why_matters: |
    18-24 月起宝宝学会**给自己的内心体验贴标签**(高兴 / 难过 / 生气 / 害怕)— 这些标签来自**父母的命名**,标错会一辈子认错自己。
    **过程**:
    - 宝宝有一个内心体验(感觉到 X)
    - 父母**给这个体验命名**("你今天好开心啊"/"你看起来很难过")
    - 宝宝把这个**词**跟这个**体验**配对
    - 一辈子用这个词指代这种体验
    **常见错误标签**(中文家庭高频):
    - 宝宝**愤怒** → 父母说"你怎么这么不乖" → 宝宝学:"愤怒 = 我不乖"(把情感跟道德混)
    - 宝宝**恐惧** → 父母说"别哭啦,有什么好怕的" → 宝宝学:"恐惧不存在 / 应该被否定"
    - 宝宝**疲倦** → 父母说"你怎么这么烦" → 宝宝学:"疲倦 = 烦人"
    - 宝宝**兴奋** → 父母说"你疯啦" → 宝宝学:"兴奋 = 疯狂"
    - 宝宝**悲伤** → 父母说"哭什么哭" → 宝宝学:"悲伤 = 不该有"
    - 宝宝**得意** → 父母说"骄傲使人落后" → 宝宝学:"成就 = 危险"
    **Stern 关键观察**:
    - 这些"早期标签"**一辈子粘在体验上**
    - 成人后用错词描述自己感受 → 别人误解 → 关系紧张 → 自我理解混乱
    - 心理治疗核心工作之一 = **重新命名早期被错命名的体验**
    **正确命名的原则**:
    - **先识别 活力 + 情感**(澎湃?消退?喜?怒?哀?乐?惧?爱?)
    - **用基础情感词命名**(开心 / 难过 / 生气 / 害怕 / 失望 / 兴奋)
    - **不附加道德判断**("你生气了" 而非 "你怎么这么不乖")
    - **承认 即可,不必 fix**("妈知道你失望了"够了)
    - **接受混合情感**("你又开心又紧张对吧?")
    **对中国家长**:
    - 这是中国家长最大的"心理育儿盲区" — 文化习惯**否定情感**或**贴道德标签**
    - 改起来不容易,但 18-24 月是**关键窗** — 词正在跟体验配对中
    - **每次给宝宝情感贴标签前停 1 秒** — 想清楚再说跟 Lillard"描述法替讲道理"(C-S6-194)、Bowlby 安全依恋兼容。
  what_to_do:
    - 给情感贴标签前停 1 秒
    - 用基础情感词不混道德
    - '"你生气了" 而非 "你不乖"'
    - 承认 不立刻 fix
    - 接受混合情感
  failure_mode: |
    "你怎么这么不乖" → 把愤怒贴成不乖 → 宝宝一辈子混淆愤怒和道德 → 成人后压抑愤怒。
    "别哭" → 否定悲伤 → 宝宝学"我的悲伤不该存在"。
  evidence_level: A


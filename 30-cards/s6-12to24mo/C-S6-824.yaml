card_id: C-S6-824
stages: [S6]
tags: [red_flag, milestones, language, walking, matsuda, japan]

front:
  title: "1.5 岁不说话查听力"
  hook: "听不见才是真问题"

back:
  why_matters: |
    松田 给"我家娃不说话不会走"妈妈红旗判断:
    1. **不会说话**:
       - 1 周岁过 3-4 月还不会"嗯嗯""不不"先不慌;
       - 关键:**听力是否正常**(叫名字回头);
       - 让娃拿报纸 → 拿过来 = 听到 + 听懂;
       - 指爸爸 → 能指 = 没问题;
       - 多半是遗传(问爷奶语言早晚);
       - 不到 2 岁不会说话很常见;
       - 红旗:没视线对视 + 不说话 → 怀疑自闭症倾向。
    2. **不会走路**:
       - 14 月不会但 18 月还不走也常见正常;
       - 红旗:1 岁不会坐 = 真问题;
       - 抓着东西能走就 OK;
       - 冬天穿太多 / 尿布太厚 → 撤掉袜子尿布给暖房间练。
    跟鲍秀兰红旗 + AAP milestones 一致。

  what_to_do:
    - 不说话先查听力 — 叫名字回头 / 拿报纸 / 指人物
    - 视线对视 OK 就继续观察到 2 岁
    - 不会走但能扶着走就等
    - 1 岁不会坐 + 不会扶站 = 立即查
    - 没视线对视 + 不说话 = 查自闭症

  failure_mode: |
    跟邻居比派:邻居 1 岁会走 → 我家 14 月不会 → 跑医院。
    实际:18 月不走 + 抓东西能走 = 正常;
    比 milestones 要看红旗组合,不看单项延迟。
    最容易漏的是听力问题 — 1 周生病用过抗生素的娃,1.5 岁不说话**必须**查听力。
    "再等等就好了" 派:听力问题再等 = 错过早期干预黄金期。

  evidence_level: B


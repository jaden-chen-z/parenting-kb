card_id: C-S6-030
stages: [S6]
tags: [philosophy]

front:
  title: 别抢救他,让他自己赢
  hook: 挫折是养料,不是毒药

back:
  why_matters: |
    自尊不是父母夸出来的,而是孩子在受挫后自己挣脱出来的产物。Brazelton 在儿研所观察发现,孩子搭积木、拼拼图失败时眼里写着"对手";只要熬过那段挣扎,最后一块拼上,他眼睛会发亮——这道光叫"我自己干的"。
    父母此刻只要轻声一句"你自己做到的"就够。提前救他、替他完成、过度表扬,都会切掉这道光的一半,让孩子从此依赖外部赞美,而非内在能力感。
  what_to_do:
    - 任务前 30 秒按住手,数到 10 才能介入
    - 失败时不解题,只重述"这块好难"
    - 成功后只说"你自己做到的"
    - 不主动加"真棒"、不鼓掌
    - 任务确实超龄就拆步骤,不是替做
  failure_mode: |
    孩子拼图卡住、皱眉,父母心疼立刻凑过去"妈妈帮你看看"——三次后孩子学会了求助即表演,自己再不愿尝试;赢了也只是抬头看父母脸色,不再有那道发自内心的光。
    久之孩子变成"为父母表情而活"的精致取悦者。
  evidence_level: B


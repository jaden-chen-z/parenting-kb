card_id: C-S6-821
stages: [S6]
tags: [self_feeding, autonomy, japan, matsuda]

front:
  title: "1 岁起让他自己拿勺"
  hook: "饭桌是自主战场"

back:
  why_matters: |
    松田 给 1-1.5 岁吃饭核心立场：
    1. 1.5 岁能拿筷子的发育早，多数用勺;
    2. 主动拿勺要保护积极性 —
       即使弄一桌也不抢回来;
    3. 让孩子放椅子里自己舀，
       母亲用筷子帮夹副食;
    4. 30 分钟内吃完，后半程妈妈喂;
    5. **吃饭中途玩 = 不想吃了 = 停**;
    6. 长时间束缚椅子 → 孩子见椅子就食欲减;
    7. 左撇子不强改成右手 — 强改会失去用勺兴趣。
    跟 Brazelton "喂食是自主权战场" + 蒙氏"weaning table 自己拿"一致。

  what_to_do:
    - 1 岁起给勺子让自己吃
    - 不嫌弄脏，弄就弄
    - 30 分钟没吃完就停
    - 中途玩了就撤饭
    - 左撇子就左撇子，不改

  failure_mode: |
    妈妈嫌脏:"我喂得快" → 1.5 岁孩子不会用勺 → 2 岁还要喂 → 3 岁不能自理。
    奶奶担心:"撒一桌怎么行" → 强夺勺 → 孩子失去自主兴趣。
    硬塞派:"必须吃完" → 1.5 小时绑椅子 → 孩子见椅子就拒。
    替代:把"弄脏"看作过程，"自主吃"是核心目的;松田明确说"主动拿勺要保护积极性"。

  evidence_level: B


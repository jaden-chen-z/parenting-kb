card_id: C-S6-130
stages: [S6]
tags: [montessori, practical-life, independence]

front:
  title: 12-15 月生活技能起步
  hook: 自己穿 / 装 / 扔

back:
  why_matters: |
    1 岁后蒙氏教育进入 **practical life**(生活技能)阶段 — 让宝宝参与日常家务,这就是他的"工作"。
    12-15 月可以做的事(蒙氏 0-3 标准):
    | 类别 | 具体 |
    |---|---|
    | **穿衣** | 自己塞手到袖子 / 拉裤腰 / 摘袜 |
    | **吃** | 自己拿勺(乱不要紧)/ 自己拿杯 |
    | **餐后** | 自己端空碗到水池(矮桌)/ 拿抹布擦桌 |
    | **物品归位** | 玩完玩具放回低货架 |
    | **个人** | 鼻子流出自己用纸巾(你示范几次) |
    | **门** | 自己开关安全门 |
    | **垃圾** | 拿自己的尿布去垃圾桶 |
    准备物:
    - **儿童尺寸工具**(矮桌椅 / 矮挂钩 / 矮货架)
    - **真物**(真碗 / 真勺 / 真抹布,不卡通塑料)
    - **流程固定**(吃完→端碗→擦桌→放玩具)
    - **慢慢来** — 1 件 1 件加,不一次性意义:
    - **真正的独立性建立** — 不是说"独立"是做"独立的事"
    - **自我效能感** — "我能为家做事"
    - **手脚配合 + 精细动作**自然练
    - 1-3 岁是练生活技能的黄金时期家长难处:**慢 + 乱**。蒙氏立场:慢和乱是必须付的学费。
  what_to_do:
    - 12 月起每周加 1 件他能做的事
    - 工具用真物 + 儿童尺寸
    - 示范 1-2 次,然后让他做
    - 不催 / 不替 — 慢就慢
    - 接受 50% 不完美,他在学
  failure_mode: |
    "他还小,等大点再让他做" — 1-3 岁是 practical life 黄金期。错过,4 岁再教难得多。
    "我做更快" — 短期是,长期他学不会自我照顾。
    "桌上一团糟,我擦了" — 他擦不干净没关系,他在练。你二次擦也行。
  evidence_level: B


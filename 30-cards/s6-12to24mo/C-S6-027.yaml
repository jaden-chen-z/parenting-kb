card_id: C-S6-027
stages: [S6]
tags: [philosophy]

front:
  title: 12-15 月饮食极简底线
  hook: 一天 16 oz 奶就够

back:
  why_matters: |
    1 岁孩子拒食、挑食、把饭甩地板上——母亲焦虑"营养不均衡"。Brazelton 给出极简底线：16 oz 奶+3-4 oz 蛋白+少量铁源+半片全麦+一勺果蔬。一个月里凑齐"均衡"就行，不必每顿都达标。多维生素可以兜底。
  what_to_do:
    - 准备 16 oz 奶/酸奶/奶酪当量
    - 一份蛋白（肉蛋豆）就够
    - 含铁食物配维 C 一起吃
    - 拒绝蔬菜不吵不强塞
    - 实在没吃菜就给多维素
  failure_mode: |
    妈妈每顿都要"均衡盘"，孩子拒食后焦虑追喂、夹菜进嘴、追到客厅——孩子把"吃"和"被支配"绑死，2-3 岁正式厌食。Brazelton：这是父母的脆弱点不是孩子的。
  evidence_level: B


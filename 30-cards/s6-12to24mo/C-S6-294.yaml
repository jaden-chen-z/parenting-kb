card_id: C-S6-294
stages: [S6]
tags: [bowlby, loss, attachment, philosophy, china_high_freq]

front:
  title: 替代照顾者最关键
  hook: 比"是否真分离"重要

back:
  why_matters: |
    Bowlby 第二十四章 + 第二十五章反复强调的核心:
    **影响孩子分离 / 丧失结果的最关键变量,不是"分离时长"也不是"是真死还是暂时分离",而是: 这段时间内有没有一个稳定 / 温暖 / 可信的替代照顾者**。
    经典对比(同年龄,同分离时长):
    - **简 17 月,寄养 10 天**:罗伯逊夫妇精心照顾 → 跟养母建立次级依恋 → 重聚顺利
    - **约翰 17 月,托儿所 9 天**:无固定照顾者 / 多个护士轮换 → 越来越绝望 → 重聚后 4 岁半还过度怕妈妈离开
    - **欧文 2 岁 2 月,托儿所 11 周**:无固定照顾者 → 寄托在泰迪熊上 → 回家 11 天才表达对妈妈的爱
    Bowlby 立场:**不是孩子分离 = 一定有创伤,而是"分离 + 没有人接住" = 创伤**。
    中国家庭最大启示:
    - 妈妈出差 / 住院:**爷奶 / 阿姨能稳定陪 = 大问题就缓解了**
    - 月嫂 / 阿姨频繁更换 = 0-3 主依恋人不稳定 = 比"妈妈短期分离"更伤(中国家庭高频痛点)
    - 不是"必须妈妈带",是"必须有稳定的人带"
  what_to_do:
    - 长分离前安排一个稳定替代人
    - 替代人最好是熟悉 + 温暖
    - 不要 / 少要轮换
    - 替代人也能陪睡 + 抱 + 说话像妈
    - 替代人长期不变(同一阿姨用 1+ 年最佳)
  failure_mode: |
    "妈妈在外出差但有阿姨爷奶都在应该没事" → 关键看人是否稳定 + 温暖,不是数量。
    "阿姨轮班轮换反正都是阿姨" → 0-3 不稳定主依恋人 = 焦虑型依恋直接成因。
  evidence_level: B


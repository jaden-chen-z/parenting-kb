front:
  title: 12 月睡前唤醒法
  hook: 你睡前先把她叫醒

back:
  why_matters: |
    12 月学走宝宝每 3-4 小时夜醒，全家崩溃。Brazelton 推荐一个反直觉招：父母 10-11 点上床前主动把她叫醒一次，抱抱、必要时喂一点、再放下说"爸妈在这儿"。这能打断她原本的浅睡周期，2 点醒来的概率显著降低。
  what_to_do:
    - 父母睡前进房叫醒她
    - 抱起来 1-2 分钟轻拍
    - 必要时给小口奶
    - 重复"爸妈在这儿明早见"
    - 放回去让她自己再入睡
  failure_mode: |
    父母舍不得叫醒"难得睡着的孩子"，结果 2 点 5 点照样被叫起来抱 1 小时——比主动叫醒消耗大得多。Brazelton 临床观察：很多家庭试过都说"像魔法"。
  evidence_level: C


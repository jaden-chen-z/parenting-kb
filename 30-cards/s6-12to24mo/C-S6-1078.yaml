card_id: C-S6-1078
stages: [S6]
tags: [kochanska, conscience_internalization, mutual_responsiveness, lerner_v3, foundational]

front:
  title: "良知 2 路径"
  hook: "良知靠默契不是怕"

back:
  why_matters: |
    Kochanska(via Ch 2 Thompson)实证综述 — 良知内化 2 路径:
    ① mutual responsive orientation(母婴默契度高)→ 孩子主动想配合
    ② power assertion(高压管教)→ 孩子表面服从但内化弱。
    数据 — 1.5 岁默契度高的母婴,3 岁孩子有真良知;高压组没有。
    一句话 — 良知是关系产物,不是规矩出来的。
  what_to_do:
    - "0-2 岁建默契比立规矩重要"
    - "默契 = 你读他需求 + 他读你期待"
    - "玩在一起多于规矩多"
    - "不用 because I said so"
    - "解释规则的 why,不只 what"
  failure_mode: |
    "立规矩从娃娃抓起" — Kochanska 反对,2 岁前严规矩 → 表面服从内化弱。
    默契先,规矩后。
  evidence_level: B


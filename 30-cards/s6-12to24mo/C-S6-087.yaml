card_id: C-S6-087
stages: [S6, S7]
tags: [safety, red_flag, controversy, philosophy]

front:
  title: 再不听话妈妈就走是精神虐待
  hook: 比直接忽视更狠

back:
  why_matters: |
    Bowlby Vol 2 直接指出一种中国家长常见管教法的危害:
    **"母亲可能会吓唬孩子说如果他不听话就会抛弃他,用这种威胁的方式来管教孩子。
    但是这种管教策略可能比直接忽视更具有危害性,可能是更大的致病因素。"**
    机制:
    1. 利用"妈妈消失"这个最深的恐惧来驯化孩子 → **依恋安全的根基被人为摧毁**
    2. 孩子学会"我必须时刻乖,否则被抛弃" → **焦虑型依恋的直接成因**(C-S5-072 / C-S5-073)
    3. 反复使用 → 内部工作模型(C-S6-069)写入"妈妈是不可预测会消失的人"
    中文文化高发版本:"你再哭妈妈就走了"/"你不吃饭妈妈不要你了"/"再不听话妈妈把你扔垃圾桶"
    Vol 2 第十五章会深入到精神病理学层面:这类威胁是**焦虑型依恋的最直接成因之一**。
  what_to_do:
    - 再不听话就走等同于打孩子永远禁用
    - 替代说法 — 妈妈不喜欢你这样,我们想办法解决
    - 老人 / 配偶用此招要立刻制止
    - 误用一次要立刻补救 — 刚才说的不对,妈妈不会走
    - 教纪律的方法很多,绝不用消失威胁
  failure_mode: |
    "我们小时候都被这么吓大,有什么问题" — 你可能也被这种话写进焦虑型依恋,代际传递就是这样。
    "只是吓唬一下,我又不真走" — 孩子分不清吓唬和真的;Bowlby 数据显示反复使用即使从不真走仍致病。
  evidence_level: A

  positions:
    issue: '"妈不要你了" 等威胁话术作为管教手段是否可行'
    views:
      - school: Bowlby V2
        source: SRC-012
        stance: 强烈反对 — 等同系统性精神虐待,直接破坏依恋安全。属儿童虐待范畴。
      - school: Davies
        source: SRC-014
        stance: 温柔而清晰的边界,不撤回爱。规则讲明,情绪仍在场。
      - school: Lillard
        source: SRC-016
        stance: No 永远是 No,但界限设置不带情绪 / 不带威胁。
      - school: 鲍秀兰
        source: SRC-009
        stance: 不打孩子立场对齐反虐待派,但未直接禁此话术。
      - school: 中国主流
        stance: '"妈不要你了" 是常用威胁话术;"我是为你好" 是常用绑架话术。'

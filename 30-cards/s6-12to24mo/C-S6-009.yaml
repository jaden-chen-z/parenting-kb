front:
  title: 16-18 月预防发脾气
  hook: 必做不商量,选项可选

back:
  why_matters: |
    1-2 岁发脾气大量出现的根源:没有适度的自主权或期望过高。
    鲍秀兰平衡策略:必须做的事不商量(洗澡 / 上床 / 不能在街上玩),让选择的事鼓励自由选(穿哪件衣服 / 读哪本故事 / 玩哪个玩具)。
    在安全可容忍范围内别过多说"不" — 否则剥夺自由 + 创造力发挥。
    有好行为给予充分表扬 + 肯定,强化正面循环。
  what_to_do:
    - 必做事项明确告知:不能商量
    - 可选项让宝宝自由选(衣服/书/玩具)
    - 安全范围内别说"不",让探索
    - 好行为立即表扬肯定
    - 别什么都设禁,留发挥空间
  failure_mode: |
    "事事都禁"→ 创造力受抑,反更多哭闹。
    "样样都让宝宝决定"→ 必做事也讨价还价。
  evidence_level: C


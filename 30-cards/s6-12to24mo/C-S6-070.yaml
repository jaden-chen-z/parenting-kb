card_id: C-S6-070
stages: [S6]
tags: [safety, red_flag]

front:
  title: 被打的孩子有特殊创伤模式
  hook: 主动孤立 + 同伴攻击

back:
  why_matters: |
    George & Main (1979) 研究 10 位 1-3 岁曾遭身体虐待的儿童,对比 10 位家庭压力但未受虐:
    **被虐儿童行为显著更高频**:
    - 攻击同伴
    - 侵扰、威胁照看者
    - 面对友好提议时**回避互动**(或回避+靠近矛盾行为)
    - 主动孤立自己 + 推远可能帮助的成人(陷入自我塑造的循环)
    Tizard & Hodges (1978):机构出生 8 岁孩子 5 位无法形成依恋,在校"对老师和陌生人有几乎无法满足的关注渴望"(假性友好)。
    Main & Solomon (1990) 把这归类为**D 混乱型依恋**:同时表现 A 回避和 C 抗拒矛盾行为,身体僵硬、动作中断、表情木然。
    家长意义:**身体虐待对依恋的伤害是结构性的**,不是普通"管教过度"。
  what_to_do:
    - 绝对不打孩子(不是"打了再哄就行")
    - 体罚 + 缺乏一致回应 = D 混乱型依恋温床
    - 看到孩子主动远离成人 / 攻击同伴 / 表情木然 → 红旗信号,需评估
    - 已有体罚习惯的家庭 → 寻求专业帮助打破循环
    - 见过家暴的孩子也有类似创伤(不必直接体罚也可)
  failure_mode: |
    "我妈打我我也长大了" — 你可能是 A/D 型自己没察觉(很多东亚成年人是)。
    "孩子不听话只能打" — 让你不想打的不是道德,是数据:打 = 创伤。
  evidence_level: A


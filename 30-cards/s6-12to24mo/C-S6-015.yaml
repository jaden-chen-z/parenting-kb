front:
  title: 22-24 月用"我"建自我意识
  hook: 主体客体分开的飞跃

back:
  why_matters: |
    第 1 年宝宝无自我意识 — 不能把主体(自己)与客体(他物)分开。
    1 岁后随独立行走 + 言语发展,渐分主客体(self-other distinction)。
    22-24 月可教说自己全名 + 正确用「我」 — 知"我的""我做的"。
    Lewis 1979 rouge test 证此期镜中自我识别成熟。
  what_to_do:
    - 教准确说自己全名(姓+名)
    - 教正确用「我」:如「我吃饭」「我玩」
    - 「这是我的玩具」「我做的」
    - 让宝宝指自己的衣服、东西
    - 不要用第三人称代替("宝宝吃饭"→"你吃饭"或"你/我吃饭")
  failure_mode: |
    一直用第三人称("宝宝/小宝")→ 自我意识发展延迟。
    强调"分享所有东西"→ 主体感模糊,反伤自我建立。
  evidence_level: B


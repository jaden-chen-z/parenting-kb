front:
  title: 发脾气 4 派应对法 — 选你能坚持的
  hook: 隔离 vs 撤离 vs 共情 vs 选 2

back:
  why_matters: |
    1-3 岁发脾气是孩子情绪调节能力发展的常态(神经科学:**前额叶 24 月才开始髓鞘化**,
    所以"理智控制情绪"对幼儿是生理上无法做到的)。
    各派应对方法分歧极大,中国家长容易在 4 本书里横跳焦虑。
    本卡帮你看清 4 派立场 + 适用情境 + 风险点。
  what_to_do:
    - "**鲍秀兰中场休息(time-out)**:隔离 1-2 分钟(C-S6-008)— 适用 18 月+ 能听懂规则的;**风险**:重复使用易被孩子感知为\"撤回爱\""
    - "**Brazelton 撤离但说\"我帮不了你 / 但我爱你\"**(C-S6-020)— 适用任何月龄;**优点**:边界清楚 + 关爱不撤"
    - "**Davies 蒙氏共情翻译 4 步**(C-S6-134)— 适用愿意慢下来;\"我看到你很生气,你想要 X,但现在不行\";**风险**:大爆发期不切实际"
    - "**Lillard 12-18 月物理移除 / 18 月+ 选 2 法**(C-S6-188/191)— 防权力斗争;\"你想自己穿 / 还是我帮你穿\""
    - "**共识**:全部 4 派 + AAP/Bowlby/WW 一致**反体罚 + 反撤回爱**(C-S6-126)"
  failure_mode: |
    4 派交替使用 → 孩子 confused 边界不一致;
    只用 1 派 → 错过其他场景适用法;
    "讲道理"硬刚 → 前额叶没发育,讲不通;
    爆发期试图教育 → 都是浪费 + 火上浇油。
  evidence_level: A


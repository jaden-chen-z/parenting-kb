front:
  title: "Oser 信仰 5 阶段"
  hook: "神死命运到底谁负责"

back:
  why_matters: |
    Oser 自己 5 阶段模型(信仰判断,不只 Fowler 信仰内容)— 儿童如何理解神 / 命运 / 责任:
    1. **deus ex machina**(早期)— 神像万能开关,出事祈祷神来救
    2. **autonomy**(8-10 岁)— 神跟人事分开,自己负责
    3. **deism**(青春期)— 神是抽象原则,内化在我心
    4. **mediated**(青年)— 神跟人通过他人 / 关系作用
    5. **unconditional**(成熟)— 无条件信任,不依赖物理证据
    1-2 岁起步 —
    - 听到祖辈祈祷 / 拜祖
    - 问"为什么人会死"
    - 看到自然(花谢 / 月亮 / 星星)有敬畏感意义 — 不是教信仰,是接纳娃的灵性提问。
    中国家长意义 — 老人拜祖父母可参与 — 是娃 deus ex machina 阶段的自然体验。
  what_to_do:
    - "老人祈祷 / 拜祖 — 让娃自然体验"
    - "'为什么死'问题 — 简单诚实回答"
    - "自然敬畏 — 多带户外"
    - "不灌输也不阻止"
    - "Oser 5 阶段 = 信仰判断发展"
  failure_mode: |
    "小孩不懂这些" 跳过 — 错。1-2 岁灵性体验是奠基。
  evidence_level: B


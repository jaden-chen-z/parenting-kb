card_id: C-S6-098
stages: [S6, S7]
tags: [safety, controversy, philosophy]

front:
  title: 撤回爱当惩罚最伤
  hook: 比体罚更深的伤

back:
  why_matters: |
    Bowlby Vol 2 引 Coopersmith 1967 自尊研究 + Bronfenbrenner 综述 — 一个常见但隐秘的虐待形式:
    **"撤回爱"作为惩罚**(withdrawal of love as punishment)。
    具体表现:
    - 孩子做错 → 妈妈"不理你了"
    - 孩子哭闹 → "妈妈不喜欢这样的你"
    - 孩子顶嘴 → 几小时不说话
    - 孩子不听话 → "妈妈不爱你了"
    Coopersmith 数据 vs:
    - 高自尊男孩 vs 低自尊男孩家庭差异显著
    - **低自尊男孩的家长常用"爱的丧失"作为惩罚**
    - 低自尊男孩还有更高焦虑 / 抑郁 / 心身症状机制深度:**"我做错就不被爱" → 内部工作模型刻入"我的价值条件化"** →
    成年后:取悦型人格 / 焦虑亲密关系 / 害怕真实表达自己。
    Bowlby 强调:**惩罚要针对行为不针对爱;**"我不喜欢你这样的行为" 但"我永远爱你"。
    比较:体罚伤身;撤回爱伤魂(自我价值感)。
    家长意义(中文文化高频):**"妈妈不喜欢你"和"妈妈不喜欢你这样" 是天差地别**。
  what_to_do:
    - 永远不说"妈妈不爱你"
    - 替代:"妈妈爱你,但不喜欢你这个行为"
    - 生气 30 秒可以但别冷战几小时
    - 关系不能作为筹码
    - 老人 / 配偶用此招要立刻制止
  failure_mode: |
    "我说气话他能懂" — 5 岁前不能区分"气话"和"真话";每次都刻进心里。
    "冷战让他自己反省" — 反省的是"我不值得被爱",不是行为本身。
  evidence_level: A

  positions:
    issue: '"妈不要你了" 等威胁话术作为管教手段是否可行'
    views:
      - school: Bowlby V2
        source: SRC-012
        stance: 强烈反对 — 等同系统性精神虐待,直接破坏依恋安全。属儿童虐待范畴。
      - school: Davies
        source: SRC-014
        stance: 温柔而清晰的边界,不撤回爱。规则讲明,情绪仍在场。
      - school: Lillard
        source: SRC-016
        stance: No 永远是 No,但界限设置不带情绪 / 不带威胁。
      - school: 鲍秀兰
        source: SRC-009
        stance: 不打孩子立场对齐反虐待派,但未直接禁此话术。
      - school: 中国主流
        stance: '"妈不要你了" 是常用威胁话术;"我是为你好" 是常用绑架话术。'

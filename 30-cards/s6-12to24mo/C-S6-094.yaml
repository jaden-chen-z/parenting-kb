card_id: C-S6-094
stages: [S6, S7]
tags: [philosophy]

front:
  title: 分离后发脾气是健康
  hook: 愤怒是为了重连

back:
  why_matters: |
    Bowlby Vol 2 第十七章核心论点:**儿童在分离 / 重聚后对父母的愤怒是有进化功能的,不是叛逆。**
    Heinicke & Westheimer 实验数据:分离过的孩子,玩偶游戏中**攻击父母玩偶的频率是对照组的 4 倍**;
    回家后 6/10 孩子对妈妈表现敌意持续 2-20 周。
    Bowlby 提出愤怒的 2 个进化功能:
    1. **重聚后克服关系修复的困难**(怒能让重连更紧密,不是疏远)
    2. **阻止下次再被离开**(用强烈情绪让父母记住"别再走")
    具体例子(Robertson 案例):
    Laura 2 岁住院 8 天,几个月后看到当时录像,转头不理父亲,问妈妈:"你那个时候在哪,妈妈?你在哪?"
    家长大坑:把这种"事后清算"误读为"小心眼 / 不懂事 / 记仇" — 实际是孩子在用最大努力**保护这段关系**。
    实操含义:接住愤怒,认错(对的话),不否认事实("我那时确实不在,对不起")。
  what_to_do:
    - 分离回家后孩子的怒火要正面接
    - 承认"妈妈那时不在,对不起"
    - 不否认"哪有,妈妈一直都在"
    - 别用"小气 / 记仇 / 没气量"标签
    - 1-3 个月后愤怒会自然消化
  failure_mode: |
    "回来还跟我闹这么多天,真烦" — 烦的恰恰是他在修复关系;接住能让 1 个月内愈合。
    "他记仇,跟谁学的" — 这不是记仇,是依恋愤怒;否认会让愤怒地下化。
  evidence_level: B


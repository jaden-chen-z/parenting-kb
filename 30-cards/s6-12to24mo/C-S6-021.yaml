card_id: C-S6-021
stages: [S6]
tags: [philosophy, controversy]

front:
  title: Discipline 是教导,不是惩罚
  hook: "我必须每次阻止你 — 直到你能自己阻止自己"

back:
  why_matters: |
    管教(discipline)的英文词源是 "teaching"(教导),不是惩罚。
    Brazelton 临床观察:1 岁后父母最常陷入两极——要么"打一顿管用",要么"舍不得管全放"。这两条都错。
    正确思路是把每次设限当成一次教学机会,跟孩子说:"我必须每次都阻止你这样做,直到你能自己阻止自己。"
    这是 Touchpoints 流派最反主流的立场:管教的目标是孩子最终的"自我管理",不是当下的服从。
    体罚短期看立竿见影,长期教会的是"用力解决问题"——孩子长大后用拳头解决冲突的概率显著上升。
  what_to_do:
    - 把"管教"在心里改写成"教导自我控制"
    - 不在情绪激动时立规矩,事先想好规则
    - 第一次违规给警告 + 后果说明,第二次执行
    - Time-out 后回去重述规则 + 抱抱说"我爱你"
    - 看到孩子做对时立刻具体表扬
  failure_mode: |
    打一顿"立竿见影" → 短期有效,长期教会"用力解决问题"。"用爱教育" 不立任何规矩 → 孩子失去安全感,会用更极端方式试探。给规则但每次执行不一致 → 孩子被迫一次又一次试探,你以为他在挑战权威。
  evidence_level: B


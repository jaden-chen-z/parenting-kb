front:
  title: 22-24 月双字词→简单句
  hook: 「妈妈抱」→「我要吃饭」

back:
  why_matters: |
    18-24 月是**单字 → 双字 → 简单句**的语言爆发期。
    鲍秀兰区分:**双字词不是"抱抱""拜拜"两字重复**,而是**有名词又有动词**能完整表达意思的词,如"妈妈抱""拿来"。
    22-24 月渐过渡到**简单句**:"我上街""我要吃饭""妈妈上班"。
    家长要清楚地说简单句让宝宝模仿,逐渐学会运用完整句表达。
  what_to_do:
    - 多教双字词("妈妈抱""爸爸来")
    - 鼓励宝宝自己表达,不替他说
    - 清楚地说简单句让宝宝模仿
    - 不嫌发音不标准,先表达后纠正
    - 看到什么说什么(具象 + 现场)
  failure_mode: |
    觉得"宝宝慢慢说"不主动教 → 词汇爆发延迟。
    替宝宝说("你想要那个对吧?")→ 错过自主表达练习。
  evidence_level: B


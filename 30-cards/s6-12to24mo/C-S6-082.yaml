card_id: C-S6-082
stages: [S6]
tags: [milestone, philosophy, safety]

front:
  title: 长分离反应 3 阶段
  hook: 抗议→绝望→看似平静

back:
  why_matters: |
    "长分离" = 妈妈连续几天到几周不在(住院 / 出差 / 异地工作)。
    Bowlby 与 Robertson 1952 年观察寄宿幼儿园 + 住院 1.5-3 岁孩子,发现一个**普适反应序列**(无关孩子性格 / 家庭好坏):
    **第 1 阶段抗议(几小时-几天)**:大哭大喊 / 拒绝吃睡 / 找妈不停 / 见到陌生人黏着或推开
    **第 2 阶段绝望(几天-几周)**:不哭了 / 静坐 / 拒食物拒安抚 / 看着关上的门发呆
    **第 3 阶段超脱(脱离 detachment)**:看似"适应了" / 接受新人 / 但**对妈妈情感隔离**;妈妈回来时不认 / 转头 / 推开家长大坑:第 3 阶段被误读为"懂事 / 适应了 / 没事了" — 实际是**依恋损伤的最深阶段**,需要小心修复。
  what_to_do:
    - 长分离 = 正常反应有 3 阶段,不是孩子怪
    - 突然安静不是好转,是绝望期
    - 见妈不认不是忘了,是情感保护
    - 重聚后 1-2 周才会真情感解冻
    - 单次分离别超 5 天(2 岁以下)
  failure_mode: |
    "他都不哭了说明适应了,可以再多留几天" — 错,绝望期 → 拖长 → 进入超脱期 → 修复成本翻倍。
    "他冷淡是性格内向" — 不,是情感隔离的防御反应。
  evidence_level: A


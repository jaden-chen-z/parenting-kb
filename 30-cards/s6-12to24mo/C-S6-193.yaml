card_id: C-S6-193
stages: [S6]
tags: [montessori, language, milestone, vocabulary-explosion]

front:
  title: 12-24 月词汇爆炸期
  hook: 50 词突破后每天新

back:
  why_matters: |
    Lillard Ch8 关键里程碑 — **12-24 月之间**有个"词汇爆炸"现象:
    - **12 月** — 平均 6 个词
    - **15-18 月** — 累计 50 词时大脑突破
    - **18-24 月** — 每天 1-3 个新词
    - **24 月** — 200-300 词
    Lillard 引 Lise Eliot 神经科学:**12-24 月期间大脑左顶叶**(成人词储存区)代谢活动达到一生最高。
    这窗口的语言输入对大脑结构有**永久影响**。
    Lillard 4 个关键(Ch8):
    1. **直接说给宝宝的词才算** — 隔壁 TV / 电话不算
    2. **不需要高学历** — 父母互动方式比学历更重要
    3. **大量重复** — 大脑要固化神经通路
    4. **避免障碍** — 耳炎 / 听力问题必须及时治实操:
    - 每天大量"宝宝时间"(妈妈 / 爸爸专注跟宝宝聊)
    - 物品命名("看,这是水") — 用真词不嘎嘎
    - 重复 + 重复 + 重复(妈妈不嫌烦)
    - 不放电视背景声(假输入)
    - 听力问题立即看医
    - 宝宝说错不纠正,重说一次让他听跟 Davies(C-S2-127 真词不嘎嘎)互补 — Davies 强调"用真词",Lillard 强调"窗口期 + 量"。
  what_to_do:
    - 每天 30 分以上"宝宝时间"
    - 用真词不嘎嘎(reword for adults)
    - 物品反复命名
    - 不放 TV 背景声
    - 宝宝说错不纠正,重说一次
  failure_mode: |
    "宝宝 18 月不说话不正常" — 反:50 词突破有个体差异,有些 sitter 型宝宝晚 3-4 月。
    放双语 BBC 给宝宝听 — 没用,必须真人面对面。
  evidence_level: A


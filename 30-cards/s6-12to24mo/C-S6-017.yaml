front:
  title: 22-24 月识颜色:红黄绿先
  hook: 实物结合,逐个稳定后再教新

back:
  why_matters: |
    宝宝早就能区分颜色,但**真正"识别颜色"(命名)** = 22-24 月随语言能力发展才能做到。
    鲍秀兰要点:**与实物结合 + 逐个学**,如"这是红皮球""这是小黄狗"。
    顺序:红 → 黄 → 绿等几种鲜艳颜色,**一种稳定后再教下一种**。
    平时见到红色物品就让宝宝认 → 形成稳定颜色概念,才能抽象。
  what_to_do:
    - 红色先教(最易识别)
    - 玩具结合教("红皮球""红气球")
    - 红色稳定后再教黄、绿
    - 平时见红色就重复(汽车 / 水果 / 衣服)
    - 不一次教多色避免混淆
  failure_mode: |
    一次教 7 种颜色 → 宝宝混淆。
    用复杂颜色名(桃红 / 玫红)→ 早期不能区分。
  evidence_level: C


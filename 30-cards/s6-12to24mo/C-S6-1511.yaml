front:
  title: "信仰发展也有阶段"
  hook: "信仰小时候就萌芽"

back:
  why_matters: |
    Oser / Scarlett / Bucher(Lerner V1 Ch 17)给 religious/spiritual 发展 综述。
    信仰发展不只 "宗教信仰",是 "对意义 / 超越 / 价值的体验" — 包括无宗教家庭。
    1-2 岁开始的灵性发展征兆 —
    - 对自然的好奇 + 敬畏(看星星 / 大海 / 大树)
    - 对死亡的早期感知(看到死蝉 / 死宠物)
    - 对"为什么"的追问(超越具体答案)
    意义 — 中国父母常 "孩子还小不懂" 跳过这话题 — 错过灵性发展窗口。
    建议 —
    - 自然敬畏 — 多带户外 / 看天 / 看夜空
    - 死亡话题 — 不回避(看到死蝉可以谈)
    - 神秘感受 — 接纳不解释意义 — 灵性 ≠ 宗教 = 对意义的体验,是 wellbeing 重要维度。
  what_to_do:
    - "多带户外培养自然敬畏"
    - "不回避死亡话题(适当年龄)"
    - "神秘感受 — 接纳不解释"
    - "'为什么' 追问 — 容纳不完美答案"
    - "灵性 ≠ 宗教 = 意义感"
  failure_mode: |
    "小不懂"跳过灵性话题 — 错过早期发展窗口。
  evidence_level: B


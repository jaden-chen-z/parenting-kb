card_id: C-S6-293
stages: [S6]
tags: [bowlby, loss, attachment, philosophy, milestone]

front:
  title: 1 岁半已会想念妈
  hook: 不是"转手就忘"

back:
  why_matters: |
    Bowlby 第二十五章核心论证(整合皮亚杰 + Bower + Robertson):
    **9-16 月孩子开始有"客体永存"概念** — 知道东西 / 人不在视线里也仍然存在。
    **17 月起已能在脑子里记住不在场的妈妈的样子**,会主动想念 / 寻找 / 期待重聚。
    实测证据(罗伯逊夫妇 17 月简案例):
    - 寄养第 5 天注意到自己家花园门
    - 第 10 天打开门走到自己家门口
    - 妈妈来接时立刻认出 + 偏向妈妈
    - 跟养母玩的游戏直接转给妈妈
    Bowlby 立场:**0-1 岁宝宝转手就忘 = 神话**。即使 1 岁多还不会说话的孩子,也已经能想念主依恋人。
    中国家庭最大坑:
    - "1 岁宝宝送外婆家 1 个月没事的这么小不懂" → 反:1 岁多已经会持续想念,只是说不出
    - "保姆换了哭两天就好" → 实际 1 岁宝宝可能默默痛苦数月
    - "送托儿所小早点越早越适应" → 1-2 岁正是最敏感期不是越早越好
  what_to_do:
    - 1 岁半起认真对待长分离
    - 不假设"小宝宝会忘"
    - 分离前后给熟悉物 + 妈妈味道衣服
    - 重聚后接受 1-2 周修复期
    - 主依恋人替换前给适应过渡
  failure_mode: |
    "1 岁半送外婆家 / 寄宿 / 长出差反正小宝宝不懂" → 错。
    "保姆离开他没哭就是没事" → 默默痛苦更危险(C-S7-238)。
  evidence_level: B


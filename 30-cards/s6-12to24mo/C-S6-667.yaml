card_id: C-S6-667
stages: [S6]
tags: [motor-发展, late-学步车, individual-difference]

front:
  title: 1 岁前后会走 1.5 岁消差
  hook: 周岁早晚走差距 6 月消

back:
  why_matters: |
    松田给出关键发现:周岁前会走的孩子,跟周岁过了二三月才会走的孩子,到 1 岁半时走路方式没什么大区别。
    周岁不会走但会自己坐的娃,1.5 岁前都会走。
    "我家娃 14 月还不走"焦虑 → 没必要,差距很快消失。
    妈/奶奶比同小区"早走的"娃,会逼训出髋关节伤。
  what_to_do:
    - 1 岁不会走,1.5 岁前还有窗口
    - 不比邻居早走的娃
    - 提供爬行+扶站机会即可
    - 不强行训练大动作
    - 1.5 岁仍不走找儿科
  failure_mode: |
    妈天天扶娃练走 → 髋关节伤 + 娃产生"我不行"挫折感。
  evidence_level: B


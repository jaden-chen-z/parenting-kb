card_id: C-S6-095
stages: [S6, S7]
tags: [philosophy, controversy]

front:
  title: 黏人 ≠ 被宠坏
  hook: 多数是焦虑不是溺爱

back:
  why_matters: |
    Bowlby Vol 2 第十六章直接挑战 Freud 的"溺爱理论":
    **过度爱 → 宠坏 → 过度依赖** — 这套 20 世纪上半叶主流观念,
    Maccoby & Masters 1970 综述全面否定,灵长类研究也得出相反结论。
    **真相**:被诊断为"过度依赖"的孩子,Stendler 1954 研究分两组:
    - 6 个**真过度依赖**(妈做一切,孩子不会穿衣等)→ 都来自稳定家庭 + 过度保护型妈
    - 14 个**焦虑型依恋**(怕妈走,但能自己做事)→ 11/14 来自**不稳定家庭**(频繁换照顾人 / 父母吵架 / 离异)
    所以"黏人 = 被宠"完全是误诊。**绝大部分黏人的孩子是焦虑,不是溺爱。**
    家长意义(中国家庭高频痛点):
    - 老人指责"你这么惯他迟早完蛋" — 数据反:你的"惯"不会致病,**不稳定 / 威胁才会**
    - "孩子太黏你抱出毛病" — 反:Bowlby 数据多次反驳
    - "孩子太独立 → 没事;太黏 → 焦虑" — 不一定;独立可能是回避型(C-S5-072)
    解读:看孩子黏人不要立即"减抱减回应",先看家庭稳定性。
  what_to_do:
    - 老人 / 配偶批"宠坏" → 摆 Bowlby 数据
    - 孩子黏 → 先排查家庭稳定性
    - 频换照顾人是黏人主因之一
    - 黏 ≠ 宠;黏 = 焦虑 = 多回应反而能减
    - 真"惯"出来的是不会自理;不是黏人
  failure_mode: |
    "他这么黏人是我抱多了" — 错;数据反:多抱 + 稳定家 = 安全;不稳定家 = 焦虑黏人。
    "学专家说放下让他哭" — Watson 行为主义已被 Bowlby + Ainsworth 数据全面否定。
  evidence_level: A


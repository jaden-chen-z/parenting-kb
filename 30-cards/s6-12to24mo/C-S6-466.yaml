card_id: C-S6-466
stages: [S6]
tags: [routine, sleep, sequencing]

front:
  title: "睡前序列固定"
  hook: "同顺序 = 安全感"

back:
  why_matters: |
    Magda 命名 Sequencing:
    睡前 3 件事永远同样顺序("吃饭 → 脱衣 → 睡")。
    幼儿大脑在追"下一步是什么" — 同序列每天 = 大脑省猜的能量。
    跟 Bowlby V1 + Stern RIGs 内部表征一致 — 重复打地基。
    具体可以是:洗澡 → 故事 → 关灯;或喝奶 → 刷牙 → 唱歌。
    一旦定下尽量不变。

  what_to_do:
    - 选 3-5 个睡前固定动作
    - 永远同顺序,周末也一样
    - 跟孩子说出来:"先洗澡,然后读书,然后睡"
    - 出门 / 老人家 / 出差 — 努力还原同样序列
    - 让他参与一些步("把书拿来")— 主动感

  failure_mode: |
    "今天累跳过几步明天再补" → 序列被打破 → 他大脑要重启猜测 = 难入睡。
    Magda 原话:"sameness creates security"。

  evidence_level: B


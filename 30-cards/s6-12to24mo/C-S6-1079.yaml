card_id: C-S6-1079
stages: [S6]
tags: [erikson, autonomy_vs_shame, 1_3yr, lerner_v3]

front:
  title: "自主 vs 羞愧期"
  hook: "1-3 岁的核心冲突"

back:
  why_matters: |
    Erikson(via Ch 1 Eisenberg 综述)8 阶段第 2 阶段 — 1-3 岁核心心理冲突:
    autonomy(自主)vs shame and doubt(羞愧 + 自我怀疑)。
    娃要练自己穿鞋自己吃饭自己说不,父母过度控制 → 羞愧型,适度放手 → 自主型。
    一句话 — 这阶段控制太严养出永久羞愧底色,放太松养出失控,两者都伤。
  what_to_do:
    - "他要自己做就让(虽然慢虽然乱)"
    - "提供选项(穿红还是蓝)"
    - "自主试错的安全空间"
    - "失败不羞辱:再来一次"
    - "适度限制(不可以摸火)"
  failure_mode: |
    "你这么慢我帮你" — Erikson 解读 = 直接装羞愧种子。
    1-3 岁包办 → 5 岁羞愧底色形成。
  evidence_level: B

  positions:
    issue: '"反抗期" 是孩子叛逆还是大人剥夺玩耍空间'
    views:
      - school: 松田道雄
        source: SRC-024
        stance: 反抗期不存在 — 是大人剥夺玩耍场所导致孩子抗议。不是孩子反抗你,是你在反抗孩子的自立。
      - school: Brazelton
        source: SRC-010
        stance: 18 月狂说 No 是健康信号 — negativism 是自我形成的发育表现,无需打压。
      - school: 现代心理学
        stance: 气质 + 大脑发育 + 自主性需要交互;"反抗期" 不是单一现象,而是多因素综合。
      - school: 中国传统
        stance: '"叛逆期需打压" — 把孩子说 No 视为不听话表现,主张严格管教纠正。'

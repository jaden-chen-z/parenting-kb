card_id: C-S6-297
stages: [S6]
tags: [self, milestone, language]

front:
  title: 18 月镜中认我 = 客观我
  hook: 18 月红点摸自己

back:
  why_matters: |
    18 月有一个惊人的里程碑 — 宝宝**第一次把镜中的形象认出是"自己"**
    — 这是**客观自我**(也叫范畴自我 / 概念自我)的诞生。

    **红点测试经典实验**(Amsterdam 1972 / Lewis & Brooks-Gunn 1978):
    - 趁宝宝不注意,在他鼻子上偷偷点一个红点
    - 把宝宝放在镜子前
    - **18 月之前**:宝宝**指着镜子里**的红点(以为镜中的不是自己)
    - **18 月之后**:宝宝**摸自己的鼻子**(知道镜中的是自己)

    **意义**(斯特恩):
    - 第一次有"**可被客观看待的自我**"
    - 之前只有"**主观体验的自我**"(基于身体感受)
    - 现在加"**客观分类的自我**"
    - 是后续"我是男孩" / "我叫小明" / "我 18 月"等**身份认同**的起点

    **同期 4 大能力一起出现**:
    1. **镜中认我** — 18 月
    2. **代词使用** — 我 / 我的 / 你
    3. **性别认同** — 知道"我是男的 / 女的"开始固定
    4. **早期共情行为** — 看到别人难过会试图安慰(虽然方式幼稚)

    这 4 个不是巧合 — 都是"客观自我"出现的不同表现。

    **对中国家长**:
    - **18 月起家里要有镜子让宝宝看**(全身或大半身)
    - **多用宝宝名字** — "小明在玩积木"(第三人称视角强化客观自我)
    - **照片** — 看自己的照片有助客观自我建立
    - **承认宝宝的身份** — "你是男孩" / "你叫 X" / "你有妹妹"
    - 18 月+ 不再是"小婴儿" — 是有客观自我意识的"小人"

    **错误做法**:
    - 18 月+ 仍然只用第三人称称呼宝宝 → 客观自我弱
    - 不让宝宝照镜子 → 缺少客观看自己的输入
    - 不解释身份 → 客观自我不清晰

    跟利拉德 12-24 月词汇爆炸期(C-S6-193)同时间。
  what_to_do:
    - 18 月起家里放镜子让宝宝看
    - 多用宝宝名字 + 多用代词
    - 看自己的照片
    - 承认宝宝的身份("你是男孩")
    - 18 月+ 不当"小婴儿"看了
  failure_mode: |
    "宝宝小用镜子没用" — 错。刘易斯数据 — 18 月红点测试是客观自我出现的硬证据。
    一直只用第三人称 → 客观自我弱 → 后期身份认同不稳。
  evidence_level: A


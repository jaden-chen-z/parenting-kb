card_id: C-S6-957
stages: [S6]
tags: [pikler, potty-training, anti-coercion, source-de, controversy]

front:
  title: "皮克勒反便盆训练"
  hook: "强迫 = 父子拉锯战"

back:
  why_matters: |
    皮克勒 1969 第 9 章"用便盆"开篇直接说:
    **没有任何其他领域比便盆训练让父母和孩子斗争更激烈**。

    皮克勒立场:**学会自己控制大小便**跟"开始走路 / 说话"一样,
    是身体 + 精神 + 本能发展的结果,**不是父母教出来的**。

    皮克勒原话立场:孩子必须自己**想要** + **决定**做到干净
    — 父母强迫完全无效,而且伤亲子关系。

    皮克勒第 10 章立场补充:这是从婴儿期到幼儿期过渡的"开始适应他人"任务,
    但适应必须是孩子自己看见 + 理解的,不能是机械习惯或强迫。

    跟中国"把屎把尿从 6 月开始 / 18 月撤尿布"完全冲突(conflicts F5)。
    松田 SRC-024 §327 立场比皮克勒温和(1.5 岁夏天撤尿布,不强迫),仍属皮克勒派系。

  what_to_do:
    - 不在 12-24 月开始"便盆训练"(太早)
    - 看孩子信号:能自己脱裤 + 主动告知 + 干燥间隔长
    - 信号通常 24-30 月出现(每孩不同,差 6 月正常)
    - 给小马桶让他熟悉 — 不强迫坐
    - 失败完全不评论(尤其不"哎呀又尿了")

  failure_mode: |
    "1.5 岁不撤尿布会被笑话" → 皮克勒反:撤尿布的
    "时间"完全不是关键。强撤造成"留尿留屎"心理 +
    亲子斗争 + 长期厕所恐惧。等孩子准备好,2-3 周内就完成。

  evidence_level: B


card_id: C-S6-397
stages: [S6]
tags: [discipline, language, RIE, lansbury]

front:
  title: '"我不让你..." 限度公式'
  hook: "不喊不威胁不解释"

back:
  why_matters: |
    Lansbury Ch22 标志性的限度公式(英文 "I won't let you..."):
    - 不"别这样!"(命令)
    - 不"妈妈说不行"(三人称权威)
    - 不"不可以哦~"(不确定问句)
    - 用 "我不让你..." + 物理挡住行为例:孩子拽狗毛 → "我不让你拽狗" + 把孩子的手温柔挪开。
    第一人称 + 陈述句 + 立即行动 = 清楚不焦虑。
    孩子接收的信息:"妈妈很清楚,这事不可以。"

  what_to_do:
    - 句式固定:"我不让你 + 行为"
    - 立即 + 用手温柔阻止行为(不只说)
    - 不解释为什么 / 不预告后果
    - 不情绪 / 不威胁 / 不长说
    - 反复出现的行为 → 反复同公式 + 阻止

  failure_mode: |
    "妈妈跟你说过多少次别打狗!" → 责备语,孩子学到自己羞耻。
    或反向:"哎呀别这样可以吗" → 不确定,孩子继续测试。
    Lansbury:行为出现的当下 0-2 秒,公式立刻执行。

  evidence_level: B


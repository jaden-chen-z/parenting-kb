card_id: C-S6-1604
stages: [S6]
tags: [sibling, safety, red_flag]
front:
  title: 5 岁前两个宝宝绝不独处一房
  hook: 即使老大很乖也不行
back:
  why_matters: |
    前情:老大显得很喜欢小宝,父母想去厕所/接电话留两人 1 分钟。
    海蒂硬规则:5 岁以下的老大单独面对小宝不可以,哪怕只是转身去隔壁倒水。5 岁以下还无法判断力度和后果——好奇捏一下、想抱起来摔倒、用枕头"和宝宝玩"都可能致命。这不是不信任老大,是匹配他认知发展的现实。
  what_to_do:
    - 任何房间转移都把小宝带走
    - 接电话前确认两人在同一视线内
    - 上厕所带小宝/把老大带到门口
    - 教家人和保姆同样规则
    - 5 岁后才逐步放松监护要求
  failure_mode: 留两个孩子独处 30 秒接电话,小宝被压、被塞食物、从床上摔下,造成不可逆伤害甚至窒息死亡。
  evidence_level: A

tags: [property, sharing, anti-share-pressure]

front:
  title: 1.5-2 岁物权意识强
  hook: 别强迫娃"分享"

back:
  why_matters: |
    松田说:1.5-2 岁孩子,"这东西是我自己的"意识十分强烈。
    别的孩子摸自己娃娃/玩具,会非常生气并使劲抱住不放。
    这是发展正常,不是"自私"。强迫分享 → 物权未建立就被剥夺。
    中国家长爱说"给弟弟妹妹玩"压力娃,反误自我建立。
  what_to_do:
    - 接受 1.5-2 岁强物权
    - 别强迫分享自己玩具
    - 邻居娃来玩前收起娃最爱的
    - 教娃"问能不能玩"代替强夺
    - 3 岁后再谈分享
  failure_mode: |
    妈逼娃"给妹妹玩" → 娃哭闹 + 物权失控 + 后续越发护物。
  evidence_level: B


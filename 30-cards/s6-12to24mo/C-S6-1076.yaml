front:
  title: "2 岁知道我男 / 女"
  hook: "性别认同第 1 阶段"

back:
  why_matters: |
    Ruble & Martin(Ch 14)综述 — 性别认同 3 阶段:
    ① 18-24 月:gender labeling(知道我是男 / 女,凭外表)
    ② 3-4 岁:gender stability(我以后还是男 / 女)
    ③ 5-7 岁:gender constancy(穿裙子也还是男孩)。
    跨文化都一致。一句话 — 18-24 月就有性别意识不要假装他不知道。
  what_to_do:
    - "他问我是男 / 女直接答"
    - "别强加性别刻板(男孩不能哭)"
    - "玩具开放(男娃玩娃娃 OK)"
    - "颜色无性别(粉是颜色不是女)"
    - "看绘本聊男 / 女多样性"
  failure_mode: |
    觉得 2 岁没性别意识,养出假中性实则刻板。
    Ruble — 性别意识天生有,你的工作是不强加刻板。
  evidence_level: B


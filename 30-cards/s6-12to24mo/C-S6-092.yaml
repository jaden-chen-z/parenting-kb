card_id: C-S6-092
stages: [S6, S7]
tags: [philosophy, red_flag, controversy]

front:
  title: 父母吵架孩子怕分开
  hook: 不是怕吵是怕散

back:
  why_matters: |
    Bowlby Vol 2 引弗洛伊德经典论断:**父母之间争吵以及婚姻不幸福,会损害孩子的心理发展并诱发神经症**。
    Bowlby 在第十五章扩展:孩子在父母吵架时真正怕的不是吵的内容,而是**"他们会不会分开"**。
    机制:
    - 婚姻中的孩子已经形成对父母的稳定依恋(C-S4-072 多依恋)
    - 父母吵架 = 系统级风险信号 = "我会同时失去两个依恋人"
    - 即使孩子听不懂内容,**情绪 + 暴力声**触发"分离即将发生"预警
    Newson 1968 案例:卡车司机老婆被丈夫抛弃后,**4 岁女儿原本能自己穿衣立刻退化到全依赖**,
    一直问"你不会离开我吧?"。
    引申:**威胁离开 ≈ 实际离开**(C-S6-087)。
    家长意义:
    - 当孩子面绝不"威胁离开"或"我们离婚算了"
    - 真离婚也要明确"妈妈/爸爸不会离开你",反复说
    - 吵架要私下解决,不当孩子面
    - 不当面吵不等于不能吵 — 关闭门 / 分时段
  what_to_do:
    - 吵架要去房间或屋外,孩子不在场
    - 妈/爸离婚但都还爱你反复说
    - 孩子问"你不会离开我吧"立刻接住
    - 真分居要让两边稳定接触
    - 永远不说再这样妈妈走
  failure_mode: |
    "他听不懂没关系,小孩没事" — 听不懂内容但接收到情绪 + 危险信号,影响一样深。
    "我们离婚孩子还小忘得快" — Newson 案例:4 岁能立刻退化全依赖,影响数月-数年。
  evidence_level: A


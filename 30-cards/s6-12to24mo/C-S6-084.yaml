card_id: C-S6-084
stages: [S6, S7]
tags: [coping_strategy]

front:
  title: 兄弟姐妹陪着分离好得多
  hook: 哪怕弟弟比他还小

back:
  why_matters: |
    Bowlby 提到一个重要发现:Heinicke & Westheimer 研究中,4 个孩子是带兄弟姐妹一起进寄宿幼儿园的,
    他们的痛苦程度**显著低于**独自分离的孩子。
    特别的是 — Robertson 指出:**即使陪同的弟弟才 2 岁或更小**,孩子也能从中得到安慰。
    现象:
    - 互相寻找陪伴,一起聊天玩耍
    - 对外人统一战线("她不是你姐姐,是我姐姐")
    - 哭闹少,敌对行为也少机制:熟悉的同伴本身就是一个"心理基地"(secure base),即使无法替代妈妈照顾功能。
    家长意义:住院 / 异地分离时,如果有兄弟姐妹同行,**强烈建议一起去**,不要拆散。
  what_to_do:
    - 妈妈住院 / 出差,兄妹尽量同行
    - 弟弟妹妹再小也有用,不必"留小的多个人手"
    - 入园第一周可以请兄妹一起待几小时
    - 寄养 / 异地长辈家也尽量整体过去
    - 双胞胎尤其不要分开寄养
  failure_mode: |
    "老大去外婆家,老二跟我留城里" — 拆散后**两个都受双倍伤害**:老大失去妈+兄,老二失去妈+兄。
    "老二才 1 岁,带去会拖累" — Bowlby 数据反:1 岁的弟弟也能给 2.5 岁哥哥心理慰藉。
  evidence_level: B


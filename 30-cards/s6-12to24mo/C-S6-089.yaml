card_id: C-S6-089
stages: [S6, S7]
tags: [philosophy]

front:
  title: 妈知道的怕只占一半
  hook: 50% 的怕你看不见

back:
  why_matters: |
    Lapouse & Monk 1959 经典研究:同时单独问 193 个 8-12 岁孩子和他们的妈妈"孩子怕什么"。
    结果震撼:**两份报告差异巨大,7%-59% 不等**。
    关键模式:**孩子说怕的,妈妈大量不知道**(漏报 42-57%)。
    高漏报项:
    - 害怕迷路 / 被绑架
    - 对陌生场所的恐惧
    - 对火灾 / 战争 / 洪水 / 谋杀的灾难恐惧
    - 害怕家人生病 / 死亡 / 出意外
    - 害怕自己生病妈妈以为孩子怕的(虚报)只有不到 10%,说明妈妈倾向于**低估而不是高估**孩子的内心恐惧。
    解读:孩子有大量心事不告诉妈妈;**"我家娃没什么怕的"几乎都是错觉**。
    意义:别把"孩子不说"等同于"没事";要主动问 + 接得住。
  what_to_do:
    - 别假设你知道孩子怕什么
    - 每周问一次"你最近有什么怕的事吗"
    - 孩子说怕,别急着说"没什么可怕的"
    - 关注妈妈最易漏的:绑架 / 灾难 / 死亡 / 生病
    - 孩子主动告诉你怕什么 = 信任你的礼物
  failure_mode: |
    "我家娃啥都不怕" — Lapouse 数据反:你能知道的占一半,孩子心里更多。
    "他怕没意义的事(强盗/世界末日)" — 这恰恰是被漏报最多的;一笑而过他下次不说了。
  evidence_level: B


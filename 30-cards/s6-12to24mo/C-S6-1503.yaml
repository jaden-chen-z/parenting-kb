tags: ['philosophy', 'lerner_v1', 'baltes', '可塑性', 'controversy']

front:
  title: "早教不必抢起点"
  hook: "不抢早就真没了吗"

back:
  why_matters: |
    中国早教焦虑核心命题 — "0-3 岁脑发育关键期错过就没了"。
    Baltes Lerner V1 Ch 11 综述明确反对 — 这是把"敏感期"夸大成"关键期"。
    真相 —
    - 0-3 岁脑发育快速,但可塑性持续到 70+ 岁
    - 6 岁前不上早教,7 岁后追上的孩子很多
    - 早教不能保证后期高成就(数据弱相关)
    - 过度早教反而干扰自然 self-organization(Pikler / Davies 立场)
    中国家长意义 — 不必砸钱抢早教,把钱投在近端过程(陪伴质量)更划算。
    Baltes 终身发展 + Bronfenbrenner 微观系统(microsystem) 双重支持。
  what_to_do:
    - "不必上早教班(0-3 岁)"
    - "陪伴质量 > 课程数量"
    - "错过'敏感期' ≠ 永远输"
    - "追求'全面早教'是营销骗局"
    - "Baltes 终身发展:一辈子可塑"
  failure_mode: |
    砸钱早教 + 怕"输在起跑线" — 错。Baltes 综述明确反对关键期论。
  evidence_level: B


card_id: C-S6-1073
stages: [S6]
tags: [rubin, parallel_play, peer_origins, lerner_v3]

front:
  title: "1-2 岁是平行玩"
  hook: "并坐玩不互动正常"

back:
  why_matters: |
    Rubin(Ch 10)+ Parten 综述 — 1-2 岁同伴互动是 parallel play(平行玩),
    并坐着各玩各的,偶尔看一眼。不是不会社交,是发展阶段就这样。
    2-3 岁起 associative(关联玩),3+ 岁才 cooperative(合作玩)。
    一句话 — 1.5 岁去早教被逼合作是错配,平行玩才是这阶段健康。
  what_to_do:
    - "1-2 岁不强逼一起玩"
    - "并坐各玩 OK,偶尔看够"
    - "提供平行玩素材(2 个相似玩具)"
    - "示范分享但不强迫"
    - "他不分享别羞辱(物权萌芽)"
  failure_mode: |
    觉得 1.5 岁不跟别人玩 = 社交障碍,送早教强练。
    Rubin — 早练合作错过 parallel 阶段,2-3 岁应有的 associative 反而出不来。
  evidence_level: B


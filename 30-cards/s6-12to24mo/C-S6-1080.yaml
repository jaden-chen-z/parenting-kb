front:
  title: "Bornstein 跨文化育儿"
  hook: "美式不是普世标准"

back:
  why_matters: |
    Bornstein(via Ch 8 Parke 综述)跨文化育儿研究 — 不同文化早期互动模式差很大:
    美/欧 — 高刺激 + 鼓励独立(快说话)。日 — 共依存 + 体感为主(背孩子)。
    非洲 — 同伴+ 多照护人。各自结果都健康。
    一句话 — 不是美式育儿最好,中国传统多人养 / 共睡实际跟非洲日本类似,不必照搬美式。
  what_to_do:
    - "不必为没像美国家长那样焦虑"
    - "中国隔代养跟非洲多照护类似"
    - "共睡跟日本类似,不是错"
    - "早期独立训练不必必须"
    - "选适合你家文化的"
  failure_mode: |
    觉得美国育儿书 = 真理,自责中国传统不科学。
    Bornstein — 各文化都有健康路径,美式不是宇宙真理。
  evidence_level: B


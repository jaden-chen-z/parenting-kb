card_id: C-S6-083
stages: [S6, S7]
tags: [milestone, controversy]

front:
  title: 分离回家后变更黏正常
  hook: 不是娇气是修复期

back:
  why_matters: |
    Bowlby 观察:即使分离时间不长(几天-几周),孩子回家后的"反弹期"几乎都会持续 12 周以上。
    典型表现:
    - 比离家前更黏妈妈,寸步不离
    - 怕再被留下,妈妈一出门就崩溃
    - 矛盾:既要妈妈又推开 / 既粘又敌对
    - 攻击性增加(咬 / 打 / 摔东西)
    家长大坑:误以为"分离让他变娇气了 / 退步了",反而加重指责或推离。
    实际是**情感修复**,需要妈妈大量接纳 + 重申"我不会再走那么久"。
    Bowlby 数据:研究中 8/10 孩子回家有强烈矛盾心理,5/10 持续 12 周以上。
  what_to_do:
    - 接受 1-3 个月反弹期,不催"独立"
    - 每天大量身体接触,身边随叫随到
    - 每次出门提前告知 + 准时回
    - 矛盾行为(又要又推)别较真
    - 攻击性接住,不打回去
  failure_mode: |
    "去个一周回来变熊孩子,要好好教训" — 教训会让孩子认定"妈妈走 = 妈妈不爱我了",修复期翻倍。
    "他攻击就是不懂事" — 攻击是分离愤怒的延迟释放,不是新长出来的坏脾气。
  evidence_level: B


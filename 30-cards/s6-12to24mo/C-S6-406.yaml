card_id: C-S6-406
stages: [S6]
tags: [screen-time, attention, RIE, lansbury, controversy]

front:
  title: "0-2 岁不看 TV / 视频 / 平板"
  hook: "屏幕碾碎专注力肌肉"

back:
  why_matters: |
    兰斯伯里第 8 章强立场 + AAP 一致(最高级别建议):
    > 头两年不看电视、不看视频。

    兰斯伯里解释:屏幕"接管"宝宝的注意力,不是让他主动用注意力。

    长期影响:专注力"肌肉"萎缩(简·希利《有危险的大脑》)。

    AAP 2016 调整:18 月后可"高质量共看"+ 父母解说。
    兰斯伯里比 AAP 更严:她主张 0-2 完全无屏。

    中国家长普遍在 6 月起给平板 / 电视哄饭,反向训练注意力。

  what_to_do:
    - 0-18 月完全不接触电视 / 视频 / 平板
    - 18-24 月只看高质量共看 + 解说
    - 不"哄饭看动画" / 不"哄睡放音乐 app"
    - 大人在宝宝面前减少自己刷手机
    - 给"可探索区" + 真物 + 简单玩具替代屏幕

  failure_mode: |
    "看动画学英语 / 学知识" → 0-2 岁屏幕没有学习证据,只有伤害证据。
    或反向:"完全禁屏 = 跟时代脱节" → 0-2 岁本就不需要屏幕教育。
    兰斯伯里比 AAP 严:0-2 完全无屏。

  evidence_level: B


card_id: C-S6-086
stages: [S5, S6, S7]
tags: [philosophy]

front:
  title: 在场指心理可触达
  hook: 人在心不在 = 不在场

back:
  why_matters: |
    Bowlby Vol 2 关键定义:孩子说的"妈妈在不在",不是看物理坐标,是看**"我求助时她随时能来吗"**。
    原文:**"在场"指随时准备好可以到达;"不在场"指难以到达**。
    深一层引申:**母亲在身边但情感缺失也算"不在场"** — 抑郁 / 拒绝 / 沉迷手机 / 心思在别的事上,
    "她可能在养育幼儿时,对幼儿的需求和愿望毫无反应,无论由什么原因引起的,**对于她的孩子而言,
    她并不比部分在场好到哪里去**"。
    这解释了一个常见现象:有些孩子父母都在身边却长得焦虑型依恋 —
    因为父母**物理在但心理缺**(产后抑郁 / 沉迷工作 / 婚姻冲突 / 情感冷漠)。
  what_to_do:
    - 评估"陪伴"看心,不看时长
    - 全心半小时 > 心不在焉 3 小时
    - 抑郁 / 焦虑要先治自己再带娃
    - 玩手机 = 部分缺席,孩子能感知
    - 婚姻冲突 = 双方都心不在,孩子最受伤
  failure_mode: |
    "我每天 12 小时陪他还有什么不够" — 看心不看时;心不在,12 小时也是 12 小时缺席。
    "我难受时让他自己玩没事" — Bowlby 数据:产后抑郁母亲的孩子焦虑型依恋率显著升高。
  evidence_level: A


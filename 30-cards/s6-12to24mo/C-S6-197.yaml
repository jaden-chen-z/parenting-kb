front:
  title: 如厕训练 4 派时机 + 中国把屎把尿
  hook: 9 月 / 12-18 月 / 18-36 月 / 弹性

back:
  why_matters: |
    AAP 立场:"看孩子准备信号(18-36 月窗口)";
    Lillard 蒙氏激进主张 12-18 月敏感期早开始;
    鲍秀兰中文传统 9 月起坐盆(C-S5-012);
    Brazelton 弹性等孩子主动(C-S7-018);
    中国把屎把尿是另一传统(家长接屎接尿,孩子被动)。
    你选哪派,关系到接下来 1-2 年家庭压力 vs 孩子发育节奏的权衡。
    **生理基础**:括约肌神经控制大约 18-24 月成熟,这是 AAP 立场的依据;
    Lillard 反对"等成熟",主张 12-18 月敏感期 + 父母引导。
  what_to_do:
    - "**看月龄选起点**:12-18 月可试 Lillard 法(高家长投入,需大量观察)"
    - "**18-24 月**:看主流 AAP / Brazelton 法(等孩子主动信号)"
    - "**24 月+ 未训**:鲍秀兰 25-30 月用语言表达(C-S7-007)"
    - "**判断准备好 6 信号**:能稳走 + 干尿布 ≥2h + 能拉裤 + 沟通便意 + 模仿 + 想穿大孩子内裤"
    - "**避免**:中国把屎把尿(强行 9 月接屎接尿)— 孩子被动,缺真正自主认识"
  failure_mode: |
    把训练看成"早 = 优",忽略孩子主动信号 → 抗拒 + 反弹;
    30 月还赖纸尿裤 → 问医生(可能感觉处理 / 焦虑);
    强压 → 便秘 + 便循环 → 终身排便障碍;
    家长焦虑 → 孩子感知压力 → 倒退。
  evidence_level: A


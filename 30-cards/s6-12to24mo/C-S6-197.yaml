  跨段 hub 卡(S5+S6+S7),如厕训练是中国家长 1-3 岁第二大焦虑(仅次于发脾气)。
  4 派 + 中国传统 5 套时机标准,父母最易迷茫,本卡是必备导航。
  P0 优先级:中国家长入园前压力极大(很多幼儿园要求 3 岁前必须戒纸尿裤)。


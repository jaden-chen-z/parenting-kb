card_id: C-S6-132
stages: [S6]
tags: [montessori, screen, controversy, philosophy]

front:
  title: 2 岁前不看屏幕
  hook: 蒙氏 + AAP 双背书

back:
  why_matters: |
    家长常见操作:**iPad 救星** — 宝宝不愿意吃饭 / 不肯坐安全座椅 / 累了哭 → iPad 一开,瞬间安静。
    蒙氏 + AAP **双双反对 2 岁前任何屏幕时间**(包括 iPad / 电视 / 手机视频)。
    Davies 立场:
    - 屏幕**画面切换速度**远超现实(3 分钟可能 30 个场景)
    - 宝宝大脑适应了快切换 → **难专注于现实**(现实太慢)
    - 错过**真实世界**的感官学习窗口
    - 屏幕**单向输入**(没有 turn-taking 训练)
    AAP 立场(2016 更新):
    - 18 月以下完全不接触屏幕(视频通话除外)
    - 18-24 月若用,选高质量节目 + 家长陪同
    - 2-5 岁限 1 小时 / 天高质量节目神经科学证据:
    - **屏幕时间多 → 语言发育延迟**(多次研究)
    - **屏幕时间多 → 专注力短**
    - **屏幕时间多 → 睡眠质量差**(蓝光 + 兴奋)
    - **早期屏幕暴露 → 自闭样行为风险**(争议但数据存在)
    替代:
    - **真物**(玩具 / 自然 / 厨具)
    - **真互动**(对话 / 唱歌 / 读书)
    - **真无聊**(无聊是创造力起点,不要怕)
    "宝宝必须一直被娱乐"是错觉。**他能自己玩,如果你不打断**。
  what_to_do:
    - 2 岁前不主动给屏幕
    - 视频通话(跟外地家人)可以
    - 家长自己也少在宝宝面前刷
    - 累了不靠 iPad — 出门走走 / 抱抱
    - 接受宝宝有"无聊时间"
  failure_mode: |
    "iPad 救星不能没有" — 短期方便,长期付出语言 / 专注 / 睡眠多重代价。
    "看动画学英语 / 学知识" — 2 岁前主动学习,屏幕被动看,效果差很多。
    "全家都在刷,只让他不刷不公平" — 公平是相对的,你们成人大脑发育完了。
  evidence_level: A


card_id: C-S6-964
stages: [S6]
tags: [pikler, boundaries, consistency, source-de, controversy]

front:
  title: "限度最少 + 一致到底"
  hook: "先宠后管 = 孩子无视"

back:
  why_matters: |
    皮克勒 1969 第 10 章限度立场 — 12-24 月孩子开始适应规则,父母 2 个常见错误:

    **错误 1**:**先什么都允许,后来再禁**
    "孩子小不懂事先让他撕书 / 摔东西" → 长大再立规矩 → 失败。
    皮克勒立场:孩子学到"做了 X 是允许的",后来父母改主意要禁,孩子不接受。
    "父母越来越不让我做" → 孩子最终完全无视所有禁令。

    **错误 2**:**限度过宽 / 限度过窄**
    - 过宽:什么都允许 → 后续突然禁 → 孩子困惑
    - 过窄:什么都不能 → 孩子失去探索动机 → 焦虑 / 退缩

    **皮克勒正确立场**(德语原话 + 白话翻译):
    > 只禁我们必须禁的事(必要禁令最少化原则)
    > + 耐心,但一致到底。

    跟玛格达"红黄绿"限度 + 兰斯伯里"我不会让你这样"公式立场一致 —
    但皮克勒强调"**少 + 一致**"。

  what_to_do:
    - 12-24 月开始前先想清楚:什么必须禁(危险 / 伤人)
    - 必要禁令最少化(只禁真危险:火 / 电 / 高处 / 打人)
    - 其他能允许的全允许(撕纸 / 摔布玩具 / 玩水)
    - 一旦定下规则 — 一致到底(不"今天行明天不行")
    - 解释一次原因 — 不用重复几十次

  failure_mode: |
    "孩子小先宠点,长大再立规矩" → 皮克勒反:这是教孩子
    "X 是允许的"。后来禁 X = 父母自相矛盾 → 孩子学到"父母主意会变" → 不再认真听规则。

  evidence_level: B


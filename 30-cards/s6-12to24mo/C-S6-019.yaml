card_id: C-S6-019
stages: [S6]
tags: [philosophy]

front:
  title: 15 月符号思维上线
  hook: 玩具不再只是"咬+敲" → 开始"代表"

back:
  why_matters: |
    Brazelton 视角:**15 月最关键的认知跃迁不是走路,是符号思维**。
    在此之前,娃娃只是"另一个能咬能敲能扔的物体";15 月起,娃娃开始**代表一个人**。
    这是语言的必备前置 — 因为说话的本质就是"用一个声音(词)代表一个真实物体"。
    临床观察:Brazelton 看诊时把听诊器先放娃娃耳朵 → 妈妈耳朵 → 宝宝耳朵,
    宝宝能笑,说明他理解"娃娃 stands for 真人",这是 cognitive milestone。
    家长能为这个里程碑骄傲,并知道**说话即将到来**。
  what_to_do:
    - 观察娃娃喂奶瓶 / 哄睡 / 装进"积木房子" → 都是符号游戏
    - 看医生怕针时,先给娃娃打针演示,娃娃能承担孩子的焦虑
    - 不要看到孩子和玩具"对话"就觉得幼稚 — 这是语言准备
    - 用"假装游戏"教抽象概念(不在 / 回来 / 害怕)
  failure_mode: |
    家长只关心走路 / 说话进度 → 错过更深层的认知突破。把符号游戏当成"无意义瞎玩" → 不参与,孩子缺玩伴。
  evidence_level: B


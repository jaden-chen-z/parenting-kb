front:
  title: 12-24 月托育稳关系
  hook: 12-24 月稳关系

back:
  why_matters: |
    Lamb-Ahnert V4 Ch 23(12-24mo 托育关键)。
    **12-24 月托育 3 大重点**:
    - **班主任稳定**:1 年不换是底线
    - **小班**:< 1:6(< 12 月)/ < 1:8(12-24 月)
    - **secure base**:老师跟娃形成依恋
    **为啥 12-24 月最关键**:
    - 依恋形成关键期(对接 Bowlby)
    - 主要照护人不能频繁切换
    - 集体照护可以,但**关系稳定**是非negotiable
    **Lamb 立场**:
    - 全职妈不一定最优(质量决定)
    - 高质量托育 + 父母 1-2h 高质量陪伴 = OK
    - 但低质量托育 + 全职父母也差
    - "稳定关系"比"是谁带"重要
    **反 3 误区**:
    - ❌ "孩子小不懂换老师没事"(12-24 月依恋已成,换老师 = 创伤)
    - ❌ "大班便宜也行"(< 12 月需 1:6)
    - ❌ "托育就是托育,质量都差不多"(质量差 5 倍)
    **选幼儿园 5 步法**(12-24 月版):
    - 老师 1 年不换
    - 师生比合理
    - 老师 vs 娃互动 warm
    - 卫生 + 饮食安全
    - 父母可以观察(透明度)
    跟现库:跟 C-S0-1239 Lamb 总论 + Bowlby 依恋(SRC-011)+ Brazelton 选托育(SRC-010)对接。
    对中国家长意义:
    - 12-24 月送托别中途换园
    - 看老师 1 年稳定否
    - 师生比是底线
    - 不必"全职带"但选高质量
  what_to_do:
    - 12-24 月别中途换园
    - 老师 1 年稳定是底线
    - '师生比 < 1:8'
    - 看老师 vs 娃互动 warm
  failure_mode: |
    "小娃换老师没事"— 错。依恋已成。
    "师生比 1:15 也行"— 错。需 < 1:8。
    "全职妈最优"— 错。质量决定。
  evidence_level: B


card_id: C-S6-816
stages: [S6]
tags: [tantrum, discipline, japan, matsuda]

front:
  title: "1 岁打滚第一次最关键"
  hook: "屈服 1 次没回头"

back:
  why_matters: |
    松田 §329 给"1 岁孩子在地上打滚"妈妈核心规则：
    1. 1 岁的打滚是天生情感发泄方式 — 不是病；
    2. **第 1 次最关键** — 妈妈一旦屈服，
       孩子学会"打滚 = 支配父母"；
    3. 路过阿姨 / 奶奶帮忙拉起 = 灾难;
    4. 头撞地板战术 — 孩子知道妈妈心疼会屈服;
    5. 处方:
       - 装作没看见，等他自己起来；
       - 撞头时把他抱到铺被子的屋里；
       - 不用点心 / 玩具收买；
       - **核心是把户外消耗体力时间够**。
    跟 Brazelton "tantrum 是内部冲突" + Lansbury "限度+情绪并存"一致。

  what_to_do:
    - 1 岁打滚第一次就装没看见
    - 撞头时抱到安全屋里继续不理
    - 不掏点心收买 / 不抱起求和
    - 等他自己起来再回应
    - 关键还是白天户外消耗体力

  failure_mode: |
    最常见误区:第一次打滚 → 妈妈心软 + 旁人帮忙起 → 给点心 → 安静。
    宝宝学会:打滚 = 立即获得想要的。
    1 周内打滚频率 ×3，6 月后 = 噩梦。
    松田直接说"母亲只要屈服 1 次，以后就是想不理睬，孩子也不会轻易放弃"。
    替代:不理 + 户外消耗 — 跟鲍秀兰"忽视错误"一致。

  evidence_level: B


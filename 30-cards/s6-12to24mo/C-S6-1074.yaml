card_id: C-S6-1074
stages: [S6]
tags: [eisenberg, prosocial_18_24mo, helping_emerges, lerner_v3]

front:
  title: "18 月起会主动帮"
  hook: "他第一次给你递了"

back:
  why_matters: |
    Eisenberg + Warneken(Ch 11)经典实验 — 14-18 月婴儿见你伸手够不到,
    会主动捡起来递给你 — instrumental helping(工具性帮助)。
    没人教,跨文化都有,猩猩也会。这是 prosocial 的硬证据。
    一句话 — 18 月起娃就有 helper 本能,不要把他训练成只会要的人。
  what_to_do:
    - "你够不到东西故意叹气"
    - "他递了真心谢:你帮了妈"
    - "家务里给他活儿(擦桌)"
    - "别替他做能做的"
    - "夸过程不夸结果(你试着帮我)"
  failure_mode: |
    觉得 18 月帮忙添乱拒绝,关闭 helper 本能。
    Eisenberg — 关闭后,3 岁起再想培养 helping 难度大增。
  evidence_level: B


front:
  title: "Rogoff 文化建构学习"
  hook: "看大人做就能学到"

back:
  why_matters: |
    Rogoff(via Ch 7 Bugental 综述)— 意向参与(有意参与)是非西方文化主要学习模式:
    娃跟大人在一起做真事(不是被教)。墨西哥 / 危地马拉孩子 5 岁就做家务 + 带弟妹,
    没人教 他们,看大人做就学会。一句话 — 不是所有学习都要课堂,看真做就是学。
  what_to_do:
    - "做家务带娃在场看"
    - "他想参与给真任务(切水果用儿童刀)"
    - "示范不演示(真做不假装)"
    - "犯错允许 + 不解释每步"
    - "学习不只在上课"
  failure_mode: |
    "娃不该做家务,该上早教" — Rogoff 反对,有意参与的学习深度大于课堂。
    早教课的转移率比家务低。
  evidence_level: B


card_id: C-S6-825
stages: [S6]
tags: [feeding, picky_eating, parental_anxiety, matsuda, japan]

front:
  title: "孩子小饭量真不胖"
  hook: "瘦娃才有耐力"

back:
  why_matters: |
    松田 §338 + §339 + §319 + §395 跨段反复立场 — 中国家长最高频痛点:
    1. **孩子不吃饭原因**:**多半是妈妈强制**(吃完才能离开饭桌);
    2. **没有"必须吃多少" 标准** — 看体重增加,5g/天就 OK;
    3. 半碗饭 + 牛奶 + 鸡蛋足够;
    4. **瘦才能锻炼运动能力** — 看拳击次轻量级,胖子没耐力;
    5. 1-2 岁体重只增 2 公斤,身高 9cm,**怎么胖**?
    6. **胖反而妨碍发育** — 不是好事;
    7. **绝对不要打"增胖针" / 食欲药** ;
    8. 老人"胖才结实"是牛奶公司广告造的迷思。
    跟 Brazelton "喂食是自主权战场" + Lansbury "强迫吃饭"立场一致 +
    跟中国传统"胖才好"派强对立。

  what_to_do:
    - 不强迫吃完碗里饭
    - 看体重增加,不看一顿吃多少
    - 瘦娃 + 能跑 = 健康
    - 副食(蛋/鱼/肉)比米饭重要
    - 不打增胖针 / 不喂食欲药

  failure_mode: |
    "邻居家娃 2 碗饭" 焦虑 → 强逼吃完 → 1 小时绑椅子 → 孩子见椅子拒。
    "胖才结实"奶奶传统 → 加油加肉 → 1 岁 12kg 肥胖 → 走路晚 → 哮喘风险。
    "增胖针" / "食欲药" 派 → 松田说"愚蠢做法"。
    替代:接受小饭量是个体差异,看体重曲线不看一顿,**看孩子精神**(松田原话)。

  evidence_level: B


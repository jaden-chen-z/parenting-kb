card_id: C-S6-034
stages: [S6]
tags: [red_flag, philosophy]

front:
  title: 住院父母必须在场
  hook: 没有家长比手术更伤

back:
  why_matters: |
    Brazelton 引用波士顿儿童医院多项研究证实:充分准备过的住院儿童恢复显著更快——出院后的尿床、夜惊、退行行为持续时间更短,前提是父母全程在场。
    "被父母独自留在医院"是儿童一生中最具创伤性的体验之一,孩子会本能解读为"我是因为做坏事被惩罚"。即使医院不允许陪护,Brazelton 明确指示父母:"必要时与医院抗争"。重症监护室也已开始允许过夜。
    本卡强调一句:孩子住院,你不是请求陪护权,是争取陪护权。
  what_to_do:
    - 入院前一周用绘本+娃娃模拟手术、打针、抽血流程
    - 永远不说"不疼"——说"会疼,但很短,我抓你手"
    - 入院日全程在场,至少陪过第一个晚上
    - 离开必须告知不能溜走,说"我X点回来"
    - 出院后接受 1-3 周退行(尿床、夜惊),不批评
  failure_mode: |
    4 岁孩子扁桃体手术,医院按惯例不让陪护,父母配合"乖,在家等你"——孩子被陌生医生按住打麻药、醒来父母不在,从此对白大褂建立终生恐惧;回家后退行 6 个月,大小便失禁、夜惊、拒绝刷牙(让他想到口腔检查),原本简单的小手术变成全家长达半年的创伤后遗症。
  evidence_level: B


front:
  title: 1 岁 O 型腿是生理
  hook: 1 岁 7 月起逐渐变直

back:
  why_matters: |
    松田明确数字:出生到 1 岁半的孩子都是 O 型腿(两脚并拢膝关节有缝隙)。
    1 岁 7 月左右开始变直,2 岁左右又变成 X 型腿。
    膝关节/小腿完全无缝隙,要等 4-7 岁。
    踮着脚尖走路也是正常。中国家长被"罗圈腿"焦虑误诊为"补钙不够",硬给娃绑腿/夹板。
  what_to_do:
    - 1 岁 O 型腿不焦虑
    - 2 岁 X 型腿也不焦虑
    - 4 岁前都看自然
    - 不强行绑腿/夹板
    - 4 岁 + 仍明显找儿科
  failure_mode: |
    奶奶说"罗圈腿是缺钙" → 妈疯狂补钙 + 找绑腿,真损发育。
  evidence_level: B


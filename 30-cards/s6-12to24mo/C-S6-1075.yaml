front:
  title: "Dodge 攻击 6 步认知"
  hook: "打人前先解读偏差"

back:
  why_matters: |
    Dodge(Ch 12)综述权威 — 攻击儿童不是没良心,是 6 步信息处理偏差:
    ① 编码线索 ② 解读意图 ③ 设目标 ④ 想反应 ⑤ 评估 ⑥ 执行。
    攻击儿童在 ② 解读偏 — 别人不小心碰他他认为是故意,
    ③ 目标偏 — 想要赢/报复不想合作。一句话 — 改变行为不改认知,治标不治本。
  what_to_do:
    - "他打人后冷静聊解读"
    - "他真是故意撞你的吗?"
    - "提供解读替代(他可能没看到你)"
    - "练想赢之外的目标(一起玩)"
    - "看动画聊角色解读"
  failure_mode: |
    只罚行为不改认知,孩子学会不打了,但解读偏差没改 → 后期更隐性攻击。
    Dodge — 治标不治本,认知干预才有效。
  evidence_level: B


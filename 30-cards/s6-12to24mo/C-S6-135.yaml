card_id: C-S6-135
stages: [S6]
tags: [montessori, sharing, social, turn-taking]

front:
  title: 1 岁不强迫分享
  hook: 蒙氏轮流 ≠ 分享

back:
  why_matters: |
    中国家长最常用的"礼貌教育":**"乖宝宝要分享,把玩具给妹妹玩。"**

    戴维斯蒙氏立场:**12-16 月前的宝宝没有"分享"这个心智概念**,
    强迫分享只学到"我的东西可以被强行拿走"。

    戴维斯原话(白话翻译):
    > 婴儿一般要到 12-16 月才出现"分享"和"玩具是我的"这两个概念。

    1 岁前的现实:
    - 宝宝**只能专注 1 物**,玩了就放,自然换
    - 别的孩子拿走 — 宝宝自然找下一个
    - 不需要"教分享"

    1 岁+ 开始有"我的"概念后,蒙氏的方法不是分享,是 **轮流玩**:
    - "等他玩完,然后给你"
    - "他在玩,等会就好了"
    - 不强行从一方手里抢给另一方
    - 不说"小气" / "自私"

    家长的角色 — **翻译给两边**:
    - 自家宝宝被抢 → "看起来宝宝想玩完,我来跟那个小朋友说"
    - 自家宝宝抢别人 → "他在玩呢,我们等等"
    - 自家宝宝玩完 → "你玩完了,可以给那个小朋友试试吗"

    君妮法的家庭做法 — **互相照顾**(不分老大老小):
    - "你帮哥哥拿玩具,他帮你拿"
    - 不让老大有"必须让弟弟"的压力
    - 大家轮流,平等

    长期效果:**不强分享的宝宝长大反而更愿意分享**(因为内在选择,不是被强迫)。
  what_to_do:
    - 12-16 月前不教分享(没概念)
    - 16 月+ 教轮流玩
    - 不强行抢一方给另一方
    - 翻译给两边宝宝听
    - 不说"小气" / "自私"
  failure_mode: |
    "孩子要懂分享 = 礼貌" — 强迫分享教的是"东西可以被强抢"。
    "我家宝宝抢东西 = 自私" — 12-16 月没分享概念,不抢才异常。
    抢了让"道歉" — 1 岁不理解。等情绪稳后示范,不强迫。
  evidence_level: B


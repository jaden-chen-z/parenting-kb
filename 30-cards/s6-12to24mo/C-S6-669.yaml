front:
  title: 1.5-2 岁躺地哭闹
  hook: 拍手脚是正常发育

back:
  why_matters: |
    松田说:2 岁孩子一旦惹着,哭闹得也非常厉害。
    有的孩子气得躺在地上将手脚拍得巴嗒巴嗒响 — 是发展正常表现。
    不是"被惯坏",不是"自控差",是 18-24 月情绪表达系统还没发育好。
    妈被路人/老人指责"你娃没教好"就崩,实属误会。
  what_to_do:
    - 接受躺地哭是发展节点
    - 不立即妥协买东西
    - 不当众打骂
    - 蹲下到娃身高,简短确认情绪
    - 离开现场到安静处冷静
  failure_mode: |
    路人指责 → 妈羞愧立刻买东西 → 娃学到"躺地有效",反复用。
  evidence_level: B


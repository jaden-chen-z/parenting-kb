card_id: C-S6-012
stages: [S6]
tags: [safety, red_flag]

front:
  title: 18 月红旗 4 项立刻送医
  hook: 不会走/足尖走/词少/不模仿

back:
  why_matters: |
    18 月是发育评估关键节点,鲍秀兰列4 项红旗信号:
    ① 18 月不会走;② 学会走路后只能用足尖走;③ 18 月不能讲 5 个单词;④ 18 月不会模仿动作或发音。
    任一项出现 → 加紧训练并立即找专业医生讨论,可能提示运动 / 神经 / 自闭谱系 / 智力发育等问题,早期干预效果最好。
  what_to_do:
    - ① 18 月不会独立走 → 送医评估
    - ② 学步后持续足尖走(超几月)→ 送医
    - ③ 18 月词汇 < 5 个(妈妈/爸爸不算)→ 送医
    - ④ 不会模仿(挥手 / 动作 / 发音)→ 送医
    - 任一项立刻就医,别等"再观察"
  failure_mode: |
    觉得"宝宝慢半拍正常"反复推迟 → 错过关键干预期。
    家中无人识别红旗 → 等 3 岁才发现已晚。
  evidence_level: A


front:
  title: "Lewis 羞愧 18 月起"
  hook: "羞愧是自我意识标志"

back:
  why_matters: |
    Lewis(via Ch 5 Saarni 综述)— self-conscious emotions(自我意识情绪)18-24 月起:
    羞愧、内疚、骄傲、嫉妒。这些情绪需要自我意识已经形成才能出现。
    出现羞愧 = 娃已经知道我 + 别人有评价 = 关键发展节点。
    一句话 — 娃 18 月起会羞愧不是性格软,是 self 在长。
  what_to_do:
    - "他犯错羞愧时不二次羞辱"
    - "区分内疚(行为错)vs 羞愧(我错)"
    - "鼓励内疚:你做的事不对(行为)"
    - "不说你这种孩子(羞愧 = 全人否定)"
    - "庆祝骄傲(你做到了)"
  failure_mode: |
    "羞死你了" 这种话 18 月后直接装进 self 永久层。
    Lewis — 羞愧高度自我有关,18 月起不是教训是伤害。
  evidence_level: B


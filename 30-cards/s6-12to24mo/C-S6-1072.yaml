front:
  title: "18 月起认镜中我"
  hook: "他指鼻子是有自我"

back:
  why_matters: |
    Harter(Ch 9)综述 — 18-24 月 self 起源里程碑:rouge test 用(妈给娃鼻子点红,
    照镜子娃指自己鼻子知道是自己)。这是 categorical self(分类自我)的起点。
    一句话 — 18 月起娃知道我 是独立的人,从这开始 self 5 维度可以慢慢建。
  what_to_do:
    - "18-24 月做 rouge test 看是否用"
    - "用名字称呼他不只用宝宝"
    - "镜子玩游戏(指你 + 指我)"
    - "他说我的别压(物权萌芽)"
    - "尊重他的我要 (有限度)"
  failure_mode: |
    觉得自我意识是后期的事,18-24 月还把娃当大宝宝。
    Harter — 错过 self 起源窗口,后期建 5 维度更难。
  evidence_level: B


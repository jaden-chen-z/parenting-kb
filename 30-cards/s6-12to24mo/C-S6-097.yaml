card_id: C-S6-097
stages: [S6, S7]
tags: [philosophy]

front:
  title: 稳定家庭 5 个特征
  hook: 不靠完美靠一致

back:
  why_matters: |
    Bowlby Vol 2 第二十一章基于 Peck & Havighurst 1960 经典美国大草原城 34 个孩子 7 年纵向研究 +
    Coopersmith 1967 自尊研究 + Bronfenbrenner 1961 等多个大样本汇总,
    总结出**整合良好的孩子来自的家庭共同特征**:
    1. **父母接受孩子本来的样子**(不强求"理想孩子模板")
    2. **父母信任孩子的判断**(不密切监控,允许犯错)
    3. **可以自由跟父母讨论问题**(包括反对意见)
    4. **父母关系和谐**(夫妻关系是孩子安全感根基)
    5. **日常生活有规律 + 管教可预测**(规则明确,执行一致)
    Bowlby 强调:**"一致"比"完美"重要十倍**。
    一致 = 言行一致 / 奖罚一致 / 双亲一致 / 不情绪化爆发。
    研究反复发现:**家长不一致的家庭出"无道德意识儿童"** —
    "这些家庭最让人感到震惊的特点是,他们无一例外都非常的不一致"。
    家长不必焦虑做"完美爹妈",但要做"可预测的爹妈"。
  what_to_do:
    - 接受孩子本性,不改造为"理想型"
    - 规则少而稳,执行不情绪化
    - 父母先和谐,孩子才安心
    - 让孩子敢顶嘴 + 反对你
    - 双亲管教尺度对齐,不一个唱红一个唱白
  failure_mode: |
    "今天宽容明天严" — 不一致是最严重的家长缺陷,数据显示孩子整合水平最差。
    "我们家挺好的,就是夫妻关系一般" — 夫妻关系是孩子安全感根基,排第 4。
  evidence_level: A


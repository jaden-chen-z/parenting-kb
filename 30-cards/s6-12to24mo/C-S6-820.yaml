card_id: C-S6-820
stages: [S6]
tags: [tantrum, breath_holding, japan, matsuda]

front:
  title: "屏气哭死过去别慌"
  hook: "5 岁后自动消"

back:
  why_matters: |
    松田 §349 给"哭着突然憋紫了脸"妈妈定心丸：
    1. 抢打火机后大哭"哇"一声不出声而抽搐 = 屏气发作;
    2. 医生叫"愤怒性痉挛" — 5 岁后不再发生;
    3. 不是癫痫 — 不会智力低下;
    4. 多发于跟祖父母同住溺爱家庭 — 当成"武器";
    5. 处方:
       - **召开家庭会议** — 决定无视;
       - 奶奶不要在母子吵架时帮腔;
       - 户外消耗体力;
    6. 跟癫痫区别:屏气前先大哭 + 脑电波正常。
    跟鲍秀兰"屏气哭死过去"立场一致 + 加日式"家庭会议"操作。

  what_to_do:
    - 屏气发作不要慌 — 知道 5 岁后好
    - 召开家庭会议:奶奶/爷爷不帮腔
    - 不因屏气满足要求
    - 日常多带户外消耗
    - 真要查脑电波就查一次确认

  failure_mode: |
    最常见误区:孩子屏气 → 大人吓坏 → 立即满足要求 → 孩子学会"武器化"。
    几个月后:每次不满意就屏气 → 全家被"武器"绑架。
    奶奶最容易"投降"，导致妈妈更难管。
    松田核心:不是医学问题，是**家庭管理问题** — 家庭会议把立场统一是关键。

  evidence_level: B


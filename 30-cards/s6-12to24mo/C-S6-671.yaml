card_id: C-S6-671
stages: [S6]
tags: [discipline, anti-physical-punishment, fear]

front:
  title: 1 岁后看体罚会怕
  hook: 当面打骂吓出长期阴影

back:
  why_matters: |
    松田说:1.5-2 岁孩子,看到被体罚或医院里被强按打点滴的情形,会怕得抱紧别人或揪住母亲。
    这年龄已能看懂/记住"暴力" — 不是没记忆。
    家长打骂当娃"没记忆所以无所谓"是错的。
    长期阴影不是当下哭,是后续怕陌生人/怕医生/怕大声。
  what_to_do:
    - 1.5 岁起绝不在娃面前打骂
    - 别用"看医生打针"吓娃
    - 别强按娃打点滴(有方法商量)
    - 邻居家暴力场面立刻带娃离开
    - 看完医院抱娃说"妈在这里"
  failure_mode: |
    妈"娃这么小不懂" → 当面拍打老大/大人吵架 → 娃怕陌生人怕医院终生。
  evidence_level: B


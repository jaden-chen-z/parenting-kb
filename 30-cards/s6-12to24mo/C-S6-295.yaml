card_id: C-S6-295
stages: [S6]
tags: [bowlby, loss, philosophy, china_high_freq]

front:
  title: 玩具宠物丢是早练习
  hook: 小丧失别绕也别敷衍

back:
  why_matters: |
    Bowlby Vol 3 隐含逻辑(整合 Ch6 健康哀悼 + Ch16 儿童准备):
    宝宝 1-3 岁会经历很多"小丧失":**最爱的玩具丢了 / 宠物死了 / 气球飘走了 / 喜欢的杯子摔了 / 毯子洗坏了**。
    这些"小丧失"是**孩子学习哀伤过程的最好练习场**,处理得好,长大遇到大丧失能更健康哀悼。
    Bowlby 立场:**反应原则跟"亲人去世"是同一套**:
    1. 真话:"是的它真的不会回来 / 它死了"
    2. 允许难过:"想 X 是吧我也想"
    3. 不绕弯:不立刻"再买一个 / 别难过 / 多大点事"
    4. 不羞辱:"哭什么一个玩具值得吗"
    5. 给时间:难过几天是正常,不必快进中国家庭最大坑:
    - **"再买一个就好了"** → 教孩子"丧失 = 用新的填" → 长大不会处理大丧失
    - **"哭什么这么大了"** → 教孩子压抑 → 帕特里克模式
    - **"它去远方了会回来的"** → 教孩子用想象代替现实
    - **不让孩子参与处理(扔 / 埋宠物)** → 错过告别仪式一只仓鼠或一个气球的告别,是孩子人生第一堂关于死亡和失去的课。
  what_to_do:
    - 用真话承认丢 / 死 / 坏
    - 让孩子哭 + 说"想 X"
    - 不立刻"再买一个"
    - 让孩子参与处理(埋宠物 / 扔玩具)
    - 1-2 周后还提就一起回忆
  failure_mode: |
    "别哭妈妈再给你买" → 教孩子"丧失 = 速换新的" → 长大不会真正哀悼。
    "它去远方旅行了" → 用想象代替 → 孩子无法接受现实。
  evidence_level: B


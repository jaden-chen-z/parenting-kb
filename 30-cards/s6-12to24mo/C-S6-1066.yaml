card_id: C-S6-1066
stages: [S6]
tags: []

front:
  title: "12-23m 加餐"
  hook: "餐数到顶加些点心"

back:
  why_matters: |
    WHO 12-23 月喂养标准:
    - 辅食:每天 3-4 餐
    - 加餐(snacks):每天 1-2 次
    - 母乳:每天 3-4 次(按需)
    - 食物质地:跟随家庭食物(family foods,切碎煮软)
    - 食物多样性:5+ 食物组总能量构成:辅食 ~67%,母乳 ~33%。
    加餐 = 健康零食(水果/酸奶/小块奶酪),不是糖/盐重的零食。
  what_to_do:
    - "12-23 月:3-4 餐辅食 + 1-2 加餐 + 3-4 次母乳"
    - "辅食跟随家庭饮食(切碎煮软)"
    - "5+ 食物组(肉/蛋/奶/蔬/果/谷)"
    - "加餐 = 水果/酸奶/小块奶酪(不糖盐重)"
    - "母乳 33% 营养 — 不是辅食为主就停母乳"
  failure_mode: |
    把'1 岁后跟大人吃' = 钠/糖/油大人量 → 学步儿肝肾负担超 + 健康零食被替代为糖盐零食。
    12-23 月饮食是模仿大人但减量减盐。
  evidence_level: A


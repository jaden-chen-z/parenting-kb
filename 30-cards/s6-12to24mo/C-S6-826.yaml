card_id: C-S6-826
stages: [S6]
tags: [emergency, fever, convulsion, red_flag, matsuda, japan]

front:
  title: "高热抽搐冷头温脚"
  hook: "5 岁后自动消"

back:
  why_matters: |
    ⚠️ **2026 修订**:松田 (1967) 写"高于 38°C 用退热塞剂",
    但现代 AAP 2011/2016 指南**不推荐用退热药预防热惊复发**(退热不能阻止再次抽搐,
    主要是缓解不适)。剂型上现代多用口服布洛芬/对乙酰氨基酚,塞剂是日本传统优先。
    本卡 what_to_do 已按现代指南改写。

    判断流程(松田观察 + 现代标准):
    1. 高热 39-40°C 同时抽搐 — 1-3 岁段非常多见(热性惊厥);
    2. **不会因抽搐死亡** — 多数 1-2 分钟自然苏醒;
    3. **第一动作:测体温**(不发热抽搐 = 立即送急诊查癫痫);
    4. **现场处置**:
       - 让孩子侧躺(防误吸);
       - 解开衣领,清空口腔;
       - 计时 — 超过 5 分钟拨 120;
       - 不要按压肢体(防骨折);
       - **不要往嘴里塞东西**;
    5. **痉挛只在一侧** = 怀疑癫痫(送急诊);
    6. 5 岁后发病率大降 — 上学后基本不发作;
    7. 不影响智力。

  what_to_do:
    - 抽搐先测体温(发热=典型热惊;不发热=立即急诊)
    - 让孩子侧躺,清空口腔,计时
    - 超 5 分钟或第一次发作 → 拨 120
    - 不按压肢体,不往嘴里塞东西
    - 退热药(布洛芬/对乙酰氨基酚)只为缓解不适,不预防复发
    - 一侧抽搐 + 不发热 = 急诊查癫痫

  failure_mode: |
    第一次见娃抽搐妈妈狂送急诊 + 强按压肢体 → 骨折风险 + 误以为打针救命 → 后续每次都狂奔急诊。
    实际抽搐多数 1-2 分钟自然好,关键是侧躺 + 计时。
    "热性抽搐 = 一定癫痫"误区:90% 是热性惊厥(不是癫痫),5 岁后自动消。
    "用退热药预防复发"是松田 1967 立场,现代证据不支持(AAP 2011)。
    替代:第一次教育自己 + 心态稳 + 备温度计。

  evidence_level: A


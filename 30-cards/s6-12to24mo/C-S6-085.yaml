card_id: C-S6-085
stages: [S6, S7]
tags: [red_flag, philosophy]

front:
  title: 重聚不认妈是危险信号
  hook: 不是忘了是关上心门

back:
  why_matters: |
    Heinicke & Westheimer 研究最尖锐发现:10 个分离的孩子里,**2 个孩子重聚时看起来不认得母亲**,
    剩下 8 个**躲避或干脆走开**。这个反应很容易被家长误读:
    - "他忘了我"(假象 — 他记得,只是关上了情感)
    - "他生我气"(部分对,但本质是**情感保护机制**)
    - "他冷淡是性格"(错 — 是分离 3 阶段中的"超脱期"特征)
    机制:幼儿无法承受"可能再失去妈"的痛苦 → 把对妈的情感**主动隔离**。
    这是 Bowlby 命名的"超脱(detachment)"阶段,**不是好转,是依恋系统的紧急关机**。
    时机:分离时间越长 / 年龄越小越容易出现。
    持久度:可数小时-数周;若不修复,会发展成成年人的"情感隔离"人格底色。
  what_to_do:
    - 重聚被冷遇别难过,这是情感保护
    - 不强求亲热 / 不质问"还认不认得妈"
    - 一周内大量陪伴 + 重复"妈不会再走那么久"
    - 不催"恢复",让孩子自己再次靠近
    - 身体接触优先(抱 / 抚,即使他被动)
  failure_mode: |
    "他不认我说明我不重要,算了" — 这是孩子情感保护,不是真不重要;放弃就把他推向永久超脱。
    "我去陪几天再回去工作" — 不行,3-7 天根本不够解冻,需要 ≥ 2 周连续陪伴。
  evidence_level: A


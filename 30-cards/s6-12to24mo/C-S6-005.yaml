front:
  title: 16-18 月学用勺拿杯
  hook: 别怕脏,挫主动性更糟

back:
  why_matters: |
    16-18 月是宝宝生活自理能力培养黄金期,从吃饭 + 喝水开始最自然。
    鲍秀兰具体方法:单独给宝宝一碗少量饭 + 一把小勺让他练习,大人继续喂宝宝吃饱。
    关键:不能因怕脏怕弄洒不让练习 — 这会挫伤主动性和独立性,2 岁还不会自理。
    1-2 岁是建立"我能自己做"自我效能感(self-efficacy)的关键。
  what_to_do:
    - 给宝宝单独一碗一勺(食物少量)
    - 让他自己练习拿勺取饭送入口
    - 同时大人喂宝宝吃饱(防营养不足)
    - 杯子喝水也同样:少水练习
    - 大人帮一帮,渐让宝宝自己完成
  failure_mode: |
    "弄脏衣服洒满地"全程喂 → 宝宝失去自我效能感。
    一次给太多食物水 → 宝宝沮丧,练习效果差。
  evidence_level: B


card_id: C-S2-071
stages: [S2]
tags: [philosophy, controversy]

front:
  title: 妈走了就哭从 5 月起
  hook: 早期分离反应的萌芽

back:
  why_matters: |
    Wolff 早在 5 周就观察到:婴儿"看着的人离开视野时,原本满足的婴儿会开始哭泣"。
    但这阶段任何人离开都引发反应(包括宠物 / 陌生人),**无差别**。
    真正的"母亲特异性分离反应"从 **5 月**起出现:
    - Ainsworth:大约 5 月起,母亲离开房间时,即使有其他人陪伴,婴儿也倾向于哭泣
    - 9 月时减少哭(因为开始能爬,可以跟随)
    家长意义:5 月开始"妈走宝哭"是依恋形成的健康信号,不是娇气。
  what_to_do:
    - 5 月起预期"妈一走就哭"会出现 — 这是健康发育
    - 离开时**慢而轻柔** — 突然快速离开会激起更剧烈反应
    - 不必每次都不离开 — 短时离开训练宝宝建立"妈妈会回来"
    - 离开前轻拍 + 说"妈妈一会回来" — 即使他还听不懂,语调本身就是信号
    - 9 月会爬后,他会自己跟过来,哭闹会减
  failure_mode: |
    5 月前担心"宝宝怎么妈走也不哭" → 多虑(还没到时间)。
    5 月后哭闹严厉训练"不哭",违反依恋发展时间表。
  evidence_level: B


front:
  title: 室内温 25-28 夏 / 18-22 冬
  hook: 风别直吹宝宝

back:
  why_matters: |
    新生儿到 3 月龄宝宝体温调节能力差,室温过高或过低都影响睡眠和发育。
    鲍秀兰具体数字:**夏天 25-28°C / 冬天 18-22°C**,比成人舒适区略高 1-2 度。
    通风 + 湿擦地 + 远离马路户外活动 → 减少呼吸道感染和环境污染。
  what_to_do:
    - 夏:25-28°C(开空调先擦汗,出汗时不开)
    - 冬:18-22°C(干燥时加湿器,湿度 50%)
    - 空调 / 风扇风不要直吹宝宝
    - 每天定时开窗通风(空气好时)
    - 户外选树木花草非人群密集且远离马路
  failure_mode: |
    夏天家中 30°C+ 怕"宝宝感冒"不开空调 → 过热增 SIDS 风险。
    风扇直吹睡觉 → 面瘫 / 感冒。
  evidence_level: B


front:
  title: "1-3 月先盯脸学情绪"
  hook: "他在偷偷研究你脸"
back:
  why_matters: |
    Thompson(Ch 2)综述 — 1-3 月婴儿还不能 social referencing(8 月才会),
    但他已经在密集观察你脸的微表情了。这是为后期"看妈表情决定怕不怕"做的准备工作。
    一句话 — 你的每个表情都在被存档,3 月起他能区分你笑和你不耐烦。
  what_to_do:
    - "1-3 月跟他对视别老看手机"
    - "你高兴就笑给他看"
    - "你累了别强装,他读得到"
    - "Tronick 静止脸不超过 30 秒"
    - "爸爸表情库要建,不只让妈一个人"
  failure_mode: |
    觉得 1-3 月看不懂表情,只关注奶量睡眠。
    Thompson 综述 — 表情库这时候建不全,后期社会指引能力受影响。
  evidence_level: B

front:
  title: "Tronick 静止脸冲击"
  hook: "扑克脸娃就秒崩了"
back:
  why_matters: |
    Tronick(via Ch 5 Saarni 综述)经典实验 — 妈跟 2-3 月娃正常互动时娃高兴,
    妈突然变成扑克脸(static face),娃 30 秒内会从困惑→愤怒→大哭。
    这证明 — 婴儿不是被动接收照顾,他在主动跟你情绪互动,你撤了他就崩。
    一句话 — 你刷手机时娃看你扑克脸 = Tronick 实验,长期就伤。
  what_to_do:
    - "玩手机时别脸朝着娃"
    - "娃跟你互动时把手机放下"
    - "脸要参与,不只是身体在场"
    - "Tronick 不超过 30 秒(意外发呆)"
    - "你心情差也别强笑,但要承认"
  failure_mode: |
    觉得 2-3 月娃没意识刷手机没关系。
    Tronick — 30 秒就有冲击,长期累积就是依恋损伤。
  evidence_level: B

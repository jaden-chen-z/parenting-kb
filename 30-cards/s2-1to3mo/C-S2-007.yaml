front:
  title: 2-4 月里程碑:抬头 / cooing / 主动笑
  hook: 4 维度速查,缺一项找医生

back:
  why_matters: |
    发展里程碑(developmental milestones)= 75% 同龄宝宝能做到的事(AAP / CDC 用 75 百分位定义)。
    0-3 岁是大脑神经可塑性窗口期,早期干预效果最佳;3 岁后改善空间显著缩小。
    2-4 月是发展爆发期,每个月新增能力(看 / 听 / 抓 / 笑)。
    AAP 用 4 维度评估:运动 / 视听 / 语言 / 社交认知。
    儿保医生 2 月 / 4 月体检必问;父母自查也按这清单。
  what_to_do:
    - 2 月查 4 项:趴时抬头 + 看脸 + 听响声反应 + 回应式笑
    - 4 月查 4 项:稳定抬头 + 持物玩 + cooing("ooo aahh")+ 主动笑(吸引你注意)
    - 2 月还能:张开手 / 跟物体动 / 受抱后安静
    - 4 月还能:手到口 / 撑起胸 / 听声转头 / chuckle
    - 缺关键项 → 儿保时主动告诉医生
  failure_mode: |
    家长只看会不会动,不看视听 + 社交 → 漏发现自闭谱系信号(2-4 月就有)。
    把"我家慢热"当借口拖到 6 月才查 → 错过黄金干预期。
  evidence_level: A


card_id: C-S2-1502
stages: ['S2']
tags: ['gross_motor', 'lerner_v1', 'thelen', 'self_organization', 'pikler_alignment']

front:
  title: "走步是组装出来的"
  hook: "不是教会的是涌现"

back:
  why_matters: |
    Thelen 的经典研究 — 婴儿 1-2 月有"走步反射"(stepping reflex),3-4 月就消失了 —
    传统解释:皮层成熟抑制了原始反射。
    Thelen 反驳 — 不是反射消失,是腿变胖了(肌肉力跟不上重量)。
    证据:把婴儿放到水里(浮力减小重量)— 走步动作回来了。
    意义 — 走步能力是动态系统(肌肉 + 重力 + 神经 + 平衡 + 动机)合成,不是大脑发育解锁。
    意义 — 中国家长"教走"心态完全错位 — 走步是 self-organize,不需要"教"。
    Pikler / RIE 派的实操(不教翻坐爬站走)= V1 元理论的具体应用。
  what_to_do:
    - "不教走 — 给空间 / 时间让娃自己尝试"
    - "不要学步车(干扰 self-organize)"
    - "观察'几月走'范围 9-18 月都正常"
    - "走得早 ≠ 智力高(组装早而已)"
    - "走得晚 ≠ 落后(组装条件还没成)"
  failure_mode: |
    "教走" + 学步车 — 干扰自然 self-organization。
  evidence_level: B


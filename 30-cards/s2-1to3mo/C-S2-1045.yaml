front:
  title: "奶不够别加配方"
  hook: "频繁吸吮才是真解"

back:
  why_matters: |
    WHO Q&A 立场:'感觉奶不够'多数是错觉,真不够才需要干预。
    判断真不够看 4 个客观指标:
    - 体重曲线持续偏低(WHO Growth Standards 母乳基线)
    - 24 小时尿布 < 6 块(白天)
    - 持续黄软便 < 4 次/天(0-6 周)
    - 表情萎靡 / 哭弱都正常但 '感觉少' → 信号错觉。
    干预实操(WHO 推荐顺序):
    ① 增加吸吮频次(8-12 → 12-15 次)
    ② 检查衔乳姿势(找哺乳顾问 / IBCLC)
    ③ 双侧轮替吸吮 + 挤压乳房
    ④ 妈妈休息 / 喝水 / 营养
    ⑤ 真奶不够才考虑供应物 / 配方补充(医生指导)
  what_to_do:
    - "看 4 客观指标(体重/尿布/便/表情)— 不靠'感觉'"
    - "感觉少 → 增加吸吮频次(频繁刺激奶量)"
    - "找 IBCLC 哺乳顾问检查衔乳"
    - "别轻易加奶粉 — 加了奶量进一步降"
    - "中国'妈妈奶水不足'话术 → 多数是育儿不良习惯/错觉"
  failure_mode: |
    感觉少 → 直接加配方 → 吸吮减少 → 奶量真降 → 加更多配方 → 母乳停。
    频繁吸吮才是真解,加奶粉是相反操作。
  evidence_level: A


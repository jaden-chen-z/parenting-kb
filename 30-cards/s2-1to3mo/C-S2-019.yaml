card_id: C-S2-019
stages: [S2]
tags: []

front:
  title: 高敏感宝宝的"我超载了"信号
  hook: 弓背、扭头、吐奶=求救

back:
  why_matters: |
    高敏感婴儿（hypersensitive baby）在 6-8 周表现为对触碰、声音、目光极易"过载",约占新生儿的 15-20%。
    Brazelton 临床发现这类宝宝会用全身系统说"够了"——弓背离开、扭脸、吐奶、突然拉屎。
    新手父母常误以为宝宝"不喜欢我"或"有问题",越焦虑越凑近,结果触发更剧烈的回避循环。
    识别信号是区分气质而非疾病的关键。
  what_to_do:
    - 一次只用一种刺激:先抱、不说话不对视
    - 看到僵硬就停手,等身体放松再加下一项
    - 三种刺激（看-说-摇）逐项叠加,不同时上
    - 在安静昏暗的房间互动
  failure_mode: |
    父母心切地同时唱歌+对视+摇晃+逗笑,宝宝瞬间过载弓背哭闹,父母解读为"我不够好",越内疚越想"补救",刺激更猛,恶性循环。
    Brazelton 警告:父母最爱、最想给的,恰是高敏感宝宝最受不了的。
  evidence_level: B

  positions:
    issue: 6-8 周事件命名群 — 同一发育跃迁的多个名字
    views:
      - school: Karp
        source: SRC-003
        stance: 哭闹峰(peak fussing)— 6 周是哭闹达高峰、随后递减的关键节点。
      - school: Brazelton
        source: SRC-010
        stance: 6-8 周触点(touchpoint)— 父母最焦虑、亲子关系重新校准的发育节点。
      - school: Wonder Weeks
        stance: WW8 模式跃迁 — 婴儿大脑首次能识别复杂模式,行为外显为不安。
      - school: Bowlby
        source: SRC-011
        stance: 6 周非选择性微笑 — 社会性微笑出现,但尚不区分照顾者。

card_id: C-S2-131
stages: [S2]
tags: [montessori, movement, equipment, controversy]

front:
  title: 别 propping 宝宝坐
  hook: 不放他到自己达不到的位置

back:
  why_matters: |
    家长常用的"省事三件套"— bouncer 摇椅 / 抱枕垫坐 / 放在沙发上 — 都让宝宝**坐在他自己还坐不起来的位置上**。
    蒙氏明确反对这种 propping(支撑摆位)。
    理由:
    1. **动作发育倒序** — 宝宝该自己学坐(7-9 月),被支撑反而错过自主学
    2. **脊椎压力** — 4 月以下脊椎曲度未形成,被坐 = 脊椎垂直承重
    3. **髋部压力** — bouncer / jumper 让全身重量压在髋骨,跟 DDH 风险相关
    4. **失去身体控制感** — 宝宝学不到"我能从躺到坐"
    Davies 的原则:**不放宝宝到他自己达不到的位置**。
    替代方案:
    - 让宝宝**躺动作毯上**(背 / 肚都行)
    - **抱在怀里**看世界
    - **背巾**(非坐姿,环抱姿)
    - 7-9 月**自己坐起来**了再有支撑
    Bouncer 不是绝对禁,但**短时**(<30 分钟 / 天)。
    Jumper / 学步车 / exersaucer = 完全反对(髋压力 + 学步异常 + 跌落风险)。
  what_to_do:
    - 0-7 月以躺为主(动作毯)
    - 不用抱枕"垫坐起来"看东西
    - bouncer 短时用,不超 30 分钟 / 天
    - 完全不用 jumper / 学步车 / exersaucer
    - 让宝宝自己 7-9 月独坐
  failure_mode: |
    "我想抱抱累,放 bouncer 让他看东西" — 短时可,长时(2+ 小时)伤脊椎+髋。
    "学步车走得早" — 反:走得反而晚 + DDH + 跌落风险。中国不少城市禁售。
    "他坐在抱枕上就不哭" — 不哭是新鲜感,长期违反动作发育规律。
  evidence_level: A


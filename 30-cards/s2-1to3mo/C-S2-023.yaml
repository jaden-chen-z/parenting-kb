card_id: C-S2-023
stages: [S2]
tags: [philosophy]

front:
  title: 选日托看共情不看课程
  hook: 三个否认信号要警觉

back:
  why_matters: |
    双职工家庭最痛的决策。Brazelton 给出的选托标准不是设施豪华或早教课程,而是看照护者三件事:
    (1) 节奏能不能跟上婴儿(抱起时观察身体是否调适到孩子频率),
    (2) 是否尊重你这个父母(说"他今天差不多要会走了"而不是"他今天为我走了"),
    (3) 婴儿对成人比 ≤ 3:1 / 学步儿 ≤ 4:1 / 三岁 ≤ 6:1。
    同时父母自己有 3 个常见防御要识破:否认(假装分离不痛)、投射(把内疚转成对照护者的崇拜或敌意)、抽离(不再问孩子白天怎样)。
  what_to_do:
    - 问"你怎么做如厕训练"测灵活度
    - 接娃时分散投放(吃饭/睡前/过渡)观察
    - 婴儿在你回家时大哭是好事不是坏事
    - 突击拜访不预约
    - 关注"他差点会走了"vs"他为我走了"的措辞
  failure_mode: |
    用早教课程多寡 / 装修质感 / 月费高低做选择标准;
    自己用否认压住分离痛苦,看到孩子大哭觉得是日托害的,反复换地方加剧孩子断裂感。
  evidence_level: B


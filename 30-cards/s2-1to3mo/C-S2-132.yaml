card_id: C-S2-132
stages: [S2]
tags: [montessori, crying, response, safety]

front:
  title: 哭闹 5 步回应法
  hook: 蒙氏冷静回应流程

back:
  why_matters: |
    宝宝哭 → 家长本能模式:**惊慌→烦躁→愧疚→更慌**。这是大脑的 fight-flight(战或逃)反应。
    Davies 提供 5 步**冷静回应流程**(防止你被情绪带跑):
    1. **先让自己冷静**(深呼吸)— 哭声触发 fight-flight,不冷静做啥都错。必要时进卫生间关门 30 秒。
    2. **告知宝宝**(在路上就说)— "我听到你了,妈妈来了"。不是冷漠,而是从远处就开始连接。
    3. **观察是不是需要帮**(到他身边)— 是饿 / 是困 / 是不舒服 / 是怕 / 是烦躁期。先看再动。
    4. **必要时身体安抚**(抱起 + 解说)— "我要抱你了"。不要无言一把抱起。
    5. **承认情绪并命名**("你撞到头了,疼") — 不要"没事没事别哭",那是否定他的感受。
    最后一步关键 — 父母本能"哎呀没事别哭",其实是在说"你的感受不重要"。蒙氏版换成:
    - "你看到妈妈走了,你害怕"
    - "玩具掉了,你很失望"
    - "尿布湿了不舒服"
    长期意义 — 1-2 岁宝宝学会"我能识别 + 命名情绪",3 岁后情绪管理大幅好。
    跨源一致 — Bowlby + Brazelton + Wonder Week 都强调:**回应而非压制情绪**。
  what_to_do:
    - 听到哭先深呼吸 3 秒再行动
    - 在路上就说"我来了"
    - 抱起前先告诉宝宝
    - 用"你 + 感受词"命名(不是"别哭")
    - 不说"没事别哭",换"你 X,所以哭"
  failure_mode: |
    "听到哭立马冲过去抓起" — 你的慌传给他,反而哭得更凶。
    "别哭别哭,妈妈给你买" — 这是用物质压制情绪,不教情绪识别。
    把 5 步当 5 秒搞定 — 是 5 秒-5 分钟的过程,不是 quick fix。
  evidence_level: B


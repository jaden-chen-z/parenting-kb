card_id: C-S2-067
stages: [S2]
tags: []

front:
  title: 5 周才开始真"看见你"
  hook: 之前的笑都是反射

back:
  why_matters: |
    Bowlby 依恋发展第一阶段(0-12 周)— **对人有反应但不区分**。
    Wolff (1963) 仔细观察 8 位婴儿:在 5 周末,几乎所有婴儿都进入**"非选择性社交微笑"阶段** — 真正眼睛对眼睛地"看着你笑"。
    标志特征:婴儿警觉、眼睛明亮、嘴部运动幅度大、眼角皱起。
    在此之前的笑大多是反射(吸尘器运动 / 睡梦中的肌肉抽动)。
    家长别着急 — 5 周左右开始的真社交微笑,是**值得记进相册**的发育里程碑。
  what_to_do:
    - 4-5 周开始用嗓音激发笑(高频女声最有效)
    - 笑出现立刻回报(微笑 + 说话 + 抱)— 强化形成
    - 注意眼角是否皱起(真社交笑 vs 反射笑的区别)
    - 5 周后"宝宝看着你"的时长会显著增加
  failure_mode: |
    "我家宝宝从来不笑" 4 周前担心 → 多虑(还没到时间)。
    5 周后真笑出现却不积极回应 → 微笑频率会下降(消退)。
  evidence_level: B


card_id: C-S2-070
stages: [S2]
tags: [philosophy]

front:
  title: 喂奶 ≠ 建立依恋
  hook: 你回应得勤才是关键

back:
  why_matters: |
    全世界最大的育儿误解之一:"我天天喂他、伺候他,他怎么不亲我?"
    Bowlby 综合多项研究反复证明:**依恋强度跟"是谁喂养"几乎无关**,跟"是谁敏感地回应他"强相关。
    以色列集体农庄研究最直接:护士全权负责喂养 + 日常照料,但**孩子还是依恋每天只见 1-2 小时的父母** — 因为父母互动质量更高。
    Schaffer & Emerson (1964):依恋强度跟喂养、断奶、如厕训练**都没显著相关**,只跟 2 项相关:**对哭闹反应度**+**主动发起互动量**。
    所以中国"奶奶喂养、月嫂照顾、妈妈出现少"的安排,可能让宝宝**最依恋的不是妈妈**。
  what_to_do:
    - 主依恋人 = 谁回应得最敏感最及时,**不是谁喂奶最多**
    - 在职妈妈不必焦虑"喂得少"会失去依恋 — 短时高质量互动比长时低质照顾更重要
    - 月嫂 / 月子保姆只满足生理需求,不会改变母子依恋
    - 父亲 / 祖父母频繁互动也能成主依恋(谢弗发现这种家庭中父亲依恋更强)
  failure_mode: |
    "我妈带 / 月嫂带,我不用管"想法 → 主依恋可能转移给祖辈/月嫂。
    "我喂他还不行" → 喂养不是依恋,你还没做关键事(读情绪 + 及时回应)。
  evidence_level: A

  positions:
    issue: 主依恋形成路径 — 喂养者还是敏感回应者
    views:
      - school: 鲍秀兰
        source: SRC-009
        stance: 中国文化默认"妈妈喂养 = 主依恋",喂养是依恋核心通道。
      - school: Bowlby
        source: SRC-011
        stance: 敏感回应者 = 主依恋,喂养无关。直接颠覆中国"奶妈/月嫂带 ≠ 主依恋"假设。
      - school: Brazelton / Davies / Lillard
        source: SRC-010/014/016
        stance: 同 Bowlby 立场 — 谁回应得敏感,谁就是主依恋,可以是父亲、奶奶、月嫂。
      - school: 中国实操
        stance: 月嫂带 / 奶奶带 / 妈妈出现少 → 主依恋可能不是妈妈,对中国家庭高度颠覆。

card_id: C-S2-014
stages: [S2]
tags: [safety, controversy]

front:
  title: 3 月起禁打蜡烛包
  hook: 中国传统包法腿绑直 → DDH

back:
  why_matters: |
    "打蜡烛包" = 中国传统包裹法,把婴儿包成蜡烛状,**手臂腿都绑直**,与 Karp 5S 包裹(髋部松、可蛙腿)截然不同。
    腿绑直 → 髋关节不能蛙腿位 → DDH(髋发育不良)风险骤增,可能终身影响下肢。
    鲍秀兰直接反对:3 月开始有翻身欲望,"一定不要将婴儿捆得像一个蜡烛包,以免限制婴儿的活动"。
  what_to_do:
    - 3 月起立即停止任何形式的"绑腿"包裹
    - 包裹只可包上身 + 髋部松松能蛙腿
    - 髋部能塞 2-3 指空隙 = 合格
    - 让宝宝有自由活动机会练翻身
    - 老一辈坚持时,给老人看 DDH 图片
  failure_mode: |
    "腿绑直长大不罗圈"= 错觉,绑直反而 DDH 终身高风险。
    包到 6 月不松 → 错过翻身关键期。
  evidence_level: A

  positions:
    issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
    views:
      - school: Karp
        source: SRC-003
        stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
      - school: AAP
        source: SRC-004
        stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
      - school: 鲍秀兰
        source: SRC-009
        stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
      - school: 海蒂
        source: SRC-040
        stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

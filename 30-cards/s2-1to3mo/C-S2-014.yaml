card_id: C-S2-014
stages: [S2]
tags: [safety, controversy]

front:
  title: 3 月起禁打蜡烛包
  hook: 中国传统包法腿绑直 → DDH

back:
  why_matters: |
    "打蜡烛包" = 中国传统包裹法,把婴儿包成蜡烛状,**手臂腿都绑直**,与 Karp 5S 包裹(髋部松、可蛙腿)截然不同。
    腿绑直 → 髋关节不能蛙腿位 → DDH(髋发育不良)风险骤增,可能终身影响下肢。
    鲍秀兰直接反对:3 月开始有翻身欲望,"一定不要将婴儿捆得像一个蜡烛包,以免限制婴儿的活动"。
  what_to_do:
    - 3 月起立即停止任何形式的"绑腿"包裹
    - 包裹只可包上身 + 髋部松松能蛙腿
    - 髋部能塞 2-3 指空隙 = 合格
    - 让宝宝有自由活动机会练翻身
    - 老一辈坚持时,给老人看 DDH 图片
  failure_mode: |
    "腿绑直长大不罗圈"= 错觉,绑直反而 DDH 终身高风险。
    包到 6 月不松 → 错过翻身关键期。
  evidence_level: A


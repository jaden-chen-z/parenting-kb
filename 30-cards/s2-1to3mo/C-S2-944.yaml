front:
  title: "Trevarthen 主体间性"
  hook: "母婴对话天生就在"
back:
  why_matters: |
    Trevarthen(via Ch 5 Saarni 综述)— intersubjectivity(主体间性)奠基人,Stern self 派根基。
    初级(0-9 月)= 母婴 1 对 1 情绪对话;次级(9 月+)= 母+婴+物三角关注。
    一句话 — 0-9 月不是你+婴,是你和婴一起建"我们的世界"。
  what_to_do:
    - "0-9 月跟娃 1 对 1 全心互动"
    - "情绪同步(他笑你笑给他看)"
    - "9 月起加物(看!这玩具)三角"
    - "Tronick still-face 不超 30 秒"
    - "夫妻不抢娃注意,轮着 1 对 1"
  failure_mode: |
    觉得 0-9 月只是看着娃,没意识在建我们共同世界。
    Trevarthen — 没建主体间性,后期共同关注/共情/语言都受影响。
  evidence_level: B

card_id: C-S2-1343
stages: [S2]
tags: [poverty, mcloyd, infant, lerner_v4]

front:
  title: 婴儿期穷养看家心
  hook: 婴儿期穷看家长心

back:
  why_matters: |
    McLoyd V4 Ch 18(婴儿期贫困干预)。
    **1-3 月贫困核心 = 父母心理稳**:
    - 经济压力 → 父母焦虑/抑郁
    - 父母情绪 → 跟娃响应迟缓
    - 响应迟缓 → 不安全依恋
    - 不是"穷 → 娃差",是"穷 → 父母 → 娃"
    **婴儿期干预 3 大方向**:
    - **直接对父母**:支持 + 减压(NFP / Triple P 1 级)
    - **保护响应**:其他主 caregiver 补
    - **物质 + 心理**:不只是发钱
    **McLoyd 关键发现**:
    - 1-3 月**父母心理状态**最强预测后期发展
    - 比"经济水平"更强
    - 这就是 NFP 模式核心
    **反 4 误区**:
    - ❌ "穷家娃注定差"(中介是父母心理)
    - ❌ "光发钱解决"(教养断层需独立干预)
    - ❌ "婴儿不懂别担心"(父母情绪传染)
    - ❌ "父母苦娃就乖"(压力会传)
    **实操**:
    - 父母自己先心理稳
    - 找 NFP / 妇幼访视
    - 主 caregiver PPD 时其他人补
    - 物质 + 心理双管跟现库:跟 C-S0-1234 McLoyd 总论 + C-S6-1385 学步穷家 + NFP(C-S0-1242)对接。
    对中国家长意义:
    - 婴儿期父母心理是核心
    - 找 NFP / 妇幼支持
    - PPD 主妈时其他人补响应
    - 物质 + 心理双管
  what_to_do:
    - 父母心理是核心
    - 找 NFP 妇幼支持
    - PPD 主妈其他人补
    - 物质+心理双管
  failure_mode: |
    "穷家娃注定"— 错。中介父母心理。
    "光发钱"— 错。教养断层独立干预。
    "婴儿不懂"— 错。情绪传染。
  evidence_level: B


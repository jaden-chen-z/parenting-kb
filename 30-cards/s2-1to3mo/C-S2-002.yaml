card_id: C-S2-002
stages: [S2]
tags: []

front:
  title: 撑过哭闹峰不是父母失败
  hook: 你不糟糕,他在过峰值

back:
  why_matters: |
    Karp 说哭闹宝宝的父母都是"英雄"。
    哭闹无法被"消除",但能被有效缓解。
    重要的是别一边哄一边自责——自责会让你状态更差,
    照护质量也跟着下降。
  what_to_do:
    - 反复对自己说:"是他在过峰值,不是我没做好"
    - 哭闹时优先做 5S,接受"不能立刻止哭"的现实
    - 和伴侣轮班,保证至少一人有 4 小时连续睡眠
    - 30 分钟无效就换人接手,不是你能力问题
  failure_mode: |
    "他是不是疼?我是不是糟糕母亲?" — 这种问句会瞬间击垮信心。
    一个人硬撑不求助 → 产后抑郁加重 + 摇晃综合征风险。
  evidence_level: B


front:
  title: "退步是新组织前奏"
  hook: "会了又不会是好事"

back:
  why_matters: |
    Fischer 的核心命题 — 技能发展中"看似退步"是 reorganization(系统重组)的征兆,
    是新阶段即将到来的前奏,不是真退步。
    对接 Wonder Weeks 跃迁论 — 跃迁前几天娃通常"退步"(吃睡变差 / 黏人 / 哭闹增)。
    对接中国家长经验 — "原来会自己穿鞋,这两天又不会了"是 reorganization 进行中。
    意义 — 看似退步要欢迎,不要焦虑。系统在拆旧装新,稳定后会出现新能力。
    父母此时的工作 — 提供安全 + 不施压 + 等系统重组完成。
  what_to_do:
    - "看似退步 → 庆祝新能力即将来"
    - "不强行让娃'恢复'原能力"
    - "提供安全感 + 多陪伴"
    - "系统重组期娃情绪不稳定属正常"
    - "等几天 → 新能力自然涌现"
  failure_mode: |
    看似退步焦虑 push — 错。reorganization 不能被强行加速。
  evidence_level: B


card_id: C-S2-004
stages: [S2]
tags: []

front:
  title: Colic 是神经敏感,不是胀气
  hook: 1/5 宝宝有,3-4 月就退

back:
  why_matters: |
    colic(肠绞痛)= Wessel 1954 定义"3-3 规则":每天哭 ≥ 3h × 每周 ≥ 3 天 × ≥ 3 周。
    PURPLE 哭闹周期描述同阶段 — 6 周达峰约 3h/天,3-4 月退(可能到 6 月)。
    AAP:影响约 1/5 婴儿,本质是"神经系统过度敏感 + 还不会自我安抚",**不是消化或胀气**。
    中文文化几乎没人讲这个 — 老人常归因为"奶不消化""胀气",误导喂消胀剂(C-S1-047)。
    等神经系统成熟自然就好,不必"治"。
  what_to_do:
    - 时间表:2-4 周起 → 6 周峰(3 小时/天)→ 3-4 月退
    - 别期望"治好" — 等神经系统成熟,自然就好
    - 用安抚 menu(C-S1-045)缓和,不强求消失
    - 排除饮食敏感(C-S1-048)+ 异常红旗(C-S1-031)
    - 自己照顾好心理(C-S1-033 产后抑郁筛查)
  failure_mode: |
    当成胀气狂拍嗝 / 给西甲硅油 → 错怪原因,无效。
    觉得"是我的错" → 你不是 colic 原因,神经系统成熟自然就好。
  evidence_level: A


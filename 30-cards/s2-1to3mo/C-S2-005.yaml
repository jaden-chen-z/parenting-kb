card_id: C-S2-005
stages: [S2]
tags: []

front:
  title: '"睡整觉"真定义:频繁醒能自回睡'
  hook: 不是连睡 10h 不醒,反向焦虑

back:
  why_matters: |
    婴儿睡眠周期 45-60 分钟(成人 90 分钟),且 50% 是浅睡(REM 期 / 活跃睡眠,易醒),
    所以频繁醒是生理常态。

    中文家长焦虑"几月睡整觉"普遍,但 AAP 反驳常见误解(白话翻译):
    > "睡得好的孩子" = 频繁醒来但能自己重新睡着的孩子,
    > **不是**整夜不醒连睡 10 小时的孩子。

    频繁醒在生理上是健康(防呼吸问题)。
    健康 + 增重稳的宝宝不必夜里叫醒喂。
  what_to_do:
    - 不要把"连睡 10 小时"当目标 — 反而不健康
    - 真目标:醒了能自己回睡(不需大人介入)
    - 健康 + 增重稳的宝宝不必叫醒夜喂
    - 喂 / 安抚 / 换后立即放回小床(不抱睡)
    - 夜醒红旗:增重不稳 / 24h 湿尿布 <4 / 大便 <3 / 喂养不足 → 找医生
  failure_mode: |
    把"连睡 10 小时"当目标 → 强行训练 + 孩子睡浅焦虑。
    健康宝宝主动叫醒夜喂 → 打乱节律 + 自己累。
  evidence_level: A


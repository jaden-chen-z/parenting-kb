card_id: C-S2-701
stages: [S2]
tags: [overweight, anti-fat-baby, calorie]

front:
  title: 防婴儿过胖硬数字
  hook: 日 120 千卡是上限

back:
  why_matters: |
    松田硬数字:1 kg 体重每天 ≥ 120 千卡 → 婴儿过胖。
    出生 4 个月内 1/3 热量用于生长,4 月后只 1/10。
    奶粉袋按说明喂的 1-2 月娃,1 kg 体重已超 120 千卡。
    中国"白胖才好看"焦虑反向 → 反"标准曲线偏高就放心",其实超 120 千卡就要减奶。
  what_to_do:
    - 看奶粉 100g 总热量(找包装)
    - 算每日总奶粉量 × 热量
    - 除以娃体重 kg → 千卡/kg/日
    - 超 120 千卡就减奶量
    - 母乳娃凭体感(吃饱就拉)
  failure_mode: |
    "胖娃才有福相"奶奶逼妈追喂 → 婴儿肥胖 → 心脏长期超负荷 + 后续儿童肥胖。
  evidence_level: B


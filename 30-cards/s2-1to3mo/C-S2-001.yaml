card_id: C-S2-001
stages: [S2]
tags: []

front:
  title: 哭闹峰:6 周达峰,3 月回落
  hook: 6 周不是终点,是分水岭

back:
  why_matters: |
    哭闹峰值 = 健康婴儿出生后头 3 月哭闹时长的发育曲线,**不是疾病**。
    Brazelton 1962 N=82 经典研究:
    哭闹从 2 周开始,**6 周达到顶峰**(25% 宝宝每天哭超 3 小时),
    3 月末几乎全部回落到 < 1 小时/天。
    这与 NCSBS 的 PURPLE crying 概念一致(Peak / Unexpected / Resists / Pain-like / Long-lasting / Evening)。
    撑过 6 周到 3 月这个窗口,大部分宝宝会自然好转。
  what_to_do:
    - 把 2-12 周看成"已知困难期",提前安排支援
    - 6 周突然哭得更凶不是病情恶化,是峰值
    - 用 app 记录每天哭闹时长,看趋势曲线
    - 12 周后仍每天 ≥3 小时 → 排查肠绞痛/食物过敏
  failure_mode: |
    把 6 周高峰当病变 → 反复跑医院、过度检查。
    觉得"会一直这样下去" → 父母崩溃,容易放弃喂养或情绪失控。
  evidence_level: B


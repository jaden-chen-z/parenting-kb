card_id: C-S2-1505
stages: ['S2']
tags: ['relationships', 'lerner_v1', 'bronfenbrenner', 'proximal_processes', 'newborn']

front:
  title: "近端互动从 2 月起"
  hook: "日常陪伴就是引擎"

back:
  why_matters: |
    Bronfenbrenner proximal processes 在 1-3 月开始进入"高效期" —
    婴儿开始能够 social referencing(看你脸读情绪),
    Serve & return(serve & return)互动质量决定神经发展。
    - 婴儿"发起"(发出声 / 看你 / 吐舌)= serve
    - 你"回应"(回声 / 看回去 / 吐舌)= return
    - 反复 serve-return 循环 = proximal process 核心中国家庭多人养情境下 — proximal process 数量足够,但质量参差(不同看护人反应度不同)。
    关键 — 主要看护人(妈 / 奶奶 / 阿姨)中至少 1 个反应度高 + 一致 → 婴儿大脑 wiring 健康。
    意义 — 不需要"专门陪玩",日常喂 / 抱 / 哄 / 换尿布时的反应度就是 proximal process。
  what_to_do:
    - "婴儿 serve(声 / 看 / 吐舌) → 你 return"
    - "日常喂 / 抱 / 哄 / 换尿布反应度高"
    - "不需要'专门陪玩'"
    - "主要看护人反应度高 + 一致"
    - "近端互动 = 神经发展引擎"
  failure_mode: |
    婴儿哭闹冷静处理"不能宠" — 错。Serve-return 缺失影响神经 wiring。
  evidence_level: B


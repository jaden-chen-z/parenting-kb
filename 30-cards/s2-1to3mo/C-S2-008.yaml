front:
  title: 2 月龄俯卧抬头每天 1-2 分起
  hook: 空腹觉醒练,玩具引诱抬头

back:
  why_matters: |
    俯卧抬头 = 婴儿趴着把头抬起的动作,是大动作发展的第一个里程碑。
    1 月练习 → 2 月可抬到 45°,3 月可抬到 90° + 用手腕支撑前胸。
    锻炼颈部背部肌肉力量 + 增加肺活量,是后续翻身爬行的基础。
  what_to_do:
    - 哺前 1 小时(空腹)+ 觉醒状态进行
    - 床面平坦舒适,双手放头两侧
    - 用带响 / 鲜艳玩具在前面引诱抬头
    - 开始 1-2 分钟,逐渐延长
    - 每天数次,看疲劳就停
  failure_mode: |
    饱腹后立刻俯卧 → 吐奶呛奶。
    强按宝宝头练 → 颈椎损伤,反伤主动性。
  evidence_level: B


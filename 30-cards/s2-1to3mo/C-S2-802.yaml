card_id: C-S2-802
stages: [S2]
tags: [shonkoff, nrc, crying, 峰值, china_high_freq]

front:
  title: "6-8 周哭闹峰跨文化"
  hook: "全球宝宝都哭得多"

back:
  why_matters: |
    NRC 综述 Ch 5 引 Barr 跨文化研究:
    **婴儿哭闹有 universal 发展曲线**:
    - 0-2 周相对少
    - **6-8 周达高峰**(每天 2-3 小时)
    - 12-16 周明显降
    - 4 月起基本平稳跨 !Kung / 北美 / 北欧 / 澳洲 / 南美都一致 — 是**生理决定**,
    不是"父母没本事"或"宝宝难带"。
    **峰值的内容**:
    - 不是"饿了 / 尿了 / 想要"才哭(很多哭无明显原因)
    - paroxysmal crying(无诱因哭)是人类婴儿独有 — 其他物种没有
    - 多在傍晚 / 黄昏(witching hour)
    **NRC 立场关键**:
    - 哭闹峰是发展轨迹的一部分,不是异常
    - 安抚 ≠ 让哭停;安抚 = 缩短时长 + 稳节律
    - 4 月后会自然好转
    **对中国家长**:
    - 6-8 周宝宝哭最多不是你做错了
    - 不是"高需求宝宝"贴标签 — 全球婴儿都这样
    - 撑过去 — 4 月起明显改善
    - 多抱(Hunziker-Barr)能减一半时长
  what_to_do:
    - 6-8 周接受峰值
    - 黄昏多抱多走动
    - 别贴"高需求"标签
    - 4 月起会自然降
    - 多 skin-to-skin 减时长
  failure_mode: |
    "他怎么这么爱哭 — 一定是奶不够" — 错。哭闹峰是生理曲线,跟奶量关系不大。
    硬塞奶 / 摇晃 / 焦虑 → 反而让宝宝感受到妈妈紧张 → 哭更多。
    "我家娃是高需求" — 在 6-8 周这判断太早,4 月再说。
  evidence_level: A


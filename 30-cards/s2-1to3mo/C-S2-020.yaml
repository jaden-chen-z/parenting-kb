front:
  title: 8 周哭闹峰是发育规律
  hook: 不是你没带好,是巅峰

back:
  why_matters: |
    黄昏哭闹（fussy period）指婴儿在傍晚连续哭 1-2 小时、其他时段正常的固定哭闹时段,约 70% 健康婴儿出现。
    Brazelton 数据显示:这种哭在 8 周达到峰值,12 周自然消失,是宝宝释放白天积累的神经过载、为夜间长睡铺路。
    新手父母在峰值时往往最绝望,怀疑奶不够、肠胀气、自己做错。
    理解曲线能避免不必要的换奶粉、加药、过度抱哄。
  what_to_do:
    - 把 6-12 周记成"过山车期",标在日历上
    - 8 周左右最难熬,咬牙撑两周就开始降
    - 试一切无效后,放下宝宝让他哭 5-10 分钟
    - 然后再抱起来安抚、拍嗝、再放下
  failure_mode: |
    父母把"哭"等同于"我失职",连续 8 周抱着不放,宝宝失去自我调节练习机会,反而更难自我安抚。
    Brazelton 强调:"spoiled 在这个月龄不存在;你做不出宠坏的孩子,只可能做出焦虑的孩子。"
  evidence_level: B


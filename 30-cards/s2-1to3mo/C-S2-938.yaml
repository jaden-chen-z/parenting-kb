front:
  title: "Kagan 抑制型气质"
  hook: "怕生 = 杏仁核敏感"

back:
  why_matters: |
    Kagan(Ch 4)综述 — 18% 婴儿是 inhibited(抑制型),25% 是 uninhibited(非抑制型),
    其他在中间。生物基础 — 抑制型杏仁核对新刺激反应大,
    心率快,皮质醇升,这不是性格弱,是神经反应天生敏锐。
    一句话 — 你家娃怕生不是软弱,是杏仁核报警阈值低。
  what_to_do:
    - "怕生别说娇气羞他"
    - "新人新环境提前预告"
    - "给一个安全人当锚(妈在)"
    - "暴露要渐进不要一次满量"
    - "他能稍稍接近就鼓励"
  failure_mode: |
    觉得抑制型是性格缺陷,强推或羞辱矫正。
    Kagan — 强推激活更高皮质醇,孩子学到的是"妈不懂我",更退缩。
  evidence_level: B


front:
  title: "新生儿听别人哭也哭"
  hook: "共情天生不是教来"

back:
  why_matters: |
    Eisenberg(Ch 11)综述 — 出生 24 小时新生儿听到别的婴儿哭会跟着哭,
    叫 reactive crying(反应性哭),是全身性共情(Hoffman 阶段 1)起源。
    跨文化(美/欧/亚)实验数据一致 — 共情不是社会教的,是基因装的初版。
    一句话 — 共情起源在出生,不是 5 岁才教。
  what_to_do:
    - "新生儿听别人哭也哭别压制"
    - "你哭了也别压娃前(让他在共情)"
    - "不说别哭男娃应该坚强"
    - "同病房新生儿哭是练共情"
    - "你自己情绪诚实 = 共情材料"
  failure_mode: |
    觉得新生儿哭别人哭是学坏,压制反应性哭。
    Eisenberg — 这是共情起点,压制是关闭起点。
  evidence_level: B


card_id: C-S2-186
stages: [S2]
tags: [montessori, language, communication]

front:
  title: 说话慢 + 等回应
  hook: 宝宝脑速只成人一半

back:
  why_matters: |
    Lillard Ch8 引神经科学:**12 岁前宝宝大脑神经传导速度只有成人一半**。
    所以跟宝宝说话:
    - **慢说**(每个词清晰,不要连珠炮)
    - **少词**(简单短句:"宝宝想喝水?")
    - **看着宝宝**(让宝宝看你嘴 + 眼睛)
    - **等回应**(说完停 3-5 秒,等宝宝反应)
    实测好处:
    - 宝宝 2 月就开始 babbling("ooh / aah") — 大人慢说促进发声
    - 宝宝 9-10 月理解第一个词 — 慢说让大脑能跟上
    - 宝宝 12-24 月词汇爆发 — 输入质量比量更重要
    Lillard:**不需要高学历或丰富词汇** — 父母互动方式比"教多少词"更影响语言发育。
    跟 Davies(C-S2-127 真词不嘎嘎)互补 — Davies 强调"用真词",Lillard 强调"慢 + 等"。
  what_to_do:
    - 跟宝宝说话:慢一倍
    - 1 句一个词组,不堆叠
    - 看宝宝的眼睛 + 嘴
    - 说完停 3-5 秒等回应
    - 重复同一句多次(不嫌烦)
  failure_mode: |
    "宝宝小听不懂,我快说也行" — 反:宝宝在听 + 学,慢说才让神经通路形成。
    "我不会跟宝宝聊天" — 简单"看,这是水"就够,不用复杂。
  evidence_level: B


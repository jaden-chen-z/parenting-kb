front:
  title: 跟宝宝说话 5 大共性
  hook: 高音调/慢/短句/重复/停顿

back:
  why_matters: |
    父母语(parentese)= 全球共有的对婴儿说话模式,不是逗弄性"婴儿话"。
    鲍秀兰:全世界父母和小婴儿说话似乎都用相似方法 — 这是大脑进化的本能,适配婴儿听觉敏感频段。
    研究证明:14 月龄前 parentese 越多,24 月龄时词汇量越大,语法理解越快。
  what_to_do:
    - 声调升高(妈妈语调比爸爸更适配)
    - 语速慢一倍,留宝宝处理时间
    - 短句 3-5 词,不用复杂从句
    - 重复关键词("宝宝看,妈妈,妈妈在这")
    - 句间停顿 1-2 秒,等宝宝反应
  failure_mode: |
    用成人正常语速 + 长句 → 婴儿无法处理,错过早期语言加工训练。
    长期"宝宝叠词"如"饭饭/瓶瓶"→ 影响标准发音习得。
  evidence_level: B


card_id: C-S2-009
stages: [S2]
tags: [safety, red_flag]

front:
  title: 2-3 月龄不看人脸不转头送医
  hook: 视听发育红旗信号

back:
  why_matters: |
    2-3 月龄宝宝最爱看人脸,看到妈妈面容会注视较长 + 偶尔微笑。
    出生头半年是视敏度发展关键期,2 月时已能对不同波长(颜色)做出区分。
    鲍秀兰:2-3 月龄宝宝**不注视人脸 / 听到声音不转头** → 加紧训练 + 立即找专业医生检查诊断。
  what_to_do:
    - 父母用慈爱目光俯视宝宝,看是否注视
    - 移动头位,看眼球是否追随
    - 在身边发声,看是否转头寻找
    - 没反应别等"长大就好",立刻找医生
    - 复查视力 + 听力 + 神经系统
  failure_mode: |
    觉得"宝宝小,看不清正常"→ 错过头半年干预黄金期。
    只观察"睡多吃多没事"→ 漏掉感觉发育异常。
  evidence_level: A


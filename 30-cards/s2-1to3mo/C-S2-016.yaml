front:
  title: 3 月里程碑:出声笑+发元音
  hook: 听到笑声该回应"你说"

back:
  why_matters: |
    3 月龄语言里程碑:**出声笑**(此前只是面部微笑)+ **发元音**(a/e/i/o/u 等清晰音)。
    这是 cooing(咕咕语)阶段开始,标志听觉-发声反馈回路开始建立。
    鲍秀兰:此时家长应在情绪愉快时多与宝宝说笑、引他发音,可用不同语调(亲切/激动/命令)训练宝宝分辨,作出不同反应。
  what_to_do:
    - 用不同语调(亲切/命令/激动喊叫)训练宝宝分辨
    - 宝宝发"啊...哦..."时立即回应"你说话呀,真好!"
    - 重复宝宝发出的音 + 加新音引导
    - 父亲和其他家庭成员都参与
    - 营造"语言交往"氛围,不只单向说
  failure_mode: |
    宝宝发音了不回应 → 错过强化的关键瞬间。
    觉得"啊啊咿咿没意义"→ 错过 cooing 语言基础期。
  evidence_level: B

glossary_refs:

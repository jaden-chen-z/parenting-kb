card_id: C-S2-069
stages: [S2]
tags: [philosophy]

front:
  title: 6 周开启"咿呀对话"
  hook: 你模仿宝宝是真本事

back:
  why_matters: |
    Wolff 报告:从 6 周左右,**家长可以通过模仿宝宝的咿呀声,跟宝宝进行 10-15 个回合的"对话"**。
    这是真依恋形成的早期工具:
    - 宝宝发声 → 你模仿(同样的声音)
    - 宝宝听到自己的声音被反射回来 → 兴奋继续发声
    - 来回 10-15 次,母婴节奏同步
    Rheingold et al. (1959) 证实:每次咿呀回应一次微笑 + 三声啧啧 + 轻捏腹部 → 频率翻倍。
    这套机制 = 父母语 (parentese) + 母婴交谈链(turn-taking)的基石。
  what_to_do:
    - 6 周起每天主动跟宝宝"对话"
    - 你模仿他发的声音(不是说大人话)
    - 等他停顿再回应(不抢话)
    - 微笑 + 抚摸同步加强
    - 10-15 回合一次,每天数次
  failure_mode: |
    "宝宝还不会说话,跟他说啥" — 错过咿呀对话窗口,语言起步晚。
    单方向"教说话"(只你说他听)效果远不如双向模仿。
  evidence_level: B


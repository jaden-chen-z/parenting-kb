card_id: C-S2-021
stages: [S2]
tags: [philosophy]

front:
  title: 8 周宝宝已能区分爸妈
  hook: 见妈柔和、见爸激动

back:
  why_matters: |
    8 周大的婴儿已能用细微的肢体节律区分母亲、父亲、陌生人——这是 Brazelton 在波士顿儿童医院实验室通过录像 frame-by-frame 分析发现的。
    见妈妈:手脚以每分钟 4 次的平滑周期伸缩;见爸爸:身体绷紧、眉毛上扬、四肢猛伸出去等待逗玩;见陌生人（包括医生）:先亮一下立刻转开。
    新手父母常以为这么小看不出谁是谁,错失早期"被认得"的成就感。
  what_to_do:
    - 观察宝宝见到你时的手脚节律
    - 妈爸不必给同样的互动,差异有益
    - 爸爸用更夸张的"逗"风格不算粗鲁
    - 录 30 秒视频回看动作差异
  failure_mode: |
    妈妈强迫爸爸用"温柔妈妈式"哄抱,剥夺宝宝感受两种风格的机会。
    Brazelton 视角:妈爸节律不同恰恰丰富宝宝神经发育,统一反而单调。
  evidence_level: C

  positions:
    issue: 6-8 周事件命名群 — 同一发育跃迁的多个名字
    views:
      - school: Karp
        source: SRC-003
        stance: 哭闹峰(peak fussing)— 6 周是哭闹达高峰、随后递减的关键节点。
      - school: Brazelton
        source: SRC-010
        stance: 6-8 周触点(touchpoint)— 父母最焦虑、亲子关系重新校准的发育节点。
      - school: Wonder Weeks
        stance: WW8 模式跃迁 — 婴儿大脑首次能识别复杂模式,行为外显为不安。
      - school: Bowlby
        source: SRC-011
        stance: 6 周非选择性微笑 — 社会性微笑出现,但尚不区分照顾者。

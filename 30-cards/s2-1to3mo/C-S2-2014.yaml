front:
  title: 乳痂(脂溢性皮炎)处理 5 步
  hook: 油 → 按摩 → 洗

back:
  why_matters: |
    乳痂(cradle cap)= 婴儿头皮脂溢性皮炎,头皮黄/褐色片状油垢,1-3 月最常见。
    病因:皮脂腺分泌过盛(母体激素影响),非真菌也非病菌。
    海蒂安抚:"几乎所有宝宝都会有",通常 1 岁前自愈,极少持续到幼儿期。
    严重时可蔓延到面/颈/耳后。
  what_to_do:
    - "轻度:橄榄油/凡士林轻按摩头皮 10 分钟"
    - "细密梳/软牙刷轻刮松开"
    - "用婴儿洗发水洗净"
    - "中重度:Sebulex(含硫黄水杨酸)抗脂溢洗发"
    - "不戴帽 + 头皮保持凉爽干燥"
  failure_mode: |
    用指甲抠 → 出血感染。
    用偏方"蛋清/醋"敷 → 加重刺激。
    严重蔓延到面颈不去医院 → 可能升级成湿疹要药膏。
  evidence_level: B


card_id: C-S2-550
stages: [S2]
tags: [daycare, quality-criteria, working-mother]

front:
  title: 优质保育园 5 标准
  hook: 1:3 比是底线不能让

back:
  why_matters: |
    松田给出硬标准:1 名保育员照料 ≤ 3 个婴儿,正常保育才能开展。
    其他 4 条:仅收 0-1 岁(避混龄)/ 婴儿室不窄+通阳台空气浴 / 跟家庭密切沟通+家访 / 离家越近越好。
    中国家长选保育园多看"硬件",不看 1:3 比。1:5 / 1:8 比的园,实质是事故防范不是教育。
    8 小时是国家公务员标准,延长保育不利娃发育(母子 8 小时以上分离)。
  what_to_do:
    - 实地看保育员:婴儿比例 ≤ 1:3
    - 拒绝 0-3 岁混龄园
    - 选有阳台/可空气浴的
    - 看家访制度,定期沟通
    - 选离家近,即使硬件次
  failure_mode: |
    选名牌远程保育园 → 妈每天 1 小时通勤 → 娃延长保育疲惫,回家喝奶就睡,失去家庭生活体验。
  evidence_level: B


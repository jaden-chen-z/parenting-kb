card_id: C-S2-015
stages: [S2]
tags: [safety, red_flag]

front:
  title: 3 月翻身训练,千万别独留
  hook: 翻身瞬间掉下床 = 常见急诊

back:
  why_matters: |
    3 月起翻身动作出现:从仰卧到侧卧,4 月可完成全翻。
    翻身是早期运动重要里程碑,但同时是**新生儿期最危险的转折** — 父母措不及防,宝宝突然翻下床。
    鲍秀兰警告:3-4 月龄宝宝刚开始会翻身,家人没思想准备,一旦突然翻身掉下床即使未受伤,仍会使父母惊恐不已。
  what_to_do:
    - 3 月起任何床上时间不要独留宝宝
    - 用玩具引导左右两侧翻身练习
    - 不要给穿太多 / 包太紧,留自由活动空间
    - 父母手随时在床边,准备接
    - 换尿布 / 拿东西也不离开
  failure_mode: |
    "宝宝才 3 月不会翻"觉得安全独留 → 突然翻身摔下床 / 沙发。
    继续穿过厚衣 / 包紧 → 翻身练习受限。
  evidence_level: A


card_id: C-S2-068
stages: [S2]
tags: []

front:
  title: 6 周后,看脸比听声更管用
  hook: 视觉接管社交主力

back:
  why_matters: |
    Bowlby 描述什么能逗宝宝笑的转换:
    - 3-5 周:嗓音最有效(尤其高频女声)
    - 5 周末:嗓音变得没那么管用,**人脸接管主力**
    - 触觉/动作感觉也重要(拍手游戏即使看不见听不见也能引发笑)
    Robson (1967) 指出这个转换可能标志**新皮层(理性脑)开始工作**(脑发育里程碑)。
    家长意义:6 周后跟宝宝玩,要让他**看到你的脸**,光说话效果会下降。
  what_to_do:
    - 6 周后近距离面对面互动(20-30 cm)
    - 表情多变(运动的脸 + 柔光下 + 接近婴儿)
    - 配合嗓音 + 抚摸 = 最强组合
    - 不强求"边做家务边逗" — 视觉接触缺失会减弱效果
    - 玩拍手 / 摇头游戏(触觉本体觉刺激)
  failure_mode: |
    "宝宝怎么不爱听我说话了" → 因为他需要看你的脸。
    侧脸不够,要正面;运动的脸 > 静止照片(实验证实)。
  evidence_level: B


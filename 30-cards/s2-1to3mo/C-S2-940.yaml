front:
  title: "社会化 5 大领域"
  hook: "教娃有 5 类不同活儿"

back:
  why_matters: |
    Bugental & Grusec(Ch 7)综述新框架 — 父母教孩子分 5 个独立领域:
    ① 保护(防危险)② 互惠(轮流分享)③ 控制(立规矩)④ 群体(谁是自己人)
    ⑤ 配偶(性别角色)。每个领域用不同教法,搞混就出问题。
    一句话 — 教孩子不是单线"听话",是 5 类活儿各自要工具。
  what_to_do:
    - "保护 — 用恐吓(火会烫)"
    - "互惠 — 用示范(我给你你给我)"
    - "控制 — 用规则(吃饭要坐)"
    - "群体 — 用故事(咱家这样做)"
    - "配偶 — 用角色(妈也工作爸也做饭)"
  failure_mode: |
    所有事都用一种方法(全用恐吓 / 全用讲道理)。
    Bugental-Grusec — 5 领域要 5 种工具,搞混效果差。
  evidence_level: B


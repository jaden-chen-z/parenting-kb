card_id: C-S2-013
stages: [S2]
tags: []

front:
  title: 不等啼哭再喂,及时响应
  hook: 哭后才喂 = 安全感损耗

back:
  why_matters: |
    及时响应 = 在宝宝有需求(饿、尿、不适)的早期信号出现时就回应,不等到大哭才行动。
    早期信号:吐舌头、转头找乳头、蹬腿、皱眉、轻哼哼。
    鲍秀兰:不要待婴儿啼哭后再去喂奶,要在他安静觉醒、有发音活动时主动与他互动 — 这是建立 0-3 岁安全感和良好生活规律的基础。
  what_to_do:
    - 安静觉醒 / 有发音活动时主动抱起、说话
    - 看到吐舌头转头 = 早期饥饿信号,立即喂
    - 按时按量喂喝睡,逐步建立昼夜节律
    - 观察大小便规律(时间 / 量 / 颜色 / 形状)
    - 不要 "宝宝不哭就不用管"
  failure_mode: |
    哭得撕心裂肺才喂 → 反复体验"无人响应"→ 安全感受损,2-3 月起更难安抚。
    完全不立规律按需放任 → 错过昼夜节律建立。
  evidence_level: B


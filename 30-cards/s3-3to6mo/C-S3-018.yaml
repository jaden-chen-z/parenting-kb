card_id: C-S3-018
stages: [S3]
tags: [philosophy]

front:
  title: 4 月找朋友:户外接触小朋友
  hook: 别强迫,看宝宝笑了再近

back:
  why_matters: |
    4 月起宝宝认人能力发展,开始对陌生人有警觉反应,但也是早期社交启蒙的窗口。
    鲍秀兰:在户外让宝宝看其他小朋友,先远观再渐进 — 培养社交意愿,但**完全不强迫**:宝宝笑了表示愿意,躲妈妈怀里表示害怕。
    多接触不同人 → 减轻陌生焦虑,扩大社交圈。
  what_to_do:
    - 户外活动时让宝宝远处观察其他小朋友
    - 观察宝宝反应 — 笑 = 愿意,躲 = 害怕
    - 笑了可让他们握握手
    - 躲了不强迫,只让旁观直到笑容出现
    - 也接触周围成人(熟人优先,渐近生人)
  failure_mode: |
    强行让宝宝接触陌生小朋友 → 加重陌生焦虑。
    "不让宝宝接触别人怕生病"→ 错过 4-9 月社交启蒙窗口。
  evidence_level: C


card_id: C-S3-002
stages: [S3]
tags: [safety]

front:
  title: 过敏食物 4-6 月就引入,不要等
  hook: AAP:推迟到 6 月后没用

back:
  why_matters: |
    婴儿食物过敏近 20 年翻倍,美国约 8% 儿童有(花生过敏率最高)。
    曾经的建议是"推迟引入花生 / 蛋 / 鱼到 1-3 岁",但 LEAP 研究(2015)证明:
    4-11 月起每周给宝宝 6g+ 花生酱,5 岁时花生过敏率比对照组低 81%。
    AAP 立场更新:推迟易过敏食物到 6 月后,**不能**预防过敏。
    早引入(4-6 月)反而是保护。
  what_to_do:
    - 4-6 月辅食起步就引入 8 类易过敏:蛋 / 奶 / 大豆 / 花生酱 / 鱼 / 小麦 / 树坚果 / 贝类
    - 形态:必须软泥/酱,绝不给整粒整块
    - 一次只 1 类新食物,3-5 天看反应
    - 家族有严重过敏先问医生
    - 出皮疹 / 呕吐 / 呼吸困难立刻送医
  failure_mode: |
    推迟到 1 岁后才给花生 → 反而增过敏风险(LEAP 已证)。
    给整粒花生 → 窒息致死(必须酱状)。
  evidence_level: A


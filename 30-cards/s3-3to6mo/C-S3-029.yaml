card_id: C-S3-029
stages: [S3]
tags: [controversy]

front:
  title: 4 月夜醒增多别冲进去
  hook: 90 分钟一醒是设计

back:
  why_matters: |
    4 月起宝宝睡眠周期从婴儿型转向成人型:每 90 分钟一次浅睡、每 3-4 小时一次接近清醒。
    Brazelton 强调:这是神经成熟的标志而非"睡眠倒退"。
    但浅睡时宝宝会哭出声、扭动、甚至坐起,父母一冲进去抱起喂奶,就把自己变成了宝宝睡眠周期的"必需零件"——以后每 4 小时都得起来。
    最关键的预防窗就是 4-5 月。
  what_to_do:
    - 听到哭声等 5 分钟再判断
    - 进去也只拍背、不抱起、不喂奶
    - 宝宝半睡半醒爬动时不要弄醒
    - 建立固定的睡前仪式（暗灯、轻歌）
  failure_mode: |
    第一次哭就抱起来喂,建立"哭→抱→喂→睡"的强关联。
    Brazelton:"如果父母冲进去,他们就会变成宝宝唤醒模式的一部分,以后每 3-4 小时都必须在场帮他重新入睡。"——不是 cry it out,而是"少干预"。
  evidence_level: B


card_id: C-S3-021
stages: [S3]
tags: []

front:
  title: 5-6 月藏猫猫 + 找掉物训练
  hook: 物体永久性 = 认知质变

back:
  why_matters: |
    物体永久性(object permanence)= 婴儿理解物体即使从视野消失,仍然存在不是不见了,是 8-10 月认知里程碑(Piaget 经典发现)。
    4 月前是"眼不见心不想",5-6 月开始萌芽,8-10 月成熟。
    鲍秀兰教法:藏猫猫游戏(手绢蒙脸然后突然露出)+ 故意把勺子掉地让宝宝寻找 — 培养这种认知质变。
  what_to_do:
    - 藏猫猫:手绢蒙妈妈脸,问"妈妈在哪",突然拉掉
    - 反复让宝宝学着将手绢拿开
    - 改变方式(总从一边露脸→换另一边)激发惊讶
    - 故意把勺子 / 小车掉地,让宝宝伸头找
    - 找到后用夸奖语气强化
  failure_mode: |
    觉得"宝宝小不懂,白玩"→ 错过 5-10 月物体永久性培养。
    一直从同一边露脸 → 模式固化,不锻炼认知。
  evidence_level: B

  positions:
    issue: 物体永久性月龄 — 8-10 月还是 4 月
    views:
      - school: Piaget / 鲍秀兰
        source: SRC-009
        stance: 8-10 月成熟(行为版)— 用动作测,孩子能找盖布下藏起的物体。
      - school: Spelke / Gopnik
        source: SRC-015
        stance: 4 月就有雏形(认知版)— violation-of-expectation 范式测惊讶反应,雏形早在 4 月。
      - school: AAP
        source: SRC-004
        stance: 8-10 月萌芽(主流行为派立场,临床观察一致)。
      - school: 学界争议
        stance: Heyes 2014 等批评 violation-of-expectation 范式可能过度解读;两者层级不同,都对。

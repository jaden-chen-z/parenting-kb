card_id: C-S3-001
stages: [S3]
tags: []

front:
  title: 4-6 月加辅食半勺起 3-5 天换一种
  hook: 看头控+体重达标,不只看月龄

back:
  why_matters: |
    辅食(complementary food)= 母乳 / 配方奶之外的固体或半固体食物。
    4 月前消化系统还没就绪、容易触发未来过敏、还会增加窒息风险 → AAP 不推荐过早加。

    中国传统"4 月就开始米糊"vs AAP 主推 6 月(4-6 月之间也行,关键看宝宝准备好了没)。

    AAP 准备好的三个信号:
    1. 头部控制好(能稳坐头不晃)
    2. 体重达到出生时的两倍(约 13 磅 / 6 公斤,通常 4 月达到)
    3. 看大人吃饭会伸手要

    起点:每次只半勺糊状,单一成分新食物间隔 3-5 天再换一种(观察过敏反应)。
  what_to_do:
    - 看 3 个准备信号:头控好 + 体重约 13 磅 + 看大人吃会伸手
    - 满 6 月主推,绝不在 4 月前开始
    - 第一口:半勺糊状或泥状,慢慢加到 1-2 茶匙
    - 一次只加 1 种新食物,等 3-5 天看是否过敏再换
    - 优先含铁含锌的:肉泥 + 强化铁米粉(6 月起铁需求骤增)
  failure_mode: |
    只看月龄硬上(宝宝还没准备好的信号)→ 吐 / 拒食 / 呛。
    一次给 5 种新食物 → 过敏了不知道是哪个,只能全停了重新试。
  evidence_level: A


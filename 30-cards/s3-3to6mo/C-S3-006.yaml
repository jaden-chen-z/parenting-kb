card_id: C-S3-006
stages: [S3]
tags: [safety]

front:
  title: 母乳宝宝 4 月起补铁,12 月查血
  hook: 母乳铁低,6 月起需求骤增

back:
  why_matters: |
    婴儿铁需求高(每 kg 体重需求是成人 5 倍),因为大脑 + 血容量快速增长。
    母乳铁含量低(0.35 mg/L,远低于配方奶 12 mg/L)— 但出生时铁储备够前 4 月。
    中国 6-24 月儿童贫血率高(研究数据 20-30%,中文家长盲区)。
    AAP:4 月起母乳/部分母乳宝宝补 1 mg/kg/d 口服铁,直到引入含铁辅食。
    **所有宝宝 12 月做铁缺乏 + 贫血筛查**(全员,不分喂养方式)。
    缺铁影响神经发育,部分不可逆。
  what_to_do:
    - 母乳/部分母乳宝宝:4 月起每天 1 mg/kg 口服铁滴
    - 引入含铁辅食(肉泥 + 强化铁米粉 + 绿菜)就停补
    - 早产/低体重/妊娠糖尿病妈妈宝宝 → 出生后 1 月就开始补
    - 12 月儿保必查铁缺乏 + 贫血(全员)
    - 配方奶宝宝铁已强化,不必另补
  failure_mode: |
    母乳宝宝不补铁 → 4-12 月缺铁性贫血 → 神经发育受影响(部分不可逆)。
    12 月不查血 → 隐性贫血漏诊。
  evidence_level: A


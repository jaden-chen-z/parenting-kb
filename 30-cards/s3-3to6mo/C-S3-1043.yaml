card_id: C-S3-1043
stages: [S3]
tags: []

front:
  title: "4 月前肠没准备"
  hook: "4 月前坚决不给"

back:
  why_matters: |
    为什么 4 月前不给辅食(WHO + Lancet 2016 + AAP 共识):
    ① 肠道屏障未成熟 — 蛋白分子穿透增加过敏
    ② 肾功能未成熟 — 钠/蛋白负担
    ③ 吞咽-呼吸协调未成熟 — 窒息风险
    ④ 头控未稳 — 不能坐稳吃
    ⑤ 母乳/配方足够 — 不需要额外能量中国传统'4 月加米粉助消化/助睡' → 错的:
    - 米粉 = 碳水化合物 = 短期饱但消化负担
    - 4 月前肠道生不出消化酶处理米粉
    - '助睡眠' 没有证据 — 反而干扰夜醒喂奶。
  what_to_do:
    - "4 月前坚决不给任何辅食(WHO/AAP/鲍/松田一致)"
    - "'4 月加米粉助消化' 是错的 — 4 月前肠道反而不能消化"
    - "米粉助睡眠是误传 — 反而干扰夜醒"
    - "听老人/亲戚施压 → 拿 WHO/AAP 立场堵回去"
    - "想早开始 → 至少等 4 月 + 看准备好信号"
  failure_mode: |
    4 月前给米粉 / 蛋黄 / 果汁 → 过敏风险增 + 肠道损伤 + 母乳量被替代下降。
    肠道是娃的免疫第一道,等 6 月发育好。
  evidence_level: A

  positions:
    issue: 辅食(CF)何时引入 — 6 月 EBF 还是 4-6 月看 readiness
    views:
      - school: WHO / UNICEF
        source: SRC-031
        stance: 6 月起辅食(不早不晚)— EBF 0-6 月明确操作定义(连水都不给,例外 ORS / 维生素 / 药物)。
      - school: AAP
        source: SRC-006
        stance: 4-6 月,看 readiness 信号(头控 / 伸手抓 / 能从勺到喉)+ LEAP 早引入立场。
      - school: 鲍秀兰
        source: SRC-009
        stance: 6 月起辅食,跟 WHO 一致;反对 4 月前给水或辅食。
      - school: 松田道雄
        source: SRC-024
        stance: 5-6 月起,有弹性;不等到严格 6 月,但也反对 4 月前提前。
      - school: 中国家长共识
        stance: 默认 6 月起,4 月前坚决不给(4 派立场一致,中国家长普遍接受)。

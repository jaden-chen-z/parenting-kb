front:
  title: 6 月点头摇头训练
  hook: 「对/不对」第一种沟通

back:
  why_matters: |
    点头 = "对/好",摇头 = "不对/不好" — 是宝宝**学会用动作表达意思的第一种沟通方式**,先于真正语言。
    6 月理解力快速提升,鲍秀兰的训练法用饮食场景:给喜欢的食物时教点头说"对对",给不喜欢的教摇头说"不对" — 多次后宝宝会主动用点头/摇头表达。
    这是非语言交流的开始,为后续语言奠定基础。
  what_to_do:
    - 给喜欢吃的:教点头 + 说"对,对"
    - 给不喜欢的:教摇头 + 说"不对,不对"
    - 反复多次训练,先动作后口头语
    - 每次出现该机会都强化
    - 鼓励宝宝自己用点头摇头表达喜恶
  failure_mode: |
    觉得"宝宝小不懂"→ 错过非语言沟通启蒙。
    强加成人意愿(只点头不能摇头)→ 反伤主动表达。
  evidence_level: C


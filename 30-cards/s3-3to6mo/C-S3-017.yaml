stages: [S3]
tags: [philosophy]

front:
  title: 4 月表情反应+镜子认自己
  hook: 镜中是另一个朋友

back:
  why_matters: |
    4 月起宝宝可分辨不同面部表情(笑/哭/惊讶),也开始对镜中影像产生兴趣。
    "照镜子让宝宝做事梦"是中国老一辈无依据的迷信,鲍秀兰直接反驳:**镜子是宝宝认识自己的第一工具**,可促进自我意识 + 五官认知。
    经常照镜子的宝宝会做鬼脸 + 大笑,反应敏捷度提升。
  what_to_do:
    - 用不同表情(笑/惊/哭脸)训练宝宝分辨
    - 抱宝宝到镜子前,指自己:"这是妈妈"
    - 指宝宝:"这是宝宝"
    - 教宝宝认五官:眼睛 / 鼻子 / 嘴
    - 不必强求宝宝指对,反复说就行
  failure_mode: |
    "照镜子做事梦"老一辈说法 → 错过自我意识训练工具。
    强求宝宝准确指五官 → 反伤兴趣。
  evidence_level: C


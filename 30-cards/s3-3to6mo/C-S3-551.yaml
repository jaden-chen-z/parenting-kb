card_id: C-S3-551
stages: [S3]
tags: [training, anti-early-edu, baby-gym]

front:
  title: 婴儿体操不是必须
  hook: 日常照料已暗含锻炼

back:
  why_matters: |
    松田说:在家养育的婴儿,不是必须做婴儿体操。
    日本传统:不分昼夜换洗尿布、夏季每天 2 次澡 — 穿脱衣服动作已达到体操效果。
    前苏联用棉斗篷裹婴儿不让动,所以体操才必要。
    现代中国家长被"早教课"焦虑压住,其实日常细心照料已够。
  what_to_do:
    - 每天换尿布/洗澡时让娃自由动
    - 不强加"早教课"日程
    - 想做体操选屈伸 1-2 分钟
    - 别强拉膝防髋关节脱臼
    - 看娃情绪 — 不情愿就停
  failure_mode: |
    妈花钱报"婴儿体操班" → 没那么多用,反挤压娃自由探索时间。
  evidence_level: B


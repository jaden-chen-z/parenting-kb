card_id: C-S3-012
stages: [S3]
tags: [safety, red_flag]

front:
  title: 出牙 4-7 月,> 38.3°C 不是出牙
  hook: 高烧不是出牙,立刻找医生

back:
  why_matters: |
    出牙(teething)= 乳牙穿过牙龈萌出的过程,1 岁内宝宝平均长 6-8 颗。
    传统育儿把各种婴儿不适都归咎出牙(发烧 / 拉肚子 / 烦躁),但实际多数高发期症状跟出牙无关。
    AAP:出牙 4-7 月起,**中切牙先**(central incisors,下后上),然后第一磨牙、犬牙。
    真正出牙症状轻:轻烦 + 流口水 + 咬硬物 + 牙龈肿 + **微发烧(< 38.3°C / 101°F)**。
    **> 38.3°C 不是出牙** — 多数是感染,必须找医生(把高烧归咎出牙是常见误诊)。
  what_to_do:
    - 4-7 月起观察出牙(中切牙下后上)
    - 缓解:手指按摩牙龈 + 硬橡胶咬胶
    - 不用冰冻牙咬胶(太硬反伤牙龈)
    - "**体温 > 38.3°C 立刻找医生**(不是出牙)"
    - 第一颗牙后 6 月内见牙医,不晚于 12 月
  failure_mode: |
    把 39°C 高烧当出牙拖延 → 错过感染诊断(可能严重)。
    冰冻牙咬胶 → 太硬反伤牙龈和新牙。
  evidence_level: A


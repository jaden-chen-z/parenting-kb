front:
  title: 6-7 月陌生人焦虑应对术
  hook: 别看脸,眼神斜过去

back:
  why_matters: |
    陌生人焦虑（stranger anxiety）从 5-6 月萌芽,6-7 月达高峰:宝宝突然怕外婆、怕保姆、怕医生,一对视就大哭。
    Brazelton 临床绝活:不正面看脸、说话越过宝宝头顶聊天、让父母俯身在宝宝上方。这套方法能完成完整体检不哭。
    新手父母常焦虑地"训练宝宝认人"——硬塞给亲戚抱、面对面逗笑——结果加剧创伤记忆。
  what_to_do:
    - 陌生人先在房间里说话,不靠近不对视
    - 让宝宝在父母怀里观察 5-10 分钟
    - 等宝宝主动看陌生人再回应
    - 提前告诉爷爷奶奶:"别冲过来抱"
  failure_mode: |
    长辈不听劝,热情伸手抱宝宝大笑"我来啦!",宝宝瞬间崩溃,亲戚生气说"你们把孩子带怕生了",全家陷入互相责怪。
  evidence_level: B


front:
  title: 4 月视听训练 6 法清单
  hook: 户外/音乐/图书/追视/滚球/手电

back:
  why_matters: |
    4 月视觉焦距能力达成人水平,听觉对方位识别开始;视听刺激丰富度直接影响神经突触密度。
    单一玩具刺激远不够,鲍秀兰列 6 类训练法 — 多感官多场景反复刺激是 4 月发育核心策略。
    每条都是日常可做,不需要昂贵教具。
  what_to_do:
    - ① 看人脸听人声 — 父母 + 熟人/生人对比
    - ② 变玩具花样 — 大→小,红衣扣 / 小绿豆
    - ③ 户外活动 — 太阳 / 月亮 / 花树 / 车辆 / 鸟
    - ④ 看图片画报 — 大图 / 鲜艳 / 边看边讲名称
    - ⑤ 听音乐 — 自然声 / 动物叫,不要节奏过快
    - ⑥ 看滚球 / 追手电光 — 训练视觉追踪
  failure_mode: |
    只在家放儿歌音箱 → 缺多感官多场景。
    音乐节奏过快声音过强 → 损伤婴儿听力。
  evidence_level: C


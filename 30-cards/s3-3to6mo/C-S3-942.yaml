front:
  title: "4 月偷瞄妈定情绪"
  hook: "他偷瞄你脸定情绪"

back:
  why_matters: |
    Campos(via Ch 5 Saarni 综述)— social referencing 不是 8 月才出来,4-6 月就有萌芽形式。
    遇到中性刺激(陌生玩具、轻响声),婴儿先看妈表情再决定情绪反应。
    妈紧张他怕,妈轻松他探索。一句话 — 你的脸 4-6 月起就在写他的情绪剧本。
  what_to_do:
    - "新东西出现你先放松"
    - "你怕的(蜘蛛)别夸张反应"
    - "你的自动反应 = 他的学习"
    - "夫妻不一致他更困惑"
    - "你脏老人不脏 → 他更怕脏"
  failure_mode: |
    不知道 4 月就在 referencing,自己情绪不管理,娃焦虑底色被建起来。
    Campos — 4-6 月窗口期形成的情绪模板,后期改特别难。
  evidence_level: B


front:
  title: 5 月靠坐+直立跳跃训练
  hook: 头到躯干,运动机能下传

back:
  why_matters: |
    5 月运动机能从头部发展到躯干,身干肌肉可支持脊柱直立片刻。
    鲍秀兰具体方法:沙发或椅上靠坐(扶手 + 棉垫支撑)+ 直立跳跃(家长扶腋下让宝宝双足在腿上跳跃)。
    "直立跳跃"既锻炼肌力,又是欢快情绪体验,**为后期学站立做准备**。
  what_to_do:
    - 靠坐:沙发扶手 / 椅子 / 床上棉垫支撑
    - 慢慢减少身后靠垫,让独坐片刻
    - 直立跳跃:家长坐位扶宝宝腋下
    - 让宝宝双足在家长腿上一中一距跳跃
    - 每次 1 分钟左右,每天 1-2 次
  failure_mode: |
    长时间硬靠坐(超 10 分钟)→ 5 月肌力弱,伤脊柱。
    站直立跳跃太久 → 髋部承重过早,影响下肢发育。
  evidence_level: C


card_id: C-S3-009
stages: [S3]
tags: [safety]

front:
  title: 翻身 5 月起,7 月双向
  hook: 翻身了立刻停包,防窒息

back:
  why_matters: |
    翻身(rolling over)= 婴儿能从仰卧自主翻成侧 / 俯卧再翻回。是 4-7 月大动作里程碑核心。
    翻身意味着进入"会动"阶段 — 也是窒息风险骤升的转折点(包裹 + 翻身 + 趴卧是 SIDS 死亡常见三联)。
    AAP 节奏:5 月起萌芽(撑胸 + 蹬腿 + 自摇),7 月通常双向(stomach ↔ back)。多数宝宝先肚子→背,反过来也正常。
    关键安全:**翻身后必须停止包裹**,否则一翻成趴卧 = 窒息致死。
  what_to_do:
    - 5 月起观察翻身信号(撑胸 / 蹬腿 / 自摇)
    - 多数先肚→背,反过来也正常
    - 7 月通常双向都会
    - "**试图翻身就立刻停包**(参 C-S1-038)"
    - 床边 / 尿布台高处加防护,不留独自
  failure_mode: |
    7 月还不会单向翻 / 肢体不对称发展 → 找医生评估。
    翻身后还硬包 → 翻成趴卧 → SIDS / 窒息致死。
  evidence_level: A


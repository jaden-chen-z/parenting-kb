front:
  title: 4 月看吊桥不可能动惊呆
  hook: 物体不会穿越固体

back:
  why_matters: |
    Baillargeon 1985 吊桥实验(Lerner V2 Ch5)— Spelke 核心知识"物体系统"硬证据。
    实验设计:
    - 4 月宝宝看吊桥从平面转到 90 度(180 度也可能)
    - 第一阶段:背后无物 → 吊桥转 180 度 OK
    - 第二阶段:背后藏一方块 → 吊桥应该被挡住停在 90 度
    - 关键测试:吊桥**仍转 180 度**(不可能 — 方块应该挡住)
    - 4 月宝宝盯这个"不可能事件"明显更久 = 知道"物体不能穿越"
    意义:
    - 4 月就懂物理"固体性"原则
    - Piaget 8 月物体永久错(他用"找物体"测,需要协调动作)
    - V2 综述:Baillargeon 是 Spelke 核心知识"物体系统"的奠基实验
    - 可重复多研:Hespos 2001 + Wang 2004 都复制跟现库:C-S3-188 已建 Spelke/Baillargeon 物体永久 4 月,V2 给吊桥实验细节。
    G-PERSON-Spelke 已建,补 SRC-028 引用。
    对中国家长意义:
    - 4 月就懂"东西不会穿墙" — 不是 8 月
    - 玩"消失再现"游戏 4 月就 OK(简化版躲猫猫)
    - 不要"他还小什么都不懂"为不互动找理由
  what_to_do:
    - 4 月起玩简单"消失再现"
    - 让物体进入袋子 / 容器,再取出
    - 不必等 8 月才认知互动
    - 看到宝宝"惊讶"反应 — 他在做实验
  failure_mode: |
    "4 月物体不见就忘" — 错。盯不可能事件就证明记得。
    "Piaget 是对的" — V2 综述明确推翻。
    "4 月给玩具藏起来太早" — 不早,他在测物理规律。
  evidence_level: B


card_id: C-S3-024
stages: [S3]
tags: [safety, red_flag]

front:
  title: 6 月红旗:4 项异常立刻送医
  hook: 不大笑/不拿物/漠不关心/吃不进

back:
  why_matters: |
    6 月是发育评估关键节点,健康宝宝应**会大笑 + 主动拿物 + 对照顾人有反应 + 能吃软食**。
    鲍秀兰列 4 项**红旗信号**:发现任一,加紧训练并立即找专业医生检查诊断。
    这 4 项分别对应**情绪 / 大动作 / 社会交往 / 喂养**4 大维度异常,可能提示发育迟缓 / 自闭谱系 / 神经异常等。
  what_to_do:
    - ① 6 月不会大笑(不只是微笑)→ 送医
    - ② 6 月不主动拿身边的物品 → 送医
    - ③ 6 月对照顾他的人漠不关心 → 送医
    - ④ 食物难以送进 6 月宝宝口中 → 送医
    - 发现任一别等"再看看",立刻找医生
  failure_mode: |
    觉得"宝宝慢半拍正常"反复推迟评估 → 错过早期干预黄金期。
    家中无人识别红旗,等 1-2 岁才发现已晚。
  evidence_level: A


card_id: C-S3-078
stages: [S3]
tags: []

front:
  title: 4-6 月对妈妈反应明显但还认人浅
  hook: 依恋发展第 2 阶段

back:
  why_matters: |
    Bowlby 4 阶段依恋发展时间表的**第二阶段**:**对一个或多个区分对象的直接定向和信号**(~12 周-6/7 月)。
    特点:
    - 对妈反应**比对其他人明显**(笑得更灿烂、说话更多、停哭更快)
    - 但**陌生人也能很自在地引发笑容**(还没有警觉)
    - 视觉上 14 周认母面孔,但听觉/嗅觉早 4 周就有区分
    家长意义:这个时期外人可以自由抱玩 — **不是已经开始陌生人焦虑的时候**(陌生人焦虑要 8 月后)。
    可以让爷爷奶奶 / 朋友熟悉宝宝,等到 8 月后会困难得多。
  what_to_do:
    - 4-6 月利用"对所有人友好"窗口扩大宝宝社交圈
    - 让爸爸 / 祖辈 / 经常见的朋友抱玩 — 现在熟悉,8 月后就不会怕陌生人
    - 母亲仍是主依恋,但允许形成次要依恋
    - 不必担心宝宝对陌生人笑 = 不爱妈妈(还没到选择性阶段)
  failure_mode: |
    "宝宝怎么谁抱都行,跟妈不亲" — 4-6 月是这样,正常。
    错过这窗口,8 月后再让陌生人接近就会引发恐惧反应。
  evidence_level: B


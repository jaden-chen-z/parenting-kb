card_id: C-S3-705
stages: [S3]
tags: [juice, vitamin-c, anti-pressure]

front:
  title: 4 月加果汁不强求
  hook: 母乳娃完全不必加

back:
  why_matters: |
    松田立场:母乳含维 C → 母乳娃完全不必加果汁,不会缺维 C。
    奶粉娃用复合维生素也够,加果汁也只是"补充"。
    但松田说"还是给加果汁为好" — 不是营养理由,是让娃练奶嘴 + 体验味觉乐趣 + 缓解便秘。
    中国家长被"4 月起必须加果汁"焦虑误导。其实加不加由娃定。
  what_to_do:
    - 母乳娃可不加,看娃喜好
    - 奶粉娃有复合维生素就够
    - 便秘娃尝试加,2 月起小量
    - 选淡浓度,娃肯持续喝就行
    - 不强加,有娃就是不爱喝
  failure_mode: |
    妈"4 月起必须加" + 强灌橙汁 → 娃过敏风险 + 厌食 + 后续奶量降。
  evidence_level: B


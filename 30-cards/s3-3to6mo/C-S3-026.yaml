card_id: C-S3-026
stages: [S3]
tags: [philosophy]

front:
  title: 6 月理性对哭声求助
  hook: 别立即替他,推他自己努力

back:
  why_matters: |
    6 月起宝宝尝试自己拿玩具,够不到会哭着求助 — 这是培养独立性 vs 依赖性的关键分叉。
    鲍秀兰平衡立场:直接帮 → 失去练习机会 + 培养依赖;冷漠不理 → 也不可取。
    正确做法:轻推宝宝脚丫往前,帮他自己努力达到 — 既满足要求又锻炼身心,培养自信。
    与 0-3 月"立刻回应一切哭声"不同,6 月起渐入"引导独立"阶段。
  what_to_do:
    - 趴着够不到玩具哭时,别立即把玩具递给他
    - 用手掌轻推宝宝小脚丫往前一下
    - 让他自己挣扎着够到玩具
    - 饥饿 / 疼痛 / 孤立 / 惧怕仍要充分关心
    - 区分"求助哭"vs"真痛苦哭",前者引导,后者满足
  failure_mode: |
    一哭就直接帮 → 培养依赖,日后什么都求人帮。
    完全不理冷漠 → 安全感受损,焦虑型依恋风险。
  evidence_level: C


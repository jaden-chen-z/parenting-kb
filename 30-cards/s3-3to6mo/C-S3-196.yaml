card_id: C-S3-196
stages: [S3]
tags: [self, framework, milestone]

front:
  title: 核心自我 4 体验凑齐
  hook: 4 体验凑齐才完整

back:
  why_matters: |
    Stern 命名 核心自我= 2-6 月宝宝形成的"完整自我感",由 **4 个独立体验**整合而成。缺一个,以后就有问题。
    **4 个 核心自我 不变量**:
    1. **Self-能动性(自我能动)** — "我能动我的手脚,我能让东西发生"
       - 4 月宝宝伸手抓东西时,手指会**根据物体大小预先调形** — 这就是 motor plan + 能动性
       - 临床缺失 → 紧张症 / 瘫痪感 / "外控感"
    2. **Self-连贯性(自我连贯)** — "我是一个完整的、不分裂的身体"
       - 宝宝知道"我的手"和"我的脚"和"我的肚子"是一体的
       - 临床缺失 → 解体 / 去人格化 / 出体感
    3. **自我情感化(自我情感)** — "我有我自己的感受"
       - 宝宝知道"开心"和"难过"是**我**的体验,不是外面的
       - 临床缺失 → 无感症 / 解离状态 / 抑郁的情感空虚
    4. **Self-history(自我历史)** — "我是连续的,过去到现在到未来都是同一个我"
       - 宝宝认得"昨天玩的那个布"和"今天的妈妈"是连续的
       - 临床缺失 → 失忆 / 漫游状态 / "我不知道我是谁"
    **关键**:
    - 这 4 个**不是哲学**,是**心理体验** — 宝宝实际感受到的
    - 严重缺失某个会发展出严重精神病(catatonia / depersonalization / anhedonia / fugue)
    - 2-6 月是这 4 个的**主形成期**,以后修补成本高
    - **每个都需要日常社交输入**才能形成
    **Stern 反传统**:
    - Mahler:宝宝跟妈"共生融合,慢慢分离" → Stern: 反!出生即在区分,2-6 月主任务是**整合 self**,不是"分离"
    - Freud:这阶段是"口欲期" → Stern: 反!口欲只是表层,深层是 4 不变量 形成
    Phase 6 Lillard 自我建构(蒙氏)+ Stern 核心自我 = 哲学 + 心理双轨。
  what_to_do:
    - 多做让宝宝感到 能动性 的活动(自己抓 / 自己看)
    - 摸宝宝全身让他感受 连贯性
    - 给宝宝足够时间体验自己的情感(不立刻干预)
    - 用名字 + 镜子建 self-history 感
    - 4 个体验都要每天输入
  failure_mode: |
    "宝宝还小,自我以后再说" — 错。Stern 数据 — 2-6 月是 核心自我 4 不变量 主形成期,缺失一个以后修补成本极高。
    全靠抱着宝宝 → 能动性 输入不足。
  evidence_level: A


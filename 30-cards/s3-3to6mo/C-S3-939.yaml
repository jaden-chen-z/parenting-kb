card_id: C-S3-939
stages: [S3]
tags: [thompson, intention_reading, lerner_v3, mind_reading_origins]

front:
  title: "6 月开始解读意图"
  hook: "他知道你在干什么"

back:
  why_matters: |
    Thompson(Ch 2)综述 — 4-6 月起婴儿开始把人当"有意图"的对象,
    不只是会动的物体。看你伸手拿杯子,他能预测你想喝水。
    这是 theory of mind 起源,比 Wellman 综述的 4 岁正式 ToM 早 3 年。
    一句话 — 6 月他已经在解读你为啥这么做,不是被动看。
  what_to_do:
    - "动作配旁白说出你意图"
    - "我去拿奶你等我一下"
    - "拿东西先告知不要默默拿"
    - "他看你眼神是在猜你要做啥"
    - "别假装快速消失,告别仪式从这开始"
  failure_mode: |
    觉得 6 月不懂意图,默默拿走玩具或抽奶瓶。
    Thompson 综述 — 6 月已经能预测你意图,不告知会破坏信任感。
  evidence_level: B


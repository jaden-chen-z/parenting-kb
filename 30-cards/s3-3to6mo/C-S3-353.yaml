card_id: C-S3-353
stages: [S3]
tags: [sleep, outdoors]

front:
  title: "户外睡更香"
  hook: "新鲜空气助宝宝睡"

back:
  why_matters: |
    Magda 引欧洲传统:阳台 / 院子第二个 crib,户外睡。
    新鲜空气 + 自然光 + 微弱白噪 = 婴儿睡眠环境天然优。
    1 月起足月健康婴儿可以短时户外睡(避日晒 + 极端温度)。
    跟北欧 / 德国 / 匈牙利传统育儿一致。
    中国传统"避风寒不出门"过度 — 纱窗下午睡 30-60 分有益。

  what_to_do:
    - 阳台 / 院子 / 树荫下放安全便携婴儿床
    - 1 月起 15-30 分短时户外睡尝试
    - 不直晒太阳 + 不刺骨风 + 监护人在视线内
    - 蚊虫季用纱罩,不用驱蚊液
    - 室内卧室 + 户外阳台两点轮换

  failure_mode: |
    "室外细菌多 / 风寒易病" → 闷在室内反而免疫力低。
    Magda 原话:"婴儿户外睡其实非常好"。

  evidence_level: B


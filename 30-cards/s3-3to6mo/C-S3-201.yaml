card_id: C-S3-201
stages: [S3]
tags: [self, 观察, china_high_freq]

front:
  title: 主题 + 变奏 = 互动模板
  hook: 同样事微变化才有效

back:
  why_matters: |
    斯特恩直接观察 — 父母跟 0-6 月宝宝互动时,**自动**用一个非常特殊的模式:
    **"主题 + 变奏"**(原文 theme-and-variation)。

    **典型例子**(斯特恩实录,白话翻译):
    - 妈逗宝宝说话:
      - "嗨,宝贝……"
      - "对呀,宝贝……"
      - "你好,宝贝……"
      - "你在干嘛呀,宝贝?……"
      - "对呀,你在干嘛呀?……"
      - "你那儿干嘛呢?……"
      - "什么也没干吗?……"
    - **2 个主题**("宝贝" + "干嘛")各重复几次,
      **每次微小变化**(语调 / 词序 / 节奏)
    - 同样的逻辑用于:
      - 重复脸部表情("我要抓你了"游戏)
      - 重复挠痒("手指爬上身"游戏)
      - 哄睡 / 喂奶时反复唱 / 说

    **中国家长高频疑问**:
    - "我跟宝宝总说同样的话,他会烦吗?"
    - "我做同一个表情他不笑了"
    - "唱同一首儿歌他不感兴趣了"

    **斯特恩答 — 不是同样,要"主题 + 变奏"**:
    - **完全相同重复** → 宝宝几次后习惯化 → 不再注意
    - **完全不同每次** → 没有"主题"可学 → 宝宝抓不住模式
    - **主题 + 变奏** = 既有"熟悉"(主题) 又有"新奇"(变奏)
      — 完美吸引注意 + 学习不变量

    **斯特恩关键洞察**:
    - 父母**没意识到**自己在用这个模式
    - 但**进化让父母自动这样做**
    - 目的:**调节宝宝的兴奋度**,让宝宝保持在最佳愉悦区间
    - **副产品**:宝宝在学"什么是妈妈"(妈的不变量)
      — 不管语调高低,这个声音 / 脸都是妈

    **怎么实操**:
    - **同一首歌反复唱** — 但每次稍微变(更慢 / 更快 / 更高 / 更低 / 不同表情)
    - **同一个游戏反复玩** — 但每次"出场"略不同(出现位置 / 速度 / 声调变)
    - **同一句话反复说** — 但语调起伏 + 微变化("你饿了……" / "你饿了吗?" / "饿了对吗?")
    - **不要追求"全新刺激"** — 宝宝抓不住
    - **也不要完全死板** — 宝宝失去兴趣

    **跟蒙氏利拉德"演示要慢 + 同顺序"(C-S6-187)+ 卡普 5S 节奏(C-S1-018)立场**:
    - 蒙氏:同顺序 — 是"主题"
    - 卡普 5S:节奏化嘘声也是"主题"
    - 斯特恩:在节奏 / 顺序基础上加"微变化"
    - 三者完全一致
  what_to_do:
    - 同首歌反复唱,但每次微变
    - 同游戏反复玩,但出场略不同
    - 同句话反复说,但语调起伏
    - 不追求全新刺激
    - 也不完全死板重复
  failure_mode: |
    "我跟宝宝总说同样的话,他会烦吗" — 不会。要"主题 + 微变奏",
    这是宝宝最爱的输入模式。
    完全死板重复 → 习惯化;完全随机 → 抓不住不变量 — 都不好。
  evidence_level: A


card_id: C-S3-2258
stages: [S3]
tags: [sleep, controversy]
front:
  title: 5 月睡眠倒退,法伯/法伯改良
  hook: 整觉娃突然夜醒 4 次
back:
  why_matters: |
    上卡讲睡前奶瓶毁牙,这卡讲 5 月最常见的睡眠崩溃——大运动突破或大脑跳跃带来的睡眠倒退。
    海蒂列出 4 种解决方案:经典 Ferber 法(渐延 5/10/15 分钟)、椅子法(每晚椅子向门移动)、系统唤醒法(预定时主动唤醒打破节奏)、增强睡眠节奏(疲倦但不过累就放下)。每种方法坚持 2 周再判断。
  what_to_do:
    - 排除饿/牙/病再行睡眠训练
    - 选 1 种方法坚持 2 周
    - 重大变化期(出牙/搬家)暂缓
    - 醒来不立即抱,先轻拍低语
    - 父亲处理夜醒避开乳房联想
  failure_mode: 一周内连换 3 种方法,每种都坚持不到 3 天,娃彻底糊涂越练越乱,父母自我怀疑放弃。
  evidence_level: B
  positions:
    issue: 睡眠训练方法选择 · 何时启动 · 哭多久才合理
    views:
      - school: Lillard(蒙氏)
        source: SRC-016
        stance: 6 月起关门睡 + 不抱不晃,孩子哭也不进。训练派立场最激进。
      - school: Brazelton
        source: SRC-010
        stance: 温和拍背 + 浅睡期演练。中间立场,父母在场但减少介入。
      - school: Davies
        source: SRC-014
        stance: 反对强训 — 6-16 月黏人是健康表现,过度训练有依恋代价。
      - school: AAP / Bowlby
        source: SRC-006/011
        stance: AAP 6 月+ 可启动温和方法;Bowlby 反对长时间哭训,需评估孩子类型。
      - school: 海蒂(Ferber 派)
        source: SRC-040
        stance: 温和 Ferber 法 / 改良 Ferber — 主流大众方案;节奏接近 Lillard 但更弹性,不极端关门。
      - school: 中国传统
        stance: 陪睡到学龄,不"训练"以避免分离焦虑;倾向自然戒断。

card_id: C-S3-553
stages: [S3]
tags: [stranger-anxiety, temperament, normal-发展]

front:
  title: 见生人哭是天性
  hook: 5-6 月陌生人警觉萌芽

back:
  why_matters: |
    松田说:5-6 月婴儿能认清母亲脸,见到陌生男人脸有的会大哭。
    打针反应也分天性 — 一声不吭的、过会才哭的、针头触皮就哭的,都正常。
    这是娃的天性,不是教育能改变的。
    妈别羞愧"我家娃太敏感",别强迫娃跟陌生人亲。
  what_to_do:
    - 接受娃见生人哭是发展节点
    - 让娃在妈怀里观察陌生人 5 分钟
    - 别强求亲戚立刻抱
    - 打针前抱紧告知"会有点疼"
    - 打针后立刻抱安抚 1-2 分
  failure_mode: |
    妈让"开朗"亲戚强抱 → 娃信任崩 + 后续见客就哭 + 害怕去妈以外人怀。
  evidence_level: B


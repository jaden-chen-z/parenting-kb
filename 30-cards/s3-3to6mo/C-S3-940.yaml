card_id: C-S3-940
stages: [S3]
tags: [rothbart, temperament_stability, 4_6mo, lerner_v3]

front:
  title: "4-6 月气质开始稳"
  hook: "现在测气质够准了"

back:
  why_matters: |
    Rothbart(Ch 3)综述 — 0-3 月气质起伏大(还在适应离开子宫),
    4-6 月起气质开始稳定显现。这时观察的反应度/自我调节是预测 1 岁后行为的好指标。
    Bates IBQ(婴儿气质问卷)主要测 6 月起。
    一句话 — 4 月前看到娃啥样别太急定标签,4-6 月看到的更接近稳定气质。
  what_to_do:
    - "4 月前的难带可能是适应期"
    - "4-6 月观察才下气质判断"
    - "记录他对刺激的稳定反应"
    - "对比同龄娃看较位置"
    - "气质判断后接受不改造"
  failure_mode: |
    在 0-3 月就给娃下定论"娃天生难带",其实可能是适应期。
    Rothbart — 4-6 月才稳定,早判断会错过自然变化。
  evidence_level: B


front:
  title: "4 月反应预测 14 月"
  hook: "4 月响声预测怕生"

back:
  why_matters: |
    Kagan(Ch 4)经典实验 — 4 月对响声/新刺激高反应的婴儿,14 月有 60%-70% 表现抑制型(怕生)。
    生物机制 — 杏仁核敏感度从出生就有。这是气质生物根据的最强证据之一。
    一句话 — 4 月对气球突然放气吓得大哭的娃,1 岁后大概率怕陌生人。
  what_to_do:
    - "4 月观察响声反应记录"
    - "怕生苗头早就降低家中突然性"
    - "陌生人来 1 小时前预告"
    - "保护他不被突然介入(亲戚强抱)"
    - "渐进暴露不要试图脱敏"
  failure_mode: |
    觉得 4 月就反应大是早期娇气,强迫脱敏(强抱给陌生人)。
    Kagan — 强迫激活更高反应,反而强化怕生。
  evidence_level: B


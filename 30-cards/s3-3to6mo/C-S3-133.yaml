card_id: C-S3-133
stages: [S3]
tags: [montessori, sleep, floor-bed, controversy]

front:
  title: 地板床 vs 婴儿床
  hook: 蒙氏 vs 主流不冲突

back:
  why_matters: |
    蒙氏的睡眠环境核心 = **floor bed**(地板床):6 英寸厚床垫直接放地板,可加低边框。
    替代传统的婴儿床(crib,有高栅栏围住)。
    蒙氏理由:
    - 宝宝醒来能爬下玩,困了爬回 — 自主作息
    - 不被栏杆挡视线
    - 12-15 月不用从 crib 跳到大床
    - 滚下来 6 英寸高也不伤跟 **AAP SIDS 指南**冲突吗?**不冲突**。
    Davies 在原书引用 AAP 全部 10 条 SIDS 指南并标"应遵循":
    - ✅ 仰睡(每次睡)
    - ✅ 床面硬实
    - ✅ 1 岁内推荐与父母同房
    - ✅ 远离软物 / 松散被褥
    - ✅ 防过热 / 不戴帽
    Floor bed 全部满足。
    什么时候用?
    - **从出生开始**(配合 cestina 摩西篮放在床垫上)
    - 或 **3 月后**从大床过渡
    - 不强求 — 12-15 月直接转 toddler bed 也 OK
    中国家长接受度低 — 不少老人坚持婴儿床,可以妥协从 12 月转。
  what_to_do:
    - 从出生起或 3 月起用 floor bed
    - 床垫平铺地板,周围空,无杂物
    - 房间婴儿安全防护(电线 / 化学品 / 易碎物全清)
    - 起步几天父母在旁陪睡过渡
    - 12-15 月不喜欢可转 toddler bed
  failure_mode: |
    "地板床不安全,小宝宝会滚下来" — 6 英寸高 + 软地面,实际跌落少,即使跌也不伤。
    "用了 crib 怎么转?15 月孩子跨不了栏" — toddler bed(矮床)是中间方案,不必直接 floor bed。
    "蒙氏地板床不符合 AAP 指南" — 错。Davies 引用并遵守 AAP 全部 10 条。
  evidence_level: B


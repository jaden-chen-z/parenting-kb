card_id: C-S3-032
stages: [S3]
tags: [philosophy]

front:
  title: 6-7 月镜子游戏练自我
  hook: 镜子里那个人是我吗

back:
  why_matters: |
    7-8 月宝宝开始对镜中影像产生反应:先想触摸、再被回应惊讶。
    Brazelton 观察:当父母从背后悄悄出现,宝宝会先在镜子里"看到"父母（误以为父母在镜子里）,过一阵才转身回头——这是空间认知和自我意识萌芽的双重信号。
    新手父母常忽略镜子,用作"哄娃神器"放着玩。其实镜子是 Brazelton 推荐的早期 cognitive 训练工具。
  what_to_do:
    - 每天 5 分钟抱宝宝照镜子
    - 你从背后出现,看 ta 是先看镜子还是回头
    - 拉手碰镜中自己的脸说"这是宝宝"
    - 玩 peek-a-boo 配合镜子练 person permanence
  failure_mode: |
    把镜子当装饰品永远挂在墙上,宝宝独自玩耍时碰巧看到几次。
    Brazelton:镜子游戏需要父母参与才能触发"自我-他人"的关系学习。
  evidence_level: C


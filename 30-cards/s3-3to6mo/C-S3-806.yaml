card_id: C-S3-806
stages: [S3]
tags: [shonkoff, nrc, visual_cortex, synaptogenesis, brain]

front:
  title: "视觉脑回路 6 月达峰"
  hook: "视觉是最早成熟脑区"

back:
  why_matters: |
    NRC 综述 Ch 8 给视觉皮层突触发育的精确时间线 — 解释 0-3 岁脑发育说法的来源:
    **Huttenlocher 1979 + 1997 经典数据**:
    - 视觉皮层突触数 **0-6 月爆增** → 中段达峰
    - 6 月-学龄前 → 渐渐裁剪到成人水平
    - 听觉 / 语言区 → 类似但稍晚(峰值在 1 岁左右)
    - **前额叶**(高级思考区)→ 1 岁达峰,**裁剪到青春期晚期**
    **关键洞察**:
    - "0-3 岁脑突触最多"是事实
    - 但"突触多 ≠ 能力强"— 多余突触会被裁剪
    - **裁剪本身**是发展正常过程
    - "use it or lose it" 是误解 — 裁剪不是因为"没用"是发展程序
    **NRC 立场反"突触焦虑"**:
    - 别因为"突触多"就 fancy 早教刺激
    - 普通陪伴 / 对话 / 玩 → 完全够保留必要突触
    - 视觉发育需要的是"普通光照 + 看物体"— 不是 fancy 视觉训练
    **跟 Gopnik SRC-015 + Lillard SRC-016 一致** — 反早教刺激焦虑。
    **对中国家长**:
    - "0-3 岁脑窗口期"商业话术 — NRC 认证有限
    - 不需 fancy 视觉训练 / 黑白卡
    - 普通日常环境 + 互动 = 视觉发育食粮
    - 例外:斜视 / 白内障 → 这是真 critical 期 → 必须早治
  what_to_do:
    - 普通光照 + 看物即可
    - 别买黑白卡 / 视觉训练
    - 斜视 / 白内障早治
    - 4 月起多 face-to-face
    - 信发展自然程序
  failure_mode: |
    "0-3 岁是关键期 — 我得每天黑白卡刺激" — 错,普通环境足够。
    "突触修剪 = 没用上的没了 — 我得多刺激保留" — 错,裁剪是发展程序不是 use-or-lose。
    fancy 视觉刺激班 → 钱花得冤 + 父母焦虑传给宝宝。
  evidence_level: A

  positions:
    issue: 0-3 岁是真"关键期"(critical)还是"敏感期"(sensitive)
    views:
      - school: Shonkoff / NRC
        source: SRC-025
        stance: 严格区分 critical(完全错过)vs sensitive(可补)。绝大多数发展是 sensitive 不是 critical,反"3 岁定终身"恐慌。
      - school: Gopnik
        source: SRC-015
        stance: 强调突触修剪 + 关键期窗口(语言 / 视觉 / 知觉重组),认知科学立场偏 critical 端。
      - school: Lillard(蒙氏)
        source: SRC-016
        stance: absorbent mind 强调 0-6 岁是哲学性关键期,但不是临床 critical(可补)。
      - school: 罗马尼亚孤儿数据
        stance: 即便严重剥夺,6 月领养仍可大幅恢复 → 实证偏 sensitive 论;支持 NRC 立场。
      - school: 中国主流
        stance: 普遍误信 critical 论 — "3 岁定终身" / "0-3 是黄金期错过不能补",制造焦虑。

card_id: C-S3-005
stages: [S3]
tags: []

front:
  title: 1 岁内不喝果汁,1 岁后限 4 oz
  hook: 12 月前果汁 = 没价值还增蛀牙

back:
  why_matters: |
    果汁(juice)= 高糖低纤维饮料,1 杯果汁含糖量与 1 杯可乐相当(约 25g)。
    中文家长习惯"果汁补维生素"是过时认知 — 现在 AAP 推荐整果代替果汁(纤维 + 维生素都有)。
    AAP:1 岁内完全不给果汁(蛀牙 + 过度热量 + 挤压奶量)。
    1-3 岁限 100% 果汁 ≤ 4 oz/天(118 ml)。
    健康宝宝 6 月前不必另喂水(母乳/配方奶含足够);引入辅食后水 ≤ 1 杯(8 oz / 240 ml)/天。
  what_to_do:
    - 12 月前完全不喝果汁(包括稀释)
    - 12-36 月:只 100% 果汁,≤ 4 oz/天(118 ml)
    - 6 月前不另加水(纯母乳/配方奶足够)
    - 6 月起辅食时可少量水,≤ 1 杯/天(240 ml)
    - 喝水 / 果汁前优先喝奶(避免挤压奶量)
  failure_mode: |
    1 岁内给果汁稀释 → 蛀牙 + 偏甜口味养成。
    给大量水 → 挤压奶量 + 婴儿水中毒(肾未成熟)。
  evidence_level: A


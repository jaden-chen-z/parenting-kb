card_id: C-S3-704
stages: [S3]
tags: [babywearing, japan, tradition, matsuda]

front:
  title: "背孩子比西方进步"
  hook: "防髋脱位 + 解放双手"

back:
  why_matters: |
    松田 §172 强反"西方反对背婴儿"派：
    1. 背婴儿国家(日 / 中 / 非)婴儿髋关节脱位明显少;
    2. 抱一个 + 提尿布袋遇车没法躲，背着+腾双手是最安全外出方式;
    3. 4 月后脖子立直就能背(必须用宽底背带);
    4. 父亲也能背 — 是"父子肌肤接触"的交流;
    5. 西方反对是因为西服变形 + 没背带不是因为"压迫胸部"。
    跟蒙氏 / RIE 对"婴儿主导"派立场略对立(那两派偏好让宝宝自由活动)，
    但在交通安全 / 髋脱位预防上跟 AAP / WHO 一致。

  what_to_do:
    - 4 月后用宽底婴儿背带
    - 选托住臀部的 wide-bottom 款
    - 父亲也轮流背
    - 上下车低头时护住宝宝头
    - 炎热季节不背(防中暑)

  failure_mode: |
    现代妈妈用"轻便背带" — 双腿吊着没托臀部 → 反而增加髋脱位风险。
    或纯手抱 + 提尿布袋 → 遇突发危险无法躲避。
    日式婆婆派"竖抱伤脊柱"已被研究否定 — 4 月后脖子立直就 OK。
    炎热季节松田特别提醒不要背 — 妈妈体温传给婴儿可中暑。

  evidence_level: B


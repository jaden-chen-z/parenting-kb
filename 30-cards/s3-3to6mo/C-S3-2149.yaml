card_id: C-S3-2149
stages: [S3]
tags: [controversy]

front:
  title: 米糊 → 蔬菜 → 水果顺序之争
  hook: 海蒂主张米糊为先

back:
  why_matters: |
    辅食引入顺序在 4-6 月是高争议主题。
    海蒂版立场(美国主流):**铁强化米糊先,蔬菜其次,水果最后**。
    理由:米糊好消化少过敏,提供必需铁;蔬菜先吃才不会被甜味带偏。
    这与 BLW(婴儿主导喂养)从手指食物起、AAP 2017 鼓励早过敏原引入(LEAP)立场不同。
    海蒂强调:每加 1 种新食物间隔 3-5 天观察过敏。
  what_to_do:
    - "第 1 周:铁强化米糊 + 母乳/奶粉冲"
    - "第 2-3 周:加一种黄色蔬菜(红薯/胡萝卜)"
    - "第 4 周后:加另一种深色蔬菜"
    - "再加水果(香蕉泥/苹果泥)"
    - "禁:米糊掺果汁(养成偏甜)"
  failure_mode: |
    先给水果(因为娃爱吃) → 后期蔬菜被嫌弃。
    一次加多种食物 → 过敏判断不出哪种。
    米糊加奶瓶里灌 → 海蒂明确禁(噎食 + 4 月前不能固食)。
  evidence_level: B


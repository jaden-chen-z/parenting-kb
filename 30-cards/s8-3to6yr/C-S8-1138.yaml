front:
  title: "中国娃不是落后娃"
  hook: "互依 self 也是金"

back:
  why_matters: |
    Shweder + Markus 的核心命题 — 中国(亚洲)互依型自我不是 "西方独立型自我的初级阶段",是不同心智模式的等价位。
    - 美国娃 5 岁 "我喜欢蓝色因为我喜欢" — 独立型自我
    - 中国娃 5 岁 "妈妈说蓝色好看所以我也喜欢" — 互依型自我
    两者都健康,都有发展轨迹,只是不同心智模式。
    意义 — 中国家长不必焦虑"我家娃没有美式自尊"。
    研究数据(Chao 1994 + Chen 2002)— 中国 "严而暖" + 互依型自我在中国情境下结果良好。
    反而 — 强行美式独立训练放在中国情境(集体学校 / 家庭)反而错配出问题。
  what_to_do:
    - "中国娃互依型自我 ≠ 缺乏自我"
    - "不强行培养美式 'I am special' self"
    - "'我们家'叙事是中国 self 健康表达"
    - "集体感 + 个人成就兼顾"
    - "中国教养在中国情境有效"
  failure_mode: |
    强培"美式自信" — 文化不匹配会反效果。
  evidence_level: B


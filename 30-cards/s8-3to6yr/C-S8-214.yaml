card_id: C-S8-214
stages: [S8]
tags: [shonkoff, nrc, screen_3to6, china_high_freq]

front:
  title: "3-6 岁屏幕看共看"
  hook: "别扔屏给娃就走开"

back:
  why_matters: |
    NRC 综述 Ch 8 给"3-6 岁屏幕"立场(松于 0-2 岁但仍严):
    **NRC 立场**:
    - 0-2 岁:严反屏幕 — 任何屏都不行(C-S2-807)
    - **3-6 岁**:**有条件接受**:
      1. **限时间** — 每天 ≤ 1 小时(NRC 跟松田 §428 类似)
      2. **必共看** — 大人陪在旁边
      3. **教育性内容** — Sesame Street 类 vs 商业动画
      4. **不在吃饭 / 临睡时** — 干扰其他重要活动
      5. **不是看哄睡 / 哄饭工具** — 这是替代而非补充
    **NRC 综合数据**:
    - 3-6 岁高质量教育性内容(Sesame Street)→ 词汇 / 字母认知 +
    - 商业动画(快剪辑 / 少互动)→ 注意力 / 行为问题
    - 共看 → 比独看效果显著好
    **跟松田 §428 + Lansbury 立场**:
    - 松田立场最严("电视赶出家"扩到 3-4 岁)
    - NRC 立场较松("每天 1 小时高质量共看 OK")
    - Lansbury 0-2 严反 + 3+ 较松
    - **三派共识**:0-2 不看 + 3-6 限制 + 共看
    **对中国家长**:
    - 3-6 岁不必绝对禁屏(生活现实)
    - 但**质量** + **时长** + **共看** 三件套
    - "iPad 哄饭 / 哄睡" → NRC 反对(是替代 + 干扰)
    - "周末家庭电影" → NRC 接受(共看 + 教育 + 时段)
  what_to_do:
    - 每天 ≤ 1 小时
    - 大人共看不扔屏
    - 教育性 > 商业
    - 不哄饭哄睡
    - 周末家庭电影 OK
  failure_mode: |
    "他要看就给 — 反正不打架" — 时长失控 + 替代真活动。
    "Sesame Street 都行 — 我让他自己看 1 小时" — 共看是关键 — 单看效果差。
    "iPad 哄饭省事" — NRC 反对 — 是替代 + 干扰双错。
  evidence_level: A


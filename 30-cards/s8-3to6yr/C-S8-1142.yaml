card_id: C-S8-1142
stages: ['S8']
tags: ['philosophy', 'lerner_v1', 'spencer', 'racism', 'social_pressure']

front:
  title: "种族阶层影响发展"
  hook: "社会偏见会进童心"

back:
  why_matters: |
    Spencer Ch 15 强调 — racism / classism / sexism 不只是 "社会问题",是直接影响儿童发展的环境变量。
    中国家庭情境下对应 —
    - 户口歧视(外地学校 / 城乡待遇)
    - 性别偏见(男孩 vs 女孩对待)
    - 学校阶层(普通 vs 重点)
    - 家长身份(白领 vs 蓝领)
    - 长相 / 体重 / 口音歧视
    3-6 岁孩子开始感知这些 — 不直接说,但影响 identity 形成。
    意义 — 父母不能等到孩子 "懂事了再说" — 3-6 岁就要 —
    - 帮孩子识别歧视(不让孩子内化"我不行")
    - 解释社会不公(适合年龄的语言)
    - 培养应对策略(不接受 + 不传染)
    - 父母示范不歧视他人(言行一致)
  what_to_do:
    - "帮娃识别歧视(不让内化)"
    - "解释社会不公 — 适合年龄的语言"
    - "培养应对策略(不接受 / 不传染)"
    - "父母示范不歧视他人"
    - "种族 / 性别 / 阶层议题不回避"
  failure_mode: |
    "等懂事了再说" — 错。3-6 岁已经在内化偏见。
  evidence_level: B


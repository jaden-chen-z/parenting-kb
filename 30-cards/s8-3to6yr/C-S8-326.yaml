card_id: C-S8-326
stages: [S8]
tags: [eccles, expectancy_value, achievement_motivation, lerner_v3, foundational]

front:
  title: "动机 = 我能 + 我想"
  hook: "我能 + 我想缺一不可"

back:
  why_matters: |
    Eccles & Wigfield(Ch 15)综述权威 — 成就动机 = expectancy(我能做到)× value(我想做)。
    任一项为 0,动机 = 0。数据 — 5 岁起孩子会评估自己我能 vs 我想,
    长期下来形成我擅长数学 / 我不擅长画画的 自我认知,影响一生选择。
    一句话 — 5-6 岁的我能感是关键期,失败一次妈说你天生就不行 = 一辈子不行。
  what_to_do:
    - "夸过程(你试了 3 次)不夸天赋"
    - "失败后再来一次的机会"
    - "别说你天生不擅长 X"
    - "讨论价值(数学有啥用)"
    - "你示范学新东西不会但努力"
  failure_mode: |
    "我家娃就是不擅长数学" — 5 岁说一次 = 一辈子的 expectancy 锚定低。
    Eccles — 这阶段评价决定后期人生选择。
  evidence_level: B


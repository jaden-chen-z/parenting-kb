front:
  title: "挑战技能要匹配"
  hook: "太难太易都没心流"

back:
  why_matters: |
    Csikszentmihalyi 心流必要条件 — 挑战 ≈ 技能。
    - 挑战 >> 技能 → 焦虑(不知所措)
    - 挑战 << 技能 → 无聊(失去兴趣)
    - 挑战 ≈ 技能 → 心流(高度投入)
    3-6 岁应用 —
    - 学走路时 → 平地走会无聊,坡道挑战适中(心流)
    - 拼图 → 12 块没难度,100 块绝望,30-50 块心流
    - 学画 → 完全自由空白页焦虑,临摹无趣,有 frame 自由心流
    意义 — 父母选活动 / 玩具 / 学习内容,要刻意调挑战难度。
    中国"超龄学"(3 岁学小学)→ 挑战 >> 技能 → 焦虑而非心流 → 长期厌学。
  what_to_do:
    - "选活动看挑战 / 技能匹配"
    - "太难 → 降难度 + 拆解步骤"
    - "太易 → 加变化 + 升难度"
    - "'超龄学' → 焦虑非心流"
    - "心流是学习内驱的核心条件"
  failure_mode: |
    "超龄超难"学法 — 错。挑战 >> 技能 = 焦虑非心流。
  evidence_level: B


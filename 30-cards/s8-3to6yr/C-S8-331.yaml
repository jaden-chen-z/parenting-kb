card_id: C-S8-331
stages: [S8]
tags: [eccles, gender_achievement_gap, math_stereotype, lerner_v3]

front:
  title: "5 岁数学性别差萌"
  hook: "数学男强女弱是教"

back:
  why_matters: |
    Eccles(Ch 15)综述 — 数学能力性别差实际很小,但 expectancy 差大:
    5 岁起女娃自评数学能力低于男娃(实际同水平)。
    机制 — 父母 / 老师暗示(男娃数学好 / 女娃文学好)→ 女娃 self-efficacy 降低 → 不选数学。
    一句话 — 数学性别差不是天生,是 5 岁起被教的。
  what_to_do:
    - "不暗示男娃数学好"
    - "鼓励女娃数学游戏(数数 / 拼图)"
    - "夸过程不夸你天生擅长 X"
    - "妈也参与数学讨论(不当妈不会)"
    - "选无性别标签的玩具书"
  failure_mode: |
    "女孩数学不好正常" — Eccles 数据反对,这话直接造性别差。
    5 岁起 expectancy 锚定低 → 一辈子。
  evidence_level: B


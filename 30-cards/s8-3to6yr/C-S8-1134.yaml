card_id: C-S8-1134
stages: ['S8']
tags: ['philosophy', 'lerner_v1', 'bronfenbrenner', 'chronosystem', 'historical_time']

front:
  title: "时观 = 历史时间维"
  hook: "你不是你妈那一代"

back:
  why_matters: |
    Bronfenbrenner 时观系统(chronosystem) = 历史时段 + 个人时间双重维度。
    你在 2026 年养孩子 ≠ 你妈在 1995 年养你 — 完全不同的 macrosystem。
    - 网络渗透:你娃出生即数字原住民
    - 信息爆炸:你能查到 1000 个育儿建议(也焦虑 1000 倍)
    - 经济压力:房价 + 教育成本 ≠ 90 年代
    - 双职工成常态
    chronosystem 视角让你 — 不要照搬上一代经验(你妈说"我那时候你怎么怎么")。
    Lerner V1:历史时段决定育儿"可能空间" — 同样 4 岁,2026 年和 1985 年宏观不同,做法可以不一样。
  what_to_do:
    - "警惕'我那时候 X 怎么不也好好的'"
    - "当代育儿挑战和历史不同 — 别直接套老经验"
    - "同时不要彻底否定老经验(共睡 / 多人养有传统优势)"
    - "区分什么是历史性的什么是普世的"
    - "chronosystem 视角 → 选择性继承 / 选择性更新"
  failure_mode: |
    老人/夫妻 chronosystem 视角不同 → 育儿吵架 — 看见就好。
  evidence_level: B


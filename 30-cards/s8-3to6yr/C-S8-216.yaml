card_id: C-S8-216
stages: [S8]
tags: [shonkoff, nrc, summary, china_specific, anti_focus]

front:
  title: "NRC 跟中国家长对话"
  hook: "5 句话给中国家长"

back:
  why_matters: |
    NRC 综述 600 页落到中国家长的 **5 句话总结**(本卷整理):

    **1. "0-3 关键期"商业话术别全信**
       - 是"敏感期"不是"关键期"
       - 错过可补,不是没救
       - 普通陪伴足够

    **2. "他还小什么都不懂"错** — 出生 42 分钟就模仿
       - 别等懂事才陪
       - 多眼神 + 多说话 + 多回应
       - "妈妈语"(parentese,夸张语调)是科学的

    **3. "教 / 训练 / 早学"不是早教真义**
       - 佩里 / 启智项目随机对照研究的核心内容是**玩 + 自由**
       - 不是学拼音 / 数学
       - 软技能(自我调节 + 执行功能 + 阅读热情)才长效

    **4. "全职妈是金标准"错**
       - 看回应质量,不看身份
       - 高质量上班妈 > 低质量全职妈
       - 老人 / 替代照护 OK,看质量

    **5. "他不听话"多是前额叶还在长**
       - 1-3 岁哭闹大爆发(tantrum)是发展正常
       - 6 岁前自我控制还在长
       - 接受 + 命名情绪 + 不打骂

    **跨派一致(NRC + 12 派支持)**:
    不焦虑(松田)+ 反早教(高普尼克 / 利拉德)+ 多陪(鲍尔比 / 斯特恩 / 松田)
    + 重质量(NRC / 兰斯伯里 / RIE)+ 反屏 + 反体罚(NRC + AAP + 兰斯伯里 + 鲍尔比)。

    **对中国家长**:
    - 你 90% 的焦虑可以放下
    - 你 90% 的"得做的事"已经在做(普通陪伴)
    - 真要担心的:抑郁 / 长期忽视 / 严重创伤 / 严重感官缺陷
    - 普通家庭的普通孩子 — 你已经做对了大部分
  what_to_do:
    - 90% 焦虑放下
    - 信普通陪伴够
    - 关注少数真风险
    - 不焦虑育儿核心
    - 看 12 派共识
  failure_mode: |
    "一定要做到完美" — 跟 NRC 立场对立 — 完美不存在。
    "中国教育竞争激烈不能松" — 越激烈越要打软技能基础(玩 / 自调)。
    "我得跟潮流派别" — 选 1-2 个真持续做到 → 比追潮有效。
  evidence_level: A

  positions:
    issue: 商业早教(脑潜能开发课)对 0-3 岁孩子是否有用
    views:
      - school: Shonkoff / NRC
        source: SRC-025
        stance: 强反对 — 神经科学不告诉你怎么早教,只告诉你别毁孩子;experience-expectant 类发展靠普通陪伴足够。
      - school: Gopnik
        source: SRC-015
        stance: 反对 — 教学悖论 + Kuhl 数据 — DVD / 视频教学对婴儿无效。
      - school: 松田道雄
        source: SRC-024
        stance: 反对 — 不焦虑育儿,留自由空间给孩子玩。
      - school: Lansbury / Gerber RIE
        source: SRC-019/022
        stance: 反对 — 减少结构化刺激,父母主要任务是不打扰孩子的自主探索。
      - school: 蒙氏(Lillard / Davies)
        source: SRC-016/014
        stance: 部分接受 — 蒙氏环境是"特殊设计"但不是商业早教,要求专业 prepared 而非 fancy 课程。
      - school: 鲍秀兰
        source: SRC-009
        stance: 部分支持早教 — 中国早期智力开发派,跟其他 5 派立场对立。
      - school: 中国主流
        stance: '"脑潜能开发" / "蒙氏早教" / "感统课" / "全脑开发" 商业课程产业链发达,焦虑驱动消费。'

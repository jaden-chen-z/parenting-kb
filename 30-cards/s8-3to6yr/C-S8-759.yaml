front:
  title: 对话式阅读 PEER 4 步
  hook: 读绘本 PEER 4 步

back:
  why_matters: |
    Paris-Paris V4 第 2 章 + Whitehurst 1988 经典(对话式阅读)。

    **对话式阅读**:
    - 不是父母独自读 + 孩子听
    - 是父母和孩子**对话式**读
    - 随机对照研究证明:词汇提升 +50%(比单纯朗读)

    **PEER 4 步法**(Whitehurst 标志,中文记忆口诀:**问 → 评 → 扩 → 复**):
    - **P 问**(Prompt):"这是什么 / 它在做啥"
    - **E 评**(Evaluate):"对" / "差不多"
    - **E 扩**(Expand):"对,这是马,马跑得很快"
    - **R 复**(Repeat):让孩子重复扩展后的句子

    **反传统朗读**:
    - 单纯朗读 → 词汇 +20%
    - 对话式"问评扩复" → 词汇 +50% + 理解力 + 语法
    - 早期效果 18 月起,3-5 岁最佳

    **5 大提问类型**(英文口诀 CROWD,中文白话):
    - **填空型**:"小猫坐在 ___"
    - **回忆型**:"上次我们读到啥"
    - **开放型**:"你觉得它在想啥"
    - **疑问词型**(谁 / 什么 / 怎么):"谁来了"
    - **距离型**:"你做过这事吗"

    **反 4 误区**:
    - ❌ "我读你听就行"(失去对话)
    - ❌ "孩子打断不好"(打断是黄金机会)
    - ❌ "全文照读"(扩展才是关键)
    - ❌ "1 本读 1 遍"(熟悉的书反复"问评扩复"更深)

    跟现库:跟 V2 Goswami 音韵(C-S5-1140)+ V2 Bates 词汇(待建)
    + Shonkoff "三千万词差距"(C-S6-926)+ 松田读绘本(SRC-024)对接。

    对中国家长意义:
    - 别只朗读 — 用"问评扩复"4 步
    - 鼓励孩子打断 + 提问
    - 同一本书反复读 + 不同角度问
    - 18 月起就可以开始
  what_to_do:
    - 用"问评扩复"4 步,不只朗读
    - 鼓励打断 + 提问
    - 同一本书反复"问评扩复"
    - 18 月起开始
  failure_mode: |
    "我读你听就行" — 错。失去对话增益。
    "打断不好" — 错。打断是金机会。
    "读 1 遍换" — 错。反复"问评扩复"更深。
  evidence_level: B


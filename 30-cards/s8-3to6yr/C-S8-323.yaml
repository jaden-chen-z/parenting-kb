card_id: C-S8-323
stages: [S8]
tags: [parke, divorce_impact, lerner_v3]

front:
  title: "离婚不是创伤定式"
  hook: "冲突比离婚更伤娃"

back:
  why_matters: |
    Parke(Ch 8)+ Hetherington 综述 — 离婚不一定伤娃,关键是冲突管理。
    数据 — 父母低冲突离婚的孩子比高冲突维持婚姻的孩子心理健康。
    伤的不是法律状态,是持续暴露在敌意。一句话 — 真要离别为娃留婚姻,留也别敌意。
  what_to_do:
    - "决定离了别拿娃当筹码"
    - "前任面前不说他坏"
    - "不让娃站队"
    - "维持 2 个家可预测性"
    - "告诉娃不是他的错(反复说)"
  failure_mode: |
    "为孩子忍" — 维持高冲突婚姻反而最伤娃。
    Hetherington — 暴露在敌意比离婚法律状态伤害大。
  evidence_level: B


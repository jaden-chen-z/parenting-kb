card_id: C-S8-104
stages: [S8]
tags: [iq_test, anti_assessment, japan, matsuda]

front:
  title: "智力测试不可信"
  hook: "天分都没醒呢"

back:
  why_matters: |
    松田 反"私立幼儿园智力测试"派:
    1. 私立幼儿园用"智力测试"选孩子 = 摆出严肃面孔造信赖错觉;
    2. 实际:法国小学最初智力测试是为分出"智力差"的孩子,
       **不能决定"聪明"**;
    3. 智力是什么都不清楚 → 用 3-4 个题来测? 不可能;
    4. **人与生俱来的天分是无限的**, 只是在孩子身上还在沉睡;
    5. 别让"智力测试"决定孩子人生方向;
    6. 跟 Lillard 蒙氏"4 plane of 发展"+ Gopnik
       "孩子是科学家不是落后大脑"立场一致。

  what_to_do:
    - 不让 3-4 岁参加智力测试
    - 不参加"幼小衔接评估" 类秀
    - 看孩子玩耍中的天分 — 不看分数
    - 让天分有时间觉醒
    - 不在朋友圈炫"我家娃 IQ 多少"

  failure_mode: |
    "私立幼儿园 IQ 测试"陷阱: 妈妈相信"科学" → 孩子分数低 → 给孩子 / 自己贴"我笨"标签 → 焦虑育儿 → 强补习。
    现代版: K12 衔接班 + 思维导图测评 + "聪明指数"App。
    松田核心:**天分还在睡**, 早期测试是叫醒陷阱。
    替代: 给宽松环境让天分自己出现(蒙氏立场一致)。

  evidence_level: B


front:
  title: "吃手自慰别羞辱"
  hook: "上学自然就改了"

back:
  why_matters: |
    松田 §441 + §442 反"羞辱孩子习惯"派 — 中国家长最尴尬话题:
    1. **吃手手指**:
       - "欲望没满足"流行说法是错的;
       - 是孩子无聊 + 没场所玩;
       - 跟成人嚼口香糖 / 叼烟一样;
       - 在家娃比幼儿园娃多;
       - 4 楼以上住宅娃多(被关家);
       - **绝不上小学就改了** — 别担心牙齿排列;
    2. **自慰**:
       - 跟吃手一样性质 — 没场所玩;
       - 跟性欲完全没关系(孩子层面);
       - 女孩子自慰相当多;
       - **绝不要严厉批评 / 体罚 / 涂酒精消毒** ;
       - **改环境**(送托 / 楼下玩 / 收起椅子);
       - **绝不吓唬**("会变白痴" "会腐烂");
       - 4 岁起的有的持续到上小学,然后自动消;
       - 检查蛲虫(可能是性器官痒导致)。
    跟 RIE / Lansbury 立场一致(接受 + 不羞辱) +
    跟中国传统"打 / 骂 / 涂辣椒"派强对立。

  what_to_do:
    - 不严厉斥责 + 不体罚
    - 不涂药水 / 贴胶布制止
    - 改环境(户外玩 / 同伴玩)
    - 收起娃用来自慰的椅子
    - 检查蛲虫(可能引起痒)

  failure_mode: |
    最常见误区:涂辣椒 / 涂黄连 / 贴胶布 / 涂酒精 → 孩子转地下 → 加重羞辱感。
    "会变白痴 / 性器官腐烂"吓唬 → 心理创伤 → 性发展障碍。
    幼儿园老师告状妈妈紧张严厉训 → 孩子学会"在妈妈不在时偷偷做" → 永远改不掉。
    替代:**改环境 + 不羞辱** — 孩子上小学自然会停。
    松田 1967 立场跟 21 世纪儿童心理学完全一致。

  evidence_level: B


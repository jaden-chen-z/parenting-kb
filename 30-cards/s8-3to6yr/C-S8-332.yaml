front:
  title: "受虐创伤可恢复"
  hook: "受虐娃也能再恢复"

back:
  why_matters: |
    Cicchetti(via Ch 6 Caspi 综述)— developmental psychopathology(发展精神病理)创始人。
    核心命题 — 童年受虐 / 严重疏忽 → 神经发展受损 + 混乱型依恋,但有 4 保护因子(Masten)
    可以恢复:稳定关系 / 教育 / 自效能 / 外部支持。一句话 — 创伤不是判决,3-6 岁干预窗口最有效。
  what_to_do:
    - "5-6 岁有创伤史 → 找儿童心理学家"
    - "1 个稳定大人比药物更强保护"
    - "不假装没事,但也不反复唤起"
    - "教情绪用词 + 应对策略"
    - "观察解离 / 强迫行为早干预"
  failure_mode: |
    "他还小不会记得" — Cicchetti 数据反对,3 岁前创伤进入身体记忆,不干预后期更隐蔽。
    干预晚成本指数级增加。
  evidence_level: B


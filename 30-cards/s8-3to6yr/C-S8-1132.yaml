card_id: C-S8-1132
stages: ['S8']
tags: ['relationships', 'lerner_v1', 'bronfenbrenner', 'exosystem']

front:
  title: "外观 = 父母工作影响"
  hook: "上班压力会溅到娃"

back:
  why_matters: |
    Bronfenbrenner exosystem 是父母工作 / 政策 / 社区资源等娃不直接接触但影响娃的层。
    最典型 — 父母工作压力外溢:996 / 加班 / 出差 → 父母回家暴躁 / 缺席 / 焦虑 → 娃直接受影响。
    Lerner V1 综述指出 — exo 经常是被父母忽视的层(我工作跟孩子没关系吧?)— 错,影响巨大。
    中国家长 6 岁前常 exo 失调 → 娃察觉到家长状态差 → 行为出问题(谓之"不听话")。
    解决办法不在管娃,在调 exo(父母工作平衡 / 育儿假 / 家庭支持)。
  what_to_do:
    - "父母工作压力 → 不带回家(下楼喘 5 分再进门)"
    - "出差期 → 提前告知 + 视频联系"
    - "父母情绪先调 exo 再管娃"
    - "如可能 — 减少加班 / 调岗 / 育儿假"
    - "exo 调整经常比管娃更有效"
  failure_mode: |
    工作压力外溢 + 怪娃"不听话" — 错。问题在 exo 层不在 micro。
  evidence_level: B


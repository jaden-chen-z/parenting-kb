card_id: C-S8-739
stages: [S8]
tags: [risk_prevention, selman, lerner_v4]

front:
  title: 指标性预防找信号
  hook: 指标性预防找信号

back:
  why_matters: |
    Selman-Dray V4 Ch 10(S8 实操层)。
    **指标性预防**(已有早期信号才介入):
    - **3-4 岁攻击信号**:经常打人 / 咬人 / 推
    - **3-4 岁退缩信号**:不交朋友 / 单独玩 / 怕生
    - **4-5 岁注意信号**:无法持续 5 分钟 / 走神严重
    - **5-6 岁学业信号**:不识 1-10 / 词汇量低 / 拒绝任何任务
    **早期信号 ≠ 标签**:
    - 不是"你家娃有问题"
    - 是"这个信号需要观察 + 可能干预"
    - 多数会自然好转,少数需介入
    **3 大干预原则**(Selman):
    - **早**:3-5 岁介入比 8 岁好得多
    - **多元**:家庭 + 园 + 治疗师协作
    - **关系**:介入是关系,不是治疗
    **反 2 误区**:
    - ❌ "等大了就好"(早期信号拖延 = 治疗成本翻倍)
    - ❌ "贴标签羞耻"(寻求帮助是健康)
    跟现库:跟 V3 Patterson 强制家庭(C-S6-1075)+ Cicchetti 4 原则(C-S0-1232)对接。
    对中国家长意义:
    - 3-4 岁攻击 / 退缩 / 注意 / 学业信号别拖
    - 找心理咨询不丢人
    - 多元干预(家+园+治疗)效果好
    - 早介入便宜过晚治疗
  what_to_do:
    - 3-4岁信号别拖延
    - 找心理咨询不丢人
    - 家+园+治疗多元干预
    - 早介入便宜过晚治疗
  failure_mode: |
    "等大了就好"— 错。拖 = 成本翻倍。
    "找咨询羞耻"— 错。早介入是健康。
    "标签伤害娃"— 错。是关系不是标签。
  evidence_level: B


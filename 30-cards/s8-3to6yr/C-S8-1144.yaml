front:
  title: "文化-个人共建构"
  hook: "不是死套不是全反"

back:
  why_matters: |
    跨章共识(Ch 4 Valsiner + Ch 13 Shweder + Ch 1 Lerner)— 文化-个人是共建构关系。
    不是 — 文化在外 → 灌入娃(传统观)
    也不是 — 娃完全自主 → 文化是限制(西方个人主义观)
    而是 — 娃和文化每天互动 → 共同建构出娃的心智模式 + 文化的更新版本意义 — 中国家长对 "文化传承" 常 2 极:
    - 极保守 — "祖辈怎么养就怎么养"(灌入)
    - 极反传统 — "我家不要中国传统这些套子"(反弹)
    当代视角 — 让娃 negotiate(协商)文化:接受一部分,改造一部分,加新版本。
    具体 —
    - 跟娃讨论传统(为啥过节 / 拜祖)
    - 容忍娃版本不同(她不想拜祖也行)
    - 让娃接触多元(不只中国文化)
    - 看娃 5 年后自己的版本
  what_to_do:
    - "不强行传承(也不彻底反)"
    - "让娃 negotiate 文化"
    - "接受娃版本跟你不同"
    - "多元接触 — 中国 + 西方 + 其他"
    - "5 年后看娃版本"
  failure_mode: |
    "祖辈怎么养就怎么" 或 "全反传统" — 都错。共建构是中道。
  evidence_level: B


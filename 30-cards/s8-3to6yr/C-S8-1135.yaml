tags: ['philosophy', 'lerner_v1', 'baltes', 'lifespan', 'school_anxiety']

front:
  title: "6 岁不是命运分水岭"
  hook: "上学焦虑要先清醒"

back:
  why_matters: |
    中国父母 6 岁焦虑 — "进好小学决定一辈子"。
    Baltes 综述明确反对 — 终身发展数据:小学起点跟成年成就相关性 < 0.3。
    真正影响成年成就 —
    - 自我效能(Bandura)
    - 主动性(Lerner PYD)
    - 关系质量(Bronfenbrenner 微观)
    - 兴趣 / 内驱力(Csikszentmihalyi 心流)
    这些 0-6 岁打基础,但 7-18 岁继续可塑。
    意义 — 6 岁前别赌"上好学校",赌"基础能力 + 兴趣 + 关系"。
  what_to_do:
    - "不为 6 岁前'上好小学'过度焦虑"
    - "基础能力(社交 / 自调 / 兴趣)更关键"
    - "小学 6 年路径不固定"
    - "Baltes 数据:中年成就跟小学成绩弱相关"
    - "一辈子框架取代'赢起跑线'"
  failure_mode: |
    "上不了好小学一辈子完蛋" — 错。Baltes 综述明确反对。
  evidence_level: B


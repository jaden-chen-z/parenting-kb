card_id: C-S8-103
stages: [S8]
tags: [literacy, controversy, japan, matsuda]

front:
  title: "4 岁不必硬教认字"
  hook: "想学自己来问"

back:
  why_matters: |
    松田 反"早教识字"派:
    1. 现代孩子上学前就认字不是因为妈妈"教得好",
       是孩子被关家里看电视/翻画册自己学的;
    2. **从早就认字 ≠ 长远好**: 孩子会成"只看漫画不读书的人";
    3. "4 岁了必须教识字" 是错误想法;
    4. 给适龄画册 → 喜欢的孩子自动学;
    5. 用"字的写法"教 = 愚蠢;
    6. **孩子来问字 = 教**, **不来问 = 不教**;
    7. 重点是认字不是写字 — 强迫写信 / 写文章会让孩子讨厌识字。
    跟 Brazelton "3 岁前别教读写"+ Lillard "11 human tendencies"
    立场一致 + 跟中国"虎妈"识字流派强对立。

  what_to_do:
    - 4 岁不主动教识字
    - 孩子问字才教
    - 重点认不重写
    - 给画册看不强读写
    - 让"想识字的需要"自然产生

  failure_mode: |
    虎妈派:3 岁开始拼音 + 4 岁百字 + 5 岁千字 → 孩子表面"提前" → 长大成"只读漫画的"。
    跟 喜欢书的孩子立场:不喜欢书的孩子去玩比识字更重要。
    "邻居家 4 岁认字"焦虑陷阱:松田直接说"母亲没必要急着教"。
    替代:把"知识"翻成"快乐" — 孩子在现实生活中获得智慧。

  evidence_level: B


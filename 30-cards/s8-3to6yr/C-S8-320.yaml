card_id: C-S8-320
stages: [S8]
tags: [thompson, self_5_dimensions, lerner_v3]

front:
  title: "6 岁 self 不是单线"
  hook: "5 个维度同时长"

back:
  why_matters: |
    Thompson(Ch 2)综述 Harter 框架 — 6 岁的 self 已经分化成 5 个维度,
    不是"自信/不自信"单线。5 维 — 学术(我会算数吗)、社会(同伴喜欢我吗)、
    运动(我跑得快吗)、外貌(我好看吗)、行为(我听话吗)。
    一句话 — 别只夸聪明,5 维各自要给反馈,某维弱别用其他维补偿夸。
  what_to_do:
    - "夸具体维度不笼统说聪明"
    - "运动差不要拿数学好弥补"
    - "外貌别过度强调,但不能假装不存在"
    - "他自评弱的维度别否认,陪练"
    - "5 维平衡比某维冠军重要"
  failure_mode: |
    把 self 当单线 — 觉得让他自信整体好就行。
    Harter — 5 维独立,某维过低单独伤,其他维补偿不了。
  evidence_level: B


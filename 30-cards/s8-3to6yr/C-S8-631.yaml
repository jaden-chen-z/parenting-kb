card_id: C-S8-631
stages: [S8]
tags: [philosophy, lerner_v1, overton, metatheory, parent_overwhelm]

front:
  title: "一本一说法的解药"
  hook: "10 本书 10 派别"

back:
  why_matters: |
    中国父母 6 岁前买了 10 本育儿书 — 一本说"延迟满足关键",一本反之,
    一本说"早期识字关键",一本反对,搞得焦虑。
    Overton(Lerner V1 Ch 2)解药 — 不是某派对,是 10 本书代表 10 个元立场。
    每个立场都在自己框架内自洽,不能简单"听专家"。
    Lerner V1 的整本书目的就是给父母一张"元立场地图" —
    Karp / 鲍秀兰 / AAP = 分裂式重技巧蒙氏 / RIE / Pikler / Brazelton = 关系式重环境关系两派交叉 — 如 Bronfenbrenner / Lerner = relational + ecological 多层意义 — 父母选书的元立场选择 = 你跟书的关系。不是"信哪派",是"用哪派"。
  what_to_do:
    - "买书前先看作者立场是哪派"
    - "分裂式派 — 适合具体技巧 + 数据"
    - "关系式派 — 适合环境布置 + 关系"
    - "中国家庭 — 分裂式给底线 + 关系式给气质"
    - "夫妻偏哪派可以分工 — 但元立场要互相理解"
  failure_mode: |
    每本都信全 — 错。不同立场冲突时你会陷入更深焦虑。
  evidence_level: B


card_id: C-S8-102
stages: [S8]
tags: [preschool, daycare, social, japan, matsuda]

front:
  title: "独生子先送 3 年制"
  hook: "没朋友 = 没自立"

back:
  why_matters: |
    松田 给"3 年还是 2 年幼儿园"立场:
    1. 现代街上车多 → 孩子不能远去玩 → 失去"街头朋友";
    2. 独生子女 = 跟妈妈玩 = 跟朋友玩快乐差远了;
    3. 跟同龄朋友:平等 + 竞争 → 学人与人交往;
    4. **独生子女家附近又没小伙伴 → 必须送 3 年制幼儿园**;
    5. 反对"3 年太久" 派多数是不了解现在幼儿园的人 — 现代 3 年制每年内容不同;
    6. 不送的条件:家附近能跟朋友安全玩 + 妈妈不必接送过马路;
    7. 兄弟姐妹差 1 岁玩得好 → 一起送下一年。
    跟 Brazelton "选日托看共情不看课程"+ 鲍秀兰 1-2 岁
    "跟小伙伴玩"立场互补。

  what_to_do:
    - 独生子女优先送 3 年制
    - 看的不是装修是老师跟孩子的眼神
    - 兄弟姐妹同年送 (一起去)
    - 接送便利度比"名牌"重要
    - 家附近有玩伴可考虑 2 年

  failure_mode: |
    "舍不得"派:3 岁送幼儿园太可怜 → 留家继续妈妈陪 → 4 岁还跟妈妈玩 → 入园时分离焦虑爆。
    "拼名牌"派:大老远送顶级幼儿园 → 妈妈每天 1 小时车 → 自己累垮 → 长期不可持。
    松田立场是现实:**安全 + 朋友** 是最高指标,装修课程都靠后。

  evidence_level: B


front:
  title: "5 岁就有偏见种子"
  hook: "5 岁有歧视种子"

back:
  why_matters: |
    Killen(via Ch 13 Turiel 综述)— 5 岁孩子已经有 ingroup/outgroup 偏见。
    数据 — 5 岁选朋友倾向同种族 / 同性别 / 同方言。
    干预窗口 — 5-7 岁直接讨论多样性最有效,后期偏见硬化难改。
    一句话 — 5 岁不教反偏见,后期偏见难拔。
  what_to_do:
    - "5 岁直接聊多样性(不同肤色/方言/家庭)"
    - "不假装没有差异"
    - "讨论 X 跟我们不同有啥好"
    - "选多样化绘本和环境"
    - "你自己也别在娃前评他人外貌"
  failure_mode: |
    觉得 5 岁讨论偏见太早 — Killen 反对,5 岁是关键预防窗口。
    不教反偏见 = 默认偏见生长。
  evidence_level: B


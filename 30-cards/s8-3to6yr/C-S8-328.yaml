tags: [masten, resilience, 4_protective_factors, lerner_v3, foundational]

front:
  title: "Masten 韧性 4 因子"
  hook: "韧性不是性格是因素"

back:
  why_matters: |
    Masten(Ch 6 Caspi 综述)— 韧性(resilience)不是天生性格,是 4 个保护因子叠加效果:
    ① 至少 1 个稳定关系(妈/爸/奶奶) ② 自我效能感(我能做到)
    ③ 情绪调节能力 ④ 学校 / 社区资源。
    一句话 — 你想娃抗挫力强,4 因子各做一份,不要靠锻炼苦难。
  what_to_do:
    - "1 个稳定大人是底线"
    - "夸具体努力建自我效能"
    - "教情绪调节 4 策略"
    - "选稳定幼儿园社区"
    - "不必制造苦难锻炼"
  failure_mode: |
    "穷养锻炼抗挫" — Masten 综述反对,锻炼不出韧性,4 因子叠加才行。
    制造苦难只制造创伤。
  evidence_level: B


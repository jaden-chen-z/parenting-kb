front:
  title: "6 岁青少年信号"
  hook: "5-6 岁就有预警"

back:
  why_matters: |
    Steinberg(Ch 16)综述 — 青少年期问题的根在 5-6 岁:
    高冲动 + 低执行功能 + 同伴拒绝 — 三联征是 12 岁后行为问题的最强预测。
    早期识别 + 干预成本极低,等青春期再修成本极高。
    一句话 — 6 岁三联征出现别等,这时候干预最有效。
  what_to_do:
    - "执行功能差 → 练等待 + 计划"
    - "同伴拒绝 → 教社交技能 + 1 个稳定朋友"
    - "高冲动 → 教情绪应对策略"
    - "三联征齐全 → 找儿童心理学家"
    - "5-6 岁干预性价比 > 15 岁"
  failure_mode: |
    "再大点就好了" — Steinberg 数据反对,5-6 岁三联征基本预测 12 岁问题。
    早干预成本 1/10 晚干预。
  evidence_level: B


tags: ['philosophy', 'lerner_v1', 'lerner', 'PYD', 'asset_based']

front:
  title: "资产视角看孩子"
  hook: "看优势不是看缺点"

back:
  why_matters: |
    Lerner PYD 核心立场转变 — 从缺陷-based 转资产-based 育儿视角。
    缺陷视角 — "我家娃数学差 / 不爱社交 / 不爱阅读 / 没耐性 / 内向" → 拼命补缺。
    资产视角 — "我家娃有 X 优势 / 兴趣 / 关系 / 强项" → 放大 + 衍生。
    3-6 岁这阶段父母容易陷缺陷视角 — 因为入学焦虑放大了缺点感知。
    PYD 数据 — 资产-based 育儿的孩子:
    - 自尊更高(因为感到有价值)
    - 学习更主动(优势带学习)
    - 关系更好(被看到优势)
    - 长期成就更高(资产自然衍生其他能力)
    意义 — 父母视角从"我家娃差什么"换成"我家娃强什么 + 怎么放大",
    这一换是 PYD 育儿的关键转变。
  what_to_do:
    - "每天找娃 1 个优势(具体)"
    - "不在缺点上反复 nag"
    - "'她最近 X 进步了'叙事"
    - "优势带学习(用强项学新)"
    - "资产 > 缺陷育儿视角"
  failure_mode: |
    "她数学差 / 不爱社交"立场长期 nag — 培养自卑根。
  evidence_level: B


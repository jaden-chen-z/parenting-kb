card_id: C-S8-329
stages: [S8]
tags: [markus, cultural_self, independent_interdependent, lerner_v3]

front:
  title: "Markus 独立 vs 互依"
  hook: "中国娃 self 不一样"

back:
  why_matters: |
    Markus(via Ch 9 Harter)综述 — 文化塑造 2 类 self 取向:
    independent(独立 self,美国主流)+ interdependent(互依 self,东亚主流)。
    独立 — 强调我是谁我决定。互依 — 强调我是我家的一员。
    一句话 — 你拿美国 self 自信概念套中国娃可能错配,我们 self 不是失败是不同。
  what_to_do:
    - "中国娃更看重家庭意见正常"
    - "不强迫你自己决定全部事"
    - "尊重集体取向不当软弱"
    - "美国育儿书 self-esteem 概念慎用"
    - "看你家文化传统不照搬"
  failure_mode: |
    用美国 self-esteem 标准评中国娃,觉得我家娃太听家里的不独立焦虑。
    Markus — 互依 self 不是次等,是不同的健康路径。
  evidence_level: B


front:
  title: "5 岁能假装情绪"
  hook: "知道何时要藏情绪"

back:
  why_matters: |
    Saarni(Ch 5)综述 — 4-5 岁起孩子能"假装"情绪 — 收到不喜欢礼物也能笑谢。
    这不是虚伪,是社会规则学习。Saarni 实证 — 这阶段孩子知道"真情绪"vs"该表达情绪"分开。
    一句话 — 5 岁假装情绪是社会能力进步,不是变滑头。
  what_to_do:
    - "他笑谢不喜欢礼物别揭穿"
    - "私下问真感受让他诚实"
    - "教真情绪 vs 礼貌表达区分"
    - "夸他懂礼貌也尊重真感受"
    - "你自己也别假笑给娃看"
  failure_mode: |
    5 岁假笑被夸"懂事",于是孩子学到"真情绪不能表达"。
    Saarni — 公开场合礼貌+ 私下诚实双轨才健康,只学公开就压抑。
  evidence_level: B


front:
  title: 虐待 4 类型都伤娃
  hook: 虐待 4 类型都伤娃

back:
  why_matters: |
    Cicchetti-Toth V4 Ch 13(虐待 4 类型重点)。
    **4 类型 maltreatment**:
    - **身体虐待**:打 / 体罚 / 暴力
    - **性虐待**:任何性接触
    - **情感虐待**:贬低 / 羞辱 / 冷暴力 / 忽视情感
    - **忽视**:没饭吃 / 没安全 / 不送医 / 不上学
    **Cicchetti 关键发现**:
    - 4 类型**冲击大脑**(神经发育冲击):
      - 海马体缩小(记忆受损)
      - PFC 发育延迟(自我调节差)
      - 杏仁核过敏(应激反应高)
      - HPA 轴紊乱(cortisol 长期高)
    - **情感虐待和身体虐待一样伤娃**(神经层冲击不分类型)
    - 中国家长常以为"没动手不算虐待" — V4 直接反驳
    **长期后果**:
    - 50% 心理健康问题
    - 30% 学业问题
    - 20% 后期施虐
    - 但 30% 韧性 — 不是命定意义:
    - 4 类型都是 maltreatment
    - 情感虐待**不轻于**身体
    - 早期识别+干预改概率跟现库:跟 V3 Patterson 强制家庭(C-S6-1075)+ Shonkoff cortisol(C-S2-806)对接。
    对中国家长意义:
    - 没打 ≠ 没虐待(情感虐待同等冲击)
    - 冷暴力 / 贬低也伤神经
    - 看到自己倾向先停 + 寻求帮助
    - 找心理咨询是负责任不是软弱
  what_to_do:
    - 没打不代表没虐待
    - 冷暴力贬低也伤神经
    - 看自己倾向先停+找帮助
    - 找咨询是负责
  failure_mode: |
    "没动手不算虐待"— 错。情感虐待同等。
    "骂几句没事"— 错。神经层冲击。
    "娃皮实"— 错。50% 心理问题。
  evidence_level: B


card_id: C-S8-324
stages: [S8]
tags: [parke, ethnic_culture, lerner_v3]

front:
  title: "白人中产不是普世"
  hook: "管教看你家文化的"

back:
  why_matters: |
    Parke & Buriel(Ch 8)综述 — 主流育儿研究 80% 是白人中产美国家庭,
    其他文化的"严厉"父母不一定是 Baumrind 专制型。
    例 — 非裔母亲严厉但温暖,孩子结果好(独立性强)。亚裔父母训练式严要求,
    在亚裔文化背景下结果好(成绩+自律)。一句话 — 你照搬美国育儿书可能错配中国家庭。
  what_to_do:
    - "Baumrind 4 类型不是宇宙真理"
    - "中国严父慈母 ≠ 全错"
    - "看效果不看是否符合美式"
    - "你的方法 + 文化 + 娃气质 = 三角"
    - "适合你的不一定适合邻居"
  failure_mode: |
    照搬美国育儿书,用严就是专制自我归罪,实则你的严在中国家庭语境是常态。
    Parke-Buriel — 文化情境决定教养效果。
  evidence_level: B


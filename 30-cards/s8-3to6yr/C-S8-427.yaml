front:
  title: 朴素物理 / 心理 / 生物
  hook: 3 大独立认知领域

back:
  why_matters: |
    Keil 综述(Lerner V2 Ch14 Keil 主笔)。
    儿童认知不是"统一系统",是 3 大领域(直觉理论)并行:
    - **Naive Physics**(朴素物理)— 物体如何动 / 重力 / 固体性
       3-4 岁稳定,基础在 Spelke 核心知识(出生即有)
    - **Naive Psychology**(朴素心理)— 别人有想法 / 意图 / 信念
       4-5 岁通过 Sally-Anne(Wellman ToM)
    - **Naive Biology**(朴素生物)— 生命 / 繁殖 / 代谢
       7-10 岁概念革命后稳定意义:
    - **3 个领域独立发展**(不是统一智力)
    - 一个孩可能朴素心理强(社交好)朴素物理弱(怕摔)
    - 不能拿单一智力测试评估
    - V2 综述:这是认知科学派的奠基观点跟现库:跟 Spelke 5 系统(C-S4-1141)+ Carey 概念革命(C-S7-1096)+ Wellman ToM(C-S7-1098)对接。
    Lerner V2 Ch14 给元综述。
    对中国家长意义:
    - 不要拿"智力 = 一个数字"评孩子
    - 3 大领域各看(物理 / 社交 / 生命)
    - 短板可补,但不影响其他领域
    - 中国传统重知识(物理 / 数学)— 别忽视社交
  what_to_do:
    - 3 大领域均衡培养(不只学知识)
    - 看孩子 3 大领域分布
    - 短板补,长板继续
    - 不"智力一个数字"评估
  failure_mode: |
    "智力 = 单一指标" — 错。3 领域独立。
    "学好物理就万能" — 错。心理 / 生物独立。
    "不会算就笨" — 错。可能其他领域强。
  evidence_level: B


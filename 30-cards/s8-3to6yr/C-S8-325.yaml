card_id: C-S8-325
stages: [S8]
tags: [kohlberg, turiel, moral_development, lerner_v3]

front:
  title: "5 岁道德前规则"
  hook: "听话 ≠ 道德感"

back:
  why_matters: |
    Kohlberg(via Ch 13 Turiel 综述)— 4-7 岁是 preconventional 道德(前规则期):
    判断对错看后果(被罚 = 错,被夸 = 对),还没内化道德原则。
    一句话 — 5 岁听话不代表有道德感,他只是怕被罚 / 想被夸。
    内化道德要到 8-10 岁才出现。
  what_to_do:
    - "5 岁讲道德要具体后果"
    - "别期待他自动有内在道德"
    - "示范道德选择(妈也选不偷)"
    - "讨论故事 X 这样做对不对为什么"
    - "你的反馈一致他才学到稳定规则"
  failure_mode: |
    觉得 5 岁应该自己懂事不提醒,导致孩子误以为某些事没人看就行。
    Kohlberg — 5 岁内化道德还没成型,需要外部脚手架。
  evidence_level: B


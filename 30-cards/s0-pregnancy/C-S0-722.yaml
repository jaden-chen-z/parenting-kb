front:
  title: "心理学百科级综述说啥"
  hook: "16 章学派一次说清"

back:
  why_matters: |
    Lerner V3 是 Wiley 心理学百科第 6 版(2006),Eisenberg 主编,16 章每章一个学派的奠基级综述。
    跟单本育儿书不同 — 它是把过去 50 年的心理学研究汇总,
    每章作者都是该领域权威(气质 Rothbart、共情 Eisenberg、攻击 Dodge、道德 Turiel、性别 Ruble)。
    一句话价值 — 你不用读 16 本书,这一卷把社会情绪发展的全图给你。
  what_to_do:
    - "想懂气质看 Ch 3 Rothbart + Ch 4 Kagan"
    - "想懂共情看 Ch 11 Eisenberg + Hoffman"
    - "想懂管教看 Ch 8 Parke + Baumrind 4 类型"
    - "想懂道德看 Ch 13 Turiel + Smetana"
    - "想懂性别看 Ch 14 Ruble + Martin 3 阶段"
  failure_mode: |
    把综述当某派立场来用 — 错。综述功能是给你跨学派全图,
    不是替哪派背书,父母要做的是看清各派分歧再选。
  evidence_level: B


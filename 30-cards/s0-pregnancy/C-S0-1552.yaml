front:
  title: "人是终生玩家物种"
  hook: "童心是进化的优势"

back:
  why_matters: |
    Csikszentmihalyi(Ch 9)借生物学幼态延续概念 — 人是动物界幼态延续最强物种。
    幼态延续 = 保留幼年特性进入成年(玩 / 好奇 / 学习能力)。
    意义 —
    - 黑猩猩 5 岁 + 就 "成年化",失去玩 / 探索动力
    - 人 5 岁 50 岁都能玩 / 学 / 好奇 — 这是进化优势
    - 老人有童心 — 不是退化,是幼态延续完整保留
    - 父母自己也要保幼态延续 — 跟娃一起玩是双向收益中国家长意义 — "成熟"不是去除童心,是把童心 + 责任结合。
    - 不必教娃"早成熟"(剥夺幼态延续 = 剥夺学习能力)
    - 父母自己保童心(跟娃一起好奇 / 玩 / 学)
    - 老人保童心 — 鼓励别压制意义 — 幼态延续是心流 + 终生学习能力的根基。
  what_to_do:
    - "不教娃'早成熟' — 保幼态延续"
    - "父母自己保童心(跟娃一起玩)"
    - "老人有童心鼓励别压"
    - "'成熟' = 童心 + 责任"
    - "幼态延续 = 终生学习根基"
  failure_mode: |
    "教娃早成熟" 立场 — 剥夺幼态延续 = 剥夺学习能力。
  evidence_level: B


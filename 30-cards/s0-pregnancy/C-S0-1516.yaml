card_id: C-S0-1516
stages: ['S0']
tags: ['philosophy', 'lerner_v1', 'baltes', '可塑性', 'foundational']

front:
  title: "可塑性持续到死"
  hook: "脑子一辈子都在改"

back:
  why_matters: |
    Baltes 综述可塑性定义 — 神经系统可被经验改变的能力。
    不是 "0-3 岁后没了" — 是 "0-3 岁高 / 老年低,但全程都有"。
    神经科学数据(Greenough 等)— 70 岁人脑子还能长新连接(海马 / PFC 区)。
    意义 —
    - 中国 "脑发育关键期" 营销夸大 — Baltes 综述反驳
    - 老人学英语 / 学新技能 — 慢但能学
    - 中年人转行 — 慢但能转
    - 70 岁也能发展智慧 / 灵性意义 — 把"可塑性"当一辈子礼物,不当"赌上 0-3"。
  what_to_do:
    - "一辈子学习心态(自己 + 孩子)"
    - "老人学新东西鼓励(可塑性还有)"
    - "中年人转行不晚"
    - "不在'关键期'上焦虑"
    - "Baltes:可塑性持续 70+ 岁"
  failure_mode: |
    "老了学不动" — 错。Baltes 数据:能,只是慢。
  evidence_level: B


front:
  title: "决定论 vs 概率论"
  hook: "不是命定全是可能"

back:
  why_matters: |
    跨章命题(Ch 5 Gottlieb + Ch 11 Baltes + Ch 6 Thelen)— 反决定论是 V1 元理论共识。
    - 基因决定论 — Gottlieb 反(probabilistic 表观渐成论)
    - 阶段决定论 — Thelen 反(dynamic 涌现)
    - 早期决定论 — Baltes 反(终身发展可塑性)
    - 文化决定论 — Shweder 改(共建非灌入)
    共识 — 发展是 probabilistic(概率性)不是 deterministic(决定性)。
    意义 —
    - "天生 X" 错(基因不决定)
    - "过了关键期就完了" 错(早期不决定)
    - "这阶段就是反抗期" 错(阶段不决定)
    - "中国娃就是 X" 错(文化不决定)
    反之 — 一切都是概率 + 多层 + 双向 + 可塑。
  what_to_do:
    - "'决定论' 立场全部警惕"
    - "基因 / 早期 / 阶段 / 文化都不决定"
    - "probabilistic 视角 = 多种可能"
    - "行动改变概率 — 不是命运"
    - "反决定论 = V1 元共识"
  failure_mode: |
    任何"X 决定 Y"立场 — V1 全部反对。
  evidence_level: B


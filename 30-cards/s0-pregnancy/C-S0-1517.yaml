card_id: C-S0-1517
stages: ['S0']
tags: ['philosophy', 'lerner_v1', 'baltes', 'wisdom']

front:
  title: "智慧不是 IQ"
  hook: "老了智慧反而长大"

back:
  why_matters: |
    Baltes 在 V1 Ch 11 给"智慧"(wisdom)研究奠基 — 智慧是发展的终点之一,跟 IQ 不一样。
    - IQ 25 岁峰值后下降
    - Wisdom 50+ 岁才峰值(Baltes "wisdom paradigm" 5 维度:深识 / 实操 / 价值 / 不确定性 / 跨情境)
    意义 — 中国 "聪明" 不等于"智慧",养孩子目标不是 IQ 高,是 wisdom 强。
    0-6 岁打 wisdom 基础 —
    - 让孩子接触多元情境(培养跨情境思考)
    - 鼓励反思 / 提问(培养深识)
    - 容纳不确定性(不所有问题都有答案)
    - 跟孩子一起讨论价值观(不只对错)
    意义 — IQ 焦虑该转 wisdom 焦虑(也别太焦虑)。
  what_to_do:
    - "区分聪明 vs 智慧(后者更重要)"
    - "让娃接触多元情境(跨情境)"
    - "鼓励反思 + 提问"
    - "价值观讨论 — 不只是对错"
    - "不焦虑 IQ,看 wisdom 路径"
  failure_mode: |
    "智力开发"焦虑 — 错。IQ 25 岁见顶,wisdom 50+ 才见顶。
  evidence_level: B


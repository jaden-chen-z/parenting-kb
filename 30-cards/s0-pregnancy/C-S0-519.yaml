front:
  title: 回乡分娩 16-23 周
  hook: 妊娠 6 月内回故乡

back:
  why_matters: |
    松田给硬窗:实在没人帮忙,为安全起见,应在 16-23 周左右回到故乡。
    妊娠过程中多少有点异常的人,应尽可能在原医院分娩。
    16 周后 24 周前回 — 太早不必,太晚有早产风险。
    最关键:原医院 + 故乡医院联络 — 不是"拿介绍证明就能接受"。
  what_to_do:
    - 16-23 周决定回不回
    - 妈先到故乡医院产科取得同意
    - 拿原医院妊娠详细描述(不是介绍证明)
    - 丈夫请假同回是首选
    - 产后无人伺候才考虑回乡
  failure_mode: |
    妈春节前 32 周才回,赶高铁/飞机 + 故乡医院未联络 → 早产风险陡增。
  evidence_level: B


front:
  title: "情绪能力 8 项清单"
  hook: "EQ 不是软指标"

back:
  why_matters: |
    Saarni(Ch 5)综述权威 — 情绪能力 8 项可教、可测、可练的具体技能:
    ① 觉察自己情绪 ② 觉察别人情绪 ③ 情绪词汇 ④ 共情 ⑤ 情绪表达
    ⑥ 应对负面情绪 ⑦ 关系中的情绪沟通 ⑧ 情绪自效能(信自己能调节)。
    一句话 — EQ 不是虚的"高情商",是这 8 项可培养的肌肉。
  what_to_do:
    - "0-6 岁优先练这 8 项"
    - "觉察自己 — 你也命名情绪示范"
    - "情绪词汇 — 多用具体词不是开心"
    - "应对 — 教转移、深呼吸、求助"
    - "自效能 — 庆祝他自我调节"
  failure_mode: |
    把 EQ 当玄学,以为长大就会。
    Saarni — 8 项是技能不是天赋,不教就不会。
  evidence_level: B


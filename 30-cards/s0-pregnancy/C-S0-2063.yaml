card_id: C-S0-2063
stages: [S0]
tags: [safety]

front:
  title: 乳房产前不需任何"锻炼"
  hook: 越折腾越糟

back:
  why_matters: |
    民间流传"产前锻炼乳头"= 用酒精擦/毛刷刷/按摩/吸奶器 — 海蒂明确说全部错,弊大于利。
    乳头本就为哺乳设计,不需任何"准备"。错误"锻炼"反而:
    (1) 酒精/金缕梅 → 乳头干裂;
    (2) 肥皂洗 → 破坏天然保护油;
    (3) 按摩/吸奶器 → 触发宫缩,严重时早产 + 引发乳腺炎。
    孕晚期(28 周后)肥皂都不要碰乳头。
    真正能做的是"心理准备" — 看书/学知识/找哺乳顾问,而不是物理锻炼。
  what_to_do:
    - 孕晚期不用任何特殊产品擦乳头
    - 不要按摩 / 揉捏 / 用吸奶器试挤
    - 别用酒精 / 金缕梅 / 含香料润肤露
    - 洗澡时清水冲即可,28 周后避肥皂
    - 心理准备:看母乳书 + 联系哺乳顾问
  failure_mode: |
    听老人/网帖建议"提前锻炼" → 乳头开裂、宫缩早产。
    用吸奶器试挤初乳 → 浪费宝贵初乳 + 触发宫缩。
    用肥皂彻底清洗 → 破坏天然抑菌油,反而易感染。
  evidence_level: A


card_id: C-S0-1546
stages: ['S0']
tags: ['philosophy', 'lerner_v1', 'valsiner', 'cultural_construction', 'foundational']

front:
  title: "文化和娃共建"
  hook: "不是文化灌入娃心"

back:
  why_matters: |
    Valsiner(Lerner V1 Ch 4)给 cultural construction 视角 —
    不是 "文化在外面 → 灌入娃 → 娃接受",是 "娃和文化在每天互动中共建(co-construct)"。
    意义 —
    - 娃不是被动接收文化,是主动参与建构
    - 同样文化下,不同娃接受/改造/抗拒方式不同
    - 文化也在被娃改变(代际传播是双向)
    中国家长意义 — 不要把 "文化传承" 当 "灌输"。
    娃会自己 negotiate(协商)— 接受一部分,修改一部分,抗拒一部分。
    意义 — 你给娃 "中国文化"(节日 / 礼仪 / 价值观),娃会重新组装出他自己的版本。
    不要试图 "复制" 你的版本到娃身上。
  what_to_do:
    - "文化传承不是灌输"
    - "让娃 negotiate(参与 + 改造)"
    - "允许娃版本跟你不同"
    - "中西文化都接触 — 让娃自己组装"
    - "代际传播双向 — 娃也教你"
  failure_mode: |
    "复制我的文化版本到娃" — 错。Valsiner:共建不是灌入。
  evidence_level: B


card_id: C-S0-010
stages: [S0]
tags: [montessori, birth, prenatal, philosophy]

front:
  title: 孕期就开始读宝宝
  hook: 把"观察"变成习惯

back:
  why_matters: |
    蒙氏方法论核心 = **观察先于回应**。
    Davies 建议:这个习惯从孕期就练。
    胎动、宝宝对你声音 / 触摸 / 音乐的反应,都是"读宝宝"的早期素材:
    - 摸肚子,等几秒,看胎动是否变化
    - 放音乐,看宝宝是否动得更多
    - 不同人说话(爸爸 / 兄弟 / 朋友),看反应有没有差
    - 记录宝宝活跃 / 安静的时间段出生后,这个观察习惯会迁移到读哭声、读体语、读情绪。
    很多新手父母最大的问题不是不爱孩子,是**反应过快**(还没看清就行动)。
    孕期练观察,出生后能 hold 住 5 秒先看,再决定要不要喂 / 抱 / 换。
  what_to_do:
    - 每天 5-10 分钟"安静摸肚子",感胎动模式
    - 准备一本观察笔记(纸或手机备忘)
    - 听音乐 / 唱歌时记宝宝反应
    - 不强迫胎动 — 宝宝睡时不要"叫醒看看"
    - 跟伴侣分享观察,练一致语言
  failure_mode: |
    "我跟肚子里宝宝又看不见,看什么" — 错。胎动 / 心率响应 / 妈妈情绪→宝宝活跃度变化都可观察。
    "等他出来再学读他" — 出生后压力 + 睡不够 + 宝宝信号杂乱,从 0 学曲线陡。孕期的"先看再动"思维迁移过去更顺。
  evidence_level: C


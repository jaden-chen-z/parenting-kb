front:
  title: "Baldwin 发展逻辑奠基"
  hook: "心理发展不是堆积"

back:
  why_matters: |
    Valsiner(Lerner V1 Ch 4)指出 — James Mark Baldwin 1906 发展心理学奠基人(直接师承 Piaget)。
    Baldwin "genetic logic" 立场 — 心理发展不是量的累积,是质的重组。
    - 反"积累论"(empiricism 经验派 — 学得多就发展)
    - 反"成熟论"(nativism 先天派 — 时间到了就会)
    - 主"重组论"— 发展是阶段间的质变重组意义 — 中国家长 "学得越早越好"立场是 Baldwin 反对的累积论。
    Baldwin 视角:学的内容跟孩子当前结构匹配,才能引发重组(等于 ZPD Vygotsky 的源头)。
    不是越早越多越好,是恰到好处的"撞击"促进重组。
  what_to_do:
    - "不'累积'早教 — 看孩子结构准备"
    - "'撞击'匹配当前结构 = 学习高效"
    - "反'学得多就发展'流行立场"
    - "阶段重组需要时间和空间"
    - "Baldwin = 现代发展心理学奠基"
  failure_mode: |
    "灌入式早教"立场 — 错。Baldwin 视角:发展是重组不是累积。
  evidence_level: B


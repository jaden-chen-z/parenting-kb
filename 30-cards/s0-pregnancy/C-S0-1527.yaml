front:
  title: "Flow 心流是发展核"
  hook: "内驱力比奖励更强"

back:
  why_matters: |
    Csikszentmihalyi & Rathunde(Lerner V1 Ch 9)给心流理论 —
    心流是 "活动本身就是奖励" 的状态(intrinsic motivation 内在动机)。
    4 大特征 — 挑战 / 技能匹配 + 即时反馈 + 高度专注 + 自我感消失。
    意义 — 中国家长重外部激励(奖励 / 表扬 / 物质) — 短期有效,长期破坏内驱。
    Flow 视角 — 让娃在活动中找心流 → 内驱自然形成,不需要奖励。
    具体做法 —
    - 任务难度跟娃当前技能匹配(太难/太易都不会有心流)
    - 让娃自己选活动(选择是心流必要条件)
    - 给即时反馈(不只是结果)
    - 不打断专注期(娃在心流时别叫吃饭)
    意义 — 心流是终生学习能力的基础。
  what_to_do:
    - "挑战 / 技能匹配是心流必要条件"
    - "让娃自己选活动 + 选难度"
    - "不打断专注期(心流时静止旁观)"
    - "即时反馈 — 不只是结果"
    - "心流比奖励更可持续"
  failure_mode: |
    "奖励 / 表扬" 当主激励 — 短期有效长期毁内驱。
  evidence_level: B


front:
  title: "心理学 75 年史教训"
  hook: "别再走前人的弯路"

back:
  why_matters: |
    Cairns Ch 3 综合 1931-2006 = 75+ 年发展心理学史。
    3 个核心教训给当代家长 —
    1. **每代主流都被推翻** — 1930 年代 nativism / 1950 年代 behaviorism / 1960 年代 cognitivism / 1990 年代动态系统 → 别死信当下"科学"
    2. **极端立场都错** — 全基因决定 / 全环境决定 / 全先天 / 全后天 — 后被实证全部推翻
    3. **综合是答案** — 当代 RDS 是综合 + 跨学科 + 多层意义 — 中国家长接触的"最新科学" 50 年后可能被推翻 — 别全信。
    读历史让你 — 拒绝极端立场 + 接受不确定性 + 综合多视角。
  what_to_do:
    - "拒绝极端立场(全基因 / 全环境)"
    - "当代'科学'50 年后未必正确"
    - "综合 + 多视角安全"
    - "不确定性是常态"
    - "历史教训 = 别迷信单一权威"
  failure_mode: |
    迷信"最新研究"的单一立场 — 历史教训:多被推翻。
  evidence_level: B


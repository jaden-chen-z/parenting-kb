front:
  title: "全球 EBF 率仅 44%"
  hook: "你不是孤独的妈妈"

back:
  why_matters: |
    EBF(Exclusive Breastfeeding,纯母乳)0-6 月全球率 44%(2015-2020 WHO 数据)。
    WHO 2025 目标 ≥ 50% — 全球离目标都还差。
    中国 EBF 率约 30-40%(估算),低于全球平均。
    原因:奶粉营销 / 产院定时喂奶 / 工作环境不支持 / 产假短 / 信息错乱。
    Lancet 2016 系列(Victora 主编):普及 EBF 每年可救 82 万婴儿生命。
  what_to_do:
    - "EBF 0-6 月不是 '理想化' 是 WHO 全球医学共识"
    - "你坚持 EBF 不是 '矫情' — 是国际推荐"
    - "中国数字差不要内疚 — 是系统性问题"
    - "Lancet 数字记得:82 万婴儿生命 / 年"
    - "找母乳支持小组 + 哺乳顾问扶上路"
  failure_mode: |
    因为 '别人都加奶粉了' 自责或妥协 → 错过母乳免疫保护 + 妈妈乳腺癌降险机会。
    全球都在追这个目标,你不是一个人。
  evidence_level: A


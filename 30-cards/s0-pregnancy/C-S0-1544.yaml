front:
  title: "基因 vs 环境综合"
  hook: "不是哪派对都需要"

back:
  why_matters: |
    跨章核心(Ch 5 Gottlieb + Ch 2 Overton + Ch 11 Baltes)— nature vs nurture 当代综合。
    20 世纪争 — 基因派 vs 环境派互相否定。
    21 世纪综合 — 基因 ↔ 环境双向终生互动:
    - 基因表达受环境调控(epigenetics)
    - 环境影响通过基因表达发生
    - 行为既改基因表达也改环境
    - 4 层(基因 / 神经 / 行为 / 环境)互相塑造(Gottlieb)
    意义 — 中国家长 "天生 vs 教育" 二选一立场过时。
    当代立场 — 不能简单分配 X% 基因 + Y% 环境,因为两者持续互动塑造。
    "双胞胎研究"显示 50% 基因贡献 — 但这不是"基因决定 50%",是"在当前环境中估算的相关性"。
    环境改变,这个 50% 可以变。
  what_to_do:
    - "'基因 vs 环境' 二选一立场过时"
    - "基因 ↔ 环境双向终生互动"
    - "50% 数据 ≠ 基因决定 50%"
    - "环境改 → 50% 可改"
    - "当代综合 = nature × nurture"
  failure_mode: |
    "基因占 X% 环境占 Y%" 立场 — 误读双胞胎数据。
  evidence_level: B


front:
  title: "PVEST 风险身份模型"
  hook: "种族阶层入生态层"

back:
  why_matters: |
    Spencer(Lerner V1 Ch 15)给 PVEST(Phenomenological Variant of Ecological Systems Theory) —
    在 Bronfenbrenner 5 系统基础上加入 perception(主观感知) + identity(身份建构) 维度。
    5 组件:
    1. Net vulnerability(净脆弱)— 风险 - 资源
    2. Net stress(净压力)— 实际压力 - 支持
    3. Reactive coping(应对反应)— 适应/不适应方式
    4. Emergent identity(涌现身份)— 通过应对形成身份
    5. Coping outcomes(应对结果)— 长期适应/不适应意义 — Bronfenbrenner 给环境结构,Spencer 加 "孩子怎么主观体验环境 + 形成身份" 维度。
    应用 — 中国 "外地人" / "城乡 gap" / "二胎" 等身份问题用 PVEST 分析。
    不只看客观环境,看孩子主观感受 + 身份形成。
  what_to_do:
    - "看娃主观感受 — 不只客观环境"
    - "身份形成是主动应对的产物"
    - "'风险'分析要扣资源(净脆弱)"
    - "中国'身份'压力(户口 / 城乡 / 二胎)用 PVEST"
    - "identity 是 coping 出来的"
  failure_mode: |
    只看客观环境不看孩子主观感受 — 错。PVEST 强调 phenomenology。
  evidence_level: B


card_id: C-S0-368
stages: [S0]
tags: [father, nuclear-family, prenatal-prep]

front:
  title: 父亲进核心家庭育儿
  hook: 核心家庭爹必学家务

back:
  why_matters: |
    松田说:大家庭时代生孩子是女人的事 — 婆婆指导媳妇,老人代做家务。
    现在核心家庭这套支援链没了 — 妊娠反应、产前住院,全靠丈夫。
    32 周夜里丈夫不在身边,孕妇焦虑度飙升,影响安胎。
    "父亲帮忙"思维已过时,父亲是育儿合伙人,不是助手。
  what_to_do:
    - 孕期就学洗衣、晾衣、做饭
    - 32 周后晚归当天提前告知妻子
    - 托儿所/医院手续爸去办
    - 妻血型 O / Rh 阴时,化验自己血型
    - 跟亲友说"是父母不是帮妈"
  failure_mode: |
    爹想"妻让我做我做" → 妻得花精力指挥每件事,等于二次劳动,不如自己做完。
  evidence_level: B


card_id: C-S0-005
stages: [S0]
tags: [philosophy]

front:
  title: 上班妈妈选不选母乳的真相
  hook: 怕太亲,所以不喂母乳

back:
  why_matters: |
    母乳的健康优势已是医学共识(降低感染、过敏,妈妈乳腺癌卵巢癌风险)。
    但 Brazelton 在临床发现一个反直觉真相:很多产后要回去上班的妈妈选奶瓶,表面理由是"工作不方便",
    深层是怕"和宝宝太亲、然后还要分开太痛"。这种提前回避分离痛苦的心理叫"分离焦虑预演"。
    识别它很关键——不识别就会用错误理由(如"我奶不够")自责一辈子。
  what_to_do:
    - 诚实问自己:不喂母乳的真实理由是什么
    - 上班妈妈考虑职场吸奶+爸爸瓶喂母乳
    - 4-6 周后让爸爸用奶瓶喂吸出的母乳
    - 不能母乳就用奶瓶时也专注眼神交流
    - 任何选择医生都该支持你而非道德绑架
  failure_mode: |
    选了奶瓶后又被"母乳更好"的舆论攻击,或自欺欺人说"我奶水不够"。
    Brazelton 的态度是医生角色应中立支持,任何一种喂养方式都能建立深度依恋——
    奶瓶喂养时的眼神接触和身体贴近,效果不输母乳。关键不是哪条管子里的奶,而是喂奶时的全神贯注。
  evidence_level: B


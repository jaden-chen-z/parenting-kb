card_id: C-S0-003
stages: [S0]
tags: [philosophy]

front:
  title: 全家人都在抢着照顾宝宝
  hook: 婆婆挑刺其实是因为太爱

back:
  why_matters: |
    "守门(gatekeeping)"是 Brazelton 给一种古老情感起的新名字:所有爱宝宝的成年人都会本能地竞争——
    想做得比别人好、想多说几句、想排挤别人。这不只是夫妻之间,祖父母、医生、老师都会无意中"挑刺"新手父母。
    识别这个机制极其重要——爸爸第一次换尿布,妈妈一句"亲爱的,不是这么换"就可能让爸爸退出育儿,然后家庭分工失衡。
  what_to_do:
    - 父母双方提前约定:换尿布喂奶不互相纠正
    - 听到婆婆批评,理解为"她也在用爱争夺"
    - 爸爸第一次做事时妈妈忍住不指挥
    - 有差异时拿到桌面上谈,不憋着
    - 警惕医生护士也会以专家姿态贬低你
  failure_mode: |
    妈妈下意识"指导"爸爸喂奶,爸爸退缩→爸爸觉得自己笨→以后育儿全交给妈妈→妈妈累垮抱怨爸爸不参与。
    这条死循环极常见。一旦发现自己开始说"你这样不对",立刻闭嘴,事后再聊;
    让对方用自己的方式照顾,即便看起来笨拙,也比把对方推开好。
  evidence_level: C


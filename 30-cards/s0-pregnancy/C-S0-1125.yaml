card_id: C-S0-1125
stages: [S0]
tags: [philosophy, lerner_v1, overton, metatheory, split_vs_relational, foundational, controversy]

front:
  title: "为啥不同书互相矛盾"
  hook: "元层立场不同的根源"

back:
  why_matters: |
    Overton(2006 Lerner V1 Ch 2)给一个元理论解释 — 为啥你买 10 本育儿书,
    一本说 X 一本说反 X,你被搞糊涂。
    根源不在哪本对哪本错,而在两本书的"元立场"不同 —
    分裂式元理论(二分立场)vs 关系式元理论(关系立场)。
    Karp 5S(独立技巧)和蒙氏(整体环境)不是技巧高低差,是两套元立场。
    搞清楚这点你不再被"专家打架"困住。
  what_to_do:
    - "买书前先看作者元立场是哪派"
    - "分裂式派书:Karp / AAP 部分 / 鲍秀兰早教"
    - "关系式派书:蒙氏 / RIE / Lerner"
    - "多派立场都看,不指望某派全对"
    - "你家娃个性化决定你偏哪派多"
  failure_mode: |
    死守某一本"权威书" — 错。每本书都站在某元立场上,综合用才是对的。
  evidence_level: B


front:
  title: "关系发展系统总框"
  hook: "V1 的统一答案"

back:
  why_matters: |
    Lerner V1 全卷的最终答案 — relational developmental systems(关系发展系统)是当代元理论统合。
    组成 —
    - relational metatheory(Overton)— 关系思维取代二分思维
    - developmental systems(Gottlieb / Lerner)— 多层次互动取代单因
    - contextualism(Lerner)— 个体 ↔ 环境双向取代单向
    - dynamic systems(Thelen-Smith)— self-organization 取代预定阶段
    - holistic-interactionistic(Magnusson)— 整体人取代变量人
    - bioecological(Bronfenbrenner)— 5 层环境取代单一环境
    - lifespan(Baltes)— 全程发展取代关键期意义 — 这套框架是 2006 后儿童心理学的"主流共识",中国家长理解这套框架,
    看任何育儿书都有了"地图"。
  what_to_do:
    - "记住 7 大元理论关键名词"
    - "看任何育儿书 — 用 RDS 框架定位"
    - "split 派 vs RDS 派 — 一眼看出"
    - "中国当代育儿应用 RDS 框架"
    - "Lerner V1 是'框架地图'"
  failure_mode: |
    不学元框架 — 永远在"哪派对"焦虑里。
  evidence_level: B


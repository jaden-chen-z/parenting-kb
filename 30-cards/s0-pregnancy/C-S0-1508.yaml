front:
  title: "动态系统理论"
  hook: "发展不是上楼梯走"

back:
  why_matters: |
    Thelen & Smith(Lerner V1 Ch 6)给当代发展心理学最有影响力的元理论 —
    dynamic systems theory(动态系统论)。
    核心 — 发展不是按图纸上楼梯,是 self-organization(自组织)涌现出来的。
    对比经典 Piaget 阶段论 —
    - Piaget:阶段是预定的(感知运动 → 前操作 → 具体操作 → 形式操作)
    - Thelen-Smith:阶段是涌现的,看似有阶段是 attractor 状态短暂稳定意义 — 你看到娃"突然会某个东西"不是按月龄解锁,是动态系统多个部件凑合到一起 self-organize 出来。
    不能拿月龄强行 push(没到 self-organize 条件,你 push 也不会出现)。
  what_to_do:
    - "不按'几个月该会 X'焦虑"
    - "看娃自己尝试 + 多个部件准备"
    - "提供环境支持,不强行教"
    - "看似'突然会' = 动态自组织"
    - "看似'退步' = 系统重组中(下一步前奏)"
  failure_mode: |
    "该会 X 月龄" 焦虑 push — 错。动态系统视角是不强行。
  evidence_level: B


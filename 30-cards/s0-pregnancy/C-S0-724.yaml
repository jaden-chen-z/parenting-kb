front:
  title: "6 岁孩子是全新的人"
  hook: "6 岁不是大号新生儿"

back:
  why_matters: |
    Ross Thompson(Ch 2)开宗立场 — 6 岁的孩子跟新生儿是根本不同的人。
    不是"长大了"这么简单,而是 4 个维度同时跃迁:社会理解(知道别人有想法)、
    自我意识(知道我是谁)、早期良知(对错有内在感)、合作能力(可以跟人配合)。
    一句话 — 0-6 岁是"造人"过程,不只是把婴儿养大。
  what_to_do:
    - "把 0-6 岁当造人不是养大"
    - "看 4 维度发育不只看身高体重"
    - "社会理解差就多角色扮演"
    - "良知差就多讲故事讨论对错"
    - "合作差就多家务一起做"
  failure_mode: |
    只盯身高体重 + IQ,忽视社会/自我/良知/合作 4 维度。
    Thompson 综述显示这 4 维度才是 6 岁跟新生儿的根本差异。
  evidence_level: B


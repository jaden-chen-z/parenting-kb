front:
  title: "情绪能力比 IQ 重要"
  hook: "EQ 比 IQ 更准"

back:
  why_matters: |
    Saarni(Ch 5)综述跨实证 — 长期跟踪 — 童年情绪能力 8 项预测成年幸福、关系质量、工作满意度,
    比 IQ 强 50%+。具体 — 4 岁能命名情绪的孩子,15 年后焦虑/抑郁率减半。
    一句话 — 你培养孩子的优先级如果选一项,选情绪能力,不选数学。
  what_to_do:
    - "时间分配:情绪 > 学术早教"
    - "孩子哭别压抑先帮命名"
    - "不打压负面情绪表达"
    - "你自己的情绪诚实示范"
    - "讨论绘本角色情绪比识字重要"
  failure_mode: |
    花 1000 块上 IQ 启蒙班,情绪能力训练 0 投入。
    Saarni — 投反了,IQ 提升 5 分意义小,情绪能力提升预测一生。
  evidence_level: B


front:
  title: "PYD 5C 框架"
  hook: "5 个 C 替代成绩"

back:
  why_matters: |
    Lerner et al.(Lerner V1 Ch 16)给 Positive Youth Development(PYD)5C 框架:
    - Competence(能力)— 学习 / 社交 / 体能等具体能力
    - Confidence(自信)— 自我效能 + 价值感
    - Connection(连接)— 跟父母 / 同伴 / 老师 / 社区的关系
    - Character(品格)— 道德 / 责任 / 价值观
    - Caring(关怀)— 同理 / 利他后来加 6C — Contribution(贡献)— 给社区 / 家庭 / 社会的贡献意义 — PYD 反缺陷 model(只看缺点改正),用资产 model(看优势放大)。
    中国 "成绩中心" 育儿可对接 PYD 反思 — 5C 比成绩更预测成年福祉。
  what_to_do:
    - "5C 维度同步看(不只成绩)"
    - "Competence 不只学业(社交 / 体能 / 艺术)"
    - "Confidence 来自被尊重 + 成就感"
    - "Connection 是父母 + 同伴 + 老师多元"
    - "Character + Caring 比成绩更预测成年"
  failure_mode: |
    "成绩第一" 单维 — 错。PYD 综述:5C 全维更预测福祉。
  evidence_level: B


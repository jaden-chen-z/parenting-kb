front:
  title: "SOC 一辈子三策略"
  hook: "选优补 3 招策略"

back:
  why_matters: |
    Baltes 给 SOC 模型 — selection(选择) + optimization(最优化) + compensation(补偿)是人一辈子应对发展的 3 个策略:
    - Selection(选)— 资源有限,选择重要的
    - Optimization(优)— 选好的事情上做到最好
    - Compensation(补)— 老了 / 弱了 / 输了用别的方式补意义 — 不只老人,孩子也可以学 SOC。
    中国家庭育儿应用 —
    - 父母自己:工作 / 育儿 / 自我发展精力有限 → SOC 选择最重要
    - 教孩子:不能样样学,选 1-2 个深耕(selection)+ 全力做好(optimize)+ 弱项找方法补(compensate)
    - 老人帮带 → 是 compensation 不是失败
    SOC 让你少焦虑,多策略。
  what_to_do:
    - "父母 SOC — 选 1-2 件重要的(不全做)"
    - "孩子兴趣 — 选 1-2 个深耕(不全报)"
    - "弱项找补 — 不强求'全面发展'"
    - "老人帮带 — 是 compensation 别愧疚"
    - "一辈子 3 策略,不只老人用"
  failure_mode: |
    "全部都要全部都好" — 错。SOC 数据:不可能,且不必要。
  evidence_level: B


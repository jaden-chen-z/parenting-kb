front:
  title: "Werner 正交发展原则"
  hook: "从笼统到精分化期"

back:
  why_matters: |
    Werner orthogenetic principle(正交发展原则)是发展心理学奠基命题之一(via Cairns Ch 3)—
    发展是从 globally undifferentiated → differentiated and hierarchically integrated。
    - 全球未分化(婴儿)→ 分化 + 层级整合(成熟)
    - 婴儿一切感受混在一起 → 慢慢分出各种情绪 / 概念 / 关系
    - 婴儿动作笼统 → 慢慢分出精细动作应用 —
    - 情绪 — 6 月笼统兴奋 / 苦恼 → 12 月分出兴奋 / 害怕 / 生气 → 24 月分出嫉妒 / 内疚 / 自豪
    - 概念 — 1 岁 "动物" 笼统 → 3 岁分 狗 / 猫 / 鸟
    - 自我 — 1 岁笼统 "我" → 3 岁分 "学习的我 / 玩的我 / 妹妹的哥"
    意义 — 中国家长不期望 1 岁娃有 3 岁的精细分化能力。
    分化是发展的 mark,不是天生有的。
  what_to_do:
    - "不期望婴儿有精细分化能力"
    - "情绪 / 概念 / 自我都从笼统开始"
    - "随发展自然分化"
    - "逼分化 (反复教概念) 不一定有效"
    - "Werner 原则解释发展轨迹"
  failure_mode: |
    逼婴儿"懂细节" — 错。Werner:发展是从笼统到分化的过程。
  evidence_level: B


stages: [S0]
tags: []

front:
  title: "营养不良 3 类:矮瘦 胖"
  hook: "矮瘦 胖都算营养"

back:
  why_matters: |
    WHO 5 岁以下儿童营养不良 3 大类(2022 数据 原文):
    ① stunting(矮小)— 身高/年龄低于 -2 SD,慢性营养不良 — **全球 1.49 亿娃(WHO 2022)**
    ② wasting(消瘦)— 体重/身高低于 -2 SD,急性营养不良 — **4500 万娃**
    ③ overweight(超重)— 体重/身高高于 +2 SD,过度喂养 — **3700 万娃**
    中国家长常见误区:
    - 'overweight 也是营养不良' — 不是只缺才算,过也算
    - '中国娃没问题' — 中国 stunting 在中西部农村仍有,overweight 在城市持续上升
    WHO Growth Standards 2006 给统一阈值。
  what_to_do:
    - "记 3 类:矮 / 瘦 / 胖都是 WHO 营养不良"
    - "矮:身高/年龄 -2 SD(慢性)"
    - "瘦:体重/身高 -2 SD(急性)"
    - "胖:体重/身高 +2 SD(过度)"
    - "WHO Growth 2006 是统一判定标准"
  failure_mode: |
    把'胖娃'当'养得好' → WHO 把 overweight 列营养不良 — 长期肥胖+糖尿病风险高。
    营养不良不只'瘦','胖'也算。
  evidence_level: A


front:
  title: "繁荣发展不只 5C"
  hook: "5C 之上的整体感"

back:
  why_matters: |
    Lerner Ch 16 提繁荣发展(繁荣发展)— 是 5C(后扩 6C)之上的整体状态。
    繁荣发展 = 个体跟环境互动产生最优发展。
    不只是 "没问题 / 不犯错",是积极发展 + 贡献:
    - Competence(能力)→ 实际用出来
    - Confidence(自信)→ 不怯于尝试
    - Connection(连接)→ 多元关系网
    - Character(品格)→ 内化价值观
    - Caring(关怀)→ 主动付出
    - Contribution(贡献)→ 给社区 / 家 / 社会意义 — 中国家长 "不犯错就行" / "成绩好就行" 立场是缺陷/单维 vs 繁荣发展整体视角。
    繁荣发展视角让你看 — 娃整体状态(身心灵 + 关系 + 贡献)是不是积极发展?
    不是某一维度高分。
    意义 — 繁荣发展是 PYD 的目标,不是 average,不是 excellent,是 holistically positive。
  what_to_do:
    - "繁荣发展看整体不看单维"
    - "6C 同时发展才是繁荣发展"
    - "'不犯错就行' 立场放下"
    - "'成绩好就行' 立场放下"
    - "繁荣发展 = PYD 终极目标"
  failure_mode: |
    "不犯错就行" 立场 — 错。PYD 视角:繁荣发展是积极发展。
  evidence_level: B


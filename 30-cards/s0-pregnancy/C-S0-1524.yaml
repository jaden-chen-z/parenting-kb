card_id: C-S0-1524
stages: ['S0']
tags: ['philosophy', 'lerner_v1', 'shweder', 'cultural_psychology', 'multiple_mentalities', 'foundational']

front:
  title: "心智不是通用的"
  hook: "一种心多种活法别"

back:
  why_matters: |
    Shweder / Goodnow / Hatano / LeVine / Markus / Miller(Lerner V1 Ch 13)给 cultural psychology —
    multiple mentalities(多元心智论)— 不同文化下人有不同 "心智组织方式",不只是 "同一心智 + 文化变量"。
    经典对比 —
    - 普世派:所有人心智一样,文化只是背景
    - 文化派(Shweder):不同文化人心智不同 — 自我感 / 时间感 / 道德感 / 情绪表达都构成不同意义 — 中国人 vs 美国人不只是"文化背景不同",是"心智组织方式不同"。
    - 中国娃 self 是互依(interdependent) — 家庭 / 关系 / 角色一体
    - 美国娃 self 是独立(independent) — 个体 / 选择 / 边界突出意义 — 中国家长不必照搬美式 "自尊 / 早期独立训练" 标准。
  what_to_do:
    - "中国育儿不照搬美式标准"
    - "互依型自我 ≠ 缺陷(是不同心智模式)"
    - "'早期独立'美国标准不适合中国"
    - "集体感 / 家庭感是中国娃强项"
    - "Shweder 多元 — 不是次等是不同"
  failure_mode: |
    "美国育儿就是先进" — 错。Shweder 综述:多元心智不是次等。
  evidence_level: B


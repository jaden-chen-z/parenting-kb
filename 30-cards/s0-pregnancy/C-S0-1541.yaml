front:
  title: "反还原论批判"
  hook: "一物分万非是真理"

back:
  why_matters: |
    跨章共识(Ch 2 Overton + Ch 5 Gottlieb + Ch 8 Magnusson)— 反 reductionism(还原论)。
    什么是 reductionism — 把复杂系统简化为更简单组件,再单独分析。
    - 把 "孩子" 简化为 "脑" — 还原到神经
    - 把 "脑" 简化为 "基因表达" — 还原到分子
    - 把 "孩子情绪" 简化为 "化学反应" — 还原到生化
    V1 综述明确反对 — 还原论会丢失系统层级的涌现属性。
    意义 —
    - 中国家长 "孩子情绪问题 = 缺锌 / 缺铁 / 缺维生素" 立场 = 还原论
    - "孩子学不进 = 智力低" = 还原论
    - "孩子打人 = 性格坏" = 还原论反 — 看 multi-level + 关系 + 系统层级。
  what_to_do:
    - "不简化复杂为单因"
    - "'缺 X 补 X' 是还原立场"
    - "看 multi-level(基因 / 神经 / 行为 / 环境)"
    - "系统涌现属性不能从组件预测"
    - "反 reductionism = V1 共识"
  failure_mode: |
    "X 问题就是 Y 简单原因" — V1 反 reductionism 立场。
  evidence_level: B


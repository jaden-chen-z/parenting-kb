front:
  title: "WHO:4 国 1 国际"
  hook: "国际共识比谁都硬"

back:
  why_matters: |
    现库已有 AAP(美) / 鲍秀兰(中) / 松田(日) 三国指南,各国家长立场不同。
    WHO+UNICEF 是唯一全球医学共识 — 不是某国意见,是国际公共卫生政策。
    WHO 立场跟 AAP/鲍/松田部分一致(6 月 EBF / 反产院定时喂奶),部分对立(辅食 6 月 vs AAP 4-6 月 / 持续母乳 2 年 vs 中国'早断')。
    孕期就要看 WHO 标准 — 选医院 / 选奶粉品牌 / 想喂多久,WHO 给国际答案。
  what_to_do:
    - "孕期读 WHO 6 月 EBF + 持续 2 年共识"
    - "选产院问 BFHI 认证(母婴友好医院倡议)"
    - "买奶粉看品牌是否守 Code(国际营销禁令)"
    - "决定喂多久不被亲戚施压 — WHO 推荐 ≥ 2 年"
    - "中国 EBF 率仍 < 50% — 你不一定要随大流"
  failure_mode: |
    只看中国传统(早断 / 早辅食 / 奶粉随便选)→ 错过国际证据 + 受营销绑架。
    WHO 是目前最强 Tier 1 国际权威,值得知道。
  evidence_level: A


front:
  title: "B 氏 5 系统模型"
  hook: "5 层环境塑造孩子"

back:
  why_matters: |
    Bronfenbrenner & Morris(Lerner V1 Ch 14)给当代发展心理学最权威的环境模型 —
    bioecological 5 系统(2006 第 6 版完整版,从 1979 持续修订):
    1. microsystem(微观)— 父母 / 同胞 / 老师直接互动
    2. mesosystem(中观)— 家 ↔ 学校 / 家 ↔ 邻居 settings 之间
    3. exosystem(外观)— 父母工作 / 政策 / 媒体间接影响
    4. macrosystem(宏观)— 文化 / 经济 / 政治价值观
    5. chronosystem(时观)— 历史变迁 / 个人发展时间中国父母常只看微观(家)和宏观(文化),漏中观(家 ↔ 学校协调)和外观(父母工作压力外溢)。
    完整 5 层视角让你看到孩子问题的根源不止一层。
  what_to_do:
    - "孩子学校问题先看 mesosystem(家 ↔ 学校沟通)"
    - "父母焦虑外溢看 exosystem(工作压力)"
    - "中国式育儿冲突看 macrosystem(文化变迁)"
    - "不要只调 microsystem(管孩子) — 多层同时"
    - "5 层都健康 → 孩子问题大多消失"
  failure_mode: |
    只盯微观层(管孩子) — 错。问题常在中观/外观/宏观多层共振。
  evidence_level: B


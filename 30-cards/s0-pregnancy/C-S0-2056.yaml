card_id: C-S0-2056
stages: [S0]
tags: [philosophy]

front:
  title: 母乳还是配方:权衡而非道德题
  hook: 1 个月也比没喂强

back:
  why_matters: |
    母乳 vs 配方决定不止"科学"还有"感觉"。海蒂的中庸立场:不应让"母乳最好"压力等同"非母乳就失败"。
    多数权威(WHO/AAP)默认推母乳是因群体收益,但单家庭决策还要看妈妈状态、工作、心理。
    海蒂建议:即使最初想配方也试 6 周再决定;即使最初想纯母乳也别用全人格压自己。
    几周母乳 ≠ 没喂,初乳期 + 1 月母乳就有显著免疫好处 — 别因为做不到 6 月而 0 月。
  what_to_do:
    - 不确定 → 先试母乳 1 个月,有底再换
    - 想配方 → 至少试 6 周确认自己感受
    - 短期母乳也算数:1 周初乳即有价值
    - 别让其他人的选择决定你的
    - 决定后不回头,别在两种间反复纠结
  failure_mode: |
    把'母乳=好妈妈'内化 → 奶不够时崩溃自责,影响产后心理。
    把'配方=放弃'对立 → 错过试一试的机会。
    最危险:在两种间反复犹豫,反而两种都做不好。
  evidence_level: B

  positions:
    issue: 母乳还是配方奶 — 道德题还是权衡题
    views:
      - school: 海蒂
        source: SRC-040
        stance: 权衡而非道德题;真正不能母乳的 7 种情境;"决定不喂别内疚"。挑战道德绑架,授权职场妈不内疚。
      - school: WHO / BFHI
        source: SRC-031
        stance: 母乳唯一 + 只医学指征用配方;技术层面承认母乳更优,情感框架上母乳是道德选择。
      - school: AAP
        source: SRC-006
        stance: 推母乳但承认家庭情况差异;不强加道德标签,以家庭决定为本位。
      - school: 中国家长压力
        stance: 亲戚 / 月嫂 / 育儿群常用 "不母乳的妈不爱孩子" 道德绑架,缺"不内疚"授权来源。

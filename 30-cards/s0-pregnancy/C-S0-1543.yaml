front:
  title: "连续 vs 不连续"
  hook: "都对得看是哪一层"

back:
  why_matters: |
    跨章经典争议(Ch 6 vs Ch 11 vs Ch 7)— 连续性(连续)vs 间断性(不连续)。
    - 连续性派(Baltes)— 发展是渐进累积,不是跳跃
    - 间断性派(Piaget)— 发展是阶段跳跃
    - 当代综合 — 看哪一层
      - 神经层级(细胞数 / 突触修剪)= 连续性渐进
      - 行为层级(走 / 说 / 写)= 间断性跳跃涌现
      - 认知层级(物体永久 / 守恒)= 半连续性半间断性
    意义 — 中国家长经常二选一立场("发展是连续的" 或"阶段跳跃"),都太简化。
    当代视角 — 不同层级不同性质,父母要分层看。
    - 长期累积(语言 / 阅读)= 连续性 → 每天积累
    - 关键涌现(走 / 说话 / 自我意识)= 间断性 → 等 + 庆祝意义 — 双视角让你既有耐心(看连续性)又有期待(看间断性)。
  what_to_do:
    - "区分哪一层连续性哪一层间断性"
    - "语言阅读 — 连续性每天积累"
    - "走说话 — 间断性等涌现"
    - "不二选一 — 双视角并用"
    - "层级不同性质不同"
  failure_mode: |
    只看连续性 (急于积累) 或只看间断性 (干等) — 错。双视角并用。
  evidence_level: B


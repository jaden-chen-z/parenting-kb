card_id: C-S0-115
stages: [S0]
tags: [philosophy, mindset, RIE, lansbury]

front:
  title: "永远不晚开始尊重式育儿"
  hook: "只要孩子在,机会就还在"

back:
  why_matters: |
    尊重式育儿(Respectful Parenting)= RIE 派 Magda Gerber 创立的方法,
    把婴儿当完整的人对待,而不是"小动物"。
    Lansbury 反复强调:就算前面用了"哄骗 / 分散 / 强迫"几年,
    今天开始转向"诚实 + 限度 + 听情绪",孩子依然能感受到这份新的尊重。
    新生儿期错过没关系,真正的孩子还在你面前。

  what_to_do:
    - 不内疚之前没做对,从今天起换语言
    - 把"乖 / 听话"换成"我看到你..."
    - 哭闹时先听不修复,允许情绪走完
    - 设清楚的限度,不通过吼叫
    - 把宝宝当真人聊天,不是娃娃

  failure_mode: |
    "我都错过头一年了,改了也来不及" → 这是放弃借口。
    或一夜想"全套换",反而焦虑撑不住。
    一次换一个习惯,比一夜全换更可持续。

  evidence_level: B


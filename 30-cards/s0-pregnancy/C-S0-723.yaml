card_id: C-S0-723
stages: [S0]
tags: [philosophy, lerner_v3, eisenberg, emotion_central]

front:
  title: "情绪是社会发展核心"
  hook: "情绪不是软的是地基"

back:
  why_matters: |
    Eisenberg 序章核心立场 — 过去儿童心理学把"情绪"当软话题,把"认知/IQ"当硬指标。
    Lerner V3 颠倒过来 — 16 章里 8 章主轴是情绪有关(气质/情绪/人格/亲社会/攻击/道德/性别/同伴)。
    一句话 — 情绪能力(识别+表达+调节+理解他人)才是 0-6 岁发展的硬地基,
    不是先认字背单词。共情比智力更预测一生幸福。
  what_to_do:
    - "0-6 岁优先教情绪词,不是字母数字"
    - "孩子哭别说别哭,先帮他命名情绪"
    - "你自己有情绪也要承认,孩子在学你"
    - "拒绝把情绪当软话题的家长建议"
    - "看绘本聊角色情绪比识字重要"
  failure_mode: |
    觉得情绪能力会自然来,把所有时间投在 IQ 培训。
    Eisenberg 综述显示 — 情绪能力不会自然来,要每天的关系互动里磨出。
  evidence_level: B


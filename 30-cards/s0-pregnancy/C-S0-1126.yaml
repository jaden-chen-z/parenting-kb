card_id: C-S0-1126
stages: [S0]
tags: [philosophy, lerner_v1, overton, metatheory, split_vs_relational, foundational]

front:
  title: "二分立场的 5 个对立"
  hook: "split 5 大分裂"

back:
  why_matters: |
    Overton 把 split metatheory 拆成 5 个具体二分对立 —
    每一对都让"研究者 / 父母 / 老师"必须站队 →
    一站队就跟另一派打仗。
    1. 基因 vs 环境(nature vs nurture)
    2. 个体 vs 环境(individual vs context)
    3. 心 vs 身(mind vs body)
    4. 主动 vs 被动(active vs passive)
    5. 变化 vs 稳定(change vs stability)
    relational metatheory 的解法 — 不是站队,是看两端如何 mutually constituting
    (互相塑造 / 互相定义)。中国父母经常被某派单选题搞累,relational 解套。
  what_to_do:
    - "下次专家说'是基因决定'你立刻警惕(split 立场)"
    - "下次专家说'全靠环境'也警惕(split 立场)"
    - "好的回答 — 基因 + 环境互相塑造 4 层(Gottlieb)"
    - "心 vs 身 ≠ 二分 → 身体动作就是认知(embodied)"
    - "孩子既不主动也不被动,是 active context(Lerner)"
  failure_mode: |
    被"非黑即白"育儿话题骗 — 错。relational 立场是 both-and,不是 either-or。
  evidence_level: B


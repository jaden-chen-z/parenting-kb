card_id: C-S0-006
stages: [S0]
tags: [safety]

front:
  title: 烟酒一次也别碰但别自责
  hook: 早期暴露大概率自然流产了

back:
  why_matters: |
    孕期酒精、烟草、毒品和某些药物会损害胎儿大脑发育,导致脑容量变小,长期影响脑功能;
    严重产前暴露的婴儿出生时可能进入戒断状态——醒不来又狂哭、无法进食、无法入睡,极难照顾。
    但 Brazelton 给出反直觉的安抚:很早期最严重的暴露通常会自然流产,
    意思是能继续妊娠的胎儿大概率没受到致命伤害,孕中后期戒掉仍能极大改善结局。
  what_to_do:
    - 怀孕后立即戒烟戒酒戒任何娱乐性药物
    - 任何 OTC 药物吃前问产科医生
    - 早期不知情时已暴露过,告诉医生不隐瞒
    - 第二三孕期戒断仍有显著挽救空间
    - 出生后注意宝宝是否易激惹、难安抚
  failure_mode: |
    知道怀孕前已经喝过酒抽过烟,陷入深度自责或干脆隐瞒。
    隐瞒最危险——医生无法在出生后针对性观察。
    Brazelton 建议:坦白告诉医生所有暴露,医生能据此评估宝宝、必要时启动早期干预;
    受影响的宝宝在敏感照护下"能有惊人的恢复",但越早干预越好。
  evidence_level: B


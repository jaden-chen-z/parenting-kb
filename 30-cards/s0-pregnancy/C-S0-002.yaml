card_id: C-S0-002
stages: [S0]
tags: [philosophy]

front:
  title: 孕期父母梦到三个宝宝
  hook: 半夜噩梦不是你心理变态

back:
  why_matters: |
    "矛盾情感(ambivalence)"指准父母同时怀着期待和恐惧的混杂情绪,是 Brazelton 流派核心观察。
    几乎所有准父母都会在孕期梦到三个不同的宝宝:完美会笑的 4 月龄、有缺陷的、和肚子里那个真实的神秘宝宝。
    这种梦不是不祥之兆——恰恰是大脑在演练"万一不完美怎么办",为接受真实宝宝(必然有不完美)做情感预演。
  what_to_do:
    - 接受半夜的焦虑梦境是正常预演
    - 跟伴侣说出"我担心宝宝有缺陷"
    - 不要白天硬压住焦虑,夜里它会冒出来
    - 把三种"幻想宝宝"的形象都允许自己想
    - 严重失眠或抑郁要找心理医生
  failure_mode: |
    准妈妈白天忙工作压住焦虑,认为"想这些不吉利",结果夜夜噩梦不敢说,产后情绪崩塌。
    或者反过来,把焦虑当病态自责,觉得自己不够爱孩子。
    正确做法是承认它、说出来——把焦虑当成情感升级的工具,而非要消除的故障。
  evidence_level: C


card_id: C-S4-002
stages: [S4]
tags: [safety, red_flag]

front:
  title: 手指食物切长条不切圆片
  hook: 圆片刚好卡气管 — 致死常见

back:
  why_matters: |
    婴儿气管直径约 9 毫米,任何直径接近的圆形 / 球形物体都可能正好卡住气管。

    婴儿窒息致死食物前三名:整粒葡萄 / 整段热狗 / 大块奶酪(都是圆形或圆柱形)。
    AAP 提醒:窒息(choking)是婴儿意外死亡主因之一。

    BLW 给手指食物必须切长条(像小胡萝卜形状),
    绝对不能切硬币状的圆片(英文叫 round/coin-shaped slices)— 圆片大小正好卡气管。
    葡萄、小番茄、热狗都要切成 4 长条或十字 4 等份。
  what_to_do:
    - 切成长条状(英文 finger-shaped),长度约 4-5 厘米
    - 不切圆片(不是大小问题,是形状问题)
    - 葡萄 / 小番茄:十字切 4 等份
    - 热狗:沿长方向切 4 长条,再切短段
    - 胡萝卜煮软到能用牙龈压碎再给
    - 喂时大人必须在场,坐高椅 + 系安全带
  failure_mode: |
    切成圆片当手指食物 → 形状正好卡气管,死亡风险极高。
    给整粒葡萄 → 已有多起儿童死亡案例。
  evidence_level: A


card_id: C-S4-017
stages: [S4]
tags: [philosophy]

front:
  title: 7-8 月学"再见欢迎谢谢"手势
  hook: 边说边握手做动作

back:
  why_matters: |
    7-8 月宝宝开始理解语言,但还不会说,手势动作是语言之前最早的社交表达。
    鲍秀兰方法:说和做平行 — 大人说"再见",同时握住宝宝手摆;说"欢迎",拍宝宝两手;说"谢谢",握宝宝两手合在一起摇动。
    反复教 → 听到"再见"自动摆手,听到"欢迎"拍手,听到"谢谢"做动作。这是早期社交礼仪 + turn-taking 高级版。
  what_to_do:
    - 爸爸出门:说"再见",握宝宝手摆
    - 客人来:说"欢迎",拍宝宝两手
    - 给东西时:说"谢谢",合宝宝两手摇
    - 任何场合有机会就教
    - 反复多次后宝宝会自动反应
  failure_mode: |
    只让宝宝看不让做 → 不会模仿。
    一会教一会忘 → 反应建立慢。
  evidence_level: C


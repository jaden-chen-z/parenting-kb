front:
  title: 陌生人焦虑 ~8 月,健康发展
  hook: 不是性格问题,是认知里程碑

back:
  why_matters: |
    陌生人焦虑(stranger anxiety)~8 月起,是健康发展的标志 — 宝宝学会区分熟悉 vs 陌生。
    "即使亲戚和常见保姆靠得太近时也会躲藏或哭泣" — AAP 直接说这正常,不是性格弱或不亲。
    本质:认知发展到能"分类人"的阶段,对未知谨慎是生存本能。
    给时间 + 耐心,几个月内自然过渡。
  what_to_do:
    - 8 月起观察(对生人退缩 / 哭 / 躲进父母怀)
    - 不责怪宝宝"不亲老人"(不是个性问题)
    - 让陌生人保持距离,让宝宝主动接近
    - 老人 / 保姆见面前先视频"预热"
    - 陌生人不直接抱,先跟父母聊熟,宝宝看
  failure_mode: |
    硬把宝宝塞给亲戚抱 → 加重焦虑 + 安全感受损。
    觉得"我家孩子怎么这么内向"自责 → 是认知发展正常阶段。
  evidence_level: A


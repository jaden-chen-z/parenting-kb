front:
  title: "气质不是命运"
  hook: "天生底色后天可改"

back:
  why_matters: |
    Rothbart + Kagan(Ch 3+4)联合综述 — 气质有 40-50% 遗传性,
    但意味着 50%+ 是环境塑造。Kagan 跟踪研究 — 4 月抑制型反应高的婴儿,
    7 岁仍抑制的只有 50%,另一半在合适养育下变得不抑制。
    一句话 — 气质给底色,环境画图,不要把娃当固定模型。
  what_to_do:
    - "敏感娃不孤立家中保护过度"
    - "渐进暴露(熟人开始,陌生人慢慢)"
    - "尊重节奏不强推但不投降"
    - "肯定他的进步(从怕变敢)"
    - "别给娃贴'就是这样'标签"
  failure_mode: |
    把气质当命运,把娃保护起来或放弃改善。
    Rothbart + Kagan — 50% 可改,放弃就真定型了。
  evidence_level: B


front:
  title: "6-12 月 50% 能量"
  hook: "辅食一半,母乳一半"

back:
  why_matters: |
    WHO 立场(原文):'In months 6-12, breastmilk continues to provide up to half or more of a child's nutritional needs.'
    6-12 月营养构成:
    - 母乳 ≥ 50% 能量 + 主要免疫保护
    - 辅食 ≤ 50% 能量 + 主要铁/锌/维 A
    AAP 立场(SRC-006):6 月推 EBF,12 月起可断 — 早于 WHO 2 年。
    中国传统'1 岁就该断,母乳没营养'→ 跟 WHO 50% 数字硬冲突。
    实操:6-12 月每天仍 4-6 次母乳,加辅食后总能量 = 母乳一半 + 辅食一半。
  what_to_do:
    - "6-12 月母乳 ≥ 50% 能量,辅食 ≤ 50%"
    - "每天 4-6 次母乳(辅食后仍喂)"
    - "顺序:母乳吃饱后再加辅食"
    - "'1 岁该断'/'母乳没营养'是错的"
    - "6-12 月母乳免疫仍主要保护"
  failure_mode: |
    1 岁前减母乳追求 '辅食为主' → 跟 WHO 50% 数字冲突 → 母乳免疫保护下降 + 妈妈奶量真降。
    WHO 50% 是硬数据,不是建议。
  evidence_level: A


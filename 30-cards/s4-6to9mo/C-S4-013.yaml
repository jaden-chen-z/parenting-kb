card_id: C-S4-013
stages: [S4]
tags: [philosophy]

front:
  title: 7-8 月百宝箱学自己玩
  hook: 安全杂物箱激发探索

back:
  why_matters: |
    7-8 月起宝宝运动能力增强,**强烈表达独立活动意愿**:见什么抓什么,不喜欢成人摆布限制。
    鲍秀兰建议:准备**"百宝箱"** — 安全的小空间放各种生活小物(小毛巾 / 小盒子 / 大塑料勺 / 红布条),让宝宝专心致志地拿出放回 / 反复打开合上。
    这是**培养独立性 + 大脑潜能发展**的关键。
  what_to_do:
    - 准备安全小空间(地上铺垫)
    - 放入各种小杂物(小毛巾 / 大塑料勺 / 软玩具 / 小盒)
    - 让宝宝自己拿出 / 放回 / 反复
    - 父母只在精神上支持,不主动干预
    - 遇到困难求助时再出手帮助
  failure_mode: |
    "怕弄乱怕脏不让宝宝玩"→ 错过独立探索关键期。
    放危险物(纽扣 / 硬币 / 小玩具)→ 误食。
  evidence_level: C


card_id: C-S4-126
stages: [S4]
tags: [development_burst, controversy]

front:
  title: 烦躁不是出牙痛
  hook: 发烧腹泻才需就医

back:
  why_matters: |
    6-9 月期间宝宝烦躁时家长最常见错误归因:**"是出牙痛"**。
    凡德里特在 WW26 + WW37 章节都加专门破除框(白话翻译):
    > 跟老一辈说法相反,发烧或腹泻跟出牙没关系。
    > 宝宝有这些症状,该看儿科医生。

    数据:出牙时间和烦躁阶段**是巧合不是因果**。
    - 跃迁期间出牙的宝宝同样多 ≈ 跃迁期间没出牙的宝宝
    - 5 位妈妈日记:都说"是出牙",真正出牙发生在 4-7 周后

    一般出牙规律(供参考):
    - 6 月:下门牙(下中切牙)
    - 1 岁:6 颗牙
    - 2.5 岁:全部 20 颗乳牙家长意义:**烦躁 + 流口水 ≠ 出牙引起烦躁**。
    流口水是发育自然现象(6 月唾液腺成熟),与烦躁同期但不互为因果。
  what_to_do:
    - 烦躁时优先想跃迁(看 10 跃迁时间表 C-S1-179)
    - 出牙关心:看牙龈,不看烦躁程度
    - 真出牙会有局部红肿 / 牙龈鼓包,不是发烧 / 腹泻
    - 发烧 ≥38°C / 严重腹泻 / 呕吐 → 看医生(不要归罪出牙)
    - 真出牙不适:冷藏牙胶 / 干净手指轻压牙龈
  failure_mode: |
    "出牙就是这样的" → 发烧持续不就医 → 错过真病诊断。
    给出牙药水 / 凝胶(很多含苯佐卡因 — 美国 FDA 禁忌 < 2 岁)。
    琥珀牙胶项链(SIDS / 窒息风险)。
  evidence_level: A


front:
  title: 7 月吃饭就是探索
  hook: 抢勺子不是捣蛋

back:
  why_matters: |
    7 月宝宝拿到食物先甩、捏、糊脸——大人觉得"不好好吃饭"，Brazelton 说这是认知爆发期，探索远比吃饱重要。强行喂只会种下长期厌食的种子，且这场战争"她永远会赢"——身体是她的，咽不咽是她的事。
  what_to_do:
    - 给他另一把勺子让他抓
    - 自己穿围裙做好弄脏准备
    - 一次给 2-3 块手指食物
    - 他不张嘴就停不追喂
    - 三顿奶+1-2 勺铁强化谷物足够
  failure_mode: |
    父母心疼"营养不够"硬塞，宝宝形成"吃饭=被控制"的负面联结。后续 1-2 岁会变本加厉拒食，远比现在松手代价大。
  evidence_level: B


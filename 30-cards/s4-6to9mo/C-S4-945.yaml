front:
  title: "6-9 月情绪调萌芽"
  hook: "他第一次自我安慰"

back:
  why_matters: |
    Calkins(via Ch 5 Saarni)综述 — 6-9 月情绪自我调节真正萌芽:
    ① 看其他物体转移注意 ② 吸手指自我安抚
    ③ 用身体姿势调节(转身躲过度刺激)。
    这是从完全 co-regulation(妈调)到 self-regulation(自调)的过渡期。
    一句话 — 6-9 月别全替他调,留空间他自己练。
  what_to_do:
    - "他烦躁不立即抱起,看是否自调"
    - "10-30 秒观察是否能转移自己"
    - "不能就帮(命名 + 抱)"
    - "吸手指别强拉"
    - "转身躲刺激尊重"
  failure_mode: |
    秒回应每次哭,孩子不练自我调节肌肉。
    Calkins — 6-9 月给空间练,1 岁后能 co + self 双轨。
  evidence_level: B


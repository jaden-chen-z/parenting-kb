card_id: C-S4-070
stages: [S4]
tags: [philosophy]

front:
  title: 哭多不等于爱深
  hook: 不哭的可能更安全

back:
  why_matters: |
    最大的家长误解:"宝宝最哭最黏的就是最爱我的"。**完全错。**
    Ainsworth 干达研究关键发现:
    > "一些婴儿似乎跟母亲有最牢固的依恋,几乎不会出现抗议行为或分离焦虑,而是用另一种方式来展现依恋的力量。这些婴儿随时准备着将母亲作为安全基地,这样双方都可以探索世界。"
    - B 安全型:不太哭(知道妈会回来),但回来后立即迎接 — 这是最健康
    - C 焦虑抗拒型:剧烈哭闹,但不能被安抚 — 不健康
    把"宝宝多黏"等同"依恋深"是错误标尺。
  what_to_do:
    - 不要用"哭闹强度"判断依恋质量
    - 健康标志:**短分离不剧烈崩溃 + 重聚立刻迎接 + 安抚后能继续玩**
    - 不健康标志:**剧烈崩溃 + 重聚拒绝接触/愤怒 + 长时间无法平静**
    - 你的孩子如果短分离不哭闹,可能是 B 安全型,值得开心
  failure_mode: |
    "我家宝宝太独立,可能不爱我" — 安全依恋的孩子就是这样,不是不爱。
    "他这么黏证明跟我亲" — 可能是 C 焦虑抗拒,不是健康标志。
  evidence_level: B


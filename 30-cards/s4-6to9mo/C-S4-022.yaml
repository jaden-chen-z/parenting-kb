card_id: C-S4-022
stages: [S4]
tags: [philosophy]

front:
  title: 6-9 月有自我安抚就放心
  hook: 9 月会自慰才放心

back:
  why_matters: |
    Brazelton 在 Children's Hospital Boston 看 6-9 月宝宝有自我安抚手段(吮拇指、奶嘴、毯子、teddy bear、特定行为模式)就放心——这表明此孩子被爱过、内在已有可依靠的资源。
    被忽视/被冷漠的宝宝在哭声里会有"空洞绝望",看似想被抱实则一抱就身体抗拒、僵硬。
    当代父母焦虑"用奶嘴是不是不好",Brazelton 明确:在压力时代,连婴儿都需要早点学会自我管理压力。
  what_to_do:
    - 6-9 月观察自我安抚是否建立
    - 白天非崩溃状态时"教"用奶嘴/lovey
    - 平时引导,崩溃时再推向自我安抚
    - 不必担心"养成依赖"
    - 缺乏自我安抚孩子需早期干预评估
  failure_mode: |
    把奶嘴/lovey 视为"坏习惯"反复戒掉,导致孩子失去自我调节工具;或反向地,从不让孩子哭一会儿,孩子永远学不会自慰。
  evidence_level: B


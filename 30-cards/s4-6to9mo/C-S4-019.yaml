front:
  title: 7-8 月睡眠倒退是好事
  hook: 学新本事会睡乱

back:
  why_matters: |
    6-8 月宝宝学坐、爬、捏取，白天兴奋到晚上睡不踏实，2 点 6 点莫名哼唧甚至跪着摇晃却没真醒。Brazelton 视角：这是大脑在浅睡期"刷题"运动技能记忆，不是病、不是饿、更不是要抱要喂，反而是发展的好兆头。
  what_to_do:
    - 哼唧时先观察 2 分钟别冲进去
    - 不开灯不抱起不喂奶
    - 必要时拍背低声哼歌
    - 让他自己再翻回深睡
    - 抱起来你会成为入睡条件之一
  failure_mode: |
    父母一听响动就抱起喂奶，宝宝学会"哼唧=有人陪玩"，半年后还得每晚醒 3 次。Brazelton 警告：你越介入，越成为他睡眠模式的一部分。
  evidence_level: B


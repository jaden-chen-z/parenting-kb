card_id: C-S4-014
stages: [S4]
tags: [safety]

front:
  title: 7-8 月长牙后改用杯子喝水
  hook: 防奶瓶蛀牙 + 口型矫正

back:
  why_matters: |
    奶瓶蛀牙(baby bottle tooth decay)= 长期睡前用奶瓶喂奶/糖水,液体浸泡牙齿被微生物发酵成有机酸,腐蚀釉质。
    鲍秀兰数据:**3 岁儿童中约半数有龋齿**,首先侵犯上门牙(称"喂养龋")。还可能改变口型,影响牙齿发育。
    7-8 月长牙后逐渐改用杯子喝水 / 喝奶,是 0-3 岁口腔健康关键决定。
  what_to_do:
    - 7-8 月开始减少吸吮奶瓶机会
    - 用透明杯子(可看液面)装水
    - 大人扶杯教宝宝双手扶杯
    - 逐渐过渡到宝宝自己扶杯
    - 绝不睡前用奶瓶喂(最易蛀牙)
  failure_mode: |
    睡前奶瓶喂到宝宝睡 → 喂养龋,3 岁就需治疗。
    觉得"宝宝戒不了奶瓶,等 2 岁再说"→ 终身牙齿问题。
  evidence_level: A


card_id: C-S4-551
stages: [S4]
tags: [weaning, milk-floor, nutrition]

front:
  title: 7 月奶量底线 500ml
  hook: 不论辅食奶不能少

back:
  why_matters: |
    松田硬数字:7 月用牛奶喂养,每天奶量不能少于 500 ml。
    这是底线 — 防妈"娃辅食吃多了"为由减奶,反致钙/蛋白质/能量不足。
    主流以为"7 月辅食为主"是错的 — 辅食是练习,主食仍奶。
    母乳同理 — 哺乳次数不少于 4-5 次。
  what_to_do:
    - 牛奶喂养记每日总奶量 ≥ 500 ml
    - 母乳记每日哺乳 4-5 次以上
    - 辅食吃太多就减辅食,不减奶
    - 别因娃爱吃粥就用粥替奶
    - 一周称体重看是否健康增
  failure_mode: |
    妈"娃喜欢吃米粥就少喂奶" → 蛋白质/钙不足 → 缺铁性贫血 + 增长停滞。
  evidence_level: B


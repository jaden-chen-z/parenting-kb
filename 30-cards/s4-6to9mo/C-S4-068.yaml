front:
  title: 8 月怕陌生人 = 依恋形成证据
  hook: 不是变怂,是变聪明

back:
  why_matters: |
    Spitz (1965) 称之为"八月焦虑"(stranger anxiety),很多人误解为"宝宝变娇气了"。
    Bowlby 反驳并说明:**陌生人警觉(stranger wariness)≠ 病。**这是认知发育里程碑:
    - 婴儿能"分类人"了:熟悉 vs 陌生
    - 对未知谨慎是生存本能(进化保留)
    - 跟分离焦虑是不同的反应(分离焦虑跟主依恋人有关,陌生人焦虑跟陌生面孔有关)
    Morgan & Ricciuti:10-12 月婴儿即使母亲在场,也有近一半会对陌生人警觉。
    家长意义:8 月怕陌生人**说明依恋已经形成**。该庆祝,不该担心。
  what_to_do:
    - 让陌生人**保持距离**,让宝宝主动接近
    - 老人 / 阿姨见面前先视频 / 短探访"预热"
    - 陌生人不直接抱,先和你聊熟,宝宝看着
    - 不强迫宝宝跟陌生人,强迫加重焦虑
    - 18-24 月会自然消退
  failure_mode: |
    "宝宝怎么一见外人就哭,真没出息" — 这是健康发展信号,不是性格问题。
    强迫宝宝接受陌生人("叫叔叔阿姨"),损伤信任 + 加重焦虑。
  evidence_level: A


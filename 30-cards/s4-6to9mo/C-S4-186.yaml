card_id: C-S4-186
stages: [S4]
tags: [cognitive_science, language, statistical_learning]

front:
  title: 9 月已抓本语言重音规律
  hook: 听重音切词学母语

back:
  why_matters: |
    Saffran / Jusczyk 系列研究:9 月宝宝已经学到本语言的**重音模式**。
    英语:80% 词第一音节重读(BASEball / POPcorn / TAble)。
    法语 / 波兰语 / 韩语:重音模式不同。
    9 月美国宝宝**只爱听**符合英语重音的词,陌生重音模式被忽略。
    这是宝宝**切词**(从连续语流找词边界)的关键工具。
    机制:大脑统计学习 — 听得多的模式权重高,反之被过滤。
    更进一步:9 月宝宝还知道**哪些音节组合可能**:
    - 英语没"zb"组合(美国宝宝忽略 Zbigniew 这种词)
    - 波兰语有"zb"组合(波兰宝宝识别)
    含义:9 月宝宝已经在用统计学习抓母语规律 — 没人教,自动算。
    对中国家长意义:
    - 中文家长熟悉的"宝宝突然会说中文"= 9 月统计学习的产物
    - 中文虽无重音,但有声调 — 宝宝同样在抓声调统计模式
    - 多说中文(普通话 / 方言均可)→ 宝宝大脑切词更准
    - 双语家庭:多说外语 → 大脑分两套统计模型
  what_to_do:
    - 9 月起多说复杂句子(不只是单词)
    - 不只用儿童化简化语言("吃饭"OK,"饭饭饭饭"过度)
    - 双语家庭让宝宝听到完整外语句子
    - 不必焦虑"他听不懂"— 大脑在统计后台运行
  failure_mode: |
    "9 月宝宝只会咿呀,说啥都没用" — 错。统计学习全开。
    一直用过度简化的语言("饭饭")— 损失统计信息。
    双语家庭怕混乱不暴露外语 — 错过统计学习窗。
  evidence_level: B


card_id: C-S4-1050
stages: [S4]
tags: []

front:
  title: "反馈喂养看娃"
  hook: "饱不饱娃自己说话"

back:
  why_matters: |
    Responsive feeding(反馈喂养)WHO 立场延续到辅食期(6 月+):
    - 看娃饱腹信号(转头/闭嘴/吐出)→ 停
    - 看饥饿信号(伸手/张嘴/盯食物)→ 喂
    - 不强迫 / 不奖励 / 不威胁
    - 让娃决定吃多少(妈妈决定吃什么)— Ellyn Satter 'Division of Responsibility'
    中国通病:追着喂 / 看动画片喂 / 把'吃完一碗'当目标。
    WHO 立场:逼吃 → 损害自我饱腹调节 → 长期肥胖 / 挑食风险。
  what_to_do:
    - "看信号:饱了停(转头/闭嘴/吐)"
    - "饿了喂(伸手/张嘴)"
    - "不追着喂 / 不看动画片喂"
    - "妈妈选食物,娃决定吃多少"
    - "今天没吃完不强求,明天可能吃多"
  failure_mode: |
    追着喂 + 强迫'吃完才算' → 损害自我饱腹调节 → 长期肥胖 / 厌食 / 挑食。
    Division of responsibility:你管做,他管吃多少。
  evidence_level: A

  positions:
    issue: 喂养节律 — 反馈喂养(信号驱动)vs 3 小时定时
    views:
      - school: BFHI / WHO
        source: SRC-031
        stance: 看信号反馈喂(responsive feeding)— 婴儿饿了就喂,不计时间表。
      - school: AAP
        source: SRC-006
        stance: on demand 立场一致 — 新生儿不应严格定时,看信号优先。
      - school: 松田道雄
        source: SRC-024
        stance: 反产院'3 小时定时 + 用枕头支奶瓶'(C-S1-761),跟 BFHI 完全一致。
      - school: 中国传统产院
        stance: 3 小时定时喂奶仍普遍,部分爱婴医院实操参差;BFHI 中国 6,000+ 医院落地不一致。

card_id: C-S4-806
stages: [S4]
tags: [shonkoff, nrc, attachment_quality, parenting, china_high_freq]

front:
  title: "依恋质量看回应"
  hook: "看回应质量不看时间"

back:
  why_matters: |
    NRC 综述第 9 章引 De Wolff-Van IJzendoorn 1997 元分析 — 依恋质量决定因子:

    **不决定依恋质量的因素**(NRC 综述):
    1. 父母性别(爸 / 妈都行)
    2. 育儿时间总量(多陪 ≠ 安全依恋)
    3. 父母经济条件
    4. 家庭结构(单亲 / 双亲 / 三代同堂)

    **决定依恋质量的因素**:
    1. **母亲敏感度** — 读懂宝宝信号
    2. **偶联回应** — 准 / 快 / 适当
    3. **情感在场** — 陪着,且能调谐
    4. **互动同步** — 节奏匹配

    **关键意义**:
    - 妈每天 3 小时高质量陪伴 > 全职带 8 小时低敏感度
    - 老人带可达安全依恋 — 如果敏感度高
    - 单亲也能形成安全依恋 — 如果回应质量高
    - 双亲齐全也可不安全 — 如果都低敏感度

    **跟斯特恩"调谐" / 鲍尔比"内部工作模型" / 安斯沃斯敏感度量表一致**。

    **对中国家长**:
    - 全职妈不必内疚 — 关键看回应质量
    - 上班妈也别焦虑 — 高质量陪伴胜过低质量长时间
    - 老人带也能形成安全依恋 — 关键看老人怎么带
    - 量化问"我陪了多久" → 转质化"我读懂了宝宝吗"
  what_to_do:
    - 看回应质量不看时间
    - 多调谐少包办
    - 老人带也能形成安全依恋
    - 上班妈不必内疚
    - 重质不重量
  failure_mode: |
    "我全职带肯定安全" — 错,低敏感度 + 长时间 = 不安全。
    "上班妈对孩子心理伤害大" — 错,高质量短时间 > 低质量长时间。
    "老人不会带" — 不一定,关键看回应敏感度。
  evidence_level: A


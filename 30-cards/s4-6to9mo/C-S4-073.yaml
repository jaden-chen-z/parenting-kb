card_id: C-S4-073
stages: [S4]
tags: []

front:
  title: 主依恋人不必是亲生母亲
  hook: 收养/外婆带也能很安全

back:
  why_matters: |
    Bowlby 直接说:"亲生母亲之外的人可以胜任儿童的主要依恋对象的角色。"
    数据:Schaffer 苏格兰 58 位中 3 位的主依恋对象不是母亲(2 位选爸,1 位选祖母)。
    干达研究 27 位中也有几位选父亲或哥哥姐姐。
    Tizard & Hodges (1978):4 岁前被收养的孩子能跟养父母形成正常依恋。
    **关键不是血缘,是"以母性方式对待"**:
    - 跟孩子活跃社交互动
    - 迅速对孩子的信号和靠近做出反应
    - 这两点替代母亲也能完整做到
    家长意义:**职场妈妈 / 单亲家庭 / 收养家庭都能养出 B 安全型**。
  what_to_do:
    - 在职妈妈不必焦虑"奶奶/外婆带,我失去依恋"
    - 选定主照顾人后**保持稳定**(不频繁更换)
    - 主照顾人需要受过基本训练或天然有"读情绪"能力
    - 收养在 1-2 岁前,跟亲生母婴依恋差不多;4 岁后越来越难形成
  failure_mode: |
    "我不亲自带,他不会爱我" — 错误前提。质量比血缘重要。
    把主照顾人换来换去(月嫂月度更换 / 不同长辈轮班)→ 婴儿无法建立稳定主依恋。
  evidence_level: A


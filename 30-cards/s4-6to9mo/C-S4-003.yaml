front:
  title: 物体永久性 8-10 月,peekaboo 教
  hook: 分离焦虑的认知基础

back:
  why_matters: |
    物体永久性(object permanence)是 Piaget 认知发展核心 — 知道"看不见的物体仍存在"。
    8 月起萌芽(掀布找玩具),10 月坚信(继续找)。
    这也是分离焦虑(C-S5-004)的认知基础 — 知道你只是"暂时不见"才会担心(本来不知道你存在就不会想)。
    Peekaboo(躲猫猫)是教永久性的最佳游戏。
  what_to_do:
    - 8 月起玩 peekaboo(每天几次,可换花样)
    - 4 玩法:布盖头 / 抬腿挡脸 / 躲家具后 / 互相蒙巾
    - 一边玩一边喊"宝宝在哪?"
    - 10 月起藏玩具(部分露出)让他找
    - 不强求,看反应,玩开心了就停
  failure_mode: |
    觉得宝宝太小不玩 peekaboo → 错过认知发展窗口。
    10 月仍完全不找消失物(掀不掀都无反应)→ 找医生评估认知。
  evidence_level: A


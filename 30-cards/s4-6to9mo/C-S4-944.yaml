card_id: C-S4-944
stages: [S4]
tags: [eisenberg, sympathy_distress_distinction, lerner_v3]

front:
  title: "共情 vs 个人不安"
  hook: "他帮你不是为缓焦虑"

back:
  why_matters: |
    Eisenberg(Ch 11)关键区分 — sympathy(共情关心)≠ personal distress(个人不安)。
    共情 — 看到别人难过感受到他的难过(他人中心)。
    个人不安 — 看到别人难过自己也焦虑想逃避(自我中心)。
    数据 — 共情高的孩子更愿帮人,个人不安高的反而退缩。
    一句话 — 不是心软都是好事,要是他人中心的心软。
  what_to_do:
    - "他帮人时夸 X 难过你帮她"
    - "别说你这么乖好棒(自我中心)"
    - "看绘本聊角色感受不只情节"
    - "他逃避不安别强推他帮"
    - "你示范帮别人不是逃避自己情绪"
  failure_mode: |
    把自我中心的心软当共情夸,孩子学到的是别人难受我躲。
    Eisenberg — 区分对了才能培养真共情。
  evidence_level: B


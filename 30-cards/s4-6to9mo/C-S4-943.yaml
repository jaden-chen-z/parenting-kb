tags: [saarni, hoffman, empathy_origins, lerner_v3]

front:
  title: "Hoffman 共情 4 阶段"
  hook: "共情有 4 个长法"

back:
  why_matters: |
    Hoffman(via Ch 11 Eisenberg 综述)4 阶段共情发展:
    ① 0-1 岁:全身性共情(听别人哭自己也哭)② 1-2 岁:自我中心共情(给别人妈解决)
    ③ 2-3 岁:他人中心共情(知道别人想要不一样)④ 6+ 岁:系统性共情(可怜全班)。
    一句话 — 0-1 岁哭别人哭不是矫情,是共情起点。
  what_to_do:
    - "0-1 岁别我哭别人也哭制止"
    - "1-2 岁他给你饼干说妈饿,你接受"
    - "2-3 岁问他你觉得他怎么想"
    - "6 岁后讨论故事中弱势群体"
    - "每阶段顺其自然不跳级"
  failure_mode: |
    1-2 岁觉得"给妈饼干"奇怪不接受,共情萌芽被压。
    Hoffman — 错过 1-2 岁萌芽,3 岁的他人中心共情建不出。
  evidence_level: B


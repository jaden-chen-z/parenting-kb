card_id: C-S4-021
stages: [S4]
tags: []

front:
  title: 7-8 月陌生人警觉双高峰
  hook: 别让爷奶一上来就抱

back:
  why_matters: |
    7-8 月宝宝认知爆发的同时，开始能分辨"和爸妈相似但不一样"的脸——这就是陌生人焦虑。Brazelton 独特视角：这不是怕生坏脾气，是大脑分类能力上线的副产品。亲戚冲上来抱反而坐实创伤。
  what_to_do:
    - 提前告诉爷奶"先别抱"
    - 让陌生人在视线外停留 5-10 分钟
    - 等宝宝主动看 TA 再靠近
    - 由你抱着先过渡再交接
    - 离开时一定告别不要偷溜
  failure_mode: |
    长辈说"别惯坏，抱抱就好了"强行接手，宝宝大哭——这次哭过下次见到照样哭，因为他记住了"被陌生人夺走"的不安全感。
  evidence_level: B


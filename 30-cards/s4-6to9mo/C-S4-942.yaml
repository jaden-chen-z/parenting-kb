card_id: C-S4-942
stages: [S4]
tags: [kagan, stranger_anxiety, inhibited_externalize, lerner_v3]

front:
  title: "8 月怕生抑制型外显"
  hook: "陌生人来娃必哭闹"

back:
  why_matters: |
    Kagan(Ch 4)+ Bowlby 综述 — 6-9 月开始,所有娃都会有陌生人焦虑(健康发展信号),
    但抑制型娃外显特别强 — 哭闹更久,妈一离开就崩,陌生人靠近 1 米就退。
    这不是问题,是抑制型在 8 月起特别明显的窗口期。
    一句话 — 你抑制型娃 8 月起怕生加倍,这是健康不是退化。
  what_to_do:
    - "陌生人来给娃缓冲时间"
    - "先抱紧让他观察 5 分钟"
    - "陌生人不主动伸手"
    - "妈妈不离开娃视野"
    - "等娃自己伸手才允许互动"
  failure_mode: |
    觉得 8 月怕生是性格缺陷,强迫娃跟陌生人(亲戚)互动。
    Kagan — 抑制型 8 月期被强推,焦虑会持续到 1.5 岁。
  evidence_level: B


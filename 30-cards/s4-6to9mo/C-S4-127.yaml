card_id: C-S4-127
stages: [S4]
tags: [development_burst, controversy]

front:
  title: 6-8 月拒绝换尿布
  hook: 距离感知带来的失控感

back:
  why_matters: |
    WW26 + WW37(6-8.6 月)期间一个反复出现的"小烦恼":宝宝**突然狂烈抗拒换尿布 / 穿衣服**。
    多个妈妈日记:
    - "23 周开始,每次换尿布都哭"
    - "35 周给她穿衣服,她从早哭到晚"
    - "38 周给他套毛衣,简直要打仗"
    怎么回事:跃迁期间宝宝刚发现"距离 / 关系"的感知能力,**被强行约束在尿布台上**让她失去对距离的控制感,产生强烈抗议。
    不是身体不适,不是腰痛(很多妈妈担心),是**心理失控感**。
    这种抗拒在跃迁后期(尤其 35-37 周)达到高峰。
    家长意义:**这是 6-9 月最易被误判为"被宠坏 / 不听话"的行为之一**。
  what_to_do:
    - 换尿布给宝宝可以握的玩具(分散对约束感的注意)
    - 边换边说话 / 唱歌(让她感到没失联)
    - 让她在床上换(更宽阔)而不是尿布台
    - 跃迁完成后(几周后)抗拒会大幅减弱
    - 不必跟宝宝"较劲" — 越强迫她越激烈
  failure_mode: |
    "宝宝是不是腰疼" → 反复就医排查物理问题。
    "宝宝在跟我对着干" → 严厉训斥 → 宝宝更加抗拒。
    "她要是这样我就不给她换" → 尿疹风险增加。
  evidence_level: B


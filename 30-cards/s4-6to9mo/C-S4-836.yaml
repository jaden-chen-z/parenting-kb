card_id: C-S4-836
stages: [S4]
tags: [pikler, motor-发展, source-de]

front:
  title: "自坐 vs 撑坐怎么分"
  hook: "看他累不累就知道"

back:
  why_matters: |
    Pikler 1969 Ch2 给出关键鉴别 — 怎么判断婴儿在
    "自然学坐"还是"被撑姿":

    **健康自学坐**(ökonomisch / 经济的):
    - 直立 + 坐骨承重 + 脊椎自然弧
    - 像 Ausruhen(休息)— 不累不费力
    - 婴儿在坐时不停换姿势:跪 / 单腿伸 / 两腿伸前 /
      单脚踩两脚踩 / 两脚之间坐等
    - 累了自己躺下休息再起

    **撑姿坐**(unrichtig / 错误的):
    - 弯背 / 收紧 / 紧绷 / 努力维持
    - 像 anstrengend(费力)— 累
    - 姿势不变 — 只能维持那一种
    - 不能自己躺下 — 等大人放

    Pikler 立场:鉴别看孩子状态。如果坐着像"在做练习",
    那就是被撑。如果坐着像"在休息 + 玩玩具",那就是真会。

    这是 Magda 的 self-confident baby(SRC-021/022)和
    Lansbury "competent"(SRC-019)立场的德文鉴别根源。

  what_to_do:
    - 看脸 — 紧绷 / 努力 = 撑坐(放下来)
    - 看姿势 — 一动不动 = 撑坐(不自然)
    - 看持续 — 不能换姿势 = 撑坐
    - 看休息 — 不能自己躺 = 撑坐
    - 真自学坐的 — 几秒 + 摇摇晃晃但放松

  failure_mode: |
    "宝宝坐着挺好的看不出累" → Pikler 反:大人观察需要训练。婴儿不会说累,但表情 + 肌肉紧绷度看得出。
    安全做法:6-9 月默认全部仰卧 + 趴爬,直到 9 月后看到他自己起身坐再"承认会坐"。

  evidence_level: B

  positions:
    issue: 大动作发展该不该训练 · 学步车 / Bumbo / 撑坐 / 训练表是否有用
    views:
      - school: Pikler
        source: SRC-026
        stance: 完全反对训练 — 自然顺序 + 安全空间 + 时间 = 大动作全部自动发生;严反一切撑物(学步车 / Bumbo / 跳跳器 / 婴儿座椅)。
      - school: Magda Gerber / RIE / Lansbury
        source: SRC-022/019
        stance: 继承 Pikler 立场 — 里程碑不是赛跑,不撑坐 8 理由,7 类婴儿设备先放下。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 立场一致 — floor bed + 自由动作空间 + 反早期撑坐。
      - school: AAP
        source: SRC-002
        stance: 反学步车(Policy Statement + 数百起伤亡报道);加拿大 2004 立法全球首例禁售。
      - school: Brazelton
        source: SRC-010
        stance: 反学步车,跟 Pikler 立场一致;主张孩子自然探索大动作。
      - school: 松田道雄
        source: SRC-024
        stance: 温和支持自然 — 不催孩子翻 / 坐 / 爬 / 走的时间表,部分跟 Pikler 共鸣。
      - school: 鲍秀兰
        source: SRC-009
        stance: 支持训练 — 婴儿体操 / 抓握训练 / 撑坐;跟 Pikler 派 8 派立场严重对立。
      - school: 中国主流
        stance: '"4 月翻 / 6 月坐 / 9 月爬 / 12 月走" 训练表 + 80% 家庭曾用学步车。跟 Pikler 派全面对立。'

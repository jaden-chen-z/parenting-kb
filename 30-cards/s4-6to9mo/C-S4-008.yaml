front:
  title: 7-8 月爬行训练 = 多重发展
  hook: 不只腿,是认知 + 社交

back:
  why_matters: |
    爬行 = 8 月运动里程碑,不只大动作,更是深度知觉 + 思维 + 社交全面发展。
    爬后可主动探索环境,克服距离障碍接近兴趣的人和物。
    爬行后与母亲距离增加,学会用表情声音姿态远距离求情感 → 社交能力质变。
    缺乏爬行 → 学龄期反应迟钝、动作笨拙。
  what_to_do:
    - 准备安全爬行区,地上铺垫子
    - 用宝宝感兴趣的玩具引诱前进
    - 不要"怕脏怕危险"总让宝宝坐着
    - 让宝宝爬行后主动探索家里安全角落
    - 爬行时父母在旁观察 + 鼓励
  failure_mode: |
    "宝宝坐着安静别动"→ 错过爬行黄金期,长大后笨拙。
    地上铺塑料袋等危险物 → 误食 / 缠绕风险。
  evidence_level: B


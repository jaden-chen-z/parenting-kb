card_id: C-S4-016
stages: [S4]
tags: [philosophy]

front:
  title: 8 月前抱抱不会宠坏
  hook: 焦虑型 vs 安全型依恋决定

back:
  why_matters: |
    依恋研究证明:8 月前忽视宝宝哭/信号 → 焦虑型依恋(缺乏同情心、社会成熟晚、学习能力差)。
    及时回应 → 安全型依恋(独立性强、社会性好、智力正常发展)。
    鲍秀兰直接反驳"克制不抱怕宠坏"立场:8 月前宝宝需要抱时,父母应去抱抱他 — 这是安全型依恋的物质基础。
    Bowlby/Ainsworth 依恋理论中文家长版本。
  what_to_do:
    - 8 月前宝宝要抱就抱,不"训练"自我安抚
    - 哭声 / 表情 / 发声 / 动作信号都要回应
    - 关注宝宝生活节律 + 脾气变化
    - 不论高兴或烦恼,大人都要作出反应
    - 全家选充满爱心、反应灵活的看护人
  failure_mode: |
    "怕养成好抱习惯"克制不理 → 焦虑型依恋,终身影响。
    完全溺爱无原则 → 错过 6 月起的"引导独立"过渡。
  evidence_level: A


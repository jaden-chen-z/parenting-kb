front:
  title: "9 月起会看你眼"
  hook: "新东西先偷瞄你脸"

back:
  why_matters: |
    Thompson(Ch 2)综述 — 8-10 月 social referencing(社会指引)正式上线。
    见到陌生人或新东西,婴儿先扭头看妈表情 — 妈惊就怕,妈笑就探索。
    这是 joint attention(共同关注)成熟的标志,也是文化学习的起点。
    一句话 — 你脸上的紧张写在他世界观里,你怕啥他怕啥。
  what_to_do:
    - "陌生人来了你先轻松微笑"
    - "新食物你先吃给他看"
    - "怕的事自己情绪稳点"
    - "妈奶奶面对面别一个紧张"
    - "Tronick still-face 别玩超 30 秒"
  failure_mode: |
    妈紧张奶奶轻松对孩子比"怕陌生人"更糟 — 他不知道信谁。
    一致比绝对镇定重要。
  evidence_level: B


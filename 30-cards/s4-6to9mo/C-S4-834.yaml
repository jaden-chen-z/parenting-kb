card_id: C-S4-834
stages: [S4]
tags: [pikler, motor-发展, anti-propping, source-de, controversy]

front:
  title: "Pikler 反撑坐 6 论证"
  hook: "8 理由的德文源头"

back:
  why_matters: |
    Pikler 1969 Ch2 Sitzen 段反对撑坐 6 大论证(原版,
    Lansbury 2014 Ch7 改写扩到 8 理由 — SRC-019 C-S2-290):

    1. **解剖错位**:撑坐让重心落在 Kreuzbeingegend(骶骨)
       而不是坐骨,身体被迫前弯防止后倒 — 错误坐姿
    2. **不省力**:健康自学坐姿是 ökonomisch(经济的)
       — 直立省力,坐着像休息;撑坐是费力 / 紧绷
    3. **被困**:撑坐婴儿无法转身 / 不能动腿 / 玩具掉了够不到 — 被动等大人(自我效能感低)
    4. **跳过过渡**:坐之前必经跪 / 半坐 / 单脚跨等多种姿势探索 — 撑坐跳过这些
    5. **打断爬**:撑坐养成习惯,孩子不愿趴爬(因为坐看视野"更高")— 大动作发展卡住
    6. **自我效能损失**:Pikler 立场 — 婴儿自己学会的动作才让他建立"我能"感,被撑姿是被动经历跟 Lansbury 8 理由(SRC-019 C-S2-290)是源头 / 复述关系。
    本卷给 Pikler 1969 德文原始论证,Lansbury 是英文改写。

  what_to_do:
    - 6-9 月不撑坐 — 不用 Bumbo / 婴儿座椅 / 沙发摆姿
    - 不放枕头围着"让宝宝坐"
    - 不抱大腿上"让他坐"
    - 让宝宝自己从趴 / 跪 / 单脚跨中过渡到坐
    - 拍下来 — 第一次自坐起来很短暂(几秒)但宝贵

  failure_mode: |
    "宝宝爱被撑着坐玩玩具" → Pikler 反:"爱"是被困的适应。撑姿婴儿玩玩具不专注 — 必须先维持坐才能玩 — 大脑分散在两件事 → 玩得反而不深入。

  evidence_level: B

  positions:
    issue: 大动作发展该不该训练 · 学步车 / Bumbo / 撑坐 / 训练表是否有用
    views:
      - school: Pikler
        source: SRC-026
        stance: 完全反对训练 — 自然顺序 + 安全空间 + 时间 = 大动作全部自动发生;严反一切撑物(学步车 / Bumbo / 跳跳器 / 婴儿座椅)。
      - school: Magda Gerber / RIE / Lansbury
        source: SRC-022/019
        stance: 继承 Pikler 立场 — 里程碑不是赛跑,不撑坐 8 理由,7 类婴儿设备先放下。
      - school: 蒙氏(Davies/Lillard)
        source: SRC-014/016
        stance: 立场一致 — floor bed + 自由动作空间 + 反早期撑坐。
      - school: AAP
        source: SRC-002
        stance: 反学步车(Policy Statement + 数百起伤亡报道);加拿大 2004 立法全球首例禁售。
      - school: Brazelton
        source: SRC-010
        stance: 反学步车,跟 Pikler 立场一致;主张孩子自然探索大动作。
      - school: 松田道雄
        source: SRC-024
        stance: 温和支持自然 — 不催孩子翻 / 坐 / 爬 / 走的时间表,部分跟 Pikler 共鸣。
      - school: 鲍秀兰
        source: SRC-009
        stance: 支持训练 — 婴儿体操 / 抓握训练 / 撑坐;跟 Pikler 派 8 派立场严重对立。
      - school: 中国主流
        stance: '"4 月翻 / 6 月坐 / 9 月爬 / 12 月走" 训练表 + 80% 家庭曾用学步车。跟 Pikler 派全面对立。'

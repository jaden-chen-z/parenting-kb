card_id: C-S4-553
stages: [S4]
tags: [night-feeding, co-sleeping, anti-western-norm]

front:
  title: 夜喂奶不必焦虑
  hook: 反"半年必停"焦虑

back:
  why_matters: |
    松田反"夜间喂奶绝对不能超过半年"报道 — 让妈内疚是不必要的。
    辅食发达的今天,营养不会有问题,要思考娃为啥夜醒。
    可能原因:小床碰栏、白天活动少、运动不足、睡前奶不够。
    "陪睡阻碍自立"是西洋说 — 7 月娃肌肤接触还很必要。
  what_to_do:
    - 夜醒先查环境(床大小/温湿度)
    - 白天多带户外活动 30+ 分
    - 睡前奶喂足
    - 母乳妈陪睡夜喂 — 大人轻松
    - 娃睡着后轻轻让离乳房
  failure_mode: |
    妈强行"7 月断夜奶" → 娃哭爹妈精神崩 + 夜间饥饿 + 信任受损,后续哄睡更难。
  evidence_level: B


card_id: C-S4-298
stages: [S4]
tags: [autonomy, philosophy, RIE, lansbury]

front:
  title: "宝宝是依赖但不是无能"
  hook: "依赖不等于无能为力"

back:
  why_matters: |
    Lansbury Ch11 + Ch15 反复强调的关键区分:
    Magda Gerber 的命名:
    - dependent(依赖)= 真,宝宝需要照顾
    - helpless(无助)= 错,宝宝是 capable self-learner
    主流(包括 Sears 派)把宝宝当 helpless → 全程抱 + 全程逗。
    RIE 把宝宝当 capable + dependent → 给空间 + 信任能力。
    这一字之差,是整个育儿哲学的分水岭。

  what_to_do:
    - 看宝宝挣扎,先信任他能,再决定是否帮
    - 给"空间 + 信任"作为根基
    - 不预设"宝宝什么都不会"
    - 看到自主玩 = 开心(不是"他不需要我")
    - 跟宝宝建立平等的"两个人"关系

  failure_mode: |
    "宝宝那么小什么都不会" → 自我实现的预言,他真变 helpless。
    或反向:"信任宝宝能 = 不需要照顾" → 误解 RIE,
    依赖照顾跟无能完全两回事。

  evidence_level: B


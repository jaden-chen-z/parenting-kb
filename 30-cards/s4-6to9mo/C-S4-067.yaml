card_id: C-S4-067
stages: [S4]
tags: [philosophy, controversy]

front:
  title: 6-12 月是依恋形成关键期
  hook: 错过修补难度大增

back:
  why_matters: |
    Bowlby 综合 Schaffer 等多项研究得出**依恋发展敏感期**:
    - 6 月前:依恋形成的"敏感性"开始上升
    - 6-12 月:关键期,大部分婴儿在这期间形成与主依恋人的"有区分依恋"
    - 12 月后:仍可形成,但每过几个月难度就增加
    - 2 岁后:首次形成依恋已显著困难(从未依恋过的孩子不会被治愈)
    Tizard & Hodges (1978):51 个机构出生孩子,4 岁前被收养的能正常依恋,4 岁后收养的有一半无法形成正常依恋。
    家长意义:6-12 月**不要长期分离主依恋人**(>3-4 周)。
  what_to_do:
    - 6-12 月避免长时间(>1 月)主依恋人不在场
    - 此期间出差 / 工作 / 异地等优先安排妈妈在
    - 实在无法,让"次要依恋人"替代(爸爸 / 祖辈)— 而不是月嫂月度更换
    - 长期机构 / 寄养有重大风险 — 要紧急安排稳定主依恋人
  failure_mode: |
    "宝宝才几月大,谁带都一样" — 错过 6-12 月窗口,形成困难且不彻底。
    频繁更换月嫂 / 阿姨 → 婴儿无法建立稳定主依恋人。
  evidence_level: B


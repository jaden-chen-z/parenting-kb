front:
  title: 安全依恋的 4 个关键
  hook: Ainsworth 总结的母亲行为

back:
  why_matters: |
    Ainsworth 巴尔迪摩 23 对母婴一年纵向研究 + 实验室验证,**12 月安全依恋的 4 项母亲行为指标**:
    1. **频繁持久的身体接触**(尤其前 6 月,以及"通过抱安抚"的能力)
    2. **对婴儿信号的敏感度**(读懂哭/笑/动作 + 按宝宝节律选择干预时间)
    3. **可预测的环境**(婴儿感到自己行为有效果)
    4. **共享愉悦**(母婴双方都享受相处)
    Yarrow (1963) 数据相关系数都 ≥0.50。
    家长意义:这 4 项就是**让宝宝长大成 B 安全型的"配方"**,不是玄学。
  what_to_do:
    - 多抱(不限次数 / 不限时长)
    - 读懂宝宝信号 — 哭代表什么? 笑要什么? 不读心思,看行为
    - 及时回应(重要!不是每次都满足要求,但要回应)
    - 互动节律配合宝宝(他兴奋时玩,他疲倦时停)
    - 享受相处(假装快乐没用,真喜欢宝宝才有效)
  failure_mode: |
    照本宣科执行 4 项 → 其实第 4 项(共享愉悦)才是灵魂,装不出来。
    妈妈产后抑郁导致 4 项都低 → 高焦虑/回避型依恋风险增大,需要专业帮助。
  evidence_level: A


front:
  title: BLW vs 泥糊:AAP 不偏,可结合
  hook: 都行,看你家宝宝

back:
  why_matters: |
    BLW(Baby-Led Weaning)= 6 月起让宝宝自喂 finger food,跳过传统泥糊阶段。
    英国注册护士 Gill Rapley 2008 提出,后在国际接受度上升;国内一线城市采纳率上升。
    传统勺喂泥糊 vs BLW 各有优劣:
    - BLW 优势:自我饱腹调节(防过喂)+ 多种 textures + 训练抓握自主
    - BLW 劣势:营养间隙 + choking 风险高
    AAP 立场:"families can combine BLW with spoon-feeding without guilt." 不偏不倚。
    母乳/配方奶继续填(BLW 不是替代,是补充)。
  what_to_do:
    - 不必非选一种 — BLW + spoon-feed 可结合
    - BLW:6 月起,坐高椅,长条 finger food
    - 泥糊:更易控量 + 引入新食物 + 含铁强化米粉
    - 母乳/配方奶继续填(BLW 营养可能不足)
    - 早产 / 坐不稳 / 嚼吞困难 → 推迟 BLW
  failure_mode: |
    强行 BLW 但宝宝没 readiness → 营养不够 + 烦躁。
    完全 spoon-fed 到 1 岁 → 错过 finger food 训练抓握。
  evidence_level: A


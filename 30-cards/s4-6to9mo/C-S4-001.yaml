front:
  title: BLW vs 泥糊:AAP 不偏,可结合
  hook: 都行,看你家宝宝

back:
  why_matters: |
    BLW(Baby-Led Weaning,婴儿主导添加辅食)= 6 月起让宝宝坐高椅、自己抓长条手指食物,
    跳过传统勺喂泥糊阶段。英国健康访问员 Gill Rapley 2008 年提出,后国际接受度上升;
    国内一线城市采纳率上升。

    传统勺喂泥糊 vs BLW 各有优劣:
    - BLW 优势:自我饱腹调节(防过喂)+ 接触多种质地 + 训练抓握和自主
    - BLW 劣势:头几月营养可能间隙 + 窒息风险需控

    AAP 立场原文:"families can combine BLW with spoon-feeding without guilt."
    白话翻译:可以结合 BLW + 勺喂,不必有罪恶感。AAP 不偏一种。

    母乳 / 配方奶继续供主要营养(BLW 不是替代,是补充)。
  what_to_do:
    - 不必二选一,BLW 跟勺喂可以结合
    - 试 BLW:6 月起、能稳坐、坐高椅、给长条手指食物
    - 试勺喂:更易控量 + 方便引入新食物 + 优先含铁强化米粉
    - 母乳 / 配方奶继续给(头几月 BLW 营养可能不足)
    - 早产 / 坐不稳 / 嚼吞困难的宝宝 → 推迟 BLW
  failure_mode: |
    强行 BLW 但宝宝还没准备好(不能稳坐 / 没抓握)→ 营养不够 + 烦躁。
    完全勺喂到 1 岁,从不给手指食物 → 错过训练抓握和自主吃饭的机会。
  evidence_level: A


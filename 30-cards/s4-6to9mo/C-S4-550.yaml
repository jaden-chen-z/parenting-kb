card_id: C-S4-550
stages: [S4]
tags: [weaning, individual-difference, anti-recipe]

front:
  title: 断奶量因孩子异
  hook: 断奶食谱别死板照抄

back:
  why_matters: |
    松田说:7 月断奶喜好就出来了 — 喜欢粥的、不喜欢的,差很大。
    1 次 100 g 每天 2 次粥,妈骄傲;1 次 50 g 妈懊悔。其实不必。
    喜欢吃菜的、喜欢吃鱼的,各有偏好。
    给娃辅食必须因孩子而异,不是按食谱量化指标。
  what_to_do:
    - 看娃喜好走,不强加食谱量
    - 一周记 1 次娃实际吃了什么
    - 接受 50 g 粥也正常
    - 喜欢菜就多菜,喜欢鱼就多鱼
    - 别比邻居娃饭量
  failure_mode: |
    妈每天严控"100 g粥+蛋黄+菜泥",娃不爱吃就追喂 → 餐桌战争 → 后续厌食。
  evidence_level: B


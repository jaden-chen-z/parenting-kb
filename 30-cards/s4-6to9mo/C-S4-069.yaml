front:
  title: 6-9 月真依恋形成
  hook: 跟随、迎接、把妈当基地

back:
  why_matters: |
    Bowlby 4 阶段依恋发展时间表的**第三阶段**(~6/7 月-2/3 年):**通过定向和信号,让特定对象一直在旁边**。
    特点:
    - 母亲离开会**跟随**(会爬之后)
    - 母亲回来会**迎接**(笑、伸手、爬过去)
    - 把母亲当**安全基地**:出去探索 → 累/怕回来 → 充电后再去
    - 对陌生人**警觉退缩**(8 月起)
    - 次要依恋人也开始形成(爸爸 / 祖辈)
    这是**真依恋**的第一次完整出现 — 之前都是萌芽。
  what_to_do:
    - 6-9 月预期看到 4 项行为同时出现:跟随 / 迎接 / 安全基地 / 陌生人警觉
    - 缺任意一项可能依恋形成不完整(咨询儿保医生)
    - 让宝宝主动从你身边出发探索,**不追**
    - 离开短时(如上厕所)说一声,回来后温暖回应
    - 6-9 月主依恋人不长期分离(>4 周)
  failure_mode: |
    9 月仍无 4 项行为 → 可能依恋形成迟滞,需评估。
    "宝宝为啥总跟着我" — 这是健康,不是黏人。
  evidence_level: B


card_id: C-S4-295
stages: [S4]
tags: [motor-发展, RIE, lansbury]

front:
  title: "宝宝挣扎时:先等再说"
  hook: "鼓励胜过替他做完"

back:
  why_matters: |
    Lansbury Ch12 magic word "wait":
    宝宝努力翻 / 爬 / 拿不到玩具时,大人本能想立即帮。
    Lansbury 说先 wait 几秒:
    - 等他自己尝试
    - 用语言鼓励:"你在努力翻"
    - 如果挫折 → 抱起换姿势(给休息),
      不要直接"翻好"(剥夺成就感)。
    引 Piaget:你教他一次,就永远夺走他自己发现的机会。

  what_to_do:
    - 翻不过去 = 等 30 秒再判断要不要帮
    - 拿不到玩具 = 不主动递,等他自己想办法
    - 鼓励:"你试得很努力"
    - 真要帮 = 抱起休息 ≠ 直接代劳
    - 完成那一刻,他自己是英雄

  failure_mode: |
    "他在挣扎我不帮太残忍" → 实际是剥夺学习机会。
    或反向:从不帮 / 看着他大哭 → 那是忽视。
    Lansbury 区分:鼓励陪伴 + 不代劳 vs 不闻不问。

  evidence_level: B


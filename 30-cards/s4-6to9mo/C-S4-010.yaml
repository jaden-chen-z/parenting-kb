front:
  title: 7-8 月触额碰头游戏
  hook: 加名字 + 动作 = 反应

back:
  why_matters: |
    "碰碰头"游戏 = 用宝宝额头轻触家长额头,边触边喊宝宝名字,练习宝宝对名字的反应 + 身体部位认知 + 亲子游戏快乐。
    鲍秀兰具体描述:扶宝宝腋下,用自己额部轻触宝宝额部,亲切呼唤名字"亮亮,碰碰头"。重复几次后,你说"碰碰头",他会主动把头凑过来露笑容。
    这是早期共同注意 + 命名响应的经典训练。
  what_to_do:
    - 扶宝宝腋下,面对面
    - 用自己额头轻触宝宝额头
    - 同时喊名字 + "碰碰头"
    - 反复几次,看宝宝是否主动凑头
    - 露出愉快笑容时表扬强化
  failure_mode: |
    动作太用力 → 撞痛宝宝反伤兴趣。
    不喊名字只做动作 → 错过名字反应训练。
  evidence_level: C


front:
  title: "6-8 月日 2-3 餐"
  hook: "餐数随月龄递上去"

back:
  why_matters: |
    WHO 月龄餐数标准:
    - 6-8 月:辅食日 2-3 餐
    - 9-11 月:辅食日 3-4 餐
    - 12-23 月:辅食日 3-4 餐 + 1-2 加餐母乳/配方仍按需(6-12 月 4-6 次/天,12-24 月 3-4 次/天)。
    总能量 = 母乳 + 辅食。WHO 6-12 月辅食供 ~50% 能量,12-24 月 ~67%。
    中国传统'1 岁前不要吃太多怕积食' → 跟 WHO 立场对立,反而辅食量不足。
  what_to_do:
    - "6-8 月:每天 2-3 餐辅食(每餐 2-3 勺起)"
    - "9-11 月:每天 3-4 餐辅食"
    - "12 月+:3-4 餐 + 1-2 加餐"
    - "母乳/配方继续 — 加辅食不替代"
    - "辅食量按娃信号(饱了停)"
  failure_mode: |
    怕积食给太少辅食 → 6 月后能量缺口 → 生长曲线掉。
    WHO 量是有依据 — 该吃就吃。
  evidence_level: A


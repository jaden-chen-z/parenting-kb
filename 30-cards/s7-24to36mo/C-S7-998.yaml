front:
  title: "2-3 岁教情绪应对"
  hook: "情绪有出口才不爆"

back:
  why_matters: |
    Saarni(Ch 5)综述 — 2-3 岁要主动教 4 类情绪应对策略:
    ① 转移(画画/玩水)② 求助(叫妈)③ 用语言(我生气了)④ 体感平静(深呼吸/抱布偶)。
    没策略的孩子只会爆,有策略的能选。一句话 — 4 类策略要明示给他,他不会自己想。
  what_to_do:
    - "他生气教深呼吸(吹生日蜡烛)"
    - "教用词:我生气因 X"
    - "提供安全角(回到这里平静)"
    - "夸具体应对(你今天会用词)"
    - "你也用策略示范(妈生气先深呼吸)"
  failure_mode: |
    觉得 2-3 岁会自己长出应对策略,只等他长大就好了。
    Saarni — 不教不会,2-3 岁不教,5 岁更难教。
  evidence_level: B


card_id: C-S7-129
stages: [S7]
tags: [cognitive_science, theory_of_mind, milestone]

front:
  title: 4 岁前不懂"别人会误信"
  hook: 虚假信念是 ToM 顶峰

back:
  why_matters: |
    虚假信念测试 = 心智理论(ToM)发展终极里程,4-5 岁通过。

    经典 Wimmer & Perner 1983 Sally-Anne 测试:
    - Sally 把球放盒子,出门
    - Anne 偷偷把球移到篮子
    - Sally 回来 — 问宝宝:"她会去哪找球?"
    - **3 岁宝宝答"篮子"**(自己知道球在哪 = 别人也知道)
    - **4-5 岁答"盒子"**(理解 Sally 是错信)

    高普尼克在第 5 章引用的另一版(糖果盒测试):
    - 给 3-5 岁宝宝看糖果盒,打开发现里面是铅笔
    - 问:"妈妈走进来,会以为里面是什么?"
    - 3 岁答"铅笔"(以为别人知道她知道的)
    - 4-5 岁答"糖果"(理解妈妈被骗了)

    意义:**4 岁是心智理论完全建立的分水岭** — 真正"换位思考"的开始。
    自闭症儿童在这测试上显著落后(Baron-Cohen 1985 经典发现)。

    对中国家长意义:
    - 3 岁前别期待孩子"换位思考"或"理解你心情" — 大脑没发育完
    - "他怎么这么自私" — 4 岁前不是道德问题,是心智理论没成熟
    - 培养共情靠**示范** + **命名情绪**,不靠"教育" / "讲道理"
    - 4-5 岁后可逐步引入"妈妈伤心了,因为 X"等情境理解
  what_to_do:
    - 3 岁前不强求"换位思考"
    - 命名情绪("妈妈累了" / "弟弟疼")
    - 4 岁后可玩 Sally-Anne 类问答游戏
    - 18 月不会指物 / 不跟眼神 — 找儿保医生筛查自闭症
  failure_mode: |
    "3 岁了还不懂事" — 错。心智理论 4-5 岁才完全建立。
    强迫"道歉" / "理解别人" — 3 岁前做不到,徒增挫败。
    "他装的,故意不懂事" — 错。大脑窗口没到。
  evidence_level: A


front:
  title: "Dunn 兄弟 5 维度"
  hook: "二胎吵是发展机会"

back:
  why_matters: |
    Dunn(via Ch 8 Parke 综述)— 兄弟姐妹关系 5 维度:
    ① 温暖 ② 冲突 ③ 竞争 ④ 协助 ⑤ 影响。
    冲突不是病 — 是练情绪管理 + 谈判 + 共情的天然实验室。
    数据 — 适度冲突的兄弟关系孩子社交能力强于独生 / 完全没冲突。
    一句话 — 二胎吵架别都按住,适度冲突是发展机会。
  what_to_do:
    - "不强行大让小"
    - "冲突 90% 让娃自己解决"
    - "只在肢体伤害时干预"
    - "关注双方感受不护一方"
    - "鼓励合作活动(一起搭积木)"
  failure_mode: |
    完全压制冲突 — 大让小 → 大委屈,小蛮横,双方都受伤。
    Dunn — 适度冲突 + 父母不护偏才发展健康。
  evidence_level: B


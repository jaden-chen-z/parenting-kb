card_id: C-S7-754
stages: [S7]
tags: [autonomy, self_care, japan, matsuda]

front:
  title: "2 岁让娃自己穿衣"
  hook: "等 5 分钟比 1 分代劳"

back:
  why_matters: |
    松田 给"为什么孩子不会自己做"妈妈核心反思:
    1. 孩子不会自己做不是能力问题, **是大人没让他做**;
    2. 妈妈做事麻利等不得 → 直接帮脱;
    3. 妈妈嫌穿不整齐 → 重新穿一次;
    4. 跟爷爷奶奶住更严重;
    5. 喜欢清洁的妈妈 — 怕弄脏直接喂;
    6. **父母大胆旁观 + 忍耐**才能培养自立;
    7. 2-3 岁孩子能做的:用勺 + 拿筷子(笨拙) + 解扣后脱衣 + 脱袜
       + 穿鞋 + 自己洗脸 + 涂香皂 + 男孩夏季独自小便。
    跟蒙氏"勿替他做"+ Brazelton "2 岁三件大事:假装 / 认同 / 模仿"一致。

  what_to_do:
    - 等 5 分钟让娃自己穿
    - 不嫌穿不整齐
    - 弄脏就弄脏 — 不是失败
    - 解扣交他, 套头袜让他脱
    - 不替奶奶 / 老人代劳辩解

  failure_mode: |
    "我做更快" 派:每天替穿 + 替吃 + 替洗 → 孩子 4 岁还不会自理 → 入园老师反馈"不独立"。
    "弄脏不行"派:嫌饭洒 → 强夺勺 → 孩子失去主动性。
    奶奶帮派:看不下去娃笨手笨脚 → 替做 → 孩子学会"等奶奶"。
    替代:把"代劳是爱"翻成"代劳是阻碍"。

  evidence_level: B


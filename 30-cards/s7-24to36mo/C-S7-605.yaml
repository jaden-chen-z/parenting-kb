card_id: C-S7-605
stages: [S7]
tags: [literacy, anti-early-reading, story-time]

front:
  title: 教字 vs 听故事不同
  hook: 早识字不等于一生优势

back:
  why_matters: |
    松田直击中国家长高频痛点:能记住字 ≠ 爱听讲故事,是两回事。
    硬教娃认字 → 让娃喜欢看书 = 错的。
    "早识字孩子一生有优势"是无依据。
    特别喜欢听故事的孩子,3 岁能自己认字 — 是娃问字时教,不是家长硬塞。
  what_to_do:
    - 多讲故事不抢着教字
    - 娃问字时再教
    - 用画册不用识字卡
    - 看不感兴趣的娃也别强求
    - 选丰富画+生动文字的画册
  failure_mode: |
    妈"识字早开窍" → 闪卡训练 → 娃厌学 + 后续小学反不爱读书。
  evidence_level: B


front:
  title: 25-30 月教合作玩
  hook: 平行游戏 → 真正合作

back:
  why_matters: |
    25-30 月之前,宝宝即使一起玩**也是平行游戏**(各玩各的,互不干扰)。
    25-30 月起可教**真正合作玩** — 鲍秀兰具体例子:**两人一起搭一个东西**,或**把一个东西放在对方的盒里**。
    合作玩培养**相互合作意识** + 共同完成任务的快乐 + 分享成就 — 是 3-5 岁同伴友谊基础。
  what_to_do:
    - 同伴间提议"一起搭高楼"
    - 一人放积木下面,另一人放上面
    - 教轮流玩(我一次,你一次)
    - 共同完成任务后赞扬"配合好"
    - 鼓励解决冲突,不直接干预
  failure_mode: |
    强求"必须合作"→ 反伤主动玩兴趣。
    宝宝不会合作就一直平行玩 → 错过合作意识培养。
  evidence_level: C


card_id: C-S7-035
stages: [S6, S7]
tags: [coping_strategy, controversy]

front:
  title: 别偷偷溜要正面告别
  hook: 偷溜 = 信任崩塌

back:
  why_matters: |
    中国家长很常见做法:为了"省得孩子哭",趁他玩着或睡着时悄悄走 / 由别人抱开。
    Bowlby Vol 2 数据明确反对这做法。理由 3 条:
    1. 孩子下次会**警惕到无法专注玩**(总怕妈妈又消失)
    2. **信任根基损伤** — 妈妈"会突然消失"成为内部工作模型的一部分(C-S6-069)
    3. 实证里"偷溜组"分离焦虑持续期**显著长于"正面告别组"**
    Robertson 实验对照里发现:即便最容易难过的小哭一阵,正面告别让孩子知道:
    "妈妈走但说了再见 → 妈妈是可预测的 → 我可以信任。"
    家长大坑:把"不哭"当首要目标,牺牲了"信任"这个长期资产。
  what_to_do:
    - 走前明确说"妈妈要去X,Y 时间回来"
    - 给一个具体的回家锚点(吃饭 / 睡觉前)
    - 哭就让他哭,不延长不缩短
    - 哭着告别 ≠ 错;不告别 = 错
    - 回家后立刻陪伴 + 兑现承诺
  failure_mode: |
    "他哭得撕心裂肺我心疼,趁他不注意溜了" — 心疼的是你自己,不是他;他要承担"妈妈消失"的恐惧。
    "正面告别他闹得更凶" — 短期闹更凶,长期信任更稳;这是一笔值得做的交换。
  evidence_level: B


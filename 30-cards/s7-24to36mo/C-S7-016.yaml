card_id: C-S7-016
stages: [S7]
tags: [philosophy]

front:
  title: "2 岁三件大事:假装/认同/模仿"
  hook: 男孩走路像爸,女孩说话像妈

back:
  why_matters: |
    Brazelton 在 2 岁体检时,通过观察玩耍**几分钟**就能评估孩子的整个发展:1. **假装游戏 (Symbolic / Fantasy Play)**:孩子用积木搭"房间",放进女孩娃娃,带男孩娃娃过来"敲门—进来—拥抱"。这显示:认知能力 + 情感自由 + 记忆能力 + 因果理解(开门→进入)+ 精细动作规划。Brazelton 警告:**紧张 / 不快乐的孩子,fantasy play 会单薄、重复、或缺失**。2. **性别认同 (Gender Identification)**:2 岁开始,男孩走路像爸爸,女孩说话像妈妈。这是同性父母强大模仿力的体现,也是孩子早期自我意识中性别意识的萌发。3. **模仿驱动 (Imitation)**:孩子开始**对一切模仿**:穿父母衣服、用父母手势、复述对话。这种渴望模仿的能力是马上要来的"如厕训练"和其他 self-care 技能的基础。临床判断窗口:Brazelton 用 2 岁玩耍**判断神经发育**(注意力 / 处理 / 感觉敏感性 / 动作精细度)— 这比身高体重曲线信息量大得多。
  what_to_do:
    - 提供假装游戏道具:娃娃 / 积木 / 玩具厨房 / 玩具医生工具
    - 加入孩子的假装游戏,但不主导(让他做导演)
    - 同性父母可以"同步行动":爸爸刮胡子时让小男孩也"刮"(用没刀片的)
    - 异性父母也别错过:让女儿模仿爸爸用工具
    - 观察孩子是否能**专注玩 5-10 分钟**而不被声音 / 视觉打断 → 注意力评估
  failure_mode: |
    觉得"假装是骗人 / 不真实"压制孩子 → 切断认知发展窗口。强制孩子玩"教育玩具"(认字卡片) → 错过假装游戏的真正发展机会。错过同性父母模仿期 → 后期性别认同复杂化。
  evidence_level: B


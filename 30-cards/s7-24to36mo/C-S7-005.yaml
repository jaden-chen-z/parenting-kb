front:
  title: 25-30 月分辨大小用实物
  hook: 大苹果/小苹果直观比

back:
  why_matters: |
    25-30 月开始**逐步掌握对应概念**:大与小是最基础的一对。
    鲍秀兰要点:**用实物 + 日常生活经常接触的物品**教,如吃苹果时用大小不同的苹果教。
    然后过渡到图形(大圆 / 小圆 / 大汽车 / 小汽车)→ 建立"大""小"相反概念抽象。
    早期数学概念启蒙的入门(后续学数数 / 多少 / 长短的基础)。
  what_to_do:
    - 用大小不同的实物(苹果 / 梨 / 球)教
    - 让宝宝指"哪个大""哪个小"
    - 过渡到图形(大圆 / 小圆 / 大汽车 / 小汽车)
    - 让宝宝从一堆中挑大的 / 小的
    - 渐学其他对比(长短 / 高低 / 多少)
  failure_mode: |
    脱离实物只用抽象概念 → 学不会。
    一次教多个对比(大小+长短+多少)→ 混淆。
  evidence_level: B


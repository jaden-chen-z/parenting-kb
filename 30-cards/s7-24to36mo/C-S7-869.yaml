card_id: C-S7-869
stages: [S7]
tags: [shonkoff, nrc, toddler_conflict, peer_relations, china_high_freq]

front:
  title: "2-3 岁吵架是发展"
  hook: "冲突是社交学习场"

back:
  why_matters: |
    NRC 综述 Ch 7 给"toddler 冲突"科学定位:
    **关键洞察**(Brown-Brownell 1990):
    - **冲突在 toddler 玩耍中正常 + 必要**
    - **2-3 岁达峰** → 然后下降
    - **社交活跃的孩子冲突更多** — 因为他们尝试更多互动
    - **完全不冲突的孩子** ≠ 必然好 — 可能社交退缩
    **冲突的发展功能**(Piaget / Vygotsky):
    1. 暴露**自我视角的局限** → 学到"别人想法不一样"
    2. 推动**协商技能**发展
    3. 给**情绪调节**练习场
    4. **恢复关系**后学到"友谊比一时争执重要"
    **冲突 5 种应对**(toddler 实测):
    1. 走开(离场)
    2. 打架(身体冲突)
    3. 让步(放弃)
    4. 协商(讨论)
    5. 求大人(求助)
    **2-3 岁多用 1-2 + 4** — 协商需要语言成熟
    **NRC 立场**:
    - 不要怕 toddler 冲突 — 是发展正常
    - **过度激烈攻击 + 频繁** → 担忧
    - **从不冲突** → 也担忧(可能退缩或被欺压)
    **对中国家长**:
    - 别立刻冲过去阻止小冲突
    - 让 toddler 自己尝试解决(走开 / 协商 / 求助)
    - 极端时介入 — 但不是日常细节
    - "他打了别人就坏" — 错,正常发展轨迹
  what_to_do:
    - 不立刻阻止小冲突
    - 让娃自己尝试解决
    - 极端时才介入
    - 教协商不只阻止
    - 接受冲突是发展
  failure_mode: |
    "他抢别人玩具 — 立刻阻止 + 罚" — 错过 toddler 冲突学习窗口。
    "他从不抢从不打 — 真乖" — 可能社交退缩 — 不必然好。
    家长间互相为娃争执护短 → 给娃示范"冲突不能自己解决"。
  evidence_level: A


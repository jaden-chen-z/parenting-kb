card_id: C-S7-014
stages: [S7]
tags: [philosophy]

front:
  title: 2-3 岁忽视错误 = 最有效约束
  hook: 不当观众,行为自动消退

back:
  why_matters: |
    鲍秀兰核心立场:忽视对 2-3 岁孩子来说是最有效的约束技巧 — 比惩罚 + 讲理都更有效。
    原理:孩子在公共场所尖叫为了引起注意;你停下手中事去关注 = 鼓励他重复错误行为。
    关键是保持一致 — 即使商店所有人因孩子尖叫侧目,也不要向他显示你听到了。
    只用于"恼人 / 不期望"行为,不用于危险 / 破坏行为(后者要直接处理)。
  what_to_do:
    - 仅对恼人 / 不期望行为(非危险)
    - 不当观众:不看不说不回应
    - 公共场合也保持一致
    - 孩子表现好时立即表扬
    - 反复后行为自动消退
  failure_mode: |
    用于危险行为(玩刀 / 跑马路)→ 必须立即制止,不能忽视。
    时灵时不灵 → 行为更频繁,更难纠正。
  evidence_level: B


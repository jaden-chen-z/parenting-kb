card_id: C-S7-894
stages: [S7]
tags: [pikler, learning, real-experience, source-de]

front:
  title: "真实经验胜过假装表演"
  hook: "演给娃看 — 看不懂"

back:
  why_matters: |
    皮克勒 1969 第 10 章立场 — 父母给孩子"演"危险后果
    (假装摸炉子被烫 + "啊好烫!")— 完全无效。

    皮克勒两句核心立场(白话翻译):
    > 只有真实生活,才有真正的教育作用。

    > 我们靠"假装"(演给孩子看)— 什么也达不到。

    **3 个皮克勒立场**:
    1. **不演给孩子看**:幼儿看不懂"演"的意义
    2. **不主动让孩子受伤**:不能为了"教训"故意把孩子手放在热炉子上 —
       孩子会感觉到妈妈的**敌意**
    3. **真危险用语言警示 + 物理看护**:绝不让孩子摔下楼梯 / 跳窗户 —
       这些是必要禁令(必须看护住)

    跟蒙氏"实际生活"(戴维斯 / 利拉德给真物真任务)+
    玛格达的"告知再做"立场一致。本卷源头清晰阐述了
    "真实 vs 表演"是皮克勒学习哲学的核心。

  what_to_do:
    - 不演"假装受伤"教孩子(无效)
    - 不主动制造负面经验(让孩子摸热炉子)
    - 真危险:语言警示 + 看护(火 / 电 / 高处)
    - 小风险:让孩子自己尝试(摔布凳子 / 摔小积木)
    - 真实任务:让孩子真正参与(洗手 / 收玩具 / 帮忙)

  failure_mode: |
    "我跟娃演一遍他就知道烫了" → 皮克勒反:幼儿还没有"心智理论",看不懂"演"。
    要么直接告诉他"烫"+ 不让他碰,
    要么等他真碰过一次轻烫(不是大伤)— 那才是真正的学习。

  evidence_level: B


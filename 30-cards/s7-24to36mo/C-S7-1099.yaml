card_id: C-S7-1099
stages: [S7]
tags: []

front:
  title: "2 岁底线非上限"
  hook: "2 岁是底线非上限"

back:
  why_matters: |
    WHO 原文:'continuing to breastfeed for up to 2 years of 月龄 or beyond.'
    'or beyond' 三个字关键 — 2 岁不是上限,是底线。
    现实:
    - 全球母乳中位停止时间(自然离乳)≈ 2.5-7 岁(人类生物学基线,Detwyler 2004)
    - 北欧 / 部分非洲 / 部分亚洲社会:2-4 岁普遍
    - 中国/西方都市:多 1-2 岁断 — 文化压力,不是生物学需要继续 2 岁后母乳:
    - 仍有营养 + 免疫保护(浓度持续高)
    - 心理慰藉(分离焦虑期)
    - 母乳哺育期长 → 妈妈乳腺癌降险线性增加
  what_to_do:
    - "WHO 2 岁是底线不是上限('or beyond')"
    - "人类生物学自然离乳 2.5-7 岁"
    - "北欧 / 非洲 / 部分亚洲:2-4 岁普遍"
    - "继续喂 = 国际正常,中国都市偏短"
    - "妈妈乳腺癌降险跟哺乳期长线性相关"
  failure_mode: |
    认为 '2 岁后还喂太久' → 是文化偏见,不是生物学/医学根据。
    WHO 'or beyond' 是大方留白。
  evidence_level: B

  positions:
    issue: 持续母乳时长 — WHO 2 年 vs AAP/鲍/松田 1 年可断
    views:
      - school: WHO / UNICEF
        source: SRC-031
        stance: ≥ 2 岁 'or beyond' — 12-24m 母乳仍提供 33% 营养;Detwyler 2004 自然离乳 2.5-7 岁支持。
      - school: AAP
        source: SRC-006
        stance: 1 岁可断(也可继续不强求);1 岁后母乳不再是营养必需,以家庭决定为主。
      - school: 鲍秀兰
        source: SRC-009
        stance: 1 岁可断;跟中国本土实操更一致,无明确反对延长喂。
      - school: 松田道雄
        source: SRC-024
        stance: 弹性立场 / 妈妈决定;不强求时间表。
      - school: 中国家长压力
        stance: 1 岁后哺乳常被亲戚说"丢人"或"没营养";WHO 国际共识可作为反传统压力的依据。
      - school: WHO
        source: SRC-031
        stance: ≥ 2 岁 + 'or beyond' + 文化无关共识;12-24m 母乳 33% 营养硬数据。
      - school: 全球医学共识
        stance: 北欧国家普遍 2 岁;母亲乳腺癌每哺乳 12 月降 6%;WHO 立场是国际医学共识不是西方偏好。
      - school: 中国传统
        stance: '"1 岁就该断" / "2 岁还在喂丢人" / "1 岁后没营养" / "惯坏依赖" — 文化压力源。'
      - school: 实操建议
        stance: 中国家长选 WHO 2 年立场不是落后是国际接轨;反传统压力可拿 33% 营养 + 乳腺癌数据作背书。

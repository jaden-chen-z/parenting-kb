card_id: C-S7-242
stages: [S7]
tags: [bowlby, loss, grief, philosophy, milestone]

front:
  title: 哀伤 4 阶段儿童版
  hook: 麻木渴望解组重组

back:
  why_matters: |
    Bowlby Vol 3 整本核心理论 — **健康哀伤是有 4 个阶段的过程**(儿童版,普通家长可识别):
    **1. 麻木(几小时-几天)**:孩子表现得"像没事" / 继续玩 / 不接话 — 不是他不在乎,是大脑在缓冲。
    **2. 渴望和搜寻(几周-数月)**:反复问 / 念叨"妈妈呢" / 抱已逝者物品 / 看到陌生人误认 / 看墓地希望坟开 — 这是最强烈最久的阶段。
    **3. 解组和绝望(几月到一年)**:慢慢接受不会回来 / 食欲差 / 退化 / 抑郁 / 失去对玩耍兴趣 — 这是最痛但必经的"低谷"。
    **4. 重组(数月-数年)**:一点一点建新生活 / 跟健在父母重新建立紧密关系 / 接受失去但保留心中的形象 — 这是终点不是"忘了"。
    **关键**:每个阶段都需要时间,不能快进。允许孩子在每个阶段慢慢走,不要急着"让他开心起来"。
    每个阶段都可能有反复(看到照片 / 节日 / 生日突然回到第 2 阶段)— 正常。
  what_to_do:
    - 接受 4 阶段每段都有意义
    - 不急让孩子"快乐起来"
    - 第 2 阶段允许反复念叨不打断
    - 第 3 阶段陪伴 + 不强迫玩
    - 1 年后看是否在第 4 阶段
  failure_mode: |
    "都过去 3 个月了还没缓过来是不是有问题" → 哀伤需要 1 年起步,慢是正常。
    用力让孩子"高兴起来" → 跳过阶段 → 病理化(劳拉模式)。
  evidence_level: B


tags: ['philosophy', 'lerner_v1', 'lerner', 'PYD', 'confidence']

front:
  title: "自信不是夸出来"
  hook: "能做的事多了自信"

back:
  why_matters: |
    Lerner PYD 5C 中 Confidence(自信)— 不是夸出来,是 "我能做 X" 经验积累出来。
    中国家长 confidence 误区 —
    - 误区 1 — 反复夸"你真棒"(美式) → 但娃没做啥实事 → 表面自信内里空
    - 误区 2 — 反复批评 → 自信被压
    - 正确 — 让娃做能完成的事 + 描述他做的(不评价)
    2-3 岁 confidence 培养 —
    - 让娃自己穿鞋(就算慢)
    - 让娃自己吃饭(就算撒)
    - 让娃自己选衣服(就算搭配怪)
    - 让娃自己擦桌子(就算擦不干净)
    关键 — "他做的" 经验积累 = 自信根。
    "你真棒" 是水中花 — Bandura 自我效能理论(via Lerner)同立场。
  what_to_do:
    - "让娃做能完成的事(就算慢 / 撒)"
    - "描述行为 — 不空夸'你真棒'"
    - "'他做的'积累 = 自信根"
    - "不剥夺尝试机会(怕慢 / 怕乱)"
    - "Bandura 自我效能立场"
  failure_mode: |
    "你真棒"反复夸 — 培养表面自信内里空虚。
  evidence_level: B


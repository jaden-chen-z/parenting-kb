card_id: C-S7-347
stages: [S7]
tags: [emotion, RIE, lansbury]

front:
  title: "让孩子对你生气是给他的礼物"
  hook: "妈妈哪儿也不会去"

back:
  why_matters: |
    Lansbury Ch26 最深个人故事:
    她妈妈"完美" — 但忍不了她生气,
    一次小冲突导致 5 天冷战。
    Lansbury 童年深处恐惧:"妈妈会消失"。
    成年后:酗酒 + 焦虑 + 自我怀疑。
    她的觉悟:孩子需要知道"对你生气也安全",
    "你的怒气我接得住,我哪儿也不去"。
    很多中国家长可能从未给过孩子这个许可。

  what_to_do:
    - 孩子吼"我恨你 / 你最坏" = 不报复 / 不冷战
    - 平静接:"你很生气,我懂,我在这"
    - 不"妈妈这么辛苦你怎么忍心说" — 那是情绪敲诈
    - 自己冷静后回:"刚才你生气,我接住了"
    - 终生信号:你可以是你,我都在

  failure_mode: |
    "孩子敢吼我?要好好教育他什么是孝顺" → 制造长期内疚 + 焦虑。
    或反向:"我要永远是好妈妈" → 假装无伤害,孩子学到情绪不被接受。
    Lansbury:接住孩子的愤怒 = 给他一生的安全感。

  evidence_level: B


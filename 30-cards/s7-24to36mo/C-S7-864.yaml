card_id: C-S7-864
stages: [S7]
tags: [shonkoff, nrc, divorce_separation, family_change, china_high_freq]

front:
  title: "离婚要保关系稳"
  hook: "主要照护人别突变"

back:
  why_matters: |
    NRC 综述 Ch 9 + Ch 10 给"家庭结构变化"对孩子的影响 — 中国家长高频(二胎 / 离婚 / 搬家):
    **科学结论**(NRC 综合):
    1. **离婚本身**不一定伤孩子
    2. **关键是**:
       - **主要照护人是否稳定**
       - **冲突是否减少**(单亲低冲突 > 双亲高冲突)
       - **经济是否大幅恶化**
       - **生活节奏是否保持**
    3. 受最大影响的是 **3-5 岁**孩子(理解能力起步 + 不能完全自调)
    4. < 3 岁孩子主要看主要照护人是否稳定
    **NRC 反"为孩子凑合"立场**:
    - 高冲突双亲家庭 > 低冲突单亲家庭
    - 不必为孩子保住坏婚姻
    - 但**离婚后**必须保护孩子免于"中间人"角色
    **关键应对**:
    - 不在孩子面前互相诋毁
    - 主要照护人保稳定(别同时换房 / 换学校 / 换主要照护人)
    - 解释:"妈妈爸爸不再一起住 — 但都还爱你"
    - 别让孩子选边
    **对中国家长**:
    - 二胎也是"家庭结构变" — 同样适用
    - 别突然把大孩送老家 — 这是抛弃感
    - 提前 3-6 月预告 + 渐进过渡
    - 生完后专门时间陪大孩 — 不只关注新生儿跟 Bowlby V2 分离 + 松田 §378 母子分离立场一致。
  what_to_do:
    - 主要照护人保稳定
    - 别同时多变化叠加
    - 别在孩子前互骂
    - 二胎渐进过渡
    - 给大孩专门时间
  failure_mode: |
    "为孩子凑合不离" — NRC 数据反驳:高冲突 > 低冲突单亲。
    "二胎来就把大孩送老家适应" — 抛弃感 + 主要照护人骤变 = 高风险。
    "他还小不懂" — 错,< 3 岁感知不解释,3-5 岁感知 + 误解。
  evidence_level: A


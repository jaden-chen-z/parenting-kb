front:
  title: "Sroufe 30 年跟踪"
  hook: "1 岁依恋预测 30 岁"

back:
  why_matters: |
    Sroufe(via Ch 2 Thompson 综述)— 1973 年起 Minnesota 30+ 年纵向跟踪:
    1 岁安全依恋的孩子,30 岁有更稳定亲密关系、低抑郁、高就业。
    1 岁紊乱依恋的有 70%+ 后期心理病理。
    一句话 — 不是悲观决定论,而是 1 岁的关系质量是后期可被改变的最强基线。
  what_to_do:
    - "1 岁建安全依恋是终身投资"
    - "回应不一致给娃造紊乱"
    - "敏感性比技巧重要"
    - "妈情绪调节是第一步"
    - "夫妻冲突管理影响娃的内部模型"
  failure_mode: |
    觉得 1 岁的事 5 岁就忘 — Sroufe 30 年数据反对。
    1 岁基线决定后期可塑性的边界。
  evidence_level: B


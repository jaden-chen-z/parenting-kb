front:
  title: 25-30 月帮大人做事 + 收玩具
  hook: 别嫌乱挫主动性

back:
  why_matters: |
    25-30 月宝宝有了一定本领后,**很愿意帮大人做事** — 这是培养"热心为自己和他人服务"良好习惯的关键窗口。
    鲍秀兰严正提醒:**家长千万不要嫌乱而打击孩子的积极性** — 这一打击会让宝宝形成"我不行"的自我效能负面循环。
    具体训练:**帮把玩具或小椅子收好 + 帮拿东西 + 帮端碗**等。
  what_to_do:
    - 让宝宝帮收玩具 + 整理桌面
    - 教睡前一起收东西的仪式
    - 帮拿东西 + 端碗 + 端水(安全前提下)
    - 即使做不好也鼓励
    - 表扬"你真能干"强化
  failure_mode: |
    "你别添乱"赶走 → 帮人意愿被打击。
    觉得"宝宝小不会做"全包办 → 自我效能感缺失。
  evidence_level: C


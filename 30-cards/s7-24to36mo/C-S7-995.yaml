card_id: C-S7-995
stages: [S7]
tags: [thompson, autobiographical_memory, self_continuity, lerner_v3]

front:
  title: "24 月起记自己故事"
  hook: "我是有过去的人了"

back:
  why_matters: |
    Thompson(Ch 2)综述 — 24-36 月起 autobiographical memory(自传记忆)成形。
    孩子开始能讲"昨天我去了游乐场",有了"过去的我"概念。
    这是 self continuity(自我连续性)起点 — 他认识到自己是有时间感的人。
    一句话 — 你陪他回忆"上次怎样"是在帮他装时间感。
  what_to_do:
    - "睡前聊今天发生了啥"
    - "看照片视频聊上次"
    - "用昨天上周这种时间词"
    - "鼓励他描述自己经历"
    - "妈记错也别打断他版本"
  failure_mode: |
    觉得 2 岁记不住事不聊回忆,跳过这阶段。
    Thompson — 不聊不练,自传记忆建得弱,后期 self 感不连续。
  evidence_level: B


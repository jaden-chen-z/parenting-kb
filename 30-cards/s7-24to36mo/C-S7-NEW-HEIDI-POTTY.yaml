card_id: C-S7-NEW-HEIDI-POTTY
stages: [S7]
tags: [potty_training, heidi, milestones]

front:
  title: 海蒂厕训中道:看准备信号
  hook: 18-30 月窗口看孩子不看月龄

back:
  why_matters: |
    前情:海蒂《海蒂育儿大百科》在 toilet training 主题给出**中道立场**,
    比 Lillard 12-18 月激进派晚,比 Brazelton 24+ 月孩子主导早,跟 AAP 18-36 月窗口对齐。

    **海蒂 6 准备信号清单**(18-30 月看孩子状态):
    1. **身体信号** — 能保持纸尿裤干 2 小时以上 / 大便规律(每天同一时段)
    2. **运动信号** — 能稳走稳坐 / 能自己脱裤子
    3. **认知信号** — 能跟随简单指令 / 知道身体部位 / 能用词或手势表达
    4. **意愿信号** — 对马桶感兴趣 / 看父母用厕想模仿
    5. **情绪信号** — 不极度抗拒(说"不"是发展正常,但不能整天极度反抗)
    6. **环境信号** — 不在搬家/添小弟妹/换照护人等家庭重大变动期

    **6 信号 4-5 项符合 = 启动**;不到 3 项 = 暂停,2-3 月后再评估。

    **海蒂跟其他派对照**:
    - **Lillard 12-18 月激进派(C-S6-NEW-LILLARD-POTTY)**:海蒂晚 6-12 月,反"过早强训"
    - **AAP / 现代主流(C-S7-007)**:海蒂跟 AAP 18-36 月窗口对齐
    - **Brazelton(C-S7-018)**:海蒂略早,Brazelton 24+ 月才推
    - **Gerber 不训练等准备(C-S7-552)**:海蒂方向一致 — 看准备信号不看月龄
    - **鲍秀兰 9 月坐盆(C-S5-012)**:海蒂明确反 — 太早 + 强压力
    - **松田 1.5 岁夏天撤尿布(C-S6-823)**:海蒂晚 + 温和

    **海蒂强调**:
    - 准备信号 ≠ 月龄 — 18 月可能完全不准备,30 月可能突然准备好
    - 季节配合(夏天准备阶段更友好,少穿少洗)
    - 反"竞争心态"— 别人家娃 18 月学会不等于你家也得
    - 男娃通常比女娃晚 3-6 月(生理 + 抑制控制差异)
    - 第二胎通常比第一胎早 — 模仿哥哥姐姐
    - 倒退正常 — 大病/搬家/二胎出生后退回纸尿裤是常态

    **预期完整时间线**:启动后 → 白天用厕 3-6 月稳 → 夜间用厕再 6-12 月(夜间需更高发育成熟度)

  what_to_do:
    - 18-30 月持续观察 6 准备信号
    - 4-5 项符合 → 启动;< 3 项 → 暂停 2-3 月后再评
    - 选夏天启动(少穿少洗 + 户外多)
    - 工具:儿童马桶 / 减压圈 / 训练裤(脱穿方便)
    - 不奖励不惩罚,只观察 + 鼓励 + 替代方案
    - 倒退正常 — 大病/搬家/二胎出生后退回纸尿裤接受
    - 男娃晚 3-6 月,第二胎可能早 — 别比

  failure_mode: |
    "他 2 岁了还不会 — 是不是发育有问题" — 错,海蒂 4-5 项信号才启动,30 月也不晚。
    "邻居家娃 18 月学会了我家娃要被甩在后面" — Lillard 派 vs Gerber 派 vs Brazelton 派完全不同时间表,别比。
    "夜间还尿床 — 失败了" — 夜间用厕需 4-6 岁才稳,日间用厕成功不等于夜间也准备好。
    "大病后又用纸尿裤 — 是不是退步了" — 倒退正常,大病/搬家/添弟妹后回退是常态。
    跟过早强训(Lillard 派)+ 完全不训(Gerber 派)中道 — 海蒂主流家庭最容易上手。

  evidence_level: B


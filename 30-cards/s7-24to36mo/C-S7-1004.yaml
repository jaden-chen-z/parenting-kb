card_id: C-S7-1004
stages: [S7]
tags: [smetana, moral_conventional_distinction, lerner_v3, foundational]

front:
  title: "3 岁分道德 vs 习俗"
  hook: "打人和不洗手不同"

back:
  why_matters: |
    Smetana(via Ch 13 Turiel 综述)经典 — 3 岁孩子已经能分 4 类规则:
    ① 道德(打人 — 普世错)② 习俗(吃饭不能站起来 — 文化定)
    ③ 个人(穿啥颜色衣服 — 自己选)④ 谨慎(摸火 — 自我保护)。
    跨文化(美/中/日/印)实验都一致 — 孩子 3 岁就知道这区分。
    一句话 — 别把 4 类规则混着教,管教效果会差。
  what_to_do:
    - "道德规则:打人就是错(无商量)"
    - "习俗规则:解释我们家这样"
    - "个人规则:你自己选"
    - "谨慎规则:这是为你安全"
    - "4 类用不同语气和理由"
  failure_mode: |
    所有规则都用同一种妈说不行强制,孩子学不到分辨。
    Smetana — 3 岁就懂分,你不分他就当妈乱定规则,后期反抗更强。
  evidence_level: B


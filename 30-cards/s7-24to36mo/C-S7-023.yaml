card_id: C-S7-023
stages: [S7]
tags: [philosophy]

front:
  title: 二胎吵架你别站队
  hook: 你一进场,他们就更会吵

back:
  why_matters: |
    心理学家 Erik Erikson 当面告诉 Brazelton:没有任何父母觉得自己有能力同时爱两个以上孩子,这种潜在内疚感是父母总忍不住"主持公道"的根源。
    但孩子一旦察觉父母会被卷入,争斗就有了战略意义——目标从争玩具变成争父母。Brazelton 行医五十年,从未见过父母不在场时小孩真正伤到对方。
    手足之争是天然的社会化训练场,父母站队反而剥夺了这个机会。
  what_to_do:
    - 听到吵架先听 30 秒,不冲过去
    - 只要不出血,只说"我不知道谁对谁错"然后离开房间
    - 不当法官、不拼凑事实、不让告状有奖
    - 周末单独和每个孩子留一小时
    - 公开承认"你们不一样,所以我对你们方式不同"
  failure_mode: |
    老二一哭老大就被骂"你大让着"——老大学会用挑衅引诱父母仲裁,老二学会用哭声调动父母惩罚;两人吵架的目的从此不是争玩具,而是争父母这个奖品。
    十年后兄妹关系毁于这套被反复强化的三角剧本。
  evidence_level: B


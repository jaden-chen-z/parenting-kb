card_id: C-S7-996
stages: [S7]
tags: [thompson, conscience, warmth_over_rules, lerner_v3]

front:
  title: "温暖比严规更养良知"
  hook: "良知罚是罚不出来"

back:
  why_matters: |
    Thompson(Ch 2)+ Kochanska 实证综述 — 良知不是被罚出来的,是关系温暖出来的。
    数据 — 母婴温暖度高 + 适度规则的孩子,3 岁就有内化道德感。
    严罚组孩子表现服从但内化弱(没人看就违)。
    一句话 — 你想让孩子有真良知,温暖优先于严管教。
  what_to_do:
    - "犯错后先共情再讨论"
    - "别用恐吓换瞬间服从"
    - "夸具体行为不夸乖"
    - "让他经历自然后果(摔了"
    - "你也犯错也道歉,做榜样"
  failure_mode: |
    觉得严管教等于负责任,以为温暖会宠坏。
    Thompson + Kochanska — 反了,严管教只产服从不产良知。
  evidence_level: B


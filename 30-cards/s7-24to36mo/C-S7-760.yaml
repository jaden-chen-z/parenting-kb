card_id: C-S7-760
stages: [S7]
tags: [nightmare, night-terror, sleep, anti-medication]

front:
  title: 噩梦 vs 夜惊不一样
  hook: 妈抱紧说"妈在这"

back:
  why_matters: |
    松田区分两类:3-4 岁噩梦(入睡 1 小时后,娃能告诉妈做了可怕的梦)vs 5-10 岁夜惊症(深睡发生,完全记不住,哭叫剧烈到处走)。
    噩梦原因:白天过于疲劳 / 看了恐怖电视。
    妈抱紧娃说"妈在这儿,别害怕"是关键 — 不必看医生开药(抗癫痫药用错地方)。
    噩梦 2-3 月就好了,不要给孩子贴"病"标签。
  what_to_do:
    - 抱紧娃说"妈在这,别害怕"
    - 调整白天活动量 + 必睡午觉
    - 别让娃看恐怖电视/手机
    - 不去医院开抗癫痫类药
    - 5-10 岁仍剧烈哭叫到处走再查
  failure_mode: |
    妈惊慌叫醒娃 + 大声问"做什么梦了" → 反加深恐惧 + 让娃认同"我有病"。
  evidence_level: B


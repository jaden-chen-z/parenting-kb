card_id: C-S7-608
stages: [S7]
tags: [peer-play, parallel-play, social-stage]

front:
  title: 2-3 岁玩不到一块
  hook: 自立有了协作还没

back:
  why_matters: |
    松田说:2-3 岁孩子,真把他们放一起玩,玩一会就打架。
    虽然有了"自立性"能力,但还没有"协作能力" — 不能适应社会生活。
    妈把"娃跟其他娃打架"看作"我家娃没教好" → 误解发展节点。
    协作能力要在 2-3 岁集体生活体验中发育,不是家庭里教出来。
  what_to_do:
    - 接受 2-3 岁玩不到一块正常
    - 提供 2-3 个伙伴而不是 1 对 1
    - 准备 2-3 套同样玩具防争抢
    - 大人退后看,15 分一停冲突
    - 别强求"分享/合作"
  failure_mode: |
    妈一打架就拉开 + 教育"要分享" → 娃没机会自己学边界,3 岁仍不会。
  evidence_level: B


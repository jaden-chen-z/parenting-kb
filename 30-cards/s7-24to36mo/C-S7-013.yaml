card_id: C-S7-013
stages: [S7]
tags: [safety, red_flag]

front:
  title: 24 月红旗 7 项立刻送医
  hook: 7 项任一立即就医

back:
  why_matters: |
    24 月是发育评估关键节点,鲍秀兰列 7 项红旗(任一立即就医):
    ① 经常跌倒不会上楼;② 流口水语言不清;③ 不能搭 4 块积木;④ 不能用短语 / 不理解简单指令;⑤ 对其他孩子无兴趣;⑥ 与母亲分开极困难;⑦ 18 月红旗未改善。
    可能提示运动 / 神经 / 自闭 / 智力 / 焦虑 — 早期干预效果最好。
  what_to_do:
    - ① 经常跌倒 + 不会上楼 → 送医
    - ② 24 月一直流口水 + 语言不清 → 送医
    - ③ 不能搭 > 4 块积木的塔 → 送医
    - ④ 不能用短语 + 不理解简单指令 → 送医
    - ⑤ 对其他孩子完全没兴趣 → 送医评估自闭
    - ⑥ 与妈妈分开极度困难(超龄分离焦虑) → 评估
    - 任一立即就医,别等
  failure_mode: |
    觉得"宝宝慢半拍正常"→ 错过 2-3 岁干预黄金期。
    家中无人识红旗,等 4-5 岁才发现已晚。
  evidence_level: A


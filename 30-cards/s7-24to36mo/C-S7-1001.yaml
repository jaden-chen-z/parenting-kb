front:
  title: "Hartup 友谊 ≠ 流行"
  hook: "1 个朋友够了的"

back:
  why_matters: |
    Rubin & Hartup(Ch 10)综述 — 友谊(friendship)和流行度(popularity)是不同维度。
    数据 — 至少 1 个稳定朋友的孩子,长期心理健康优于流行但无密友的孩子。
    友谊 = 互惠 + 选择 + 情感投入。流行度 = 群体注意度。
    一句话 — 你 3 岁娃在班只有 1 个好朋友别担心,1 个就够。
  what_to_do:
    - "鼓励 1 个稳定朋友"
    - "邀请到家玩(不是大群)"
    - "教互惠(轮流 + 分享)"
    - "他被排挤时承认情绪"
    - "不强求他受欢迎 (虚的)"
  failure_mode: |
    "我家娃没人玩" — 焦虑流行度,忽视已有的 1 个朋友。
    Hartup — 1 友 > 多熟人,关系深度比广度重要。
  evidence_level: B


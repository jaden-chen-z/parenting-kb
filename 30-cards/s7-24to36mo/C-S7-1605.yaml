stages: ['S7']
tags: ['philosophy', 'lerner_v1', 'csikszentmihalyi', 'autotelic_personality']

front:
  title: "内驱型人格"
  hook: "为做而做不为奖励"

back:
  why_matters: |
    Csikszentmihalyi 给 autotelic personality 概念 —
    "以活动本身为目的"的人格(au=自,telos=目的)。
    数据 — 6+ 岁 autotelic 倾向已能测,跟成年成就 + 福祉强相关。
    意义 — 中国家长 "做这个有什么用" 思维 → 培养 instrumental(工具型)人格(看回报)。
    autotelic 人格 — 喜欢学就学,喜欢做就做 — 不问回报。
    2-3 岁是 autotelic 形成关键期 —
    - 让娃做"无用"的事(扔石头 / 看蚂蚁 / 唱歌)
    - 不问"这个对你有什么用"
    - 享受过程不只看结果
    - 父母自己示范 — 你也喜欢"无用"的事(读小说 / 散步 / 兴趣爱好)
    意义 — autotelic 是终生心流能力的人格基础。
  what_to_do:
    - "让娃做'无用'的事(扔石头 / 看蚂蚁)"
    - "不问'这个对你有什么用'"
    - "父母示范'无用'兴趣爱好"
    - "享受过程 > 看结果"
    - "autotelic 是终生学习人格"
  failure_mode: |
    "做这个有什么用" 思维 — 培养 instrumental 工具型人格。
  evidence_level: B


card_id: C-S7-019
stages: [S7]
tags: [philosophy]

front:
  title: 3 岁是亲子第二蜜月
  hook: 想象朋友是神圣的,问起来就消失

back:
  why_matters: |
    布雷泽尔顿描述 3 岁是亲子的"**第二个蜜月期**":
    18 月以来的"什么都说不"和挣扎奇迹般化解,孩子变得平静合作,
    回到第一年那种"全是玫瑰"的感觉。但**这次孩子赢得的是"自我掌控"的尊敬**,
    不只是依恋。

    这个时期的核心新能力是**想象力**:
    - 老大 / 独生子女几乎都会发展出**想象朋友**
    - 想象朋友能做所有"坏事",承担所有"好事"
    - 孩子说起想象朋友时跟说真人没区别

    **布雷泽尔顿的关键警告**:**想象朋友的私密性必须被尊重,不要追问**。

    布雷泽尔顿原话(白话翻译):
    > 成年人必须尊重这种幻想的私密性。它是珍贵的。
    > 一旦成年人通过询问朋友的事来侵入这种隐私,他们就破坏了它。
    > 幻想被父母加入,就被现实污染。
    > 想象朋友会在成年人谈论他们时融化消失。

    布雷泽尔顿自己经历:他问孙子"你的朋友长啥样?"
    孙子轻蔑回答:"爷爷!他只是想象的!"

    引用爱默生(白话翻译):
    > 尊重孩子。不要侵犯他的独处。

    **老二 / 老三很少有想象朋友** — 因为哥姐会嘲笑("你的朋友连人都不是")。
    这是老大独有的发展礼物,父母不要替老二感到"缺失"。
  what_to_do:
    - 听到孩子讲想象朋友,**点头听就好,不要追问细节**
    - 不要"我们一起去找你的小明" — 那是侵入
    - 不要在饭桌上替想象朋友"摆碗"(太干预)
    - 设家规时把想象朋友当真实存在(她要"睡觉了"就接受)
    - 老大的想象朋友期一般持续 3-6 月,自然消失,不焦虑
    - 老二老三没有想象朋友是正常的(他们已经有真实玩伴 = 哥姐)
    - 5 岁后还沉迷一个想象朋友 + 排斥真实朋友 = 找心理评估
  failure_mode: |
    "你这是骗人 / 撒谎"否认 → 切断幻想 + 创造能力。
    追问 / 替朋友"做事" → 想象崩塌,孩子学到"想象是可被入侵的"。
    用想象朋友吓唬("小明会生气哦") → 工具化 → 信任崩塌。
  evidence_level: C

  positions:
    issue: 3 岁画像 — 平静 vs 难过 · 能力跃升 vs 分离焦虑
    views:
      - school: Brazelton
        source: SRC-010
        stance: '"second honeymoon" — 3 岁比 2 岁平静,亲子关系重新进入蜜月期。'
      - school: Bowlby V2
        source: SRC-012
        stance: 3 岁分离比 2 岁更难(Shirley 1941 实证),分离焦虑窄域更突出。
      - school: Lillard(蒙氏)
        source: SRC-016
        stance: 3 岁是"上学龄"— 能力跃升正面,适合进入 prepared environment。
      - school: 中国主流
        stance: '"threes are worse than twos"(无人正面写,gap)— 实操常感 3 岁更难带。'

front:
  title: 2-3 岁双语稳基础
  hook: 2-3 岁双语稳

back:
  why_matters: |
    Snow V4 Ch 3(2-3 岁双语关键期)。
    **2-3 岁双语关键期**:
    - 大脑还能轻易处理多语
    - 词汇分布:每语 ≥ 25% 暴露
    - "code-switching"(混语)是健康
    - 父母不必焦虑"会不会糊"
    **Snow 关键发现**:
    - 双语娃 2-3 岁词汇总量 ≈ 单语娃
    - **每语词汇可能略低**,但**总词汇相同**
    - 4-5 岁稳定后**双语者通常领先**
    - 反"双语损害"立场
    **3 大成功要素 2-3 岁**:
    - **数量** ≥ 25% 每语
    - **质量**:跟人对话(非视频)
    - **文化**:语言带文化(L2 老师 / 家人)
    **反 4 误区**:
    - ❌ "2 岁混语是问题"(健康发展)
    - ❌ "等 5 岁再开始"(过晚,窗口缩)
    - ❌ "纯英文环境"(损中文)
    - ❌ "看视频就够"(社会化非习得)
    **OPOL / OPOL / OTOL 选一**:
    - 一人一语(爸 / 妈)
    - 一地一语(家 / 外)
    - 一时一语(早 / 晚)
    跟现库:跟 C-S6-1381 学步双语 + C-S8-732 V4 双语主论 + V2 Kuhl(C-S5-1142)对接。
    对中国家长意义:
    - 2-3 岁是双语黄金期
    - 混语正常别焦虑
    - 真人对话 > 视频
    - OPOL/OPOL/OTOL 选一稳定
  what_to_do:
    - 2-3 岁是双语黄金期
    - 混语正常别焦虑
    - 真人对话 > 视频
    - OPOL/OPOL/OTOL 选一
  failure_mode: |
    "混语是问题"— 错。健康发展。
    "等 5 岁再说"— 错。窗口缩。
    "纯英文损中文"反例:平衡双语者中文也好。
  evidence_level: B


front:
  title: "2-3 岁开始自评"
  hook: "他知道我做得好了"

back:
  why_matters: |
    Harter(Ch 9)综述 — 2-3 岁开始有 self-evaluation(自我评价),
    完成任务后会自豪笑,失败会羞愧低头。这是良知和自尊的起源,
    依赖于父母反映镜(你说他做得好他就觉得自己做得好)。一句话 — 你的反馈在写他自评底色。
  what_to_do:
    - "夸具体努力不夸聪明"
    - "失败时承认情绪不羞辱"
    - "你今天试了 3 次很好"
    - "失败后再来一次的机会"
    - "你自己也犯错示范不羞辱自己"
  failure_mode: |
    "你怎么这么笨" — 2-3 岁这话直接写进 self 永久层。
    Harter — 这阶段反馈最敏感,负面贴到 self 核心。
  evidence_level: B


card_id: C-S7-861
stages: [S7]
tags: [shonkoff, nrc, self_regulation_struggle, china_high_freq]

front:
  title: "2 岁起调节冲突大"
  hook: "想做做不到很挫败"

back:
  why_matters: |
    NRC 综述第 5 章给"幼儿自我调节挣扎期"的科学定位:

    **2 岁的核心矛盾**:
    1. **想要的**(自我能动性强)
    2. **能做到的**(动作技能不够 + 工作记忆不够)
    3. **被允许的**(社会 / 安全规则)

    三者**严重不一致** → 频繁挫败 → 崩溃。

    **NRC 综述教训**:
    - 2 岁不是"开始懂事",是"自我和能力 + 规则的协商期"
    - 这种**挣扎是必要发展过程**,不是病
    - 跨越方式:**渐进给独立** + **设接纳性边界**

    **关键工具**(NRC 第 5 章):
    - **搭脚手架** — 比他能做的高一点点,你帮一把
    - **重复仪式** — 同一流程让他可预测
    - **情绪命名** — "你想自己穿,袜子滑了,所以生气了"
    - **共同调节** — 一起做,不替他做

    **跟斯特恩"和能调节我的他人在一起的自我" + 鲍尔比"内部工作模型"一致**。

    **对中国家长**:
    - 别期待 2 岁"乖" — 是自我萌芽期
    - 给他试 + 你做后盾 — 不是替他做
    - 命名情绪 → 帮他认知调节
    - "我自己"阶段是健康 — 配合不打断
  what_to_do:
    - 给试错空间,不替做
    - 命名他的情绪
    - 渐进给独立
    - 重复仪式可预测
    - 别期待 2 岁乖
  failure_mode: |
    "他想自己做但做不好 — 我替他做" → 短期省事,长期自我能动性弱。
    "他闹是无理 — 不理他冷处理" → 错过命名情绪窗口。
    "我让他自己来,他越发不耐烦" → 他需要你做后盾,不是放手。
  evidence_level: A


card_id: C-S7-246
stages: [S7]
tags: [bowlby, loss, grief, red_flag, safety]

front:
  title: 1 年还卡住要找专业
  hook: 1+ 年没好转求助

back:
  why_matters: |
    Bowlby Vol 3 给家长的关键判断标准 — **健康哀伤 vs 病理性哀伤的分水岭**:
    **健康(给时间会过)**:
    - 1 年内整体能进入第 4 阶段(慢慢重建生活)
    - 有反复但整体趋势向上
    - 能接受新照顾者 / 新关系
    - 能玩 / 吃 / 上学(虽不如以前)
    - 提到逝者会难过但不崩溃
    **危险信号(可能病理化,需求助)**:
    - 1 年以上仍卡在第 1-2 阶段(完全否认 / 长期搜寻)
    - 完全不能提到逝者 OR 完全无反应
    - 长期食欲 / 睡眠严重失常
    - 持续退化(2 岁宝宝表现像 6 个月)
    - 完全拒绝任何新照顾者
    - 自伤行为(揪头发 / 抠破皮 / 撞头)持续不减
    - 反复诡异的症状(胃痛 / 头痛 / 莫名怕)
    - 替代照顾者反映"完全无法接近"
    Bowlby 立场:**儿童病理性哀伤会发展成成年抑郁 / 焦虑型依恋 / 强迫性照顾他人** — 早干预效果最好。
    中国家庭最大坑:**"再等等就好了 / 时间能治愈一切"** — 时间不会治愈病理性哀伤,只会让它变成性格的一部分。
    **求助资源**:儿童心理咨询师(尤其有依恋理论 / 哀伤辅导背景的)+ 三甲儿童精神科。
  what_to_do:
    - 1 年时主动评估孩子状态
    - 看是否在第 4 阶段(重建)
    - 发现卡住找专业人士
    - 不要让孩子"自己扛过去"
    - 持续大异常 ≥ 6 月求助
  failure_mode: |
    "他还小长大就忘了不用专业" → 童年病理哀伤 → 成年抑郁直接前因。
    "心理咨询很贵 / 没用" → 早干预效果远好于成年补救。
  evidence_level: B


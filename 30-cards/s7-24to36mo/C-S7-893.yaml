card_id: C-S7-893
stages: [S7]
tags: [pikler, philosophy, source-de]

front:
  title: "Geduld(耐心)是最强育儿原则"
  hook: "做少等久才是好父母"

back:
  why_matters: |
    皮克勒 1969 第 11 章"收尾说明"是全书收官立场:
    **耐心**是育儿最强原则。

    "耐心"在全书出现数十次:
    - 大动作发展需要耐心(等孩子自己达成)
    - 母婴关系需要耐心(慢慢建立依恋)
    - 玩耍观察需要耐心(不打断)
    - 婴幼儿过渡需要"很多耐心 + 时间"(引言)
    - 便盆训练需要耐心(等孩子准备好)
    - 适应规则需要耐心(让孩子理解,不强迫)

    皮克勒立场:育儿不是"做得多 = 好",而是"做得少 + 等得久 = 好"。
    这跟现代育儿"焦虑 + 干预多"完全反向。

    玛格达的"教育护理"理念(SRC-022) /
    兰斯伯里的"魔法词就是'等'"(SRC-019) /
    蒙氏的"慢慢来"(戴维斯 / 利拉德)— 全部继承皮克勒的耐心哲学。

    本卷收官命题:**好父母不是干预型,而是耐心型**。

  what_to_do:
    - 看到孩子挣扎 — 等 5 秒再决定要不要帮
    - 看到孩子发展慢 — 等几周再决定要不要担心
    - 看到孩子尝试新事 — 等他完成,不打断
    - 看到孩子犯错 — 等他自己发现
    - 大人焦虑时 — 深呼吸,等一会儿再说话

  failure_mode: |
    "等不了,我急性子怎么办" → 这正是皮克勒写书的目标 — 教父母慢下来。
    她说的"很多耐心"也是在给父母时间去适应这个新的育儿节奏。慢慢练。

  evidence_level: B


front:
  title: "3 岁起男女分玩"
  hook: "同性玩伴自发现象"

back:
  why_matters: |
    Maccoby(via Ch 14 Ruble 综述)经典 — 3 岁起孩子自发分性别玩(男娃跟男娃,女娃跟女娃),
    跨文化都一致,不是父母教的。原因 — 玩法风格匹配(男娃 rough,女娃 verbal)。
    一句话 — 你 3 岁娃只跟同性玩别担心,自然现象。
  what_to_do:
    - "3 岁同性玩别强干预混合"
    - "提供混性别活动(全班游戏)"
    - "看绘本聊男女合作"
    - "妈爸也示范跨性别合作"
    - "10 岁后会自然混"
  failure_mode: |
    觉得 3 岁不跟异性玩 = 性别教育失败,强制混。
    Maccoby — 自然现象,强制反让娃排斥。
  evidence_level: B


card_id: C-S7-997
stages: [S7]
tags: [caspi, temperament_personality, lerner_v3]

front:
  title: "气质长成人格 24 月"
  hook: "气质是人格底色了"

back:
  why_matters: |
    Caspi & Shiner(Ch 6)综述 — 气质和人格不是两件事,
    24-36 月起气质开始延伸成 Big Five 人格特征(外向/宜人/尽责/情绪稳/开放)。
    数据 — 3 岁气质和 30 岁人格有 30%+ 有关性,不是 100% 但意义重大。
    一句话 — 你 2-3 岁观察的气质,有约 1/3 会持续到成年。
  what_to_do:
    - "看气质趋势不死扣某天"
    - "外向娃别强求安静"
    - "尽责底色弱别期待 5 岁能整理"
    - "给适合气质的成长路径"
    - "别用别人家娃模板套"
  failure_mode: |
    觉得 2 岁气质会自然变成 5 岁就好了,不接受底色。
    Caspi — 30%+ 持续到成年,不接受底色就是跟孩子打仗。
  evidence_level: B


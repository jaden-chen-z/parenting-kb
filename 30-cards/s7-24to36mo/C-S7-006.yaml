front:
  title: 25-30 月唱儿歌 + 说用途
  hook: 易懂《大公鸡》+ 说"杯子干啥用"

back:
  why_matters: |
    25-30 月语言进入词汇 + 用途双重发展期:一面教唱真正易懂的儿歌(《大公鸡》《小手绢》),一面教说出物品用途。
    鲍秀兰反对机械背唐诗:唐诗不易理解,宝宝只是机械背 — 不如学实际易懂儿歌,既学语言又学认识事物。
    教用途:杯子干什么用 / 梳子干什么用 — 让宝宝用语言准确表达事物的用途(不要把名称和用途混淆)。
  what_to_do:
    - 选实际易懂儿歌(《大公鸡》《小手绢》)
    - 不要强求背唐诗(不易理解)
    - 教说物品用途:"杯子喝水""梳子梳头"
    - 区分名称 vs 用途,别混淆
    - 一首儿歌掌握后再学下一首
  failure_mode: |
    强求背唐诗 → 机械记忆,词汇仍贫乏。
    用途和名称混说("这是几点了"代替"手表")→ 错误概念。
  evidence_level: C


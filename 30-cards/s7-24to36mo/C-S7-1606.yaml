stages: ['S7']
tags: ['philosophy', 'lerner_v1', 'brandtstadter', 'intentional_self_development']

front:
  title: "主动塑造自己"
  hook: "娃 2 岁开始自塑"

back:
  why_matters: |
    Brandtstädter 提 intentional self-发展 — 人不是被动被发展,是主动塑造自己。
    2-3 岁就开始 — 娃说 "我自己" / "我要" / "不要" — 这是 intentional self-发展 起步,
    不是"反抗期"。
    意义 — 中国家长把 "我自己" / "不要" 解读为反抗 → 镇压 → 破坏 intentional self-发展。
    正确视角 —
    - "我自己" = 娃在练 self-发展 主体性
    - "不要" = 娃在练 boundary 设定
    - "为什么" = 娃在练 metacognition 反思父母工作 — 支持 intentional self-发展,不镇压。
    具体 — 让娃做选择(穿什么 / 玩什么 / 吃什么)— 是 self-发展 训练。
  what_to_do:
    - "'我自己'鼓励不打断"
    - "'不要'听 + 谈判 — 不立刻否决"
    - "让娃做小选择(穿 / 玩 / 吃)"
    - "self-发展 起步阶段宝贵"
    - "'反抗期' = 误解 self-发展"
  failure_mode: |
    "反抗期"镇压视角 — 错。Brandtstadter:2 岁 self-发展 起步。
  evidence_level: B


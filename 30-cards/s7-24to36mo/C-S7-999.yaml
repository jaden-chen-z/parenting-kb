card_id: C-S7-999
stages: [S7]
tags: [parke, lamb, father_unique_role, lerner_v3]

front:
  title: "爸不是备用妈"
  hook: "爸有独立功能不同"

back:
  why_matters: |
    Lamb(via Ch 8 Parke 综述)— 爸不是帮妈的角色,
    爸独立功能 — 更多体力游戏(妈轻柔 vs 爸 rough-and-tumble)、推冒险、跨界限。
    数据 — 父亲深度参与的孩子(不只是经济),社交能力+情绪调节+抗挫力都更强。
    一句话 — 让爸做爸的事,不是让爸做减弱版的妈。
  what_to_do:
    - "爸单独带至少 1 周末/月"
    - "不批评爸的方法"
    - "爸 rough 一点没事"
    - "爸的边界跟妈不一样也 OK"
    - "爸不擅长换尿布也别 demote"
  failure_mode: |
    妈包办一切,爸退化成钱包 + 偶尔打孩子的人。
    Lamb — 爸功能缺位,孩子 5 项指标都受损。
  evidence_level: B


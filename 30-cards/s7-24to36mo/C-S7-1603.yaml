front:
  title: "群体均值不是你娃"
  hook: "统计骗人个体才真"

back:
  why_matters: |
    Magnusson 综述强调 — 心理学统计的"平均值"不是任何具体个体。
    "2-3 岁平均 X 月会 Y" 不代表你家娃也该 X 月会 Y。
    真正的发展是 individual pathway(个体轨迹)— 每个娃自己的路径不同。
    意义 — 中国父母焦虑常源自 "平均" 比较 — 隔壁家娃 / 月龄表 / 早教评估。
    Magnusson 视角:跟你家娃自己比,不跟群体均值比。
    具体做法 — 记录自家娃 6 月 / 12 月 / 18 月 / 24 月自己的进步,
    跟自己比"是不是在自己路径上发展" — 而非跟群体均值比。
  what_to_do:
    - "记录自家娃 6 月间隔的进步"
    - "跟'3 月前的自己' 比,不跟邻居比"
    - "群体均值参考 — 不是标准"
    - "个体路径 > 平均比较"
    - "Magnusson:individual is the unit"
  failure_mode: |
    群体均值焦虑 — 错。Magnusson 综述:你家娃 ≠ 平均人。
  evidence_level: B


card_id: C-S7-243
stages: [S7]
tags: [bowlby, loss, grief, 观察]

front:
  title: 小细节是思念信号
  hook: 揪头发抠鼻子抱旧物

back:
  why_matters: |
    Bowlby Vol 3 多个案例 — **2-4 岁孩子的哀伤往往不在大哭大闹里,而藏在小细节里**。家长不识别就会错过。
    实测可观察的"思念信号"(温蒂 / 温妮 / 劳拉 / 帕特里克 / 道恩 / 欧文共同):
    - **揪自己**:揪头发 / 揪耳朵直到红肿(温妮)
    - **抠破皮**:抠鼻子 / 抠脸到结疤(劳拉 / 道恩)
    - **退化行为**:尿床 / 重新吸手指 / 不会自己吃饭(温妮 / 凯西)
    - **抱过渡物**:紧抱毯子 / 玩偶 / 已逝者物品(劳拉抱"宝宝"毯子 + 熊娃娃)
    - **食欲改变**:吃得少 / 不爱玩 / 安静坐着(温妮 / 道恩)
    - **变"过分顺从"**:不再坚持自己想法 / 反着不喜欢的事也不反对(温妮)
    - **重复念叨**:"妈妈会来 / 我妈妈如何如何"(帕特里克)
    - **错认**:误把陌生女人当妈妈(道恩第 13 天 / 欧文听走廊声音)
    - **身体黏人**:不让某人离开视线(凯西扫墓后)
    Bowlby 立场:**这些不是"宝宝怪癖",是哀伤的身体表达**。看到了要主动接住,不要矫正。
  what_to_do:
    - 看到揪 / 抠主动抱 + 提及思念
    - 别拉开毯子 / 玩偶
    - 退化行为不批评不羞辱
    - 主动说"想 X 是吧我也想"
    - 1-2 月后观察是否减少
  failure_mode: |
    "怎么又揪头发 / 抠鼻子别这样" → 强制停止 → 压力没出口 → 转其他症状。
    "都这么大了还吸手指 / 尿床真不像样" → 羞辱 → 加重退化。
  evidence_level: B


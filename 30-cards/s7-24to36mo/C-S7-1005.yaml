card_id: C-S7-1005
stages: [S7]
tags: [ruble, gender_schema, stereotypes, lerner_v3]

front:
  title: "3 岁性别刻板高峰"
  hook: "他比大人还刻板了"

back:
  why_matters: |
    Ruble & Martin(Ch 14)综述 — 3-5 岁是性别刻板印象高峰期。
    数据 — 3 岁孩子比成年人对性别角色更刻板(男孩绝对不能玩娃娃),
    机制 — 他刚学会我是男 / 女,需要严格规则巩固身份。
    一句话 — 3 岁说男孩不能哭不是你教的,是他自己定的,你的工作是软化不是强化。
  what_to_do:
    - "他说 X 是男孩不能别附和"
    - "示例反例(爸也哭过)"
    - "支持他喜欢但不符刻板的(男娃喜欢粉)"
    - "你自己别强化(妈做饭爸赚钱)"
    - "5-7 岁 constancy 后会软化"
  failure_mode: |
    觉得 3 岁的性别刻板是自然正确,助强化 → 长期硬化。
    Ruble — 5-7 岁本会自然软化,你强化反让他锁死。
  evidence_level: B


front:
  title: 25-30 月学穿鞋(先脱后穿)
  hook: 不系带的鞋练起

back:
  why_matters: |
    生活自理顺序:**先学会脱(脱衣 / 脱袜 / 脱鞋)→ 再学穿** — 鲍秀兰强调脱比穿简单,先后顺序不能颠倒。
    25-30 月可教学穿鞋,**主要是不系带的鞋**:拿起鞋子 → 脚伸进去 → 努力将鞋跟提起。
    家长**先与宝宝一起用力**穿好,以后多鼓励宝宝自己做。
    系带鞋更难,一般 4-5 岁后才学。
  what_to_do:
    - 先确认会脱(衣 / 袜 / 鞋)
    - 选不系带的鞋(粘扣最好)
    - 教步骤:拿鞋 → 伸脚 → 提鞋跟
    - 先一起用力穿,再让自己做
    - 穿反了别讥笑,告诉"换一只脚"
  failure_mode: |
    没学会脱就教穿 → 顺序错,挫败感强。
    买系带鞋让宝宝穿 → 太难,放弃自己穿。
  evidence_level: B


stages: [S7]
tags: [philosophy]

front:
  title: 2-3 岁道德意识 5 招启蒙
  hook: 自控/分享/识表情/礼貌+榜样

back:
  why_matters: |
    2-3 岁是道德意识 + 社会化行为萌芽培养的关键期。鲍秀兰给 5 招:
    ① 促进自我控制能力:用语言调节行为(打人时说"不能打人");
    ② 鼓励分享 + 互助 + 关心别人:好行为立即表扬;
    ③ 学习识别表情 + 理解别人感受;
    ④ 学习礼貌用语("谢谢""对不起");
    ⑤ 家长树立榜样 + 通过故事 / 游戏培养良好道德。
  what_to_do:
    - 教用语言调节自己("不能打人")
    - 鼓励分享 + 互助 + 关心别人
    - 表情识别 + 理解别人感受
    - 教礼貌用语("谢谢""对不起")
    - 家长以身作则 + 故事 / 游戏强化
  failure_mode: |
    "孩子小不懂别教"→ 错过 2-3 岁道德启蒙窗口。
    家长行为不一致(教谢谢自己却没说)→ 言传身教失败。
  evidence_level: C


card_id: C-S7-039
stages: [S5, S6, S7]
tags: [safety, red_flag]

front:
  title: 5 岁前住院影响到 18 岁
  hook: 分离效果会累积

back:
  why_matters: |
    Douglas 对 4000 多个儿童的追踪研究(英国国家儿童发展研究)— 重磅长期数据:
    **5 岁前住过院**(超过 1 周 OR 超过 2 次)的孩子到了**13-18 岁**:
    - 13 岁、15 岁更容易被老师评价为难以管教
    - 男生 8-17 岁更容易被警察警告或判刑
    - 阅读测试得低分更普遍
    - 15-18 岁退学后换 4+ 次工作更普遍
    - 5-15 岁有住院经历的孩子,**犯罪倾向更高 + 工作更不稳定**
    控制了健康因素 / 家庭大小后差异**仍然成立**。
    Bowlby 总结:**"儿童在早年时期与母亲分离产生的效果是会积累的,最安全的分离剂量就是 0。"**
    含义:住院 / 异地长期分离不是"忍一阵就好",会留**永久性认知 + 情绪 + 行为印记**。
  what_to_do:
    - 5 岁前手术 / 住院,妈妈尽可能全程陪
    - 不能陪 → 用 Robertson 5 招(C-S7-034)降低伤害
    - 多次小住院和一次长住院都有影响,不可大意
    - 可推迟的非紧急手术,推到 5 岁后
    - 异地寄养 / 留守 = 等同长住院,慎选
  failure_mode: |
    "他这次住院 1 周没事的" — Douglas 数据:1 周 + 2 次以上 = 显著长期影响。
    "5 岁前不记事,放心送外婆家几个月" — 留守对依恋的累积伤害类似住院。
  evidence_level: A


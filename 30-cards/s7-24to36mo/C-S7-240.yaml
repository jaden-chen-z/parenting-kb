card_id: C-S7-240
stages: [S7]
tags: [bowlby, loss, grief, philosophy]

front:
  title: 重聚冷淡是修复期
  hook: 不认妈是修不是伤

back:
  why_matters: |
    Bowlby 第二十三 / 二十四章多个案例同一规律:
    长期分离 / 丧失之后,孩子重聚时**会经历一段冷淡 / 拒绝 / 不认妈的修复期**。这不是疏远了,是孩子的"防御性情感隔离"在解冻。
    实测时长(几周分离的案例):
    - 欧文(2 岁 2 个月,11 周分离):回家时不看妈妈 / 拒绝妈妈玩具 → 4 天才让妈妈安抚 → 11 天才公开表达爱
    - 道恩(16 个月,15 天分离):回家头几天疏远 → 第 6 天才叫"妈咪"
    - 劳拉(2 岁 5 个月,8 天分离):回家初前几天有点不安 → 之后看似恢复 → 6 个月后看录像突然崩溃
    - 简(17 个月,10 天分离):重聚立刻认母,跟养母关系几周内才慢慢淡化
    **怎么发生的**:孩子的情感开关为了保护自己被关闭了一部分,需要时间一点一点重新打开。
    Bowlby 关键:**妈妈不要因为冷淡受伤生气,接住等待是关键**。
    中国家庭最大坑:**孩子分离回来不亲近 → 妈妈伤心 → 用力讨好 → 反让孩子更乱**。
  what_to_do:
    - 接受 1-2 周冷淡是正常修复期
    - 不强迫亲亲抱抱
    - 平静在场 + 提供熟悉物
    - 让孩子主动靠近不抢节奏
    - 重聚后观察 4 周不发脾气
  failure_mode: |
    "我家娃几天不见妈不认我一定是阿姨太好了" → 误判,这是健康分离反应的修复期。
    强迫"快叫妈" → 阻碍解冻 + 加重防御。
  evidence_level: B

  positions:
    issue: '"懂事不哭" 是赞美还是依恋警告 · 强独立是好品质还是焦虑回避'
    views:
      - school: Bowlby V2
        source: SRC-012
        stance: '"强忍不哭" 可能是压力反应(Lottie 案例);"早独立" 可能是焦虑回避型(航天员证据)。'
      - school: Bowlby V3
        source: SRC-017
        stance: 同方向加固 — "看似没事" 的孩子在临床上往往最危险,内化压力比外显更难干预。
      - school: 中国主流
        stance: '"懂事不哭不闹" 是亲戚常见夸赞;"独立" 被视为好品质,与回避型依恋区分模糊。'

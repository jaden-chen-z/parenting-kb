front:
  title: 2-3 岁干预多元
  hook: 2-3 岁干预多元

back:
  why_matters: |
    Powell V4 Ch 14(2-3 岁多元干预)。
    **2-3 岁干预 4 大类型**:
    - **个体**:语言治疗 / 行为治疗 / OT
    - **亲子**:PCIT / Circle of Security / 父母班
    - **同伴**:小组干预 / 包容性幼儿园
    - **环境**:家庭支持 + 学前评估
    **Powell 5 原则 2-3 岁应用**:
    - **关系**:孩子 + 治疗师建立关系前 1-2 月
    - **文化敏感**:中国家版本(语言 / 价值观)
    - **个体化**:每娃不同方案
    - **持续 6+ 月**:不是 1-2 次
    - **协作**:家长 + 治疗师 + 园 + 医生
    **2-3 岁常见干预目标**:
    - 语言迟缓(24 月 < 50 词 / 36 月 < 200 词)
    - 自闭谱筛查(M-CHAT 阳性)
    - 行为问题(过度 tantrum / 攻击)
    - 情绪问题(焦虑 / 退缩)
    - 发育延迟(综合)
    **反 4 误区**:
    - ❌ "等大了再说"(每月成本翻倍)
    - ❌ "找一种就行"(多元更有效)
    - ❌ "贴标签伤娃"(早干预是负责)
    - ❌ "短期班见效"(< 6 月不可信)
    跟现库:跟 C-S0-1233 Powell 5 原则 + C-S6-1389 V4 学步干预 + Triple P / IY / PCIT 对接。
    对中国家长意义:
    - 2-3 岁干预要多元(个体+亲子+同伴+环境)
    - 5 原则 + 6+ 月持续
    - 找有 RCT 项目
    - 早干预最有效
  what_to_do:
    - 2-3 岁干预要多元
    - 5 原则 + 6+ 月持续
    - 找有 RCT 项目
    - 早干预最有效
  failure_mode: |
    "等大了再说"— 错。每月翻倍。
    "找一种就行"— 错。多元更有效。
    "短期班见效"— 错。需 6+ 月。
  evidence_level: B


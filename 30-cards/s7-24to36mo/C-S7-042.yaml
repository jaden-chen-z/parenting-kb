card_id: C-S7-042
stages: [S6, S7]
tags: [philosophy, controversy]

front:
  title: 强独立不健康
  hook: 健康 = 自主 + 会求助

back:
  why_matters: |
    Bowlby Vol 2 第二十一章引航天员研究(Korchin & Ruff 1964)— 反"完全独立"的迷思:
    7 个航天员(高压下杰出表现的人)的人格画像:
    - **高自主** + 喜欢独立行动
    - **同时**:"当需要依赖他人时感受是舒适的"
    - 在不信任的情境下保持信任的能力
    Apollo 13 事故中船员表现为证:面临巨大危险下保持效率 + 信任地面同伴。
    Bowlby 关键洞察:**"准备好在合适的情景中寻求他人的帮助与独立性的发展之间并不矛盾。"**
    格林克 1962 大学生研究也证实:健康者**主动独立 + 同时愿在重要事上征求他人意见**。
    家长大坑:**中国文化"强独立"观念把"会求助"误读为软弱** — 实际"完全独立 = 反人性 = 焦虑型回避依恋"。
    安全依恋的成人长这样:能独立 + 也能在脆弱时让人靠近。
    引申:训练孩子"独立"过早过严,**养出来不是航天员,是回避型成年人**(C-S5-072)。
  what_to_do:
    - 教孩子求助 = 教独立的一部分
    - 别羞于"我不会,谁能帮我"
    - 鼓励"先试试,卡住就喊"
    - 自己也示范求助(让孩子看到)
    - 别奖励"完全自己解决"过头
  failure_mode: |
    "孩子要学会自己解决,不能事事找妈" — 数据反:不会求助 = 回避型,不是独立。
    "依赖人是软弱" — 航天员 + 健康大学生数据反:能依赖才是高功能。
  evidence_level: A

  positions:
    issue: '"懂事不哭" 是赞美还是依恋警告 · 强独立是好品质还是焦虑回避'
    views:
      - school: Bowlby V2
        source: SRC-012
        stance: '"强忍不哭" 可能是压力反应(Lottie 案例);"早独立" 可能是焦虑回避型(航天员证据)。'
      - school: Bowlby V3
        source: SRC-017
        stance: 同方向加固 — "看似没事" 的孩子在临床上往往最危险,内化压力比外显更难干预。
      - school: 中国主流
        stance: '"懂事不哭不闹" 是亲戚常见夸赞;"独立" 被视为好品质,与回避型依恋区分模糊。'

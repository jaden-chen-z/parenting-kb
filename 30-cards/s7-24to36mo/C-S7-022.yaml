card_id: C-S7-022
stages: [S7]
tags: []

front:
  title: 入园 2-3 周后会"二次崩溃"
  hook: 适应后才真冲击

back:
  why_matters: |
    Brazelton 临床观察:孩子第一次离家入园会有"延迟反应"——刚入园几天适应得很好,但几周后会突然回归到黏人哭闹/尿床/吸拇指/夜醒/噩梦/对奶瓶 lovey 重新依赖。
    这是把所有新感受消化后的二次冲击,不是倒退而是正常。
    父母此时必须重做整套准备步骤、可能再陪伴几天。
    每一年新学年开学头几天都难——是 rite of passage、提醒孩子"我在长大必须独立"。
    家中有更小的弟妹时尤其难,孩子会想"我走了他们在做什么"。
  what_to_do:
    - 入园 2-3 周后准备应对二次回归
    - 允许早晨抱抱、躺腿、不自己穿衣
    - 每周末爸妈各 1 小时一对一独处时间
    - 让她带 lovey 或妈妈照片去学校
    - 告诉她"回归是 normal,你会重新掌控"
  failure_mode: |
    父母看到二次回归以为"前面白做了"开始焦虑/责备,或把回归当退步硬性纠正,孩子失去过渡缓冲。
  evidence_level: B


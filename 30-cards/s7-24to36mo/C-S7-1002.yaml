front:
  title: "Patterson 强制家庭"
  hook: "吼吼出更横的娃了"

back:
  why_matters: |
    Patterson(via Ch 12 Dodge)综述 — 攻击儿童是被父母训练出来的(不是天生)。
    机制 — 强制循环:娃要 → 妈不给 → 娃哭闹 → 妈烦给了。
    妈学到给了能停闹,娃学到闹能要到。循环 100+ 次后 → 娃习得攻击是有用工具。
    一句话 — 你现在妥协的每一次,都在训练孩子用更强烈手段。
  what_to_do:
    - "决定就坚持别妥协"
    - "未哭前的请求满足"
    - "哭闹后的请求绝不满足"
    - "夫妻一致(一个唱黑白都给 = 黑没用)"
    - "你失控吼了道歉:妈烦了"
  failure_mode: |
    "为耳根清净给了" — 这一次省事,下一次成本翻倍。
    Patterson — 100 次累积下娃的攻击行为成型。
  evidence_level: B


front:
  title: 9 月触点全面崩溃期
  hook: 不睡不吃黏人三连

back:
  why_matters: |
    9 月是 Brazelton 标志性的"touchpoint"——宝宝学站学爬，吃睡情绪同时倒退。妈妈来诊室哭"他全垮了，我也垮了"——Brazelton 反而高兴：这是大跃进前的整体瓦解，正常且必经，把它当生病或行为问题就糟了。
  what_to_do:
    - 提前告诉自己"这是阶段不是退步"
    - 减少不必要的新刺激
    - 守住吃饭睡觉两条底线
    - 接受短期内你也会很累
    - 爆发期约 2-4 周自行过去
  failure_mode: |
    父母焦虑送医、强迫训练、责怪自己"是不是带坏了"，反而把暂时性倒退变成长期对抗模式。
  evidence_level: C


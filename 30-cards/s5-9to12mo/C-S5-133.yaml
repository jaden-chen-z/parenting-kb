card_id: C-S5-133
stages: [S5]
tags: [montessori, feeding, pincer-grasp, BLW]

front:
  title: 10-12 月自喂手指食
  hook: 蒙氏 + BLW 一致

back:
  why_matters: |
    8-9 月 — 宝宝拇指 + 食指能捏小物(pincer 钳形抓握)。
    10-12 月 — pincer 完全熟练。
    蒙氏立场:**这时期宝宝应该自己抓食物吃**(手指食物 / BLW),不再让大人勺喂为主。
    具体食物清单:
    - 蒸熟的胡萝卜 / 红薯条(软到牙龈能压碎)
    - 软水果块(香蕉 / 熟桃 / 熟梨)
    - 米饼 / 软面包小块
    - 煮熟的小米饭团
    - 软鸡蛋切丁操作:
    - **真碗真勺**(蒙氏特色,不用塑料卡通)
    - **跟家人同桌** — 把吃饭当社交场
    - **不催 / 不喂 / 不哄** — 他自己速度
    - **接受脏** — 围兜 + 餐桌下铺垫
    - **饱了让他下桌** — 不强吃光意义:
    - **pincer 训练** — 精细动作发育
    - **感觉饿饱** — 他自己学"什么时候停"(预防长大暴食)
    - **食物探索** — 不挑食的基础
    - **practical life** — 蒙氏 0-3 核心跟 BLW(baby-led weaning,宝宝主导添辅食)立场一致。
    AAP 也支持(只要食物切得对,不噎)。
  what_to_do:
    - 10-12 月主食手指食物而非泥糊
    - 食物切条 / 块,软度成人能轻易压碎
    - 真碗真勺,不用吸管餐具
    - 跟家人同桌
    - 不催不喂 — 饱了下桌
  failure_mode: |
    "怕噎,只能吃泥糊" — 软到能压碎的食物不噎。学吃硬的反而更安全。
    "他自己吃太慢,我喂快" — 慢是发育需要。喂快剥夺自己感觉饿饱。
    "桌子下面太脏" — 铺旧报纸 / 防水布,15 分钟收拾。比起独立性收益小代价。
  evidence_level: A


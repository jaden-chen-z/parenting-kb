card_id: C-S5-136
stages: [S5]
tags: [montessori, daycare, caregiver, selection]

front:
  title: 选 day care 8 条
  hook: 蒙氏看人不看招牌

back:
  why_matters: |
    妈妈返工 / 找阿姨 / 选托儿所,关键问题:**怎么判断谁能带?**
    Davies 给的 8 条蒙氏判断标准 — **看人,不看招牌**:
    1. **喂奶时眼神接触**(不刷手机,不放下瓶塞嘴里)
    2. **环境放松吸引人**(不杂乱,不太多刺激)
    3. **天然材质活动**(不全是塑料卡通)
    4. **睡眠区是 floor bed 或类似**(可自主起 / 睡)
    5. **6 月+ 自喂 + 低桌椅**(不放高 chair 喂)
    6. **慢动作 + 抱前先告知**(不一把抓起)
    7. **1 老师:3 宝宝**比例(蒙氏建议)
    8. **无电视 / 无屏幕**
    + 蒙氏额外 1 条:**少 turnover**(老师不频繁换)
    完美的"蒙氏 nido"在中国少 — 退而求其次:
    - 找**最接近条件**的(温和老师 + 自然材料 + 1:3 + 无屏幕)
    - 比起"蒙氏招牌"重要的是**实际做的**
    - 看人:温和 / 慢 / 尊重宝宝 + 老师
    - 现场观察:老师怎么跟宝宝说话?宝宝有反应吗?
    妥协怎么办?
    - 选 day care 后**跟他们沟通**(分享文章 / 邀请试讲座)
    - 部分妥协 OK — 重点保住"温和 + 安全 + 老师稳定"
    - 看不下去 — 换 / 自己带 / 几家家庭合办 / 找阿姨上门返工的家庭最常陷阱:**为了"附近 / 便宜 / 早教课多"而选**。Davies 立场:**这些都不如"老师温和稳定"重要**。
  what_to_do:
    - 实地访问 1 小时静观(不只听销售讲)
    - 看老师跟宝宝怎么互动(慢?温和?眼神?)
    - 8 条核对清单一项项打钩
    - 老师 turnover 高 = 红旗
    - 妥协可,但温和+稳定不能让步
  failure_mode: |
    "蒙氏招牌的就行" — 错。中国"蒙氏"很多没认证,实际做的差很多。
    "便宜 / 近 / 早教课多 = 好" — 这些都不如温和稳定重要。
    "他还小,谁带不一样" — 8-24 月是 caregiver 一致性最敏感期,选错代价高。
  evidence_level: B


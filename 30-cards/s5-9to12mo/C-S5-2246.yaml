card_id: C-S5-2246
stages: [S5]
tags: [safety, red_flag]

front:
  title: 牵拉肘:只哭不抬手 = 急诊
  hook: 别再"飞起"了

back:
  why_matters: |
    桡骨头半脱位(俗称"保姆肘"/"牵拉肘"),宝宝学步期高发。
    机制:**被大人拉手臂提起或"飞机"** → 桡骨头从环状韧带滑出。
    症状典型:**宝宝突然不动伤侧手臂 + 哭 + 不抬不抓**。
    海蒂建议:**急诊或骨科**让有经验医师手法复位 — 几秒钟就能解除疼痛。
    家长意义:这种"没看见摔"的急诊 80% 是牵拉肘。预防 = 别拉手提宝宝。
  what_to_do:
    - 绝不拉宝宝单手抬起 / "坐飞机" / 摆秋千
    - 突然不抬侧臂 + 痛 + 哭 → 怀疑牵拉肘
    - 痛严重前去医院:**冰敷 + 用纸板/杂志夹板固定**
    - 别自己尝试复位 — 让医生做(几秒钟搞定)
    - 拉手摔倒(常被忽视)也是常见诱因,牵小孩走时拉**衣服**而非手腕
  failure_mode: |
    "甩一甩自己好" — 长时间脱位致软组织损伤。
    自己学网上方法复位 → 错位反加重。
    "下次注意就好" — 不告诉照看者 → 重复发生。
    拉宝宝单手起床 / 拽手离开 → 一周内再次脱白。
  evidence_level: B


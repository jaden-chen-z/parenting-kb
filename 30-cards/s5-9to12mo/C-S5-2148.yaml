card_id: C-S5-2148
stages: [S5]
tags: [mainstream, language, milestone]

front:
  title: 12 月开口第一个真词
  hook: 有意指代才算

back:
  why_matters: |
    12 月里程碑是说出 1-3 个"真词"。前情:S4 已会喃喃发"妈妈爸爸"音节但只是练习发音。真词的标准是"有意指代":看到妈妈喊"妈妈"、要奶喊"奶奶"、指着狗喊"汪汪",发音可不准但必须稳定指向特定对象。这是符号语言的开端,比早不早更重要的是对不对。
  what_to_do:
    - 不数无意义"妈妈爸爸"音节
    - 看见对象重复说"这是妈妈"
    - 娃发音不准只回应不纠正
    - 18 月仍无真词找儿保
  failure_mode: |
    娃 8 月就喊"妈妈"全家欢呼以为天才,其实是吐音节,12 月真词反而落后没察觉,错过早期干预。
  evidence_level: B


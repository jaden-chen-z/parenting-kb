card_id: C-S5-299
stages: [S5]
tags: [self, 调谐, china_high_freq]

front:
  title: 扑克脸 = 玩手机代价
  hook: 妈没表情宝宝立刻崩
back:
  why_matters: |
    特罗尼克 1978 经典**"扑克脸实验"** — 斯特恩多次引用 — 是调谐重要性最戏剧化的证据。
    **直接回答"边带宝宝边玩手机"的代价**。

    **实验设计**:
    - 3 月宝宝跟妈面对面互动几分钟(正常)
    - 实验员示意妈**突然变扑克脸** — 没表情 + 不动 + 不回应
    - 录像观察宝宝反应

    **宝宝反应 3 阶段**:
    1. **立刻察觉**(几秒内)— 笑容消失,看妈表情
    2. **主动想唤回妈** — 笑、伸手、发声、拉妈衣服
    3. **崩溃** — 30-60 秒后,宝宝**社交退缩** + 哭 + 看别处

    **核心发现**:
    - 3 月宝宝**已能区分**"妈在 vs 妈在但心不在"
    - **后者比前者更让宝宝痛苦** — 因为破坏了"互动原型记忆"预期(C-S3-198)
    - 之后哪怕妈恢复正常,宝宝也要**几分钟后才完全恢复**

    **"边带宝宝边玩手机"的含义**:
    - 跟扑克脸几乎一样 — 妈在场但表情冻结、心不在场
    - 不是"宝宝看不出来" — 3 月即能区分
    - 长期 → 宝宝学到"我求关注没用" → 焦虑型依恋根源
    - 不只是宝宝的问题 — 妈也错过调谐机会

    **中国家长高频场景**:
    - 喂奶时妈刷手机
    - 推车时妈刷手机
    - 跟宝宝坐一起妈刷手机
    - 哺乳期妈累了"身体抱着,但脑子走神"
    - 这些**都跟扑克脸实验等价**

    **正确做法**:
    - **跟宝宝在场时主动放下手机** — 即使 5 分钟全心面对面比 30 分钟"在但不在"强
    - **真累或心不在场时不如不陪** — 让其他家人陪
    - **告诉宝宝你的状态** — "妈累了,我休息一下,然后陪你"(等孩子有语言自我后)
    - **接受不完美** — 偶尔扑克脸不会摧毁,但日常累积是问题

    **跟斯特恩"失调谐"(C-S5-294)+ "断裂-修复"(C-S5-298)关系**:
    - 扑克脸 = 真正失调谐的极端版本
    - 但偶尔扑克脸后能修复,反而能建立安全感(C-S5-298)
    - **长期**扑克脸累积 = 形成"和心不在的妈在一起"互动原型 → 焦虑型 / 回避型依恋根源

    跟鲍尔比第 2 卷 + 鲍秀兰本能母爱立场兼容。
  what_to_do:
    - 跟宝宝在场时放下手机
    - 真累不如不陪,让别人陪
    - 5 分钟全心 > 30 分钟分心
    - 偶尔走神不必焦虑
    - 长期累积才是问题
  failure_mode: |
    "我陪着宝宝就行,看不看他无所谓" — 错。特罗尼克数据 — 3 月即能区分,扑克脸直接造痛苦。
    边喂奶边刷手机日常化 → 形成"互动原型记忆" → 焦虑型依恋根源。
  evidence_level: A

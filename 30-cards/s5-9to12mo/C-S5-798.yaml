card_id: C-S5-798
stages: [S5]
tags: [temperament, discipline, distract, matsuda, japan]

front:
  title: "倔强是天生别硬怼"
  hook: "转移比讲理快"

back:
  why_matters: |
    松田 §283 给"我家娃 9 月就特别倔"的妈妈定心丸：
    1. 抢打火机后不松手哭 = 自我主见强;
    2. 是天生气质，不是你教坏的;
    3. 不是病，不要吃镇静剂;
    4. 不要硬怼 — 反复冲突会让孩子学会"逼父母让步"手段;
    5. 处方:**转移注意力** — 拿别的东西吸引;
    6. 不能避免冲突时装作不在意，
       但孩子表达和解时立即响应。
    跟 Lansbury "不分散注意"派立场对立(松田支持转移)，
    跟 Brazelton "1 岁第一次反抗"+ 鲍秀兰"忽视错误"一致。

  what_to_do:
    - 危险物冲突先用别的东西换
    - 带去户外让玩别的小朋友
    - 不能避免就装不在意，等孩子和解
    - 孩子示好立刻回应 — 别记仇
    - 不要每天闷家 — 越闷越冲突

  failure_mode: |
    硬怼派："不能让步" → 强夺打火机 + 训斥 → 孩子哭半小时 → 妈妈也哭。
    重复几次 → 孩子学会"哭闹支配父母"。
    Lansbury 派 vs 松田派的微妙立场对立:
    - Lansbury 不分散注意 → 直接面对情绪
    - 松田支持分散注意 → 9-10 月孩子讲不通理实战上,9-12 月孩子语言不够,松田的"转移"更可行。

  evidence_level: B


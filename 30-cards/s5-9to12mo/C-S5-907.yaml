card_id: C-S5-907
stages: [S5]
tags: [shonkoff, nrc, romanian_orphans, recovery, attachment]

front:
  title: "罗马尼亚孤儿可恢复"
  hook: "晚领养也能恢复发育"

back:
  why_matters: |
    NRC 综述 Ch 9 引罗马尼亚孤儿院领养研究 — 关键证据反"3 岁定终身"恐慌:
    **Ceausescu 时代孤儿院灾难**(1989 后曝光):
    - 数千婴儿在极度忽视的孤儿院长大(分配 1 个护士对 30 个婴儿)
    - 几乎无关系 / 极少互动 / 长期 cortisol 高
    - 多数 0-2 岁严重发育迟滞 + 行为异常
    **被领养后**:
    - 6 月领养的孤儿 → 恢复较完整(2 岁前是关键节点)(认知 / 情感 / 社交)
    - **2 岁前**领养 → 大部分恢复
    - 2-3 岁领养 → 部分恢复 + 部分持续问题
    - 4 岁后领养 → 困难大但仍可改善(情感调节最难)
    **NRC 立场**:
    - 这是**人类大脑可塑性的终极证据**
    - 即便 0-2 岁严重剥夺 — 仍可恢复
    - "3 岁定终身"是错的(罗马尼亚 ≠ 中国家长偶尔焦虑)
    - 但**2 岁是 sensitive period 的清晰边界** — 越早恢复越完整
    **对中国家长**:
    - 别因偶尔做不好就觉得"完了"
    - 极端剥夺都能恢复 — 普通波折更不必焦虑
    - 但**早识别 + 早干预**仍重要(eg 看出抑郁妈早治)
    - 信大脑可塑性 + 信关系修复力
  what_to_do:
    - 别因偶尔失误绝望
    - 信大脑可塑性
    - 关系修复仍可补
    - 早识别早干预
    - 不必"3 岁定终身"焦虑
  failure_mode: |
    "我前 6 月没陪好 — 完了" — 错,罗马尼亚极端剥夺 6 月领养仍可恢复。
    "他 4 岁了我才意识到要陪 — 太晚" — 错,4 岁仍可改善很多。
    "孩子好像有问题 — 等等看吧" — 错,早干预 sensitive 期更性价比高。
  evidence_level: A

  positions:
    issue: 0-3 岁是真"关键期"(critical)还是"敏感期"(sensitive)
    views:
      - school: Shonkoff / NRC
        source: SRC-025
        stance: 严格区分 critical(完全错过)vs sensitive(可补)。绝大多数发展是 sensitive 不是 critical,反"3 岁定终身"恐慌。
      - school: Gopnik
        source: SRC-015
        stance: 强调突触修剪 + 关键期窗口(语言 / 视觉 / 知觉重组),认知科学立场偏 critical 端。
      - school: Lillard(蒙氏)
        source: SRC-016
        stance: absorbent mind 强调 0-6 岁是哲学性关键期,但不是临床 critical(可补)。
      - school: 罗马尼亚孤儿数据
        stance: 即便严重剥夺,6 月领养仍可大幅恢复 → 实证偏 sensitive 论;支持 NRC 立场。
      - school: 中国主流
        stance: 普遍误信 critical 论 — "3 岁定终身" / "0-3 是黄金期错过不能补",制造焦虑。

front:
  title: 46 周第七跃迁:序列世界
  hook: 10 月开始"组装"东西

back:
  why_matters: |
    第 46 周(42-46 周 ≈ 10.7 月)是 Wonder Week 第七跃迁 — **序列世界**(World of Sequences)。
    怎么回事:大脑从"分类"升级到能理解**事情的次序** —
    要做一件事必须按特定顺序完成多步:
    - 之前是"拆":拆玩具 / 砸东西
    - 现在是"装":把东西按顺序放进盒子 / 拼起来 / 套起来 / 叠起来
    - 学会先看孔形再选积木 / 先瞄准再叠跃迁前烦躁 阶段(40-44 周)持续 3-7 周(本书最长之一)。
    跃迁后宝宝立刻:
    - 把积木叠起来(以前是推倒)
    - 拼套环 / 配对形状板
    - 模仿动作序列(看妈妈做就跟着做)
    - 理解"先后"概念(吃完饭再玩 / 穿衣服再出门)
    家长意义:**10 月宝宝突然爱"装"东西、爱模仿、跟你"配合"做事**,跃迁第一波"配合度"出现。
  what_to_do:
    - 42-46 周 3 C 信号 → 第七跃迁
    - 提供套环 / 拼图 / 形状配对玩具
    - 让宝宝看你做家务并模仿(扫地 / 折毛巾)
    - 用"先 X 再 Y"句式说话(培养序列感)
    - 跃迁完成后是"教会简单指令"的窗口
  failure_mode: |
    "10 月宝宝跟我对着干"(其实是序列大脑发现"我做完这步妈妈才高兴"的因果)。
    把跃迁期烦躁误判为"出牙 / 累了"。
    跃迁后宝宝模仿不当行为 → 责怪宝宝(她没有"对错"概念,只有"模仿"程序)。
  evidence_level: B


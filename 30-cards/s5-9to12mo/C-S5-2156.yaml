front:
  title: 12 月儿保+疫苗
  hook: MMR 水痘别漏

back:
  why_matters: |
    12 月儿保是第一年最重要的节点之一,做齐:身高体重头围、运动语言里程碑、贫血和血铅筛查、视力听力检查。前情:S4 已完成 9 月儿保。疫苗第四波密集期:MMR(麻腮风)、水痘、甲肝第一针、流脑 A+C。MMR 和水痘是减毒活疫苗,接种后 1-2 周可能轻度发热出疹,属正常反应不是过敏。
  what_to_do:
    - 提前预约带好疫苗本和病史
    - 接种当天避免剧烈运动
    - MMR 后 7-14 天可能轻度发热不慌
    - 每年儿保跟踪生长曲线
  failure_mode: |
    嫌孩子打针怕受罪故意推迟疫苗,错过群体免疫窗口;或接种后发热以为是病乱用抗生素。
  evidence_level: A


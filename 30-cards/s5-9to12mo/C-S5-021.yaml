front:
  title: 9 月学站夜醒机制
  hook: 浅睡期在排练

back:
  why_matters: |
    9-13 月宝宝夜醒不是退步，是大脑在浅睡期演练"扶站→走"的肌肉记忆。Brazelton 引研究：此阶段浅睡比例显著增加，正是为了写入复杂动作链路。哭着扶在床栏其实"半睡半醒"，干预反而打断学习。
  what_to_do:
    - 进屋先观察是否真醒
    - 把他平躺重新塞紧
    - 唱歌但别看眼睛别玩
    - 拍他下来比抱起来更有效
    - 用 lovey 玩偶辅助自我安抚
  failure_mode: |
    父母看他"被卡在床栏"心疼抱起，下次他记得"站起来就有人抱"，养成顽固夜醒。其实白天他能自己坐下，晚上也能。
  evidence_level: B


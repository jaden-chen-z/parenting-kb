card_id: C-S5-651
stages: [S5]
tags: [motor-发展, individual-difference]

front:
  title: 9-10 月运动差异大
  hook: 扶站爬坐都是正常

back:
  why_matters: |
    松田列 9-10 月运动差异 — 有扶站的、有爬移动的、有坐着用手脚移动的、还有完全没站欲望的。
    发育早的能扶东西站、不扶东西站几秒、甚至扶东西走。
    所有这些都是正常,差异因娃而异。
    "我家娃 10 月还不站"焦虑大可不必。
  what_to_do:
    - 别比同龄娃运动里程碑
    - 提供安全爬行空间
    - 不强行训练扶站
    - 看自家娃自己的进展
    - 12 月还不站再问儿科
  failure_mode: |
    妈天天扶娃练站 → 娃骨骼/髋未准备好,反致 O 型腿或髋关节脱位。
  evidence_level: B


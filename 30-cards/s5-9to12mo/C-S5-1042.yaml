front:
  title: "现代依恋 4 类型"
  hook: "4 类依恋综合升级"

back:
  why_matters: |
    Cassidy(via Ch 2 Thompson)综述 Bowlby + Ainsworth 现代版 — 依恋 4 类型:
    安全(B 型,55-65%)、抗拒(C 型,15-20%)、回避(A 型,15-20%)、紊乱(D 型,5-10%)。
    混乱型(D)是后期心理病理风险最高的 — 通常跟受虐 / 严重疏忽有关。
    一句话 — 依恋类型预测人生关系模板,8-12 月是建模期。
  what_to_do:
    - "12 月时回应 95%+ 是安全型条件"
    - "回应不一致 → 抗拒型(妈在不在不知道)"
    - "完全不回应 → 回避型(放弃求助)"
    - "回应同时恐吓 → 紊乱(妈又是港也是怕)"
    - "夫妻不一致影响最小,虐待 / 疏忽影响最大"
  failure_mode: |
    只防混乱型不防回避型 — 回避型娃看似乖,内里是放弃求助。
    Cassidy — 4 类型都要防,不只防极端。
  evidence_level: B


card_id: C-S5-071
stages: [S5]
tags: [philosophy]

front:
  title: B 安全型 ~60-65%
  hook: 妈是基地,玩得自在

back:
  why_matters: |
    Ainsworth 4 类依恋中**最健康**的一型,占大部分(60-65%)。
    陌生情境表现:
    - 跟妈在玩具房:**主动放下妈玩玩具**(基地清晰)
    - 妈走:**会哭 / 难过**(健康反应,不是"伪装无所谓")
    - 妈回来:**立刻迎接,要抱抱**
    - 抱起后:**几分钟就能继续玩**(被安抚+回到探索)
    家中观察(Ainsworth):比 A/C 哭得**少**(不是哭得多!),探索时间最长,12 月已经"在跟母亲交流方面发展出更加丰富和微妙的方式"。
    长大后:更自信、社交能力强、自我控制力适度、自我复原力高(Sroufe / Arend / Block 等纵向研究)。
  what_to_do:
    - 5 项母亲行为帮成 B 型:身体接触多 / 读懂信号 / 及时回应 / 配合节律 / 享受相处
    - 自家 12 月孩子能"探索 + 重聚迎接 + 玩可被分享"= 高概率 B 型
    - 不必焦虑日常小失误,整体趋势 + 大部分时间敏感就够
    - 详细 4 项操作见 C-S4-071
  failure_mode: |
    "我家孩子也哭也粘人,不像 B" — B 型也会哭也会粘人,关键在重聚后能否被安抚 + 回到玩。
    100% 完美回应 → 不必要 + 不可能,~70% 敏感回应即足够形成 B 型(Ainsworth)。
  evidence_level: A


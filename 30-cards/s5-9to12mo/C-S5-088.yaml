card_id: C-S5-088
stages: [S5, S6, S7]
tags: [milestone]

front:
  title: 怕生 = 陌生 + 靠近
  hook: 远处不怕近就怕

back:
  why_matters: |
    Bowlby 引 Anderson + Schaffer 研究:孩子的"怕生"不是看到陌生人就怕,
    而是**陌生 + 靠近 + 触摸**这 3 个变量同时发生才达到害怕阈值。
    重要新发现:**熟悉的亲友也可能引发恐惧反应** — 当亲戚 / 朋友热情快速靠近孩子时,
    孩子已认识 + 不熟悉的"亲热靠近方式"组合 = 触发恐惧。
    引发亲戚相关怕生的常见特征:眼镜 / 皱纹 / 胡须 / 大声笑 / 突然身体接触。
    家长意义:
    - 不是孩子"不懂事 / 不给面子",是发展期的合理反应
    - 让远房亲戚先远观 30 秒 → 慢慢靠近 → 不主动抱
    - 7-12 月起出现,2-3 岁达峰,3 岁后渐消(不是性格)
    - 怕生越明显反而越说明依恋形成良好(C-S4-068)
  what_to_do:
    - 陌生人来:让孩子先远看几分钟
    - 亲戚朋友提前打招呼"别马上抱别太热情"
    - 拍照合影别强求,孩子哭就停
    - 中年男长辈(胡子 / 嗓音粗)更容易触发
    - 怕生峰过去会自然消失,不必强训练
  failure_mode: |
    "亲戚来了不打招呼真没礼貌" — 这是发展性的不是教养性的;强迫只会加重恐惧。
    "都是熟人怎么会怕" — 熟人 + 突然热情靠近 = 也算复合刺激。
  evidence_level: B


card_id: C-S5-1038
stages: [S5]
tags: []

front:
  title: "手指食物自喂"
  hook: "8 月起让娃自己抓"

back:
  why_matters: |
    WHO + AAP 共识:8 月起加手指食物(条状/指状)训练自喂。
    意义:
    ① 训练抓握(pincer grasp 9 月发展)
    ② 训练咀嚼
    ③ 训练自我饱腹调节(看自己吃多少)
    ④ 训练手眼协调
    ⑤ 给娃 agency(自主感)
    安全:
    - 切条状不切圆片(防窒息)
    - 软度:能用拇指捏碎(蒸软南瓜/香蕉/煮软面条)
    - 一定坐高椅 + 大人在场
    - 不要分散注意力 + 不强迫中国通病:1 岁前都喂泥糊 + 怕脏不让自抓 → 错过抓握/咀嚼/自我调节训练窗。
  what_to_do:
    - "8 月起加手指食物(切条状)"
    - "切条不切圆片(防窒息)"
    - "蒸软南瓜/香蕉/面条/牛油果"
    - "坐高椅 + 大人监督 + 别抱着喂"
    - "怕脏让娃自抓 vs 怕脏一直喂泥糊 — 选前者"
  failure_mode: |
    1 岁前都喂泥糊 → 错过 8-12 月抓握/咀嚼/自我饱腹关键窗。
    8 月开始加手指食物,不要等 1 岁。
  evidence_level: A


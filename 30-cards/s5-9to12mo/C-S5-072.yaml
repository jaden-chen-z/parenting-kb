card_id: C-S5-072
stages: [S5]
tags: [philosophy, controversy]

front:
  title: A 焦虑回避型 ~20%
  hook: 看似独立,实际伪装

back:
  why_matters: |
    Ainsworth 4 类依恋中第二多(~20%)。
    陌生情境表现:
    - 跟妈在玩具房:玩得起来,但不太把妈当基地
    - 妈走:**似乎不在意**(生理测量心率上升,实际很焦虑,但表面伪装)
    - 妈回来:**漠然,不迎接,转身玩玩具**
    - 极端例子:妈走前妈来后心率都升高,但行为完全相反家中观察:**对身体接触有"靠近-回避冲突"** — 想接近但触碰只用脚或手指尖端,不真贴上。可能莫名打 / 咬妈妈,不显露感情。
    **母亲特征**:不喜欢身体接触、推开婴儿信号、限制亲密。
    长大后:回避亲密关系、表面"独立"、情感封闭、自我控制过度(Block 量表)。
  what_to_do:
    - 担心自家是 A 型 → 反思自己对身体接触是否舒服
    - 多抱(尤其 6 月前)— 即使初期不习惯
    - 主动响应宝宝信号(不要"忙完手头再说")
    - 很多 A 型来自母亲自己童年是 A 型(代际传递)— 治疗可帮助
    - 12-18 月还可改变(Vaughn 1979 数据 1/3 婴儿模式会变)
  failure_mode: |
    "我家孩子很独立,挺好的" — 可能是 A 型不是 B 型,需要观察重聚反应。
    硬塞拥抱给排斥身体接触的婴儿 → 加重回避(要敏感而非强迫)。
  evidence_level: B


navigation_role: |
  S5 段学走导航 hub — 中国家长高频焦虑话题之一,
  与"长牙 / 说话 / 加辅食"并列构成"邻居家娃比较综合症"。
  本卡首次把训练派(鲍秀兰)+ 自然派(Pikler/Lansbury)+ 实证派(Adolph)对照,
  关键决策点 = 是否教扶站 + 是否用学步车(后者跨派一致反)。
  跨派最强共识:**不用步行学步车 + 不焦虑比较月龄**。


card_id: C-S5-132
stages: [S5]
tags: [montessori, praise, controversy, philosophy]

front:
  title: 别说"宝宝好棒"
  hook: 蒙氏不主张直接夸奖

back:
  why_matters: |
    家长本能反应:宝宝做对什么 → "好棒!" / "聪明!" / "厉害!"
    蒙氏 + RIE + Carol Dweck 的成长型思维研究**全部反对**。
    问题:
    - "好棒"是**外部评价** — 宝宝学到"做对 = 妈妈夸 = 好"
    - 没夸 = 焦虑 / 怀疑自己
    - 长期形成**讨好型人格** + **怕失败**
    - 切断宝宝**自己感觉"我做到"**的内心喜悦
    Davies 提出"**alternatives to praise**"(不用夸的替代法):
    1. **观察描述**:"你把球放进了桶里"(描述事实,不评判)
    2. **过程肯定**:"你试了 5 次,终于做到了"(强调努力,不是结果)
    3. **不打断**:微笑看着就够,不说话(保护他的内在体验)
    4. **真情连接**:"看到你成功我很开心"(共享喜悦,不是评判)
    Carol Dweck 研究:
    - 被夸"你真聪明"的孩子 → 怕失败 / 选简单题
    - 被夸"你很努力"的孩子 → 接受挑战 / 享受过程
    Davies 在原书:"有时候,沉默才是最好的回应。"
    练习:把每天想说"好棒"的次数减半,换成观察描述。
  what_to_do:
    - 想说"好棒"时换成描述事实
    - 真要肯定 — 强调过程不强调天赋
    - 看到他成功 — 微笑就够,不说话
    - 减少"夸"的口头禅
    - 让他自己感受"我做到了"
  failure_mode: |
    "不夸怎么知道我看见他了" — 微笑+眼神接触 = 看见。不需要言语。
    "外国孩子动不动 good job 也没事" — 美国教育界自己也在反思 praise 文化。
    "总不能从来不肯定吧" — 可以肯定,但描述事实/过程,不评判结果。
  evidence_level: B


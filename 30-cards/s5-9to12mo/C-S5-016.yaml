card_id: C-S5-016
stages: [S5]
tags: [philosophy]

front:
  title: 教物名称要准确,不要模糊
  hook: 是"手表"不是"几点了"

back:
  why_matters: |
    11-12 月正建立准确的词语概念,**家长教物名称必须准确** — 否则宝宝会形成错误概念。
    鲍秀兰**经典负面例子**:对着手表说"几点了",宝宝可能误以为手表的名称是"几点了"。
    正确做法:**先教名称("这是手表"),会名称后再教用途/特征**。
    词的精确性影响宝宝的概念分类和后续语言发展。
  what_to_do:
    - 教物体先说名称("这是手表")
    - 名称会了再教用途("可看时间")
    - 不要用问句代替名称("几点了")
    - 名称要规范不用方言/小名
    - 反复强化(每天 1-2 次,每次不长)
  failure_mode: |
    "几点了"代替"手表"→ 宝宝形成错误概念,后续纠正困难。
    一种东西多个名称(碗/饭碗/小碗)→ 宝宝迷惑。
  evidence_level: C


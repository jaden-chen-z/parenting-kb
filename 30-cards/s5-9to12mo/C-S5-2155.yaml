front:
  title: 花生稀释后 1 岁可吃
  hook: 整粒=窒息

back:
  why_matters: |
    LEAP 研究确立早期引入花生显著降低过敏率,AAP 2017 年指南调整为 4-6 月起按个体风险引入。前情:S4 可能已尝试过花生酱。1 岁后宝宝可继续吃花生制品,但整粒花生是 4 岁前最危险的窒息食物之一,因为大小正好卡气管。规则是:花生酱必须稀释、不给整粒、永远在大人监督下吃。
  what_to_do:
    - 花生酱兑温水/酸奶稀释成稀糊
    - 4 岁前禁止整粒花生坚果
    - 第一次吃后观察 2 小时
    - 嘴肿/呼吸困难立即送医
  failure_mode: |
    给娃整粒花生当零食,卡气管 4 分钟脑缺氧死亡;或抹厚厚一坨花生酱黏在上颚也能造成窒息。
  evidence_level: A

glossary_refs: [G-ABBR-LEAP, G-TERM-LEAP-trial]

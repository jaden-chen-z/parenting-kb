card_id: C-S5-074
stages: [S5]
tags: [philosophy]

front:
  title: 12 月依恋预测 5 岁人格
  hook: 不是命定,但相关性强

back:
  why_matters: |
    Bowlby 第十八章(1982 增补)综合 Sroufe / Arend / Block 等纵向研究:
    **12 月依恋类型 → 5 岁时人格特征显著相关**。
    Arend, Gove & Sroufe (1979):26 位 18 月大孩子 4 年后(5 岁)再测,B 型的 12 位 vs A/C 型的 14 位:
    - 自我复原力:B 型显著高(高复原 = 灵活应对变化、能用资源)
    - 自我控制力:B 型适度,A 型过度控制,C 型过低控制
    - 好奇心:B 型显著高
    - 同理心:B 型对其他孩子的痛苦更同情
    - 跟成人合作度:B 型高
    所有这些**在母亲不在场时**也保留 — 已**变成性格本身**。
    家长意义:12 月依恋质量是真实的发育输入,不是玄学。
  what_to_do:
    - 重视 9-12 月依恋质量(可观察的 4 项行为:跟随/迎接/基地/陌生人警觉)
    - 但不必"命定论":12-18 月还可改善;新关系 / 治疗 / 自我成长终身可调
    - 如果 12 月明显是 A/C → 考虑就找儿童心理医生评估,早干预效果好
    - 5 岁前家庭稳定 + 主依恋人不分离 = 给孩子最大礼物
  failure_mode: |
    "12 月没做好,这辈子完了" — Bowlby 强调依恋模式可变,治疗 / 新关系都可改。
    "孩子人格定了不用管" — 错过持续干预机会。
  evidence_level: B


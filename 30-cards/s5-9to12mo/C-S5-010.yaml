card_id: C-S5-010
stages: [S5]
tags: [philosophy]

front:
  title: 9 月起设小障碍练思维
  hook: 日本"障碍训练法"

back:
  why_matters: |
    9 月起宝宝出现延迟模仿(deferred imitation):24 小时后还记得按键让玩具出声。
    日本儿童专家提出"障碍训练法":在和宝宝游戏时设小小障碍,让宝宝动脑筋克服 — 培养直观行动思维 + 解决问题能力。
    鲍秀兰强调:让宝宝自己努力达到,不是替他做;但循序渐进、寓教于乐,别让宝宝感到学习是负担。
  what_to_do:
    - 6-7 月用布盖玩具,让宝宝去掉布找
    - 用线系玩具放远处,让宝宝拉线取
    - 玩具和宝宝间放小障碍(被子/椅垫)
    - 看宝宝想办法绕过 / 推开取
    - 成功了表扬,卡住适当提示
  failure_mode: |
    替宝宝做(直接拿过来)→ 错过思维训练。
    设过难障碍 → 反复失败丧失兴趣。
  evidence_level: C


front:
  title: "Tomasello 文化传递"
  hook: "9 月共关注是人独有"

back:
  why_matters: |
    Tomasello(via Ch 11 Eisenberg 综述)— 9-12 月 joint attention(共同关注)是人类独有,
    猩猩也会单独关注但不会跟你共同关注同一个东西。机制 — 这是文化学习的起点,
    宝宝看你看哪 → 把你眼里世界复制进自己脑里。一句话 — 9 月起娃在复制你而不只是看你。
  what_to_do:
    - "9-12 月主动用看!引导关注"
    - "你看哪他看哪 = 学习渠道"
    - "命名你看的(看!这只小狗)"
    - "你不感兴趣的他也不学"
    - "你的好奇心是娃的学习开关"
  failure_mode: |
    觉得 9 月没意识不培养共同关注。Tomasello — 错过 9-12 月关键窗口,
    后期文化学习能力建在弱基础上。
  evidence_level: B


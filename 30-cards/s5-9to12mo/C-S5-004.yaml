front:
  title: 分离焦虑 10-18 月峰值,5 招缓解
  hook: 健康依恋的标志,不是问题

back:
  why_matters: |
    分离焦虑(separation anxiety)10-18 月达峰,2 岁后期消退。
    认知基础是物体永久性(C-S4-003)— 知道你只是"暂时不见"才会担心(本来不知道你存在就不会想)。
    AAP 直接说:健康依恋反而让分离焦虑更早出现但通过更快。
    不是性格弱,是认知里程碑。
  what_to_do:
    - 不在累 / 饿 / 病时离开(累加状态会失控)
    - 离开不小题大做(快速告别 + 不流连)
    - 让看护人立刻转移注意力(玩具 / 零食)
    - 在家从短分离练起(去隔壁房间几分钟)
    - 托儿所第一周陪几分钟再离开
  failure_mode: |
    偷偷离开不告别 → 安全感受损,下次焦虑反而加重。
    每次哭就赶回来 → 强化焦虑,永远过渡不了。
    在他累 / 饿 / 病时离开 → 几乎必崩溃。
  evidence_level: A


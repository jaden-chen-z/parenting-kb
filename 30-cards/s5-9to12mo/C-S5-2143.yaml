front:
  title: 12 月不走完全正常
  hook: 别比也别催

back:
  why_matters: |
    宝宝学步窗口很宽,9 到 17 月独走都属正常范围。前情:S4 已能扶站扶走,小腿肌肉和平衡感还在长。12 月不会独走绝大多数不是病,而是个体差异:腿型、体重、性格、爬得多不多都会推迟独走时间,不代表智力或运动有问题。
  what_to_do:
    - 12 月不走先观察到 15 月再急
    - 多趴爬少抱,少穿厚底鞋
    - 扶手矮家具创造扶走环境
    - 18 月仍不走找儿保医生
  failure_mode: |
    被亲戚"别人家娃 10 月就走了"PUA,买学步车强行催走反而伤腿、推迟独走。
  evidence_level: A


card_id: C-S5-087
stages: [S5, S6]
tags: [milestone]

front:
  title: 寄养换家年龄越大越痛苦
  hook: 7 月起就开始记得了

back:
  why_matters: |
    Yarrow 1963 经典研究:观察 7-12 月婴儿从临时寄养家庭转移到长期收养家庭后的反应。
    结果反直觉:
    - **7-12 月所有婴儿**都表现出明显焦虑(不是只有大孩子)
    - **年龄越大,痛苦严重程度和普遍程度反而越高**(原话:"超过这一年龄范围时,
      痛苦的严重程度和普遍程度随着年龄的增长而增加")
    机制:7 月开始依恋形成(C-S4-067),孩子已经在脑中**记住**了原寄养人;转移 = 失去一个依恋人物。
    家长意义:
    - 6 月以后才寄养 / 转手照顾人,**心理代价已经存在**
    - "孩子小不记得"是误信 — 7 月起的转换都会留痕
    - 月嫂换人 / 阿姨换人,7 月以后都要尽量稳定
    - 必须换时,新旧之间要有 ≥ 1 周交接重叠
  what_to_do:
    - 6 月以后稳定主要照顾人,不轻换
    - 月嫂签合同到 ≥ 12 月
    - 必须换:新旧 1-2 周重叠陪伴
    - 别在 6-18 月做大改变(搬家 / 换城)
    - 老人来回轮换照顾 = 多次小型寄养转换,累积伤害
  failure_mode: |
    "他这么小哪记得人" — Yarrow 7 月数据明确反驳;7 月起每一次依恋人切换都有心理代价。
    "外婆奶奶换着照顾省钱省力" — 累积起来 = 多次小型转换,风险等同寄养换家。
  evidence_level: B


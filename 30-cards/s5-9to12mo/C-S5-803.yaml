card_id: C-S5-803
stages: [S5]
tags: [emergency, choking, foreign_body, matsuda, japan, red_flag]

front:
  title: "异物吞了别狂找"
  hook: "看表情判咽喉"

back:
  why_matters: |
    ⚠️ **2026 修订**:松田 §284 (1967) 原书写"急救:头朝下抓双脚摇晃" — 这是 1960s 日式做法,
    现代 AAP/AHA(美国儿科学会/心脏协会)2020 急救指南**不推荐倒提摇晃**(头部损伤风险)。
    本卡 what_to_do 已按现代标准改写。

    判断流程(松田观察 + 现代急救):
    1. 满不在乎玩 → 进胃了 — 不必慌(围棋 / 硬币 / 纽扣 / 戒指都能自然排出);
    2. 翻白眼痛苦表情 → 堵食道 — 急去耳鼻喉科;
    3. 不停咳嗽 / 哭 / 哭声嘶哑 → 进气管 — 立即急救;
    4. **窒息急救(AAP/AHA 2020)**:5 次背部拍击 + 5 次胸部按压循环;
    5. **不要用手指掏嗓子** — 可能把异物推得更深;
    6. 进胃后:每次大便检查,2-3 周内会排出;
    7. 不给吃泻药;
    8. 24 小时内透视确认。

  what_to_do:
    - 看孩子表情 — 满不在乎 = OK
    - 翻白眼 / 嘶哑哭 = 立即拨 120 + 启动急救
    - 窒息急救(AAP/AHA 2020):脸朝下趴大人前臂,5 次背部拍击 + 翻身 5 次胸部按压,循环
    - 不用手指掏嗓子
    - 不倒提摇晃(老法,头部损伤风险)
    - 大便检查 2-3 周;电池/磁铁/尖物 24h 内透视

  failure_mode: |
    妈妈第一反应:用手抠嗓子 → 把异物推得更深 → 急诊。
    用 1960s 倒提摇晃法 → 头部损伤风险。
    "找到了什么"焦虑:跟着孩子翻地毯 / 看监控 → 浪费时间不该急诊。
    针 / 刀片 / 玻璃碎片即使尖也常自然排出 — 但放好别再让孩子拿到。
    电池 / 磁铁不一样 — 必须 24 小时内透视(化学腐蚀风险)。

  evidence_level: A


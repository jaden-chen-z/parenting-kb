card_id: C-S5-076
stages: [S5]
tags: [controversy]

front:
  title: 抱毯子玩偶不是怪癖
  hook: 替代性"妈妈",1/3 婴儿都有

back:
  why_matters: |
    家长焦虑:"宝宝离不开那条破毛巾,睡觉得抱着,丢了崩溃" — 这正常吗?
    Bowlby 综合 Stevenson (1954) + Schaffer & Emerson:**1/3 苏格兰婴儿在 9 月-2 岁形成对特定柔软物的依恋**(毯子 / 玩偶 / 棉布块),持续可到学龄。
    Winnicott 把它称"过渡性客体"(transitional object),Bowlby 简化为**"替代性物体"** — 当真妈不在,这些柔软物体替代行使依恋功能(吸吮 + 拥抱)。
    关键发现:**爱抱玩偶的孩子也是爱被妈妈抱的孩子**,不是替代妈妈,是延伸。
    完全没"心爱物"的孤儿院婴儿反而更让人担心。
  what_to_do:
    - 9 月起注意宝宝是否对某物特别依恋
    - 若有,不阻止(扔掉会引发严重崩溃)
    - 准备**1-2 个备份**(同款,定期轮换洗保持气味相似)
    - 出门 / 睡觉 / 看医生时让宝宝带着
    - 上幼儿园前可帮宝宝过渡(留家中或带去都可)
  failure_mode: |
    "他都几岁还抱破毛巾,丢人"硬扔 — 引发剧烈情绪反应,损伤安全感。
    完全不让有"心爱物"反而是问题信号(可能反映家庭情感缺失)。
  evidence_level: B


card_id: C-S5-2153
stages: [S5]
tags: [mainstream, sleep, feeding]

front:
  title: 戒夜奶 1 岁前后
  hook: 营养不缺先停奶

back:
  why_matters: |
    1 岁宝宝白天饮食营养够,夜奶在生理上不再必需,主要是习惯性需求。前情:S4 通常已能睡 6-8 小时连续。继续夜奶会:打断深睡眠影响生长激素分泌、增加奶瓶龋风险、让娃白天食欲下降形成恶性循环。海蒂建议 9-12 月开始逐步戒,1 岁前后大多数娃可以全程睡整夜。
  what_to_do:
    - 白天保证奶量和辅食充足
    - 夜醒先观察不立刻喂奶
    - 逐次减夜奶量(母乳缩时长配方稀释)
    - 配偶代替妈妈安抚减少奶联想
  failure_mode: |
    一夜醒就喂奶图省事,2-3 岁还在喝夜奶,既影响娃睡眠质量又造成龋齿,妈妈累垮娃也没养好。
  evidence_level: B


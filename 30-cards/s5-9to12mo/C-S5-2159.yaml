card_id: C-S5-2159
stages: [S5]
tags: [mainstream, social, shyness]

front:
  title: 害羞是性格不是病
  hook: 别贴"胆小"标签

back:
  why_matters: |
    9-15 月宝宝面对生人躲妈妈怀里、不愿打招呼,这是分离焦虑+认生的延续,也是天生气质类型(高反应型)的体现。前情:S4 已开始认生。Kagan 长期研究表明,15-20% 宝宝天生就是"慢热型",这不是缺陷而是性格,强行推上前打招呼会强化焦虑;接纳并提供安全基地,娃自己会按节奏融入。
  what_to_do:
    - 不强迫打招呼也不替娃道歉
    - 让娃在妈妈怀里观察 5-10 分钟
    - 提前告诉娃要见谁让有预期
    - 别当娃面贴"胆小害羞"标签
  failure_mode: |
    亲戚一来就推娃喊人,娃哭被骂"没礼貌",长期下来加重社交焦虑甚至学龄期选择性缄默。
  evidence_level: B

glossary_refs: [G-TERM-attachment, G-TERM-inhibited-temperament]

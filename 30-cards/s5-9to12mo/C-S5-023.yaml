front:
  title: 9 月断奶不必赶
  hook: 没有"最佳窗口期"

back:
  why_matters: |
    9 月宝宝对乳房瓶子分心，父母焦虑"不戒就戒不掉了"。Brazelton 直接反驳：根本没有"现在不戒以后更难"的科学依据。在自主吃固体高速发展期，奶反而是少数能让他放心退行的安全港，过早强戒反伤依恋。
  what_to_do:
    - 先掐午间这一顿（最不情感）
    - 早晚保留作为情感仪式
    - 用杯子补 16 oz 奶量
    - 跟着孩子节奏不抢跑
    - 妈妈也允许自己舍不得
  failure_mode: |
    听信"6 个月必须断"的群体压力快刀斩乱麻，宝宝突然失去最安全的退行通道，转而抓住瓶子或咬指甲等替代品，妈妈也情绪低落。
  evidence_level: B


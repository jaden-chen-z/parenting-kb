navigation_role: |
  S5 段断母乳导航 hub — 中国家长 9-15 月返工高峰期最高频痛点。
  5 派立场分散在 5+ 来源,本卡首次综合对照。
  关键区分:**断母乳 ≠ 断奶瓶 ≠ 断奶睡** — 三者各有 hub:
  - 断母乳 = 本卡(5 派,WHO 推延长)
  - 戒奶瓶 = C-S5-190(3 派,12-18 月)
  - 戒夜奶 / 睡眠 = C-S5-191(5 派)
  跨派最强共识:**没有"必须 X 月断"硬规则,看妈妈+孩子状态**。


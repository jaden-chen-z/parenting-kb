card_id: C-S5-005
stages: [S5]
tags: []

front:
  title: 12 月儿保 4 必查
  hook: 一次儿保解决多件事

back:
  why_matters: |
    well-child visit(儿保)= AAP Bright Futures 0-21 岁标准化预防保健访视(不等同于生病看医生)。
    AAP 推荐 0-2 岁高频访视:出生 / 3-5 天 / 1m / 2m / 4m / 6m / 9m / **12m** / 15m / 18m / 24m。
    12 月儿保是 0-1 岁收官 + 1-2 岁起点,**多项跨段评估同时做**:
    ① **铁缺乏 + 贫血筛查**(全员,不分喂养方式 — 见 C-S3-006)
    ② **牙医**(第一颗牙后 6 月内,不晚 12 月 — 见 C-S3-012)
    ③ **走路评估**(独走或至少 cruise — 见 C-S5-002)
    ④ **语言评估**(理解 + 表达 — 见 C-S5-003)
    还有疫苗 / 身高体重 / 全维度发育里程碑筛查。
  what_to_do:
    - 12 月儿保提前预约
    - 必查 4 项:铁血常规 + 牙医 + 走路 + 语言
    - 准备问题清单(睡眠 / 喂养 / 行为 / 担心点)
    - 第一颗牙若超 6 月没见牙医 → 同时安排
    - 12 月疫苗按计划(MMR / 水痘 / Hib 等)
  failure_mode: |
    跳过 12 月儿保(觉得"我家健康不必去")→ 缺铁 / 牙问题 / 早期发育延迟漏诊。
    去了不准备问题清单 → 出门后才想起好多想问的。
  evidence_level: A


card_id: C-S5-1041
stages: [S5]
tags: [saarni, emotion_strategies_9_12mo, lerner_v3]

front:
  title: "9 月起调情绪靠妈"
  hook: "他求助让妈帮调节"

back:
  why_matters: |
    Saarni(Ch 5)综述 — 9-12 月情绪调节是"co-regulation"(共同调节),不是自我调节。
    标志 — 紧张时他爬向你,要妈抱(不是会自己平静)。这阶段你是他的外置情绪 PFC,
    每次帮他平静都是在装他自己的内置 PFC 模板。一句话 — 9-12 月让他独自哭学不到自我调节,只学到孤立。
  what_to_do:
    - "他紧张爬来抱起来"
    - "命名:你害怕了对吗"
    - "深呼吸示范给他"
    - "平静后再聊发生啥"
    - "别说大孩子不应该让妈抱"
  failure_mode: |
    9 月起就要他"独立平静"(让他哭"学")。
    Saarni — 9 月没自我调节硬件,让他独哭学到的不是自我调节,是妈不可信。
  evidence_level: B


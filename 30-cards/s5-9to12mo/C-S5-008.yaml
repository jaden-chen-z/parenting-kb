front:
  title: 9 月扶站独站 + 蹲下捡训练
  hook: 站到坐转换是站立基础

back:
  why_matters: |
    9 月起宝宝有强烈站立意愿,从**扶站 → 撤物独站**是关键过渡。
    9 月-1 岁宝宝有"反复做某动作的天然兴趣",可让他们多次练习蹲下捡玩具。
    鲍秀兰强调:**蹲下捡需要手与身体稳定配合**,是站立姿势平衡发展的关键 — 站着够不到的玩具,要让他自己蹲下取。
  what_to_do:
    - 准备扶物(沙发 / 床栏 / 扶手椅)
    - 让宝宝靠物站立练习
    - 逐渐撤去支撑,让独站片刻
    - 把玩具放脚下,鼓励蹲下捡
    - 在身边保护,防摔倒
  failure_mode: |
    保护过度全程扶持 → 失去练习机会,独站延迟。
    放手不防 → 摔倒影响下次练习信心。
  evidence_level: B


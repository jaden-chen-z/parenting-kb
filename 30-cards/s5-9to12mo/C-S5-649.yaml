front:
  title: 反严格断奶食谱
  hook: 每日 2 次代乳就够

back:
  why_matters: |
    松田调查现实 — 9-10 月婴儿,大多数每日 2 次代乳食品,而非杂志要求的 3 次。
    食谱要求每日 3 次粥(每次 100-150 g),早餐 8-9 点喂粥不现实。
    爸 7-8 点上班妈忙不开 + 妈在厨房就没时间带娃户外。
    "没按食谱"不是失职,是适应真实家庭节奏。
  what_to_do:
    - 接受每日 2 次代乳已足
    - 早餐用面包/面条简化
    - 中晚 2 顿用粥+菜+蛋
    - 有时间陪户外比"3 顿粥"更重要
    - 别因"没做到"内疚
  failure_mode: |
    妈死磕食谱 3 次粥 → 整天厨房 + 抑郁 + 娃没户外,反误娃运动发育。
  evidence_level: B


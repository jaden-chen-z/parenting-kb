card_id: C-S5-070
stages: [S5]
tags: []

front:
  title: 12 月可测依恋类型
  hook: 陌生情境实验 4 类

back:
  why_matters: |
    Ainsworth (1969) 设计的**陌生情境实验**(Strange Situation):20 分钟实验室程序,
    把 12 月大婴儿对母亲的依恋分 4 类。这是依恋理论从抽象走向**可测量科学**的关键工具。
    **重点不是哭多少**,是**母亲第一次回来时婴儿的反应**:
    - 立刻迎接 + 安抚后能玩 = B 安全
    - 漠然回避 = A 焦虑回避
    - 既要又推 = C 焦虑抗拒
    - 行为混乱 + 身体僵硬 = D 混乱(后期补充)
    家长意义:不要自己测,但**理解 4 类**能让你诊断自家互动模式。
  what_to_do:
    - 不要在家自己做 SST(需要受训观察者评估细微反应)
    - 知道自家可能是哪一类:
      - 回来你迎,他扑过来 = B 概率高
      - 回来你迎,他玩自己的 = A 风险
      - 回来你迎,他既要抱又挣扎 = C 风险
    - 担心 → 找儿童心理医生评估(不是育儿书自学)
    - 大部分中产家庭 ~60% 是 B 安全型,不必过分焦虑
  failure_mode: |
    自己做 Strange Situation 测试 → 不可靠,不要做。
    "我家孩子是 A 型/C 型,完了" — 12-18 月期间还可改善(C-S5-075)。
  evidence_level: A


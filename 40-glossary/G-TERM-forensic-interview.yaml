one_liner: |
  Bruck-Ceci 立场 — 开放式问 + 不重复 + 不暗示 + 录像可见。中国法律体系建议的儿童证人询问标准。

detail: |
  ## 定义
  Bruck-Ceci 立场 — 开放式问 + 不重复 + 不暗示 + 录像可见。中国法律体系建议的儿童证人询问标准。

  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版)反复引用。

  ## 跨派对接
  V4 综述权威立场,跨章节多次出现,跟现库其他派有立场对照。

  ## 中国家长意义
  详见相关知识卡。

key_facts:
  - "Lerner V4 反复引用术语"
  - "应用心理学综述权威定义"


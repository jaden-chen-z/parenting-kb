glossary_id: G-ABBR-Hib
type: abbreviation
display_name: Hib

full_name_en: Haemophilus influenzae type b
full_name_zh: 流感嗜血杆菌 b 型疫苗

one_liner: |
  预防 Hib 细菌引起的细菌性脑膜炎、肺炎、会厌炎(致命)。中国一类苗(免费)2-3-4 月接种 + 18 月加强;美国 AAP 2-4-6-12-15 月四针。Hib 疫苗是 1990 年代以来最成功的婴儿疫苗之一,5 岁前严重 Hib 病例下降 99%。

detail: |
  ## 是什么
  Hib = Haemophilus influenzae type b(b 型流感嗜血杆菌)
  - 不是流感病毒 — 是细菌(被命名时被误以为是流感原因)
  - 主要风险:0-5 岁严重感染(脑膜炎 / 会厌炎 / 肺炎)
  - 90% Hib 严重病例在 5 岁以下,1 岁内最高峰

  ## 疫苗时间表

  ### 中国一类苗(免费)
  - 2 月、3 月、4 月各一针(基础三针)
  - 18 月加强一针(总四针)
  - 部分地区合并 5 联苗(DTaP + Hib + IPV)自费

  ### 美国 AAP 时间表
  - 2 月、4 月、6 月、12-15 月(四针)
  - 5 岁后不需要(自然免疫已形成 + 风险大降)

  ### 早产儿
  按实际日龄(不是矫正月龄)接种 — 早产儿 Hib 风险更高

  ## 不接种的后果
  Hib 严重病例致死率:
  - 脑膜炎:5-10% 死亡 + 30% 后遗症(智力下降 / 听力受损 / 癫痫)
  - 会厌炎:急性窒息死亡(2-3 小时进展)
  - 肺炎:严重型可致死

  AAP 数据:1980 年代 Hib 是美国 5 岁内细菌性脑膜炎首因;Hib 疫苗后下降 99%。

  ## 与其他疫苗的组合
  现代多 5 联苗(DTaP + Hib + IPV)= 一针打 5 个,减少注射次数:
  - 中国市场:潘太欣(赛诺菲)/ 万欣沛(智飞)
  - 美国:Pentacel / Pediarix

  ## 误区
  - "Hib 是流感疫苗" — 错。Hib 是细菌,流感是病毒,完全不同
  - "1 岁后没必要" — 错。1-5 岁仍有风险,18 月加强针重要
  - "我家宝宝从不感冒不用打" — 错。Hib 不预防普通感冒,预防的是致命细菌感染

key_facts:
  - Hib 是细菌不是病毒(命名误导)
  - 预防 5 岁内脑膜炎 / 会厌炎 / 肺炎(致命)
  - 中国一类苗 2-3-4 月 + 18 月加强(共四针)
  - 美国 AAP 2-4-6-12-15 月(共四针)
  - 1990s 起严重病例下降 99%
  - 早产儿按实际日龄接种(不用矫正)


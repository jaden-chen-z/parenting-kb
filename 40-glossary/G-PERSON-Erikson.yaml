glossary_id: G-PERSON-Erikson
type: person
display_name: Erikson

full_name_en: Erik Erikson
full_name_zh: 埃里克·埃里克森

one_liner: |
  德裔美国心理学家 + 精神分析师(1902-1994)。提出"人格发展 8 阶段"理论(从婴儿期"信任 vs 不信任"到老年"完整 vs 绝望"),是现代育儿心理学最广泛引用的发展框架之一。提出"identity crisis"(身份认同危机)术语,主张情绪 / 社会发展比认知发展更重要。

detail: |
  ## 个人背景
  - 1902-1994 德裔美国心理学家(本姓 Salomonsen,1939 入美籍后改姓 Erikson)
  - Anna Freud 学生(蒙特梭利学校教师 → 精神分析训练)
  - 哈佛 / 耶鲁 / 加州大学伯克利教授
  - 1950 年代提出"identity crisis"术语,影响 60-70 年代美国青年文化

  ## 主要贡献:8 阶段心理社会发展理论

  对育儿知识库相关的前 4 阶段:

  | # | 阶段 | 月/岁 | 核心冲突 | 健康解决 → 形成 |
  |---|---|---|---|---|
  | 1 | Infant | 0-18 月 | **信任 vs 不信任** | hope(希望) |
  | 2 | Toddler | 1-3 岁 | **自主 vs 羞耻怀疑** | will(意志力) |
  | 3 | Preschool | 3-6 岁 | **主动 vs 内疚** | purpose(目的感) |
  | 4 | School age | 6-12 岁 | **勤奋 vs 自卑** | competence(能力感) |

  每阶段有"危机"必须解决 — 解决好 → 进下阶段;解决不好 → 携带创伤进下阶段。

  ## 对育儿知识库的核心论点

  ### 1. "情绪 / 社会发展 > 认知发展"
  Erikson 反对早期 IQ 训练 / flash cards / 早教,主张:
  - 0-18 月最重要的是"信任"(Trust)— 而非语言 / 动作里程碑
  - 1-3 岁最重要的是"自主"(Autonomy)— 而非如厕训练 / 命名物体
  - 3-6 岁最重要的是"主动 / 内疚"(Initiative vs Guilt)— 而非读写

  Brazelton 引用 Erikson 反早教的论点见 C-S7-020(3 岁前别教读写)。

  ### 2. "信任"是终身基底
  0-18 月妈妈可靠 + 一致回应 → 宝宝形成"世界是可信的"基底信念 →
  影响后续所有关系(成年依恋 / 工作信任 / 婚姻信任)。
  Bowlby 内部工作模型(IWM)与 Erikson "信任"是同一现象的两个名字。

  ### 3. "自主 vs 羞耻怀疑"对应 1-3 岁的 No 阶段
  18 月狂说 No 不是叛逆,是 Erikson 第二阶段"自主"形成期。
  父母如果常用"羞耻 / 怀疑"打压(嘲笑 / 否定 / 撤回爱)→ 形成"自我怀疑"基底。
  Brazelton C-S6-022 直接引 Erikson 解读 No 阶段。

  ## 与中国家庭的张力
  中国传统育儿与 Erikson 4 阶段冲突点:
  - "0-1 岁喂饱就好" — 错过信任建立窗口
  - 18 月 No → "你这个臭小子叛逆" — 打压自主性
  - 3-5 岁早教 / 兴趣班 → 错过"主动 / 内疚"自然探索期
  - "你怎么这么没用" — 6-12 岁直接植入自卑

  ## 与其他流派的关系
  - vs Piaget:Piaget 强调认知发展,Erikson 强调社会情绪 — Brazelton/AAP 跟 Erikson
  - vs Bowlby:Erikson "信任"= Bowlby 安全依恋(术语不同概念同)
  - vs 蒙氏:Erikson "自主"形成期 = 蒙氏"敏感期"+ "yes space"哲学根基
  - vs Freud:Erikson 是 Freud 心理性欲阶段的扩展 + 社会化(superego 之外加 society)

key_facts:
  - 1902-1994 德裔美国心理学家
  - 提出 8 阶段心理社会发展理论(从婴儿到老年)
  - 创造 "identity crisis" 术语
  - 主张情绪/社会发展 > 认知发展(反早教)
  - 影响 Brazelton / Bowlby / 蒙氏育儿哲学
  - 著作:《Childhood and Society》(1950)/ 《Identity: Youth and Crisis》(1968)


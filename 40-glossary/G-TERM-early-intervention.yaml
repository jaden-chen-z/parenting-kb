glossary_id: G-TERM-early-intervention
type: term
display_name: 早期干预 (early intervention)

full_name_zh: 早期干预
full_name_en: Early Intervention

one_liner: |
  0-3 岁针对发育迟缓(运动 / 语言 / 社交 / 认知)的专业干预。美国 IDEA Part C 法律保障免费;中国部分省市 0-3 岁筛查 + 干预服务。关键点:发现红旗信号 → 不要等,立刻评估。"等等看"是错的 — 越早干预效果越好。

detail: |
  ## 是什么
  Early Intervention(EI)= 0-3 岁(部分国家延伸到 6 岁)针对发育偏离的多学科服务:
  - **物理治疗**(PT)— 大动作发育(翻身 / 爬 / 走 / 平衡)
  - **作业治疗**(OT)— 精细动作 / 自理 / 感觉处理
  - **言语治疗**(SLP)— 语言 / 沟通 / 喂养
  - **特殊教育**— 认知 / 玩 / 学习
  - **行为干预**— 自闭谱系 ABA / 发脾气 / 适应行为
  - **心理服务**— 父母-儿童关系 / 依恋干预
  - **医疗服务**— 协调专科评估

  ## 为什么"早"很重要(神经科学根据)

  ### 1. 大脑可塑性窗口
  - 0-3 岁突触增殖 + 修剪最快期
  - 早干预 = 在突触修剪定型前重塑神经回路
  - 等到 5-6 岁才干预 = 错过最大可塑性窗口

  ### 2. "二次发育延迟"预防
  发育迟缓不及时干预 → 滚雪球:
  - 不爬 → 缺空间认知 → 影响语言 → 影响社交
  - 不说话 → 缺沟通 → 影响行为 → 影响学习
  - 越早打断这个循环,后续问题越少

  ### 3. 父母教育同样重要
  EI 不只对孩子 — 教父母:
  - 如何给孩子最好的家庭环境
  - 如何辨识进展和反复
  - 如何不焦虑同时不放弃

  ## 触发评估的"红旗"信号
  按月龄(对应红旗信号月龄链):
  - **1 月**:大声没反应 / 哭弱 / 不吸奶(C-S1-066 鲍秀兰 + C-S1-061 AAP)
  - **2-3 月**:不看人脸 / 不转头(C-S2-009 鲍秀兰)
  - **6 月**:不大笑 / 不拿物 / 漠不关心 / 吃不进(C-S3-024 鲍秀兰)
  - **9 月**:不会坐 / 没有"妈/da"等音 / 不寻物 / 无表情
  - **12 月**:不会站 / 没词 / 不指物 / 不响应名字
  - **18 月**:不会走 / 足尖走 / 词 < 5 / 不模仿(C-S6-012 鲍秀兰)
  - **24 月**:7 项任一(C-S7-013 鲍秀兰)+ M-CHAT 自闭症筛查

  ## 美国 vs 中国 EI 体系

  ### 美国 IDEA Part C(联邦法,1986 起)
  - 0-3 岁所有有发育迟缓 / 高风险孩子免费 EI
  - 各州实施(California / NY / Massachusetts 体系最完整)
  - 评估免费,服务低收入家庭免费
  - 上门服务为主(自然环境 = 家)

  ### 中国 EI 现状
  - 国家卫健委《0-6 岁儿童健康管理服务规范》— 基础筛查覆盖
  - 部分省市儿保医院有 EI 团队(北京 / 上海 / 广州)
  - 民间机构 EI 价格高(月费 ¥5000-15000)
  - 农村地区 EI 服务严重不足
  - 自闭谱系干预集中在大城市

  ## "等等看"是错的(关键警告)
  常见家长 / 老人 / 部分医生说法:
  - "男孩说话晚是正常的"
  - "他还小,长大就会了"
  - "我家亲戚的孩子 3 岁才会说话也很好"
  - "别贴标签,不要查"

  这些说法都错。Brazelton C-S6-033 立场:
  - **任何对发育的担忧都值得评估**
  - **评估不是诊断 — 是排除 + 跟进**
  - **早干预 = 改善长期预后的最强单一因素**
  - "等等看"= 浪费最佳干预窗口

  ## 与中国"贴标签"恐惧的张力
  中国家长普遍恐惧"贴标签":
  - 怕孩子被诊断"有问题"
  - 怕影响入学 / 升学 / 婚姻
  - 怕被周围人议论
  - 因此推迟评估

  实际:
  - 评估是医学行为,不公开
  - 早期诊断 + 干预 → 大多数孩子可"赶上"或大幅改善
  - 不评估 = 错过最佳窗口 = 真正影响一生

key_facts:
  - 0-3 岁多学科干预(PT/OT/SLP/SE/行为/心理/医疗)
  - 大脑可塑性窗口最大期 = 早干预效果最好
  - 美国 IDEA Part C 免费 / 中国 EI 体系不完整
  - 发现红旗信号 → 不要"等等看",立刻评估
  - 评估 ≠ 诊断 = 排除 + 跟进
  - 中国"贴标签"恐惧 = 推迟干预 = 错过窗口


display_name: 松田道雄

full_name_zh: 松田 道雄
full_name_ja: 松田 道雄(まつだ みちお)
full_name_en: Michio Matsuda

one_liner: |
  日本京都大学医学博士,40 余年小儿科临床,日本最经典的家用儿科医生。
  著《育儿百科》(《育児の百科》岩波书店 1967 初版 / 定本 1980)— Phase 9 双 session 共写主要源(SRC-023 + SRC-024,共 80 张卡)。

detail: |
  ## 个人背景
  - 1908-1998,生于茨城县,卒于京都
  - 京都大学医学博士
  - 40 余年小儿科临床经验
  - 在日本与 Brazelton 在美国的地位相似 — 几代家长都用他的书
  - 不仅是儿科医生,还是社会评论家 / 反核运动者 / 日本左翼知识分子

  ## 主要贡献

  ### 1. 不焦虑育儿哲学(あせらない育児)
  全书底色是"不焦虑育儿":
  - 没人会预先掌握全套育儿知识
  - 1 月时只需知 1 月的事,4 月时把 1 月的全忘了也行
  - "过于自信的父母不是好父母,跟孩子一起成长才是"
  - 摆脱"我必须做对"才能真看见孩子

  ### 2. 0-6 岁全段临床实操指南(651 章)
  按月龄分章,每个月龄给:
  - 这个月的婴儿 / 喂养方法 / 环境 / 异常情况 / 集体保育
  - 651 章覆盖 0-6 岁全段 + 小儿疾病百科(§535-651)

  ### 3. 日本视角育儿哲学
  - 母婴同睡 8 月后 OK(vs AAP 反对)
  - 不强制断奶(vs 中国"早断早好")
  - 反抗期不存在 = 协作期(独家立场)
  - 抱不会养成毛病(vs 中国老人"抱坏"说)
  - 日式精细辅食 + 米饭路径
  - 集体保育 + 保育园文化推动者
  - "把烟拿到院子里"的父亲责任(1967 年立场前卫)

  ### 4. 反早期教育派
  - 不必教孩子认字 — 想学自己来问
  - 智力测试不可信 — "天分都没醒呢"
  - 不让看电视 4 小时 — "电视给情报不给智慧"
  - 反"虎妈"教育路线

  ### 5. 性别平等先驱
  1967 年就反对"像男孩样、像女孩样"的刻板印象 — 立场比当时主流前卫几十年。

  ## 主要著作
  - 育児の百科(岩波书店, 1967 初版 / 定本 1980)— 中译《育儿百科》(王少丽译)
  - 続・育児の百科
  - 大量社会评论 / 反核运动文章

  ## 学术评价
  - 在日本被称为"育儿の神様"(育儿之神)
  - 同时是社会评论家,立场偏左翼 — 反核 / 反战
  - 部分立场跟 AAP / WHO 现代规范有出入(如母婴同睡 / 部分体罚立场)
  - 但临床描述非常细致 — 是日本家家必备的工具书

  ## 在本知识库中
  - Phase 9 双 session 共写主要源(SRC-023 fallback 自 Ainsworth + SRC-024 并行第二本)
  - 累计 **80 张知识卡 + 13 张关联术语**(SRC-023 38 卡 + 4 术语,SRC-024 42 卡 + 9 术语)
  - 是中国家长高频痛点(同房睡 / 断奶 / 把屎把尿 / 体罚 / 早教)的日本视角
  - 跟 AAP(美) / 鲍秀兰(中) / Brazelton(美临床派)形成 4 国跨文化对照闭环
  - SRC-024 卡新增段 ID 用 +200 buffer 避撞 SRC-023 +50 buffer
  - SRC-024 首次扩 **S8 = 3-6 岁段**(全新建,松田专门覆盖学龄前)


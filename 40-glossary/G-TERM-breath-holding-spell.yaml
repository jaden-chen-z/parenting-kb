glossary_id: G-TERM-breath-holding-spell
type: term
display_name: 屏气发作(愤怒性痉挛)

full_name_zh: 屏气发作 / 愤怒性痉挛
full_name_ja: 憤怒けいれん
full_name_en: "Breath-holding spell / Cyanotic breath-holding"

one_liner: |
  孩子大哭后突然憋气、口唇发紫、抽搐 — 1-3 岁段常见,不是癫痫,5 岁后自动消。

detail: |
  ## 概念定义

  孩子在大哭或生气时突然憋气,几秒钟内口唇发紫 / 紧握拳头 / 两目上翻 / 抽搐。
  医学上称"愤怒性痉挛" / "屏气发作" / cyanotic breath-holding spell(BHS)。

  ## 临床特征(松田 §349)

  1. **诱因**:孩子愤怒 / 受挫 / 妈妈拿走打火机等;
  2. **过程**:大哭 → "哇"一声 → 不出声 → 抽搐;
  3. **持续**:几秒到几十秒;
  4. **年龄**:1 岁前后开始 → 持续到 3-4 岁 → **5 岁后不再发生**;
  5. **跟癫痫区别**:
     - BHS:**先憋气再抽搐** + 脑电波正常;
     - 癫痫:不一定先憋气 + 脑电波异常;
  6. 不会智力低下;
  7. 不会因抽搐死亡。

  ## 松田立场(§349)

  关键不是医学治疗,**是家庭管理问题**:
  1. 多发于跟祖父母 / 叔婶同居的溺爱家庭;
  2. 孩子把抽搐当"武器"控制大人;
  3. 处方:
     - **召开家庭会议** — 决定"无视屏气发作";
     - 奶奶不要在母子吵架时帮腔;
     - 户外消耗体力;
  4. 一发作家人慌神 + 满足要求 → 孩子学会"武器化"。

  ## 跟其他急症区分

  | 症状 | 屏气发作 | 热性痉挛 | 癫痫 |
  |---|---|---|---|
  | 诱因 | 大哭 / 生气 | 高热 ≥ 39°C | 不明 / 闪光等 |
  | 先兆 | 憋气 → 紫 → 抽 | 高热 → 抽 | 突然抽 |
  | 持续 | 几秒-几十秒 | 几分钟 | 几分钟 |
  | 脑电波 | 正常 | 正常 | 异常 |
  | 自愈 | 5 岁后 | 5 岁后 | 不一定 |
  | 急救 | 不需注射 | 测温冷头 | 送医 |

  ## 中国家长直接相关

  - "我家娃哭着哭着憋紫了" — 90% 是 BHS,看看跟癫痫区别
  - "去医院注射后好了" — 实际不注射也会自然苏醒
  - 家庭一致(妈妈 + 奶奶不投降) — 关键
  - 户外消耗 — 减少 BHS 频率

  ## 在本知识库中

  - SRC-024 §349 核心概念
  - C-S6-820 屏气哭死过去别慌(同源)
  - 跟 G-TERM-febrile-convulsion(热性痉挛)对照

key_facts:
  - 1-3 岁段常见,5 岁后自动消
  - 不是癫痫不会智力低下
  - 关键是家庭管理不是医学治疗
  - 多发于溺爱家庭(松田立场)


full_name_en: Renée Baillargeon
full_name_zh: 蕾妮·拜亚尔容

one_liner: |
  美国发展心理学家(伊利诺伊大学教授),1985 吊桥实验奠基人。
  4 月物体永久性实证 — 推翻 Piaget 8 月说。

detail: |
  ## 个人背景
  - 加拿大魁北克出生
  - 宾夕法尼亚大学博士(Spelke 学生)
  - 伊利诺伊大学(UIUC)心理学教授
  - 美国国家科学院院士

  ## 核心研究
  - **1985 吊桥实验**:4 月宝宝看吊桥转 180 度过被遮方块 = 不可能事件,盯更久
  - 推翻 Piaget 8 月物体永久说
  - **Violation-of-Expectation** 范式经典应用
  - Hespos 2001 + Wang 2004 多次复制

  ## 立场
  - Spelke 核心知识派
  - 物体系统先天派代表

  ## 在本知识库中

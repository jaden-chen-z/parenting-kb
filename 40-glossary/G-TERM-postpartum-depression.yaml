glossary_id: G-TERM-postpartum-depression
type: term
display_name: 产后抑郁 (PPD)

full_name_en: Postpartum Depression / Perinatal Mood and Anxiety Disorders (PMAD)
full_name_zh: 产后抑郁

one_liner: |
  产后女性的抑郁症状谱,从轻度 Baby Blues(40%)到严重 PPD(5%)到罕见产后精神病(0.1%)。
  后两者需立即就医,不是软弱是医学疾病。Karp 强调"和过敏症一样,是病不是失败"。

detail: |
  ## 三阶段症状谱

  ### 1. Baby Blues(新生儿忧郁症)
  - **发病率**:**40%** 新手妈妈
  - **症状**:轻度哭泣 / 焦虑 / 失眠 / 情绪波动
  - **时机**:产后几天到几周
  - **病因**:荷尔蒙骤变(雌激素 / 黄体酮急剧下降)
  - **处理**:几周内自然过去,有家人支持就够,不需药物

  ### 2. 真正产后抑郁(PPD)
  - **发病率**:**5%**(范围 3-20%,因诊断标准)
  - **症状**:
    - 深度悲伤 / 羞耻 / 愤怒 / 焦虑 / 恐惧
    - 冷漠 / 疲惫 / 无助
    - 日常行动能力丧失("连做一块三明治的力气都没有")
    - **伤害自己 / 宝宝的幻想**(关键警报)
  - **时机**:产后任何时间,持续数周到数月
  - **处理**:**必须就医**,治疗有效

  ### 3. 产后精神病(Postpartum Psychosis)
  - **发病率**:**0.1%**(千分之一)
  - **症状**:幻听 / 幻视 / 语无伦次 / 行为怪异 / 拒食 / 极端激动
  - **时机**:产后 2 周内多见
  - **处理**:**立即就医,可能危及生命**(自杀 / 杀婴风险)

  ## 治疗有效手段
  - **药物**:抗抑郁药(SSRIs 多数与哺乳兼容)
  - **心理治疗**:CBT(认知行为) / IPT(人际关系)
  - **光疗**:对季节性抑郁有效
  - **甲状腺排查**:产后甲减也能造成类似抑郁,先做血检
  - **家人 / 配偶支持**:具体动作(换尿布 / 陪同就医 / 不指责)

  ## Karp 立场(SRC-003 附录 B)
  - "和过敏症一样,产后抑郁是医学疾病,不是软弱"
  - 反对"撑撑就好"的说法,鼓励主动求医
  - 推荐资源:postpartum.net / depressionafterdelivery.com

  ## AAP 立场(2019 Policy)
  - 推荐儿科儿保时**对妈妈做产后抑郁筛查**(EPDS 量表)
  - 1 月 / 2 月 / 4 月 / 6 月儿保 4 次
  - 发现阳性立即转介

  ## 中文家长视角
  - 中国传统"坐月子"对身体康复有益,但忽视心理健康
  - "妈妈天然爱孩子"的文化压力反而加重 PPD 患者的羞耻感
  - 国内推荐求助途径:三甲医院心理科 / 妇产科联合门诊
  - 国内 PPD 发病率约 14-17%(略高于美国,可能与社会支持差异有关)

key_facts:
  - 三阶段:Blues 40% / PPD 5% / 精神病 0.1%
  - 不是软弱,是医学疾病
  - 治疗有效(药物/心理/光疗)
  - 排查甲状腺
  - 出现伤害幻想立即就医


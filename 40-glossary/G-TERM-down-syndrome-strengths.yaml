  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版)反复引用。

  ## 跨派对接
  V4 综述权威立场,跨章节多次出现,跟现库其他派有立场对照。

  ## 中国家长意义
  详见相关知识卡。


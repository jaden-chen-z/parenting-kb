glossary_id: G-TERM-fussy-period
type: term
display_name: 黄昏哭闹 (fussy period / end-of-day fussiness)

full_name_en: Fussy Period / End-of-Day Fussiness
full_name_zh: 黄昏哭闹 / 一日终末哭闹

one_liner: |
  婴儿固定时段(常在黄昏)连续哭 1-2 小时,其他时段正常。Brazelton 数据:8 周达峰,12 周自然消失。是宝宝释放白天积累的神经过载。

detail: |
  ## 定义
  Fussy period 指 0-3 月婴儿**每天在固定时段(常是傍晚到入夜)出现的连续 1-2 小时哭闹**,
  其他时段宝宝正常吃睡。
  与 colic(肠绞痛)有重叠——传统 Wessel 标准的"3-3-3"哭闹常落在这个时段。

  ## Brazelton 的解读
  > "宝宝哭的不是肚子,是一整天的神经过载。
  > 新生儿白天接收的所有刺激(光、声音、人脸、抱举、喂奶)
  > 累积到傍晚必须有出口——这个出口就是哭。
  > 这是健康神经系统的'排气阀',不是问题。"

  - 不是疼痛,不是饥饿,不是疲劳——是**神经系统在解构白天的过载**
  - 像成人下班后需要"瘫一会儿",婴儿用哭达成同样目的
  - 试图安抚常常无效——因为哭本身就是宝宝在做的"自我调节"

  ## 时间轨迹(Brazelton 数据)
  - 2-3 周开始出现
  - **8 周达到峰值**(每天哭最长)
  - 12 周显著减少
  - 3-4 月几乎完全消失

  ## 与 colic 的关系
  - Colic 是临床诊断(Wessel 1954 的 3-3-3 规则)
  - Fussy period 是发展现象描述
  - 两者高度重叠——很多被诊断 colic 的宝宝其实是 fussy period
  - Brazelton 立场:把 fussy period 病理化为 colic 是过度诊断

  ## 应对原则
  - **接受不可消除性**:这段时间不是要"消除",是要陪伴穿过
  - **降低环境刺激**:暗光、低声、减少人来人往
  - **接受抱不下**:不是父母的失败
  - **轮换照顾者**:这个时段最考验养育者神经,需要分担
  - **记录时间窗**:确认是否落在 fussy period 模式而非健康问题

  ## 在本知识库中
  - C-S1-082 / C-S1-083 新生儿期 fussy period 描述
  - C-S2-020 1-3 月延续期


glossary_id: G-TERM-transitional-object
type: term
display_name: 过渡性客体 (transitional object)

full_name_en: Transitional Object
full_name_zh: 过渡性客体

one_liner: |
  Winnicott 1951 提出的概念:婴儿 9-24 月会选定一件熟悉物品(毯子 / 玩偶 / 旧衣)
  作为**心理代偿物**,在妈妈不在时提供安全感。**不是恋物癖,是健康发展的标志**。
  Bowlby Vol 2 引为分离场景下的关键安抚资源。

detail: |
  ## 概念起源
  - **Donald Winnicott**(英国儿科医生 + 精神分析师,1896-1971)
  - 1951 年论文《Transitional Objects and Transitional Phenomena》
  - 1971 年专著《Playing and Reality》系统化
  - 与 Bowlby 同时代,精神分析方向不完全一致但概念互补

  ## 定义
  Winnicott:婴儿在 4-12 月间逐步认识到自己与妈妈是分开的个体后,
  会选择一件**熟悉物品**作为"过渡"— 既不完全是妈妈也不完全是自己,
  代表两者之间的"过渡空间"。

  Bowlby 视角:这件物品有妈妈的**气味 + 触感**,在妈妈不在时**激活依恋系统的部分功能**。

  ## 典型出现时机
  - **9-12 月**:萌芽
  - **12-24 月**:固化(几乎所有孩子都有)
  - **2-4 岁**:高峰使用
  - **4-7 岁**:逐步淡化
  - 健康成人偶尔保留(如恋人的物件)

  ## 苏格兰研究数据(Bowlby Vol 1 引)
  约 1/3 婴儿会发展明确的过渡性客体,**与依恋类型无明确相关**(B/A/C 都可能有)。

  ## 过渡性客体的特征
  - 必须是**熟悉的旧物**(新的同款不行)
  - 通常是软质 / 有特定气味
  - 孩子赋予**情感人格**(对它说话 / 摔打它)
  - 丢失等于二次创伤
  - 妈妈洗了就不灵了(气味没了)

  ## Bowlby Vol 2 的应用扩展
  Vol 2 第一章发现:**所有住院 / 寄宿孩子,除一个外,都从家里带了过渡性客体**。
  - 最初 3 天紧抱不放
  - 护士不小心拿走 → 立刻崩溃
  - 之后有矛盾:抱+扔交替(对妈妈的情感投射)

  这印证 Winnicott 的洞察:**过渡性客体是心理代偿物,在分离时直接顶替妈妈部分功能**。

  ## 不是病理表现
  ### Bowlby & Winnicott 共识
  - 不是"恋物癖"(fetish),是健康
  - 不是"逃避现实",是过渡的桥梁
  - 不是"被宠坏",是发展里程碑
  - 没有过渡性客体不一定有问题(2/3 孩子没明显的)

  ### 何时算异常
  - 6 岁后还日夜寸步不离
  - 离开就严重崩溃
  - 同时伴有其他焦虑型依恋表现

  ## 家长应用指南
  - **承认 + 尊重**:孩子的"宝贝"就是宝贝
  - **不洗净**:气味是关键
  - **多备几个 / 备份**(经典毯子破后修补不是替换)
  - **分离时必带**:住院 / 异地长辈家
  - **写名字 + 联系方式**:丢了 = 二次创伤
  - **不强行戒掉**:自然淡化是 4-7 岁
  - **拍很多照片** 留念 + 备失

  ## 中文文化常见误区
  - "破破烂烂的扔了" — 对孩子是巨大创伤
  - "不能恋物癖,要训练独立" — 误解发展规律
  - 毯子 / 玩偶定期清洗 → 失去妈味失去意义
  - "去外婆家就别带了" — 恰恰需要带上
  - 戒掉 = 戒掉 = 弥补依恋缺口的尝试

  ## 在本知识库中
  - C-S5-076 抱毯子玩偶不是怪癖(Vol 1 来源)
  - C-S5-086 分离时玩偶毯子加倍重要(Vol 2)
  - C-S7-034 Robertson 5 招(带物品是 1 招)

key_facts:
  - Winnicott 1951 提出
  - 9-24 月发展,2-4 岁高峰
  - 苏格兰研究:约 1/3 婴儿明显发展
  - Bowlby Vol 2 印证:住院儿童几乎全员都带
  - 是心理代偿物,不是病理
  - 必备有妈味,洗净就失效


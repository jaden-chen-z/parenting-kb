glossary_id: G-TERM-separation-anxiety
type: term
display_name: 分离焦虑 (separation anxiety)

full_name_en: Separation Anxiety
full_name_zh: 分离焦虑

one_liner: |
  婴儿对主要养育人离开产生痛苦反应的发展阶段。10-18 月达峰,2 岁后期消退。健康依恋的标志,不是性格弱。

detail: |
  ## 定义
  婴儿觉察到主要养育人(通常是妈妈)不在视线时产生的痛苦反应:哭闹、寻找、拒绝其他人。

  ## 发展时间线(AAP 节奏)
  - **8 月起**:萌芽,与陌生人焦虑(stranger anxiety)同时出现
  - **10-18 月**:达峰(最强烈的阶段)
  - **2 岁后期**:逐渐消退
  - **3 岁后**:大多消退

  ## 认知基础
  分离焦虑的认知前提是**物体永久性**(object permanence):
  - 没掌握:你不见 = 不存在 = 不焦虑
  - 掌握后:你不见 = 存在但暂时不见 = 担心

  这解释了为什么分离焦虑跟物体永久性同步发展。

  ## 健康依恋的标志
  AAP 直接说:"strong, healthy attachment actually causes separation anxiety to appear earlier and pass through faster"
  健康依恋反而让分离焦虑更早出现但通过更快 — **不是性格弱,是发展里程碑**。

  ## AAP 缓解 5 招
  1. 不在累 / 饿 / 病时离开(累加状态会失控)
  2. 离开不小题大做(快速告别 + 不流连)
  3. 让看护人立刻转移注意力(玩具 / 零食)
  4. 在家从短分离练起(去隔壁房间几分钟)
  5. 托儿所第一周陪几分钟再离开

  ## 父母常见误区
  - 偷偷溜走不告别 → 安全感受损,焦虑反而加重
  - 每次哭就赶回来 → 强化焦虑,永远过渡不了
  - 觉得"我家孩子粘人"自责 → 是普遍的认知里程碑

key_facts:
  - 10-18 月达峰
  - 认知基础 = 物体永久性
  - 健康依恋的标志(不是问题)
  - AAP 缓解 5 招


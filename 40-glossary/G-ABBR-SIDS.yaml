glossary_id: G-ABBR-SIDS
type: abbreviation
display_name: SIDS

full_name_en: Sudden Infant Death Syndrome
full_name_zh: 婴儿猝死综合征

one_liner: |
  1 岁内婴儿无明显原因猝死,睡眠相关。美国每年约 3500 例,2-4 月发病率最高,2022 AAP Policy 给完整预防建议。

detail: |
  ## 定义
  12 月以内婴儿"无明显原因突然死亡"的统称(诊断需要尸检 + 死亡现场调查 + 病史回顾排除其他原因)。

  ## 流行病学
  - 美国每年约 3500 例(2026 数据)
  - 0-1 岁主要死因之一(美国);中国数据少,估计每万例活产 0.3-0.5
  - 高峰月龄:**2-4 月**(此前 / 此后均显著低)
  - 男婴略多于女婴(60% / 40%)

  ## 主要风险因子
  - 趴睡 / 侧睡(6× 风险)
  - bed-sharing(尤其沙发 67×、impaired 大人 10×、< 4 月 5-10×)
  - 早产 / 低出生体重(2-5×)
  - 母亲孕期吸烟 / 二手烟
  - 过热 / 床垫软 / 有松散物
  - 不母乳喂养 / 不打疫苗

  ## 预防(AAP 2022 Policy 完整建议)
  - 每次入睡都仰睡
  - 平整非倾斜面(< 10°)+ CPSC 认证
  - bare crib(只有床单,无枕被玩具)
  - 房间共睡(crib 在床边伸手可及)
  - 绝不 bed share
  - 母乳 + 奶嘴(nap/bedtime)+ 不抽烟 + 不过热
  - 按时打疫苗

  ## 历史
  - 1992 年 AAP 首次推 "Back to Sleep" 运动 → 美国 SIDS 死亡数从 6000/年 降到 3500/年
  - 2011 年 AAP Policy 扩展到 "Safe Sleep" 完整建议
  - 2022 年 AAP Policy 进一步加强(含 2021 CPSC 强制鼓励 rule)

key_facts:
  - 美国每年约 3500 例
  - 0-1 岁主要死因之一
  - 高峰月龄 2-4 月
  - 1992 年 Back to Sleep 后死亡数降 ~40%
  - AAP 2022 Policy 给完整预防建议


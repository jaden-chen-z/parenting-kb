glossary_id: G-TERM-practical-life
type: term
display_name: 生活技能 (practical life)

full_name_zh: 生活技能 / 日常生活
full_name_en: Practical Life

one_liner: |
  蒙特梭利 0-6 教育的 5 大领域之一,也是最早开始的领域(出生即可)。让孩子参与真实的日常工作 — 喝水 / 穿衣 / 摆桌 / 打扫 / 切水果,在做中学习独立 / 协调 / 专注 / 秩序 / 自我效能。
  本质 = 把"家务"还原为"工作"(work),孩子的工作 = 大人的家务。

detail: |
  ## 定义
  Practical Life = 蒙氏教育 5 大领域之一(其他 4 个:感官 / 语言 / 数学 / 文化)。
  在 0-3 岁,**practical life 占绝对主导**,因为这是孩子建立基本独立性的核心路径。

  ## 0-3 岁 Practical Life 进度表
  | 月龄 | 可参与的真实工作 |
  |---|---|
  | 0-6 月 | 妈妈喂奶时观察家庭场景 |
  | 6-9 月 | 自己拿杯喝水(矮杯)/ 自己抓食物 |
  | 9-12 月 | 自己穿一只袖子 / 用真碗真勺自喂 |
  | 12-15 月 | 端空碗 / 擦桌子 / 玩具归位 / 拿尿布去垃圾桶 |
  | 15-24 月 | 切香蕉(钝刀)/ 摘豆 / 浇花 / 扫地 |
  | 24-36 月 | 摆桌 / 倒水 / 洗手帕 / 自己穿鞋 |

  ## 蒙氏 5 个 Practical Life 子领域
  1. **照顾自己**(care of self)— 穿衣 / 洗手 / 上厕所 / 吃饭
  2. **照顾环境**(care of environment)— 擦桌 / 扫地 / 浇花 / 摆桌
  3. **优雅与礼仪**(grace and courtesy)— 打招呼 / 等待 / 道歉 / 请求
  4. **动作控制**(control of movement)— 走平衡线 / 倒水不洒 / 走路不撞
  5. **食物准备**(food preparation)— 切水果 / 拌沙拉 / 拌饮料

  ## 为什么这是教育(不是干家务)
  - **真实**:用真物(真碗 / 真水 / 真刀),不是塑料假装
  - **重复**:每天做,每周做,内化
  - **慢**:大人允许孩子用自己的速度
  - **完整**:不只是干活,是从准备 → 做 → 收尾
  - **自主**:孩子决定做什么 / 何时做 / 做多久

  ## 中国家长高频误解
  | 误解 | 蒙氏实际 |
  |---|---|
  | "孩子小别让他做,危险" | 蒙氏从 9 月起让宝宝抓食物,1 岁让端碗,2 岁让切香蕉 — 在监护下安全 |
  | "做家务多累,小孩还小" | 这不是家务是教育核心 |
  | "他做太慢我自己做" | 慢是大人付出的学费 |
  | "学这有什么用,以后都自动化" | 自我效能 + 独立 + 自尊都从这里来 |

  ## 工具尺寸
  - **儿童尺寸**(child-sized)— 矮桌椅 / 小扫帚 / 小铲子 / 小水壶
  - **真物**(real)— 真陶瓷碗(不防摔)/ 玻璃杯(小,允许打碎)
  - 中国可买"幼儿园同款"工具 / 自缝围裙 / 二手厨房用品改装

  ## 跟其他流派对照
  - 跟 RIE / Pikler:理念一致(让宝宝自己来)
  - 跟 Brazelton:相符(尊重 + 等待节奏)
  - 跟传统育儿:**对立**("孩子小靠大人喂")

key_facts:
  - 蒙氏 0-6 教育 5 大领域之一
  - 0-3 岁占绝对主导
  - 用真物 + 儿童尺寸 + 慢节奏
  - 5 子领域:自我 / 环境 / 礼仪 / 动作 / 食物
  - 中国家长高频误解需要澄清


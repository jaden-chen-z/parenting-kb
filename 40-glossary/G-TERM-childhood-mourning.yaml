glossary_id: G-TERM-childhood-mourning
type: term
display_name: 童年哀伤(childhood mourning)

full_name_en: Childhood Mourning
full_name_zh: 童年哀伤

one_liner: |
  指 0-12 岁孩子面对重大丧失的哀悼过程。
  Bowlby Vol 3 核心论证:**儿童(尤其 2 岁起)能完成跟成人相似的哀悼,关键不是年龄是否够大,而是周围条件是否支持**。

detail: |
  ## Bowlby 立场(Vol 3 全书核心)

  ### 推翻的传统观点(1950-1970 精神分析主流)
  - "儿童认知不成熟,无法真正哀悼"(Anna Freud / Wolfenstein 等)
  - "儿童会很快忘记 / 转移到新照顾者"
  - "告诉孩子真相会伤害他"

  ### Bowlby 的论证
  1. **认知能力**:皮亚杰 + Bower 研究证明 9-16 月已发展客体永存,17 月起能保留不在场母亲的形象(Ch25)
  2. **观察证据**:Robertson + Heinicke + Furman 多项研究显示 2 岁起孩子的反应类型跟成人相似(渴望 / 搜寻 / 抗议 / 接受)
  3. **未能哀悼的孩子 = 病理基础**:成人病理性哀伤 + 抑郁 + 焦虑型依恋,常追溯到童年丧失被压抑

  ## 儿童哀伤的特殊表现(跟成人不同)
  ### 行为信号(易被忽略)
  - **退化行为**:尿床 / 不会自理 / 重新吸手指
  - **躯体化**:揪耳朵 / 抠鼻子 / 食欲差
  - **依恋过渡物**:抱毯子 / 抱娃娃 / 抱已逝者衣物
  - **身体接触饥渴**:粘人 / 不让大人离开视线
  - **极端"懂事"**:压抑情绪 + 照顾他人(劳拉模式,危险)

  ### 言语信号(易被误读)
  - 重复说"我妈妈会回来 / 我爸爸说..."
  - 跟想象中的逝者对话
  - 角色扮演逝者(温蒂玩"妈妈在桌前评论")
  - 突然问关于死亡的问题(死了会怎样 / 会冷吗)
  - 看到陌生人误以为是逝者

  ### 时间特征
  - 可能延迟数周-数月才公开表达(温妮 7 个月)
  - 触发性突然崩溃(看到照片 / 物品 / 节日)
  - 持续比成人想的更久,反复出现
  - 重要节点(节日 / 生日 / 纪念日)易被引发

  ## 健康完成 vs 病理化的分水岭(Bowlby Ch16-Ch21)

  ### 利于完成的条件
  1. 丧失前依恋质量好(安全型)
  2. 被告知真相 / 允许提问 / 不绕弯
  3. 主动告知"不是你的错"
  4. 健在父母 / 稳定替代照顾者支持
  5. 允许哭 / 表达 / 参与告别仪式
  6. 周围大人也允许自己哀伤

  ### 通向病理化的条件(都要避免)
  1. 隐瞒真相 / 用想象代替("去远方 / 当天使")
  2. 禁止哭 / 禁止提逝者
  3. 威胁("再哭妈妈就走")— 帕特里克模式
  4. 替代照顾者不稳定 / 经常更换
  5. 大人自己病理性哀伤 → 孩子无法学习
  6. 角色倒置:让孩子照顾大人情绪

  ## 中国家庭文化背景下的额外风险
  - **忌讳谈死亡** → 隐瞒成默认 → 增加病理化风险
  - **"懂事 / 不哭"被视为美德** → 鼓励压抑 → 帕特里克 / 劳拉模式
  - **爷奶为主要照顾者** → 失去爷奶冲击大,但被视为"远房亲戚"轻看
  - **二胎家庭** → 老大可能被忽视哀伤(失去关注 = 心理丧失)
  - **保姆 / 月嫂高频更换** → 0-3 岁主依恋人不稳定

  ## 在本知识库中
  - C-S7-237/238/239/240/241 全部 Bowlby V3 卡
  - G-TERM-mourning(总论)
  - G-TERM-pathological-mourning(被卡版本)
  - G-TERM-protest-despair-detachment(分离 3 阶段)

key_facts:
  - Bowlby Vol 3 推翻"儿童不能哀悼"传统观点
  - 17 月起认知能力已可完成哀悼
  - 2 岁起反应类型跟成人相似
  - 表现易被忽略(行为信号 / 延迟出现)
  - 健康完成需周围条件支持,否则易病理化


glossary_id: G-TERM-Moro-reflex
type: term
display_name: 惊跳反射 (Moro reflex)

full_name_en: Moro Reflex / Startle Reflex
full_name_zh: 莫罗反射 / 惊跳反射

one_liner: |
  婴儿听到响声或失去支撑时双臂外展再收回的本能反射(0-4 月,4 月后自然消失)。
  Karp 5S 中包裹的目的之一就是锁住手臂,避免它干扰睡眠和安抚。

detail: |
  ## 定义
  奥地利儿科医生 Ernst Moro 1918 年首次描述的新生儿原始反射:
  婴儿突然失去支撑、听到大声或感到惊吓时,会双臂迅速外展、手指张开、再收回身前抱紧。

  ## 触发条件
  - 突然的大声(关门 / 摔东西)
  - 突然的体位变化(放下太快)
  - 强光闪烁
  - 突然失去触觉支撑(放到床上)

  ## 出现 / 消失时间
  - **出生即有**(健康新生儿全部有)
  - **2-4 月减弱**
  - **4-6 月完全消失**(神经髓鞘化完成,被自主控制取代)

  ## 临床用途
  - **新生儿评估**:儿医检查必查,缺失或不对称提示神经损伤
  - **APGAR 评分**:新生儿出生后立即评分会查这个反射

  ## 在 Karp 体系中的位置
  - **包裹的核心目的**:把双臂锁在身体内,避免莫罗反射干扰
  - **5S 中"先停下乱动"那组**(包裹 + 侧抱)
  - 没包裹的婴儿:自己挥手 → 触发莫罗反射 → 自己被吓哭 → 反复醒
  - 包裹后:手臂被固定 → 反射不被自我触发 → 睡眠延长 1-2 小时

  ## 实操注意
  - 包裹时双臂必须在身体内(否则反射照样触发)
  - 4 月后宝宝开始翻身 → 立刻停包裹(否则窒息风险)
  - 与"惊跳综合征"(jitteriness)区别:后者是病理性持续抖动,需就医

  ## 与其他原始反射
  - **rooting 反射(寻乳)** — 触脸激活,4 月消失
  - **palmar grasp(掌握)** — 手心被触摸时握紧,5-6 月消失
  - **stepping(踏步)** — 直立时抬腿,2 月消失
  - **Moro(惊跳)** — 4-6 月消失

key_facts:
  - 0-4 月原始反射
  - Moro 1918 年首次描述
  - 包裹的目的就是锁住手臂避免触发
  - 4-6 月自然消失
  - 缺失或不对称提示神经损伤


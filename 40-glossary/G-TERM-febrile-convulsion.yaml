glossary_id: G-TERM-febrile-convulsion
type: term
display_name: 热性痉挛(高热抽搐)

full_name_zh: 热性痉挛 / 高热抽搐
full_name_ja: 熱性けいれん
full_name_en: "Febrile convulsion / Febrile seizure"

one_liner: |
  孩子高热 39-40°C 时全身抽搐 — 1-3 岁段非常多见,90% 不是癫痫,5 岁后自动消。

detail: |
  ## 概念定义

  孩子高热(39-40°C)时全身抽搐,医学称"热性痉挛" / "febrile convulsion"。

  ## 临床特征(松田 §348)

  1. **诱因**:高热(感冒 / 麻疹 / 幼儿急疹等);
  2. **过程**:高热 → 喊不应 → 两眼上翻 → 全身哆嗦;
  3. **持续**:几分钟自然苏醒;
  4. **年龄**:1-3 岁段非常多见 → **5 岁后大降** → 上学后基本不发作;
  5. **跟癫痫区别**:
     - 热性痉挛:**先发热再抽搐** + 全身哆嗦;
     - 癫痫:不一定发热 + 痉挛只一侧 + 脑电波异常;
  6. 不会智力低下;
  7. 不会因抽搐死亡。

  ## 处置 5 步(松田 §348)

  1. **第一动作**:测体温(不发热抽搐 = 怀疑癫痫);
  2. **冷却头部**(冰枕);
  3. **手脚保温**;
  4. **等几分钟**自然苏醒(不一定要打针);
  5. **体温 > 38°C 用退热塞剂**(肛门用药)。

  关键:松田明确说"不注射也能好的道理" — 不必狂奔急诊。

  ## 跟其他急症区分

  参 G-TERM-breath-holding-spell(屏气发作)— 三者对照表。

  ## 中国家长直接相关

  - "我家娃发高烧抽搐怎么办" — 90% 是热性痉挛
  - 准备退热塞剂 在家备 — 体温 38°C 用
  - 一侧抽搐 + 不发热 = 立即急诊查癫痫
  - 5 岁后发病率大降 — 不必长期担心

  ## 跟 AAP / 鲍秀兰一致

  AAP / 中国儿科学会指南: 热性痉挛大多 benign (良性), 不需要长期抗癫痫药物预防。

  ## 在本知识库中

  - SRC-024 §348 核心概念
  - C-S6-826 高热抽搐冷头温脚(同源)
  - 跟 G-TERM-breath-holding-spell 对照

key_facts:
  - 1-3 岁段非常多见,5 岁后自动消
  - 90% 不是癫痫
  - 高热 + 全身抽搐 = 热性痉挛
  - 一侧抽搐 / 不发热 = 怀疑癫痫(送医)


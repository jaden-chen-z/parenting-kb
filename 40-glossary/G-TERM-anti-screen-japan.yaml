glossary_id: G-TERM-anti-screen-japan
type: term
display_name: 反屏幕日式立场

full_name_zh: 反屏幕(松田立场)
full_name_ja: テレビ反対
full_name_en: "Anti-screen / Anti-TV (Matsuda)"

one_liner: |
  松田道雄《育儿百科》§295 + §428 全书一致反屏幕立场 — 0-6 岁不让看,4 小时 = 弃娃。

detail: |
  ## 概念定义

  松田道雄反对儿童看电视 / 屏幕的核心立场,跟 Lansbury / Brazelton / AAP 一致 +
  比 Lansbury 更激进(0-2 → 0-6 岁全段)。

  3 个核心论点:
  1. **电视给情报不给智慧** — 智慧是孩子在现实生活学到的;
  2. **电视妨碍语言学习** — 电视声音是杂音,娃听不清母亲;
  3. **电视让孩子不知忍耐** — 一遥控器换台 = 不知忍耐的人。

  ## 松田原文立场(§428)

  - 每天看 4 小时电视 = **对家庭教育的放弃**;
  - 电视播孩子容易接受的成型内容 → 不用脑 → 长成无创造力的人;
  - 电视商人用演员的夸大 / 奉承 / 逗笑 / 卖名 → 让人失去节制力 / 羞耻心;
  - 电视频道支配权交给孩子 = 不知忍耐;
  - "把电视赶出家"是底线建议;
  - 父母自己看 4 小时电视的家庭,孩子无法学到家庭快乐是创造的。

  松田 §295 教婴儿说话:
  - 电视一直响 → 婴儿听不见母亲声音 → 永远不会说话;
  - 跟妈妈说话需要面对面 + 看口形 + 发音清楚;
  - 现代版:iPad 哄饭 + 手机循环动画 = 反向训练。

  ## 跟其他派别对照

  | 派别 | 屏幕立场 |
  |---|---|
  | 松田(日) | 0-6 岁全段反对 — 4 小时 = 弃娃 |
  | Lansbury(RIE) | 0-2 岁绝对不看 |
  | Brazelton | 2 岁前一秒别看 |
  | AAP 2016 | 0-18 月不看 + 18 月-5 岁高质量共看 ≤1 小时 |
  | 蒙氏(Lillard) | 0-6 岁只给真实的 |

  松田 + Lansbury + 蒙氏 立场最激进 — 0-2/6 岁尽量不看;
  AAP 2016 后稍松动 — 18 月后高质量共看可以;
  Brazelton 中道。

  ## 现代意义(2025)

  iPad / 手机 / 抖音 / 平板的现代普及让"反屏幕"立场变得更紧迫:
  - 6 月起 iPad 哄饭普遍
  - 1 岁就看几小时短视频
  - 3 岁刷手机抖音
  - 4 岁玩游戏

  反屏幕的现代版需要扩展到:
  - 不用屏幕哄饭 / 哄睡 / 安抚
  - 不让宝宝自己拿手机
  - 父母先减少屏幕时间(modeling)
  - 用散步 / 阅读 / 玩具填补

  ## 中国家长直接相关

  - 6 月起 iPad 哄饭怎么改
  - 4 岁能看动画片吗
  - 父母都刷手机怎么办
  - 学前班用 ABC mouse 行不行

  ## 在本知识库中

  - SRC-024 §295 + §428 核心概念
  - 跟 Lansbury C-S6-406 / Brazelton C-S6-031 形成 3 派一致联盟

key_facts:
  - 松田道雄《育儿百科》§295 + §428 核心立场
  - 0-6 岁全段反对 — 比 Lansbury 0-2 更激进
  - 现代 iPad / 抖音版意义重大
  - 跟 Lansbury / Brazelton 形成反屏幕联盟


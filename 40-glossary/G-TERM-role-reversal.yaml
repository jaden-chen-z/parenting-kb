glossary_id: G-TERM-role-reversal
type: term
display_name: 角色倒置 (role reversal)

full_name_en: Role Reversal (Parent-Child)
full_name_zh: 角色倒置(亲子角色颠倒)

one_liner: |
  Bowlby Vol 2 提出的概念:**父母颠倒正常的亲子关系,期望孩子照顾自己的情绪 / 安全感 / 决策**。
  孩子表面"懂事 / 贴心",内部多是焦虑型依恋。中文文化高频版本:"妈妈这辈子就指望你了"。

detail: |
  ## 概念定义
  Bowlby Vol 2(1973)第十六章 + 第十八章:在某些家庭中,**父母把自己的依恋需求投射到孩子身上**,
  让孩子扮演"被需要的依恋对象 / 情感支柱"角色,而父母自己则退化为"需要被安慰的孩子"。
  原文:**"父母公开或者私底下要求孩子以一个照顾者的身份出现并照顾家长。这颠倒了正常的父母-儿童角色。
  在这些案例中是父母过度依赖,而非孩子。"**

  ## 主要表现形式

  ### 1. 情绪层面
  - "妈妈不开心,你赶紧抱抱妈妈"
  - "你听话妈妈才不会难过"
  - "你别让妈妈生气啊"
  - 把孩子当"知己"倾诉婚姻 / 工作问题
  - 用孩子"懂事"换妈妈情绪稳定

  ### 2. 安全感层面
  - "妈妈这辈子就指望你了"
  - "妈妈不能没有你"
  - "你长大别离开妈妈"
  - 通过孩子缓解自己分离焦虑
  - 妈妈"舍不得"孩子上学 / 独立

  ### 3. 决策层面
  - 让孩子替父母拿主意
  - "你看妈妈该怎么办"
  - 把成人困难推给孩子(经济 / 婚姻)

  ### 4. 拒学症 A 模式(Bowlby Ch 18)
  Bowlby 在拒学症 4 模式中,**模式 A 就是角色倒置**:
  母亲长期焦虑无法独处 → 把孩子留在家里作为陪伴 → 孩子拒绝上学。
  这是 Bowlby 临床观察最常见模式。

  ## 代际机制
  Bowlby Vol 2 重要发现:**角色倒置高度代际传递**。
  典型路径:
  1. 外婆把妈妈当情感支柱(外婆有自己的焦虑型依恋)
  2. 妈妈学会"我必须照顾妈" → 长大被迫早熟
  3. 妈妈自己当妈后,**重复同一模式** → 让孩子照顾自己
  4. 孩子内化"我必须懂事" → 第三代角色倒置

  ## 临床表现(被角色倒置的孩子)
  ### 短期(儿童期)
  - 看似"懂事 / 贴心 / 早熟"
  - 拒绝独立活动(怕妈妈难过)
  - 拒学症 A 模式
  - 隐性焦虑 + 心身症状
  - 18 岁后突然"叛逆"或一直懂事到崩溃

  ### 长期(成年后)
  - **取悦型人格**(People Pleaser)
  - 边界感差
  - 不会拒绝
  - 焦虑型亲密关系
  - 对父母有深层愤怒但不敢表达
  - 自己当父母时再次角色倒置

  ## 中文文化高频特征
  - "懂事的孩子真贴心" 是赞美 → 实际可能是创伤
  - "孝顺"被绝对化 → 孩子情绪劳动正常化
  - 老人"我吃不下你也别吃" 情绪绑架
  - "都是为了你"作为操控话术
  - 单亲家庭尤其高发("我就只有你了")

  ## 跟"过度保护"的区别
  - **过度保护**:父母焦虑孩子安全 → 限制孩子活动
  - **角色倒置**:父母焦虑自己孤独 → 用孩子缓解
  - 表面相似(都让孩子不独立)
  - 实质不同(过度保护看似为孩子,角色倒置实为父母)
  - **角色倒置更隐秘 → 更难识别 → 更难干预**

  ## 干预原则(Bowlby)
  1. **父母先治自己** — 不能让孩子继续负担
  2. **反思童年** — 你是否也被角色倒置养大
  3. **让孩子做孩子** — 鼓励"自私" / 不必懂事
  4. **建立边界** — 自己的难受找成人帮助
  5. **配偶 / 治疗师** — 父母的依恋需求由成人对象提供

  ## 在本知识库中
  - C-S6-093 别让娃当你情绪保姆 — 角色倒置概念主卡
  - C-S7-043 妈不舍 = 妈自己焦虑 — 代际传递
  - C-S7-041 拒学和逃学不同 — Bowlby Ch 18 模式 A
  - C-S6-099 我是为你好的陷阱 — 伪造叙事配合角色倒置

key_facts:
  - Bowlby Vol 2 提出,父母颠倒亲子角色
  - 父母让孩子扮演情感支柱 / 决策者 / 安全感来源
  - 拒学症 A 模式的核心机制
  - 高度代际传递(75%)
  - 长大变取悦型人格 + 边界差 + 焦虑型亲密关系
  - 中文文化"懂事孝顺"常见包装


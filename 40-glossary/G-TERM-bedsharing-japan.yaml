glossary_id: G-TERM-bedsharing-japan
type: term
display_name: 日式母婴同睡(分龄立场)

full_name_zh: 母婴同睡(日式分龄)
full_name_ja: 添い寝(そいね, soine)
full_name_en: "Bedsharing — Japanese age-graded position"

one_liner: |
  松田道雄 §258 立场 — 不满 3 月禁同床(防压窒息), 8 月后 OK(寒冷季节实用), 跟 AAP 全段反 bedsharing 立场对立。

detail: |
  ## 概念定义

  日式母婴同睡传统 — "添い寝"(soine)是日本传统养育方式,被松田道雄从医学和家庭管理两个维度细化为分龄立场。

  ## 松田立场(§258)

  1. **不满 3 月** — 禁止同床(母亲乳房压迫导致窒息死亡过案例);
  2. **过 8 月** — 同床 OK(寒冷季节抱回被窝最实用);
  3. 同床效果:夜里哭不用一次次起 + 母乳更增多;
  4. **效果限制**:
     - 看父亲反应 — 别影响他工作
     - 父亲跟着醒玩 → 易养成孩子夜玩毛病
  5. **西方过 3 月分房**是西洋立场 — 不适合日本住宅 + 风俗;
  6. 哺乳期妈妈:同床更易夜里喂奶 + 妈妈睡眠保护。

  ## 跟其他派别立场对照

  | 派别 | 立场 |
  |---|---|
  | **松田(日)** | 3 月内禁,8 月后 OK,看家庭情况 |
  | **AAP(美)** | 0-12 月反对 bedsharing(SIDS 风险) |
  | **AAP** 推荐 | room-sharing(同房不同床)1 年 |
  | **Brazelton(美)** | 同床 vs AAP 立场分歧 — 认可家庭差异 |
  | **WHO** | 母乳期母婴同房推荐 |
  | **Sears(亲密育儿)** | 全段同床 |
  | **现代日本** | 多数家庭 0-3 岁同床(传统延续) |
  | **现代美国** | 多数家庭 0-1 岁不同床 |

  ## 跟中国传统对照

  中国传统:
  - 0-3 岁基本母婴同床(住宅小)
  - 老一辈喜欢"奶睡"
  - 现代分床派(参 AAP) vs 同床派(传统)

  松田立场:**3 月内禁** — 跟中国传统"出生就同床"派对立;
  **8 月后 OK** — 跟现代 AAP 派对立。
  中道立场,适合中国家长参考。

  ## SIDS 风险与现代研究

  AAP 2022 SIDS 政策:
  - 0-12 月反对 bedsharing
  - 推荐 room-sharing
  - 仰睡 + 硬床垫 + 无毯子枕头
  - 跟 SIDS 强相关:bedsharing + 父母吸烟 / 肥胖 / 服药

  松田 §258 立场实际跟 AAP 仰睡 + 硬床垫 + 防压一致 — 只是
  "8 月后是否 OK"是关键分歧点。

  ## 中国家长直接相关

  现实场景:
  - 住宅小,3 月就同床现实
  - 怎么降低 SIDS 风险:仰睡 + 硬床垫 + 别盖太厚 + 父母不喝酒
  - 8 月后改成 room-share 不同床(AAP 立场)还是继续同床(松田立场)

  conflicts.md 必记 — 用户家庭自己定,不强判对错。

  ## 在本知识库中

  - SRC-024 §258 核心概念
  - 跟 AAP 立场对立 — conflicts.md 整合点

key_facts:
  - 松田道雄《育儿百科》§258 分龄立场
  - 3 月内禁(防压) / 8 月后 OK(实用)
  - 跟 AAP 0-12 月反对 bedsharing 全段对立
  - 现代日本传统延续,跟现代美国对立


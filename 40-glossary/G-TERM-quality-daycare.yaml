glossary_id: G-TERM-quality-daycare
type: term
display_name: 优质保育园 5 标准 (Quality Daycare)

full_name_en: Quality Daycare Criteria
full_name_zh: 优质保育园 5 标准

one_liner: |
  松田道雄给出选保育园的 5 条硬指标 — 1:3 保育员比婴儿是底线,反"事故防范取代教育导向"。
  中国家长选保育园的实操检查表。

detail: |
  ## 5 大标准(松田版)

  ### 1. 保育员:婴儿比例 = 1:3 (底线)
  1 名保育员照料 ≤ 3 个婴儿,正常保育才能开展。
  > 1:3 → 保育活动被事故防范挤占,不是教育导向。
  现实中国托育园多为 1:5 / 1:8,远低于此标准。

  ### 2. 仅收 0-1 岁(避混龄)
  有的园打"婴儿保育"旗号但招 0-3 岁混龄。
  混龄 → 大龄孩子优先,小婴儿被忽视。
  优质园应严格按月龄分组。

  ### 3. 婴儿室宽敞 + 通阳台
  不可太狭小,要有婴儿游戏空间。
  最好与阳台相通,便于空气浴。

  ### 4. 跟家庭密切沟通 + 家访
  优质保育需保育员心血 + 家长配合。
  必要时保育员家访,了解娃在家状态。

  ### 5. 离家越近越好
  即使硬件次,近距优于远距。
  避免延长保育(母子 8 小时以上分离不利娃)。

  ## 其他重要立场

  ### 8 小时是国家标准
  公立保育园保育员是国家公务员,工作 8 小时(9:00-17:00)。
  私立园多延长,但延长保育对娃健康成长不利。

  ### 集体生活 vs 家庭生活不可互相取代
  保育园学同伴相处;家庭学子女与长辈相处。
  延长保育让娃回家就睡,失去家庭生活体验。

  ### 24 小时全日制保育园弊端
  父母和孩子都需要"家庭"私人空间。
  把不适宜生活方式强加给孩子,不如不要孩子。

  ## 与中国家长的关联
  - 中国托育市场鱼龙混杂,1:8 / 1:12 比比皆是
  - 选名牌远程园 → 通勤增加,娃延长保育疲惫
  - 选托育园 vs 老人带 vs 全职妈,松田倾向"质量第一"

  ## 与现代研究的关系
  - 美国 NICHD 早期儿童看护研究 → 高质量看护(1:3 比)对娃发展正面
  - Bowlby 立场:替代看护可以,但要稳定+少切换+高质量
  - 跟 Bowlby V2 C-S6-090(现代托儿所救不了)对照

key_facts:
  - 松田 5 标准:1:3 比 + 0-1 岁 + 阳台 + 家访 + 近距
  - 1:3 是硬底线,> 1:3 不是教育是事故防范
  - 8 小时是国家标准,延长保育不利娃
  - 集体生活不能取代家庭生活
  - 中国托育多 1:5/1:8,远低于此标准


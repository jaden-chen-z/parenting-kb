full_name_en: Ellen Winner
full_name_zh: 艾伦·温纳

one_liner: |
  美国心理学家(波士顿学院教授),儿童艺术发展 + 神童研究权威。
  Lerner V2 Ch20 Arts in Drawing and Music 主笔。

detail: |
  ## 个人背景
  - 哈佛大学博士
  - 波士顿学院心理学教授
  - 哈佛大学 Project Zero 高级研究员

  ## 核心研究:艺术发展
  - 绘画跟音乐发育不同步
  - 神童 = 单域突出非全才
  - 早期天赋识别有限度

  ## 立场
  - 反全才神童概念
  - 反"艺术训练越早越好"
  - 跟 Gardner 多元智能派同方向

  ## 在本知识库中
  - SRC-028 Lerner V2 Ch20 主笔
  - C-S8-426 Winner 绘画 vs 音乐发育不同步


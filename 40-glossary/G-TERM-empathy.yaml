glossary_id: G-TERM-empathy
type: term
display_name: empathy 共情

en_term: empathy
zh_term: 共情 / 同理心

one_liner: |
  理解 + 分享他人感受的能力。Zahn-Waxler 经典:
  1 岁前情绪传染(不是真共情)→ 12-18 月开始尝试安慰 →
  24 月真共情(主动安慰)→ 3-6 岁理解他人感受。
  安全依恋 + 父母示范是共情发育的最强因子。

detail: |
  ## 发展时间线(Zahn-Waxler 1990)
  - **0-12 月**:**情绪传染** — 看到人哭跟着哭(不是共情)
  - **12-18 月**:开始尝试安慰(给玩偶 / 摸 / 说什么)
  - **24 月**:**真共情** — 不只情绪传染,还主动帮人
  - **24-36 月**:能调整自己行为响应别人情绪
  - **3-6 岁**:理解他人感受 + 假装情绪 + 隐藏情绪

  ## 经典实验(Zahn-Waxler)
  - 妈装哭 → 18 月宝宝看
  - 15-18 月一些宝宝拿玩具递给妈
  - 24 月宝宝主动抱 + 摸 + 说"妈妈不哭"
  - 这种主动安慰 = 真共情萌芽

  ## NRC 立场(Ch 5)
  - 共情**不是教**出来的 — 是发展自然出现
  - 但**安全依恋的孩子共情发育更早 + 更深**
  - 经常被忽视的孩子 → 共情发育延迟
  - 经常被打骂的孩子 → 共情转化为恐惧 / 顺从而非真理解

  ## 跟其他能力关系
  - **跟 self-other 区分**(2 岁起)同步发展
  - **跟 theory of mind**(3-4 岁)是不同能力
  - **跟自我调节**(2-6 岁)互相支持
  - **跟道德发展**(4-6 岁)是基础

  ## 培养共情
  - 你共情他 → 他学共情你(示范)
  - 命名他的情绪 → 教情绪词汇
  - 故事书中讨论角色感受
  - **不要**:强教"分享 / 道歉" — 表面顺从无内里
  - **不要**:羞辱"你怎么没安慰妈" — 反让共情焦虑化

  ## 跨文化
  - 全人类婴幼儿都发展共情(Decety 跨文化 fMRI 研究)
  - 但表达方式因文化而异
  - 中国文化更重 "顾及面子 / 不让人尴尬" 类共情

key_facts:
  - Zahn-Waxler 经典发育曲线
  - 24 月起真共情
  - 安全依恋 + 示范是关键
  - NRC Ch 5 引用


glossary_id: G-TERM-defensive-exclusion
type: term
display_name: 防御性排除 (defensive exclusion)

full_name_en: Defensive Exclusion
full_name_zh: 防御性排除

one_liner: |
  Bowlby Vol 2 引申概念:孩子为了避免承受痛苦的依恋创伤,**主动把相关感受 / 记忆 / 想法
  从意识中排除**。是焦虑型依恋的核心防御机制,长大变成"压抑 / 回避型人格"的根源。

detail: |
  ## 定义
  Bowlby 借用认知心理学概念,将经典精神分析的"压抑"(repression)重新命名为
  "防御性排除"(defensive exclusion):
  孩子在面对**无法消化的依恋创伤**(分离 / 威胁抛弃 / 父母敌意)时,
  自动启动一种"信息处理过滤器",**把不能承受的内容隔离在意识之外**。

  ## 三种排除内容
  1. **感受被排除**:孩子不再感到对父母的愤怒 / 悲伤(变得"麻木")
  2. **记忆被排除**:对创伤性事件的记忆变得模糊 / 缺失
  3. **想法被排除**:不允许自己想"妈妈可能不爱我"

  ## 与超脱(detachment)的关系
  - 超脱是行为表现(对妈妈情感隔离)
  - 防御性排除是底层机制(信息被过滤)
  - 长期超脱 → 防御性排除固化 → A 回避型依恋成人

  ## 临床表现
  ### 儿童版
  - 创伤后看似"忘了"事件细节
  - 对父母无强烈情绪("我不在乎")
  - 用其他对象表达隐藏的感受(咬玩偶 / 怕黑代替怕妈走)
  - 拒绝谈论敏感话题

  ### 成年版
  - 童年关键事件失忆
  - 对原生家庭"无所谓"
  - 亲密关系中情感隔离
  - "不需要任何人"
  - 解离 / 分裂状态

  ## 为什么 Bowlby 命名为"防御性排除"
  1. **强调主动性**:不是被动遗忘,是主动过滤
  2. **强调防御功能**:孩子用此保护自己不被痛苦淹没
  3. **避免精神分析"压抑"的负担**:压抑暗示驱力理论,排除是认知框架

  ## 在本知识库中的应用
  - C-S6-085 重聚不认妈是危险信号 — 防御性排除的开端
  - C-S7-040 怕黑/打雷可能是怕妈走 — 排除真实恐惧 → 投射
  - C-S6-094 分离后愤怒是健康 — 不让排除发生的方法
  - 焦虑型依恋的回避型分支(A 型)= 长期防御性排除固化

  ## 干预原则
  Bowlby 强调:**让孩子安全地重新接触被排除的内容,是治愈的关键**。
  - 父母接住孩子的"清算"问题(C-S6-094)
  - 别强迫孩子"忘了过去"
  - 给名字给情绪("你那时害怕了对吗")
  - 创伤治疗的核心:减弱防御性排除的需要

key_facts:
  - Bowlby Vol 2 提出,认知框架版的"压抑"
  - 应对依恋创伤的自动防御
  - 排除内容:感受 / 记忆 / 想法
  - 长期固化 → 回避型依恋成人 + 解离倾向
  - 治愈靠安全重接,不靠强迫遗忘


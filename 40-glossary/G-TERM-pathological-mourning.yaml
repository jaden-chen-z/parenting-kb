glossary_id: G-TERM-pathological-mourning
type: term
display_name: 病理性哀伤 (pathological mourning)

full_name_en: Pathological Mourning
full_name_zh: 病理性哀伤

one_liner: |
  Bowlby 提出的概念:正常哀伤会逐渐消化丧失,**病理性哀伤被卡在抗议 / 绝望阶段无法走完**,
  长期表现为抑郁 / 焦虑 / 愤怒 / 解离。儿童丧失亲人不被允许哀伤,**长大后高发**。

detail: |
  ## 定义对比
  ### 正常哀伤(normal mourning)
  - 阶段 1:**麻木 / 否认**(几小时-几天)
  - 阶段 2:**渴望 / 寻找**(几周-数月)
  - 阶段 3:**绝望 / 重组**(几月-1 年)
  - 阶段 4:**重新整合**(1 年-数年)
  - 最终:接受丧失 + 内化已故对象 + 生活继续

  ### 病理性哀伤(pathological mourning)
  - 卡在前 3 阶段任一,无法走完
  - 表现:**长期抑郁 + 焦虑 + 愤怒 + 解离**
  - 多年后被一些事件触发依然激烈
  - 可能伪装成其他症状(身心症 / 恐怖症)

  ## Bowlby Vol 2 重点:儿童丧失亲人的脆弱性
  Bowlby 第二卷处理"分离 + 威胁",第三卷《丧失》专门处理丧失。
  Vol 2 已经埋下伏笔:**儿童特别容易发展病理性哀伤**,原因:
  1. 不被允许参与哀伤(家长隐瞒,C-S6-096)
  2. 不被允许表达哀伤("乖,别哭了")
  3. 缺乏"永久"概念(9 岁前不真正懂死,C-S7-038)
  4. 替代依恋人不稳定 → 无法重组
  5. 家长自己病理哀伤 → 孩子没有榜样

  ## 临床表现(儿童版)
  ### 急性
  - 拒认事实(认为亲人会回来)
  - 对在世亲人极度黏人
  - 反复梦"亲人回来"
  - 突然冒出愤怒
  - 怕黑 / 怕分离 / 退化行为

  ### 慢性(数月-数年后)
  - 长期低落
  - 学校 / 社交退缩
  - 心身症状
  - 反复"奇怪的怕"
  - 假装没事但莫名忧郁
  - 拒学症(C-S7-041)
  - 为某事突然崩溃(触发器)

  ## 易发因素(Bowlby Vol 2)
  - **父母隐瞒**:孩子用想象填补,加深创伤
  - **没有告别仪式**:无法心理上闭环
  - **替代依恋人不稳定**:无法移情重组
  - **家长自己有病理哀伤**:无法引导孩子
  - **角色倒置**:孩子被要求照顾父母情绪

  ## 预防 / 干预原则
  ### 儿童丧亲的家长指南(基于 Bowlby + 后续临床研究)
  1. **告诉真相**(用孩子能懂的语言)— 不隐瞒
  2. **允许参与告别**(写信 / 葬礼适龄选)
  3. **允许哭和发怒**,不压制
  4. **重复回答问题**,不嫌烦
  5. **保留逝者的物品 / 照片**
  6. **建立稳定的新依恋人**(不一定是新妈,可以是稳定的亲属)
  7. **观察 1 年后的状态**,有问题求助专业治疗

  ## 中文文化常见误区
  - "他还小不告诉" → 加重焦虑(C-S6-096)
  - "已经过去就不提了" → 阻止哀伤完成
  - "你要坚强" → 把哀伤改装成压抑
  - 葬礼把孩子隔开 → 错过告别仪式
  - "妈妈走了你就有新妈了" → 否定原依恋情感

  ## 在本知识库中
  - C-S6-096 病故别瞒孩子 — 直接相关
  - C-S7-038 9 岁前不怕死 — 认知前提
  - C-S6-082 分离反应 3 阶段 — 哀伤的前奏
  - 留待 Phase 5 Bowlby Vol 3《丧失》系统化

key_facts:
  - 哀伤过程被卡在前 3 阶段无法完成
  - 长期表现为抑郁/焦虑/愤怒/解离
  - 儿童特别脆弱,因不被允许哀伤
  - Bowlby Vol 3《丧失》系统阐述,Vol 2 埋伏笔
  - 预防靠告知真相 + 允许哀伤 + 稳定新依恋


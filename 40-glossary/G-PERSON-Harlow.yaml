glossary_id: G-PERSON-Harlow
type: person
display_name: Harlow

full_name_en: Harry Frederick Harlow
full_name_zh: 哈里·哈洛

one_liner: |
  美国心理学家 (1905-1981),做了 20 世纪最有影响力的依恋实验:**恒河猴幼崽 vs "金属丝妈妈"和"绒布妈妈"**。
  实验结果:小猴宁愿饿肚子也要找绒布妈妈安慰。**直接推翻 Freud "次级驱力"(吃饱才会爱)理论**,为 Bowlby 依恋理论提供决定性实证。

detail: |
  ## 个人背景
  - 1905 年生于爱荷华
  - 斯坦福大学博士(1930)
  - 威斯康星大学麦迪逊分校 30+ 年(1930-1974)
  - 1974 年去世

  ## 核心实验(1958-1965)

  ### 1. "金属丝妈妈"vs"绒布妈妈"(1958)
  实验设计:
  - 把刚出生的恒河猴跟亲生母亲分开
  - 提供两个"代母":
    - **金属丝妈妈**:身上挂奶瓶,提供食物
    - **绒布妈妈**:柔软,但不提供食物
  - 观察小猴喜欢去哪个

  **结果**(颠覆性):
  - 小猴大部分时间黏在**绒布妈妈**身上
  - 只在饿时短暂跑到金属丝妈妈那喝奶
  - 受惊吓时**冲到绒布妈妈那寻求安慰**
  - 即使饿肚子也不愿离开绒布妈妈

  **意义**:**爱不是"吃饱后的副产品"**(反 Freud 次级驱力理论)。
  接触安慰(contact comfort)是独立于喂养的初级需求。

  ### 2. 完全社交剥夺实验(1959-1965)
  实验设计(争议巨大):
  - 把小猴单独关在隔离笼中 3-12 月
  - 完全无社交接触

  **结果**:
  - 出来后无法与同类正常社交
  - 表现出严重的自残 / 攻击 / 刻板行为
  - 雌性长大后无法做合格母亲(虐待 / 忽视幼崽)
  - **童年依恋剥夺的代际传递实证**

  ### 3. "依恋恢复猴"实验(1971)
  - 严重剥夺的小猴
  - 安排"治疗者猴"(年幼正常猴)陪伴
  - 部分能恢复社交能力
  - **依恋损伤可逆性的早期证据**

  ## 实践影响
  - **决定性推翻"喂养 = 依恋"老观念**(C-S2-070 直接来源)
  - 推动孤儿院 / 寄养改革(配合 Spitz / Bowlby 研究)
  - 鼓励"袋鼠护理"(skin-to-skin)在新生儿病房推广
  - 影响 NICU(新生儿重症监护)改革:让父母能接触早产儿

  ## 伦理争议
  - 完全社交剥夺实验今天已不可能通过伦理审查
  - 但当时(1950s-60s)无替代方法
  - 部分晚期实验(垂直管 / 抑郁深井)被批评过度残忍
  - Harlow 本人也长期抑郁,与研究主题相关性受讨论

  ## 在本知识库中
  - C-S2-070(喂奶 ≠ 建立依恋)的实证基础来自 Harlow 1958
  - G-PERSON-Bowlby 卡多次引用 Harlow 实验作为理论支柱
  - G-TERM-attachment 卡的"接触安慰"概念源自 Harlow
  - C-S1-126(抓握反射 = 进化遗留)的灵长类背景源自 Harlow


glossary_id: G-ABBR-HepA
type: abbreviation
display_name: HepA

full_name_en: Hepatitis A Vaccine
full_name_zh: 甲型肝炎疫苗

one_liner: |
  预防甲型肝炎病毒(经粪-口途径传播,不慢性化但急性期严重)。中国一类苗(免费)18 月 + 24 月加强;美国 AAP 12-23 月起两针。中国曾普遍流行甲肝(1988 上海甲肝大暴发),疫苗后病例骤降。

detail: |
  ## 是什么
  HepA = Hepatitis A Vaccine
  - 预防 HAV(甲型肝炎病毒)
  - 经粪-口途径传播(污染水/食物 / 不洁手 / 共用餐具)
  - **不会慢性化**(区别于 HBV/HCV)— 但急性期严重(发热 / 黄疸 / 肝功能严重受损)
  - 5 岁以下症状轻微但传染性强;成人感染症状重

  ## 疫苗时间表

  ### 中国一类苗(免费)
  - 18 月:HepA 减毒活疫苗(国产)单针,或灭活疫苗第一针
  - 24 月:灭活疫苗第二针(若选灭活)
  - 减毒活疫苗:免费一针,免疫持久
  - 灭活疫苗:免费两针(部分省市自费)

  ### 美国 AAP
  - 12-23 月:第一针
  - 6-18 月后:第二针(共两针)
  - 2024 起 AAP 推荐 1 岁起常规接种

  ### 高风险地区/旅行
  - 国际旅行去甲肝高发区前 2-4 周接种
  - 接触甲肝病人后 14 天内 PEP(暴露后预防)有效

  ## 为什么重要(中国背景)
  1988 年上海甲肝大暴发(31 万人感染,主因生食毛蚶)— 中国甲肝公共健康教训。
  疫苗普及后:
  - 1992 上海发病率 49/10 万 → 2010s <5/10 万
  - 但近年仍有局部流行(主要是未接种成人 + 餐饮卫生不良)

  ## 接种反应
  - 局部红肿(自限 48h)
  - 低热(<38.5°C)
  - 极少严重反应

  减毒活疫苗禁忌:
  - 免疫缺陷
  - 孕妇
  - 急性发热

  ## 误区
  - "甲肝不慢性化所以没必要" — 错。急性期可肝衰竭致死,且儿童传染性极强
  - "成人小时候打过抗体长期" — 部分对,但需要查 anti-HAV-IgG 确认

key_facts:
  - HAV 经粪-口传播(食物/水)
  - 不慢性化但急性期严重
  - 中国一类苗 18 月起免费
  - 美国 AAP 1 岁起常规接种
  - 1988 上海大暴发是中国疫苗推广直接动因
  - 减毒活 vs 灭活两类疫苗(灭活更广泛使用)


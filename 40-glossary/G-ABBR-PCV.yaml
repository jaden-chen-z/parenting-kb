glossary_id: G-ABBR-PCV
type: abbreviation
display_name: PCV

full_name_en: Pneumococcal Conjugate Vaccine (PCV13/PCV15/PCV20)
full_name_zh: 肺炎球菌结合疫苗(13 价/15 价/20 价)

one_liner: |
  预防肺炎球菌引起的侵袭性疾病(脑膜炎 / 菌血症 / 严重肺炎)。中国二类苗自费(辉瑞沛儿 / 默沙东万菲乐 PCV13);美国 AAP 一类强烈推荐 2-4-6-12-15 月四针。PCV 是 0-2 岁严重感染的关键防线。

detail: |
  ## 是什么
  PCV = Pneumococcal Conjugate Vaccine(肺炎球菌结合疫苗)
  - 预防肺炎球菌(Streptococcus pneumoniae)细菌
  - 13 价 = 含 13 种最常见血清型;15/20 价是新代,覆盖更广
  - "结合"= 多糖抗原结合载体蛋白 → 婴幼儿能产生免疫(普通多糖疫苗 2 岁前无效)

  ## 预防的疾病
  侵袭性肺炎球菌疾病(IPD):
  - 细菌性脑膜炎(3 岁内首因之一,致死率 5-10% + 后遗症)
  - 菌血症(血液细菌感染)
  - 严重肺炎(肺浸润性)
  - 中耳炎(部分预防)

  ## 疫苗时间表

  ### 中国(二类苗,完全自费)
  - PCV13(辉瑞沛儿 13):2 月、4 月、6 月、12-15 月(四针)
  - PCV13(默沙东万菲乐):同时间表
  - 单针约 ¥700-900,全程约 ¥3000+
  - 公立医院 + 私立疫苗诊所均可接种

  ### 美国 AAP(一类强烈推荐)
  - 2 月、4 月、6 月、12-15 月(共四针)
  - 现 AAP 已批准 PCV15 替代 PCV13(2022)

  ### 早产儿
  按实际日龄接种,不延后

  ## 为什么中国是二类(自费)?
  中国 PCV 一直是二类苗,主要原因:
  - 价格高(单针约 ¥700-900,全程 ¥3000+,远高于其他疫苗)
  - 国家免疫规划逐步纳入(部分省市已对低保家庭免费)
  - WHO 强烈推荐纳入国家免疫规划,中国进展中

  AAP / WHO 立场:**PCV 是 0-2 岁最重要的疫苗之一**,经济条件允许应自费接种。

  ## 接种反应
  常见(打针后):
  - 局部红肿(48 小时内消退)
  - 低热(38°C 以下,自限)
  - 烦躁 / 嗜睡(1-2 天)

  严重反应极罕见(<1/百万)。

  ## 误区
  - "宝宝不去公共场所不用打" — 错。肺炎球菌可家庭传播(成人无症状携带 30%+)
  - "PCV13 不如 23 价覆盖广" — PPSV23 是多糖疫苗,2 岁前无效;两者不同
  - "贵就是没用" — PCV 是 1990s 后儿科最成功的疫苗之一,IPD 下降 75%+

key_facts:
  - 中国二类苗(自费 ¥3000+)/ 美国 AAP 一类推荐
  - 预防细菌性脑膜炎 / 菌血症 / 严重肺炎
  - 2 月、4 月、6 月、12-15 月四针(全程)
  - PCV13 = 辉瑞沛儿 / 默沙东万菲乐
  - 1990s 后 IPD 下降 75%+
  - 早产儿按实际日龄接种


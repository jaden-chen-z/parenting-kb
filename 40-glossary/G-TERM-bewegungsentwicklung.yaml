glossary_id: G-TERM-bewegungsentwicklung
type: term
display_name: Bewegungsentwicklung 自然大动作发展

full_name_de: Bewegungsentwicklung
full_name_zh: 自然大动作发展(自由动作发展)
full_name_en: Natural Gross Motor Development

one_liner: |
  Pikler 1969 德文核心概念 — 婴儿大动作发展(翻 / 坐 / 爬 / 站 /
  走)是自动的,不需要"教"或"训练"。给可探索区 + 自由活动时间,
  一切自然发生。是 RIE 派 + 蒙氏 0-3 共同根源。

detail: |
  ## 词源
  - **Bewegung** = 德文"动作 / 运动"
  - **Entwicklung** = 德文"发展"
  - 合起来:"动作发展"— 但 Pikler 用法特指**自然 / 自由的动作发展**
  - 跟"训练" / "教" / "干预"对立

  ## Pikler 1969 立场(本概念源头)
  - 婴儿大动作发展有自然顺序 — 仰卧 → 翻 → 爬 → 坐 → 站 → 走
  - 不需要任何形式的训练 / 教学 / 引诱
  - 大人提供:安全平面 + 时间 + 不打扰
  - 自动会发生

  ## 三个具体反对立场
  1. **不撑坐**(no-propping) — 婴儿没自己学会前不让"被撑成坐姿"
  2. **不教翻 / 爬 / 站 / 走**(no teaching motor) — 抓他手脚做动作 = 干扰
  3. **不练**(no training) — 婴儿体操 / 游泳课 / 感统训练全反

  ## 实操配方
  - 出生即仰卧(不竖抱不俯卧)
  - 衣服宽松到能自由动腿
  - 每天数小时地板时间(平面 + 安全)
  - 大人在视野内但不参与玩
  - 失败 / 摔倒不评论(让他自己学)

  ## 跟现代派的关系
  - **Magda Gerber RIE**(1978):整章 Educaring 哲学搬运
  - **Lansbury**(2014):Ch7 不撑坐 8 理由 + Ch15 7 myths play 复述
  - **蒙氏 0-3**(Davies / Lillard):floor bed + 大动作自由发展共用
  - **AAP**(2026):反学步车跟 Pikler 一致
  - **Brazelton**(C-S3-033):反学步车跟 Pikler 一致

  ## 跟"训练派"的对立
  - **中国主流**:4 月翻 / 6 月坐 / 9 月爬 / 12 月走 训练表 — Pikler 严反
  - **鲍秀兰**(SRC-009):部分支持婴儿体操 + 抓握训练 — Pikler 严反
  - **松田道雄**(SRC-024):立场温和(支持空气浴 + 自由空间 — 跟 Pikler 一致)

  ## 注意
  - Bewegungsentwicklung **不等于** "fitness" / "sports skill"
  - 是身体 + 神经 + 平衡 + 协调 整体发展(holistic)
  - 失去自然顺序的发展 → 后期协调 / 平衡 / 写字困难

key_facts:
  - Pikler 1969 德文核心概念
  - 自然 / 自由 / 不教 三大特质
  - 反训练 / 反撑坐 / 反学步车
  - RIE + 蒙氏 0-3 共同根源
  - 跟中国训练表立场对立


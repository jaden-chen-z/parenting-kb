glossary_id: G-TERM-imaginary-friend
type: term
display_name: 想象朋友 (imaginary friend)

full_name_en: Imaginary Friend / Imaginary Companion
full_name_zh: 想象朋友 / 假想伙伴

one_liner: |
  3 岁老大/独生子女几乎都会发展。能做"坏事"承担"好事",孩子说起来跟说真人没区别。Brazelton 警告:**不要追问/侵入**——成年人谈论时想象朋友会"融化消失"。

detail: |
  ## 定义
  Imaginary friend 指 3-5 岁儿童创造的、**对孩子来说非常真实**的虚构伙伴。
  研究估计 2/3 的儿童在某个时段有过想象朋友,**老大、独生子女、富有想象力的孩子比例更高**。

  ## 典型表现
  - 给想象朋友取名字、性格、外貌
  - 留座位给它、留食物给它、跟它聊天
  - **甩锅**:"不是我打翻的,是 X 打的"
  - **承担**:"X 想要这个"(说自己想要的方式)
  - 描述时跟说真人没区别,孩子完全不觉得"假"

  ## Brazelton 的关键警告
  > "**不要追问。不要试图揭穿。不要逗它'你是真的吗?'**
  > 一旦成年人开始公开讨论这个想象朋友,
  > 它就会'融化'消失——这恰好是孩子最需要它的时候。"

  - 想象朋友是孩子的**私人心理空间**——属于孩子,不属于父母
  - 它在孩子的发展中承担多个功能:
    - **角色扮演练习**:试演不同的"我"
    - **情绪外化**:把不能直接表达的感受投射给它
    - **道德试验场**:让 X 做坏事来感受后果
    - **孤独的陪伴**:特别是老大被弟妹挤走、或独生
  - 父母过早"理性化"它会剥夺这个心理空间

  ## 引用爱默生
  Brazelton 在书中引用 Ralph Waldo Emerson:
  > "Respect the child. Trespass not on his solitude."
  > (尊重孩子。不要侵入他的独处。)

  这句话被 Brazelton 用来概括对待想象朋友(以及更广泛的儿童内心世界)的原则。

  ## 父母应对原则
  1. **接住它**:孩子说"X 喜欢这个",父母回应"哦,那 X 真有眼光"——不质疑
  2. **不强化也不打压**:不需要给 X 摆碗筷,也不需要"那只是想象的"
  3. **不向外人 reveal**:孩子让爷爷奶奶认识 X 是孩子的事,父母不主动剧透
  4. **不利用它管教**:"X 会哭哦"这种威胁会破坏想象空间
  5. **接受它会自然消失**:通常 5-7 岁随着同伴关系变密、上学,自然淡出

  ## 临床意义
  - 拥有 imaginary friend 的孩子在情绪管理、创造力、共情上**普遍优于**没有的孩子
  - 这与 1950s 把 imaginary friend 视为"精神病前兆"的旧观点完全相反
  - 仅当伴随其他严重心理问题(完全脱离现实、严重攻击行为)才需评估

  ## 在本知识库中
  - C-S7-019 2-3 岁想象朋友(典型现象)

key_facts:
  - 3-5 岁普遍现象,2/3 儿童有过
  - 老大/独生子女比例更高
  - Brazelton 警告:不要追问,会"融化"
  - 引爱默生:Respect the child
  - 反与 1950s 病理化观点:有 IF 的孩子情绪/创造力更强


glossary_id: G-TERM-cognitive-burst
type: term
display_name: 认知爆发 (cognitive burst)

full_name_en: Cognitive Burst
full_name_zh: 认知爆发

one_liner: |
  4-5 月时宝宝喂奶分心,被窗外吸引、四处张望。视力第一次能聚焦远距离。Brazelton:不是"不爱喝奶",1-2 周自然回归。

detail: |
  ## 定义
  Cognitive burst 是 Brazelton 用来描述**认知能力跃升时伴随的行为短期紊乱**的术语,
  在 Touchpoints 模型里属于一个典型的 touchpoint 表现。

  ## 4-5 月的经典案例
  - **生理基础**:4-5 月时婴儿的视觉皮层成熟,**第一次能聚焦超过 2-3 米的远距离物体**
  - **行为表现**:喂奶时不停转头,被窗外的光、声音、人吸引,吃几口就停
  - **父母焦虑**:常常以为"宝宝不爱喝奶了" / "奶量不够" / "厌奶"
  - **Brazelton 真相**:
    > "这不是厌奶,是认知爆发。
    > 宝宝刚发现这个世界比怀里的奶有趣得多——
    > 这是健康的发展信号。1-2 周后宝宝会调整、回归正常喂养节奏。"

  ## 其他认知爆发触点
  Cognitive burst 不止 4-5 月一次,在 touchpoint 系统里:
  - 6-7 月:开始追看远处声音来源
  - 9 月:object permanence 形成,执拗地找消失的物体
  - 1 岁:第一个词,饱和地输入语言
  - 18 月:符号游戏爆发,语言井喷
  - 每次爆发前都有 1-2 周的"行为退步":吃睡乱、易哭闹

  ## Brazelton 给父母的处方
  - **识别它**:把"厌奶"重新解读为"认知爆发"
  - **不强行喂**:在宝宝注意力被吸走时强喂会建立负面联想
  - **降低喂奶环境刺激**:安静昏暗的房间,避开窗户
  - **接受暂时性**:1-2 周内通常自行调整
  - **追体重而非追奶量**:体重正常就不需焦虑奶量

  ## 与 touchpoint 的关系
  - Touchpoint 是大概念——可预测的发展节点
  - Cognitive burst 是 touchpoint 的认知层面表现
  - 触点 = 认知爆发 + 行为退步 + 重组——三件套合称

  ## 在本知识库中
  - C-S3-028 3-6 月认知爆发(经典 4-5 月厌奶)
  - C-S3-030 3-6 月延展
  - C-S4-020 / C-S4-021 6-9 月延展
  - C-S5-022 / C-S5-023 9-12 月延展
  - C-S7-016 / C-S7-021 2-3 岁延展

key_facts:
  - 4-5 月经典案例:误判为"厌奶"
  - 视觉皮层成熟,第一次远距离聚焦
  - 1-2 周自然回归
  - 多个触点都会出现 cognitive burst
  - 处方:识别 + 降低环境刺激 + 追体重不追奶量


glossary_id: G-TERM-responsive-feeding
type: term
display_name: "反馈喂养"

en_term: "Responsive Feeding"
zh_term: "反馈式喂养"

one_liner: |
  看娃信号决定喂,不按时间表 — BFHI 第 8 步 + 跟 AAP/松田 共识。

detail: |
  ## 定义
  Responsive feeding — 看婴儿信号决定喂,不按时间表。
  
  ## 早期 vs 晚期信号
  - 早期:唇啜 / 吸吮 / 寻乳 / 踢腿 / 警觉
  - 晚期:哭(已过头,饿+情绪 → 难有效吸)
  
  ## BFHI 第 8 步 verbatim
  'Support mothers to recognize and respond to infant feeding cues.'
  
  ## 频次
  - 新生儿:8-12 次/24h
  - 1-3 月:仍 8-12 次
  - 'Cluster feeding'(群聚喂)正常
  
  ## 跟其他派关系
  - AAP(SRC-006):'on demand' 立场一致
  - 松田(SRC-024):反产院'3 小时定时' 一致(C-S1-761)
  - WHO BFHI:一致
  
  ## 辅食期延续
  6 月+ 加辅食仍 responsive — 看娃饱腹/饥饿信号。

key_facts:
  - "BFHI 第 8 步"
  - "AAP/松田/WHO 三方共识"
  - "早期信号:唇啜/寻乳/踢腿/警觉"


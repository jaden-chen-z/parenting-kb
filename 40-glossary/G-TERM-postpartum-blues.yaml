glossary_id: G-TERM-postpartum-blues
type: term
display_name: 月子忧郁 (postpartum blues / baby blues)

full_name_zh: 月子忧郁 / 产后情绪低潮
full_name_en: Postpartum Blues (Baby Blues)

one_liner: |
  80% 产妇在产后 3-10 天经历的情绪起伏:哭 / 易怒 / 失眠 / 焦虑。区别于 PPD 产后抑郁(2 周以上 + 严重)。Baby blues 自限不需治疗;PPD 必须就医。关键判断:**2 周后是否好转**。

detail: |
  ## 月子忧郁 vs 产后抑郁 vs 产后精神病(三个临床实体)

  | 维度 | Baby Blues 月子忧郁 | PPD 产后抑郁 | PP Psychosis 产后精神病 |
  |---|---|---|---|
  | 发病率 | 80% | 10-15% | 0.1-0.2% |
  | 出现时间 | 产后 3-10 天 | 产后 2 周-1 年 | 产后 2 周内,常急性 |
  | 持续 | < 2 周自限 | > 2 周不缓 | 必须立即就医 |
  | 严重度 | 轻微情绪低潮 | 中重度抑郁 | 幻觉/妄想/伤害自己/伤害宝宝 |
  | 处理 | 不需治疗,关爱即可 | 心理治疗 + 抗抑郁药 | 急诊住院 |
  | 区分关键 | 能正常照顾自己 + 宝宝 | 无法照顾 + 持续负面情绪 | 失去现实感 |

  ## Baby Blues 典型表现
  产后 3-10 天:
  - 突然哭(看广告也哭)
  - 易怒 / 烦躁
  - 失眠(疲惫但睡不着)
  - 焦虑(担心宝宝健康)
  - 情绪起伏大(早上好,下午崩)
  - 有"不像自己"的感觉

  原因:
  - 雌激素 + 孕激素 24h 内骤降(分娩后)
  - 催乳素急升
  - 睡眠剥夺
  - 角色巨变 + 责任压力

  ## 父母实操含义

  ### 1. **承认 baby blues 是正常的**
  - 不是"妈妈不爱宝宝"
  - 不是"妈妈不坚强"
  - 是激素 + 睡眠 + 角色压力的正常反应
  - 80% 的妈妈都经历

  ### 2. **2 周后必须好转**
  - 关键时间窗 = 2 周
  - 2 周后仍持续 / 加重 → 怀疑 PPD,必须看医生
  - 不要等"我会自己好的"

  ### 3. **爸爸 / 家人的关键角色**
  - **承担实操**(尿布 / 喂养 / 洗澡)— 让妈妈休息
  - **承担挡门**(亲戚 / 月嫂 / 来访)— Lillard C-S0-014 父亲缓冲器
  - **倾听不评价**(不说"你应该怎么做"或"别人不也好好的")
  - **观察 + 警惕**:2 周后没好转 → 主动建议看医生

  ### 4. **危险信号**(立刻就医)
  - 不能照顾自己
  - 不能照顾宝宝
  - 想伤害自己
  - 想伤害宝宝(包括"如果没有这宝宝就好了")
  - 看到 / 听到不存在的东西
  - 强烈持续负面情绪 > 2 周

  ## 与中国月子文化的张力
  中国"坐月子"传统的优点:
  - 全家照顾 → 减轻妈妈负担
  - 妈妈被允许"什么都不做"
  - 一定的隐私(住月子中心)

  缺点(可能加剧 baby blues):
  - 老人 / 月嫂"指导"压力(怎么哺乳 / 怎么带 / 你做错了)
  - 不允许出门 → 心情压抑
  - 强制各种禁忌(不能洗澡 / 不能流泪)→ 反而 backfire
  - 家庭关系紧张(婆媳 / 夫妻)

  Brazelton + Lillard 立场:
  - **保护妈妈隐私 + 自主权 比"完美月子"重要**
  - **挡门(C-S0-014)= 爸爸最关键任务**
  - **观察妈妈情绪 > 观察月子规矩**
  - 2 周后情绪不好转 = 必须就医,不要"再坐一周看看"

  ## 与 PPD 的区分(关键)
  - Baby blues:**自限,2 周内好转,妈妈仍能感受到爱**
  - PPD:持续 > 2 周,妈妈感受到"麻木 / 无法爱宝宝 / 想消失"
  - 两者可能转化(baby blues 不处理 → PPD 风险增)

  PPD 详细见 G-TERM-postpartum-depression(已建)。

key_facts:
  - 80% 产妇产后 3-10 天经历
  - 雌激素急降 + 睡眠剥夺 + 角色压力
  - 自限,2 周内好转
  - 关键 2 周后仍未好转 → PPD 风险
  - 爸爸 / 家人的承担 + 观察是核心
  - 中国月子文化可能加剧或缓解 baby blues
  - 危险信号必须立即就医


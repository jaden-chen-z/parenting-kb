one_liner: |
  Renninger 4 阶段:激发兴趣(situational interest triggered)→ 维持兴趣(situational interest maintained)→ 出现个体兴趣(emerging individual interest)→ 个体兴趣稳定(well-developed individual interest)。学习动机基础。

detail: |
  ## 定义
  Renninger 4 阶段:激发兴趣(situational interest triggered)→ 维持兴趣(situational interest maintained)→ 出现个体兴趣(emerging individual interest)→ 个体兴趣稳定(well-developed individual interest)。学习动机基础。

  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版)反复引用。

  ## 跨派对接
  V4 综述权威立场,跨章节多次出现,跟现库其他派有立场对照。

  ## 中国家长意义
  详见相关知识卡。


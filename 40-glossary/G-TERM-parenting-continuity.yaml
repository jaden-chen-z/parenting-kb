one_liner: |
  Bornstein 2 大原则之一 — 同一行为长时间持续 > 偶尔强度,每天 10 分钟胜过周末 1 小时

detail: |
  ## 定义
  Bornstein 2 大原则之一 — 同一行为长时间持续 > 偶尔强度,每天 10 分钟胜过周末 1 小时

  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版,Renninger-Sigel 主编)
  本卷反复引用术语 — 详细见相关章节。

  ## 跨派对接
  - V4 综述权威立场
  - 跨章节多次出现
  - 跟现库其他派(AAP / Brazelton / Shonkoff / 松田)有立场对照

  ## 中国家长意义
  详细见相关知识卡(C-S0-12xx / C-S6-13xx / C-S7-13xx / C-S8-7xx)


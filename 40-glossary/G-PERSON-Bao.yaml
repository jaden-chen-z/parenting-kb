full_name_zh: 鲍秀兰
full_name_en: null

one_liner: |
  北京协和医院儿科主任医师,50+ 年儿科临床 + 0-3 岁早期教育经验,中国儿童保健与早期教育领域元老。
  著《鲍秀兰谈婴幼儿潜能开发和早期教育》(2016)等家庭育儿丛书,Phase 3 第一本中文权威源。

detail: |
  ## 个人背景
  - 北京协和医院儿科原主任医师
  - 中国新生儿行为评估和早期教育领域开创人之一
  - 50+ 年儿科临床和儿童保健经验
  - 长期开展中国儿童早期发展研究和家长培训

  ## 主要贡献

  ### 1. 中国本土早期教育推广
  把美国 Brazelton《Touchpoints》、Piaget 认知发展理论等结合中国家庭实际,翻译成本土早教操作建议。

  ### 2. 0-3 岁分月龄早教方案
  把 0-3 岁分成 1 月、2 月、3 月、4 月、5 月、6 月、7-8 月、9-10 月、11-12 月、13-15 月、16-18 月、19-21 月、22-24 月、25-30 月、31-36 月共 15 个月龄段,每段给"运动 / 认知 / 语言 / 生活与交往"4 板块训练方案。

  ### 3. 5 维发育评估框架
  把 0-3 岁智能发育按 5 维度评估:**大动作 / 精细动作 / 语言发育 / 认知发育 / 社会交往 / 自理能力**(部分场合合并为 4 维)。

  ### 4. 普及 "关键期" 概念
  把心理学"关键期"(critical period)理论用大白话推到中国家庭:"年龄越小,发展越快;3 岁以下特别是 0-1 岁,智能发展日新月异。错过关键期,不能补回。"

  ## 主要著作
  - 鲍秀兰谈婴幼儿潜能开发和早期教育(中国妇女出版社, 2016)
  - 鲍秀兰家庭育儿丛书(系列)
  - 0~3 岁儿童最佳的人生开端(系列)

  ## 学术评价
  - 主张早教从 0 月龄开始,与 AAP 早期感官刺激建议方向一致
  - 部分操作(如 1 岁前训坐盆 / 早期识字)与 RIE / Pikler 等"尊重发展节奏"派别有张力
  - 大部分建议是个人经验 + 国内常规,无外部 RCT 强支撑(C 级为主)
  - 与中国儿科学界主流方向一致,被中国家长广泛接受

  ## 在本知识库中
  - Phase 3 第一本(SRC-009),0-3 岁全段覆盖
  - 是 S1-S7 全段早教操作类卡片的主要源
  - 与 Karp(0-1 月安抚)+ AAP(0-12 月医学权威)互补,提供中文早教视角


glossary_id: G-TERM-secure-base
type: term
display_name: 安全基地 (secure base)

full_name_en: Secure Base
full_name_zh: 安全基地

one_liner: |
  Ainsworth 用语:婴儿把母亲(或主要养育人)当**探索世界的"老家"** — 走开探险,累了 / 怕了就跑回来充电,充饱了再出去。
  这是健康依恋的核心标志:依恋 ≠ 黏人,健康依恋反而让宝宝**更敢探索**。

detail: |
  ## 定义
  Ainsworth (1967) 在乌干达干达地区研究中首先用这个词描述:
  > "快乐安全的儿童似乎把母亲视为理所当然的存在,可以离开母亲去探索世界,
  > 知道母亲一直在那儿。" — Bowlby Vol 1 引用

  英文常用比喻:**母亲 = 加油站**,孩子 = 探险车。

  ## 反直觉点
  很多中国家长以为"宝宝越粘人 = 跟妈妈感情越好"。**错。**

  Ainsworth 干达研究发现:**最安全依恋的婴儿反而最敢离开母亲探索**,而不安全依恋的婴儿反而粘在母亲身上不敢离开。
  - 安全 B 型:走开玩 → 偶尔回头确认妈在 → 继续玩
  - 焦虑 C 型:不敢走 → 黏紧妈 → 不能玩

  → "黏人"≠ "依恋深"。"敢探索 + 知道随时能回"才是健康。

  ## 安全基地的 3 个功能(Bowlby)
  1. **避风港**(safe haven):怕了就跑回去
  2. **充电站**(secure base):休息后再出发
  3. **导航参考**(reference point):看妈妈表情判断陌生人是否友好(社交参照)

  ## 4 月龄起萌芽 → 8 月清晰
  - 安斯沃思在 28 周(7 月)婴儿身上首次观察到"从母亲身边出发探索"
  - 8 月起非常普遍:婴儿会主动从母亲身边出发,定时回头看,然后继续玩
  - 1-2 岁:走得更远,回头频率降低
  - 3-4 岁:不需要随时看到母亲,知道"母亲在某处"就行

  ## 怎么做才能成为孩子的"安全基地"

  ### 关键 4 项(Ainsworth 综合)
  1. **婴儿求助 → 你出现**(及时回应)
  2. **婴儿独立玩 → 你不打扰**(不强行抱)
  3. **婴儿看你 → 你温暖回应**(即使隔着房间)
  4. **婴儿走远 → 你不焦虑追**(不传递自己的恐惧)

  ### 中文家庭常见反例
  - "妈妈在做家务,别烦我!" → 孩子学到"求助没用"
  - "你怎么自己玩去了?是不是不爱妈妈?" → 让孩子内疚不敢探索
  - "别去那里!危险!" 不停喊 → 把妈妈变成警报器,不是安全基地

  ## 在陌生情境实验中的角色
  陌生情境实验 (G-TERM-strange-situation) 第一段就是测"基地功能":
  - B 型:进陌生房间会主动放下妈妈玩玩具(基地清晰)
  - A/C 型:要么不离开妈妈(基地不安),要么完全无视妈妈(基地缺失)

  ## 与"分离焦虑"的关系
  健康依恋(安全基地清晰)的婴儿:
  - 分离焦虑出现得更早(因为"基地"概念清楚)
  - 分离焦虑也通过得更快(知道妈妈会回来)
  - **不是没分离焦虑,是分离焦虑被处理得好**

  ## 历史
  - Ainsworth 1967 干达研究首次描述
  - 1969 陌生情境实验把"基地能力"变成可测项
  - 1988 Bowlby 经典演讲《A Secure Base》成为概念地标
  - 当代蒙台梭利 / RIE / Janet Lansbury 等流派都借用此概念

key_facts:
  - Ainsworth 1967 在干达研究中提出
  - 健康依恋的核心标志:敢探索 + 知道随时能回
  - 8 月起清晰
  - 黏人 ≠ 依恋深(反而是基地不安)
  - 关键 = 母亲及时回应 + 不打扰 + 不焦虑追


one_liner: |
  Gardner 1983 — 8 类独立智能:语言/逻辑数学/空间/音乐/身体动觉/人际/内省/自然。反单一 IQ。神童 = 单域突出。中国"全才训练"反 MI 立场。

detail: |
  ## 定义
  Gardner 1983 — 8 类独立智能:语言/逻辑数学/空间/音乐/身体动觉/人际/内省/自然。反单一 IQ。神童 = 单域突出。中国"全才训练"反 MI 立场。

  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版)反复引用。

  ## 跨派对接
  V4 综述权威立场,跨章节多次出现,跟现库其他派有立场对照。

  ## 中国家长意义
  详见相关知识卡。

key_facts:
  - "Lerner V4 反复引用术语"
  - "应用心理学综述权威定义"


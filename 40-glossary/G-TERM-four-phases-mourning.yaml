glossary_id: G-TERM-four-phases-mourning
type: term
display_name: 哀伤 4 阶段(four phases of mourning)

full_name_en: Four Phases of Mourning
full_name_zh: 哀伤 4 阶段

one_liner: |
  Bowlby + Parkes 综合提出的健康哀伤过程 4 个阶段:
  **1. 麻木 → 2. 渴望搜寻 → 3. 解组绝望 → 4. 重组**。
  完整走完才算健康哀悼,卡在任一阶段 = 病理性哀伤(G-TERM-pathological-mourning)。

detail: |
  ## 来源
  - Bowlby 1980《依恋三部曲 第三卷:丧失》Ch 6 + Ch 8
  - Colin Murray Parkes 1972《Bereavement》成人哀伤 4 阶段
  - Bowlby 综合 + 应用到儿童(Ch 16-25)
  - Erna Furman 1974《A Child's Parent Dies》儿童哀伤详细记录

  ## 跟"分离 3 阶段"区别
  - **分离 3 阶段**(G-TERM-protest-despair-detachment):暂时分离的反应序列
    - 抗议 → 绝望 → 超脱
    - Robertson & Bowlby 1952 提出
  - **哀伤 4 阶段**:重大丧失(死亡 / 永久性丧失)的完整消化过程
    - 麻木 → 渴望搜寻 → 解组绝望 → 重组
    - 适用儿童 + 成人

  ## 4 阶段详细描述

  ### 第 1 阶段:麻木(Numbing)
  **时长**:几小时-几天
  **儿童表现**:
  - 看似"像没事" / 继续玩 / 不接话
  - 偶尔短暂愤怒爆发
  - 可能抗议 / 否认("妈妈不是死了")
  - 看不出明显悲伤
  **大人坑**:误读为"孩子真的没受影响"

  ### 第 2 阶段:渴望和搜寻(Yearning and Searching)
  **时长**:几周-数月(儿童可能更长)
  **儿童表现**:
  - 反复问 / 念叨"妈妈呢 / 爸爸呢"
  - 抱已逝者物品 / 衣服
  - 看到陌生人误以为是逝者
  - 角色扮演逝者(温蒂玩"妈妈在桌子前")
  - 编歌 / 故事
  - 可能出现强迫性重复(帕特里克模式 = 病理化预兆)
  - 揪头发 / 抠脸等身体焦虑信号
  - 见到熟悉东西突然崩溃
  **大人坑**:压制 / 转移注意力("别提了 / 我们玩点别的")

  ### 第 3 阶段:解组和绝望(Disorganization and Despair)
  **时长**:几月-1 年(儿童可能反复进出)
  **儿童表现**:
  - 接受不会回来
  - 抑郁 / 退缩 / 失去玩兴趣
  - 食欲差 / 睡眠差
  - 退化行为(尿床 / 重新吸手指)
  - 拒绝新照顾者
  - 反复"为什么"
  - "我什么都不想要"(凯西)
  **大人坑**:"加油 / 振作 / 都过去了"

  ### 第 4 阶段:重组(Reorganization)
  **时长**:1 年-数年(终生有反复)
  **儿童表现**:
  - 接受新照顾者(替代母亲 / 阿姨)
  - 逐渐重建作息 + 兴趣
  - 提到逝者会难过但不崩溃
  - 内化已逝者形象("妈妈以前会给我读书")
  - 重要节点(节日 / 生日)仍会反复但能恢复
  **结果**:逝者永远在心中但不卡住生活,孩子能继续向前

  ## 健康完成的关键(给家长)
  Bowlby Ch16 总结的 5 个支持条件:
  1. 丧失前有安全依恋
  2. 被告知真相 + 允许提问
  3. 健在父母 + 稳定替代照顾者
  4. 允许参与家庭悲伤(包括看大人哭)
  5. 不被禁止表达情感

  ## 病理化的危险信号
  - 1 年以上仍卡在第 1-2 阶段
  - 完全不能提逝者 OR 完全无反应
  - 持续严重退化 / 自伤
  - 拒绝任何替代照顾者
  - 反复躯体症状

  ## 与中国家庭文化
  - "节哀顺变" / "别再难过了" → 跳过第 2-3 阶段 → 病理化
  - "懂事的孩子坚强" → 帕特里克 / 劳拉模式 → 卡在第 1 阶段表面平静但内伤
  - "时间能治愈一切" → 部分成立(健康哀伤会自然走完),部分有害(病理性哀伤需要主动干预)
  - "为了孩子要装坚强" → 孩子无法学习健康哀伤

  ## 在本知识库中
  - C-S7-242 哀伤 4 阶段儿童版 — 直接应用
  - C-S7-237/238/239/240/241 各阶段中的具体场景
  - G-TERM-mourning 总论
  - G-TERM-childhood-mourning 儿童版
  - G-TERM-protest-despair-detachment 分离 3 阶段(对照)

key_facts:
  - Bowlby + Parkes 提出
  - 4 阶段:麻木/渴望搜寻/解组绝望/重组
  - 儿童 + 成人都适用
  - 完整走完才健康,卡住 = 病理性
  - 每阶段都需要时间,不能跳过


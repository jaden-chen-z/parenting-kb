glossary_id: G-TERM-japanese-weaning
type: term
display_name: 日式断奶(米粥路径)

full_name_zh: 日式断奶 / 代乳食 / 日式辅食
full_name_ja: 離乳食(りにゅうしょく, rinyu shoku)
full_name_en: "Japanese-style weaning / Rinyu shoku"

one_liner: |
  日式辅食过渡路径 — 5 月起米粥 / 大人饭分一份 / 软米饭 / 全饭,松田反对"专门做"派。

detail: |
  ## 概念定义

  日本传统断奶方式 — 利用大约半年时间从母乳/牛奶过渡到米饭。

  核心特征:
  1. **目的** — 让 1 岁孩子能跟家人围坐饭桌共享团圆;
  2. **代乳食物** = 大人饭中适合婴儿的小份(半熟蛋 / 豆腐 / 土豆泥 / 鱼肉 / 肉末);
  3. **不专为婴儿做** — 不必花 1.5 小时做 10g 米粥;
  4. **米粥优先** — 不喜欢可试面包碎 / 牛奶面包粥;
  5. **5 月起每周试 1 次** — 不喜欢推迟 1 周;
  6. **不强迫"必须 5 月开始"** — 6 月 / 7 月也行;
  7. **6 月有的婴儿不吃稠糊** — 直接给软米饭。

  ## 松田立场(§148 + §190 + §192 + §193)

  反"育儿杂志特刊式断奶谱"派:
  - 育儿杂志 / 厨师写的"断奶食谱"是臆想的;
  - 用研钵 + 筛网消毒 = 浪费 2 小时;
  - 用勺子背面压碎食物足够;
  - **断奶失败大多是神经质母亲考虑过多**。

  对独生子女家庭:
  - 早晨 6:00 母乳 / 10:00 果汁 + 90ml 酸奶 + 母乳;
  - 13:00 香蕉半根;
  - 17:00 米粥 60ml + 蛋黄 + 西红柿汤 + 鱼白肉 + 母乳;
  - 20:00 母乳 + 洗浴后果汁;
  - 22:00 母乳后入睡。

  对双职工家庭:
  - 早晨多喂母乳 — 妈妈出门前给够;
  - 白天保育园补充牛奶 + 代乳食;
  - 晚上回来补母乳 — 时间稀缺质量补。

  ## 跟其他派别对照

  | 派别 | 辅食路径 |
  |---|---|
  | 松田(日) | 5 月起米粥 / 大人饭分份 / 6 月软米饭 |
  | AAP(美) | 4-6 月米粉 / iron-fortified cereal |
  | 鲍秀兰(中) | 6 月起硬食小饼干 + 中式辅食 |
  | BLW(西方现代) | 6 月起手指食物 / 自喂 |
  | Brazelton(美临床) | 喂食是自主权战场 |

  日式 vs 美式核心差异:
  - 日式起步米粥 vs 美式起步米粉
  - 日式从大人饭分份 vs 美式专做 baby food
  - 日式不限"必须 X 月" vs 美式相对严格

  ## 中国家长直接相关

  - 辅食加什么 — 大人饭分一份(松田立场)
  - 几月开始 — 5-6 月试,不喜欢推迟
  - 米粉 vs 米粥 — 都行,看孩子接受度
  - 月嫂专做派 vs 大人饭分份派

  ## 在本知识库中

  - SRC-024 (松田)断奶板块核心概念
  - 跟 AAP / 鲍秀兰 / BLW 立场对照参考

key_facts:

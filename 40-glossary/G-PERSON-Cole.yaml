full_name_en: Michael Cole
full_name_zh: 迈克尔·科尔

one_liner: |
  美国文化心理学家(UCSD 名誉教授),文化心理学派奠基人。
  Vygotsky 思想美国推广人,文化作为认知工具立场。

detail: |
  ## 个人背景
  - 印第安纳大学博士
  - UCSD 名誉教授(原 Distinguished Professor)
  - 美国艺术与科学院院士

  ## 核心立场:文化心理学
  - 文化不是认知的"修饰",是认知的工具
  - Vygotsky 思想美国推广人(LCHC 实验室)
  - 跨文化 + 认知发展辩论方
  - 反"普世发展时间表"

  ## 在本知识库中

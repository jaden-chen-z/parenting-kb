glossary_id: G-TERM-sleep-cycle
type: term
display_name: 婴儿睡眠周期 (infant sleep cycle)

full_name_zh: 婴儿睡眠周期
full_name_en: Infant Sleep Cycle

one_liner: |
  新生儿 50-60 分钟一个 active sleep + quiet sleep 循环;4 月起延长到 90 分钟接近成人。周期间有"短醒"是正常的 — 关键是宝宝能否自己重回深睡。理解睡眠周期是不"打扰浅睡"的科学基础。

detail: |
  ## 婴儿睡眠周期的两个阶段

  ### Active sleep(浅睡 / REM 类比)
  - 占新生儿睡眠 50%(成人 25%)
  - 表现:眼球转动 / 表情变化 / 偶尔抽动 / 呼吸不规则 / 微笑或哭出声
  - **不是醒**,是大脑在整理白天的信息
  - 宝宝可能短醒后自动重回深睡(若不被打扰)

  ### Quiet sleep(深睡 / NREM 类比)
  - 表现:呼吸均匀 / 肌肉松弛 / 无表情
  - 大脑修复 / 生长激素分泌
  - 难叫醒

  ## 周期长度变化

  | 月龄 | 周期长度 | active:quiet 比 |
  |---|---|---|
  | 0-2 月 | 50-60 分钟 | 50:50 |
  | 3-4 月 | 60-75 分钟 | 40:60 |
  | 4 月+ | 90 分钟(接近成人)| 25:75 |
  | 成人 | 90 分钟 | 25:75 |

  4 月睡眠"倒退"实际是:周期成熟 + 浅睡比例下降 + 周期间的"短醒"变多 = 表面频繁夜醒
  (见 C-S3-029 / C-S3-034 Brazelton + C-S3-129/130 Wonder Weeks)

  ## 父母实操含义

  ### 1. 不打扰浅睡
  - 看到宝宝 active sleep 表情(眨眼 / 皱眉 / 微笑 / 抽动)— **不是醒,不要冲过去抱**
  - 等待 5-10 分钟看是否自动重回深睡
  - 只在持续哭 + 翻动找妈才回应

  ### 2. 浅睡期演练自我安抚
  - 4 月起浅睡比例降但短醒变多 → 这是练自我重回深睡的窗口
  - 立刻冲过去喂奶 / 抱睡 → 阻断自然学习
  - Brazelton C-S3-029 立场:温和拍背但不抱起

  ### 3. 不要把"短醒"当"睡眠倒退"
  - 4 月睡眠周期成熟 = 自然过程
  - 不是病理,不需要睡眠训练或停母乳
  - 6-8 周可以恢复

  ### 4. 早产儿睡眠周期
  - 按校正月龄看周期成熟,不按实际日龄
  - 早产儿 Active sleep 比例更高 + 周期更短 → 更难"睡整觉"

  ## 与睡眠训练的关系
  4 派立场对睡眠周期的解读不同(见 C-S5-191 跨派对照):
  - **Karp**:5S 持续介入帮短醒过渡(0-4 月)
  - **Brazelton**:4 月起浅睡期演练 — 拍背但不抱起,温和
  - **Lillard 蒙氏**:6 周-3 月起练独立(关门睡 + 不晃睡)
  - **Davies 蒙氏**:6-16 月黏期就是黏期,反对强训
  - **Bowlby V1/V2**:反对长哭训练

  关键共识:**周期间短醒是正常生理,关键看父母是否"打扰"宝宝自我重回深睡的练习**。

key_facts:
  - 新生儿 50-60 分钟一个周期 / 4 月起 90 分钟接近成人
  - Active sleep(浅睡)≠ 醒,不要打扰
  - 4 月睡眠倒退 = 周期成熟 + 浅睡比例下降的自然过程
  - 浅睡期是自我安抚学习窗口
  - 早产儿按校正月龄看周期成熟


glossary_id: G-TERM-primary-attachment-figure
type: term
display_name: 主依恋人(primary attachment figure)

full_name_en: Primary Attachment Figure
full_name_zh: 主依恋人 / 主要依恋对象

one_liner: |
  Bowlby 三部曲核心概念:**孩子最强烈、最优先寻求亲近的那个人**。
  通常是妈妈,但也可以是爷爷奶奶 / 阿姨 / 月嫂等**任何提供持续 + 温暖 + 可预测照顾**的人。
  **不是按血缘,是按陪伴质量决定的**。

detail: |
  ## 概念来源 + 定义
  - Bowlby Vol 1(1969)系统化提出
  - 也称 "principal attachment figure" 或 "primary caregiver"(后期文献)
  - 跟 secondary / tertiary attachment figures 区分(次依恋人 / 第三依恋人)

  ### 核心特征
  孩子的主依恋人不是固定的"职位",是孩子内在认定的对象:
  - 当受惊 / 痛 / 累 / 怕 → **首先**会找的人
  - 看护时被抱 → 最容易被安抚的人怀里
  - 跟陌生人接触 → 用主依恋人作"安全基地"
  - 长时间分离 → 表现完整哀伤反应(分 3 阶段)

  ## 中国家庭的主依恋人现实
  传统假设"妈妈是主依恋人" → 但中国实际:
  - **双职工常态** → 主要照顾者常是爷奶 / 外公外婆
  - **月嫂 / 阿姨长期带** → 月嫂可能是宝宝主依恋人(0-3 月经常出现)
  - **奶奶带 + 妈妈下班接管** → 奶奶是主依恋人,妈妈是次依恋人
  - **农村留守儿童** → 爷奶是唯一依恋人

  Bowlby 立场:**不是"按血缘",是按"持续陪伴 + 温暖回应"决定**。
  跟孩子在一起时间最长 + 最回应 + 最稳定的人 = 主依恋人。

  ## 主依恋人的形成时间
  - **0-2 月**:对所有照顾者反应类似
  - **3-6 月**:开始偏向特定 1-2 个人
  - **6-9 月**:**主依恋人确立**(8 月怕生 = 主依恋人形成的标志)
  - **9-12 月**:能区分主 / 次 / 第三依恋人
  - **12-24 月**:对主依恋人偏好达顶峰(分离最痛苦)
  - **2-4 岁**:逐渐能容忍主依恋人短期不在

  ## 主依恋人替换 / 失去 = 重大事件

  ### 替换的常见场景(中国家庭)
  - 月嫂合同到期(3-6 月)
  - 阿姨更换
  - 奶奶带回来给妈妈带
  - 入园 / 入托
  - 妈妈休完产假回去工作

  ### Bowlby 立场(Vol 3 Ch24-25)
  替换主依恋人 = **真正的丧失**,影响不亚于亲人去世:
  - 9 月以上宝宝会经历完整哀伤反应
  - 关键看**新依恋人是否能稳定温暖接手**(C-S6-294)
  - 替换前 1-2 周让宝宝慢慢适应新人(过渡期)
  - 替换不要偷溜,告别仪式重要(C-S5-135 / C-S5-290)

  ## 多依恋人的健康标准
  Bowlby 立场:**多依恋人是健康的**,不是"分散就不专一":
  - 主 + 2-3 个次依恋人是理想
  - 主依恋人在 → 用作安全基地
  - 主依恋人不在 → 次依恋人接住
  - 单一依恋人 + 不在场 = 高风险

  ## 跟其他相关概念
  - **依恋(attachment)**:G-TERM-attachment
  - **安全基地**:主依恋人提供的功能 — G-TERM-secure-base
  - **内部工作模型**:孩子对主依恋人的内在表征 — G-TERM-internal-working-model
  - **分离 3 阶段**:跟主依恋人长时间分离的反应 — G-TERM-protest-despair-detachment
  - **哀伤**:主依恋人永久失去后的反应 — G-TERM-mourning

  ## 在本知识库中
  - C-S5-290 月嫂阿姨离别要重视
  - C-S6-293 1 岁半已会想念妈
  - C-S6-294 替代照顾者最关键
  - C-S7-247 爷奶去世跟娃讲(主依恋人离世)
  - G-TERM-attachment(总论)

key_facts:
  - 不按血缘 按持续温暖陪伴
  - 中国家庭常是爷奶 / 月嫂 / 阿姨
  - 6-9 月开始建立(8 月怕生标志)
  - 替换 = 真正的丧失反应
  - 多依恋人(主 + 次)是健康的


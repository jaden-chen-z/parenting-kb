full_name_en: Philip J. Kellman
full_name_zh: 菲利普·J·凯尔曼

one_liner: |
  美国认知心理学家(UCLA 教授),婴儿视觉感知研究权威。
  1983 物体一致性 + 视觉悬崖综述派,Lerner V2 Ch3 主笔。

detail: |
  ## 个人背景
  - 宾夕法尼亚大学博士(Spelke 学生)
  - UCLA 心理学教授
  - 美国心理协会会士

  ## 核心研究
  - **Kellman/Spelke 1983 物体一致性**:4 月用"共同运动"推断物体边界
  - **视觉悬崖综述**:运动经验是深度感知触发
  - **跨模态视觉**:视觉 + 触觉早期整合

  ## 立场
  - Spelke 派(共同运动 = 物体)
  - 视觉发展实证派

  ## 在本知识库中
  - SRC-028 Lerner V2 Ch3 主笔(104 hits)

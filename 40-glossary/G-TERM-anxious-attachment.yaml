glossary_id: G-TERM-anxious-attachment
type: term
display_name: 焦虑型依恋 (anxious attachment)

full_name_en: Anxious Attachment
full_name_zh: 焦虑型依恋

one_liner: |
  Bowlby Vol 2 提出的术语,**取代有歧视意味的"过度依赖"和"溺爱"概念**。
  指对依恋对象的可获得性长期不确定 → 持续焦虑 + 黏人 + 怕分离 + 容易愤怒的内在状态。
  涵盖 Ainsworth A 回避型 + C 抗拒型 两个 Strange Situation 不安全分类。

detail: |
  ## 概念定义(Bowlby 1973)
  当个体对**"我有需要时,依恋对象会不会出现"**长期不确定 →
  采取**一直保持接近**的策略,以保证"万一需要他能找到他"。
  这是一个内在状态,**外在可表现为黏 / 退缩 / 攻击 / 控制 多种行为模式**。

  ## 为什么 Bowlby 革新这个术语
  原"过度依赖"(over-dependence)和"溺爱"(spoiling):
  - 带价值判断("过度"是观察者标准)
  - 文化偏见(东方常态行为西方贴标签)
  - 模糊机制(依赖 vs 依恋混淆)
  - 把责任推给"父母太宠"(实证无支持)

  Bowlby 提出"焦虑型依恋"框架:
  - 描述本质(对可获得性焦虑)
  - 不带价值判断
  - 引出实际成因(不稳定 / 威胁 / 角色倒置)
  - 引导正确干预(增加可预测性,而非"减少抱")

  ## Ainsworth 4 类依恋中的对应
  - **B 安全型(60-65%)**:不属于焦虑型依恋
  - **A 焦虑回避型(20%)**:焦虑型依恋的回避表现
  - **C 焦虑抗拒型(10%)**:焦虑型依恋的抗议表现
  - **D 混乱型(5-10%)**:严重创伤性依恋,与焦虑型相关但更深

  ## 主要成因(Bowlby Vol 2)
  1. **真实分离经历**(住院 / 寄养 / 留守)— 累积效应
  2. **不稳定替代照顾**(频换照顾人)
  3. **威胁要抛弃**("再不听话妈妈就走"等)
  4. **角色倒置**(父母依赖孩子情绪)
  5. **父母吵架** / 婚姻问题 / 离异
  6. **家长隐瞒重病/死亡** → 加重焦虑

  ## 临床表现
  ### 儿童版
  - 黏人远超同龄
  - 妈妈一离开崩溃
  - 怕陌生场所
  - 反复退化(尿床 / 不会自理)
  - 对妈妈愤怒 + 黏人交替
  - 反复噩梦"找不到妈"
  - 心身症状(头痛 / 腹痛 / 厌食)
  - 拒学症(C-S7-041)

  ### 成年版(Bowlby Vol 2 第十九章引申)
  - 广场恐怖症(怕独自离家)
  - 过度依赖伴侣
  - 焦虑型亲密关系
  - 强迫性独立(回避亲密 = A 型)
  - 无法相信他人会真心帮助

  ## 反"溺爱论"实证
  - Maccoby & Masters 1970 综述否定 Freud 溺爱论
  - 灵长类研究也支持反对
  - Stendler 1954:14/20 "过度依赖"儿童来自不稳定家庭(C-S6-095)

  ## 与 Vol 1 概念的衔接
  - Vol 1 提供 4 类依恋分类 + Strange Situation
  - Vol 2 在分离场景下深化焦虑型机制
  - Internal Working Model 在 Vol 2 正式提出(C-S6-069)

  ## 治疗 / 干预原则(Bowlby)
  - 增加可预测性(C-S6-097 一致性家庭)
  - 修复"安全基地"功能
  - 不再用威胁 / 撤回爱作为管教
  - 长期分离前用 Robertson 5 招(C-S7-034)
  - 角色倒置家庭:父母自己治焦虑,孩子才能解放

  ## 中文文化高频版本
  - "妈妈再不听话就走" — 直接焦虑型依恋成因
  - "你听话妈妈才不难过" — 角色倒置
  - 留守儿童 — 累积长分离
  - "棍棒底下出孝子" — 体罚 + 撤回爱组合
  - 频繁送外婆奶奶家轮换 — 不稳定照顾

key_facts:
  - Bowlby 1973 提出术语,取代"过度依赖"
  - 涵盖 Ainsworth A 型 + C 型不安全依恋
  - 主因是依恋对象可获得性不确定,不是"被宠坏"
  - 表现可以是黏 / 回避 / 攻击 / 心身症状
  - 中文文化常见成因:威胁抛弃 + 角色倒置 + 不稳定照顾


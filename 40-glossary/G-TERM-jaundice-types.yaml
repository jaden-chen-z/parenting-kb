glossary_id: G-TERM-jaundice-types
type: term
display_name: 黄疸 3 类区分

full_name_en: Neonatal Jaundice Types (Physiological vs Breastmilk vs Pathological)
full_name_zh: 新生儿黄疸 3 类(生理性 / 母乳性 / 病理性)

one_liner: |
  新生儿黄疸分 3 类 — 生理性(7-10 天消)/ 母乳性(可持续 1-2 月)/ 病理性(需查肝胆)。
  危险信号:大便白色或灰色 → 胆道闭锁可能,1 月内手术效果好。

detail: |
  ## 3 类定义

  ### 1. 生理性黄疸(最常见)
  - 出生 2-3 天出现,皮肤黄
  - 7-10 天自然消退
  - 不需治疗,继续母乳
  - 严重时蓝光治疗

  ### 2. 母乳性黄疸(母乳娃可能)
  - 持续 1-2 月不消退
  - 不必停母乳(除非医嘱)
  - 胆红素 < 阈值就观察
  - 大多自然消退

  ### 3. 病理性黄疸(警戒!)
  - 出生 24 小时内出现 = 警戒
  - 胆红素超阈值快增 = 警戒
  - **大便白色/灰色 = 胆道闭锁可能**(1 月内手术 vs 后续要换肝)
  - 嗜睡 / 拒奶 / 异常哭闹

  ## 松田立场(SRC-023 §72 / §88)
  - 7 天后还黄找儿科测胆红素
  - 每次换尿布看大便颜色 — 白/灰立刻去医院
  - 母乳性黄疸不停母乳除非医嘱
  - 严重要蓝光,别拒绝

  ## AAP 立场(SRC-008)
  - 出生 24 小时内黄疸 = 必须查
  - 黄疸看皮肤蔓延范围 — 过腹部要送医
  - 胆红素 ≥ 25 mg/dL 紧急(可致核黄疸/脑损伤)
  - 第一周胆红素峰值要监测

  ## 中国家长高频痛点
  - "黄一点没事过几天就好" → 错过胆道闭锁 1 月手术窗 → 后续要换肝
  - "母乳性黄疸要停母乳" → 不必,除非医嘱
  - 老人"晒太阳" → 现代蓝光更安全有效

  ## 实操判断 4 信号(必送医)
  1. 出生 24 小时内黄疸出现
  2. 大便白色/灰色
  3. 7 天后仍黄不消
  4. 嗜睡 / 拒奶 / 异常哭闹

key_facts:
  - 3 类:生理性(7-10 天消)/ 母乳性(1-2 月)/ 病理性(需查)
  - 大便白色 = 胆道闭锁警戒,1 月内手术
  - AAP/松田:胆红素超阈值要蓝光,不能拖
  - 母乳性黄疸不必停母乳


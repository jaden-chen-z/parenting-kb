glossary_id: G-TERM-asenai-ikuji
type: term
display_name: 不焦虑育儿(あせらない育児)

full_name_zh: 不焦虑育儿
full_name_ja: あせらない育児(asenai ikuji)
full_name_en: "Non-anxious parenting (Matsuda)"

one_liner: |
  松田道雄《育儿百科》全书底色,1967 年提出 — 信自己直觉、不和别人家娃比、跟孩子一起成长。

detail: |
  ## 概念

  日本儿科医生松田道雄(1908-1998)在《育儿百科》(1967)中提出的育儿哲学,是全书底色。

  核心 3 条:
  1. **没人事先有信心** — "没下过水的人不可能对游泳有信心",
     妈妈不需要事先掌握全套育儿知识。
  2. **过于自信不是好父母** — "只有跟孩子一起探求人生,
     与孩子一起共同成长的父母才是好的父母"。
  3. **摆脱焦虑 → 享受快乐** — 不"我必须做对"的执念,
     才能真看见孩子。

  ## 操作含义

  1. 1 月时只需知 1 月的事,4 月时把 1 月的全忘了也行;
  2. 不囤无穷育儿书,看现阶段就够;
  3. 问题来了再查,不预演灾难;
  4. 听一种声音就够,不开 5 个微信群;
  5. 不和邻居家娃比;
  6. 不和"育儿网红"比;
  7. 信自己跟孩子日常相处的直觉。

  ## 跟其他派别对照

  | 派别 | 对待育儿焦虑 |
  |---|---|
  | 松田(日) | 不焦虑核心 — 信直觉 + 跟孩子一起成长 |
  | 鲍秀兰(中) | 早教操作型 + 月龄表对照 |
  | Brazelton(美) | 父母焦虑是好东西 + Touchpoints |
  | RIE / Lansbury | 父母先照顾自己 + sportscasting |
  | 蒙氏(Davies) | 跟随孩子 + observation |

  松田的"不焦虑"跟蒙氏"trust the child"+ Brazelton "父母焦虑是好东西"立场互补,
  跟现代中国"虎妈" / "鸡娃"派强对立。

  ## 现代意义(2025)

  在中国"鸡娃 / 早教 / 学区房"焦虑大背景下,松田 1967 年的"不焦虑"立场,
  反而成了 2020s 现代家长的解药:
  - 不让 3 岁报班学拼音
  - 不让 6 月起 iPad 哄饭
  - 不让"幼小衔接"焦虑
  - 让孩子做自己

  ## 在本知识库中

  - Phase 9 SRC-024 全卷哲学底色
  - 跟蒙氏 / RIE / 自然派育儿立场互补
  - 反"虎妈" / "鸡娃" / "早教" 派的核心思想资源


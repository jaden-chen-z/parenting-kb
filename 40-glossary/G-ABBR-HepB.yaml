glossary_id: G-ABBR-HepB
type: abbreviation
display_name: HepB

full_name_en: Hepatitis B Vaccine
full_name_zh: 乙型肝炎疫苗

one_liner: |
  预防乙型肝炎病毒(慢性化率高 + 肝硬化/肝癌主因)。中国出生 24 小时内必接种 + 1 月 + 6 月共三针(母传阻断关键);美国 AAP 出生当日 + 1-2 月 + 6-18 月。中国曾是乙肝高流行国(成人携带率 7-10%),疫苗后儿童携带率降至 0.3%。

detail: |
  ## 是什么
  HepB = Hepatitis B Vaccine
  - 预防 HBV(乙型肝炎病毒)
  - 经血液 / 母婴垂直传播 / 性传播(成人)
  - **慢性化率极高**:婴儿期感染 90% 慢性化 / 成人感染 5-10% 慢性化
  - 慢性化 → 20% 肝硬化 / 5-10% 肝癌(20-30 年潜伏)

  ## 疫苗时间表 — 中国出生当日是核心

  ### 中国一类苗(免费)
  - **出生 24 小时内** — 第一针(母传阻断关键)
  - 1 月 — 第二针
  - 6 月 — 第三针
  - 共三针,基础免疫完成

  ### 美国 AAP
  - 出生当日(医院产房)— 第一针
  - 1-2 月 — 第二针
  - 6-18 月 — 第三针

  ### 母亲 HBsAg 阳性的高风险新生儿
  - 出生 12 小时内必须接种第一针 + HBIG(乙肝免疫球蛋白)
  - 母传阻断成功率 >95%(没及时接种则 70-90% 慢性感染)

  ## 为什么出生 24 小时内必种?
  乙肝主要传播途径在中国曾是**母婴垂直传播**(占 30-50%):
  - 妈妈 HBsAg 阳性 → 分娩时血液暴露 → 宝宝感染
  - 宝宝感染后 90% 慢性化 → 肝硬化/肝癌风险终身
  - **出生 24 小时内接种 + HBIG = 母传阻断关键窗口**

  中国 1992 年起新生儿乙肝疫苗普及 → 2014 年 5 岁内乙肝携带率 0.3%(1992 年 9.7% → 0.3% = 96% 下降)。WHO 称为公共卫生奇迹。

  ## 接种反应
  - 局部红肿、轻微发热
  - 极少严重反应(<1/百万)

  ## 误区
  - "妈妈乙肝就不能生" — 错。规范阻断后 95%+ 阻断成功
  - "出生太小不忍心打" — 错。出生当日接种是阻断关键窗口
  - "我家妈妈没乙肝就不用 24h 内打" — 错。父亲 / 看护人 / 后续生活暴露都有风险
  - "三针打不完会不会前功尽弃" — 错。不会,补种即可

  ## 抗体检测
  - 接种后 1-2 月查 anti-HBs(乙肝表面抗体)
  - >10 mIU/mL = 免疫成功
  - 部分人需要加强针(无应答者约 5-10%)

key_facts:
  - HBV 慢性化率高 + 肝硬化/肝癌主因
  - 婴儿期感染 90% 慢性化(VS 成人 5-10%)
  - 中国出生 24h 内必种 + 1 月 + 6 月共三针
  - 母传阻断 95%+ 成功率
  - 中国 1992 年普及后儿童携带率从 9.7% 降至 0.3%
  - 母亲 HBsAg+ 婴儿需 + HBIG


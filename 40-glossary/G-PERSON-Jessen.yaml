glossary_id: G-PERSON-Jessen
type: person
display_name: Jessen (琳·莉拉德·杰森)

full_name_en: Lynn Lillard Jessen
full_name_zh: 琳·莉拉德·杰森

one_liner: |
  美国 AMI 蒙氏教师,Paula Lillard 第二个女儿,Forest Bluff School 共同创办人。
  AMI 双认证(3-6 岁 primary + 0-3 岁 Assistant-to-Infancy),3 个孩子的母亲。本卷《蒙特梭利从 0 岁开始》是她跟母亲 Paula 合著的 0-3 岁经典 — Lynn 提供 0-3 实操 + 自己 3 个孩子的真实案例。

detail: |
  ## 背景
  - Paula Lillard 的第二个女儿
  - Smith College 工作室艺术(studio art)学士
  - 毕业后受母亲建议参加 AMI 华盛顿 D.C. 蒙氏 primary 培训(Margaret Stephenson 主持)
  - 1985 年在德州休斯顿参加 AMI 0-3 Assistant-to-Infancy 培训(Judi Orion + Silvana Montanaro 主持)
  - 3 个孩子的母亲(写本卷时 10 / 15 / 19 岁)

  ## 蒙氏教师生涯
  - 在 2 所蒙氏学校教 3 年后,1982 年与母亲共办 Forest Bluff School
  - 任 Forest Bluff 第一个 primary 教室创办教师
  - 跟母亲共同教 Forest Bluff 父母班(0-3 岁主题)6+ 年
  - 上门家访咨询是父母班配套服务

  ## 在本卷中的角色
  - 提供 0-3 岁实操细节(Paula 是 3-6 岁 primary 教师,Lynn 是 0-3 唯一)
  - 把 Silvana Montanaro 教的内容融入本卷
  - 真实案例提供者(尤其大女儿 Margaret 在 2 岁时的"被骗惯坏"教训)
  - 关键案例:Margaret 2 岁拒走自己路 → Dr. Montanaro 干预 → "你不能再抱她,她有自己两条腿"

  ## 风格
  - 比母亲更口语化
  - 强调"自己的犯过的错"作为教训
  - 跟 Silvana Montanaro 学了"温柔但坚定"的 0-3 训练方式

  ## 跟 Davies 流派的差异
  - Lynn 是学院派 + AMI 0-3 正规认证
  - Davies 也是 AMI 认证但更现代化 / 大众化
  - 两人立场基本一致,Lynn 更深入"为什么" / Davies 更深入"怎么做"

key_facts:
  - AMI 3-6 + 0-3 双认证蒙氏教师
  - Paula Lillard 的女儿
  - Forest Bluff School 共同创办人
  - 3 个孩子的母亲
  - 师承 Silvana Montanaro(意大利 AMI 0-3 培训师)


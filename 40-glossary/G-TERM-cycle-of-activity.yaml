glossary_id: G-TERM-cycle-of-activity
type: term
display_name: 循环活动 (cycle of activity)

full_name_zh: 循环活动 / 完整活动周期
full_name_en: Cycle of Activity

one_liner: |
  蒙氏 15 月+幼儿做事的特征:**完整 — 准备 → 做 → 收尾**(不是只做 + 留乱给大人)。
  孩子从这个完整周期里学到秩序 / 专注 / 责任 / 自我效能。Lillard 把这个概念作为蒙氏 practical life 的核心机制。

detail: |
  ## 定义
  Cycle of activity = 蒙氏对孩子"工作"的特殊命名,强调:
  1. **准备** — 拿围裙 / 摆桌 / 拿物品上托盘
  2. **做** — 切香蕉 / 倒水 / 擦桌
  3. **收尾** — 把垃圾收掉 / 洗碗 / 工具归位 / 脱围裙

  孩子从 15 月起对这种"完整周期"有特殊兴趣 — Maria Montessori 观察到孩子会"重复看似无目的的动作",其实是在练完整周期。

  ## Lillard 的椅子例子
  Maria Montessori 引子:孩子费力爬到扶手椅上,然后立刻爬下来。
  - 大人困惑:为什么不在椅子上享受?
  - 孩子内在目标:体验"上 → 下"的完整周期 = 协调动作 + 自我建构

  ## 蒙氏 practical life 中的循环活动示例

  ### 切香蕉(15-18 月)
  1. 准备:拿围裙穿上 + 拿托盘 + 摆 2 个碗(果肉碗 + 垃圾碗)+ 取香蕉 + 取小刀
  2. 做:剥皮(每片皮立即放垃圾碗)→ 切 1 片(立即放果肉碗)→ 重复
  3. 收尾:把果肉碗端走 → 擦托盘 → 洗刀 → 工具归位 → 脱围裙

  ### 摆餐桌(18 月+)
  1. 准备:取餐垫 + 取餐巾 + 取一个叉一个勺
  2. 做:每件物品两手拿,摆放,慢慢
  3. 收尾:吃完后端走盘子 + 擦桌 + 物品归位

  ## 为什么完整很重要
  - **秩序内化** — 孩子从顺序里学"做事是有头有尾的"
  - **专注** — 每个步骤需要专注,练注意力
  - **责任** — 不留烂摊子 = 责任的开始
  - **自我效能** — 我自己完成了一件事(不是别人替我做了一半)
  - **未来阅读 / 写作** — 左到右 / 上到下顺序为读写打基础(Lillard 直接说)

  ## 大人的角色
  - **演示** — 慢慢做一遍给孩子看(孩子坐左边,大人右边)
  - **不打断** — 孩子做时大人不上手,不夸,不评(打断专注)
  - **不替做** — 即使速度慢得让人崩溃
  - **示范完整** — "看,我把围裙穿上 → 我做完了 → 我把工具放回去"

  ## "工作 vs 玩"的蒙氏区分
  | "玩" | 蒙氏"工作"(循环活动) |
  |---|---|
  | 重复无目的乱玩 | 每个动作有目的 |
  | 留乱摊子 | 自己收尾 |
  | 大人觉得"啥也没干" | 实际在练协调 + 秩序 + 专注 |
  | 玩具是塑料假装 | 用真物(真碗 / 真刀 / 真水) |

  ## 中国家长高频误解
  - **"孩子小做不了,我替他做"** — 蒙氏:速度慢没事,自己完成才是教育
  - **"切水果太危险"** — 18 月用钝刀完全可以,蒙氏从这个年龄就开始
  - **"擦桌子是家务,不是教育"** — 这正是教育核心
  - **"孩子玩塑料假装就行"** — 假物剥夺了真实反馈,自我效能不会建立

  ## 历史地位
  - Maria Montessori 1907 年 Casa dei Bambini 实验观察
  - 蒙氏 100 年实证 — 完整循环活动的孩子专注力 + 秩序感显著高
  - Csikszentmihalyi 现代 flow 理论印证 — flow = 完整任务沉浸

key_facts:
  - 蒙氏 practical life 核心机制
  - 完整周期:准备 + 做 + 收尾
  - 15 月起对完整周期有特殊兴趣
  - 大人不打断 / 不替做 / 不夸奖
  - 培养秩序 + 专注 + 责任 + 自我效能


glossary_id: G-TERM-language-explosion
type: term
display_name: 语言爆发 (language explosion)

full_name_zh: 语言爆发 / 词汇爆炸
full_name_en: Language Explosion / Vocabulary Explosion

one_liner: |
  12-24 月之间宝宝词汇增长的特殊现象。
  在累计约 50 个词后突然进入"每天新词"阶段,大脑左顶叶代谢活动达到一生最高峰,这个时间窗的语言输入对大脑结构有永久影响。

detail: |
  ## 定义
  Language explosion = 12-24 月期间宝宝词汇量从 ~50 突然指数级增长的现象。
  - 12 月:~6 个词
  - 12-15 月:慢慢加新词
  - 15-18 月:**累计 50 词时突破**
  - 18-24 月:**每天 1-3 个新词**
  - 24 月:~200-300 词

  ## 大脑物理基础
  Lillard Ch8 引用神经科学:
  - 12-24 月期间 — 大脑**左顶叶**(成人词储存区)代谢活动达到一生最高峰
  - 突触形成速率最快
  - 此期间语言输入直接影响左顶叶结构

  ## 为什么是"爆发"而不是"渐变"
  研究发现:
  - 50 词左右 = 大脑达到关键密度
  - 突破后 — 神经通路自动化,新词进入更快
  - 类似化学反应:够浓度才点燃

  ## Lillard 强调的 4 个关键(Ch8)
  1. **直接说给宝宝的词才算** — 隔壁电视 / 电话不算
  2. **不需要高学历** — 父母互动方式比学历更重要
  3. **大量重复** — 大脑要固化神经通路
  4. **避免障碍** — 耳炎 / 听力问题必须及时治

  ## 4-5 岁的延伸
  Lillard 引数据:**一个清醒小时学一个新词**(4-5 岁)
  - 4-5 岁日均 14 小时清醒 → 14 个新词
  - 4 岁就完整内化所有语法规则
  - 蒙氏 Children's House 用"词汇 + 命名"为核心

  ## 语法的对应
  词汇爆发后,语法迅速跟进:
  - 24 月:"我跑" / "看球"(无 inflection)
  - 30 月:加 ing / on / in / 复数 / 所有格
  - 36 月:加 articles / 时态 / 第三人称
  - 48 月:全部语法规则到位
  - 中间会犯"过度泛化"错(He runned),证明孩子在主动找规则,不是模仿

  ## 跟其他派的对照
  - 跟 鲍秀兰:鲍 critical period(关键期),Lillard sensitive period(敏感期),时间窗一致
  - 跟 Wonder Week:不在跃迁期重叠,但 12 月跃迁后语言爆发开始
  - 跟 Davies:"嘎嘎语" 也争论 — 都反对(用真词)

  ## 实操核心
  - 12 月起 — 加大词输入(慢说 + 清晰 + 真物 + 直接对宝宝)
  - 不放电视背景声(假输入,不算)
  - 不打断宝宝说话(等他说完)
  - 不强行纠正(重说一次让他听)
  - 名词 → 动词 → 形容词 → 介词 顺序自然展开

  ## 中国家长高频误解
  | 误解 | 实际 |
  |---|---|
  | "宝宝 18 月不说就是慢" | 部分孩子是 'sitter'(语言早,动作慢)和反过来 |
  | "听英语 BBC 也算" | 没用 — 必须真人面对面 |
  | "宝宝太小不能纠错" | 不需要纠错,重说一次即可 |

key_facts:
  - 12-24 月 50 词突破 → 每天新词
  - 大脑左顶叶代谢一生最高
  - 此期间语言输入永久改变大脑结构
  - 必须真人面对面 / 屏幕不算
  - 4 岁完整内化语法


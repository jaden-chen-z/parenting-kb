glossary_id: G-TERM-touchpoint
type: term
display_name: 触点 (touchpoint)

full_name_en: Touchpoint
full_name_zh: 触点

one_liner: |
  Brazelton 提出的发展模型核心概念。0-3 岁可预测的"发展节点",在每次跃进前儿童会先暂时退步(吃睡乱、易哭闹),这是健康前进的信号而非问题。

detail: |
  ## 定义
  Brazelton 用"触点"(touchpoint)指儿童 0-3 岁发展过程中**可预测的关键节点**。
  在每个触点前后,儿童的行为会有规律性"崩盘"再"重组":睡眠混乱、吃饭抗拒、情绪暴躁、夜醒频繁。

  ## 机制
  - 大脑在跃进前先解构旧的稳态(disorganization)
  - 然后重组到新的更复杂层级(reorganization)
  - 表现为"先退后进"的行为模式

  ## 13 个 Birth-to-3 触点(Brazelton 划定)
  - 孕期(第一个触点)
  - 出生 / 2-3 周 / 6-8 周 / 4 月 / 6-7 月 / 9 月 / 1 岁 / 15 月 / 18 月 / 2 岁 / 3 岁

  ## 临床应用
  - 儿科医生在触点前与父母会面,提前预告即将到来的"崩盘期"
  - 父母不再焦虑,不会把退步当问题
  - 形成预防型育儿支持模型

key_facts:
  - Brazelton 1992 年原书提出
  - 0-3 岁 13 个触点
  - 每个触点前儿童先退步再跃进
  - 父母焦虑高峰 = 触点窗口
  - Touchpoints Center 全国 70+ 合作机构


glossary_id: G-TERM-acknowledging-feelings
type: term
display_name: 承认情绪 (acknowledging feelings)

full_name_zh: 承认情绪 / 接住而不修复
full_name_en: Acknowledging Feelings

one_liner: |
  RIE 派核心干预 — 孩子哭 / 怒 / 难过时,
  大人不试图"修复"(分散 / 转移 / 哄停),
  只用平静的语言"接住"情绪:
  "你很生气" / "你失望" / "你不想我走"。
  跟"修复"派(分散 / 哄)对立的方法学。

detail: |
  ## 核心命题
  - 情绪不是问题,是沟通
  - 大人的工作:接住 + 命名 + 在场
  - 大人不该:堵 / 转 / 哄停 / 评判

  ## 经典句式
  - "你 [情绪],因为 [情境]"(命名 + 归因)
    - "你失望,因为我没让你拿剪刀"
    - "你生气,因为该回家了"
  - "我懂"(简短确认)
  - "我在这"(在场承诺)
  - "那个真难"(共情)

  ## 不该说的句式
  - "不许哭" → 否认情绪
  - "没什么大不了" → 否认严重性
  - "看那只鸟!" → 分散转移
  - "再哭就 X" → 威胁
  - "妈妈这么累你怎么忍心" → 情绪敲诈

  ## Lansbury 公式:行为 + 情绪并存
  - **行为坚定**:"我不让你打妹妹" + 物理挡
  - **情绪开放**:"你很生气,因为我没让你打,我懂"
  - 两件事不矛盾,是配套的

  ## 跟其他派对比
  - **vs 主流分散派**:Lansbury 反 → 分散是逃避
  - **vs 严管派**:Lansbury 反 → "不许哭"压抑情绪
  - **vs Karp 5S**:Karp 主张安抚停止哭;RIE 区分"安抚需求"vs"接情绪"
  - **vs 蒙氏 Davies**:Davies 也用承认,但没 Lansbury 系统化

  ## 长期影响
  - 孩子学到"情绪可以表达 + 被接住"
  - 不压抑 → 成年后情绪健康
  - 反 Lansbury 童年案例(Ch26):她妈妈承担不了她生气 →
    Lansbury 长期焦虑 / 自我怀疑

  ## 适用场合
  - 婴儿哭 → "你不喜欢这个"
  - 幼儿摔倒 → "你摔了,疼"
  - 分别哭 → "你不想我走,我懂"
  - tantrum → "你失望,我在这"
  - 兄弟争玩具 → "你想要这个,他也想要"

  ## 何时不只 acknowledge
  - 真危险 → 立即物理保护
  - 情绪持续多日 / 极端 → 看医生
  - 孩子自己想方案 → 接住情绪 + 不主动出主意

  ## 对中国家长的特殊意义
  - 替代"不许哭" 文化
  - 替代"哭就给糖"哄骗
  - 替代"再哭打你"威胁
  - 替代"羞羞,这么大还哭"羞辱

  ## 难点
  - 大人小时候没被接过情绪 → 接孩子情绪触发自己
  - 在公共场所 → 怕被评判 → 倾向于快堵
  - 反复练习,通常 1-3 月才内化

key_facts:
  - RIE 派核心干预之一
  - 命名 + 共情,不修复
  - 行为坚定 + 情绪开放并存
  - 替代"分散 / 威胁 / 羞辱"主流模式
  - 长期影响成年情绪健康


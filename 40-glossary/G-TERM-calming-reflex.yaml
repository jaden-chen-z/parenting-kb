glossary_id: G-TERM-calming-reflex
type: term
display_name: 镇静反射 (calming reflex)

full_name_en: Calming Reflex
full_name_zh: 镇静反射 / 关闭按钮

one_liner: |
  Karp 假设的胎儿期遗存反射,被子宫四感官刺激(摇晃/紧裹/响声/吸吮)激活后让胎儿"自动关机",避免乱踢扯断脐带或撞伤胎盘。
  出生后这个反射还在,5S 就是用来重启它的"开关"。

detail: |
  ## 定义
  Karp 在 2002 年提出的假设:
  胎儿在子宫内有一个进化出的"自动关机反射",由子宫四感官(摇晃 / 紧裹 / 响声 / 吸吮)激活,让胎儿保持半睡迷糊状态。

  ## 进化假说
  - 胎儿在子宫里乱踢会扯断脐带或撞伤胎盘 → 致死
  - 自然选择压力 → 进化出"被子宫感官刺激就关机"的反射
  - 这个反射出生后还存在,但需要持续刺激才能激活
  - 5S 就是出生后激活这个反射的"开关组合"

  ## 5S 如何激活
  - 包裹 + 侧抱:让宝宝先停下乱动(锁住莫罗反射干扰)
  - 嘘声 + 摇晃 + 吸吮:激活镇静反射本体

  缺一不可。少一招,反射激活不全 → 父母以为"5S 没用"。

  ## 关键操作原则
  - **强度要够** — 模拟子宫的紧/响/晃,不是温柔抚摸
  - **见效几秒到 2 分钟内** — 反射激活后通常很快平静
  - **没效说明强度/同步没到位** — 不是反射不存在
  - **头几次可能更哭** — 反射有"余震"周期,需要 5-10 个"哭→平静"循环才稳定

  ## 在 Karp 体系中的位置
  - 第四产程(为什么需要)→ **镇静反射(机制层)** → 5S(操作层)
  - 这是 Karp 流派的**机制核心**
  - 解释为什么模拟子宫环境能安抚新生儿

  ## 学术评价
  - **C 级**(Karp 假说,无独立循证)
  - 神经学上没有"镇静反射"的正式定义(不像 Moro / rooting 等)
  - 临床观察支持"模拟子宫确实安抚",但是否是单一反射尚不清楚
  - AAP 不正式承认"calming reflex"作为反射,但认可 5S 作为安抚技巧

  ## 与其他婴儿反射的区别
  - **Moro 反射(惊跳)** — 神经学正式反射,4 月消失
  - **rooting 反射(寻乳)** — 神经学正式反射,4 月消失
  - **calming 反射(Karp)** — 假说,无神经学正式定义

key_facts:
  - Karp 假设的胎儿期遗存反射
  - 5S 起效的机制基础
  - 5 招激活,少一招效果差
  - 见效几秒到 2 分钟
  - C 级证据(无神经学正式定义)


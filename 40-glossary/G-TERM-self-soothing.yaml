glossary_id: G-TERM-self-soothing
type: term
display_name: 自我安抚 (self-soothing)

full_name_en: Self-Soothing
full_name_zh: 自我安抚

one_liner: |
  婴儿 6-9 月起出现的能力:吮拇指、抱 lovey、特定行为模式安抚自己。Brazelton:看到这个就放心——自我安抚是被滋养出来的,被忽视的婴儿哭里只有"空洞绝望"。

detail: |
  ## 定义
  Self-soothing 指婴幼儿在不需要成人介入的情况下,**通过特定行为让自己从激越状态(哭闹/惊吓)回到平静**的能力。
  常见形式:吮拇指、抱 lovey、摇头、哼唱、转头看光、有节律地踢腿。

  ## 发展轨迹
  - **0-3 月**:基本不能自我安抚,完全依赖成人(包裹/抱/摇/嘘)
  - **3-6 月**:开始出现初级模式——吮指、抱住小手
  - **6-9 月**:形成稳定的自我安抚行为(lovey 也常此时出现)
  - **9-12 月**:夜醒后能自己重新入睡(若被允许)
  - **18 月+**:能在情绪激越时主动找 lovey 或安抚行为

  ## Brazelton 的反直觉立场
  传统观点:被"放任哭"的婴儿学会自我安抚——这是"训练"出来的。
  Brazelton 反向解读:
  > "被良好回应的婴儿哭里有'求助';被忽视的婴儿哭里只有'空洞绝望'。
  > 自我安抚能力不是被剥夺出来的,是被滋养出来的——孩子先要相信
  > 世界会回应他,才有勇气尝试自己解决。"

  - 自我安抚 = 内化的安全基地的外显
  - 看到孩子在哭后能自己平静下来,Brazelton 认为这是发展健康的信号
  - 看到孩子哭得声嘶力竭后突然安静(状态崩溃),这才是危险信号

  ## 与 lovey 的关系
  - Lovey 是自我安抚的物理工具
  - 自我安抚是 lovey 服务的功能目标
  - 两者经常同时出现,但不一一对应——也有不用 lovey 就能自我安抚的孩子

  ## 在本知识库中
  - C-S1-082 / C-S2-022 / C-S2-020 早期信号
  - C-S4-019 / C-S4-022 6-9 月成型
  - C-S5-021 9-12 月稳定
  - C-S6-025 18 月深化
  - C-S7-022 2-3 岁延展

key_facts:
  - 6-9 月起稳定出现的能力
  - Brazelton:健康发展的标志
  - 被良好回应的孩子才学得会
  - 与 lovey 共生但不绑定
  - 看到自我安抚 = 内化安全基地形成


full_name_zh: "海蒂·墨可夫"
one_liner: |
  美国育儿畅销书 What to Expect 系列共同作者,孕产育儿全民参考。
detail: |
  Heidi Murkoff,美国育儿畅销书《What to Expect When You're
  Expecting》(海蒂怀孕大百科)和《What to Expect the First
  Year》(海蒂育儿大百科 0-1 岁)的共同作者。与母亲 Arlene
  Eisenberg、姐姐 Sandee Hathaway 共同创作系列著作,首版
  1989 年出版,后多次修订(2010 年第二版)。中文版由南海
  出版公司 2014 年发行,译者莫夏迪、张敏。该系列在美国孕妇
  和新手妈妈中普及度极高,被《时代》杂志列入百本最具影响力图书。

glossary_id: G-ABBR-Rotavirus
type: abbreviation
display_name: Rotavirus

full_name_en: Rotavirus Vaccine (RV)
full_name_zh: 轮状病毒疫苗

one_liner: |
  预防轮状病毒严重腹泻(WHO 全球婴儿主要死因之一,5 岁内 95% 至少感染一次)。中国二类苗自费 — 国产 RV5(罗特威,2-36 月,口服)/ 进口 RV5(默沙东,2-4-6 月,口服)。美国 AAP 一类推荐 2-4 月起两/三针口服。

detail: |
  ## 是什么
  RV = Rotavirus Vaccine(轮状病毒疫苗)
  - 口服减毒活疫苗(不是注射,是滴入嘴里)
  - 预防 5 大群轮状病毒严重感染
  - 5 岁前 95%+ 婴幼儿至少感染一次轮状病毒

  ## 为什么严重?
  轮状病毒 = WHO 全球婴儿严重腹泻 #1 原因:
  - **严重水样泻 + 呕吐 + 发热** → **快速脱水**
  - 婴儿脱水到中重度只需要 6-12 小时
  - 全球每年儿童死亡约 20 万(主要发展中国家)
  - 中国 0-5 岁轮状病毒住院率约 1/8

  ## 疫苗时间表

  ### 中国(二类苗,自费)
  两种主要疫苗:
  - **罗特威(RV1,国产兰州 LLR)**:2-36 月,每年口服一次,共 3 次
  - **乐儿德(进口默沙东 RotaTeq, RV5)**:2 月、4 月、6 月,共三针口服(每针约 ¥250-350)
  - 进口效力数据更强(预防严重病例 90%+)
  - 国产数据较弱但价格便宜(全程 <¥300)

  ### 美国 AAP(一类强烈推荐)
  - **RotaTeq(默沙东 RV5)**:2 月、4 月、6 月口服(三剂)
  - **Rotarix(GSK RV1)**:2 月、4 月口服(两剂)
  - 必须在 8 月前完成第一剂(肠套叠风险窗口)

  ## 关键时间窗(必须注意!)
  - **第一剂必须在 15 周(约 3.5 月)前**
  - **最后一剂必须在 8 月前**
  - 错过窗口 = 不能补种(肠套叠风险增加)

  ## 副作用 — 肠套叠风险
  历史:1998 年第一代轮状疫苗 RotaShield 因增加肠套叠风险撤市。
  现代 RV5 / RV1 风险大降:
  - 约 1/20000-1/100000 接种后 7 天内肠套叠
  - 但避免轮状病毒严重感染的获益 >> 风险
  - 接种后 7 天内宝宝突发剧烈哭闹 + 果酱样大便 → 立即就医

  ## 误区
  - "轮状病毒就是腹泻没必要打" — 错。重症脱水致死,5 岁前 1/8 住院
  - "国产便宜不如进口" — 国产效力略弱但仍有效,经济条件考虑
  - "口服疫苗后吐了要补打" — 一般不补(口服疫苗后吐是常见 + 仍部分吸收)
  - "可以延后到 1 岁再打" — 错。8 月后不能接种(肠套叠风险窗口)

key_facts:
  - 中国二类苗自费 / 美国 AAP 一类推荐
  - 口服(不是注射)
  - 第一剂必须 15 周(3.5 月)前 / 最后剂 8 月前(必须严格)
  - 罗特威(国产)全程 <¥300 / 乐儿德(进口)全程 ~¥1000
  - 预防严重腹泻脱水 + 住院
  - 罕见但严重副作用:肠套叠(7 天内监测)


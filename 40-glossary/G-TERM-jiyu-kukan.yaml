glossary_id: G-TERM-jiyu-kukan
type: term
display_name: 自由空间(松田用词)

full_name_zh: 自由空间
full_name_ja: 自由空間(じゆうくうかん, jiyu kukan)
full_name_en: "Free Space (Matsuda)"

one_liner: |
  松田道雄 §387 反"反抗期"理论的核心概念 — 街头 / 公共空间是孩子玩耍 + 学习社会的场所,机动车把它消灭了。

detail: |
  ## 概念定义

  松田道雄在《育儿百科》§387(什么是"反抗期")提出的核心概念。

  **自由空间** = 孩子能从家门跨出一步就能自由玩耍 + 找到差不多年龄小朋友的街头 / 街区空间。

  3 个关键特征:
  1. **物理上自由** — 任何时候都能找到玩耍场所;
  2. **关系上自由** — 任何时候都能找到差不多年龄小朋友;
  3. **管理上自由** — 跑到马路上就可以不听母亲的说教,
     传统严格教育之所以可行,正是因为有这种"弹性"。

  ## 历史变迁

  松田观察:
  - **以前**:孩子从家门跨一步就能自由玩 — 采蒲公英 / 捕蝴蝶 / 用树叶做船;
  - **现在(1967)**:机动车把家门前的马路变成危险地方;
  - **现代(2025)**:更甚 — 小区车多 / 公园不让奔跑 / 街头玩伴消失。

  自由空间消失 → 孩子被关家里 → 创造力受限 → "反抗期"频发 → 父母用电视代替陪伴 → 恶性循环。

  ## 操作含义(给家长)

  1. 主动创造"自由空间" — 寻找小区附近的安全区域;
  2. 让孩子有跟同龄朋友自由玩的时间;
  3. 不让"反抗期"标签化孩子;
  4. 把"机动车 + 安全焦虑"翻译成具体行动:
     - 找无车小路
     - 周末远郊去玩
     - 鼓励同龄家庭组成"自由空间"小组

  ## 跟其他派别对照

  - 蒙氏 "yes space" — 室内自由空间(范围更小)
  - RIE "respectful environment" — 婴儿活动自由
  - 松田 "自由空间" — 户外 + 街区 + 同伴(范围最大)

  3 派立场互补:
  - 室内 yes space(蒙氏)
  - 婴儿活动 respectful environment(RIE)
  - 户外街区 自由空间(松田)

  ## 中国家长直接相关

  - 小区车多怎么办 — 找无车空地;
  - 公园不让奔跑 — 周末远郊;
  - 没有同龄玩伴 — 组邻居家庭"自由空间"小组;
  - 不要让"反抗期"绑架对孩子的判断。

  ## 在本知识库中

  - SRC-024 §387 反抗期理论核心概念
  - 跟蒙氏 yes space + RIE respectful environment 互补

key_facts:
  - 松田道雄《育儿百科》§387 核心概念
  - 街头 + 同龄朋友 + 管理自由 三合一
  - 机动车把"自由空间"消灭了
  - 现代中国家长直接关心的"小区车多怎么办"


glossary_id: G-ABBR-Varicella
type: abbreviation
display_name: Varicella

full_name_en: Varicella Vaccine (Chickenpox Vaccine)
full_name_zh: 水痘疫苗

one_liner: |
  预防水痘(VZV 水痘-带状疱疹病毒)。中国二类苗自费 12-15 月 + 4 岁加强;美国 AAP 12-15 月 + 4-6 岁(一类强烈推荐)。水痘看似"小儿病",但严重型(肺炎 / 脑炎 / 二次细菌感染)致死率 0.05%,且终身潜伏可成年带状疱疹。

detail: |
  ## 是什么
  Varicella = Varicella Vaccine(水痘疫苗)
  - 预防 VZV(Varicella-Zoster Virus,水痘-带状疱疹病毒)
  - **同一病毒**引起两种病:儿童期水痘 + 成年潜伏后带状疱疹("带状疱疹"= shingles)
  - 极易传染(空气飞沫 + 接触水疱液)— 一个班一个孩子得整班传

  ## 疫苗时间表

  ### 中国(二类苗,自费)
  - 12-15 月:第一针(国产 / 进口均可,约 ¥150-300)
  - 4 岁:加强针(2017 年起部分省市纳入二类苗免费)
  - 部分地区 18 月已可接种第二针(看 CDC 当地政策)

  ### 美国 AAP(一类强烈推荐)
  - 12-15 月:第一针
  - 4-6 岁:第二针
  - 美国 1995 年起常规接种,水痘病例减 90%+

  ### 早产儿
  按实际日龄(不是矫正)接种

  ### 接种禁忌
  - 免疫缺陷(白血病 / HIV / 化疗)
  - 孕妇(理论风险,实操避免接种后 1 月怀孕)
  - 急性发热

  ## 水痘并发症(为什么必须打)
  看似"小儿病",但实际:
  - **细菌二次感染**(占并发症 50%):水疱抓破 → 葡萄球菌 / 链球菌侵入
  - **水痘肺炎**:儿童 1/100 / 成人 1/4 严重病例
  - **水痘脑炎**:1/4000 严重病例(后遗症 + 致死)
  - **小脑共济失调**:1/4000(暂时性运动障碍)
  - 致死率约 0.05%(每 2 万水痘 1 例死亡)

  ## 终身潜伏 — 带状疱疹的隐患
  得过水痘的人 → VZV 终身潜伏在神经节
  - 30+ 岁后免疫力下降时复活 → **带状疱疹**(剧痛 / 后遗神经痛)
  - 50 岁人群带状疱疹年发病率 1%,终身风险 30%
  - 接种水痘疫苗(减毒活疫苗)→ 带状疱疹风险大降

  ## 接种反应
  - 局部红肿
  - 低热
  - 1-3 周后极少出现轻微皮疹(疫苗株,不传染)
  - 极少严重反应

  ## 误区
  - "得一次就免疫一辈子" — 部分对,但带状疱疹仍可能
  - "二类苗就是没必要" — 错。AAP 一类推荐,二类只是中国免疫规划经济考虑
  - "得过水痘的孩子不用打" — 自然感染免疫一般充分,但建议医生确认
  - "我家不去托儿所" — 水痘传染力极强,家庭聚餐 / 亲戚孩子都可能传

key_facts:
  - 中国二类苗自费 / 美国 AAP 一类强烈推荐
  - 12-15 月 + 4 岁(部分地区 18 月)共两针
  - 水痘致死率 0.05% + 严重并发症
  - VZV 终身潜伏 → 成年带状疱疹隐患
  - 美国 1995 后病例减 90%+
  - 早产儿按实际日龄接种


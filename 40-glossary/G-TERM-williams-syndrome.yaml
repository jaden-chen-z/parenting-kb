one_liner: |
  基因疾病(7q11.23 缺失)— 社交+音乐强但空间+数学弱。反"基因决定智力"立场(智能不均衡)。

detail: |
  ## 定义
  基因疾病(7q11.23 缺失)— 社交+音乐强但空间+数学弱。反"基因决定智力"立场(智能不均衡)。

  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版)反复引用。

  ## 跨派对接
  V4 综述权威立场,跨章节多次出现,跟现库其他派有立场对照。

  ## 中国家长意义
  详见相关知识卡。

key_facts:
  - "Lerner V4 反复引用术语"
  - "应用心理学综述权威定义"


glossary_id: G-TERM-agoraphobia
type: term
display_name: 广场恐怖症 (agoraphobia)

full_name_en: Agoraphobia
full_name_zh: 广场恐怖症 / 旷野恐惧症

one_liner: |
  字面"怕拥挤场所",Bowlby Vol 2 重新解读:实际是**焦虑型依恋的成人版**。
  患者最怕的是"独自离开熟悉环境",不是拥挤本身。多数童年期是拒学症儿童(C-S7-041)。

detail: |
  ## 字面定义 vs Bowlby 解读

  ### 传统精神病学定义
  对**拥挤场所 / 街道 / 旅行 / 独自外出**产生强烈恐惧,常伴恐慌发作 / 抑郁 / 心身症状。
  患者倾向只在熟悉环境(家)感到安全,不能独自外出。

  ### Bowlby Vol 2 第十九章重新解读
  **不是真正的恐怖症(phobia),是"假性恐怖症"(pseudo-phobia)。**
  患者真正怕的是 2 件事(Snaith 1968 数据):
  1. **离开熟悉的环境**
  2. **独自一人,尤其是离开家时独自一人**

  Snaith 在 48 个案例中,**27 个明确说最怕的是离开家** — 不是怕拥挤本身。
  Bowlby 命名:这其实是**"非特定性的不安全恐惧"**,本质是**对依恋对象不可获得的焦虑**。

  ## 主要研究数据(Bowlby Vol 2 Ch 19)

  ### Roth 1959-1965 + Marks & Gelder 1969 系列
  - 突发的创伤性事件高发(实际或威胁的身体疾病、丧亲、家庭成员生病)
  - 人格解体高发
  - 与焦虑 + 抑郁紧密关联

  ### 与拒学症的连续性
  Bowlby 关键发现:
  - **大部分广场恐怖症患者童年期是拒学症儿童**
  - 他们的父母中有一个或两个长期神经症
  - 通常处于"过度保护"母亲的统治下
  - 拒学症 4 模式延续到成年 → 广场恐怖症

  ## 4 种家庭背景(延续拒学症)

  ### 模式 A(最常见)
  母亲长期焦虑 + 角色倒置 → 把患者作为陪伴 → 患者从拒学到成年广场恐怖症

  ### 模式 B
  患者怕在自己外出时家人出事 → 待在家里"守护"

  ### 模式 C
  患者怕自己离家时自己出事

  ### 模式 D
  父母过度保护让患者怕外面世界

  ## 代际传递机制(Bowlby Vol 2)
  - 外婆焦虑型依恋 → 角色倒置养出妈妈
  - 妈妈无法独处 → 通过控制孩子缓解
  - 孩子被迫陪伴 → 学会"分离 = 灾难"
  - 孩子长大 → 自己也焦虑型依恋 / 广场恐怖症
  - **代际率 ~75%(AAI 数据)**

  ## 治疗原则
  Bowlby 强调:**不是治"怕拥挤" — 治童年依恋创伤**。
  - 行为暴露疗法只治表面
  - 真正干预需要处理代际依恋模式
  - 中产成人的"广场恐怖"经治疗多可缓解
  - 不治疗会传给下一代

  ## 中文文化版本
  - "妈妈不敢独自坐高铁"
  - "妈妈舍不得孩子离家上大学"
  - "妈妈陪读到博士"
  - 表面"溺爱",实际是妈妈自己的广场恐怖症
  - 退休妈妈"啥也不想做就想跟孙子在一起"也常见此机制

  ## 在本知识库中
  - C-S7-043 妈不舍 = 妈自己焦虑 — 主卡(代际传递)
  - C-S7-041 拒学和逃学不同 — 童年版连续性
  - C-S6-093 别让娃当你情绪保姆 — 角色倒置成因
  - 留 Phase 5 蒙台梭利 / RIE 系列卡补充独立训练角度

key_facts:
  - Bowlby 重命名为"假性恐怖症",本质焦虑型依恋成人版
  - 怕的是离家不是拥挤本身
  - 大多数童年期是拒学症
  - 拒学症 4 模式延续到成年
  - 代际传递率 ~75%
  - 中文版本:妈妈不敢独处 / 陪读至大学 / 退休黏孙子


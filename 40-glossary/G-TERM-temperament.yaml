glossary_id: G-TERM-temperament
type: term
display_name: 气质 (temperament)

full_name_en: Temperament
full_name_zh: 气质

one_liner: |
  6-7 月起稳定的 9 个维度(活动量/分心度/坚持/趋避/强度/适应/规律/感官阈值/心情)。Stella Chess + Alexander Thomas 1956 提出,不是"贴标签",而是给父母"基准线"。

detail: |
  ## 定义
  Temperament 指婴幼儿天生的、相对稳定的行为反应风格。
  与人格(personality)不同——人格是经验+气质共同塑造,气质是**生物层面的反应基线**。

  ## Chess-Thomas 9 维度(1956 NYLS 纵向研究)
  Stella Chess 和 Alexander Thomas 1956 启动 New York Longitudinal Study(NYLS),
  追踪 133 名儿童从婴儿期到成年期,提炼出 9 个气质维度:

  1. **活动量(Activity Level)**:动作多/少
  2. **节律性(Rhythmicity)**:吃睡规律/不规律
  3. **趋避性(Approach-Withdrawal)**:对新事物迎/退
  4. **适应性(Adaptability)**:适应变化快/慢
  5. **反应阈值(Threshold of Responsiveness)**:对刺激敏感/迟钝
  6. **反应强度(Intensity of Reaction)**:反应大/小
  7. **心情质量(Quality of Mood)**:基线偏正面/负面
  8. **分心度(Distractibility)**:容易/难被打断
  9. **注意力坚持(Attention Span / Persistence)**:专注短/长

  Chess-Thomas 据此归类为三型:**Easy / Slow-to-warm-up / Difficult**(约 65% 可分类)。

  ## Brazelton 的临床用法
  Brazelton 强调气质评估**不是贴标签**,而是:
  - 给父母一条**基准线**:你家孩子不是"难带",他是"高强度+慢适应"型
  - 减少父母自责:孩子的气质不是父母失误造成的
  - 个性化建议:不同气质需要不同的安抚 / 转换 / 边界策略
  - "Goodness of fit"(契合度)概念:父母风格与孩子气质的匹配度比孩子气质本身更重要

  ## 与 NBAS 的关系
  - NBAS 评估**新生儿**层面的反应模式(2 月内)
  - 气质是 6-7 月起更稳定的行为风格
  - 两者都源自"宝宝是主动参与者"的研究范式

  ## 在本知识库中
  - C-S2-019 1-3 月气质雏形
  - C-S3-030 3-6 月气质显现

key_facts:
  - Chess + Thomas 1956 NYLS 提出
  - 9 个维度,分 Easy/Slow-to-warm/Difficult 三型
  - 6-7 月起稳定,生物基线
  - Brazelton:不是贴标签,是"基准线"
  - "Goodness of fit"比气质本身更关键


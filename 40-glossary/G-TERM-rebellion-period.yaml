glossary_id: G-TERM-rebellion-period
type: term
display_name: 反抗期 / Terrible Twos

full_name_en: Rebellion Period / Terrible Twos
full_name_zh: 反抗期(2-3 岁)

one_liner: |
  2-3 岁孩子顶嘴/哭闹/拒绝合作的阶段。松田道雄独到立场:不是生理现象,是父母教养不当产物 — 集体生活中孩子没"反抗期"。

detail: |
  ## 主流定义
  Terrible Twos:英美儿童心理传统说法,2-3 岁孩子情绪剧烈+顶嘴+反抗+躺地哭闹。
  归因:神经发育(自主性 vs 协作性)+ 语言爆发跟不上情绪 + 自我意识萌芽。

  ## 松田道雄独到立场 ⭐⭐⭐

  ### 反"反抗期"概念
  松田直言:"反抗期"不同于青春期/更年期(必经生理现象)。
  只在家里养的孩子才有"反抗期",幼儿园集体生活中孩子没有。

  ### 根本原因
  现代家庭对协作性教育不得体 → 父母方法有问题 → 把孩子推进"反抗期"。

  ### 战前对照
  战前孩子在大孩子带领下,自由空间里学协作 — 任性会被排斥。
  现在城市汽车多+空地少+妈门锁住 → 娃没自由空间 → 没机会学协作。

  ### 实践含义
  - 别用"反抗期"标签解释一切
  - 看自己沟通方式是否压制
  - 增加娃跟同龄孩子玩的机会
  - 减少不必要的禁令
  - 给娃自己做选择空间

  ## 多派立场对比
  - **传统/Brazelton**:发展正常阶段(认同+假装+模仿)
  - **Lansbury (RIE)**:承认情绪 + 限度并存
  - **松田道雄**:反"反抗期"概念,是教养产物
  - **Stern**:语言爆发跟不上情绪 → 双刃剑期

  ## 中国家长高频痛点
  - 一句"反抗期到了"就不反思教养
  - 当众打骂 → 加重娃情绪失控
  - 朋友圈晒"我家娃终于过了反抗期"标签化娃

key_facts:
  - 2-3 岁孩子顶嘴/哭闹/反抗阶段
  - 松田反此概念:是教养产物不是生理现象
  - 集体生活孩子没"反抗期"
  - 战前自由协作空间消失是现代家庭问题
  - 反对父母用标签推卸教育责任


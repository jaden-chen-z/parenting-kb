glossary_id: G-TERM-anti-baby-walker
type: term
display_name: 反学步车 / 反撑物立场

full_name_de: gegen Lauflerngerät / gegen alle Stützhilfen
full_name_zh: 反学步车 + 反一切撑物立场
full_name_en: Anti Baby Walker / Anti All Propping Devices

one_liner: |
  Pikler 1969 + AAP + Brazelton + RIE / 蒙氏 0-3 共同立场:学步
  车 / 跳跳器 / Bumbo / 婴儿座椅 / 摇椅 等"撑物"全部反对 — 跳过
  自然过渡 + 损平衡感 + 安全风险。

detail: |
  ## 反对清单
  ### 大动作类
  - **学步车**(Lauflerngerät / Baby Walker):跳过爬 → 站 → 走 自然过渡
  - **跳跳器**(Türhopser / Jumper):同上 + 关节冲击
  - **婴儿弹跳椅**(Schaukelstuhl):撑姿 + 不能动
  - **手推学步车**(Lauflernwagen):比固定学步车好但仍干扰

  ### 撑坐类
  - **Bumbo seat**(1990s 南非):1-12 月撑坐神器
  - **婴儿座椅 / Babywanne**:撑姿
  - **摇椅 / 沙发摆姿**:撑姿
  - **大腿上"坐"**:脊椎承重

  ### 其他
  - **婴儿背带 / 卡腿背巾**(Pikler 立场反 — 长时间用导致髋关节问题)
  - **婴儿座椅碗 / Hochstuhl 没脚踏**:脚悬空 + 撑姿

  ## 立场源头
  - **Pikler 1969**(SRC-026):全书反复立场
  - **AAP**(SRC-002):反学步车明确,数百起伤亡报道
  - **Brazelton**(C-S3-033):反学步车
  - **Magda Gerber RIE**(SRC-022 C-S1-411 / 558):"7 类婴儿设备先放下"
  - **加拿大 2004 立法禁售学步车**(全球首例)

  ## 反对论证
  1. **跳过自然过渡**:站 → 蹲 → 扶物侧移 → 走 都被跳过
  2. **平衡感建立失败**:被撑姿走的孩子,独立走时步态不稳
  3. **安全风险**:学步车每年美国 9000+ 急诊(跌楼梯 / 翻倒)
  4. **髋关节风险**:卡腿背带类导致 Hip Dysplasia(髋发育不良)
  5. **大脑发展损**:跳过爬 = 缺交叉协调 + 视觉空间感

  ## 例外(可以用的)
  - **新生儿 baby car seat**(汽车安全,必用)
  - **臂弯抱 / 头颈支撑抱**(Pikler 不反对)
  - **柔软包巾(只睡眠用)**:Karp swaddle 立场
  - **floor bed + yes space + 围栏**:Pikler 推荐(不撑姿)

  ## 跟中国常见育儿用品对照
  - **学步车**:中国 80% 家庭有 — Pikler 严反
  - **Bumbo seat**:近年进口流行 — Pikler 严反
  - **跳跳器**:中产流行 — Pikler 严反
  - **婴儿背带**:正面背 + 髋关节支撑式 OK,卡腿式反对

  ## 替代方案
  - 地板 + 安全围栏 + 简单玩具
  - 让孩子自抓栏杆 / 沙发扶手 / 矮桌站起
  - 平面 + 时间 + 不打扰 = 大动作发展


glossary_id: G-TERM-stranger-anxiety
type: term
display_name: 陌生人焦虑 (stranger anxiety)

full_name_en: Stranger Anxiety
full_name_zh: 陌生人焦虑

one_liner: |
  婴儿 ~8 月起对陌生人产生紧张 / 退缩 / 哭闹的发展阶段。是健康认知里程碑,不是性格问题。

detail: |
  ## 定义
  婴儿对不熟悉的人产生紧张反应:躲进父母怀里、哭闹、转头不看、拒绝被抱。
  AAP 直接说:"即使是亲戚和常见保姆在靠得太近时也会躲藏或哭泣" — 这是正常发展信号。

  ## 时机
  - **8 月起**:出现(与物体永久性同期)
  - **10-12 月**:可能加强
  - **18-24 月**:逐渐消退(与分离焦虑同步)

  ## 为什么这是健康发展
  陌生人焦虑表示宝宝的认知发展到能"分类人":熟悉 vs 陌生。
  对未知谨慎是生存本能(进化保留下来的保护机制)。
  不是性格弱 / 不亲老人 / 性格问题。

  ## 怎么应对(AAP 建议)
  - 让陌生人保持距离,让宝宝主动接近
  - 老人 / 保姆见面前先视频"预热"(熟悉脸和声音)
  - 陌生人不直接抱,先和父母聊熟,宝宝看着
  - 不强迫宝宝跟陌生人(强迫加重焦虑 + 损伤安全感)
  - 给时间和耐心,几个月内自然过渡

  ## 与分离焦虑的区别
  - **陌生人焦虑**:对"新面孔"的反应(8 月起)
  - **分离焦虑**:对主要养育人离开的反应(10-18 月峰值)
  - 两者认知基础都是物体永久性 + 健康依恋

  ## 松田道雄临床观察(SRC-023 §187)
  5-6 月婴儿能认清母亲脸,见到陌生男人脸有的就大哭(陌生人警觉萌芽,比传统 8 月稍早)。
  打针反应也分天性 — 一声不吭的、过会才哭的、针头触皮就哭的,都正常。
  "这是娃的天性,不是教育能改变的" — 反"我家娃太敏感"焦虑。

key_facts:
  - ~5-6 月起萌芽(松田观察)/ ~8 月起明显(AAP)
  - 是健康认知里程碑(不是性格问题)
  - 18-24 月自然消退
  - 不强迫,让宝宝主动接近
  - 打针反应天性差异,不是"教不出来"


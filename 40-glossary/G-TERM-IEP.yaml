display_name: IEP 个别教育计划

en_term: Individualized Education Plan
zh_term: IEP 个别教育计划

one_liner: |
  美国特殊教育法律要求 — 每个特殊娃个性化教育计划。年评估 + 团队会议(老师/父母/治疗师)+ 目标清单。中国部分省市跟进。

detail: |
  ## 定义
  美国特殊教育法律要求 — 每个特殊娃个性化教育计划。年评估 + 团队会议(老师/父母/治疗师)+ 目标清单。中国部分省市跟进。

  ## V4 出处
  Lerner Handbook of Child Psychology Vol 4 (Wiley 2006 第 6 版)反复引用。

  ## 跨派对接
  V4 综述权威立场,跨章节多次出现,跟现库其他派有立场对照。

  ## 中国家长意义
  详见相关知识卡。

key_facts:
  - "Lerner V4 反复引用术语"
  - "应用心理学综述权威定义"


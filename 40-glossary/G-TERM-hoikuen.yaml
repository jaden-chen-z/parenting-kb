glossary_id: G-TERM-hoikuen
type: term
display_name: 保育园 vs 幼儿园(日)

full_name_zh: 保育园(ほいくえん) / 幼儿园(ようちえん)
full_name_ja: 保育園 / 幼稚園
full_name_en: "Hoikuen (daycare) vs Yochien (preschool) — Japanese system"

one_liner: |
  日本 0-6 岁分龄保育制度 — 0-5 岁保育园(全日)+ 3-6 岁幼儿园(半日),松田重点推动 0-1 岁保育园模式。

detail: |
  ## 制度定义

  日本 0-6 岁集体保育按月龄分两套:

  1. **保育园(ほいくえん, hoikuen)**
     - 服务 0-5 岁(包括婴幼儿)
     - 全日制 8-10 小时(8 点入园 - 5 点离园)
     - 厚生省主管(社会福利体系)
     - 接收双职工家庭 / 母亲不能照看的孩子
     - 1967 年松田时代的"婴儿保育"主要场所

  2. **幼儿园(ようちえん, yochien)**
     - 服务 3-6 岁
     - 半日制 4-5 小时
     - 文部科学省主管(教育体系)
     - 偏教育属性
     - 母亲在家或工作时间灵活才送

  ## 松田立场(《育儿百科》§117-127)

  松田道雄是日本婴儿保育(hoikuen)运动重要推动者:
  1. **保育园不只为母亲服务** — 双职工家庭夫妻共同维护;
  2. **反对父亲只工作不带孩子** — 1967 年呼吁"父亲背孩子上保育园";
  3. 保育园应有养护室 + 保育护士 — 病儿不该全推给妈妈;
  4. 优质保育园指标(§118):
     - **保育员:婴儿 = 1:3**(理想比例)
     - 只招 0-1 岁(避免混龄)
     - 婴儿室够大 + 阳台空气浴
     - 跟家庭密切沟通(必要时家访)
     - 离家近;
  5. 反对延长保育(§119) — 孩子筋疲力尽回家无家庭生活体验。

  ## 跟美国 day care 对照

  | 维度 | 日本保育园 | 美国 day care |
  |---|---|---|
  | 服务月龄 | 0 月起(产假后立即) | 通常 6 周-5 岁 |
  | 主管 | 厚生省福利体系 | 私立 + 部分政府补助 |
  | 价格 | 政府补贴大 | 私立昂贵 |
  | 保育员资格 | 国家认证 | 各州差异大 |
  | 文化期待 | 集体主义 / 同伴重要 | 个人发展 |

  ## 跟中国托育对照

  - 0-3 岁中国传统托儿所 → 90 年代单位福利消失 → 家庭育儿(奶奶) → 2020s 重启托育
  - 现代中国托育偏少 / 偏贵 / 资源不均
  - 松田 1967 年的"保育园应是双职工大后方"立场,跟中国当代育儿生态对照参考

  ## 中国家长直接相关

  - 0-3 岁是送托还是奶奶带?
  - 优质托育的 5 个指标(松田)
  - 怎么挑保育员 / 看眼神
  - 双职工怎么拆责任

  ## 在本知识库中

  - SRC-024 (松田) 集体保育板块的核心概念
  - 跟 Brazelton "选日托看共情不看课程"立场互补


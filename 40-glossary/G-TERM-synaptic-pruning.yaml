glossary_id: G-TERM-synaptic-pruning
type: term
display_name: 突触修剪 (synaptic pruning)

full_name_zh: 突触修剪
full_name_en: Synaptic Pruning

one_liner: |
  0-3 岁宝宝大脑突触从出生约 2500 亿增到 3 岁的 1 万亿(爆增 4 倍),然后开始**修剪** — 用得到的留,用不到的删。
  这是关键期 + 知觉重组的神经基础。

detail: |
  ## 定义
  神经突触(synapse)= 神经元之间的连接点。
  婴儿出生有海量突触,前 3 年继续爆增,然后大脑开始**用进废退式修剪**:
  - 经常被刺激的连接 → 加强
  - 很少被刺激的连接 → 删除

  ## 时间表(粗略)
  - 出生:约 2500 亿突触
  - 6-12 月:突触爆增高峰(每秒 100 万新连接)
  - 3 岁:约 1 万亿突触(成人 2 倍)
  - 3-12 岁:渐进修剪
  - 青春期 + 早成年:第二轮修剪
  - 成人:回到约 5000 亿(出生 2 倍)

  ## 为什么这是重要的
  - **关键期**(critical period)的神经基础
  - **知觉重组**(perceptual narrowing)就是修剪的一例
  - **大脑可塑性**(plasticity)的物理证据

  ## Hubel & Wiesel 1962 经典实验
  - 把猫一只眼遮住几周(关键期内)
  - 该眼神经突触被大量修剪 — 视觉皮层重组
  - 后期摘罩 → 该眼永久失明
  - 证明:**用进废退**的窗口期不可逆

  ## 知觉重组例子(语言)
  - 0-6 月所有音素差别都有连接
  - 6-12 月:母语音素连接强化,外语音素连接修剪
  - 一旦修剪 → 永远学不到完美口音

  ## 中国家长意义

  ### 1. 0-3 岁的"输入"决定保留哪些连接
  - 多语言环境 → 多语言连接保留
  - 多互动 → 社交连接保留
  - 但**质 > 量** — 焦虑灌输不如安全互动

  ### 2. "经历"比"知识"重要
  - 突触不修剪"知识点",修剪"经历模式"
  - 你跟宝宝怎么互动 / 哪种情绪体验多 → 那种连接保留
  - 这就是 Bowlby 内部工作模型 + 依恋机制的神经基础

  ### 3. 不要焦虑"漏了什么"
  - 突触修剪是**特化**,不是损失
  - 大脑变更高效,不是变笨
  - 中国家长高频痛点:"3 岁前没学 X 是不是输了?" — 错。3 岁后能学,只是有口音 / 速度慢

  ### 4. 暴力 / 焦虑也被"修剪保留"
  - 长期焦虑环境 → 应激连接保留
  - ACE(童年逆境)研究:0-3 岁逆境影响终身大脑结构

  ## 跟其他术语关系
  - **Critical Period**:修剪窗口期的同义词
  - **Perceptual Narrowing**:语言领域的修剪
  - **Hubel-Wiesel 实验**:关键期 + 修剪经典证据

  ## 数字注意
  - 不同文献数字略不同(突触有"已建立 vs 已激活"区别)
  - 共识:**3 岁是突触爆发顶峰,之后开始修剪**

key_facts:
  - 用进废退式神经修剪
  - 6-12 月突触爆增高峰
  - 3 岁达 1 万亿(成人 2 倍)
  - 关键期 + 知觉重组的神经基础
  - Hubel-Wiesel 1962 经典实验


display_name: 王少丽

full_name_zh: 王少丽
full_name_en: "Wang Shaoli (translator)"

one_liner: |
  松田道雄《育儿百科》中文译者(主译) — 把日本最经典的家用儿科工具书带给中国家长。

detail: |
  ## 个人背景

  王少丽是松田道雄《育儿百科》(《育児の百科》)中译本的主译者。

  ## 翻译贡献

  - 把日本经典儿科工具书《育儿百科》(松田道雄)从日文翻成中文
  - 中译版让中国家长能直接读到日本"不焦虑育儿"哲学
  - 中文版广泛流通,跟中国家长高频痛点高度对应

  ## 翻译特征

  从 SRC-024 OCR 看:
  - 中文版基本保留松田原书的章节编号(§1-651)
  - 章节标题贴近中国家长习惯("把屎把尿"翻成"排便训练")
  - 部分日式文化背景(保育园 / 幼儿园 / 自由空间)忠实保留
  - 学术词转白话译法(如"sIgA"翻成"分泌型免疫球蛋白 A")
  - 偶有 OCR 噪声但不影响知识传达

  ## 在本知识库中

  - SRC-024 中译版的关键人物
  - 中国家长接触松田立场的桥梁


detail: |
  ## 简介
  Chessa Lutter — PAHO(Pan American Health Organization,泛美卫生组织)高级喂养专家,IYCF 政策制定核心。
  
  ## 主要贡献
  - PAHO/WHO 2003 'Guiding Principles for Complementary Feeding' 共同作者
  - 拉美 BFHI 推广核心
  - 全球儿童营养政策制定
  
  ## 在 SRC-031 中的角色
  PAHO 是 WHO 美洲区办公室 — Lutter 代表区域专家,跟 Dewey 合作。


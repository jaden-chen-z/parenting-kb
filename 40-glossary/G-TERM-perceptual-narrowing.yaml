glossary_id: G-TERM-perceptual-narrowing
type: term
display_name: 知觉重组 (perceptual narrowing)

full_name_zh: 知觉重组 / 知觉收窄
full_name_en: Perceptual Narrowing

one_liner: |
  6-12 月婴儿"调谐"到母语的过程 — 失去辨别外语音素能力,换取对母语的精准识别。
  Kuhl 1992 关键发现:这是双语家庭的关键期窗口。

detail: |
  ## 定义
  0-6 月婴儿能区分**全世界所有语言**的音素;
  6-12 月开始,大脑"修剪"非母语音素的辨别神经,只保留母语;
  12 月后失去这能力(成人重学外语永有口音的根因)。

  这不是"丢失",是**特化** — 用辨别力换识别速度。

  ## 经典实验

  ### 1. Kuhl 1992 R/L 实验
  - 6 月日本宝宝 + 6 月美国宝宝:**都能区分** R vs L
  - 12 月:只有美国宝宝还能区分,日本宝宝失去
  - 母语没这区分,大脑就修剪掉

  ### 2. Kuhl 2003 中文 / 英文实验(台北 + 西雅图)
  - 6-9 月:两组都能区分两种语言音素
  - 9-12 月:各自只能区分母语
  - 进一步证明窗口是 6-12 月

  ### 3. 真人 vs 录像(Kuhl 2003 关键实验)
  - 9 月美国宝宝看 12 节中文录像 = **0 效果**
  - 9 月美国宝宝跟中文老师互动 12 节 = **显著学到**中文音素
  - **结论:窗口期不能靠音频视频,必须真人**

  ## 同样原理覆盖

  ### 视觉
  - 6 月婴儿能区分**所有猴脸**;9 月只能区分"自己物种"的猴
  - 跨种族脸辨识也类似 — 跨族识别成人弱于母族,源于这窗口

  ### 音乐
  - 6 月婴儿能感知"非西方音阶"(印度 / 中东等);成人感知不到
  - 文化音乐感是这窗口塑造的

  ## 中国家长意义
  - **双语家庭最佳窗口:0-12 月**(尤其 6-12 月)
  - 想让娃英语没口音?**6-12 月真人英语对话**(找人 / 自己说 / 视频通话亲戚)
  - 6 岁后再学外语?永远有口音 — 不是天分问题,是窗口关了
  - **录像 CD 启蒙没用** — 必须真人互动
  - 怕双语影响母语?**反:不会** — 大脑自动分 2 套统计模型

  ## 关键边界
  - 不是"6-12 月不学外语就完蛋"
  - 是"6-12 月能学到完美口音,之后能学但有口音"
  - 中文家长理性预期:0-12 月双语 = 双母语;6 岁后双语 = 高水平外语 + 口音

  ## 跟其他术语关系
  - **Critical Period**:perceptual narrowing 是关键期最常见证据
  - **Statistical Learning**:权重在 6-12 月收敛到母语
  - **Phoneme**:音素是被知觉重组的最小单位

key_facts:
  - 6-12 月调谐到母语
  - Kuhl 1992 R/L 经典实验
  - 双语家庭最佳窗口 0-12 月
  - 必须真人互动,录像 CD 无效
  - 不是丢失,是特化


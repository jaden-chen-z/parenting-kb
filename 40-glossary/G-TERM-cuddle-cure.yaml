glossary_id: G-TERM-cuddle-cure
type: term
display_name: 拥抱疗法 (cuddle cure)

full_name_en: The Cuddle Cure
full_name_zh: 拥抱疗法

one_liner: |
  Karp 把 5S 五招同时实施叫"拥抱疗法",是 5S 的"全功率版本"。
  对崩溃哭闹宝宝几分钟内见效——但前提是 5 招同步、力度足够、姿势正确。

detail: |
  ## 定义
  Karp 在 5S 之上提出的高阶组合方法:把 5 招同时实施(不是逐一试),形成 5S 的"全功率版本"。

  ## 实施步骤
  1. **先包裹好**(Swaddle):双臂裹在身体内,胸口能塞 2-3 指松紧
  2. **抱到肩侧位**(Side):宝宝接近水平贴妈妈胸口,一手撑头颈
  3. **同步开始**:嘘声 + 摇晃 + 给奶嘴/手指吸吮 — 三招同时
  4. **嘘声紧贴耳朵**:嘴在他耳边 5-10cm,音量 ≥ 哭声
  5. **摇晃小幅快速**:振幅 30-60cm,每秒 2-3 次,头与身体保持直线

  ## 见效后怎么撤
  - **不立刻撤** — 维持 1-2 分钟,免得反弹
  - **慢慢减弱** — 嘘声音量、摇晃速度同步降下来
  - **完全平静后** — 把宝宝平稳放回安全床(继续保持包裹+白噪音)

  ## 适用场景
  - **崩溃哭闹**(尖叫不止,5S 单招试过没用)
  - **腹绞痛发作**(每天 ≥3 小时哭闹)
  - **刚放下就醒**(包裹+白噪音 + 拥抱疗法过渡)

  不适合:
  - 一般小哭(力度过强)
  - 4 月以上(已经不需要这种"全功率")

  ## 失败模式
  - **一招一招试** → 每招都不到位,以为"5S 没用"
  - **见效就立刻撤** → 反射"余震"反弹
  - **温柔哄** → 力度不够,激活不了镇静反射

  ## 学术评价
  - **B 级**(5S 各招分开有 RCT,但拥抱疗法整体未独立验证)
  - Karp 临床观察:对最难安抚的宝宝几分钟内见效
  - AAP 不正式背书"拥抱疗法"这个名字,但认可底层 5S 技巧

key_facts:
  - 5S 的"全功率版本"
  - 5 招同时实施
  - 几分钟内见效
  - 见效后维持 1-2 分钟才撤
  - 适用崩溃哭闹和腹绞痛


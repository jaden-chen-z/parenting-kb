glossary_id: G-TERM-critical-period
type: term
display_name: 关键期 (critical period)

full_name_zh: 关键期 / 敏感期
full_name_en: Critical Period / Sensitive Period

one_liner: |
  发育心理学概念:大脑某种能力或行为模式在特定时间窗口最容易形成,错过后即使大量训练也达不到最高水平。
  鲍秀兰核心观点:0-3 岁(尤其 0-1 岁)是关键期最密集的阶段,早教窗口不可错过。

detail: |
  ## 定义
  神经科学和发育心理学概念:大脑某种神经回路(感觉 / 运动 / 语言 / 社交等)对特定刺激最敏感,且能力形成最有效的时间窗口。窗口期内合适刺激 → 能力高效形成;窗口期外即使大量训练 → 能力发展受限。

  对应英文术语:
  - **Critical period**(关键期):错过后**完全无法**或**极难**补回(强版本)
  - **Sensitive period**(敏感期):错过后能力受限但**仍可部分发展**(弱版本)
  现代神经科学倾向用 sensitive period(更准确),但中文家长教育语境多沿用"关键期"。

  ## 经典案例
  - **Hubel & Wiesel 1962 视觉关键期实验**(诺贝尔奖):把猫一只眼遮住 → 视觉皮层永久重组,即使后期摘除遮罩也无法恢复正常视觉
  - **野生孩童(Genie)案例 1970**:13 岁前社会隔离女孩,获救后接受语言训练数年,仍只能学单词,无法掌握语法
  - **国际收养孤儿研究**:< 6 月龄被收养,语言/认知接近正常;> 4 岁才收养,认知能力可能终身落后

  ## 已知关键期窗口(部分)

  | 能力 | 窗口期(估) |
  |---|---|
  | 视觉(深度感知) | 0-6 月 |
  | 双眼视觉 | 0-3 岁 |
  | 母语口语习得 | 0-7 岁(强) / 0-12 岁(弱) |
  | 第二语言(无口音) | 0-7 岁 |
  | 依恋形成(secure attachment) | 0-3 岁(尤其 6-18 月) |
  | 绝对音高(完美音准) | 3-6 岁 |

  ## 鲍秀兰立场
  - 关键期理论是 0-3 岁早教的**理论支撑**
  - "年龄越小,发展越快。在 3 岁以下,特别是 0-1 岁,婴儿的智能发展日新月异"
  - 操作建议:每月按月龄做训练(视听刺激 / 大动作 / 语言 / 社交),不能错过窗口
  - 错过 → 即使 6 月后再补,效率事倍功半

  ## 学术争议
  - 关键期 vs 敏感期:严格"关键期"(完全无法补回)只在视觉等少数领域被证实
  - 大部分认知/语言领域更接近"敏感期",可塑性比想象大
  - **过度推销关键期**也引发"早教焦虑"批评
  - 美国 AAP 立场:支持感官刺激,但反对"商业化早教焦虑"

  ## 对中国家长意义
  - 关键期 = 早教 ≠ 学知识。是建感官 + 神经连接,不是教识字数学
  - 早教不需要昂贵教具,**家长日常陪伴 + 适龄刺激**最有效
  - 错过不补 = 0-3 岁的陪伴质量决定终身潜能基线

key_facts:
  - 神经科学发育心理学概念
  - 视觉关键期 0-6 月(Hubel & Wiesel 实验)
  - 语言关键期 0-7 岁(Genie 案例)
  - 鲍秀兰把它推为中国早教理论核心
  - 现代术语更准确叫"敏感期"


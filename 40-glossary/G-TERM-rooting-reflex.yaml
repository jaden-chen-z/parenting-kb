glossary_id: G-TERM-rooting-reflex
type: term
display_name: 寻乳反射 (rooting reflex)

full_name_en: Rooting Reflex
full_name_zh: 寻乳反射 / 根寻反射

one_liner: |
  触碰宝宝脸颊时他会转头寻找乳头的本能反射(0-4 月)。
  Karp 警告:包裹时毯子边缘碰到脸颊会误启动这个反射 → 宝宝以为找到乳头但找不到 → 哭闹更甚。

detail: |
  ## 定义
  新生儿原始反射之一:触碰宝宝嘴角或脸颊时,他会转头朝触碰方向并张嘴吸吮。

  这是哺乳的关键先天能力,确保新生儿能找到妈妈乳头。

  ## 触发条件
  - 嘴角被触碰(乳头/手指/任何物体)
  - 脸颊被触碰(包裹的毯子边缘 / 妈妈胸口)
  - 鼻子下方被触碰

  ## 出现 / 消失时间
  - **出生即有**(健康新生儿全部有)
  - **3 月减弱**(自主寻乳逐渐取代)
  - **4-6 月完全消失**

  ## 临床用途
  - **哺乳建立**:护士教妈妈"用乳头扫宝宝嘴角触发寻乳"
  - **新生儿评估**:儿医检查必查,缺失提示神经损伤或低血糖

  ## 在 Karp 体系中的位置
  - **包裹的常见错误之一**(C-S1-015):
    - 毯子边缘碰到脸颊 → 误启动寻乳反射
    - 宝宝以为找到妈妈乳头 → 张嘴吸 → 找不到 → 困惑挫败 → 哭闹
  - **避免方法**:包裹要让毯子像"V 领羊毛衫"远离面颊
  - 这也是 Karp 提倡"父亲是包裹大师"的间接原因——爸爸力度足够,不容易碰到脸

  ## 实操注意
  - 包裹时毯子边缘距离嘴和脸颊至少 5-10cm
  - 见到宝宝在包裹中"歪头扭嘴"找东西吸 → 检查毯子位置
  - 喂奶时主动用乳头扫嘴角触发寻乳(让吸吮更顺)
  - 拒绝乳头时不要硬塞,先扫嘴角等他自动张嘴

  ## 与其他原始反射
  - **Moro 反射(惊跳)** — 失去支撑或大声触发,4-6 月消失
  - **palmar grasp(掌握)** — 手心被触摸时握紧
  - **sucking(吸吮)反射** — 任何东西放进嘴里都会吸,与 rooting 配套
  - **rooting** — 4-6 月消失

  rooting + sucking 是哺乳的双重保险:rooting 找到乳头,sucking 吸出来。

key_facts:
  - 0-4 月原始反射
  - 触脸激活
  - 哺乳的先天保险机制
  - 包裹时要让毯子远离脸颊
  - 4-6 月消失


glossary_id: G-TERM-air-bath
type: term
display_name: 室外空气浴(日式锻炼)

full_name_zh: 室外空气浴 / 户外空气浴
full_name_ja: 外気浴(がいきよく, gaiki yoku)
full_name_en: "Outdoor air bath / cold air exposure (Japanese tradition)"

one_liner: |
  日本传统育儿核心动作 — 婴儿每天接触室外冷空气 30 分钟,锻炼皮肤温度调节 + 免疫,松田全书反复推荐。

detail: |
  ## 概念定义

  日本传统育儿动作: 让婴儿每天接触一定时间的室外空气(尤其是稍冷的空气),
  锻炼皮肤的温度调节能力 + 增强免疫力。

  跟"日光浴"是配套但优先级更高 — 1-2 月婴儿不能日光浴(紫外线太强),
  但可以做室外空气浴。

  ## 松田立场(《育儿百科》§99 + §47 + §82 + §297 等多次提)

  1. **以前自然形成** — 日式榻榻米房换尿布时衣服打开,自然接触冷空气;
  2. **现代有暖气这刺激消失** — 必须主动出门;
  3. 即使严寒只要风不大,每天 1 次出门;
  4. 背阴处 18-20°C 即可,起步 2-3 分钟;
  5. **每天总计 30 分钟以上**;
  6. 有日照戴帽子防直射;
  7. 不去人多地点 / 儿童公园(避免球碰);
  8. 1-2 月起就要开始;
  9. 跟"婴儿体操"配套使用。

  ## 跟"室内空气浴"区别

  - **室外空气浴**:抱出门 / 阳台,接触自然空气
  - **室内空气浴**:换尿布时全身露出几分钟,接触室内冷空气(有暖气时较弱)

  ## 跟其他派别对照

  | 派别 | 对待户外暴露 |
  |---|---|
  | 松田(日) | 30 分钟/天必须 — 即使严寒 |
  | 鲍秀兰(中) | 阳光浴推荐 |
  | AAP(美) | 推荐 outdoor exposure 但更多关注防晒 / SIDS |
  | RIE / 蒙氏 | 也推 outdoor 但不像松田这么硬规则 |

  ## 中国家长直接相关

  现代中国家长普遍 "PM2.5 不出门 / 太冷不出门 / 太热不出门" → 一年闷家。
  松田立场: 18-20°C + 风不大就行 — 几乎全年都可以。

  几个高频反对意见 + 松田回答:
  - "太冷怕感冒" → 寒冷季节风不大也行,逐渐增加时间
  - "太热怕中暑" → 早晨 / 傍晚出门,炎热季节避开正午
  - "PM2.5" → 选空气好的天 / 公园 / 半山
  - "孩子免疫差怕病" → 室外空气浴反而锻炼免疫(松田立场)

  ## 现代验证

  现代研究支持:
  - 婴儿户外暴露能增强免疫
  - 维 D 合成需要日照
  - 户外空间能减少近视风险(后期)
  - 户外活动能改善睡眠节律

  ## 在本知识库中

  - SRC-023 (松田 fallback) + SRC-024 (松田并行) 双卷反复提
  - 跟"婴儿体操" + "散步"是 3 合 1

key_facts:
  - 日本传统育儿核心动作
  - 1-2 月起每天 30 分钟以上
  - 严寒只要风不大也要出门
  - 跟婴儿体操 + 散步 3 合 1


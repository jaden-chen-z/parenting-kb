glossary_id: G-TERM-internal-working-model
type: term
display_name: 内部工作模型 (Internal Working Model)

full_name_en: Internal Working Model (IWM)
full_name_zh: 内部工作模型 / 内在工作模式

one_liner: |
  Bowlby 概念:婴儿在头 3 年通过反复跟父母互动,在脑中建一份**关于"我是谁 / 别人会怎么对我 / 关系长什么样"的内部地图**。
  这份地图决定 TA 一辈子怎么处理亲密关系、自尊、信任。

detail: |
  ## 定义
  Bowlby (1973, Vol 2) 提出:婴儿在 0-3 岁通过反复的依恋互动,在心里**构建一组心智表征**(mental representation),内容包括:
  - **关于自己的工作模型**:我值不值得被爱? 我有没有能力得到帮助?
  - **关于他人的工作模型**:别人是不是可信? 求助会不会被回应?
  - **关于关系的工作模型**:亲密是安全还是危险?

  这份"模型"会指导 TA 之后:
  - 如何选择伴侣 / 朋友
  - 如何对待自己的孩子(代际传递!)
  - 如何处理冲突 / 分离 / 丧失
  - 自尊水平、信任他人能力

  ## 为什么叫"工作"模型?
  - **可工作**:不是死板的记忆,是动态预测系统(像计算机模型一样运算)
  - **可更新**:童年经历是初始设定,但后续经历(治疗、新关系)能修改
  - **多版本**:不同关系可能有不同模型(对妈妈一个,对爸爸另一个)

  ## 与 4 类依恋的对应

  ### B 安全型 → 健康工作模型
  - "我值得被爱"
  - "求助有人帮"
  - "亲密是安全的"
  - 长大:稳定亲密关系 / 能信任 / 高自尊

  ### A 回避型 → 防御性工作模型
  - "求助没用,自己来"
  - "情感是危险的,关闭它"
  - 长大:回避亲密 / 高度独立 / 表面"无所谓"

  ### C 抗拒型 → 焦虑性工作模型
  - "我必须夸张才能被注意"
  - "亲密很重要但不可靠"
  - 长大:焦虑型依恋 / 黏人 / 怕被抛弃

  ### D 混乱型 → 创伤性工作模型
  - "亲密的人既是安全又是危险"(因为是施虐者)
  - 长大:边缘人格 / 解离 / 重复创伤循环

  ## 实证支持
  - **Mary Main AAI 实验 (1985)**:成人讲童年依恋经历的方式,可预测自己孩子的依恋类型(代际传递率 ~75%)
  - **5 岁人格测量**:12 月分类的 B 型儿童 5 岁时自我复原力 / 同理心都更强(Sroufe 1979 + Arend et al. 1979)
  - **神经科学验证**(2010s):童年依恋影响成年大脑前额叶 / 杏仁核结构

  ## 实践含义
  - **3 岁前每次回应都在写代码** — 不是"宠坏",是构建模型
  - **代际传递可以打破**(治疗 / 觉察 / 新关系都能改变模型)
  - **内部工作模型 = "你脑中的依恋对象录音"**:成年后亲密关系遇困难时,会自动播放童年录音

  ## 中文家长视角
  这个概念很重要,但容易被误读为"3 岁定一生"。Bowlby 自己强调:
  - 工作模型 **会更新**,只是越大越难改
  - 严重虐待 + 无救助 才会留下不可逆创伤
  - **普通的"不够完美"不会毁孩子**;关键是基本敏感回应有

  ## 历史
  - 1973 Bowlby 第二卷《分离》正式提出概念
  - 1985 Main 用 AAI 量化成人版
  - 2000s 神经科学验证(fMRI / 应激激素研究)
  - 当代依恋治疗(EFT / Mentalization-based therapy)的理论基础

key_facts:
  - Bowlby 1973 提出
  - 0-3 岁形成心智表征,影响终身亲密关系
  - 含 3 部分:对自己 / 对他人 / 对关系的预期
  - 4 类依恋对应 4 种工作模型
  - 可更新但越大越难改
  - 代际传递率 ~75%(AAI 研究)


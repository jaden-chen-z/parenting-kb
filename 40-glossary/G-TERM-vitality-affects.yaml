glossary_id: G-TERM-vitality-affects
type: term
display_name: 活力情感 (vitality affects)

full_name_zh: 活力情感 / 生命情感
full_name_en: Vitality Affects

one_liner: |
  Stern 独家命名 — categorical affects(喜怒哀乐)之外的"动态质地"内心体验。
  用动力学词描述:澎湃 / 渐弱 / 闪过 / 爆发 / 渐强 / 喷薄 / 拉长。**伴随所有生命过程,每时每刻都在**,是宝宝最早体验的内心,也是 attunement 的主要燃料。

detail: |
  ## 定义
  Vitality affects(活力情感)= 用**动力学词**描述的"内心质地" — 跟分类情感(喜怒哀乐)互补。
  - 不是"情感"(分类) — 是"感觉的形状"
  - 伴随所有生命过程(呼吸 / 饿 / 排便 / 入睡 / 醒来)
  - 不需要"事件"也存在
  - 比 categorical affects 更基础 + 更普遍

  ## 8 个典型词
  - **澎湃**(surging)
  - **渐弱**(fading away)
  - **闪过**(fleeting)
  - **爆发**(explosive)
  - **渐强**(crescendo)
  - **渐弱**(decrescendo)
  - **喷薄**(bursting)
  - **拉长**(drawn out)
  这些都是 vitality affects — 用"动态"才能描述。

  ## 跟 categorical affects 区别
  | Vitality affects | Categorical affects |
  |---|---|
  | 没标准词 | 有词(喜怒哀乐惧爱) |
  | 永远在 | 间断出现(每 30-90 秒一次) |
  | 描述"如何" | 描述"什么" |
  | 跨感官 | 单一情感 |
  | 0-2 月即在 | 2 月+ 逐渐分化 |

  ## 哲学根源
  - Suzanne Langer 1967《Mind: An Essay on Human Feeling》提出"forms of feeling"
  - Stern 1985 引入婴儿心理学并命名 vitality affects
  - 跟 William James 的"stream of consciousness"概念呼应

  ## 婴儿期重要性
  - **0-2 月即能感受**(emergent self 的素材)
  - **跟生命过程**(呼吸 / 饿 / 入睡)绑定
  - **是 attunement 的主要燃料** — 父母主要 attune vitality 不是 categorical
  - 没分类情感时(玩耍中绝大多数时间),vitality affects 仍在场

  ## 在 attunement 中的角色
  - Categorical affects 间断 — 不能持续 attunement 的基础
  - **Vitality affects 是连续的** — 让 attunement 几乎不间断
  - Stern 实验 — 1 次 attunement / 65 秒,主要在 vitality 层
  - 这就是为什么 attunement 看起来像"连续共在"

  ## 大人也有
  - 听音乐时的"渐强渐弱"= vitality affects
  - 看舞蹈时的"流动 / 静止"= vitality affects
  - 看抽象画时的"澎湃 / 平静"= vitality affects
  - 是艺术 / 音乐 / 诗歌能跨语言"打动人"的根源

  ## 临床意义
  - 童年缺 attunement → 成人后失去 vitality affects 感知
  - 抑郁 / 强迫 / 焦虑常伴随 vitality affects 钝化
  - 心理治疗 / 艺术治疗 / 舞动治疗 = 重建 vitality affects 感知

  ## 中国家长应用
  - 别只问"宝宝高兴不高兴"
  - 观察"宝宝现在 vibe 是澎湃还是消退"
  - 用动态词描述宝宝("他正在 surge")
  - 你的回应匹配 vibe(C-S5-291)

key_facts:
  - Stern 独家命名(基于 Langer 1967)
  - 描述"内心质地"的动力学词
  - 伴随所有生命过程,永远在场
  - 是 attunement 的主要燃料
  - 跟艺术 / 音乐 / 诗歌相通


glossary_id: G-TERM-wonder-week
type: term
display_name: 大脑跃迁周 (wonder week)

full_name_en: Wonder Week
full_name_zh: 大脑跃迁周(神奇周)

one_liner: |
  van de Rijt + Plooij 提出:0-20 月婴儿有 10 个可预测的大脑跃迁周(5/8/12/19/26/37/46/55/64/75 周),每个跃迁前 1-3 周必出现 fussy phase。

detail: |
  ## 定义
  Wonder Week 指婴儿大脑出现快速、剧烈重组的特定周龄,跃迁完成后宝宝立刻具备一组新的认知能力(感觉/模式/事件/关系/分类等)。

  ## 10 个跃迁时间表(从预产期算起)
  | 跃迁 # | 周龄 | 新世界 |
  |---|---|---|
  | 1 | 5 周 | Sensations(感觉) |
  | 2 | 8 周 | Patterns(模式) |
  | 3 | 12 周 | Smooth Transitions(平滑过渡) |
  | 4 | 19 周 | Events(事件) |
  | 5 | 26 周 | Relationships(关系) |
  | 6 | 37 周 | Categories(分类) |
  | 7 | 46 周 | Sequences(序列) |
  | 8 | 55 周 | Programs(程序) |
  | 9 | 64 周 | Principles(原则) |
  | 10 | 75 周 | Systems(系统) |

  ## 跃迁的三步过程
  1. **fussy phase 启动**(跃迁前 1-3 周):宝宝 3 C 信号(哭/黏/烦)突然出现
  2. **大脑重组**:神经元新连接,旧稳态被打破
  3. **新能力上线**:跃迁周后宝宝突然会做之前不会的事

  ## 与 Brazelton 触摸点的关系
  - 概念邻近但不完全相同
  - Brazelton:0-3 岁 13 个触点,临床观察驱动
  - Wonder Weeks:0-20 月 10 个跃迁,自然观察 + 录像 + 神经科学验证驱动
  - Brazelton 在 Wonder Weeks 英文版序中直接背书:"独立得出相同结论"

  ## 神经科学验证
  10 个跃迁中 6 个有独立 EEG / 脑电活动研究证实:
  - 8 周:大脑感知简单模式能力出现
  - 19 周:事件感知能力出现
  - 26 周:关系感知能力出现
  - 其他几个跃迁的物理证据仍在累积

  ## 临床应用
  - 父母提前知道时间表 → 不再把跃迁前 fussy phase 误判为病
  - 减少不必要医院就诊和断奶决策
  - 给"宝宝突然倒退"提供可预测框架

  ## 早产 / 晚产校正
  - 时间从**受孕日**算起,而非出生日
  - 早产 4 周 → 跃迁推后 4 周
  - 晚产 2 周 → 跃迁提前 2 周

key_facts:
  - 0-20 月 10 个可预测跃迁(5/8/12/19/26/37/46/55/64/75 周)
  - 每跃迁前 1-3 周 fussy phase(3 C 信号)
  - 6/10 有独立 EEG 验证
  - 跨文化验证(荷兰 / 西班牙 / 瑞典 / 美国)
  - 早产宝宝按预产期校正


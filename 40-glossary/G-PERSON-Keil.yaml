detail: |
  ## 个人背景
  - 宾夕法尼亚大学博士
  - 耶鲁大学心理学教授
  - 美国国家科学院院士

  ## 核心研究:直觉理论(Intuitive Theories)
  - 朴素物理 / 朴素心理 / 朴素生物 — 3 大领域并行
  - 各域独立发展,有自己时间表
  - "智力"不是单一指标

  ## 立场
  - 反单一智力测试评估
  - 跟 Carey 概念革命派同方向
  - 部分先天 + 部分文化派


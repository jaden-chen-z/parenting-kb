glossary_id: G-TERM-mental-leap
type: term
display_name: 心智跃迁 (mental leap)

full_name_en: Mental Leap
full_name_zh: 心智跃迁(big change)

one_liner: |
  Wonder Weeks 中的核心机制:婴儿神经系统在跃迁周发生快速、剧烈的物理重组,带来全新感知能力,在父母眼中表现为"宝宝突然变了一个人"。

detail: |
  ## 定义
  Mental leap 指婴儿大脑在 Wonder Week 时刻发生的快速重组,英文原书也称"big change"。每次跃迁带来一种新的"感知方式",彻底改变宝宝看世界的方式。

  ## 跃迁的认知机制
  跃迁不是渐进改变,而是**质的飞跃**:
  - 跃迁前:宝宝完全不能理解某类信息(如 8 周前不能感知模式)
  - 跃迁后:同类信息变得可处理(突然对栏杆条纹 / 罐头排列着迷)

  ## 跃迁带来什么
  每次跃迁同时影响:
  1. **感知**(perception)— 看 / 听 / 触 / 体感的解析层级
  2. **运动控制**(motor control)— 因感知精度提升,身体控制也精进
  3. **情绪 / 社交反应**(emotional / social)— 跟新感知到的人事互动
  4. **学习能力**(learning capacity)— 跃迁后学新技能速度倍增

  ## 跃迁前的反向表现
  跃迁开始后宝宝先经历"行为崩盘":
  - 旧的稳态被打破(吃睡乱、易哭闹)
  - 这是大脑物理重组的外在表现
  - **不是退步,是必经过程**

  ## 跃迁不等于躯体生长冲
  - Growth spurt(躯体生长冲):宝宝某夜突然长高 6 mm
  - Mental leap:大脑结构变化,与躯体生长独立
  - 两者偶尔同步,但本质不同

  ## 跃迁不等于"里程碑"
  - 里程碑(如出第一颗牙、第一次翻身)是可见的成就
  - 跃迁是底层认知能力升级,里程碑是跃迁产出的副产品之一

  ## 临床应用
  - 父母理解:fussy phase 不是疾病,是必经的"重组阵痛"
  - 试图"训练消除" fussy phase 是徒劳的(大脑物理重组不是行为习惯)
  - 给宝宝充足的 cuddle / 物理接触 / 不强求规律 = 帮跃迁顺利完成

key_facts:
  - 大脑在跃迁周发生快速物理重组
  - 与 growth spurt(躯体生长冲)独立
  - 表现 = "宝宝突然变了一个人"
  - fussy phase 是跃迁的外在表现,不是病
  - 试图训练消除是徒劳的


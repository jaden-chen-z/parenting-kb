<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>收藏夹</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0; background: #ece5d4; height: 100%;
    overflow: hidden; overscroll-behavior: none;
  }
  body { -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  a { -webkit-tap-highlight-color: transparent; }
  /* 手机端：限制内容最大宽度居中 */
  #root { max-width: 460px; margin: 0 auto; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<script src="auth.js?v=5"></script>
<script>
  // 登录守卫:未登录跳 Login.html
  PKB.auth.requireLogin();
  // 在 cards.jsx 加载前注入 ?favorites=1,让 CardStack 进入收藏模式
  if (!new URLSearchParams(location.search).has('favorites')) {
    history.replaceState(null, '', location.pathname + '?favorites=1');
  }
</script>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="cards.js?v=27"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));</script></body>
</html>

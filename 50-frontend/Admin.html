<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>管理员 · Jaden 的育儿知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(140% 90% at 50% -10%, #f6f1e6 0%, #ece5d4 55%, #ddd2bb 100%);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: ui-sans-serif, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
    color: #2a2926;
    -webkit-font-smoothing: antialiased;
  }
  body { height: 100vh; height: 100dvh; }
  *, *::before, *::after { box-sizing: border-box; }

  .page {
    max-width: 520px; margin: 0 auto;
    height: 100%;
    padding: 32px 24px 24px;
    display: flex; flex-direction: column;
    gap: 22px;
    overflow: hidden;
  }

  /* 顶部条 */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .brand .title {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', Georgia, serif;
    font-size: 22px; font-weight: 600; line-height: 1.25;
  }
  .brand .accent { color: #7A2A2A; }
  .brand .sub {
    margin-top: 4px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; letter-spacing: 0.22em;
    color: rgba(42,41,38,0.45); text-transform: uppercase;
  }
  .logout {
    all: unset; cursor: pointer;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.16em;
    color: #7A2A2A;
  }

  /* 卡片容器 */
  .card {
    flex: 1; min-height: 0;
    background: rgba(255,255,255,0.32);
    border: 0.5px solid rgba(60,40,20,0.14);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(60,40,20,0.10), 0 1px 0 rgba(255,255,255,0.55) inset;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .card-head {
    flex-shrink: 0;
    padding: 16px 18px 12px;
    border-bottom: 1px dashed rgba(60,40,20,0.16);
    display: flex; align-items: center; justify-content: space-between;
  }
  .head-left {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px; font-weight: 600;
    color: #2a2926;
  }
  .head-left .count {
    margin-left: 8px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12px; letter-spacing: 0.12em;
    color: rgba(60,40,20,0.5);
  }
  .add {
    all: unset; cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: #7A2A2A;
    padding: 4px 10px;
    border: 1px solid rgba(122,42,42,0.35);
    border-radius: 6px;
    transition: background 200ms;
  }
  .add:hover:not([disabled]) { background: rgba(122,42,42,0.08); }
  .add[disabled] { opacity: 0.5; cursor: default; }

  /* 单行 */
  .card { overflow-y: auto; }
  .row {
    padding: 12px 18px;
    display: grid;
    grid-template-columns: 32px 1fr auto 28px;
    align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(60,40,20,0.07);
    flex-shrink: 0;
  }
  .row:last-of-type { border-bottom: none; }
  .row.err {
    grid-template-columns: 1fr;
    color: #7A2A2A;
    font-size: 13px; font-family: 'Noto Serif SC', serif;
  }
  .row.empty {
    grid-template-columns: 1fr;
    color: rgba(60,40,20,0.5);
    font-size: 13px; font-family: 'Noto Serif SC', serif;
    text-align: center; padding: 28px 18px;
  }
  .idx {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px; font-style: italic;
    color: rgba(60,40,20,0.55);
  }
  .info { min-width: 0; overflow: hidden; }
  .email {
    font-family: 'Noto Serif SC', serif;
    font-size: 14.5px; color: #2a2926;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name {
    margin-top: 2px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: rgba(60,40,20,0.5);
  }
  .seen {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px; color: #4a2d20;
    white-space: nowrap;
  }
  .seen small { font-size: 10px; opacity: 0.55; margin-left: 2px; letter-spacing: 0.06em; }
  .seen .dim { color: rgba(60,40,20,0.35); font-size: 13px; }
  .del {
    all: unset; cursor: pointer;
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(122,42,42,0.55);
    border-radius: 4px;
    transition: all 200ms;
  }
  .del:hover:not([disabled]) {
    background: rgba(122,42,42,0.10);
    color: #7A2A2A;
  }
  .del[disabled] { opacity: 0.3; cursor: default; }

  .flash {
    margin: 12px 18px 0;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Noto Serif SC', serif;
    font-size: 12.5px; line-height: 1.5;
  }
  .flash.ok { background: rgba(80,140,80,0.10); color: #335a33; }
  .flash.err { background: rgba(122,42,42,0.10); color: #7A2A2A; }

  .footer-note {
    flex-shrink: 0;
    padding: 14px 18px 16px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 9.5px; line-height: 1.55; letter-spacing: 0.04em;
    color: rgba(60,40,20,0.42);
    border-top: 1px dashed rgba(60,40,20,0.12);
  }
</style>
</head>
<body>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</html>

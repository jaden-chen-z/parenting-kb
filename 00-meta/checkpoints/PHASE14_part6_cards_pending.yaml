---
card_id: C-S4-2247
stages: [S4]
tags: [safety, red_flag]

front:
  title: 鼻血 + 鼻腔异物:别仰头
  hook: 仰头会咽血致呕

back:
  why_matters: |
    宝宝爬 / 探物期会塞东西到鼻子 / 撞鼻流血。海蒂常见错误:
    **流鼻血时仰头** → 血流入咽部 → 呕吐 + 误吸。正确是**身体直立 + 略前倾 + 捏鼻 10 分钟**。
    **鼻腔异物**绝不能用棉签 / 针挑(更深入或弄伤),只能让宝宝模仿吹气或就医。
    频繁鼻血(即使易止)也要告诉医生,可能是出血障碍信号。
  what_to_do:
    - 流鼻血:身体**直立 + 略前倾**,**捏两侧鼻 10 分钟**(让其嘴呼吸)
    - 仍不止 → 再 10 分钟;仍流 → 医生(打电话时保持直立)
    - **鼻腔异物**:让宝宝平静嘴呼吸,**不深探不挑**
    - 教宝宝模仿你的鼻吹气;不出 → 急诊
    - 鼻被打:直立前倾防咽血 + 冰敷消肿,医生检查骨折
  failure_mode: |
    仰头止鼻血 → 血咽下 → 呕吐 + 误吸。
    棉签/镊子取鼻内异物 → 推得更深或穿破鼻黏膜。
    频繁鼻血不告诉医生 → 错过出血性疾病诊断。
    打鼻后不冰敷不查 → 漏诊鼻骨折致歪鼻。
  evidence_level: A

glossary_refs:
  - G-ABBR-AAP


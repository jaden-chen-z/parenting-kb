card_id: C-S3-2349
stages: [S3]
tags: [safety, red_flag]

front:
  title: RSV 红旗:皮肤变蓝立刻急诊
  hook: 1 岁前 2/3 都中,大多轻

back:
  why_matters: |
    呼吸道合胞病毒(RSV)= 婴幼儿下呼吸道感染头号杀手,**1 岁前约 2/3 婴儿感染**。
    高发期 4-10 月。**大多轻微像感冒**,但早产 / 先天肺病 / 不母乳 / 二手烟 / 多胎宝宝
    可能恶化为支气管炎需住院。
    红线症状:**呼吸急促 + 鼻翼煽动 + 肋骨间皮肤凹陷 + 嘴周/指甲发蓝(青紫)**
    → 立刻急诊。轻微 RSV 居家 3-5 天好转。
  what_to_do:
    - 出现**任何"用力呼吸"信号**(鼻翼煽 / 凹胸 / 喘鸣)→ 立刻送医
    - **嘴周或指甲变蓝**(青紫病)→ 拨 120
    - 烧 > 4-5 天不退 / 已退烧又升 → 通知医生
    - 居家:多液体 / 加湿器 / 鼻吸器
    - 高风险宝宝(早产/先天肺病):4-10 月期月打帕利株单抗预防
  failure_mode: |
    "看着像感冒就当感冒处理" → 错过支气管炎住院窗口。
    给抗生素治 RSV → 病毒病无效。
    家中吸烟 → 二手烟使 RSV 病情翻倍恶化。
    高风险宝宝去人多商场 → 极易染上重型 RSV。
  evidence_level: A

glossary_refs:
  - G-ABBR-AAP
  - G-ABBR-RSV


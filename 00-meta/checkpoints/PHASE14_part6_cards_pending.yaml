card_id: C-S5-2247
stages: [S5]
tags: [safety, red_flag]

front:
  title: 流感疫苗:6 月+ 起每年打
  hook: 宝宝住院率最高人群之一

back:
  why_matters: |
    流感不是"重感冒" — 6-23 月婴幼儿感染流感**通常需要住院**(婴幼儿 + 老人是住院最高人群)。
    海蒂规定:**6 月+ 每年 10 月起打流感疫苗**,首年要**打 2 针间隔 1 个月**。
    保护从第 2 周开始,持 1 年。**6 月内宝宝**没有疫苗可打,只能靠**全家打 + 勤洗手**保护。
    家长意义:孕期 + 全家打流感疫苗是给婴儿的"被动免疫罩"。
  what_to_do:
    - 6 月+ 每年 10 月接种(美 11 月-次年 4 月流感季)
    - 首年 2 剂间隔 ≥ 1 月,以后每年 1 剂
    - **孕期妈妈打** → 抗体经胎盘传给婴儿,保护出生后 6 月
    - 全家(爷爷奶奶 / 兄姐 / 看护)都打 → 包围式保护
    - 婴儿期勤洗手 + 避开流感季的人多场所
  failure_mode: |
    "宝宝没事不用打" — 6-23 月婴儿流感住院率高。
    "去年打了今年不用" — 流感病毒每年变异,必须每年打。
    家人不打 → 把流感带回家给婴儿(婴儿 6 月内无防护)。
    给 6 月内宝宝打流感疫苗 → 不可,只能靠间接保护。
  evidence_level: A

glossary_refs:
  - G-ABBR-AAP


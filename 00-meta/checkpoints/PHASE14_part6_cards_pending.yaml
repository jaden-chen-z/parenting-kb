card_id: C-S5-2245
stages: [S5]
tags: [safety, red_flag]

front:
  title: 出血止血:压 15 分 + 高过心脏
  hook: 不用止血带,弊大于利

back:
  why_matters: |
    伤口出血是高频伤。海蒂铁律:
    **直接按压 15 分钟 + 受伤部位高过心脏**;**不用止血带**(风险大于收益,可能致截肢)。
    深伤 / 30 分内不止 / 脸部 > 1.3 cm → 急诊缝合或外科黏合剂。
    破伤风:**任何皮肤创伤**都核查疫苗时间,过期补针;
    红肿热痛流脓出现 → 感染信号 → 通知医生。
  what_to_do:
    - **干净纱布 / 尿布用力按 15 分钟**,**伤口高过心脏**
    - 仍流 → 加垫不挪走**继续按**,送医或叫救护
    - **不用止血带**(无医嘱)
    - 30 分不止 / 深伤 / 脸 > 1.3 cm → 急诊
    - 破伤风疫苗到期检查 + 感染信号(红/热/肿/脓)→ 找医生
  failure_mode: |
    不停揭开看是否止血 → 凝血块脱落 → 重新流。
    用碘酒 / 防腐剂深抹伤口 → 海蒂禁(无医嘱),刺激组织。
    自打止血带过紧或忘记定期松 → 远端缺血坏死。
    狗咬人 / 动物咬不告诉医生 → 漏狂犬疫苗。
  evidence_level: A

glossary_refs:
  - G-ABBR-AAP


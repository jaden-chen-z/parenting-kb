F1:
  issue: 大动作发展该不该训练 · 学步车 / Bumbo / 撑坐 / 训练表是否有用
  cards:
    - C-S1-894
    - C-S2-832
    - C-S2-834
    - C-S2-835
    - C-S4-834
    - C-S4-835
    - C-S4-836
    - C-S4-837
    - C-S4-838
    - C-S4-839
    - C-S4-840
    - C-S5-933
    - C-S5-934
    - C-S5-935
    - C-S5-936
    - C-S5-937
    - C-S7-891
    - C-S7-892
  views:
    - school: Pikler
      source: SRC-026
      stance: 完全反对训练 — 自然顺序 + 安全空间 + 时间 = 大动作全部自动发生;严反一切撑物(学步车 / Bumbo / 跳跳器 / 婴儿座椅)。
    - school: Magda Gerber / RIE / Lansbury
      source: SRC-022/019
      stance: 继承 Pikler 立场 — 里程碑不是赛跑,不撑坐 8 理由,7 类婴儿设备先放下。
    - school: 蒙氏(Davies/Lillard)
      source: SRC-014/016
      stance: 立场一致 — floor bed + 自由动作空间 + 反早期撑坐。
    - school: AAP
      source: SRC-002
      stance: 反学步车(Policy Statement + 数百起伤亡报道);加拿大 2004 立法全球首例禁售。
    - school: Brazelton
      source: SRC-010
      stance: 反学步车,跟 Pikler 立场一致;主张孩子自然探索大动作。
    - school: 松田道雄
      source: SRC-024
      stance: 温和支持自然 — 不催孩子翻 / 坐 / 爬 / 走的时间表,部分跟 Pikler 共鸣。
    - school: 鲍秀兰
      source: SRC-009
      stance: 支持训练 — 婴儿体操 / 抓握训练 / 撑坐;跟 Pikler 派 8 派立场严重对立。
    - school: 中国主流
      source: ""
      stance: '"4 月翻 / 6 月坐 / 9 月爬 / 12 月走" 训练表 + 80% 家庭曾用学步车。跟 Pikler 派全面对立。'

F3:
  issue: 醒着时该不该让宝宝俯卧"练颈肌"(Tummy Time)
  cards:
    - C-S1-409
    - C-S1-054
    - C-S2-003
    - C-S3-194
    - C-S2-834       # A21 Pikler 反 Tummy Time
    - C-S4-838       # A21 Pikler 反 Tummy Time
    - C-S1-2502      # A21 海蒂偏头干预
    - C-S4-194       # A21 Lillard 蒙氏立场
  views:
    - school: AAP
      source: SRC-002
      stance: 推 Tummy Time — 防 SIDS 后颈肌发育 + 防扁头综合征(2026 现行立场,Back to Sleep 1994 后配套)。
    - school: Pikler
      source: SRC-026
      stance: 反 Tummy Time — 仰卧位最佳,俯卧不利自然翻身。1969 立场(那时 Tummy Time 概念尚未出现)。
    - school: Magda Gerber / Lansbury
      source: SRC-022/019
      stance: 继承 Pikler — 永远仰卧不俯卧;给地板时间让婴儿自由探索。
    - school: 海蒂
      source: SRC-040
      stance: 每天清醒至少 30 分钟分多次累计(对齐 AAP)— 主流大众派背书 Tummy Time + 防扁头。
    - school: 蒙氏(Davies/Lillard)
      source: SRC-014/016
      stance: 平面活动 OK,但反对"训练"方式;给地板时间让婴儿自由探索俯卧。
    - school: 折中建议
      source: ""
      stance: 不强迫 Tummy Time,但给地板时间允许婴儿自己俯卧探索;若选 AAP 派则醒着每天几次,每次几分钟。

# ──────────────────────────────────────────────────────────
# K 节:Phase 13 WHO + UNICEF Infant and Young Child Feeding(SRC-031)国际公卫立场
# 7 项立场对照,中国家长高频实操议题
# ──────────────────────────────────────────────────────────

K1:
  issue: 辅食(CF)何时引入 — 6 月 EBF 还是 4-6 月看 readiness
  cards:
    - C-S3-1042
    - C-S3-1043
    - C-S3-1044
    - C-S4-1045
  views:
    - school: WHO / UNICEF
      source: SRC-031
      stance: 6 月起辅食(不早不晚)— EBF 0-6 月明确操作定义(连水都不给,例外 ORS / 维生素 / 药物)。
    - school: AAP
      source: SRC-006
      stance: 4-6 月,看 readiness 信号(头控 / 伸手抓 / 能从勺到喉)+ LEAP 早引入立场。
    - school: 鲍秀兰
      source: SRC-009
      stance: 6 月起辅食,跟 WHO 一致;反对 4 月前给水或辅食。
    - school: 松田道雄
      source: SRC-024
      stance: 5-6 月起,有弹性;不等到严格 6 月,但也反对 4 月前提前。
    - school: 中国家长共识
      source: ""
      stance: 默认 6 月起,4 月前坚决不给(4 派立场一致,中国家长普遍接受)。

K2:
  issue: 持续母乳时长 — WHO 2 年 vs AAP/鲍/松田 1 年可断
  cards:
    - C-S6-1064
    - C-S6-1065
    - C-S7-1099
    - C-S7-1100
  views:
    - school: WHO / UNICEF
      source: SRC-031
      stance: ≥ 2 岁 'or beyond' — 12-24m 母乳仍提供 33% 营养;Detwyler 2004 自然离乳 2.5-7 岁支持。
    - school: AAP
      source: SRC-006
      stance: 1 岁可断(也可继续不强求);1 岁后母乳不再是营养必需,以家庭决定为主。
    - school: 鲍秀兰
      source: SRC-009
      stance: 1 岁可断;跟中国本土实操更一致,无明确反对延长喂。
    - school: 松田道雄
      source: SRC-024
      stance: 弹性立场 / 妈妈决定;不强求时间表。
    - school: 中国家长压力
      source: ""
      stance: 1 岁后哺乳常被亲戚说"丢人"或"没营养";WHO 国际共识可作为反传统压力的依据。

K3:
  issue: 婴儿生长曲线基线 — WHO 2006 母乳 vs CDC 2000 配方
  cards:
    - C-S4-1052
  views:
    - school: WHO Growth Standards 2006
      source: SRC-031
      stance: 6 国 MGRS 母乳样本(prescriptive — 'should grow like this');反映理想生长。
    - school: CDC 2000 / AAP
      source: SRC-002/006
      stance: 美国数据,以配方喂养为主(descriptive — '实际长成什么样');反映平均现况。
    - school: 中国实操
      source: ""
      stance: 卫健委 2018 起逐步采用 WHO,但部分医院仍用 CDC 老图 → 母乳娃在 CDC 图常 P25,被误判加奶粉,母乳量降。

K4:
  issue: 奶粉营销规则 — WHO Code 1981 vs 中国实际营销
  cards:
    - C-S1-1009
    - C-S6-1070
  views:
    - school: WHO Code 1981
      source: SRC-031
      stance: 全面禁止 4 大利益方营销(妈妈 / 医生 / 医院 / 标签);IBFAN / NetCode 持续监测违规。
    - school: 中国法规
      source: ""
      stance: 《婴幼儿配方乳粉广告法》仅部分对接 — 主要禁 0-6 月配方奶广告,6 月+ 跟随奶 / 增长奶营销宽松。
    - school: 中国奶粉品牌实操
      source: ""
      stance: 产院送试用装 / 母婴店推销 / 直播带货 / 1-2-3-4 段分阶 / KOL 软广 — 多数违反 WHO Code。

K5:
  issue: 0-4 周新生儿能否用奶嘴 — BFHI 严 vs Karp/AAP 宽
  cards:
    - C-S1-1006
    - C-S1-1018
  views:
    - school: BFHI / WHO
      source: SRC-031
      stance: 0-4 周尽量避免奶嘴 — 防 nipple confusion;若需安抚用杯 / 勺 / 注射器替代。
    - school: Karp
      source: SRC-005
      stance: 母乳建立后 3-4 周可用奶嘴 — 防 SIDS 视角占优,母乳建立期过后即可。
    - school: AAP
      source: SRC-006
      stance: 3-4 周后可用 — 跟 Karp 立场一致,以 SIDS 防护因子为主要考量。
    - school: 折中
      source: ""
      stance: 0-4 周尽量避免(WHO);需要安抚优先用杯 / 勺;4 周母乳稳定后可考虑奶嘴(Karp/AAP)。

K6:
  issue: 喂养节律 — 反馈喂养(信号驱动)vs 3 小时定时
  cards:
    - C-S1-1005
    - C-S1-1016
    - C-S2-1044
    - C-S4-1050
    - C-S1-761
  views:
    - school: BFHI / WHO
      source: SRC-031
      stance: 看信号反馈喂(responsive feeding)— 婴儿饿了就喂,不计时间表。
    - school: AAP
      source: SRC-006
      stance: on demand 立场一致 — 新生儿不应严格定时,看信号优先。
    - school: 松田道雄
      source: SRC-024
      stance: 反产院'3 小时定时 + 用枕头支奶瓶'(C-S1-761),跟 BFHI 完全一致。
    - school: 中国传统产院
      source: ""
      stance: 3 小时定时喂奶仍普遍,部分爱婴医院实操参差;BFHI 中国 6,000+ 医院落地不一致。

K7:
  issue: 中国'早断早好'传统 vs WHO 2 年共识
  cards:
    - C-S6-1064
    - C-S6-1065
    - C-S7-1099
  views:
    - school: WHO
      source: SRC-031

A19:
  issue: 儿童哮喘 — 心因放大还是器质性疾病(P0 风险)
  cards:
    - C-S7-761
  views:
    - school: 松田 1980
      source: SRC-024
      stance: '"哮喘晚发作是娇惯出 / 全家围观才叫发作" — 反过度医疗派立场。仅适用于"家长放大紧张"的心因部分。'
    - school: 现代呼吸医学 / GINA
      source: ""
      stance: 哮喘是器质性疾病,需规范用药(吸入激素 + 支气管舒张剂);拒诊延误可致急性发作 / 慢性肺损害。
    - school: AAP
      source: SRC-006
      stance: 小儿哮喘有明确诊断标准 + 长期控制方案;急诊指征明确,需立即就医。
    - school: P0 安全提醒
      source: ""
      stance: 父母按松田立场可能延误器质性哮喘治疗。如孩子有反复喘息 / 夜咳 / 运动后喘 → 立即儿科呼吸科评估,不可仅按"娇惯"处理。

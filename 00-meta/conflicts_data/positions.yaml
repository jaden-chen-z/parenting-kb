# D 节:Phase 9 松田道雄(SRC-024)新增冲突
# D1(分龄同睡)→ 已并入 A2
# D5(把屎把尿)→ 已并入 A4
# D6 → 跳过(无具体卡片,是元汇总)
# 此处只保留 D2 / D3 / D4 三项独立议题
# ──────────────────────────────────────────────────────────

D2:
  issue: 3 岁孩子的体罚边界 · 大发雷霆体罚 vs 瞬间危险打手
  cards:
    - C-S8-100
    - C-S6-396
    - C-S6-403
    - C-S6-007
    - C-S6-932       # E3 Shonkoff/NRC 完全反体罚卡(神经科学证据)合并入 D2
    - C-S5-2151      # L5 海蒂"管教 ≠ 体罚:10 月起步"
  views:
    - school: 松田道雄
      source: SRC-024
      stance: 大发雷霆体罚是错的;但孩子做危险动作(冲马路、玩刀具)时瞬间打手作为警告有效。立场分情境。
    - school: Lansbury / RIE
      source: SRC-019
      stance: 温柔而坚定的限度,完全不打。任何体罚(包括瞬间打手)都破坏信任与自我调节学习。
    - school: Bowlby
      source: SRC-011
      stance: secure attachment 派完全反对体罚;依恋安全是学龄前儿童最优先的发育基础。
    - school: AAP
      source: SRC-004
      stance: 完全反对体罚 — 2018 政策声明明确指出体罚对儿童心理发展有害,无任何益处。
    - school: Shonkoff / NRC
      source: SRC-025
      stance: 完全反体罚 — cortisol 累积损伤前额叶皮层(PFC),与儿童反社会行为正相关。
    - school: 鲍秀兰
      source: SRC-009
      stance: 反对打孩子,主张正面管教;在中国本土实证派中是少有的明确反体罚立场。
    - school: 海蒂
      source: SRC-040
      stance: 管教 ≠ 体罚 — 10 月起步用其他管教法。美国主流大众派背书,降低中国家长"反体罚 = 西式精英"偏见。
    - school: 中国传统
      source: ""
      stance: '"棍棒底下出孝子" / "不打不成器" — 体罚被视为负责任管教的一部分。'

D3:
  issue: 安抚物(lovey)是健康过渡还是依赖癖好
  cards:
    - C-S4-702
    - C-S6-025
  views:
    - school: 松田道雄
      source: SRC-024
      stance: 不要养成 lovey 癖 — 8-9 月起经常更换毛巾被毯,避免婴儿对特定物品形成强依赖。
    - school: Brazelton
      source: SRC-010
      stance: 破破烂烂的小毛绒 = 内心强大;lovey 是健康过渡物,代表自我安抚能力的发展。
    - school: Davies
      source: SRC-014
      stance: 支持 lovey 是健康发育表现,无需干预或替换。
    - school: Winnicott(经典)
      source: ""
      stance: transitional object 是从母婴融合到独立自我的过渡桥梁,精神分析视角下是健康标志。

D4:
  issue: '"反抗期" 是孩子叛逆还是大人剥夺玩耍空间'
  cards:
    - C-S7-759       # conflicts.md 写错为 C-S7-755,实际是 759(松田反"反抗期")
    - C-S6-022
    - C-S7-604       # A20 松田 §387 反"反抗期"标签
    - C-S6-1079      # A20 Erikson autonomy vs shame
  views:
    - school: 松田道雄
      source: SRC-024
      stance: 反抗期不存在 — 是大人剥夺玩耍场所导致孩子抗议。不是孩子反抗你,是你在反抗孩子的自立。
    - school: Brazelton
      source: SRC-010
      stance: 18 月狂说 No 是健康信号 — negativism 是自我形成的发育表现,无需打压。
    - school: 现代心理学
      source: ""
      stance: 气质 + 大脑发育 + 自主性需要交互;"反抗期" 不是单一现象,而是多因素综合。
    - school: 中国传统
      source: ""
      stance: '"叛逆期需打压" — 把孩子说 No 视为不听话表现,主张严格管教纠正。'

# ──────────────────────────────────────────────────────────
# E 节:Phase 10 Shonkoff / NRC 综述(SRC-025)新增冲突
# E3(体罚)→ 已并入 D2
# 此处保留 E1 / E2 / E4 / E5 四项
# ──────────────────────────────────────────────────────────

E1:
  issue: 0-3 岁是真"关键期"(critical)还是"敏感期"(sensitive)
  cards:
    - C-S0-620
    - C-S0-619
    - C-S5-907
    - C-S3-806
    - C-S3-807
  views:
    - school: Shonkoff / NRC
      source: SRC-025
      stance: 严格区分 critical(完全错过)vs sensitive(可补)。绝大多数发展是 sensitive 不是 critical,反"3 岁定终身"恐慌。
    - school: Gopnik
      source: SRC-015
      stance: 强调突触修剪 + 关键期窗口(语言 / 视觉 / 知觉重组),认知科学立场偏 critical 端。
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: absorbent mind 强调 0-6 岁是哲学性关键期,但不是临床 critical(可补)。
    - school: 罗马尼亚孤儿数据
      source: ""
      stance: 即便严重剥夺,6 月领养仍可大幅恢复 → 实证偏 sensitive 论;支持 NRC 立场。
    - school: 中国主流
      source: ""
      stance: 普遍误信 critical 论 — "3 岁定终身" / "0-3 是黄金期错过不能补",制造焦虑。

E2:
  issue: 0-3 岁需要哲学结构(蒙氏 prepared)还是科学共识(NRC 6 原则)
  cards:
    - C-S0-622
    - C-S6-186
    - C-S8-215
  views:
    - school: Shonkoff / NRC
      source: SRC-025
      stance: 6 大原则(全人 / 时机 / 自主能动 / 文化 / 关系 / 多重适应),反对单一结构强加,给"科学校准底盘"。
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: prepared environment + 教具序列 + 4 plane of development 哲学结构,给"具体实操结构"。
    - school: Davies
      source: SRC-014
      stance: 蒙氏 0-1 岁实操(floor bed / topponcino 等),实操优先,哲学不僵化。
    - school: Lansbury / RIE
      source: SRC-019
      stance: 自由探索,反对结构化干预;父母提供安全 + 不打扰即可。
    - school: 互补结论
      source: ""
      stance: NRC 跟蒙氏可同时用 — 蒙氏给实操,NRC 给科学校准;NRC 反"过度结构化"非反 prepared 本身。

E4:
  issue: 0-3 岁需要系统化早期干预还是只需"陪 + 不打扰"
  cards:
    - C-S8-207
    - C-S8-208
    - C-S8-209
    - C-S8-210
    - C-S8-215
  views:
    - school: Shonkoff / NRC
      source: SRC-025
      stance: 系统化早期干预(Perry / Abecedarian RCT)— 主要针对高风险家庭(贫困 / 抑郁 / 单亲)。
    - school: Lansbury / Gerber RIE
      source: SRC-019/022
      stance: 不打扰 + 自由探索 + Quality time 短就够;反对系统化干预介入正常家庭。
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: 介于二者之间 — 有 prepared environment(结构),但 follow the child(不强加)。
    - school: 适用建议
      source: ""
      stance: 普通家庭偏 RIE(高质量陪伴);高风险家庭(贫困 / 妈妈抑郁)需 NRC 推荐的系统干预。

E5:
  issue: 商业早教(脑潜能开发课)对 0-3 岁孩子是否有用
  cards:
    - C-S0-619
    - C-S3-808
    - C-S7-866
    - C-S8-216
  views:
    - school: Shonkoff / NRC
      source: SRC-025
      stance: 强反对 — 神经科学不告诉你怎么早教,只告诉你别毁孩子;experience-expectant 类发展靠普通陪伴足够。
    - school: Gopnik
      source: SRC-015
      stance: 反对 — 教学悖论 + Kuhl 数据 — DVD / 视频教学对婴儿无效。
    - school: 松田道雄
      source: SRC-024
      stance: 反对 — 不焦虑育儿,留自由空间给孩子玩。
    - school: Lansbury / Gerber RIE
      source: SRC-019/022
      stance: 反对 — 减少结构化刺激,父母主要任务是不打扰孩子的自主探索。
    - school: 蒙氏(Lillard / Davies)
      source: SRC-016/014
      stance: 部分接受 — 蒙氏环境是"特殊设计"但不是商业早教,要求专业 prepared 而非 fancy 课程。
    - school: 鲍秀兰
      source: SRC-009
      stance: 部分支持早教 — 中国早期智力开发派,跟其他 5 派立场对立。
    - school: 中国主流
      source: ""
      stance: '"脑潜能开发" / "蒙氏早教" / "感统课" / "全脑开发" 商业课程产业链发达,焦虑驱动消费。'


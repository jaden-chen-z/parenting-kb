    - school: 全球医学共识
      source: ""
      stance: 北欧国家普遍 2 岁;母亲乳腺癌每哺乳 12 月降 6%;WHO 立场是国际医学共识不是西方偏好。
    - school: 中国传统
      source: ""
      stance: '"1 岁就该断" / "2 岁还在喂丢人" / "1 岁后没营养" / "惯坏依赖" — 文化压力源。'
    - school: 实操建议
      source: ""

# 立场对照数据集 — 全 84 项冲突的"立场对照"版块原始数据
# 由 build_positions.py 读取,写入对应卡片 YAML 的 back.positions 字段
#
# 维护规范:
#   1. issue:议题一句话(15-30 字),冒号或破折号风格皆可
#   2. cards:本议题涉及的所有卡片 ID(对照 conflicts.md 涉及卡片清单)
#   3. views:派别立场,2-5 派,每派 1 句话(40-80 字),不偏不倚
#      - school:派别名(中文为主,可中英混)
#      - source:SRC-XXX 编号(对应 10-sources/),可空
#      - stance:立场描述(40-80 字)
#   4. 卡片可同属多议题(union merge 规则:多议题合并显示在同一 positions 块)
#
# v2.0:A-F + K + L + A19-A21 完成 — 38 项 / 162 卡
# 跳过的 G/H/I/J 节(学术理论辩论,conflicts.md 自标"不是真冲突")可后续按需补
# 已并入策略:D1→A2 / D5→A4 / E3→D2 / F5→A4 / L1→A1 / L2→B2 / L3→standalone L3 / L4→standalone L4 /
#            L5→D2 / L6→standalone L6 / L7→B3 / L8→B1 / A20→D4 / A21→F3 / D6→跳过

A1:
  issue: 包裹(swaddle)该不该用 · 怎么用 · 何时停
  cards:
    - C-S1-013
    - C-S1-014
    - C-S1-015
    - C-S1-027
    - C-S1-038
    - C-S1-068
    - C-S1-185
    - C-S1-187
    # - C-S1-252  # 已移除:此卡是奶嘴主题(蒙氏 anti-pacifier),归 A3,非 A1
    - C-S2-014
    - C-S1-2205    # L1 海蒂"包裹要不要做"(conflicts.md 写错为 2204,实际是 2205)
  views:
    - school: Karp
      source: SRC-003
      stance: 5S 安抚法第一招(Swaddle)。紧裹 + 双臂内 + 配白噪音,可延长睡眠 1-2 小时;锁住莫罗反射(惊跳反射)防止干扰其他四招。
    - school: AAP
      source: SRC-004
      stance: 可用,但只起安抚作用,不防 SIDS;宝宝出现翻身迹象立刻停。髋部需留蛙腿位空间。
    - school: 蒙氏(Davies/Lillard)
      source: SRC-014/016
      stance: 反对包裹 — 妨碍婴儿练习自我安抚,且干扰莫罗反射的整合发育。改用小毯或睡袋。
    - school: 鲍秀兰
      source: SRC-009
      stance: 反对中国式"蜡烛包"(腿绑直会导致 DDH 髋发育不良,有终身风险);接受松松的"蛙腿位"包裹。
    - school: 海蒂
      source: SRC-040
      stance: 中性立场 — 决策权交给父母,中立列利弊;不站队,作为"主流家长方案"参考。

A2:
  issue: 同床 vs 同房不同床 · 何时安全 · SIDS 风险 · 分龄差异
  cards:
    - C-S1-028
    - C-S1-037
    - C-S1-040
    - C-S1-085
    - C-S4-700      # D1 松田分龄同睡卡(8 月后 OK)合并入 A2
  views:
    - school: Karp
      source: SRC-003
      stance: 在 10 步安全协议下可同床(无烟酒、硬床垫、无松软被等);否则不建议。
    - school: AAP
      source: SRC-004
      stance: 严禁 bed-sharing。推荐同房不同床(共室不共床)到 6 月,可降 SIDS 50%。
    - school: Brazelton
      source: SRC-010
      stance: 不给统一指南,视家庭文化决定;睡眠安排是亲子关系的反映,无单一正确答案。
    - school: 松田道雄
      source: SRC-024
      stance: 分龄立场 — 3 月内禁同床(母乳房压窒息风险);8 月后可同床(寒冷季节实用,母乳更增多)。
    - school: 中国传统
      source: ""
      stance: 普遍同床(便于喂奶 / 保暖 / 安抚),无明确安全协议;部分家庭长期同床至学龄。

A3:
  issue: 安抚奶嘴何时用 · 是否影响发育 · 何时戒
  cards:
    - C-S1-021
    - C-S1-022
    - C-S1-039
    - C-S1-051
    - C-S1-252
    - C-S5-134
  views:
    - school: Karp
      source: SRC-003
      stance: 鼓励使用,但母乳建立后 3-4 周再用,防乳头混淆。配方奶宝宝可即用。
    - school: AAP
      source: SRC-004/006
      stance: 鼓励 — 是 SIDS 保护因子;睡眠时给;4 岁前戒以防牙列影响。
    - school: 蒙氏(Davies/Lillard)
      source: SRC-014/016
      stance: 反对 — 妨碍婴儿嘴部发声练习与口腔早期探索;主张让孩子用嘴部自我安抚替代。
    - school: Davies
      source: SRC-014
      stance: 接受 0-1 岁安抚作用,但 1 岁前戒,防影响牙列发育和语言起步。

A4:
  issue: 如厕训练何时开始 · 谁主导 · 什么方法
  cards:
    - C-S5-012
    - C-S6-189
    - C-S6-190
    - C-S7-007
    - C-S7-018
    - C-S3-701       # D5 松田 4-5 月把屎把尿是错的
    - C-S4-703       # D5 松田 7-8 月可试便盆 1 分钟
    - C-S6-823       # D5 松田 1.5 岁夏天撤尿布
    - C-S7-405       # F5 Magda Gerber 学如厕不是训练
  views:
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: 12-18 月敏感期介入。反对长期纸尿裤拖延,孩子主导探索如厕,环境提供小马桶。
    - school: AAP / 主流
      source: SRC-006
      stance: 18 月-3 岁。等待神经括约肌成熟与孩子表达意愿,避免提前训练造成抗拒。
    - school: 鲍秀兰
      source: SRC-009
      stance: 9 月起坐盆训练,25-30 月用语言表达替代动作信号。早期建立排便规律。
    - school: Brazelton
      source: SRC-010
      stance: 24 月以后多数孩子才准备好,孩子主导,称 toilet learning 而非 training。反对 EC 出生训练。
    - school: 松田道雄
      source: SRC-024
      stance: 4-5 月把屎把尿是错的;7-8 月可试便盆(每次 1 分钟为限);1.5 岁夏天撤尿布最佳。
    - school: Pikler / Magda / Lansbury
      source: SRC-026/022/019
      stance: 不训练 — 等 24-30 月孩子自己准备好;"学如厕"而非"训练"。反对绑 / 揍 / 久坐 / 太早 4 大错。
    - school: 中国传统
      source: ""
      stance: 把屎把尿(EC) + 3 岁前完成,以家长信号为主;中医认为憋尿伤肾。

A5:
  issue: 0-3 岁是否需要主动教学 · 早教班 · 闪卡 · Mozart 效应
  cards:
    - C-S7-020
    - C-S7-125
    - C-S7-126
    - C-S7-127
    - C-S7-128
    - C-S6-181
  views:
    - school: Brazelton
      source: SRC-010
      stance: 3 岁前不教读写。Erikson 框架下情感发展优先于认知训练。
    - school: Gopnik
      source: SRC-015
      stance: Mozart 效应是骗局;闪卡无效;教越多越拖累自主探索;突触修剪是优化非损失。
    - school: 蒙氏(Lillard/Davies)
      source: SRC-014/016
      stance: 反对主动教学。提供 prepared environment + 观察 + 不打扰,孩子主导探索节奏。
    - school: 中国主流
      source: ""
      stance: 早教班 / 闪卡 / 双语早教 / Mozart 胎教 / "赢在起跑线" — 商业产业链已成熟。

A6:
  issue: 婚姻关系 vs 亲子关系 · 谁优先 · 自我照顾
  cards:
    - C-S7-135
    - C-S6-138
    - C-S7-043
    - C-S0-014
  views:
    - school: Lillard
      source: SRC-016
      stance: 婚姻关系优先于亲子。父母回家先找配偶不是孩子,夫妻关系是孩子安全感的根基。
    - school: Davies
      source: SRC-014
      stance: 父母先照顾自己,connection over perfection;同方向但语气更柔。
    - school: Bowlby V2
      source: SRC-012
      stance: 母亲焦虑会代际传递。妈妈心理健康即孩子心理健康(机制层面)。
    - school: 中国主流
      source: ""
      stance: 为孩子牺牲一切 / 妈妈全心扑娃 / "为了你不离婚" — 父母自我消耗常态化。

A7:
  issue: '"妈不要你了" 等威胁话术作为管教手段是否可行'
  cards:
    - C-S6-087
    - C-S6-098
    - C-S6-099
    - C-S6-133
    - C-S6-192
  views:
    - school: Bowlby V2
      source: SRC-012
      stance: 强烈反对 — 等同系统性精神虐待,直接破坏依恋安全。属儿童虐待范畴。
    - school: Davies
      source: SRC-014
      stance: 温柔而清晰的边界,不撤回爱。规则讲明,情绪仍在场。
    - school: Lillard
      source: SRC-016
      stance: No 永远是 No,但界限设置不带情绪 / 不带威胁。
    - school: 鲍秀兰
      source: SRC-009
      stance: 不打孩子立场对齐反虐待派,但未直接禁此话术。
    - school: 中国主流
      source: ""
      stance: "\"妈不要你了\" 是常用威胁话术;\"我是为你好\" 是常用绑架话术。"

B1:
  issue: 戒奶瓶何时进行 · 是否用 sippy 过渡 · 夜奶持续多久
  cards:
    - C-S5-001
    - C-S5-188
    - C-S5-023
    - C-S5-2146      # L8 海蒂 1 岁戒奶瓶防龋齿
  views:
    - school: AAP
      source: SRC-006
      stance: 12-18 月戒奶瓶,sippy 杯作过渡;延迟戒会增加奶瓶龋齿与肥胖风险。
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: 9-10 月戒奶瓶,反对 sippy(本质是"伪奶瓶",延长吸吮反射 + 影响牙列)。
    - school: Brazelton
      source: SRC-010
      stance: 反对僵硬时间线,跟孩子节奏决定;依赖型娃可晚戒,主导型娃自然提前。
    - school: 海蒂
      source: SRC-040
      stance: 1 岁戒奶瓶防龋齿;比 AAP 12-18 月略早,比 Lillard 9-10 月略晚,落在主流大众派中道。
    - school: 中国传统
      source: ""
      stance: 夜奶持续到 2 岁,白天奶瓶可至 3 岁,不强求时间表。

B2:
  issue: 睡眠训练方法选择 · 何时启动 · 哭多久才合理
  cards:
    - C-S5-189
    - C-S5-021
    - C-S5-137
    - C-S3-2148      # L2 海蒂 Ferber 法
    - C-S3-2258      # L2 海蒂 改良 Ferber
  views:
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: 6 月起关门睡 + 不抱不晃,孩子哭也不进。训练派立场最激进。
    - school: Brazelton
      source: SRC-010
      stance: 温和拍背 + 浅睡期演练。中间立场,父母在场但减少介入。
    - school: Davies
      source: SRC-014
      stance: 反对强训 — 6-16 月黏人是健康表现,过度训练有依恋代价。
    - school: AAP / Bowlby
      source: SRC-006/011
      stance: AAP 6 月+ 可启动温和方法;Bowlby 反对长时间哭训,需评估孩子类型。
    - school: 海蒂(Ferber 派)
      source: SRC-040
      stance: 温和 Ferber 法 / 改良 Ferber — 主流大众方案;节奏接近 Lillard 但更弹性,不极端关门。
    - school: 中国传统
      source: ""
      stance: 陪睡到学龄,不"训练"以避免分离焦虑;倾向自然戒断。

B3:
  issue: 不爬行(skip crawling)是否影响发育 · 跳爬直立是否健康
  cards:
    - C-S4-008
    - C-S4-191
    - C-S4-2147      # L7 海蒂 8 月不爬正常
  views:
    - school: 鲍秀兰
      source: SRC-009
      stance: 缺乏爬行 → 学龄期反应迟钝 / 动作笨拙。中国家长普遍焦虑源,提倡多爬。
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: sitter(坐型)也健康,看整体发育而非只看爬行;路径多样不必矫正。
    - school: AAP
      source: SRC-004
      stance: 不爬也正常,跳爬 / 直立都属正常发育路径;无明确"不爬有害"立场。
    - school: 海蒂
      source: SRC-040
      stance: 8 月不爬正常,跳爬直立也行 — 主流大众派对 AAP 立场的明确背书,缓和中国家长焦虑。
    - school: 中国传统
      source: ""
      stance: 不爬必须矫正,否则未来"协调差";常见"训练爬"商业课程。

B4:
  issue: 拒学(school refusal)与逃学(truancy)是否应区分对待
  cards:
    - C-S7-041
  views:
    - school: Bowlby V2
      source: SRC-012
      stance: 严格区分 — 拒学是焦虑型(分离焦虑),逃学是反社会型(品行障碍);混淆会让焦虑娃被错误惩罚。
    - school: 中国教育界
      source: ""
      stance: 普遍统称"厌学"或"不肯上学",不区分焦虑型与反社会型,处理方式趋同(惩罚 / 说教)。

B5:
  issue: '"懂事不哭" 是赞美还是依恋警告 · 强独立是好品质还是焦虑回避'
  cards:
    - C-S7-037
    - C-S7-042
    - C-S7-238
    - C-S7-240
  views:
    - school: Bowlby V2
      source: SRC-012
      stance: '"强忍不哭" 可能是压力反应(Lottie 案例);"早独立" 可能是焦虑回避型(航天员证据)。'
    - school: Bowlby V3
      source: SRC-017
      stance: 同方向加固 — "看似没事" 的孩子在临床上往往最危险,内化压力比外显更难干预。
    - school: 中国主流
      source: ""
      stance: '"懂事不哭不闹" 是亲戚常见夸赞;"独立" 被视为好品质,与回避型依恋区分模糊。'

# ──────────────────────────────────────────────────────────
# C 节:视角差异(6 项,非真冲突,只是同一现象不同命名 / 测试范式)
# 立场对照展示各派"叫法 + 视角",而非对错
# ──────────────────────────────────────────────────────────

C1:
  issue: 第四产程命名群 — 同一概念多种叫法
  cards:
    - C-S1-001
    - C-S1-073
    - C-S1-183
    - C-S1-243
    - C-S1-245
  views:
    - school: Karp
      source: SRC-003
      stance: 第四产程(fourth trimester)— 出生后头 4 月,继续模拟子宫感是核心。
    - school: 蒙氏(Davies/Lillard)
      source: SRC-014/016
      stance: exterogestation 外孕期 — 强调婴儿"在外"继续发育的生物学连续性。
    - school: Brazelton
      source: SRC-010
      stance: 不用"第四产程"标签,讲"独立的人 + 触点(touchpoints)",视婴儿为完整个体。
    - school: Gopnik
      source: SRC-015
      stance: 长童年期(extended childhood)是进化优势,人类大脑发育期长于其他灵长类。

C2:
  issue: 6-8 周事件命名群 — 同一发育跃迁的多个名字
  cards:
    - C-S2-001
    - C-S2-002
    - C-S2-018
    - C-S2-019
    - C-S2-020
    - C-S2-021
    - C-S2-067
    - C-S2-068
    - C-S2-121
  views:
    - school: Karp
      source: SRC-003
      stance: 哭闹峰(peak fussing)— 6 周是哭闹达高峰、随后递减的关键节点。
    - school: Brazelton
      source: SRC-010
      stance: 6-8 周触点(touchpoint)— 父母最焦虑、亲子关系重新校准的发育节点。
    - school: Wonder Weeks
      source: ""
      stance: WW8 模式跃迁 — 婴儿大脑首次能识别复杂模式,行为外显为不安。
    - school: Bowlby
      source: SRC-011
      stance: 6 周非选择性微笑 — 社会性微笑出现,但尚不区分照顾者。

C3:
  issue: 物体永久性月龄 — 8-10 月还是 4 月
  cards:
    - C-S3-021
    - C-S3-188
    - C-S4-003
  views:
    - school: Piaget / 鲍秀兰
      source: SRC-009
      stance: 8-10 月成熟(行为版)— 用动作测,孩子能找盖布下藏起的物体。
    - school: Spelke / Gopnik
      source: SRC-015
      stance: 4 月就有雏形(认知版)— violation-of-expectation 范式测惊讶反应,雏形早在 4 月。
    - school: AAP
      source: SRC-004
      stance: 8-10 月萌芽(主流行为派立场,临床观察一致)。
    - school: 学界争议
      source: ""
      stance: Heyes 2014 等批评 violation-of-expectation 范式可能过度解读;两者层级不同,都对。

C4:
  issue: 3 岁画像 — 平静 vs 难过 · 能力跃升 vs 分离焦虑
  cards:
    - C-S7-019
    - C-S7-036
    - C-S7-131
  views:
    - school: Brazelton
      source: SRC-010
      stance: '"second honeymoon" — 3 岁比 2 岁平静,亲子关系重新进入蜜月期。'
    - school: Bowlby V2
      source: SRC-012
      stance: 3 岁分离比 2 岁更难(Shirley 1941 实证),分离焦虑窄域更突出。
    - school: Lillard(蒙氏)
      source: SRC-016
      stance: 3 岁是"上学龄"— 能力跃升正面,适合进入 prepared environment。
    - school: 中国主流
      source: ""
      stance: '"threes are worse than twos"(无人正面写,gap)— 实操常感 3 岁更难带。'

C5:
  issue: 关键期(critical) vs 敏感期(sensitive)— 同义还是不同概念
  cards:
    - C-S2-133
    - C-S4-134
  views:
    - school: 鲍秀兰
      source: SRC-009
      stance: critical period 关键期 — 错过几乎不可逆(Lorenz 印随 / Hubel-Wiesel 视觉 / Genie 案例)。
    - school: 蒙氏(Davies/Lillard)
      source: SRC-014/016
      stance: sensitive period 敏感期 — 窗口闭合后仍可学,只是费力。本质不同概念。
    - school: 本知识库
      source: ""
      stance: 已新建 G-TERM-sensitive-periods 词条明确区分;两者并非同义术语,不可混用。

C6:
  issue: 主依恋形成路径 — 喂养者还是敏感回应者
  cards:
    - C-S2-070
  views:
    - school: 鲍秀兰
      source: SRC-009
      stance: 中国文化默认"妈妈喂养 = 主依恋",喂养是依恋核心通道。
    - school: Bowlby
      source: SRC-011
      stance: 敏感回应者 = 主依恋,喂养无关。直接颠覆中国"奶妈/月嫂带 ≠ 主依恋"假设。
    - school: Brazelton / Davies / Lillard
      source: SRC-010/014/016
      stance: 同 Bowlby 立场 — 谁回应得敏感,谁就是主依恋,可以是父亲、奶奶、月嫂。
    - school: 中国实操
      source: ""
      stance: 月嫂带 / 奶奶带 / 妈妈出现少 → 主依恋可能不是妈妈,对中国家庭高度颠覆。


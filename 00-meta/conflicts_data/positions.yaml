L3:
  issue: 过敏原(花生 / 蛋 / 奶等)何时引入 — 早引入还是延后避免
  cards:
    - C-S3-2249
    - C-S3-2248
  views:
    - school: 海蒂(2014 第 5 版)
      source: SRC-040
      stance: 过敏原 6 月起早引入,反"预防过敏的延后" — 直接对接 LEAP 2015 / AAP 2017 共识。
    - school: 海蒂(2010 第 4 版)
      source: SRC-040
      stance: 旧版延后立场(避免高致敏食物到 1-3 岁)。需明示自我修正以防中国老人引旧版。
    - school: LEAP / AAP 2017
      source: SRC-006
      stance: 早引入 — 4-6 月起规律暴露过敏原可降低过敏率;LEAP 试验对花生过敏率降 80%。
    - school: 中国老人禁忌
      source: ""
      stance: '"1 岁前不能给鸡蛋 / 海鲜 / 坚果";基于过时的延后避免理论,与现行循证立场对立。'

L4:
  issue: 母乳还是配方奶 — 道德题还是权衡题
  cards:
    - C-S0-2056
    - C-S0-2057
    - C-S1-2104
  views:
    - school: 海蒂
      source: SRC-040
      stance: 权衡而非道德题;真正不能母乳的 7 种情境;"决定不喂别内疚"。挑战道德绑架,授权职场妈不内疚。
    - school: WHO / BFHI
      source: SRC-031
      stance: 母乳唯一 + 只医学指征用配方;技术层面承认母乳更优,情感框架上母乳是道德选择。
    - school: AAP
      source: SRC-006
      stance: 推母乳但承认家庭情况差异;不强加道德标签,以家庭决定为本位。
    - school: 中国家长压力
      source: ""
      stance: '亲戚 / 月嫂 / 育儿群常用 "不母乳的妈不爱孩子" 道德绑架,缺"不内疚"授权来源。'

L6:
  issue: 隔代育儿边界 — 月嫂 / 婆媳 / 祖父母角色分工
  cards:
    - C-S0-2062
    - C-S0-003
  views:
    - school: 海蒂
      source: SRC-040
      stance: 祖父母首次到访先约边界;提供操作脚本(角色分工 + 时段安排),直击中国家庭核心冲突。
    - school: Brazelton
      source: SRC-010
      stance: 全家都抢着照顾的描述呼应 — 但侧重发展观察而非边界设定。
    - school: 中国传统
      source: ""
      stance: 月嫂 / 奶奶 / 姥姥多人照顾 + 边界模糊 — "都是为了娃好",冲突常发但缺协商工具。


# verbatim 关键内容(全部直接引用 Harvard CDC 原文)
verbatim_content:
  core_mechanism: |
    "When an infant or young child babbles, gestures, or cries, and an adult responds with eye contact,
    words, or a hug, this back-and-forth interaction—known as serve and return—helps to build and
    strengthen neural connections in the child's brain."

  language_priming: |
    "Naming what a young child is seeing, doing, or feeling helps make important language connections,
    even before they can talk or understand words."

  failure_consequence: |
    "When an adult's responses to a child are inconsistent, harmful, or simply absent,
    developing brain architecture may be disrupted, potentially leading to long-term impacts
    on health and well-being."

  toxic_stress_pathway: |
    "The persistent absence of serve and return interactions not only deprives the brain of the
    positive stimulation it needs but also activates the body's toxic stress response, which can
    flood the developing brain with harmful stress hormones."


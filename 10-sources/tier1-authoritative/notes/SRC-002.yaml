# 给单元层用的精简摘要
summary: |
  Serve and Return 是 Harvard CDC 提出的"成人响应婴幼儿信号"核心机制框架,
  适用 0-36 月,直接构建脑神经连接。
  相反:持续缺位会激活 toxic stress 通路,损伤脑结构。
  落地动作详见 5 Steps PDF(待 Phase 1 抓取)。
  系统性诱因(财务压力、社会孤立、慢性疾病、政策性歧视、气候压力)是父母个体能力之外的限制 ——
  卡片设计要避免"父母失败"叙事。


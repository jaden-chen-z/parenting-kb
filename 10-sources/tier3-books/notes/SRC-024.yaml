summary: |
  松田道雄《育儿百科》(中译本王少丽译,日文原版岩波书店 1967 初版 / 定本 1980)
  是日本家庭最经典的育儿工具书。

  作者松田道雄(1908-1998)京都大学医学博士,40 余年小儿科临床经验,在日本与
  Brazelton 在美国地位类似 — 几代家长都用他的书。

  全书结构:
  - 婴儿诞生之前(S0)
  - 0-1 月(S1):出生 1 周 / 半月 / 1 月
  - 1-3 月(S2):1-2 月 / 2-3 月 + 集体保育篇章
  - 3-6 月(S3):3-4 / 4-5 / 5-6 月 + 断奶
  - 6-12 月(S4 + S5):6-7 / 7-8 / 8-9 / 9-10 / 10-11 / 11-12 月
  - 1-3 岁(S6 + S7):1-1.5 / 1.5-2 / 2-3 岁
  - 3-6 岁(S8 新建):3-4 / 4-5 / 5-6 岁
  - 上学的孩子
  - 小儿疾病(§535-651,跨段)
  - 后记

  核心独家命题(中国家长直接相关):
  1. 抱不会养成毛病(§67/§100)— 反对中国老人"抱坏"说
  2. 母婴同睡 8 月后 OK(§258)— 反对 AAP bedsharing 禁令
  3. 不强制断奶(§256)— 反对中国"早断早好"
  4. 排便训练:4-5 月还早(§170)+ 7-8 月可试 + 不要每小时神经症(§216)
  5. 反抗期不存在(§387)— 是协作期 + 大人剥夺玩耍场所
  6. 体罚:大发雷霆错 + 瞬间危险打手(§421) — 部分支持立场
  7. 不让孩子看电视(§428)— 强反对扩到 3-4 岁
  8. 不要吓唬孩子(§331)— 不要单独把孩子丢在家
  9. 不焦虑育儿(§1) — 信自己直觉,不和别人家娃比

  ⚠️ 循证强度校准:
  - 部分立场跟现库 4 派(AAP/鲍/Brazelton/RIE)对立 — 全部记 conflicts.md
  - 大多数建议是松田 40 年临床 + 日本社会观察(B 级)
  - 跟 AAP/Lansbury 一致部分:不看屏 / 不强迫吃饭 / 不要吓唬(A 级)
  - 部分立场是松田个人哲学(C 级):反抗期不存在 / 不焦虑核心


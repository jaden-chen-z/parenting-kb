# 作者背景
author_credentials:
  matsuda_michio:
    role_ja: "京都大学医学博士 · 小儿科医生"
    expertise: "0-6 岁临床实操 + 日本育儿哲学(不焦虑育儿)"
    experience_years: 40
    note: |
      松田道雄(1908-1998)京都大学医学博士,40 余年小儿科临床经验。
      日本最有影响力的儿科医生之一,《育儿百科》自 1967 年初版以来日本家家必备。
      核心立场:不焦虑育儿(あせらない育児)+ 不和别人家娃比 + 父母信自己直觉。
      日本"在家妈妈派"(母亲全身心育儿)与"职场妈妈派"(保育园)之间持中立立场。

# 本卷在松田原始材料中独家命题(跟 AAP/鲍秀兰/Brazelton 跨文化对照)
matsuda_unique_themes:
  - 抱不会养成毛病(§67/§100)— 日本传统:抱是肌肤接触快乐 + 反对中国老人"抱坏"说
  - 母婴同睡(§258)— 日本立场:8 月后 OK + 3 月内禁(防压婴儿) — 跟 AAP 反 bedsharing 对立
  - 不强制断奶(§256)— 日本立场:8 月后逐渐过渡,不强制 — 跟中国"早断早好"对立
  - 排便训练 4-5 月还为时尚早(§170)— 跟鲍秀兰 9 月起、中国老人"3 月把屎把尿"对立
  - 排便训练 7-8 月可启动(§216)— 但松田立场:不要每小时神经症 + 母亲精神作用决定
  - 不要养成"宠物"癖(§259)— 日本立场:反 lovey 依赖 — 跟 Davies/AAP 拥抱 lovey 对立
  - 反抗期不存在(§387)— 是协作期 + 大人剥夺玩耍场所 — 立场独特
  - 体罚有限度(§421)— 大发雷霆体罚错,瞬间危险行为可打手 — 跟 RIE/Bowlby 强对立
  - 不让孩子看电视(§428)— 强反对 + 扩到 3-4 岁 — 跟 Lansbury 0-2 岁立场更激进
  - 不要吓唬孩子(§331)— 不要把孩子单独丢在家 — 中国传统"狼来了"派对照
  - 集体保育(§117/§350)— 日本保育园文化 vs 美国 day care 制度参考
  - 自由空间(§387)— 日本街头玩耍传统 / 现代车流剥夺
  - 让孩子自己的事情自己做(§385)— 自立优先 + 跟 RIE/蒙氏一致
  - 不焦虑育儿核心(§1)— 不强求"当好妈妈" + 信自己直觉

# 跟现有 SRC 关系(跨文化对照硬指标)
relationship_to_aap:
  description: "松田(日)vs AAP(美)立场对比"
  conflicts:
    - 母婴同睡:松田 8 月后支持 vs AAP 反对 bedsharing(C-S5-XXX)
    - 体罚:松田部分支持瞬间打手 vs AAP 完全反对(C-S8-XXX)
    - 母乳期:松田反对强制断奶 vs AAP 6 月专母乳后建议加固
    - 抱孩子:松田支持多抱 vs AAP 中性(SIDS 主导睡眠安全)
  alignments:
    - 不看屏幕(松田 §428 + AAP 0-2 不看屏 + Lansbury 立场重叠)
    - 不强制吃饭(松田 §324 + Brazelton 自主权战场)
    - 不要吓唬(松田 §331 + AAP 心理安全)

relationship_to_baoxiulan:
  description: "松田(日)vs 鲍秀兰(中)东亚临床派对照"
  conflicts:
    - 排便训练:松田 4-5 月不要训 vs 鲍秀兰 9 月起开始(C-S3-XXX)
    - 早期识字:松田 §470 不必教认字 vs 鲍秀兰 12 月起认颜色名词(C-S7-XXX)
  alignments:
    - 抱孩子:松田 §67 + 鲍秀兰 8 月前抱抱不宠坏(C-S4-016)
    - 不强迫吃饭:松田 §324 + 鲍秀兰类似立场
    - 让自己做事:松田 §385 + 鲍秀兰 19-21 月戴帽脱袜

relationship_to_brazelton:
  description: "松田(日)vs Brazelton(美)西方临床派对照"
  conflicts:
    - 排便训练:松田 7-8 月可试 vs Brazelton 18 月-3 岁孩子主导
    - lovey:松田反 lovey 癖 vs Brazelton 破破烂烂毛绒 = 内心强大
  alignments:
    - 反抗期:松田 §387 协作期 + Brazelton 18 月狂说 No 是健康
    - 自主权战场:松田 §324 + Brazelton 喂食是自主权
    - 触点退步:松田暗示 + Brazelton 退步是前进的预告

evidence_level_calibration:
  - A: "松田 + AAP/鲍秀兰/Brazelton 三派以上一致(eg 不看屏 / 抱孩子 / 不强迫吃饭)"
  - B: "松田 40 年临床观察 + 日本社会调查(主体)"
  - C: "松田个人哲学推断(eg 反抗期不存在 / 不焦虑核心)"


# Lerner V2 独家命题(本书 vs 现库 18 派对照,认知/感知/语言铁三角左侧)
lerner_v2_unique_themes:
  - spelke_core_knowledge_5_systems: "Spelke 核心知识 5 系统 — 物体 / 行动 / 数 / 空间 / 社会(出生即有,Ch5 综述)"
  - baillargeon_violation_of_expectation: "Baillargeon 违背期望范式 — 推翻 Piaget 物体永久性 8 月说"
  - saffran_8month_statistical_learning: "Saffran 8 月统计学习 1996 — 婴儿听 2 分钟无意义音节抓出统计模式(Ch2)"
  - werker_perceptual_narrowing: "Werker 6-12 月母语音素窗口闭合 — 知觉重组实证(Ch2,Kuhl 同方向)"
  - tomasello_9month_revolution: "Tomasello 9 月革命 — 联合注意 + 共享意图涌现(Ch6,跟 Stern intersubjectivity 对接)"
  - tomasello_shared_intentionality: "Tomasello 共享意图 — 人类独有合作能力的认知根源(Ch6)"
  - markman_3_constraints: "Markman 词义 3 约束 — 整体物体 / 分类 / 互斥(Ch7)"
  - bloom_vocabulary_spurt: "Bloom 词汇爆炸 — 18-24 月 50 词突破(Ch7)+ fast mapping 一次见即学"
  - wynn_5month_arithmetic: "Wynn 5 月就有 1+1=2 加法雏形 — 推翻 Piaget 数前运算(Ch18)"
  - dehaene_number_sense: "Dehaene 数感 — 三种数表征(主观大小线 / 准确小数 / 语言符号,Ch18)"
  - wellman_5_stage_tom: "Wellman 心智理论 5 阶段 — WPSS 量表(Ch19)"
  - false_belief_task: "Sally-Anne 错误信念任务 — 4-5 岁通过(Ch19,跟 Lansbury 共情教对接)"
  - leslie_tomm_module: "Leslie 心智理论模块 ToMM — 18 月起 + 自闭症缺损(Ch19)"
  - carey_conceptual_revolution: "Carey 概念革命 — 不是渐变是质变(Ch16,跟 Gopnik 孩子是科学家同根同源)"
  - mandler_perceptual_vs_conceptual: "Mandler 知觉范畴 vs 概念范畴二分 — 不是同一系统(Ch16)"
  - karmiloff_smith_representational_redescription: "Karmiloff-Smith 表征重描述 4 层 — 反早期模块化(认知重塑)"
  - gentner_analogy_mapping: "Gentner 类比 = 关系结构映射 — 不是表面相似(Ch13/16)"
  - goldin_meadow_gesture_window: "Goldin-Meadow 手势是思维窗口 — 过渡期手口不一致预测学习"
  - thelen_dynamic_systems: "Thelen 动态系统派 — A-not-B 错误是身体动力学不是表征不全(Ch4/10)"
  - adolph_walking_development: "Adolph 学走精细数据 — 1500-9000 步/天 + 17 跌/小时(Ch4)"
  - kellman_object_unity: "Kellman 物体一致性 — 4月看运动连续推断(Ch3)"
  - siegler_overlapping_waves: "Siegler 重叠波模型 — 策略不是楼梯而是齐头并进(Ch11)"
  - bauer_deferred_imitation: "Bauer 延迟模仿 — 9 月 24 小时 / 13 月 1 个月记得(Ch9)"
  - munakata_graded_representations: "Munakata 渐变表征 — 神经网络模型解释 A-not-B"
  - newcombe_spatial_egocentric_to_allocentric: "Newcombe 空间从自我为中心到客观坐标(Ch17)"
  - cohen_cashon_information_processing_infants: "Cohen-Cashon 婴儿信息处理整合(Ch5)"
  - keil_intuitive_theories: "Keil 直觉理论 — 朴素物理 / 朴素心理 / 朴素生物三大领域(Ch14/16)"
  - 9_month_pointing: "9 月真正指向 — 不是要而是分享(Tomasello + Bates)"
  - waxman_noun_bias: "Waxman 名词偏置 — 婴儿先抓名词后抓动词(Ch7)"
  - bates_gesture_language_continuum: "Bates 手势-语言连续 — 12 月 5 词 = 12 月 5 手势"


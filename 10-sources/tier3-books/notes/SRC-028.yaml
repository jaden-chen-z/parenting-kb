# 评级标尺(本书)
evidence_level_calibration:
  A: "Lerner V2 综述 + 跨派一致 + 实证扎实(主体 50-60%)— Tier 2 学术综述铁三角权威"
  B: "Lerner V2 综述 + 跨派部分张力 / 综述内分歧(30-40%)— 如 Spelke vs Karmiloff-Smith / Wynn vs Mix"
  C: "Lerner V2 推断 + 个别学者立场 + 实证薄弱(罕见,V2 是 Tier 2 综述)"
  expected_distribution: "A 多 B 中 C 罕 — 综述权威决定主体 A 级"

# 聚焦策略
focus_strategy:
  zh: |
    Lerner V2 22 章百科级综述,聚焦 8 主战场章 + 6 副战场章 + 6 弱覆盖:

    主战场(产卡密集):
    - Ch2 听觉/语音/语言开端(Saffran/Werker)— Saffran 8月统计学习 / Werker 母语音素窗口
    - Ch5 婴儿认知(Cohen/Cashon)— Spelke 核心知识 / Baillargeon 物体永久 / 习惯化
    - Ch6 语言习得(Tomasello)— 9 月革命 / 联合注意 / 共享意图
    - Ch7 词汇学习(Waxman/Lidz)— Markman 3 约束 / fast mapping / 词汇爆炸
    - Ch16 概念发展(Gelman S/Kalish)— Carey 概念革命 / Mandler 知觉vs概念 / 直觉理论
    - Ch18 数学理解(Geary)— Wynn 5 月加法 / Dehaene 数感 / subitize
    - Ch19 社会认知(Harris)— 心智理论 5 阶段 / Sally-Anne / 假装

    副战场(产卡中等):
    - Ch1 神经基础(Nelson)— 突触 / 经验依赖 vs 经验期待
    - Ch3 视觉感知(Kellman)— 视觉悬崖 / 物体一致性
    - Ch4 大动作(Adolph/Berger)— 学走精细数据 / Thelen 动态系统
    - Ch9 事件记忆(Bauer)— 延迟模仿 + 自传记忆
    - Ch15 文化认知(Cole)— 跨文化研究
    - Ch17 空间认知(Newcombe)— 自我中心 → 客观坐标

    弱覆盖(精选 1-3 张):
    - Ch8 手势(Goldin-Meadow)— 手势预测学习
    - Ch10 信息处理(Munakata)— 连接主义模型
    - Ch11 微观发生(Siegler)— 重叠波 / 策略选择

# 整体摘要(Phase 3 完成后回填精修)
summary: |
  Brazelton《Touchpoints: Birth to Three》(初版 1992,修订版 2006 与 Joshua Sparrow 合著)
  是 0-3 岁儿童心理 / 行为发展领域的流派原典,Da Capo Press 出版。

  核心概念:
  1. **触点(Touchpoints)** — 0-3 岁发展中的可预测节点,每个触点前儿童会有暂时退步
     (回归 / 烦躁 / 睡眠混乱),这是健康前进的信号
  2. **预防型 / 优势型(strengths-based)模型** — 与 Brazelton Touchpoints Center 全国 70+
     合作机构推广
  3. **48 章三段式结构** — Part One 13 个月龄触点 + Part Two 30 个挑战主题 +
     Part Three 5 个关系支持

  Brazelton 个人:1918-2018,哈佛医学院儿科教授,波士顿儿童医院 50+ 年临床经验,
  NBAS(Neonatal Behavioral Assessment Scale)1973 创始人。
  Sparrow:儿童精神科医生,Touchpoints Center 共同负责人。

  ⚠️ 与 Karp / AAP / 鲍秀兰的对照:
  - Karp 引用过 Brazelton 1962 哭闹峰研究(C-S2-001/002 的 B 级证据来源)
  - Touchpoints 是流派概念,大多 C 级,部分 B(临床观察 + 共识)
  - 与 AAP 共识对齐部分(SIDS / 仰睡 / 母乳)可标 A
  - 1990s 初版的部分医学建议(尤其睡眠 / 喂养)可能与 2022 AAP 立场冲突,
    保留 Brazelton 视角 + 标 controversy,留给后续整合阶段
  - 与鲍秀兰对照:Brazelton 强调"发展退步 = 健康前进信号",鲍秀兰强调"早教训练系统";
    西方心理 vs 东方早教两种视角互补

  待 cross-validate(后续整合阶段):
  - AAP Caring for Your Baby 2022 立场
  - 2022 AAP Safe Sleep Policy(若 Brazelton 1992/2006 立场过时)
  - 当前 NIH / WHO 喂养与睡眠指南


# 评级标尺(本书)
evidence_level_calibration:
  A: "Lerner V3 综述 + 跨派多学派一致 + 实证扎实(主体 60-70%)— Tier 2 心理学百科权威"
  B: "Lerner V3 综述 + 部分张力(立场分歧 / 数据有限 / 文化局限)(20-30%)"
  C: "Lerner V3 综述 + 学者推断 / 单一研究 / 跨文化薄弱(罕见)"
  expected_distribution: "A 占多 — 综述权威决定 majority A 级,部分 B(气质 vs 性格 边界 / Hoffman 共情阶段普世性 / Kohlberg 跨文化批评)"

# 聚焦策略
focus_strategy:
  zh: |
    Lerner V3 16 章,15 章本库可取(Ch 16 青少年只取早期):

    主战场(每章产 15-30 张):
    - Ch 2 Thompson(发展之人 — 社会理解/良知/self)— S0-S8 跨段
    - Ch 3 Rothbart 气质 — S1-S8 全段(气质天生 + 测量 + 后期人格)
    - Ch 4 Kagan 生物气质 — S2-S8(抑制型 + 神经基础)
    - Ch 5 Saarni 情绪 — S0-S8(8 项情绪能力)
    - Ch 6 Caspi 人格 — S6-S8(早期人格延续)
    - Ch 8 Parke 家庭社会化 — S0-S8(父母管教 / 文化 / 离婚)
    - Ch 9 Harter self — S6-S8(self 5 维度)
    - Ch 11 Eisenberg 亲社会 — S2-S8(共情发展轨迹)
    - Ch 12 Dodge 攻击 — S6-S8(认知偏差 / Patterson 强制)
    - Ch 13 Turiel 道德 — S6-S8(4 类规则 + Smetana)
    - Ch 14 Ruble 性别 — S6-S8(3 阶段 + 图式)

    次战场(每章产 5-10 张):
    - Ch 1 Eisenberg 序章 — 哲学(S0)
    - Ch 7 Bugental 社会化过程 — S2-S8
    - Ch 10 Rubin 同伴 — S6-S8
    - Ch 15 Eccles 成就动机 — S7-S8(motivation 起源)
    - Ch 16 Steinberg 青少年早期信号 — 选 S8 适用部分

    每章必须有覆盖 — 没卡覆盖某章是漏。

# 中文家长高频痛点 mapping
parent_pain_points:
  - "我家娃天生敏感怎么办 → Rothbart 气质 3 维度 + Chess goodness-of-fit"
  - "几岁有道德感 → Smetana 3 岁分道德/习俗 + Kohlberg/Turiel 综述"
  - "父母严还是宽好 → Maccoby 4 象限 + Baumrind 4 类型 + 权威型最优"
  - "我家娃为啥爱打人 → Dodge 社会信息处理 6 步 + 解读偏差"
  - "怎么教共情 → Eisenberg 亲社会发展轨迹(共情先于规范)"
  - "男娃女娃天生不同吗 → Ruble 性别 3 阶段 + 文化 vs 生物"
  - "二胎吵架是病吗 → Dunn 兄弟姐妹 5 维度 + 是发展机会"
  - "抗挫力怎么培养 → Masten 韧性 4 保护因子 + 不是性格"
  - "学龄前要建立啥自信 → Harter self 5 维度 + 不是单线"
  - "友谊怎么发展 → Selman 友谊 5 阶段(via Ch 10)"
  - "家庭环境影响多大 → Bronfenbrenner 5 层生态 + Parke-Buriel 族群"
  - "文化怎么塑造孩子 → Rogoff 文化建构 + Parke 族群视角"
  - "气质能改变吗 → Kagan 反基因决定论 + 50% 环境可改"
  - "怎么管教打骂 → Patterson 强制家庭过程 + 反体罚 综述"
  - "成就动机怎么培养 → Eccles expectancy-value + 不是 IQ 决定"


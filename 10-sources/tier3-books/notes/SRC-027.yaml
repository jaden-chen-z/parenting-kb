# Lerner V3 独有命题(本书 vs 现库 18 派对照)— 综述大典维度
lerner_v3_unique_themes:
  - rothbart_3_dimensions: "Rothbart 气质 3 维度(反应度 + 自调节 + 情绪)— 比 Thomas-Chess 9 维度精简"
  - kagan_inhibited_uninhibited: "Kagan 抑制型 vs 非抑制型气质 + 生物基础(杏仁核反应)"
  - saarni_8_emotional_competences: "Saarni 情绪能力 8 项(情绪意识 / 别人情绪 / 词汇 / 共情 / 情绪表达 / 应对 / 关系情绪 / 自效能)"
  - thompson_social_understanding: "Thompson 早期社会理解 + 良知 + self 形成轴(Ch 2 综合性框架)"
  - caspi_personality_continuity: "Caspi 人格连续性 + 气质 → 人格延伸 + Big Five 童年版"
  - bugental_grusec_5_domains: "Bugental-Grusec 社会化 5 领域(保护 / 互惠 / 控制 / 群体 / 配偶)"
  - parke_buriel_ethnic_ecological: "Parke-Buriel 族群 + 生态视角(反白人中产假设)"
  - harter_self_5_domains: "Harter self 5 维度(学术 / 社会 / 运动 / 外貌 / 行为)+ 全球自尊"
  - rubin_peer_3_levels: "Rubin 同伴 3 层级(互动 / 关系 / 群体)+ 友谊 ≠ 流行度"
  - eisenberg_prosocial_developmental_trajectory: "Eisenberg 亲社会发展轨迹 + 共情情感先于规范遵守"
  - dodge_social_information_processing: "Dodge 社会信息处理 6 步(编码 / 解读 / 目标 / 反应生成 / 评估 / 实施)+ 攻击儿童解读偏差"
  - turiel_moral_4_domains: "Turiel 道德 4 领域(道德 / 习俗 / 个人 / 谨慎)+ 跨文化儿童区分"
  - ruble_martin_gender_3_stages: "Ruble-Martin 性别 3 阶段(标识 / 稳定 / 一致)+ 性别图式"
  - wigfield_eccles_expectancy_value: "Eccles-Wigfield 成就动机 expectancy-value 模型"
  - kochanska_conscience: "Kochanska 良知发展 + 早期母婴互动是奠基"
  - hoffman_empathy_4_stages: "Hoffman 共情 4 阶段(全身性 / 自我中心 / 他人 / 系统性)"
  - kagan_freedom_choice: "Kagan 反基因决定论 — 气质 ≠ 命运,环境可改变 50%+"
  - emde_pietromonaco_relational: "Emde 关系情绪发展 — 母婴是情绪调节奠基"
  - chess_thomas_goodness_of_fit: "Chess-Thomas goodness-of-fit — 气质和环境匹配比单维好坏更重要"
  - eccles_self_concept_5_domains: "Eccles 自我概念 5 领域 + 早期就分化"
  - kohlberg_3_levels_6_stages: "Kohlberg 道德 3 水平 6 阶段 + Turiel 修正"
  - smetana_4_domains_distinction: "Smetana 4 类规则 — 儿童 3 岁就分道德 vs 习俗"
  - patterson_coercive_family: "Patterson 强制家庭过程 — 攻击是亲子互动训练出"
  - baumrind_4_styles: "Baumrind 父母 4 类型(权威/独裁/纵容/忽视)+ 后续 Maccoby 升级"
  - eisenberg_self_regulation: "Eisenberg 努力控制 effortful control — 气质 + 自调节衔接"
  - cassidy_internal_working_models: "Cassidy 内部工作模型 + 现代依恋研究综述"


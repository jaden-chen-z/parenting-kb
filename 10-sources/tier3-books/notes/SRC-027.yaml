notes: |
  Phase 11 单 session — Lerner V3《Handbook of Child Psychology Vol 3》(Wiley 2006 第 6 版,Eisenberg 主编)。

  - 文件已 OCR(.md, 146,390 行 / 6.4MB / 16 章主体)
  - 章节 offset 已实测确认 15 章主体(Ch 16 青少年发展只取早期信号)
  - 每章 350-420 KB,Ch 16 单独 646 KB 但本库 0-6 不主取

  关键校准:
  - Lerner V3 是 Wiley 心理学百科第 6 版(2006),Eisenberg 主编
  - 16 章每章一个学派或主题大综述,各章作者均是该领域奠基级权威

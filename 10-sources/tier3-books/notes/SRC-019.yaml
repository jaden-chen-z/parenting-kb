# Introduction 给的 10 大 RIE 原则(本书核心骨架)
rie_10_principles:
  - 1. We communicate authentically(真实沟通,真实声音)
  - 2. We encourage babies to build communication skills(留白,等回应)
  - 3. We invite babies to actively participate in care giving(护理是参与不是被动)
  - 4. We encourage uninterrupted, self-directed play(自主玩耍不打断)
  - 5. We allow children to develop motor and cognitive skills naturally(不教,信任天生时间表)
  - 6. We value intrinsic motivation(尊重内在动机,少夸)
  - 7. We encourage children to express their emotions(承认情绪,不修复)
  - 8. We recognize that children need confident, empathetic leaders + clear boundaries(自信限度 + 不羞辱不分散不惩罚不 time-out)
  - 9. We allow our children to problem solve(让孩子自己解决)
  - 10. We understand the power of our modeling(模范是最强教育)


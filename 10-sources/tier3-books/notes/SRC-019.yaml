    - 婴儿是完整的人(whole person)
    - 观察 + 等待(observation + wait)
    - 自主玩耍(uninterrupted play)
    - 真物(real things)
    - 准备好的环境(prepared environment / yes space)
    - 慢下来(slow down / going slow)

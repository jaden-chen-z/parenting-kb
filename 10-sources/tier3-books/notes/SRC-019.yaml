    author: Magda Gerber (via Lansbury Intro)

# 跨派对照(立场不同处,用于卡片立场对照)
position_contrasts:
  vs_attachment_parenting:
    - Lansbury 反对 Sears 派"几乎全程抱"(Ch15)
    - Lansbury 立场:婴儿不是 helpless,是 dependent + competent
  vs_distraction_school:
    - Lansbury 反对"用分散转移阻止哭"(Ch28)
    - Lansbury 立场:第一年就要诚实设限,不分散
  vs_sleep_training_extremes:
    - Lansbury 反"sleep training" 这个词(Ch6)
    - Lansbury 立场:是 un-training(取消我们建立的依赖)
  vs_chinese_traditional:
    - 中国"宝宝小不懂事" → Lansbury 反:从出生起就当人对待
    - 中国"硬塞最后一口" → Lansbury 反:由宝宝定饱
    - 中国"哭就抱 + 转移" → Lansbury 反:听不修复
    - 中国"如厕训练" → Lansbury 反:孩子准备好就自己学
    - 中国"分享教育" → Lansbury 反:2 岁以下不懂,不强迫


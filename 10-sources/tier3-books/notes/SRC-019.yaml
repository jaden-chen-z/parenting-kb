    - 承认情绪而不修复(acknowledge feelings, don't fix)
    - "CEO 语调"(自信不焦虑的限度)
    - "no time-out"(反惩罚)
    - "Let kids be mad at you"(让孩子对你生气没问题)
  contrast:
    - Lansbury 比蒙氏更"被动" — observe more, do less
    - Lansbury 比蒙氏更强调 sportscasting + 限度语言
    - 蒙氏比 Lansbury 更系统化(prepared environment + practical life 课程)


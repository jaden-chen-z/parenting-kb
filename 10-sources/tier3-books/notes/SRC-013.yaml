# 核心理论
core_theories:
  - "3 C's:Crying / Clinging / Cranky — 跃迁前必出现的烦躁信号"
  - "fussy phase 在跃迁前 1-3 周开始,跃迁完成后消退"
  - "前 3 个 fussy phase(5/8/12 周)较短(几天到 1 周)"
  - "后期 fussy phase(19 周起)可持续 1-6 周"
  - "10 个跃迁中 6 个有独立神经科学验证(EEG / 大脑电活动)"
  - "时间从受孕日算起 — 早产宝宝按预产期校正,晚产宝宝按实际出生日往前推"
  - "气质安静的宝宝也会经历 fussy phase,只是表现温和"
  - "跃迁不等于躯体生长冲(growth spurt),两者独立但偶有重叠"


# Lerner V1 独有命题(本书 vs 现库 19 派对照)— 元理论卷维度
lerner_v1_unique_themes:
  # ⭐⭐⭐ 顶层元理论(解释流派分歧根源)
  - overton_split_vs_relational: "Overton split vs relational metatheory(Ch 2)— 解释为什么 Karp swaddle 派 vs 蒙氏反 swaddle 派根本立场对立"
  - lerner_developmental_contextualism: "Lerner relational developmental systems(Ch 1)— 元层框架取代 Cartesian 二分"
  - probabilistic_epigenesis_4_levels: "Gottlieb probabilistic epigenesis 4 层(基因 / 神经 / 行为 / 环境)+ canalization Waddington 渠化"
  - bronfenbrenner_5_systems: "Bronfenbrenner & Morris bioecological 5 系统(微/中介/外/宏/时间) + PPCT model"
  - thelen_smith_dynamic_systems: "Thelen-Smith dynamic systems theory(Ch 6)— 自组织 / attractor / multifinality / equifinality"
  - fischer_dynamic_skill: "Fischer & Bidell dynamic skill theory(Ch 7)— 技能层级 + 重组 + 变异性是发展核心"
  - magnusson_holistic_interactionistic: "Magnusson-Stattin holistic-interactionistic(Ch 8)— person 是整体不是变量,变量分析有局限"
  - csikszentmihalyi_flow: "Csikszentmihalyi flow / 最优体验(Ch 9)— 内在动机 + 挑战 vs 技能匹配"
  - brandtstadter_action_theory: "Brandtstädter action theory of self-development(Ch 10)— 同化 vs 调节 + intentional self-development"
  - baltes_lifespan: "Baltes lifespan theory(Ch 11)— 一辈子可塑 + selection / optimization / compensation(SOC)+ 反早期决定论"
  - elder_life_course: "Elder & Shanahan life course theory(Ch 12)— 历史时间 + 转折点 + linked lives"
  - shweder_cultural_psychology: "Shweder cultural psychology(Ch 13)— 多元心智论 + 文化不是变量是 constitutive"
  - spencer_pvest: "Spencer PVEST(Ch 15)— phenomenological variant of ecological systems — 加入 perception + identity 的生态模型"
  - lerner_positive_youth_development: "Lerner PYD(Ch 16)— 5 C 框架(competence/confidence/connection/character/caring)— 反 deficit model"
  - oser_religious_spiritual: "Oser religious/spiritual development(Ch 17)— stage-structural 信仰发展 + 精神维度"
  - cairns_history_developmental_psych: "Cairns & Cairns(Ch 3)— 发展心理学百年史 + 学派起源 + 反辉格史观"
  - valsiner_culture_in_human_dev: "Valsiner culture in human development(Ch 4)— 文化-个体共建构 + 不是变量"
  - overton_5_principles: "Overton 5 关系原则(身体 + 行动 + embedded + bidirectional + multilevel)"
  - relational_metatheory_replaces_cartesian: "关系元理论取代 Cartesian 二分(nature vs nurture / 个体 vs 环境 / 变量 vs 个人)"
  - canalization_waddington: "canalization Waddington 渠化 — 发展轨迹有 attractor 但不是预定"
  - equifinality_multifinality: "equifinality(条条大路通罗马)+ multifinality(同起点不同结局)双向性"
  - dynamic_skill_constructive_web: "Fischer constructive web — 技能不是直线是网"
  - person_holistic_unit: "Magnusson holistic person — 把整个人当 unit,不是把人拆成变量"
  - flow_internal_motivation: "Csikszentmihalyi flow — 内在动机不是奖励驱动"
  - assimilation_vs_accommodation_self: "Brandtstädter 同化(改环境)vs 调节(改自己)双过程"
  - SOC_selection_optimization_compensation: "Baltes SOC — 选择 + 最优化 + 补偿,生命周期 3 大策略"
  - linked_lives_life_course: "Elder linked lives — 个人发展跟家庭社会其他人轨迹绑定"
  - cultural_psych_multiple_mentalities: "Shweder 多元心智论 — 一个心智多种表达,不是普世单一"
  - PVEST_perception_identity_loop: "Spencer PVEST — 感知风险 + 身份建构 + 应对 + 适应循环"
  - PYD_5C_framework: "Lerner PYD 5C 框架 + 反 deficit model"
  - relational_developmental_systems: "relational developmental systems — Lerner-Overton 综合元框架"
  - biocultural_co_construction: "Baltes biocultural co-construction — 生物 + 文化双向建构"
  - chronosystem_time_in_development: "Bronfenbrenner chronosystem 时间维度入生态模型"
  - PPCT_process_person_context_time: "Bronfenbrenner PPCT 模型 — process / person / context / time 4 维"
  - microsystem_proximal_processes: "Bronfenbrenner proximal processes — 微观日常互动是发展引擎"
  - mesosystem_settings_interaction: "Bronfenbrenner mesosystem — 家庭 ↔ 学校 ↔ 同伴 settings 间的互动质量"
  - exosystem_indirect_influence: "Bronfenbrenner exosystem — 父母工作场所 / 政策等间接影响"
  - macrosystem_culture: "Bronfenbrenner macrosystem — 文化 / 价值观 / 经济结构"
  - chronosystem_history: "Bronfenbrenner chronosystem — 历史时间 / 个人时间双重"
  - probabilistic_vs_predetermined: "Gottlieb probabilistic vs predetermined epigenesis — 反 preformist + 反 strict determinism"
  - canalization_developmental_pathways: "canalization 发展通路 — 有 attractor 但环境可改变"
  - dynamic_attractors_basins: "dynamic systems attractors / basins of attraction — 行为有 attractor 状态"
  - self_organization_emergence: "self-organization 自组织 + emergence 涌现 — 不是 top-down 设计"
  - variability_is_signal_not_noise: "Thelen-Smith / Fischer 变异性是发展信号不是噪音"
  - skill_reorganization_during_transitions: "Fischer 技能重组 — 看似退步是新组织的征兆"
  - holistic_pattern_analysis: "Magnusson 整体模式分析 — 多变量同时 vs 单变量孤立"
  - longitudinal_individual_pathways: "Magnusson 长期个体轨迹 — 不是人群均值"
  - autotelic_personality: "Csikszentmihalyi autotelic personality — 内在驱动型人格"
  - intentional_self_development: "Brandtstädter intentional self-development — 主动塑造自己"
  - successful_aging_SOC: "Baltes successful aging — SOC 应用到老年研究"
  - wisdom_as_developmental_outcome: "Baltes wisdom — 智慧是发展终点不是 IQ"
  - life_course_principles_5: "Elder life course 5 原则(human agency / time-place / linked lives / timing / lifespan)"
  - cohort_effects_history: "Elder cohort effects — 历史时段决定个人发展"
  - turning_points_life_course: "Elder turning points — 关键转折点重塑发展"
  - cultural_psychology_constitutive_role: "Shweder cultural psych — 文化是 constitutive 不是修饰"
  - rich_points_cross_cultural: "Shweder rich points — 跨文化最难翻译的就是最值得研究的"
  - PPCT_model_full: "Bronfenbrenner PPCT — process(近端互动)/person/context/time 4 维框架"
  - PVEST_5_components: "Spencer PVEST 5 组件 — net vulnerability / net stress / coping / identity / outcomes"
  - racism_human_development: "Spencer racism in human development — 种族主义是发展环境变量"
  - PYD_thriving_framework: "Lerner thriving framework — 5C + contribution = 6C"
  - asset_based_youth_dev: "Lerner asset-based youth dev — 资产视角取代风险视角"
  - religious_dev_stages: "Oser religious development stages — Fowler 6 阶段 / Oser 5 阶段"
  - spiritual_dev_universal: "spiritual development universal — 不限于宗教信仰"

# 立场对照(Lerner V1 元理论 vs 现有 SRC)— 元层解释流派分歧根源
relationship_to_v4_application:
  description: "Lerner V1(理论)vs Lerner V4(应用 SRC-029)— 铁四角 ↔ 元层 ↔ 实操层完整闭环"
  shared:
    - "铁四角同主编(Damon-Lerner)"
    - "都强调 ecological / contextual / dynamic 视角"
    - "都把 RCT / 实证当方法学基础"
  complement:
    - "V1 给元理论(怎么思考)— 为什么不同流派会形成不同立场"
    - "V4 给应用(怎么落地)— Head Start / NFP / Triple P 等 RCT 项目"
    - "V1 解释 V4 中干预设计为什么 frame 在 ecological 视角而不是 medical 视角"
  example:
    - "V1 Bronfenbrenner 5 层 → V4 Comer School Development(对接学校 + 家 + 社区生态)"
    - "V1 Spencer PVEST → V4 racism / poverty 干预理论根基"
    - "V1 Lerner PYD → V4 4-H / Big Brothers Big Sisters 项目根基"

relationship_to_v3_social:
  description: "Lerner V1(理论)vs Lerner V3(社会情绪 SRC-027)"
  shared:
    - "铁三角同主编"
    - "Bronfenbrenner / Vygotsky / Erikson 都是关键引用"
  complement:
    - "V1 给元理论根基 — 为什么气质 / 情绪 / 自我研究采取 dynamic 视角"
    - "V3 给具体内容 — Rothbart 气质 / Saarni 情绪 / Harter self"
  example:
    - "V1 Magnusson holistic → V3 Caspi 人格 longitudinal"
    - "V1 Bronfenbrenner 5 层 → V3 Parke 家庭社会化生态"

relationship_to_v2_cognition:
  description: "Lerner V1(理论)vs Lerner V2(认知 SRC-028)"

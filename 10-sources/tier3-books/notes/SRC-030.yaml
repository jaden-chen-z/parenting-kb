# 聚焦策略
focus_strategy:
  zh: |
    Lerner V1 17 章,全部本库可取(元理论卷无月龄性):

    主战场(每章产 5-15 张):
    - Ch 1 Lerner — Developmental Science / relational developmental systems
    - Ch 2 Overton — split vs relational metatheory ⭐⭐⭐(解释流派分歧根源)
    - Ch 5 Gottlieb — Significance of Biology / probabilistic epigenesis ⭐⭐(反基因决定论)
    - Ch 6 Thelen & Smith — Dynamic Systems Theories ⭐⭐(变异性是信号)
    - Ch 8 Magnusson & Stattin — Holistic-Interactionistic ⭐(整体人 vs 变量人)
    - Ch 11 Baltes — Lifespan Theory ⭐⭐(一辈子可塑 + SOC)
    - Ch 13 Shweder — Cultural Psychology ⭐(多元心智论)
    - Ch 14 Bronfenbrenner & Morris — Bioecological Model ⭐⭐⭐(5 系统 + PPCT)
    - Ch 15 Spencer — PVEST(racism + identity)
    - Ch 16 Lerner — Positive Youth Development ⭐(5C 框架 + 反 deficit)

    次战场(每章产 3-8 张):
    - Ch 3 Cairns — 发展心理学百年史
    - Ch 4 Valsiner — 文化-个体共建构
    - Ch 7 Fischer — Dynamic Skill Theory
    - Ch 9 Csikszentmihalyi — Flow / 最优体验
    - Ch 10 Brandtstädter — Action Theory
    - Ch 12 Elder & Shanahan — Life Course
    - Ch 17 Oser — Religious/Spiritual Development

    每章必须有覆盖 — 没卡覆盖某章是漏。
    跨章重复主题(发展观 / 决定论 / 还原论 / 涌现论)主动跨章独立卡。


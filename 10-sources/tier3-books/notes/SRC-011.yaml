# verbatim 关键内容(按章节组织,Phase 3 第三本 stub)
# 全书 5 部分 / 19 章 / 364K 中文字符
verbatim_content:
  part1_task:
    chapter: "第一部分 · 任务(第 1-2 章)"
    pages: "1-30"
    status: "已读,理论铺垫(替代弗洛伊德能量模型),不直接产卡"
    note: "理论性章节,论证为什么需要新依恋理论。"

  part2_instinctive_behavior:
    chapter: "第二部分 · 本能行为(第 3-10 章)"
    pages: "30-148"
    status: "已读,本能行为模型 + 进化适应性"
    note: "为依恋行为铺设进化生物学和动物行为学基础。"
    key_concepts:
      - "本能行为 = 行为系统(behavior system)"
      - "进化适应性环境(EEA, environment of evolutionary adaptedness)"
      - "目标校正系统(goal-corrected system)"

  part3_attachment_behavior:
    chapter: "第三部分 · 依恋行为(第 11-13 章)"
    pages: "148-217"
    status: "已读,理论核心 — 依恋是独立行为系统"
    key_concepts:
      - "依恋行为 ≠ 次级驱力(否定 Freud 食品柜-爱理论)"
      - "5 种依恋成分行为:吸吮、依附、跟随、哭泣、微笑"
      - "9-18 月时整合到目标校正系统"
      - "Hinde 灵长类研究 — 婴儿在哺乳动物中需最长时间形成依恋"
    cards_drawn:
      - C-S1-122
      - C-S1-123

  part4_human_ontogeny:
    chapter: "第四部分 · 人类依恋的个体发生(第 14-17 章)"
    pages: "217-348"
    status: "已读,这是父母最相关章节"
    key_concepts:
      - "依恋发展 4 阶段(0-12 周/12周-6月/6月-3年/3 岁后)"
      - "新生儿出生即具备的行为装备(感官 / 抓握 / 微笑 / 哭泣)"
      - "微笑发展 4 阶段(自发→社交→选择→差异)"
      - "60+ 转/分钟摇晃止哭(对应人类走路速度)"
      - "母亲信号反应度 + 互动质 = 依恋安全的关键预测因子"
      - "依恋对象可多个(主+次),非亲生母亲也可"
      - "陌生人警觉 ≠ 分离焦虑"

  part5_old_new:
    chapter: "第五部分 · 旧议题和新发现(第 18-19 章,第二版 1982 增补)"
    pages: "348-364"
    status: "已读,Ainsworth 陌生情境 + 4 类依恋"
    key_concepts:
      - "陌生情境实验(Strange Situation Test)"
      - "B 安全型(60-65%)"
      - "A 焦虑回避型(20%)"
      - "C 焦虑抗拒型(10%)"
      - "依恋模式 12-18 月间可改变"
      - "5 岁人格测量(自我控制力 / 自我复原力)与 12 月依恋分类强相关"
      - "被身体虐待儿童的混乱型依恋"


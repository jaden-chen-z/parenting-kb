# Stern 4 阶段自我感(全书核心结构)
core_theory:
  - emergent_self: "新生自我(0-2 月)— 婴儿出生即开始体验各种交互组织成形,不是没自我而是"正在形成自我""
  - core_self: "核心自我(2-6 月)— 4 个体验:self-agency(我能做)/ self-coherence(我是连贯的整体)/ self-affectivity(我有自己的感受)/ self-history(我有连续的过去)"
  - subjective_self: "主观自我(7-15 月)— 发现"我有内心,别人也有,可分享" — Stern 命名 intersubjectivity 共主体性"
  - verbal_self: "语言自我(15+ 月)— 能用词反映自己 + 也能扭曲自我(语言是双刃)"

# Stern 独有命题(vs Bowlby/Davies/Lillard)
unique_to_stern:
  - 4_senses_self_layered: "4 阶段不是 succession 而是 layered — 一旦形成永远活跃,不会被替代"
  - affective_attunement: "情感调谐 — 父母用不同感官形式(声音节奏 / 动作 / 表情强度)匹配宝宝的内心强度。Stern 独家发现 + 命名"
  - vitality_affects: "活力情感 — categorical affects(喜怒哀乐)之外的"感觉质地"(澎湃 / 渐弱 / 爆发 / 消退),最早被婴儿感知"
  - rigs: "RIGs(相互作用的概括表征)— 婴儿把重复的互动经验抽象成"一般预期",是 Bowlby 内部工作模型的具体化"
  - evoked_companion: "唤起的伙伴 — 婴儿独自时,RIG 自动激活,内化的伙伴陪着,是"自我安抚"的心理基础"
  - cross_modal_perception: "跨感官感知 — 新生儿天生就能把视觉听觉触觉信息匹配,不需后天学习"
  - amodal_perception: "无形式感知 — 抽象出强度 / 形态 / 时间结构,从一种感官转到另一种"
  - intersubjectivity_3_capacities: "共主体性 3 能力 — 共享注意 / 共享意图 / 共享情感(7-9 月起)"
  - parentese_attunement: "妈语 / 婴儿语 = attunement 工具,不只是简单语言"
  - language_double_edge: "语言出现后既能反映自我也会扭曲自我 — 词不达意是普遍人类困境"
  - self_with_self_regulating_other: "自我 + 自我调节他者 — 婴儿在他人帮助下调节自己,内化为自我调节能力"

# 立场对照(Stern vs 现有源)
controversies:
  - vs_classical_psychoanalysis:
      issue: "Mahler 共生 / 分离-个体化理论 — 婴儿初期跟妈妈"融合"再分离"
      stern_view: "婴儿出生即有 self 感,不存在初期共生融合阶段"
      strong_position: "Stern 直接挑战 Mahler 经典理论"
  - vs_freud_oral_anal_phallic:
      issue: "Freud 性发展阶段(口欲 / 肛欲 / 性器)"
      stern_view: "Self 4 阶段才是更准确的发展轴"
      compatible: "不否定 Freud 但替换"
  - vs_modern_attachment_only:
      issue: "Bowlby 依恋理论只讲关系不讲 self"
      stern_view: "Attachment 是 self 的一部分(self with self-regulating other)"
      complement: "Stern 给 Bowlby 添了 self 心理机制"
  - vs_montessori_self_construction:
      issue: "蒙氏 self-formation 是哲学命题,缺乏心理机制"
      stern_view: "4 senses of self 给蒙氏哲学添了科学心理细节"
      complement: "蒙氏 + Stern 互补:哲学 + 心理"


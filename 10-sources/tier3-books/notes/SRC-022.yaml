# Magda 7 Basic Principles 原版(Ch1) — 修正 v1.1: 原版是 7 条,Lansbury 2014 扩到 10
gerber_7_basic_principles:
  - 1. Basic trust in the child(信任孩子是 initiator / explorer / self-learner)
  - 2. Environment(物理安全 + 认知挑战 + 情感滋养)
  - 3. Time for uninterrupted play(不打断的玩)
  - 4. Freedom to explore and interact with other infants(自由探索 + 同伴互动)
  - 5. Involvement of child in all caregiving activities(护理时主动参与不被动接受)
  - 6. Sensitive observation(敏感观察)
  - 7. Consistency and clearly defined limits(一致 + 明确限度)
lansbury_extended_3_principles:
  - 8. Confident leaders + clear boundaries(自信领导 + 限度,2014 加)
  - 9. Allow problem solve(让孩子自己解决,2014 加)
  - 10. Modeling(模范是最强教育,2014 加)

# verbatim 关键引言(中英对照)
verbatim_key_quotes:
  - en: "Refrain from interfering with."
    zh: "不要去干扰。"
    author: Magda Gerber (Ch1 开篇定义"尊重")
  - en: "After all, who knows better how to be a baby than a baby?"
    zh: "毕竟,还有谁比婴儿更知道怎么做婴儿?"
    author: Magda Gerber (Ch3)
  - en: "Crying is a child's language. It is her way of communicating her needs."
    zh: "哭是孩子的语言,是她跟你沟通需求的方式。"
    author: Magda Gerber (Ch3 Crying section)
  - en: "If you tell your child not to cry you better set aside lots of money to send her to Primal Scream Therapy when she grows up."
    zh: "你叫她别哭,长大后准备一笔钱送她去原始尖叫疗法吧。"
    author: Magda Gerber (Ch3, 黑色幽默)
  - en: "Predictability rather than novelty brings security."
    zh: "可预测,而不是新奇,才带来安全感。"
    author: Magda Gerber (Ch3)
  - en: "Tantrums must run 'through' your child."
    zh: "脾气暴发必须'穿过'孩子,你拦不住。"
    author: Magda Gerber (Ch8 Antaeus 段)
  - en: "Time out of what — life?"
    zh: "Time out 出什么 — 出生命吗?"
    author: Magda Gerber (Ch8, 反 time-out 名言)
  - en: "Your child cannot be put on hold. Careers can."
    zh: "孩子不能等,事业可以。"
    author: Magda Gerber (Ch3 论母亲职业)

# 跨派对照(立场不同处)
position_contrasts:
  vs_attachment_parenting:
    - Gerber 反 Sears 派"全程抱"(Ch3 Touch 段)
    - Gerber 立场:抱要带全注意,不是越多越好(quality 优于 quantity)
  vs_distraction_school:
    - Gerber 反"用'You're okay'否认情绪"(Ch3 Crying)
    - Gerber 立场:听 + 承认 + 不替孩子定义情绪
  vs_sleep_training_extremes:
    - Gerber 反 CIO + 反"必须哄睡"(Ch3 Sleep)
    - Gerber 立场:peaceful days → peaceful nights;不主动建立哄睡习惯
  vs_chinese_traditional:
    - 中国"宝宝不懂事" → Gerber 反:出生起当人 + Tell Before You Do
    - 中国"宝宝爱哭就抱 / 转移" → Gerber 反:哭是语言,听不否认
    - 中国"高脚椅塞食物" → Gerber 反:矮桌矮椅 + 让宝宝自己定饱
    - 中国"奶嘴 / 摇晃哄睡" → Gerber 反:peaceful day → peaceful sleep
    - 中国"出门偷溜避哭" → Gerber 反:Tell + 离开是健康练习


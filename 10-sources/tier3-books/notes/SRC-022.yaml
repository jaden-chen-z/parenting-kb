# 本次特别约定
special_notes:
  - Magda Gerber 1910-2007 是 RIE 创始人,Lansbury (SRC-019) 是其弟子
  - 本书是 RIE 哲学的原始陈述,Lansbury 扩到博客 + 实操咨询
  - 30% 内容跟 Lansbury 重叠 — 优先建 Magda 独有的 30%
  - "Educaring"是 Magda 自创词,合"educator + carer",拒"caregiver / caretaker"
  - Magda 受 Pikler 1940 年代研究影响("First Pikler Babies")
  - 本卷英文名"Self-Confident Baby"翻译时不要改成"自信的婴儿"(Magda 反对"infant"贬义)
  - Antaeus 神话是 Magda 跨欧洲文化传统的人文素养体现


summary: |
  Murkoff《What to Expect the First Year》是美国孕产育儿全民参考最畅销系列。
  与流派原典互补,定位"主流大众共识对照"。覆盖 0-1 岁全段 + 妈妈第一年 + 父亲 + 多胎 + 二孩。
  在国内由南海出版公司 2014 年发行(译者莫夏迪、张敏),全新第 2 版(英文 2010)。

  核心价值:
  - 填补 P0 缺口 8 项:G6 黄疸 / G7 脐带 / G8 新筛 / G9 2 月疫苗 / G10 昼夜节律 / G11 母乳→混合 / G12 LEAP / G13 睡眠训练
  - 海蒂独家章节:父亲(中国家长稀缺指导)+ 多胎喂养 + 二孩老大反应 + 美国 FMLA 陪产假 + 居家爸爸正常化
  - 中性立场示范:包裹/共睡/奶嘴/睡眠训练 都给两派列利弊不站队
  - 美国主流大众视角:为中国家长提供"AAP 西医背书 + 大众派可执行"双重维度
  - 自我修正示例:海蒂 2010 旧版延后过敏原 vs 2014 新版接受 LEAP 早引入,展示主流共识更新轨迹

  与现有 23 源(Karp/AAP/鲍秀兰/Brazelton/Bowlby/WW/Davies/Gopnik/Lillard/Stern/Lansbury/Gerber/松田/Shonkoff/Pikler/Lerner V1-V4/WHO 等)
  形成完整对照,补足"美国主流家庭实际遵循的共识"维度。


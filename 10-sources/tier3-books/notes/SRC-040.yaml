positioning: |
  非流派原典,定位"主流共识对照"。
  与 Karp(流派)、AAP(机构)、Brazelton(临床)、Bowlby(理论)、Pikler/Davies/Lillard(蒙氏 RIE)等专题书籍互补。
  代表"普通美国家庭实际遵循的共识",在中国家庭中是少有的"美国主流大众派"权威。


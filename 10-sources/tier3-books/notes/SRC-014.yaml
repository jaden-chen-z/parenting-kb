# 蒙氏核心理论(本书覆盖)
core_principles:
  - absorbent_mind: "吸收性心智 — 0-6 岁特殊学习状态,无意识吸收环境"
  - human_tendencies: "人类倾向 — 定向 / 秩序 / 沟通 / 探索 / 解决问题 / 重复 / 抽象想象"
  - sensitive_periods: "敏感期 — 婴儿对特定能力的窗口期(动作 / 语言 / 秩序 / 小物体)"
  - observation: "观察 — 父母方法论核心,先看再回应"
  - prepared_environment: "有准备的环境 — 家是宝宝学习的'第二老师'"

# 蒙氏特色概念(本书引入)
unique_concepts:
  - symbiosis_period: "共生期 6-8 周 — 蒙氏对新生儿期的命名(类似 Karp 4 trimester)"
  - topponcino: "蒙氏小毯 — 60×30cm 椭圆衬垫,作为新生儿 point of reference"
  - yes_space: "可探索区 — 全部安全、无需说'不'的空间(借自 RIE Magda Gerber)"
  - floor_bed: "地板床 — 6 英寸厚直接放地上,代替 crib"
  - movement_mat: "动作毯 — 1 英寸厚薄垫,新生儿伸展四肢空间"
  - munari_mobile: "Munari 黑白 mobile — 0-6 周第一个视觉训练物"
  - gobbi_mobile: "Gobbi 渐变球 mobile — 1-3 月颜色辨识"

# 立场对照(蒙氏 vs 现有源)
controversies:
  - vs_aap_safe_sleep:
      issue: "Floor bed 地板床 vs AAP crib 婴儿床"
      montessori_view: "6 英寸厚床垫直接放地,允许爬出爬入,允许动作自由"
      aap_view: "推荐婴儿床(side rails),平整硬床面,无杂物,1 岁内"
      verdict: "不冲突 — Davies 在书中明确引用 AAP SIDS 指南并标注'可遵循'"
  - vs_karp_swaddle:
      issue: "Movement freedom vs Karp 5S 包裹"
      montessori_view: "不 swaddle,要让宝宝肢体自由(子宫里就在动)"
      karp_view: "包裹是安抚的核心(模拟子宫,激活 calming reflex)"
      verdict: "立场对立 — Davies '若必要可宽松包' / Karp '严格包紧'"
  - vs_baoxiulan_early_education:
      issue: "Sensitive period vs critical period(关键期)"
      montessori_view: "敏感期(sensitive)— 错过仍可学,只是不那么自然"
      baoxiulan_view: "关键期(critical)— 错过事倍功半,强调早教急迫性"
      verdict: "现代神经科学倾向 sensitive period(蒙氏)更准确"


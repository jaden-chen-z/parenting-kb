# 蒙氏核心理论(本书覆盖,比 Davies 更深)
core_theory:
  - self_formation: "自我形成 — 婴儿出生时是未完成,任务是完成自己"
  - 4_planes_development: "4 个发展阶段 — 0-6 / 6-12 / 12-18 / 18-24 岁,每个阶段有独特特征"
  - human_tendencies: "11 项人类倾向 — 探索 / 定向 / 秩序 / 抽象 / 想象 / 操作 / 精确 / 重复 / 错误控制 / 完美 / 沟通"
  - sensitive_periods: "敏感期 — 0-6 岁特殊学习窗口"
  - absorbent_mind: "吸收性心智 — 0-6 岁无意识吸收"
  - prepared_environment: "有准备的环境 — 物理 + 心理"
  - prepared_adult: "准备的大人 — 模范 + 观察者 + 引导者"
  - freedom_with_responsibility: "自由 + 责任 — 蒙氏教育公式核心"
  - hand_brain_loop: "手脑反馈环 — 不要给脑没给手过的"
  - cycle_of_activity: "循环活动 — 准备 + 做 + 收尾完整周期"
  - 4_outcomes: "4 大成果 — 协调动作 / 独立性 / 语言 / 意志"

# Lillard 独有命题(vs Davies)
unique_to_lillard:
  - sensitive_period_toilet_12_18mo: "如厕训练敏感期 12-18 月(vs 现代 2-3 岁,Lillard 反潮流)— Paula 引 1950 年代数据 92% 18 月就完成"
  - obedience_3_stages: "服从 3 阶段(12-18 / 18-36 / 3 岁+),Davies 没系统化"
  - choice_of_2_description: "意志干预法:选 2 + 描述 法(替 reasoning),Lillard 独有"
  - 4_obstacles_movement: "动作 4 大障碍 — 关在容器 / 错衣 / 替宝宝坐站 / TV 分心"
  - second_birth: "8-9 月爬 = 第二次出生 — Lillard 独有命名"
  - mother_teacher: "母-师(母亲为主)vs 师-母(老师为主)的角色平衡"
  - sitter_crawler_split: "8 月分坐型 vs 爬型(都健康)— Lillard 命名"
  - real_only_under_6: "0-6 岁只给真实(反幻想 / 卡通 / 童话玩具)— Lillard 比 Davies 更严"
  - flow_baby: "Csikszentmihalyi flow 理论应用婴儿 — Lillard 独家"
  - cloth_diaper_strong: "强烈反纸尿裤(sauna 效应掩盖湿感)— Lillard 比 Davies 立场更强"
  - weaning_table: "蒙氏断奶桌椅(6-15 月专用)— 家长面对面坐,Lillard 详细描述"
  - exterogestation: "外孕期 — 出生后到 9 月与子宫内时间相等"

# 立场对照(Lillard vs 现有源)
controversies:
  - vs_aap_back_sleep:
      issue: "AAP 仰睡导致 tummy time 不足 → 大动作发育延迟"
      lillard_view: "醒着时父母必须主动多趴(Lillard Time Line 比现代实际早几月,因为以前都趴睡)"
      compatible: "Lillard 接受 AAP 仰睡建议但提醒后果"
  - vs_modern_toilet_training:
      issue: "现代主流 2-3 岁如厕 vs Lillard 12-18 月敏感期"
      lillard_view: "1950 年代 92% 18 月完成,现代文明退步是文化原因"
      strong_position: "Lillard 立场比 Davies 更鲜明"
  - vs_modern_disposable_diapers:
      issue: "纸尿裤 vs 布尿裤"
      lillard_view: "纸尿裤 sauna 效应让宝宝感觉舒适 → 失去湿/干意识 → 错过敏感期"
      strong_position: "Lillard 立场比 Davies 更强"
  - vs_modern_happiness_focus:
      issue: "现代家长以幸福为目标 vs 蒙氏性格"
      lillard_view: "上一代要 character + discipline,今代误以为给娃幸福就好"
      lillard_quote: '限度由我们用爱教,或世界不带爱地教 — 蒙氏培训师'
  - vs_karp_swaddle:
      issue: "Karp 5S 包裹 vs 蒙氏动作自由"
      lillard_view: "跟 Davies 一致 — 限制动作就是阻止 self-formation"
  - vs_modern_high_chair:
      issue: "高脚椅 vs 蒙氏断奶桌椅 + junior chair"
      lillard_view: "高脚椅 = 关孩子在高空 / 断奶椅 = 让宝宝自己进出"


title_en: "Peaceful Babies — Contented Mothers (Pädagogische Ratschläge einer Kinderärztin)"
title_de: "Friedliche Babys – zufriedene Mütter"
title_zh: "和平的婴儿 — 满足的母亲(一位儿科医生的教育建议)"

authors:
  - name_en: "Emmi Pikler"
    name_zh: "艾米·皮克勒"
    role: "匈牙利儿科医生 + Lóczy 研究所创始人"
    background: |
      1902 维也纳生 — 1984 布达佩斯逝。儿科 + 整形外科双训练。
      1930s 起做家庭儿科医生,跟踪 100+ 家庭 30 年。
      1946 二战后接管布达佩斯 Lóczy 研究所(0-3 岁孤儿),
      把"自然大动作发展 + 不教 + 信任宝宝身体智慧"系统化为机构规程。
      女儿 Anna Tardos 继承研究所,推 Pikler 哲学到全欧洲。
      Magda Gerber(RIE 创始人)的导师 + 朋友 — 1956 Magda 移民
      美国创 RIE 之前在 Lóczy 工作多年。


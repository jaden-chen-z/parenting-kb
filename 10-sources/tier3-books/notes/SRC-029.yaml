editors:
  - name_en: "William Damon (Editor-in-Chief)"
    name_zh: "威廉·达蒙"
    role: "Handbook 总主编(全 4 卷)"
    background: |
      斯坦福大学青少年发展中心主任,道德发展研究权威,
      Handbook of Child Psychology 全 4 卷总主编(2006 第 6 版)。
  - name_en: "Richard M. Lerner (Editor-in-Chief)"
    name_zh: "理查德·勒纳"
    role: "Handbook 总主编(全 4 卷)+ 应用发展科学奠基人"
    background: |
      Tufts University 应用儿童发展研究所主任,生命周期发展心理学权威,
      Damon-Lerner 双主编模式延续到 2006 第 6 版。
      Lerner 本人是"应用发展科学"(applied developmental science)学派旗手 —
      把"研究 → 实践 → 政策"的转化作为发展心理学的第三轴。
  - name_en: "K. Ann Renninger (Volume Editor)"
    name_zh: "K. 安·雷宁格"
    role: "本卷(Vol 4)主编 + 兴趣发展研究权威"
    background: |
      Swarthmore College 心理学教授,儿童兴趣发展(interest development)
      四阶段模型奠基人,本卷统筹 24 章 + 主笔 Introduction + 与 Sigel 共同
      构建"研究 → 实践"应用发展研究框架。
  - name_en: "Irving E. Sigel (Volume Editor)"
    name_zh: "欧文·E·西格尔"
    role: "本卷(Vol 4)主编 + Educational Testing Service 资深研究员"
    background: |
      ETS 终身研究员,父母信念(parental beliefs)研究奠基人,
      "distancing strategies"(距离化策略 — 父母用提问引导孩子思考)概念创始人。
      本卷压轴 Ch 24 Research to Practice Redefined。


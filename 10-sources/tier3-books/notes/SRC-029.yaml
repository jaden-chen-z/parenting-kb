# 评级标尺(本书)
evidence_level_calibration:
  A: "Lerner V4 综述 + RCT 证据扎实 + 跨派一致(主体 ≥ 90%)— Tier 2 应用心理学百科权威"
  B: "Lerner V4 综述 + 立场分歧 / 数据有限 / 文化局限(5-10%)"
  C: "罕见 — V4 综述严谨,无委员会推断"
  expected_distribution: "A 占多数(综述权威决定 majority A 级)— 类似 V3 的 92%"

# 聚焦策略(应用层主战场)
focus_strategy:
  zh: |
    Lerner V4 24 章,3 大 Section,聚焦应用层主战场:

    主战场(每章 8-15 张,约 100+ 张):
    - Ch 1 Hyson 早期教育 — DAP / NAEYC / S0-S8 跨段
    - Ch 13 Cicchetti-Toth 发展精神病理学 — 4 原则 / 虐待 4 类型 / 韧性
    - Ch 14 Powell 家庭早期干预 — 5 原则 / NFP / Head Start / 文化敏感
    - Ch 18 McLoyd 儿童贫困 — 经济压力模型 / 育儿断层 / 非现金资源
    - Ch 20 Comstock 媒体与流行文化 — 5 效应 / iPad 时代 / 跨段
    - Ch 22 Bornstein 育儿科学 — specificity + continuity / 文化特异性
    - Ch 23 Lamb-Ahnert 托育 — quality > quantity / 父母仍主体

    次战场(每章 3-7 张,约 30-50 张):
    - Ch 2 Paris 早期阅读 — 5 要素
    - Ch 3 Snow 双语 — 不损母语
    - Ch 7 Lapsley 品格教育 — 4 支柱
    - Ch 9 Boekaerts 自我调节 — 3 层
    - Ch 10 Selman 风险预防 — 金字塔 3 级
    - Ch 13 Cicchetti(扩展)— 维兰特定病因
    - Ch 15 Kress-Elias SEL — 5 能力
    - Ch 17 Greenfield 文化路径 — 5 维度
    - Ch 21 Ramey 儿童健康 — Abecedarian 35 年
    - Ch 24 Sigel 研究到实践 — 3 大陷阱

    三战场(每章 1-3 张,约 15-25 张):
    - Ch 4 De Corte 数学 / Ch 5 Lehrer 科学 / Ch 6 Liben 空间(学龄前覆盖)
    - Ch 8 Blumenfeld 学习环境
    - Ch 11 Berninger / Ch 12 Hodapp-Dykens / Ch 16 Klingman(特殊群体)
    - Ch 19 Bruck-Ceci 法律证人(专业群体)

    每章必须有覆盖 — 没卡覆盖某章是漏。
    跨段重复主题独立卡(早期干预 / 媒体 / 父母教育 / 文化 / 贫困都跨段)。


# 备注
notes: |
  Gopnik / Meltzoff / Kuhl 三人都是顶级认知发展科学家:
  - Gopnik:UC Berkeley 心理学教授,因果学习权威
  - Meltzoff:华盛顿大学 I-LABS 联合主任,新生儿模仿研究奠基(1977 经典实验)
  - Kuhl:华盛顿大学,婴儿语言习得权威,Parentese / 知觉重组研究

  本书 1999 出版,中文家长普遍仍焦虑早教 — Gopnik 三人立场是:
  "陪伴互动 > 教学,孩子是天生研究员,你只需提供安全 + 互动"。

  并行 session 注意:本 session 用 SRC-015(跳过 SRC-014 给 Davies)。

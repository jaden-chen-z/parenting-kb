# 中文家长高频痛点 mapping
parent_pain_points:
  - 宝宝看不见 / 听不懂 — 反:出生 42 分钟就模仿 + 识母声
  - 跟宝宝说话像大人才高级 — 反:Parentese 是科学的
  - 早教班赢在起跑线 — 反:陪伴互动 > 教学,教学悖论
  - 0-3 岁不学就完了 — 反:学的是世界规律,不是知识点
  - 外语得 6 岁后学(怕影响母语)— 反:6-12 月就关闭外语音素窗口
  - 刷英文动画片学外语 — 反:被动音频无效,需真人互动


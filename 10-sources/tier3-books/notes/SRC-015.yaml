main_topics:
  - 婴儿是天生科学家(baby scientist)— 三作者核心命题
  - 三大问题:Other Minds + External World + Language
  - Meltzoff 1977 新生儿 42 分钟模仿实验(出生即模仿)
  - 婴儿天生偏好人脸 + 30cm 焦距("like me"机制)
  - 1 岁 social referencing(看妈妈脸决定要不要靠近)
  - 1 岁延迟模仿(1 周后仍记)
  - Kuhl 知觉重组(6-12 月失去外语音素辨别能力)
  - Parentese 是科学的(Kuhl 研究反驳"装弱智")
  - 物体永久性早于 Piaget 8 月说(Spelke / Baillargeon 实验)
  - 婴儿用因果推理学世界(Gopnik blicket detector)
  - 统计学习(婴儿听 2 分钟外语就抓到统计模式)
  - 教学悖论(teaching paradox)— 越主动教效果越差
  - 0-3 岁突触爆增 → 修剪(synaptic pruning)
  - 关键期窗口(Hubel-Wiesel 视觉 / Kuhl 语言)
  - 长童年期是进化优势(Bruner)
  - 反早教焦虑 — 陪伴互动 > 教学
  - "scientist in the crib + scientist is big child"

# 核心研究 / 实验
core_studies:
  - meltzoff_1977: Meltzoff & Moore 1977,新生儿(42 分钟)伸舌头/张嘴模仿,Science
  - meltzoff_2005_imitation: Meltzoff 18 月延迟模仿(forehead box 一周后仍记)
  - kuhl_1992_perceptual_narrowing: Kuhl 知觉重组(6-12 月失去外语音素辨别)
  - kuhl_2003_chinese_taipei: Kuhl 中文 vs 英文宝宝音素地图(9-12 月分化)
  - spelke_baillargeon_1985_object_permanence: 物体永久性 4 月就有(早于 Piaget 8 月说)
  - gopnik_blicket: Gopnik 因果学习实验(blicket detector)
  - bruner_immaturity: Bruner 长童年期是学习窗口


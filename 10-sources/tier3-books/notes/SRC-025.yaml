# NRC 综述独有命题(本书 vs 现库 15 派对照)
shonkoff_unique_themes:
  - science_to_policy_bridge: "把发展科学翻译成公共政策语言 — NRC 综述权威 vs 单一作者派"
  - both_nature_and_nurture: '基因 + 经验交互论(epigenetics 早期版本)— 反"先天 vs 后天"二元对立'
  - critical_vs_sensitive_periods: "区分 critical(完全错过)vs sensitive(最佳窗口可补)— 比 Gopnik 更精细"
  - self_regulation_central: "自我调节是 0-5 岁核心发展任务 — Ch 5 整章给出框架"
  - hart_risley_30M: "Hart-Risley 1995 词汇差距研究 — 30M words 鸿沟概念被 Shonkoff 综述放大"
  - cortisol_hpa_axis: "皮质醇 + HPA 轴应激反应 — NRC 综述给出生理底座"
  - early_intervention_RCTs: "Perry / Abecedarian / 早期 Head Start RCT 证据 — Ch 13 系统综述"
  - high_quality_child_care_protective: "Quality > Quantity 立场 — NICHD ECCS 数据综合"
  - neighborhood_effects: "社区/贫困/暴力对发展的非家庭影响 — Ch 12"
  - culture_as_developmental_context: '文化是发展环境不只是修饰 — 反"普世发展时间表"'
  - causal_inference_standards: "因果推理在儿童研究中的方法论(对照随机化 vs 自然实验)— Ch 4"
  - parental_employment_complex: '父母就业对孩子影响是混合的 — 反"全职妈妈 vs 职场妈妈"二元论'
  - 6_core_principles: "6 条核心原则(Ch 14):全人 / 时机 / 自主能动 / 文化 / 关系 / 多重适应"


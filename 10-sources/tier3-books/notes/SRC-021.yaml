# Magda 7 大基本原则(Ch1 原版,vs Lansbury 扩展 10)
gerber_7_basic_principles:
  - 1. Basic trust(基本信任 — 信任宝宝是 initiator/explorer/self-learner)
  - 2. Environment(环境:身体安全 + 认知挑战 + 情绪滋养 三位一体)
  - 3. Time for uninterrupted play(自主玩耍时间)
  - 4. Freedom to explore + interact with other infants(自由探索 + 同伴互动)
  - 5. Active participant in caregiving(护理时主动参与,不是被动接受)
  - 6. Sensitive observation(细致观察)
  - 7. Consistency + clearly defined limits(一致性 + 清晰限度)
lansbury_extended_3_principles:
  - 8. Confident leaders + clear boundaries
  - 9. Allow problem solve(让孩子自己解决)
  - 10. Modeling(模范)

# Magda 8 条好父母品质矛盾对子(Ch4 §The Qualities of a Good Parent)
gerber_8_parent_qualities:
  - 1. Feel secure but don't become rigid(安心但不僵硬)
  - 2. Be accepting but set limits(接纳但设限)
  - 3. Be available but not intrusive(在但不侵入)
  - 4. Be patient but be true to yourself(耐心但忠于自己)
  - 5. Be realistic but consistent(实际但一致)
  - 6. Have wisdom to resist new fads(智慧抗潮流)
  - 7. Balance quality time for child + self(平衡)
  - 8. Self-respect = equal respect for child(自尊 = 同等尊重)

# verbatim 关键引言(中英对照)
verbatim_key_quotes:
  - en: "If you treat your child respectfully from birth, he may have a better chance of gaining confidence and developing good judgment. This plants the seeds of lifelong security."
    zh: "从出生起你尊重孩子,他更可能长出信心和判断力。这是终生安全感的种子。"
    author: Magda Gerber (Introduction)
  - en: "Hands constitute the infant's first connection to the world. The hands are the person, the world."
    zh: "手是婴儿跟世界的第一道连接。手就是人,就是世界。"
    author: Emmi Pikler (via Gerber Ch3)
  - en: "Tell me and I'll forget. Show me and I'll probably not remember. Involve me and I'll understand."
    zh: "告诉我,我会忘。给我看,我可能不记得。让我参与,我才懂。"
    author: Native American (via Gerber Ch3 Quality Time)
  - en: "Every time we teach a child something, we keep him from inventing it himself."
    zh: "每次我们教孩子一件事,就剥夺了他自己发现的机会。"
    author: Jean Piaget (via Gerber Ch2 DIP)
  - en: "Wait."
    zh: "等。"
    author: Magda Gerber (Ch4 §Take Your Time — "我那个有名的四字诀")
  - en: "Lack of discipline is not kindness, it is neglect."
    zh: "没有限度不是仁慈,是失职。"
    author: Magda Gerber (Ch8)
  - en: "Time out of what — time out of life?"
    zh: "Time out 出什么 — 出生命吗?"
    author: Magda Gerber (Ch8)
  - en: "I want these two people to be my parents."
    zh: "(匈牙利谚语)宝宝出生前从云上往下看,说:我想要这两个人当我的父母。"
    author: Hungarian saying (via Gerber Ch8 §You Don't Have to Be Perfect)

# 跨派对照(立场不同处)
position_contrasts:
  vs_attachment_parenting_sears:
    - Magda 反 Sears 派"几乎全程抱"
    - Magda 立场:婴儿不是 helpless,需要"独立空间"(Geralynn 3 周起放 playpen 独玩 30 分钟)
  vs_distraction_school:
    - Magda 反"哄停 / 转移"派
    - Magda 立场:哭是语言,Don't say "Don't cry" 也不要分散
  vs_sleep_training_extremes:
    - Magda 反 CIO(放任哭),也反"训练睡"标签
    - Magda 立场:帮孩子形成 sleeping habit(渐进 + 在场最少介入)
  vs_chinese_traditional:
    - 中国"宝宝小不懂事" → Magda 反:出生起当人对待,真声音不娃娃语
    - 中国"硬塞最后一口" → Magda 反:小份 + 信宝宝 + 不强迫
    - 中国"哭就抱+转移" → Magda 反:Listen,不"分散"
    - 中国"高脚椅看世界" → Magda 反:小桌小凳,小人视角
    - 中国"打了就长记性" → Magda 反:打孩子学到打人是 OK 的
    - 中国"如厕训练 3 天速成" → Magda 反:Trust + Wait,98% 4 岁前学会
  vs_baby_industry:
    - Magda 反 swings/walkers/bouncers/pacifiers/baby slings/baby videos
    - Magda 立场:7 类设备让宝宝"zombied out",剥夺自主动作


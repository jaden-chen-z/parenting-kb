# 用户指示(2026-05-03):聚焦中国家长高频痛点,跳过极端家庭情境
focus_strategy: |
  保留(中国家庭高频):
  - 亲人去世(爷奶 / 同辈 / 宠物)
  - 暂时分离的丧失(住院 / 出差 / 二宝引发"失去关注")
  - 跟孩子谈死亡(中国家庭忌讳)
  - 健康哀伤 vs 病理性识别
  - Bowlby 4 阶段哀伤理论
  - 2-4 岁儿童哀伤反应实操(Ch23-25 金矿)
  - 月嫂 / 阿姨 / 主依恋人替换
  - 玩具 / 宠物 / 物品丧失
  跳过:
  - Ch22 父母自杀
  - Ch4/13/20 防御 / 认知 / 失活偏理论
  - Ch9/17/21 失调变式中的极端案例(虐待 / 寄宿 / 精神病院 / 离异)
  - Ch11 哀悼失调的人格类型
  - Ch19 父母离异 / 寄养 / 战时孤儿院

# 评级标尺(本卷)
evidence_level_rubric: |
  A = 与 Tier 1 共识对齐 OR Bowlby + 多研究者 + 50 年验证(罕见,1980 年理论)
  B = Bowlby 引用具体研究(Heinicke / Robertson / Bowlby & Murray-Parkes / Anna Freud / Furman 等)— 大多数
  C = Bowlby 个人理论推断(罕见使用)
  预计 B 占主导(约 75%),A 占 ~15%(健康哀伤 4 阶段 / 跟孩子谈死亡这类有 Tier 1 共识),C ~10%


    - source_id: SRC-002
      verbatim_quote: |
        "When an infant or young child babbles, gestures, or cries, and an adult responds with
        eye contact, words, or a hug, this back-and-forth interaction—known as serve and return—
        helps to build and strengthen neural connections in the child's brain."
        "Naming what a young child is seeing, doing, or feeling helps make important language
        connections, even before they can talk or understand words."

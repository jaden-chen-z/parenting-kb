# 流派立场
schools:
  Universal: 全部主流流派接受这个机制
  RIE: 兼容(强调"真实自然",反对表演式互动)
  Pikler: 兼容(强调 responsive caregiving)
  Montessori: 兼容("absorbent mind"概念与之对应)
  Brazelton: 兼容(Touchpoints 强调 cue reading)

# 关联节点(Phase 1 创建后回填实际 ID)

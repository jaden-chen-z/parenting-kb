# 落地动作 —— ⚠️ 占位,待 5 Steps PDF 抓取后用 verbatim 替换
actions:
  - 注意"发球":看她在看什么 / 听她在发什么音
  - 回球:用眼神 / 表情 / 声音 / 动作回应
  - 命名:把她注意到的东西 / 动作 / 情绪用词说出来
  - 来回 + 等待:给她回球的时间
  - 觉察结束信号:她转头 / 打哈欠就停
  # 注:上述基于 SR 概念的二手概述,Phase 1 拿到 PDF 后必须 verbatim 替换 → gaps.md G2

# 失败模式 —— 全部 verbatim 自 SRC-002
failure_modes:
  - inconsistent_response: |
      "When an adult's responses to a child are inconsistent, harmful, or simply absent,
      developing brain architecture may be disrupted, potentially leading to long-term impacts
      on health and well-being."
  - persistent_absence: |
      "The persistent absence of serve and return interactions not only deprives the brain of
      the positive stimulation it needs but also activates the body's toxic stress response,
      which can flood the developing brain with harmful stress hormones."
  - 系统性诱因(非父母个体过失): 财务压力、社会孤立、慢性疾病、政策性歧视、气候压力

# 测量指标
metrics:
  6 月内: 宝宝 babble 之后照护者回应延迟 < 3 秒的比例
  9 月内: 共同注意(joint attention) 发生频次/小时
  12 月内: 命名词的接收性词汇量

# 冲突 / 争议
conflicts:
  - 暂无主流流派反对此机制
  - 待 Phase 1 处理:东亚文化"含蓄回应" vs 西方"显性回应"的跨文化讨论(可能写入 conflicts.md)

# 应用注解
application_notes: |
  跨段机制,任何 stage 都适用。
  落地动作 v0.1 是占位,Phase 1 必须用 5 Steps PDF verbatim 替换。
  RIE / Pikler 两派的"真实自然 vs 表演式互动"区分,是落地时的关键 caveat。

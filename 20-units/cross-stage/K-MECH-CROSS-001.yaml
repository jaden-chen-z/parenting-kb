# 核心论点
core_claims:
  - 婴幼儿发出"球"(咿呀、手势、哭闹)后,成人用眼神/语言/拥抱"回球",这种来回互动构建脑神经连接
  - 给孩子正在看/做/感受的事命名,是建立语言通路的关键,即使在他们能说话或理解词语之前
  - 持续缺位的 serve and return 不仅剥夺刺激,还激活 toxic stress 通路,损伤发育中脑结构
  - 系统性诱因(财务压力、社会孤立、慢性疾病、政策性歧视、气候压力)是个体能力之外的限制 —— 卡片设计要避免"父母失败"叙事

# 来源
sources:
